// 行内提示（替代 alert；与结果区风格一致，可被下次输出自然覆盖）
function inlineMsg(elId, msg, isErr = true) {
  const el = $(elId);
  if (!el) return;
  el.innerHTML = `<p style="font:400 12px var(--sans);color:${isErr ? '#da1e28' : 'var(--t3)'};margin:4px 0">${esc(msg)}</p>`;
}

/* ---- Wireshark JSON 导入 UI ---- */
function nasWsImport(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => nasWsRender(String(rd.result), f.name);
  rd.readAsText(f);
}

function nasWsRender(jsonText, filename) {
  const info = $('nasWsInfo');
  const box = $('nasWsRows');
  let frames;
  try {
    frames = wsFrames(jsonText);
  } catch (e) {
    info.textContent = '';
    box.innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`;
    return;
  }
  const hits = [];
  let candN = 0;
  for (const fr of frames) {
    for (const c of wsNasCandidates(fr.layers)) {
      candN++;
      const bytes = wsHexToBytes(c.hex);
      const m = wsMatchSchema(nasState.schemas, bytes, { decSec });
      if (m) hits.push({ frame: fr.idx, path: c.path, hex: c.hex, bytes, m });
    }
  }
  nasState._ws = { filename, frames: frames.length, candN, hits };
  info.textContent = `${filename}：${frames.length} 帧 / ${candN} NAS PDU / ${hits.length} 命中已入库 schema`;
  if (!hits.length) {
    box.innerHTML = `<p class="dim" style="font:400 12px var(--sans)">${candN ? '候选均未命中已入库 schema——先在「Spec 摄入」导入对应版本。' : '未找到 NAS PDU 字段（键名含 nas_pdu）——确认导出含 NAS 层。'}</p>`;
    return;
  }
  box.innerHTML = hits.map((h, i) => {
    const b = h.m.best;
    const label = [`${b.spec} ${b.ver}`, b.namesSecure[0] || b.names[0] || '?', b.secInfo ? `SHT=${b.secInfo.sht} seq=${b.secInfo.seq}` : 'plain']
      .filter(Boolean).join(' · ');
    return `<div style="display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd-faint)">
      <span style="font:400 11px var(--mono);color:var(--ink3);width:52px;flex-shrink:0">#${h.frame}</span>
      <span style="font:400 12px var(--sans);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(h.path)}">${esc(label)}</span>
      <span class="dim" style="font:10.5px var(--mono)">${h.bytes.length}B</span>
      <button class="btn sm" data-ws="${i}">→解码</button></div>`;
  }).join('');
  box.querySelectorAll('[data-ws]').forEach((btn) => btn.addEventListener('click', () => {
    const h = hits[parseInt(btn.dataset.ws, 10)];
    const b = h.m.best;
    nasState.spec = b.spec;
    nasState.ver = b.ver;
    nasRefreshSelectors();
    $('nasHexIn').value = h.hex.replace(/[^0-9a-fA-F]/g, '');
    if (b.secInfo) nasSecDecode();
    else nasDecode();
    goto('nas');
  }));
}

/* ---- 安全保护帧 UI ---- */
function nasSecDecode() {
  const schema = nasCur();
  const hexIn = ($('nasHexIn').value || '').replace(/[^0-9a-fA-F]/g, '');
  const host = $('nasSecOut');
  if (!schema) { inlineMsg('nasSecOut', '先导入 schema（「Spec 摄入」或本页「导入 schema JSON」）。'); return; }
  if (!hexIn) { inlineMsg('nasSecOut', '先在「解码」卡粘贴安全帧 hex。'); return; }
  try {
    const d = decSec(schema, OCT(hexIn), nasState.spec);
    nasState.secFrame = d;
    const rowsHtml = d.inner ? d.inner.parts.map((p) => `<tr><td style="padding:2px 6px 2px 0;color:var(--t4)">${esc(p.row.name)}</td><td>${
      p.value == null ? '—' : typeof p.value === 'number' ? `0x${p.value.toString(16)}` : Array.from(p.value).map((b) => b.toString(16).padStart(2, '0')).join('')
    }</td></tr>`).join('') : '';
    host.innerHTML = `
      <div style="font:400 12px/1.7 var(--sans)">
        ${secSummary(d).map((l) => `<div>${esc(l)}</div>`).join('')}
        ${d.inner ? `<table style="margin-top:6px;font:11.5px var(--mono);border-collapse:collapse"><tr style="color:var(--t4)"><th style="text-align:left;padding:2px 6px 2px 0">IE</th><th style="text-align:left;padding:2px">值</th></tr>${rowsHtml}</table>` : (d.payload.length ? `<div style="margin-top:4px">载荷 hex：<span style="font:11.5px var(--mono)">${Array.from(d.payload).map((b) => b.toString(16).padStart(2, '0')).join('')}</span></div>` : '')}
      </div>`;
  } catch (e) {
    host.innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`;
  }
}

function nasSecEncode() {
  let plainHex = ($('nasHexOut').textContent || '').replace(/[^0-9a-fA-F]/g, '');
  const host = $('nasSecOut');
  // 当前输出已是安全帧 → 取其明文载荷重封（避免帧套帧）
  const isFrame = nasState.spec === '24501' ? /^7e0[1-4]/i.test(plainHex) : /^[1-4]7/i.test(plainHex);
  if (isFrame) {
    try {
      const d = decSec(nasCur() || { messages: {} }, OCT(plainHex), nasState.spec);
      if (!d.readable) { host.innerHTML = '<p style="font:400 12px var(--sans);color:#da1e28">当前输出是加密载荷的安全帧——先「解密载荷→写回解码」拿到明文再封装。</p>'; return; }
      plainHex = Array.from(d.payload, (b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { host.innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`; return; }
  }
  if (!plainHex) { inlineMsg('nasSecOut', '先在左侧编码出明文 NAS 消息（或随机采样）。'); return; }
  const sht = parseInt($('nasSecSht').value, 10);
  if ((sht === 2 || sht === 4) && !nasState.secKeys) { inlineMsg('nasSecOut', 'SHT=2/4 加密封装需先派生 K_NAS 密钥（父密钥 → 派生）。'); return; }
  try {
    const seq = parseInt($('nasSecSeq').value, 10) || 0;
    const ovf = parseInt(($('nasSecOvf').value || '0').replace(/[^0-9a-fA-F]/g, ''), 16) || 0;
    const count24 = ((ovf & 0xffff) << 8) | seq;
    const dir = parseInt($('nasSecDir').value, 10);
    const bearer = parseInt($('nasSecBearer').value, 10);
    const { frame, mac, payload, ciphered } = encSecProtected(nasCur() || { messages: {} }, OCT(plainHex), {
      sht, seq, count24, dir, bearer, keys: nasState.secKeys, mac: $('nasSecMac').value,
    }, nasState.spec);
    const hx = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
    $('nasSecMac').value = hx(mac);
    const hexF = hx(frame);
    $('nasHexOut').textContent = hexF;
    $('nasHexIn').value = hexF;
    host.innerHTML = ciphered
      ? `<p style="font:400 12px var(--sans);color:#198038">已按 EEA${nasState.secKeys.algEnc} 加密 ${payload.length} 字节封装 SHT=${sht} 帧（MAC 覆盖密文：<span style="font:11.5px var(--mono)">${hx(mac)}</span>）写入编码输出/解码输入——「校验左侧帧 MAC」或「解密载荷→写回解码」可回验。</p>`
      : `<p style="font:400 12px var(--sans);color:#198038">已封装 SHT=${sht} 帧（载荷 ${payload.length} 字节明文，MAC ${nasState.secKeys ? '自动计算' : '透明域手填'}：<span style="font:11.5px var(--mono)">${hx(mac)}</span>）——「解安全帧」可回验。</p>`;
  } catch (e) {
    host.innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`;
  }
}

/* ============ 会话持久化（localStorage；仅存本机浏览器，不出域） ============
 * 两个库自动持久化：NAS schema 库（nasState.schemas，键 'spec ver'）与 ASN.1 规范库
 * （存 .asn 原文，重启重解析回填 registry——模块对象不可靠，文本是权威）。
 * 配额超限/隐私模式静默降级为会话内可用（v1.7 前行为），规范库页有管理卡。 */
const LS_PREFIX = 'rrcwb.';
function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(LS_PREFIX + key);
    return v == null ? fallback : JSON.parse(v);
  } catch { return fallback; }
}
function lsSet(key, val) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(val));
    return true;
  } catch { return false; } // 配额超限 / 隐私模式
}

function persistNasSchemas() {
  if (!lsSet('nasSchemas', nasState.schemas)) console.warn('rrc-workbench: NAS schema 库持久化失败（localStorage 配额？）——本会话内仍可用');
}
function persistAsnLibAdd(label, text) {
  const lib = lsGet('asnLib', []);
  const name = (label || '').trim();
  const hit = lib.find((x) => x.label === name);
  if (hit) hit.text = text;
  else lib.push({ label: name, text });
  if (!lsSet('asnLib', lib)) console.warn('rrc-workbench: ASN.1 库持久化失败（配额？）——本会话内仍可用');
}
function persistAsnLibRemove(label) {
  lsSet('asnLib', lsGet('asnLib', []).filter((x) => x.label !== label));
}
function asnLibList() { return lsGet('asnLib', []); }

// 启动恢复：NAS schema 直接回填；ASN.1 重放原文解析（错误库条目跳过不阻塞）。
// 返回 {nas, asnMods} 供管理卡显示。
function restorePersisted() {
  let nNas = 0;
  const saved = lsGet('nasSchemas', null);
  if (saved && typeof saved === 'object') {
    for (const [k, s] of Object.entries(saved)) {
      if (s && s.messages && s.spec && s.version) { nasState.schemas[k] = s; nNas++; }
    }
  }
  if (nNas) nasRefreshSelectors();
  let nMods = 0;
  for (const it of asnLibList()) {
    try {
      const parsed = parseAsn1File(it.text, { provenance: 'user-imported', spec: it.label || '' }, registry);
      if (!parsed.errors.length) nMods += parsed.modules.length;
    } catch { /* 损坏条目跳过 */ }
  }
  if (nMods) { refreshMessages(); renderEncodePage(); renderComparePage(); renderLibraryPage(); }
  if (nNas || nMods) console.info(`rrc-workbench: 已从本机恢复 ${nNas} 个 NAS schema / ${nMods} 个 ASN.1 模块`);
}

// 管理卡（规范库页）：已保存的 NAS schema 与 ASN.1 版本，删除 / 导出备份 / 导入恢复
function renderPersistCard() {
  const nasKeys = Object.keys(nasState.schemas);
  const lib = asnLibList();
  const kb = (s) => `${Math.max(1, Math.round(JSON.stringify(s).length / 1024))} KB`;
  const rows = [
    ...nasKeys.map((k) => ({ kind: 'nas', key: k, label: k, size: kb(nasState.schemas[k]) })),
    ...lib.map((x) => ({ kind: 'asn', key: x.label, label: x.label || '(未命名版本)', size: kb(x.text) })),
  ];
  const head = `<div class="card" style="margin-bottom:16px"><div class="card-h">本机保存库（localStorage · 刷新/重启自动恢复 · 不上传）</div><div class="card-b" style="padding:0">`;
  if (!rows.length) return `${head}<p style="padding:12px 16px;font:400 12px var(--sans);color:var(--t3)">空——NAS 页导入 schema、本页载入 .asn 版本后会自动保存在本机浏览器。</p></div></div>`;
  return `${head}
    <table class="libtable">
      <tr><th>类型</th><th>条目</th><th>大小</th><th></th></tr>
      ${rows.map((r) => `<tr><td>${r.kind === 'nas' ? 'NAS schema' : 'ASN.1 版本'}</td><td style="font-family:var(--mono)">${esc(r.label)}</td><td style="color:var(--t3)">${r.size}</td><td><button class="btn sm" data-persistdel="${r.kind}:${esc(r.key)}">移除</button></td></tr>`).join('')}
    </table>
    <div style="display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap">
      <button class="btn sm" id="persistExport">导出备份 (.json)</button>
      <label class="btn sm" style="cursor:pointer">导入备份<input type="file" id="persistImport" accept=".json" style="display:none"></label>
      <span id="persistMsg" style="font:400 12px var(--sans);color:var(--t3)"></span>
    </div>
  </div></div>`;
}

function wirePersistCard() {
  const host = $('page-library');
  host.querySelectorAll('[data-persistdel]').forEach((b) => b.addEventListener('click', () => {
    const [kind, ...rest] = b.dataset.persistdel.split(':');
    const key = rest.join(':');
    if (kind === 'nas') { delete nasState.schemas[key]; persistNasSchemas(); nasRefreshSelectors(); }
    else { persistAsnLibRemove(key); }
    renderLibraryPage();
  }));
  const ex = $('persistExport');
  if (ex) ex.addEventListener('click', () => {
    ingestDownload(`rrc-workbench-library-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'rrc-workbench', savedAt: new Date().toISOString(), nasSchemas: nasState.schemas, asnLib: asnLibList() }, null, 1), 'application/json');
  });
  const im = $('persistImport');
  if (im) im.addEventListener('change', (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        let nNas = 0, nAsn = 0;
        if (d.nasSchemas && typeof d.nasSchemas === 'object') {
          for (const [k, s] of Object.entries(d.nasSchemas)) {
            if (s && s.messages && s.spec && s.version) { nasState.schemas[k] = s; nNas++; }
          }
          persistNasSchemas();
        }
        if (Array.isArray(d.asnLib)) {
          const lib = asnLibList();
          for (const x of d.asnLib) {
            if (x && typeof x.text === 'string') {
              const hit = lib.find((y) => y.label === x.label);
              if (hit) hit.text = x.text; else lib.push({ label: x.label || '', text: x.text });
              nAsn++;
            }
          }
          lsSet('asnLib', lib);
        }
        if (!nNas && !nAsn) { $('persistMsg').textContent = '备份里没有可恢复的条目'; return; }
        // 重放 ASN.1 新条目
        for (const it of asnLibList()) {
          try {
            const parsed = parseAsn1File(it.text, { provenance: 'user-imported', spec: it.label || '' }, registry);
            if (parsed.errors.length) throw new Error(parsed.errors[0]);
          } catch { /* 损坏条目跳过 */ }
        }
        refreshMessages(); renderEncodePage(); renderComparePage();
        nasRefreshSelectors();
        renderLibraryPage();
      } catch (e) { $('persistMsg').textContent = '备份恢复失败: ' + e.message; }
    };
    rd.readAsText(f);
  });
}
