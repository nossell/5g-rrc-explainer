      if (nm && !refInName && !/^TS\b/i.test(nm) && !(prev.name || '').toLowerCase().includes(nm.toLowerCase())) {
        prev.name = `${(prev.name || '').trim()} ${nm}`.replace(/\s+/g, ' ');
      }
      const ref = r.ref || refInName;
      if (ref && !prev.def && !prev.ref) {
        prev.ref = ref;
        prev.def = structured.bits.find((b) => b.section === ref) ? ref : null;
      }
      continue;
    }
    merged.push({ ...r });
  }
  // IE 名去协议组前缀行（'Mobility management\nProtocol discriminator' → 取末行）
  for (const r of merged) {
    if (r.name && r.name.includes('\n')) {
      const lines = r.name.split('\n').map((s) => s.trim()).filter(Boolean);
      if (lines.length > 1) r.name = lines[lines.length - 1];
    }
    // def 解析：精确节号 → 字母后缀变体回退基表（'10.5.7.4a' GPRS Timer 3 值域格式
    // 与 10.5.7.4 同族，语义展示用）；名称尾带节号的（'… 10.5.5.15a'）拆出。
    if (!r.ref) {
      const sm = /^(.*?)\s+(\d+(?:\.\d+)+[A-Za-z]?)$/.exec((r.name || '').trim());
      if (sm) { r.name = sm[1].trim(); r.ref = sm[2]; }
    }
    if (r.ref && !r.def) {
      r.def = structured.bits.find((b) => b.section === r.ref)
        ? r.ref
        : structured.bits.find((b) => b.section === r.ref.replace(/[A-Za-z]$/, ''))
          ? r.ref.replace(/[A-Za-z]$/, '')
          : null;
      // 子节号前缀回退：IE 定义拆多幅图时消息行只引基节号（44.018 10.5.2.13 → 10.5.2.13.2…）
      if (!r.def) {
        const sub = structured.bits.find((b) => b.section && b.section.startsWith(`${r.ref}.`));
        if (sub) r.def = sub.section;
      }
    }
  }
  return merged;
}

function buildSchema24008(structured, opts = {}) {
  const msgTypes = parseTypeTables24008(structured.typeTables);
  const domNames = {};
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const d = DOM24008.find(([p]) => (m.section || '').startsWith(p));
    if (d) (domNames[d[1]] = domNames[d[1]] || new Set()).add(m.name.toLowerCase());
  }
  const tableOf = {};
  for (const t of structured.typeTables || []) {
    const map = parseTypeTables24008([t]);
    const scored = DOM24008.map(([, d]) => [d, Object.keys(map).filter((k) => domNames[d]?.has(k)).length])
      .sort((a, b) => b[1] - a[1]);
    if (scored[0][1] > 0 && scored[0][1] > scored[1][1]) {
      tableOf[scored[0][0]] = { ...(tableOf[scored[0][0]] || {}), ...map }; // 同域多表合并（MO/MT 同名同值）
    }
  }
  const ies = buildIes(structured.bits, structured.valueTables);
  mergeCsn1IntoIes(ies, buildCsn1Descriptors(structured.csn1, structured.sections), structured.sections);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows(structured, m.rows);
    const pd = PD24008[Object.keys(PD24008).find((k) => (m.section || '').startsWith(k))] ?? null;
    const dom = DOM24008.find(([p]) => (m.section || '').startsWith(p));
    const domMap = (dom && tableOf[dom[1]]) || null;
    const t = (domMap && resolveMsgType24008(m.name, domMap, m.direction))
      || resolveMsgType24008(m.name, msgTypes, m.direction);
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd,
      rows: merged,
    };
    if (t) {
      inst.msgType = t.type;
      inst.msgMask = t.mask;
    } else {
      inst.msgType = null;
      problems.push(`${m.section} ${m.name}: 无消息类型值`);
    }
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  const filled = fillSee24301(ies, out, opts.fill24301);
  return {
    schema: { spec: '24008', version: structured.version, msgTypes, ies, messages: out },
    problems,
    filled,
  };
}

// ---- 29.274（GTPv2-C）建库 ----------------------------------------------------------
// 框架语义（29.274 §5.1/§8.2.1 原文锚点）：GTPv2-C 头 = [flags: V3|P|T|spare3][Message
// Type(1)][Message Length(2)][TEID(4) 若 T=1][Seq(3)][Spare(1)]；Message Length = 头前 4
// 八位组之外的全部字节数（TEID/Seq/Spare 计入，§5.1 原文）。IE 一律 TLIV（§8.2.1 "all of
// them shall be TLIV"）：Type(1)+Length(2, 不含 IE 自身前 4 八位组)+octet4(Spare|Instance)
// +content；分组 IE 值 = 子 TLIV 串（§6.1.2）。消息类型值 §6.1-1（十进制，'N to M' 区间
// Reserved 跳过）；IE 类型值/长度类别/定长 §8.1-1（'Variable Length / 8.6' 反查位表节号）；
// 消息表 5 列（Information elements|P|Condition / Comment|IE Type|Ins.）——行身份 =
// (IE Type, Instance)，Ins. 'VS'/空 = 实例通配（§6.1.3 vendor-specific）。
const GTP_KEY = (s) => String(s || '').toLowerCase().replace(/note\s*\d+/gi, '').replace(/[^a-z0-9]/g, '');

function gtpIeNameKeys(name) {
  const keys = new Set([GTP_KEY(name)]);
  const noParen = String(name || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  keys.add(GTP_KEY(noParen));
  // 斜杠别名（29.244 'APN/DNN' ↔ 消息表 'DNN' 实证）
  for (const part of noParen.split('/')) if (part.trim()) keys.add(GTP_KEY(part));
  for (const m of String(name || '').matchAll(/\(([^)]+)\)/g)) keys.add(GTP_KEY(m[1]));
  // 首字母缩写键（§8.1 名称无括号缩写、消息表用缩写的形态——'Trusted WLAN Mode Indication'↔TWMI 实证）
  const words = noParen.split(/\s+/).filter((w) => /^[A-Za-z]/.test(w));
  if (words.length >= 2) keys.add(GTP_KEY(words.map((w) => w[0]).join('')));
  return [...keys].filter(Boolean);
}

// 编辑距离（≤2 截断，小表无性能压力）
function gtpLev(a, b, max = 2) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const prev = new Array(b.length + 1);
  const cur = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    cur[0] = i;
    let rowMax = cur[0];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      rowMax = Math.min(rowMax, cur[j]);
    }
    if (rowMax > max) return max + 1;
    for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

// 拼写容差（规范笔误：§8.1 'Local Distiguished Name' 漏 i，消息表拼对——实证）：
// 只看 ≥6 字符的全称键——缩写/首字母键在编辑距离 2 下互相碰撞（'ldn'↔'apn'/'sn'/'pn'
// 十余个 3 字母键全命中，歧义即全灭——实证），缩写只进精确 keyMap。候选唯一才接受。
function gtpFuzzyEntry(typeCell, entries) {
  const keys = gtpIeNameKeys(typeCell).filter((k) => k.length >= 6);
  let hit = null;
  for (const e of entries) {
    for (const k of gtpIeNameKeys(e.name)) {
      if (k.length < 6) continue;
      for (const q of keys) {
        if (gtpLev(q, k) <= 2) {
          if (hit && hit !== e) return null;
          hit = e;
        }
      }
    }
  }
  return hit;
}

function parseGtpMsgTypes(rows) {
  const out = {};
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    const name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim(); // 格内换行=接口方向注释（'Modify Bearer Command\n(MME/SGSN…)'）
    if (!name || !/^\d+$/.test(first) || /^reserved/i.test(name)) continue;
    out[GTP_KEY(name)] = { type: parseInt(first, 10), mask: 0xff, name };
  }
  return out;
}

function parseGtpIeTypes(rows) {
  const entries = [];
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    const name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim();
    const refCell = (cells[2] || '').trim();
    const fixed = (cells[3] || '').trim();
    if (!name || !/^\d+$/.test(first) || /^reserved|^spare/i.test(name)) continue;
    const rm = /((?:Fixed|Variable)\s+Length|Extendable)\s*\/\s*(8\.\d+[a-z]?)/i.exec(refCell); // 'Extendable / 8.28' 无 Length 单词
    entries.push({
      value: parseInt(first, 10),
      name,
      ref: rm ? rm[2] : null,
      kind: rm ? rm[1].toLowerCase() : null,
      fixed: /^\d+$/.test(fixed) ? parseInt(fixed, 10) : null,
    });
  }
  const keyMap = new Map();
  for (const e of entries) for (const k of gtpIeNameKeys(e.name)) if (!keyMap.has(k)) keyMap.set(k, e);
  return { entries, keyMap };
}

function gtpTranslateRows(rows, ctx, problems) {
  const out = [];
  for (const cells of rows || []) {
    const name = (cells[0] || '').replace(/\s+/g, ' ').trim();
    const pres = (cells[1] || '').trim();
    const cond = (cells[2] || '').replace(/\s+/g, ' ').trim();
    const typeCell = (cells[3] || '').trim();
    const insCell = (cells[4] || '').trim();
    if (!typeCell || /^note\b/i.test(typeCell)) continue; // 条件续行 / NOTE 行
    const typeClean = typeCell.replace(/\(\s*see\s+note[^)]*\)/ig, '').replace(/\s+/g, ' ').trim(); // 'IP Address\n(See NOTE 2)' 格内注记后缀
    if (!typeClean || /^note\b/i.test(typeClean)) continue;
    let e = ctx.keyMap.get(GTP_KEY(typeClean));
    // 长名前缀别名（29.244：'Node level Mitigation Actions Information' ↔ 类型表
    // 'Node Level Mitigation Actions Rules'——前 4 词相同、末词规范内文不一致）
    if (!e) {
      const ws = typeClean.split(/\s+/).filter((w) => /^[A-Za-z0-9]/.test(w));
      if (ws.length >= 5) e = ctx.keyMap.get(GTP_KEY(ws.slice(0, 4).join(' '))) || null;
    }
    if (!e) e = gtpFuzzyEntry(typeClean, ctx.entries); // 拼写容差（唯一命中才接受）
    if (!e) {
      // docx 格内粘词伪影：'Local Distinguished Name (LDN)Name'（Modify Bearer Response
      // 'PGW LDN' 行，j30-k00 五版本同位置同形态）。直查/模糊全落后截到最后一个右括号
      // 重试精确 + 模糊（k00 叠加形态：§8.1 本身带 'Distiguished' 笔误、行格再粘词——
      // 截断后仍需模糊唯一命中）。合法名 'H(e)NB …' 直查即中，不受影响。
      const pm = /^(.*\))/.exec(typeClean);
      if (pm && pm[1] !== typeClean) {
        e = ctx.keyMap.get(GTP_KEY(pm[1])) || null;
        if (!e) e = gtpFuzzyEntry(pm[1], ctx.entries);
      }
    }
    if (!e) problems.push(`IE 类型未识别: ${typeClean}（${name || cond.slice(0, 30)}）`);
    const ref = e && e.ref ? e.ref : null;
    out.push({
      iei: e ? String(e.value) : null,
      name,
      presence: pres || 'O',
      cond,
      format: 'TLV',
      len: e && e.fixed != null ? String(e.fixed) : null,
      ins: /^\d+$/.test(insCell) ? parseInt(insCell, 10) : null, // 'VS'/空 = 实例通配
      ref,
      def: ref && ctx.ies[ref] && (ctx.ies[ref].layouts?.length || ctx.ies[ref].grouped) ? ref : null,
    });
  }
  return out;
}

// ---- 29.060（GTPv1-C）建库 -----------------------------------------------------------------
// §7.1 消息类型值表（GTP-C 列 = X 且 Reference 为本规范 7.x 才入——GTP-U/外部规范消息
// 不入族）+ §7.7.0 IE 主表（Type 值|Format(TV/TLV)|名|Reference|Length Type|定长）驱动：
// 位表（parseGtpIeTable hdrOctets=1，头只占 octet 1、TLV Length 行剥除）挂布局，主表补
// ieType/format/fixed——无位表的 IE（图 figure + 值表散文形态，如 APN）靠 format/fixed
// 供 codec 编解码。消息行 = 3 列内容表行翻译（ref 反查主表），presence 原词（Mandatory/
// Conditional/Optional——gtpPresence 前缀映射兼容）。
function parseGtpv1MsgTypes(rows) {
  const out = {};
  let gtpcCol = -1;
  for (const cells of rows || []) {
    if (gtpcCol < 0) {
      gtpcCol = cells.findIndex((c) => /^gtp-?c$/i.test((c || '').trim()));
      continue; // 表头行（GTP-C 列定位）
    }
    const first = (cells[0] || '').trim();
    if (!/^\d+$/.test(first)) continue; // '6-7 | Spare' 区间行跳过
    const name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim();
    if (!name || /^reserved|^spare|^for future/i.test(name)) continue;
    const ref = (cells[2] || '').trim();
    if (!/^7\.\d/.test(ref)) continue; // 外部规范引用（Node Alive → 32.295 等）不入 GTP-C 族
    if (!/^x$/i.test((cells[gtpcCol] || '').trim())) continue; // 仅 GTP-U / GTP' 的消息不入
    out[GTP_KEY(name)] = { type: parseInt(first, 10), mask: 0xff, name };
  }
  return out;
}

function parseGtpv1IeTypes(rows) {
  const entries = [];
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    if (!/^\d+$/.test(first)) continue;
    const name = (cells[2] || '').split('\n')[0].replace(/\s+/g, ' ').trim();
    const format = (cells[1] || '').trim().toUpperCase();
    const ref = (cells[3] || '').trim();
    const fixed = (cells[5] || '').trim();
    if (!name || /^reserved|^spare/i.test(name) || !/^7\.7/.test(ref)) continue;
    entries.push({
      value: parseInt(first, 10),
      name,
      ref,
      format: format === 'TLV' ? 'TLV' : 'TV',
      fixed: /^\d+$/.test(fixed) ? parseInt(fixed, 10) : null,
    });
  }
  const byRef = new Map();
  for (const e of entries) if (!byRef.has(e.ref)) byRef.set(e.ref, e);
  return { entries, byRef };
}

function buildSchema29060(structured) {
  const problems = [];
  const t71 = (structured.typeTables || []).find((t) => t.section === '7.1');
  const t770 = (structured.typeTables || []).find((t) => t.section === '7.7.0');
  const msgTypes = parseGtpv1MsgTypes(t71 && t71.rows);
  if (!Object.keys(msgTypes).length) problems.push('§7.1 消息类型值表未捕获');
  const ieTypes = parseGtpv1IeTypes(t770 && t770.rows);
  if (!ieTypes.entries.length) problems.push('§7.7.0 IE 主表未捕获');
  // §7.7.40 图形实证：Extension Header Type List（IE 141）的 Length 域画在 octet 2 单八位组
  // （图内 Octets 列 '2'；其余全部 IE 图——WMF/EMF 文本坐标扫描——均 '2-3' 两八位组，
  // 五版本一致，方法与证据见 docs/nas_oracle_deviations.md）。主表仅标 'TLV/Variable'，
  // 宽度只由图给出；此为本族唯一非 2 八位组长度域的 IE（tshark 同口径独立实证）。
  const GTPV1_LEN1 = new Set([141]);
  // ies：§7.7.x 位表直出布局，主表补 ieType/format/fixed（含无位表 IE——layouts 空数组）
  const ies = {};
  for (const b of structured.bits || []) {
    if (!b.section || !/^7\.7/.test(b.section)) continue;
    ies[b.section] = { name: b.name, layouts: [{ figure: b.figure, octets: b.octets }], ...(b.warnings && b.warnings.length ? { warnings: b.warnings } : {}) };
  }
  for (const e of ieTypes.entries) {
    if (ies[e.ref] === undefined) ies[e.ref] = { name: e.name, layouts: [] };
    else if (!ies[e.ref].name) ies[e.ref].name = e.name;
    ies[e.ref].ieType = e.value;
    ies[e.ref].format = e.format;
    ies[e.ref].fixed = e.fixed;
    if (GTPV1_LEN1.has(e.value)) ies[e.ref].lenBytes = 1;
  }
  // 批次K：图形/override 布局并入——只补无位表 IE（表格布局优先；override 再压图形）。
  // figbits = nasfiglayout.mjs 从用户 spec 内嵌 WMF/EMF 图重建的候选（accepted 已按
  // 「无 HARD 旗标」筛过，重建规则与旗标语义见 tools/nasfiglayout.mjs 头注）；
  // figfix = 歧义带（多命名字段）与网格错位表的手工核验布局（D 侧构建输入，逐条带证据）。
  // 两者都是用户自带 spec 的构建期衍生物——仓库不含任何所得布局数据。
  const figfix = structured.figfix && structured.figfix.sections ? structured.figfix.sections : {};
  const figbits = structured.figbits && structured.figbits.accepted ? structured.figbits.accepted : {};
  for (const [ref, fix] of Object.entries(figfix)) {
    if (ies[ref] === undefined || ies[ref].layouts.length) continue;
    ies[ref].layouts = [{ figure: `figfix: ${(fix.evidence || '').slice(0, 60)}`, octets: fix.octets, src: 'fix' }];
  }
  for (const [ref, pick] of Object.entries(figbits)) {
    if (ies[ref] === undefined || ies[ref].layouts.length) continue;
    ies[ref].layouts = [{ figure: `fig ${pick.fig}`, octets: pick.octets, src: 'fig', ...(pick.flags.length ? { warnings: pick.flags } : {}) }];
  }
  // 消息实例（§7.2-7.5A）：行 ref 反查 IE 主表
  const out = {};
  for (const m of structured.msgs || []) {
    if (m.kind !== 'message' || !/^7\.[2-5]/.test(m.section || '')) continue;
    const rows = (m.rows || []).map((r) => {
      const e = r.ref ? ieTypes.byRef.get(r.ref) : null;
      return {
        iei: e ? String(e.value) : null,
        name: r.name,
        presence: r.presence || 'O',
        cond: null,
        format: e ? e.format : null,
        len: e && e.fixed != null ? String(e.fixed) : null,
        ins: null,
        ref: r.ref || null,
        def: e ? r.ref : null,
        ...(e && GTPV1_LEN1.has(e.value) ? { lenBytes: 1 } : {}),
      };
    });
    const t = msgTypes[GTP_KEY(m.name)];
    if (!t) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    const inst = { section: m.section, tableId: null, direction: null, pd: null, msgType: t ? t.type : null, rows };
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return { schema: { spec: '29060', version: structured.version, msgTypes, ies, messages: out }, problems };
}

// ---- 29.281（GTP-U）建库（批次 AI2：类型值表轻量锚定）-----------------------------------
// GTP-U 头/扩展头链的线缆级模型在 gtpu.js（tshark 对拍过）；本 schema 的价值 = 三个类型
// 值表锚定（§5.2.1 扩展头类型 / §6.1 消息类型 GTP-U 列 / §8.1 IE 类型）+ §7.x 消息内容表，
// 并在建库时与 gtpu.js 的 GTPU_EXT_TYPES 常量表对拍（硬编码 ← → 规范表格互证）。
// 位表不采（分类循环 29281 注释与 deviations 的形态证据）；ies 只有类型表条目（layouts 空）。

// §5.2.1 扩展头类型表行：['0000 0001', 'Reserved - Control Plane only.'] → {value:1, name, reserved}
function parse29281ExtRows(rows) {
  const out = [];
  if (!rows || !rows.length) return out;
  for (const r of rows) {
    const bits = (r[0] || '').replace(/\s+/g, '');
    if (!/^[01]{8}$/.test(bits)) continue; // 表头/NOTE 行/杂项
    const name = (r[1] || '').replace(/\.\s*See NOTE \d+[^.]*\.?/i, '').replace(/\s+/g, ' ').trim().replace(/\.$/, '');
    out.push({ value: parseInt(bits, 2), name, reserved: /^reserved/i.test(name) });
  }
  return out;
}

// 扩展头类型对拍（纯参数化——测试用合成数据，真实对拍在建库内走 GTPU_EXT_TYPES）：
// 常量表每个键必须在表的非 reserved 行中；名字对拍用首 token 宽松口径（表名带 NOTE 尾注、
// 常量名带 '(legacy)' 加工后缀——先例：AB 批对 29.281 j20 的逐项人工核对结论）。
// v1.42.0 P3-10：补反向检查 extra——表内非 reserved 但常量表没有的值（防伪项静默注入；
// 真实表天然有常量表未建模的行，extra 只记录不入 fatal，由建库以「参考」文案落 problems）。
function compareExtTypes(extTypes, constTable) {
  const byValue = new Map(extTypes.filter((e) => !e.reserved).map((e) => [e.value, e]));
  const missing = [], nameMismatch = [], extra = [];
  for (const [k, name] of Object.entries(constTable)) {
    const v = +k;
    const e = byValue.get(v);
    if (!e) { missing.push(v); continue; }
    const a = name.replace(/\s*\(legacy\)\s*$/i, '').toLowerCase();
    const b = e.name.toLowerCase();
    if (!b.startsWith(a.slice(0, 12))) nameMismatch.push({ value: v, schema: e.name, constant: name });
  }
  const constVals = new Set(Object.keys(constTable).map(Number));
  for (const e of extTypes) {
    if (!e.reserved && !constVals.has(e.value)) extra.push({ value: e.value, name: e.name });
  }
  return { missing, nameMismatch, extra };
}

// v1.42.0 P2-4：problems 分级——fatal（结构未捕获/对拍失败/系统性失配）与已知可接受
// （「无消息类型值」＝同名消息族存在但类型值表未给值；「位参数并入」＝23040 建模注记；
// 「表缺 TP-CD 行」＝k00 编辑遗漏的已处置补行注记）。fatal 非空即坏库——nasdef exit 1，
// 调度器/gate 直接红。真实 19 族基线实证：problems 仅命中可接受类（44018×2、23040×8），
// 分级不误伤（本函数为纯函数，测试用合成清单钉行为）。
function classifyProblems(problems) {
  const FATAL = [/未捕获/, /对拍/, /文法定义过少/, /IE 类型未识别/, /无 IE Type 值/];
  const fatal = [], accepted = [];
  for (const p of problems) (FATAL.some((re) => re.test(p)) ? fatal : accepted).push(p);
  return { fatal, accepted };
}

function buildSchema29281(structured) {
  const problems = [];
  const tt = (t) => (structured.typeTables || []).filter((x) => x.section === t);
  // §5.2.1 三表中挑扩展头类型表（两列、首列二进制串；帧格式表/bits 表列头不含二进制行）。
  // v1.42.0 P3-10：表头锁定——只吃列头为「Next Extension Header Field Value」的表（真实 j20
  // 三表实测仅类型表匹配），防未来版本 bits 表现 8 位首列时静默注入伪项。
  const extTypes = tt('5.2.1')
    .filter((t) => (t.rows || []).some((r) => (r || []).some((c) => /next extension header/i.test(String(c || '')))))
    .flatMap((t) => parse29281ExtRows(t.rows));
  if (!extTypes.length) problems.push('§5.2.1 扩展头类型值表未捕获');
  // §6.1 消息类型表：[Decimal|Message|Reference|GTP-C|GTP-U|GTP']——GTP-U 列 'X' 的单值行。
  // 大小写有语义：适用='X'（大写），GTP' 列惯用小写 'x'——严格匹配防串列误收。
  const msgTypes = {};
  for (const t of tt('6.1')) {
    for (const r of t.rows.slice(1)) {
      if (!/^\d+$/.test((r[0] || '').trim())) continue; // 范围行（reserved）与表头
      if ((r[4] || '').trim() !== 'X') continue;
      const name = (r[1] || '').trim();
      msgTypes[GTP_KEY(name)] = { type: +r[0].trim(), name };
    }
  }
  if (!Object.keys(msgTypes).length) problems.push('§6.1 消息类型值表（GTP-U 列）未捕获');
  // §8.1 IE 类型表：[IE Type Value|Format|Information Element|Reference]
  const ieTypes = { entries: [], byName: new Map() };
  for (const t of tt('8.1')) {
    for (const r of t.rows.slice(1)) {
      if (!/^\d+$/.test((r[0] || '').trim())) continue;
      const name = (r[2] || '').replace(/\.\s*See NOTE \d+[^.]*\.?/i, '').replace(/\s+/g, ' ').trim();
      const e = { value: +r[0].trim(), format: (r[1] || '').trim(), name, ref: (r[3] || '').trim() || null };
      ieTypes.entries.push(e);
      ieTypes.byName.set(GTP_KEY(name), e);
    }
  }
  if (!ieTypes.entries.length) problems.push('§8.1 IE 类型值表未捕获');
  // v1.42.0 P3-9：§8.1 NOTE 1 别名——「GSN Address」在规范其余部分称「GTP-U Peer Address」
  // （29.281 j20 §8.1 NOTE 1 原文口径）；§7.x 消息表用后者而 §8.1 用前者，不登记别名则
  // 反查失败（实测 j20 'GTP-U Peer Address' 行 iei/ref/def 全 null）。别名只在 §8.1 自身
  // 没有「GTP-U Peer Address」条目时登记，防未来版本两名义并存时覆盖真条目。
  const gsn = ieTypes.byName.get(GTP_KEY('GSN Address'));
  if (gsn && !ieTypes.byName.has(GTP_KEY('GTP-U Peer Address'))) {
    ieTypes.byName.set(GTP_KEY('GTP-U Peer Address'), gsn);
  }
  // ies：类型表条目（ref 缺失的收在 entries 不进 ies——防悬空键）
  const ies = {};
  for (const e of ieTypes.entries) {
    if (!e.ref) continue;
    ies[e.ref] = { name: e.name, layouts: [], ieType: e.value, format: e.format };
  }
  // BF 批（v1.62.0）：IE 几何标注——gtpu.js GTPU_IE_GEOMETRY（§8.2-8.8 图形常量表）
  // 按 ieType 注入 fixed/lenBytes，并与 §8.1 Format 列交叉核对（缺行/格式不符 = fatal，
  // GTPU_EXT_TYPES 对拍同款互证机制）。无几何的 IE 无法定界——gtpv1 解码器不可用。
  for (const ie of Object.values(ies)) {
    const g = GTPU_IE_GEOMETRY[ie.ieType];
    if (!g) { problems.push(`几何表对拍：IE ${ie.ieType}（${ie.name}）不在 GTPU_IE_GEOMETRY（无法定界）`); continue; }
    if (String(g.format).toUpperCase() !== String(ie.format || '').toUpperCase()) {
      problems.push(`几何表对拍：IE ${ie.ieType}（${ie.name}）§8.1 Format '${ie.format}' ≠ 几何表 '${g.format}'`);
    }
    if (g.fixed != null) ie.fixed = g.fixed;
    if (g.lenBytes != null) ie.lenBytes = g.lenBytes;
  }
  // 消息实例（§7.x）：行按名反查 §8.1（29.281 消息表 Reference 列实测为空）。
  // 'General' 小节表（§7.3.2.1——消息概览段）非消息内容表，跳过（29244 同款口径）。
  const out = {};
  for (const m of structured.msgs || []) {
    if (m.kind !== 'message' || !/^7\./.test(m.section || '')) continue;
    if (/^general$/i.test(m.name || '')) continue;
    const rows = (m.rows || []).map((r) => {
      const e = ieTypes.byName.get(GTP_KEY(r.name || '')) || null;
      const g = e ? GTPU_IE_GEOMETRY[e.value] : null; // TV 定长行 len 供编码器校验/采样器定形；
      // TLV 行 lenBytes 同步下行（encGtpv1Msg 读行级 lenBytes——141 单八位组长度域；
      // 缺席时编码器按缺省 2B 写、解码器按 ies 标注 1B 读，回环即失配，BF 探针实证）
      return {
        iei: e ? String(e.value) : null,
        name: r.name,
        presence: r.presence || 'O',
        cond: null,
        format: e ? e.format : null,
        len: g && g.fixed != null ? String(g.fixed) : null,
        lenBytes: g && g.lenBytes != null ? g.lenBytes : null,
        ins: null,
        ref: e ? e.ref : null,
        def: e ? e.ref : null,
      };
    });
    const t = msgTypes[GTP_KEY(m.name || '')];
    if (!t) problems.push(`${m.section || '?'} ${m.name || '?'}: 无消息类型值`);
    const inst = { section: m.section, tableId: null, direction: null, pd: null, msgType: t ? t.type : null, rows };
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  // 常量表对拍：gtpu.js GTPU_EXT_TYPES ↔ §5.2.1 类型表（建库即核，任何重建自动复验）。
  // missing/nameMismatch 入 fatal（classifyProblems /对拍/）；extra 反向缺口只以「参考」
  // 文案落 problems（真实表天然有常量表未建模的行——如 legacy 值，不入 fatal）。
  const cmp = compareExtTypes(extTypes, GTPU_EXT_TYPES);
  if (cmp.missing.length) problems.push(`GTPU_EXT_TYPES 对拍：常量表 ${cmp.missing.map((v) => '0x' + v.toString(16)).join(',')} 不在 §5.2.1 类型表`);
  for (const nm of cmp.nameMismatch) problems.push(`GTPU_EXT_TYPES 对拍：0x${nm.value.toString(16)} 名不符（表 '${nm.schema}' vs 常量 '${nm.constant}'）`);
  if (cmp.extra.length) problems.push(`GTPU_EXT_TYPES 参考：§5.2.1 表中常量表未建模 0x${cmp.extra.map((e) => e.value.toString(16)).join(',0x')}`);
  return { schema: { spec: '29281', version: structured.version, extTypes, msgTypes, ies, messages: out }, problems };
}

function buildSchema29274(structured) {
  const problems = [];
  const t61 = (structured.typeTables || []).find((t) => t.section === '6.1' || t.section === '6.1.0');
  const t81 = (structured.typeTables || []).find((t) => t.section === '8.1');
  const msgTypes = parseGtpMsgTypes(t61 && t61.rows);
  if (!Object.keys(msgTypes).length) problems.push('§6.1 消息类型值表未捕获');
  const ieTypes = parseGtpIeTypes(t81 && t81.rows);
  if (!ieTypes.entries.length) problems.push('§8.1 IE 类型值表未捕获');
  // ies：§8.x 位表直出布局；8.1 反查补 ieType/定长/长度类别
  const ies = {};
  for (const b of structured.bits || []) {
    if (!b.section || !/^8\./.test(b.section)) continue;
    ies[b.section] = { name: b.name, layouts: [{ figure: b.figure, octets: b.octets }], ...(b.warnings && b.warnings.length ? { warnings: b.warnings } : {}) };
  }
  for (const e of ieTypes.entries) {
    if (e.ref && ies[e.ref]) {
      ies[e.ref].ieType = e.value;
      ies[e.ref].fixed = e.fixed;
      ies[e.ref].kind = e.kind;
    }
  }
  // 分组 IE 内容行：§8.x 定义表优先，§7.x 内嵌表仅补缺
  // 分组 IE 内容行：§8.x 的同名表只是 NOTE 占位（NOTE: This table uses a 5-column…，真身内嵌 §7.x）——
  // 无类型格行的一律跳过；§7.x 内嵌表为唯一内容源（同名多表取首个含数据的）
  const gtpHasData = (rows) => (rows || []).some((r) => (r[3] || '').trim() && !/^note/i.test((r[3] || '').trim()));
  const groupedRows = new Map();
  for (const m of structured.msgs || []) {
    if (m.kind !== 'grouped' || !m.groupName) continue;
    if (!gtpHasData(m.rows)) continue;
    if (!groupedRows.has(GTP_KEY(m.groupName))) groupedRows.set(GTP_KEY(m.groupName), m.rows);
  }
  const ctx = { ies, keyMap: ieTypes.keyMap, entries: ieTypes.entries };
  for (const [k, rows] of groupedRows) {
    const e = ieTypes.keyMap.get(k);
    const sec = e && e.ref ? e.ref : null;
    if (sec && ies[sec] === undefined && e.ref) ies[sec] = { name: e.name, layouts: [] };
    if (sec && ies[sec]) {
      ies[sec].grouped = gtpTranslateRows(rows, ctx, problems);
      if (ies[sec].ieType == null) { ies[sec].ieType = e.value; ies[sec].fixed = e.fixed; }
    }
  }
  // 消息实例（§7.x）
  const out = {};
  for (const m of structured.msgs || []) {
    if (m.kind !== 'message' || !/^7\./.test(m.section || '')) continue;
    const rows = gtpTranslateRows(m.rows, ctx, problems);
    const t = msgTypes[GTP_KEY(m.name)];
    if (!t) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    const inst = { section: m.section, tableId: null, direction: null, pd: null, msgType: t ? t.type : null, rows };
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return { schema: { spec: '29274', version: structured.version, msgTypes, ies, messages: out }, problems };
}

// ---- 29.244（PFCP）建库 --------------------------------------------------------------
// 表结构与 29.274 同构的 TLV 族，差异：
//   - §7.3 消息类型值表（值|名，名带 'PFCP ' 前缀）；§8.1.2 IE 类型表（值|名|Comment|定长），
//     Comment 形如 'Extendable / Table 7.5.2.2-1'（分组 IE）或 'Fixed / Clause 8.2.1'（位表 IE）；
//   - §7.x 内容表 9 列（IE 名|P|Condition|Appl.×5|IE Type），分组表前置两行 Type/Length；
//   - IE 框架 = Type(2)+Length(2)+Value，无 Instance 列（分组子 IE 同）。
// IE 节键：位表 IE = §8.2.x 节号；分组 IE = §7.5 表号（如 '7.5.2.2-1'）。
function parsePfcpMsgTypes(rows) {
  const out = {};
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    let name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim();
    if (!name || !/^\d+$/.test(first) || /^reserved/i.test(name) || /^spare/i.test(name)) continue;
    name = name.replace(/^PFCP\s+/i, '');
    out[GTP_KEY(name)] = { type: parseInt(first, 10), mask: 0xff, name };
  }
  return out;
}

function parsePfcpIeTypes(rows) {
  const entries = [];
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    const name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim();
    const comment = (cells[2] || '').trim();
    const fixedCell = (cells[3] || '').trim();
    if (!name || !/^\d+$/.test(first) || /^reserved|^spare/i.test(name)) continue;
    const km = /^(Extendable|Variable(?:\s+Length)?|Extendable\s+Length|Fixed(?:\s+Length)?)\s*\/\s*(.*)$/i.exec(comment);
    const refRaw = (km ? km[2] : comment).replace(/\b(8\.\d+)\s+(\d+)\b/g, '$1.$2'); // 'Clause 8.2 37' 排版空格
    const tm = /(?:Table|Clause)\s+(7\.[\d.]+(?:-\d+)?)/i.exec(refRaw);
    const cm = /Clause\s+(8\.\d+(?:\.\d+)*[a-z]?)/i.exec(refRaw);
    entries.push({
      value: parseInt(first, 10),
      name,
      ref: tm ? tm[1] : cm ? cm[1] : null,
      refKind: tm ? 'table' : cm ? 'clause' : null,
      kind: km ? km[1].toLowerCase().replace(/\s+/g, ' ') : null,
      fixed: /^\d+$/.test(fixedCell) ? parseInt(fixedCell, 10) : null,
    });
  }
  const keyMap = new Map();
  for (const e of entries) {
    for (const k of gtpIeNameKeys(e.name)) if (!keyMap.has(k)) keyMap.set(k, e);
    // 'X within <message>' / 'X IE within <message>' → 基名键（内容表格常用短名）
    const base = e.name.replace(/\s+IE\s+within\b.*$/i, '').replace(/\s+within\b.*$/i, '').replace(/\s+IE$/i, '').trim();
    if (base && base !== e.name) for (const k of gtpIeNameKeys(base)) if (!keyMap.has(k)) keyMap.set(k, e);
    // 长名前缀别名：末词不同的规范内文写法（'Node Level Mitigation Actions Rules' ↔
    // 消息表 'Node level Mitigation Actions Information'）取前 4 词归一
    const words = base.split(/\s+/).filter((w) => /^[A-Za-z0-9]/.test(w));
    if (words.length >= 5) {
      const k = GTP_KEY(words.slice(0, 4).join(' '));
      if (!keyMap.has(k)) keyMap.set(k, e);
    }
  }
  return { entries, keyMap };
}

function buildSchema29244(structured) {
  const problems = [];
  const t73 = (structured.typeTables || []).find((t) => t.section === '7.3');
  const t812 = (structured.typeTables || []).find((t) => t.section === '8.1.2');
  const msgTypes = parsePfcpMsgTypes(t73 && t73.rows);
  if (!Object.keys(msgTypes).length) problems.push('§7.3 消息类型值表未捕获');
  const ieTypes = parsePfcpIeTypes(t812 && t812.rows);
  if (!ieTypes.entries.length) problems.push('§8.1.2 IE 类型值表未捕获');
  const ies = {};
  for (const b of structured.bits || []) {
    if (!b.section || !/^8\.2\./.test(b.section)) continue;
    ies[b.section] = { name: b.name, layouts: [{ figure: b.figure, octets: b.octets }], ...(b.warnings && b.warnings.length ? { warnings: b.warnings } : {}) };
  }
  for (const e of ieTypes.entries) {
    if (e.refKind === 'clause' && e.ref && /^8\.2\./.test(e.ref)) {
      if (!ies[e.ref]) ies[e.ref] = { name: e.name, layouts: [] };
      ies[e.ref].ieType = e.value;
      ies[e.ref].fixed = e.fixed;
      ies[e.ref].kind = e.kind;
    }
  }
  // 分组 IE：§7.x 定义表 → 挂到 IE 类型表的 Table 键（或已存在位表节）
  const keyOfGroup = new Map(); // groupType → ies key
  for (const e of ieTypes.entries) if (e.refKind === 'table' && e.ref) keyOfGroup.set(e.value, e.ref);
  const ctx = { ies, keyMap: ieTypes.keyMap, entries: ieTypes.entries };
  const groupJobs = [];
  for (const m of structured.msgs || []) {
    if (m.kind !== 'grouped') continue;
    // 组类型：preamble 的 IE Type 值优先；无 preamble 的表用表号反查 §8.1.2 的 Comment 引用
    let e = m.groupType != null ? ieTypes.entries.find((x) => x.value === m.groupType) : null;
    if (!e && m.tableId) e = ieTypes.entries.find((x) => x.ref && (x.ref === m.tableId || m.tableId.startsWith(x.ref + '-') || x.ref.startsWith(m.tableId + '-')));
    if (!e && m.groupName) e = ieTypes.keyMap.get(GTP_KEY(m.groupName)) || null;
    const gType = m.groupType != null ? m.groupType : e ? e.value : null;
    if (gType == null) { problems.push(`${m.tableId || m.section} 分组 IE「${m.groupName}」无 IE Type 值`); continue; }
    // §8.1.2 的引用可省略 '-N' 后缀（'Table 7.5.4.8' vs 题注 'Table 7.5.4.8-1'）——
    // 组键确定后把类型表条目 ref 归一，消息行即可直接挂到组内容
    if (e && e.ref !== m.tableId && m.tableId) { e.ref = m.tableId; e.refKind = 'table'; }
    // 内容表用组名引用子 IE（'IP Multicast Addressing Info'）——把组名登记为别名
    if (e) for (const k of gtpIeNameKeys(m.groupName || e.name)) if (!ieTypes.keyMap.has(k)) ieTypes.keyMap.set(k, e);
    let key = m.tableId || keyOfGroup.get(gType);
    if (!key && e && e.ref && e.refKind === 'clause' && ies[e.ref]) key = e.ref;
    if (!key) key = `pfcp-group-${gType}`;
    if (!ies[key]) ies[key] = { name: m.groupName || e.name || key, layouts: [] };
    if (ies[key].ieType == null) { ies[key].ieType = gType; ies[key].fixed = e ? e.fixed : null; ies[key].kind = e ? e.kind : 'extendable'; }
    keyOfGroup.set(gType, key);
    groupJobs.push({ m, key });
  }
  // 先登记全部组名别名，再翻译组内行——否则后出现的组名被前面的组引用时解析不到
  for (const { m, key } of groupJobs) ies[key].grouped = gtpTranslateRows(m.rows, ctx, problems);
  // 消息实例（§7.4/§7.5 内容表）
  const out = {};
  const fuzzyType = (name) => {
    const k = GTP_KEY(name.replace(/^PFCP\s+/i, ''));
    if (msgTypes[k]) return msgTypes[k];
    let hit = null;
    for (const [kk, v] of Object.entries(msgTypes)) {
      if (Math.abs(kk.length - k.length) > 2) continue;
      if (gtpLev(kk, k) <= 1) { if (hit) return null; hit = v; } // 规范笔误（'Modifcation'）
    }
    return hit;
  };
  for (const m of structured.msgs || []) {
    if (m.kind !== 'message' || !/^7\.[45]\./.test(m.section || '')) continue;
    const rows = gtpTranslateRows(m.rows, ctx, problems);
    const t = fuzzyType(m.name);
    if (!t) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    const inst = { section: m.section, tableId: m.tableId || null, direction: null, pd: null, msgType: t ? t.type : null, session: !!(t && t.type >= 50), rows };
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  // 无内容表的纯头消息（29.244 §7.4.4.7 Version Not Supported Response 实证）：
  // 按 §7.3 类型表补空实例，保证类型覆盖完整（编码 = 仅头）。
  const have = new Set(Object.values(out).flat().map((i) => i.msgType));
  for (const t of Object.values(msgTypes)) {
    if (have.has(t.type)) continue;
    const nm = t.name;
    if (!out[nm]) out[nm] = [];
    out[nm].push({ section: null, tableId: null, direction: null, pd: null, msgType: t.type, session: t.type >= 50, rows: [] });
  }
  return { schema: { spec: '29244', version: structured.version, msgTypes, ies, messages: out }, problems };
}

// ---- 44.018（GSM RR）建库 -----------------------------------------------------------------
// 24.007 半八位组头家族：PD(V 1/2 低半) + Skip Indicator(V 1/2 高半) + Message type(V 1)；
// CCCH/BCCH 消息（paging/immediate assignment/SI）头部多一行 L2 Pseudo Length(V 1)——
// 通用定长 V 行处理，无需特判；消息尾 Rest Octets（CSN.1）为可变 V 行吞尾。
// 类型值来源 §10.4：10.4.1 主表为多行单元格（类别行 + 'b b b b b b b b NAME' 模式行，全固定位）；
// 10.4.2 为 SACCH 子类型（分离数字格 5 位 + 隐含高位 000：bit8 扩展位恒 0、bit7-6 恒 0）；
// 10.4.3（GTTP）模式行会被收进映射但无消息实例引用；10.4.4/10.4.5（EC-GSM）模式行不足
// 8 位，天然跳过（对应 pycrate 亦无这些 RR 类，wire oracle 同步豁免）。
const PD44018 = 6; // TS 24.007 §11.2.3.1.3：RR=6

function parseTypeTables44018(tables) {
  const out = {};
  const LINE = /^([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01])\s+(.+)$/;
  const normKey = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  for (const t of tables || []) {
    if (!/^10\.4/.test(t.section || '')) continue;
    for (const cells of t.rows) {
      for (const cell of cells) {
        for (const line of String(cell).split('\n')) {
          const m = LINE.exec(line.trim());
          if (!m) continue;
          const name = m[9].trim().replace(/[.…\s]+$/, '');
          if (!name || /^reserved/i.test(name)) continue; // 'Reserved (see NOTE)' 占位
          const type = parseInt(m.slice(1, 9).join(''), 2);
          out[normKey(name)] = { type, mask: 0xff };
        }
      }
      // 形态二：SACCH 子类型（≥4 个分离 0/1 数字格 + 末格名称；表头只有 bits 5-1）
      const digs = [];
      let name = null;
      for (const c of cells) {
        const s = String(c).trim();
        if (!name && /^[01]$/.test(s)) digs.push(s);
        else if (s) name = s;
      }
      if (digs.length >= 4 && name && digs.length <= 7) {
        const bits8 = '0'.repeat(8 - digs.length) + digs.join('');
        out[normKey(name)] = { type: parseInt(bits8, 2), mask: 0xff };
      }
    }
  }
  return out;
}

// 名称对齐（跨表名称形态差异实证）：'CDMA 2000 …' vs 'CDMA2000 …'（去非字母数字）、
// 'CONFIGURATION CHANGE ACK.' vs '… ACKNOWLEDGE'（规范化后前缀匹配，最长优先）、
// 内容表偶漏 'TYPE' 词（'SYSTEM INFORMATION 15'，j00 9.1.43j）→ 双侧均试去 type 形态。
function resolveMsgType44018(name, msgTypes) {
  const normKey = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const key = normKey(name);
  const keyT = key.replace(/type/g, '');
  for (const c of [key, keyT]) if (msgTypes[c]) return msgTypes[c];
  let best = null;
  for (const [k, v] of Object.entries(msgTypes)) {
    for (const kk of new Set([k, k.replace(/type/g, '')])) {
      for (const c of [key, keyT]) {
        if ((kk.startsWith(c) || c.startsWith(kk)) && Math.min(kk.length, c.length) >= 8) {
          if (!best || kk.length > best[0]) best = [kk.length, v];
        }
      }
    }
  }
  return best ? best[1] : null;
}

function buildSchema44018(structured, fillBits, fillValueTables, fillCsn1) {
  // 跨规范位表并入：44.018 §10.5.1.x（Mobile Identity / Classmark / LAI 等）正文只有
  // 'See 3GPP TS 24.008.'——节号与 24.008 §10.5.1.x 同编，用 24.008 摄取产物的位表补齐
  // （只并本地缺失的节号，本地优先）。并入节的值域表随行并入（挂起行的锚点走查依赖）；
  // CSN.1 文法表同路并入（10.5.1.7 MS Classmark 3 = 24.008 CSN.1 文法）。
  const localBits = new Set(structured.bits.map((b) => b.section));
  const extraBits = (fillBits || []).filter((b) => b.section && !localBits.has(b.section));
  const allBits = structured.bits.concat(extraBits);
  const localVt = new Set((structured.valueTables || []).map((v) => v.section));
  const allValueTables = (structured.valueTables || []).concat(
    (fillValueTables || []).filter((v) => v.section && !localVt.has(v.section))
  );
  const localCsn1 = new Set((structured.csn1 || []).map((v) => v.section));
  const allCsn1 = (structured.csn1 || []).concat(
    (fillCsn1 || []).filter((v) => v.section && !localCsn1.has(v.section))
  );
  const msgTypes = parseTypeTables44018(structured.typeTables);
  const ies = buildIes(allBits, allValueTables);
  mergeCsn1IntoIes(ies, buildCsn1Descriptors(allCsn1, structured.sections), structured.sections);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows({ ...structured, bits: allBits }, m.rows);
    const t = resolveMsgType44018(m.name, msgTypes);
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd: PD44018,
      mtOff: mtOffset(merged),
      rows: merged,
    };
    if (t) {
      inst.msgType = t.type;
      inst.msgMask = t.mask;
    } else {
      inst.msgType = null;
      problems.push(`${m.section} ${m.name}: 无消息类型值`);
    }
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  // AP 批（v1.48.0）：跨规范悬空 ref 显性化——消息行 ref/def 指向本库不存在节，且非
  // 10.2/10.4 头部委托（PD/Message Type 由 24.008 委托管线 + pd/msgType 字段处理，预期
  // 悬空）。v5 计划「fill-44060 并池 16 名」前提经三池对拍（44.060 ies 152 节 / csn1
  // 197 表 / bits 空）证不成立：0/21 可补——44.060 ingest 未捕获 §11 位图定义（深修列
  // 长期池首位）；显性记账防再误估，44.118 'RADIO BEARER RECONFIGURATION 3GPP TS'
  // （规范 typo/引用错乱）随清单入档。
  const skipHdr = /^(10\.2|10\.4[a-z]?)$/;
  const dangling = new Map();
  for (const insts of Object.values(out)) {
    for (const inst of insts) {
      for (const r of inst.rows) {
        const v = String(r.ref || r.def || '').trim();
        if (v && !skipHdr.test(v) && !ies[v]) {
          const key = `${v}|${r.name || ''}`;
          dangling.set(key, (dangling.get(key) || 0) + 1);
        }
      }
    }
  }
  const danglingRefs = [...dangling.entries()]
    .map(([k, n]) => { const i = k.indexOf('|'); return { sec: k.slice(0, i), name: k.slice(i + 1), rows: n }; })
    .sort((a, b) => a.sec.localeCompare(b.sec));
  if (danglingRefs.length) {
    problems.push(`跨规范悬空 ref ${danglingRefs.length} 名 ×${danglingRefs.reduce((s, d) => s + d.rows, 0)} 行（44.060 产物池无对应定义源——0 可补，立档；清单见 build.danglingRefs）`);
  }
  return {
    schema: { spec: '44018', version: structured.version, msgTypes, ies, messages: out, danglingRefs },
    problems,
  };
}

// Message type 行的八位组偏移（wireshark 平文本派发用；44.018 CCCH 消息头部多 L2 Pseudo
// Length → 2，其余 → 1）。行序累计：VH 0.5、定长 V 按字节数，遇 message type 行为止。
function mtOffset(rows) {
  let acc = 0;
  for (const r of rows) {
    if (/message (identity|type)/i.test((r.name || ''))) break;
    const f = rowFormat(r);
    if (f === 'VH') acc += 0.5;
    else if (f === 'V') acc += fixedLen(r.len) ?? 0;
  }
  return Math.round(acc);
}

// ---- 24.080（SS/USSD）建库 -----------------------------------------------------------------
// 24.007 半八位组头家族：PD(V 1/2 低半) + Transaction identifier(V 1/2 高半) + Message type(V 1)。
// 三消息（FACILITY/REGISTER/RELEASE COMPLETE）的 IE 全是 TLV/LV 不透明载荷（Facility 的
// ROSE 组件是 BER 编码，不在位表管线范围）。
// 消息类型值（表 3.1，x/. 通配形态不机读；高两位 CS 域序号位编码 0）：FACILITY=0x3A、
// REGISTER=0x3B、RELEASE COMPLETE=0x2A——与 24.008 §10.3.2 同源且分配恒定，pycrate
// TS24080 出帧实证（0b3a/0b3b/0b2a）。三常量硬编码与 PD24008 同一待遇。
const PD24080 = 11; // TS 24.007 §11.2.3.1.3：SS=11

const SS_MSG_TYPES = {
  facility: { type: 0x3a, mask: 0xff },
  register: { type: 0x3b, mask: 0xff },
  'release complete': { type: 0x2a, mask: 0xff },
};

function buildSchema24080(structured) {
  const ies = buildIes(structured.bits, structured.valueTables);
  const msgTypes = {};
  for (const [k, v] of Object.entries(SS_MSG_TYPES)) msgTypes[k] = { ...v, group: null };
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows(structured, m.rows);
    const t = SS_MSG_TYPES[m.name.toLowerCase()] || null;
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd: PD24080,
      mtOff: 1,
      rows: merged,
    };
    if (t) {
      inst.msgType = t.type;
      inst.msgMask = t.mask;
    } else {
      inst.msgType = null;
      problems.push(`${m.section} ${m.name}: 无消息类型值`);
    }
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return {
    schema: { spec: '24080', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// ---- 24.011（SMS CP/RP 层）建库 -------------------------------------------------------------
// CP 消息（§7.2.x）：24.007 半八位组头家族 PD(V 1/2 低半) + Transaction identifier(V 1/2 高半)
// + Message type(V 1)，PD=9（SMS）；CP-User data = LV、CP-Cause = V 1（消息表 + pycrate
// Type4LV/Type3V 双证——§8.1.4.x 元素图里的 'IEI' 行是遗迹，线上无 IEI 字节）。
// RP 消息（§7.3.x）：无 PD——octet1 = RP-Message Type（3 位 MTI + spare，整字节常量）；
// 地址/载荷全 LV，RP-ACK/RP-ERROR 的 RP-User data = TLV(0x41)。RP-MTI 值来自表 8.3
// （3 位 + 方向 + 名称），方向编码 ms->n/n->ms；表缺项时用常量兜底（五版表 8.3 全赋值）。
const PD24011_CP = 9; // TS 24.007 §11.2.3.1.3：SMS=9

const CP24011_TYPES = { 'cp-data': 0x01, 'cp-ack': 0x04, 'cp-error': 0x10 };
const RP24011_TYPES = {
  'rp-data|ms->n': 0x00,
  'rp-data|n->ms': 0x01,
  'rp-ack|ms->n': 0x02,
  'rp-ack|n->ms': 0x03,
  'rp-error|ms->n': 0x04,
  'rp-error|n->ms': 0x05,
  'rp-smma|ms->n': 0x06,
};

// CP 表 8.1：多行单元格位模式（'0 0 0 0 0 0 0 1 CP-DATA'，44.018 §10.4.1 同款）；
// RP 表 8.3：['0 0 0','ms -> n','RP-DATA'] 三元行（3 位 + 方向 + 名称，Reserved 跳过）。
function parseTypeTables24011(tables) {
  const out = {};
  const LINE = /^([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01])\s+(.+)$/;
  for (const t of tables || []) {
    for (const cells of t.rows) {
      for (const cell of cells) {
        for (const line of String(cell).split('\n')) {
          const m = LINE.exec(line.trim());
          if (!m) continue;
          const name = m[9].trim().replace(/[.…\s]+$/, '');
          if (!name) continue;
          out[`${name.toLowerCase()}|`] = { type: parseInt(m.slice(1, 9).join(''), 2), mask: 0xff, dir: null };
        }
      }
      const digs = String(cells[0] || '').trim();
      if (/^[01] [01] [01]$/.test(digs) && cells.length >= 3) {
        const dir = String(cells[1] || '').replace(/\s+/g, '');
        const nm = String(cells[2] || '').trim();
        if (dir && nm && !/^reserved/i.test(nm)) {
          out[`${nm.toLowerCase()}|${dir}`] = { type: parseInt(digs.replace(/ /g, ''), 2), mask: 0xff, dir };
        }
      }
    }
  }
  return out;
}

// CP 类型表键带 '|' 后缀（无方向），与 RP 方向键 'name|dir' 统一前缀查找。
// 实例方向已知 → 单值；未知（RP-ACK/RP-ERROR 双向共用一张内容表）→ 每方向一实例。
function resolveMsgType24011(name, direction, msgTypes) {
  const key = `${name.toLowerCase()}|`;
  const dirEntries = Object.entries(msgTypes).filter(([k]) => k.startsWith(key));
  if (dirEntries.some(([, v]) => v.dir)) {
    const dirKey = direction
      ? (/network to ms/i.test(direction) ? 'n->ms' : /ms to network/i.test(direction) ? 'ms->n' : null)
      : null;
    if (dirKey) {
      const hit = dirEntries.find(([k]) => k.endsWith(`|${dirKey}`));
      if (hit) return [hit[1]];
    }
    return dirEntries.map(([, v]) => v);
  }
  const e = msgTypes[key] || null;
  return e ? [e] : [];
}

// len 列归一化：'1/2 octet'→'1/2'、'2-3 octets'→'2-3'、'3 bits'→'1'（RP-MTI 3 位 + spare 位 0）。
function normRow24011(r) {
  const len = (r.len || '').trim();
  const nl = /^3 bits$/i.test(len) ? '1' : len.replace(/\s*octets?\s*$/i, '').trim();
  return { ...r, len: nl };
}

function buildSchema24011(structured) {
  const parsed = parseTypeTables24011(structured.typeTables);
  const msgTypes = {};
  for (const [k, v] of Object.entries(CP24011_TYPES)) if (!parsed[`${k}|`]) msgTypes[`${k}|`] = { type: v, mask: 0xff, dir: null };
  for (const [k, v] of Object.entries(RP24011_TYPES)) if (!parsed[k]) msgTypes[k] = { type: v, mask: 0xff, dir: k.split('|')[1] };
  for (const [k, v] of Object.entries(parsed)) msgTypes[k] = { ...v };
  const ies = buildIes(structured.bits, structured.valueTables);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows(structured, m.rows).map(normRow24011);
    const cands = resolveMsgType24011(m.name, m.direction, msgTypes);
    if (!cands.length) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    for (const t of cands.length ? cands : [null]) {
      const inst = {
        section: m.section,
        tableId: m.tableId,
        direction: t?.dir ? (t.dir === 'ms->n' ? 'ms to network' : 'network to ms') : m.direction,
        pd: t && !t.dir ? PD24011_CP : null,
        mtOff: mtOffset(merged),
        rows: merged,
      };
      inst.msgType = t ? t.type : null;
      inst.msgMask = t ? t.mask : null;
      (out[m.name] = out[m.name] || []).push(inst);
    }
  }
  return {
    schema: { spec: '24011', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// ---- 23.040（SMS TPDU 层）建库 --------------------------------------------------------------
// TPDU 参数表（Abbr./Reference/P/R/Description）→ codec 行。与 IE 行表的结构差异：
//   1) octet1 是位打包（TP-MTI 2 位 + 若干 1 位参数）→ 单一 V 1 行，名称取规范全称
//      'TP-Message Type Indicator'（含 'message type' 词 → codec 自动行 + 掩码匹配），
//      msgMask=0x03；其余位参数并入该字节（problems 记录，解码显示原始八位组）；
//   2) TP-OA/TP-DA/TP-RA 自描述地址（长度按半八位组计）→ 行格式 ADDR（codec 扩展）；
//   3) TP-VP 长度由 octet1 的 TP-VPF 位定（0/1/7）→ 行格式 VP（codec 扩展）；
//   4) 最后一个 M 行之后的 O 行折叠为消息尾可变 V 行——TP-PI 位门控的
//      TP-PID/TP-DCS/TP-UDL/TP-UD 整段有字节则吞入、无则缺席（wire 级精确；
//      位级展开留语义层）；
//   5) TP-MTI 值：§9.2.3.1 散文（00/01/10 两两按方向成对，按名唯一）→ 常量；
//   6) TP-CD：k00 表丢行（f00 有）——按 TP-CDL 定义补可变 V 尾行，problems 记录。
const SMS23040_TYPES = {
  'sms-deliver': { type: 0x00, mask: 0x03 },
  'sms-deliver-report': { type: 0x00, mask: 0x03 },
  'sms-submit': { type: 0x01, mask: 0x03 },
  'sms-submit-report': { type: 0x01, mask: 0x03 },
  'sms-status-report': { type: 0x02, mask: 0x03 },
  'sms-command': { type: 0x02, mask: 0x03 },
};

const SMS23040_ADDR = new Set(['TP-OA', 'TP-DA', 'TP-RA']);

function rows23040(rows, problems, section, name) {
  const abbrOf = (r) => (r.name || '').replace(/\s*\d+\)\s*$/, '').trim().replace(/\s+/g, ' ');
  const presOf = (r) => (/^[MO]/i.test((r.presence || '').trim()) ? r.presence.trim().charAt(0).toUpperCase() : 'O');
  const isBit = (r) => /^(?:1|2)?b$/i.test((r.format || '').trim()); // 'b'（1 位）/ '2b'（TP-VPF）；TP-MTI 先行分支
  let lastM = -1;
  rows.forEach((r, i) => { if (presOf(r) === 'M' && !isBit(r)) lastM = i; });
  const out = [];
  const bits = [];
  const tail = [];
  let hasCD = false;
  rows.forEach((r, i) => {
    const abbr = abbrOf(r);
    if (abbr === 'TP-CD') hasCD = true;
    const pres = presOf(r);
    const ref = r.ref && /^TP-/i.test(r.ref) ? r.ref : null; // ref 列是参数全称，非节号
    if (abbr === 'TP-MTI') {
      out.push({ iei: '', name: 'TP-Message Type Indicator', ref, presence: 'M', format: 'V', len: '1' });
      return;
    }
    if (i > lastM) { tail.push({ abbr, pres, ref }); return; }
    if (isBit(r)) { bits.push(`${abbr}${pres === 'O' ? '(O)' : ''}`); return; }
    if (SMS23040_ADDR.has(abbr)) {
      out.push({ iei: '', name: abbr, ref, presence: pres, format: 'ADDR', len: (r.len || '').trim() });
      return;
    }
    if (abbr === 'TP-VP') {
      out.push({ iei: '', name: abbr, ref, presence: pres, format: 'VP', len: (r.len || '').trim() });
      return;
    }
    if (abbr === 'TP-CD') {
      // 长度 = TP-CDL（f00 表标 'o' 不准）——可变尾行
      out.push({ iei: '', name: abbr, ref, presence: pres, format: 'V', len: '' });
      return;
    }
    const m = /^(\d+)o$/i.exec((r.format || '').trim());
    out.push({ iei: '', name: abbr, ref, presence: pres, format: 'V', len: m ? m[1] : '1' });
  });
  if (tail.length) {
    const gated = tail.length > 1 || tail[0].abbr === 'TP-PI';
    out.push({
      iei: '',
      name: gated ? `${tail.map((t) => t.abbr).join(' / ')} (TP-PI bit gated)` : tail[0].abbr,
      ref: tail[0].ref,
      presence: tail.some((t) => t.pres === 'M') ? 'M' : 'O',
      format: 'V',
      len: '',
    });
  } else if (hasCD) {
    out.push({ iei: '', name: 'TP-CD', ref: null, presence: 'O', format: 'V', len: '' });
  }
  if (name === 'SMS-COMMAND' && !tail.length && !hasCD) {
    // k00 表丢了 TP-CD 行（f00 有，TP-CDL 定义 'length of the TP-CD field'）——补尾行
    out.push({ iei: '', name: 'TP-CD', ref: null, presence: 'O', format: 'V', len: '' });
    problems.push(`${section} ${name}: 表缺 TP-CD 行（k00 编辑遗漏，f00 有）——按 TP-CDL 定义补可变尾行`);
  }
  if (bits.length) problems.push(`${section} ${name}: octet1 位参数并入 TP-MTI 字节（${bits.join(', ')}）`);
  return out;
}

function buildSchema23040(structured) {
  const msgTypes = {};
  for (const [k, v] of Object.entries(SMS23040_TYPES)) msgTypes[k] = { ...v, group: null };
  const ies = buildIes(structured.bits, structured.valueTables);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const rows = rows23040(m.rows, problems, m.section, m.name);
    const base = m.name.toLowerCase().replace(/\s*\(.*\)$/, '');
    const t = msgTypes[base] || null;
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd: null,
      mtOff: 0,
      rows,
    };
    inst.msgType = t ? t.type : null;
    inst.msgMask = t ? t.mask : null;
    if (!t) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    (out[m.name] = out[m.name] || []).push(inst);
  }
  return {
    schema: { spec: '23040', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// ---- 浏览器/通用入口：docx（或内含 docx 的 zip）→ { schema, structured, problems, stats } ----
// zipBytes: .docx 自身即 zip；也接受包着一个 .docx 的外层 zip（3GPP 官方分发形态），
// 或解开的 docx 目录 zip（含 word/document.xml）。.doc 老格式浏览器侧不处理。
async function ingestDocxZip(zipBytes, { spec, version }) {
  const files = await zipUnpack(zipBytes);
  const keys = Object.keys(files);
  let docx = files;
  let docxName = keys.find((n) => /\.docx$/i.test(n) && !n.startsWith('__MACOSX'));
  if (!keys.some((n) => /^word\/document\.xml$/i.test(n))) {
    if (!docxName) {
      if (keys.some((n) => /\.doc$/i.test(n)))
        throw new Error('老格式 .doc：请先在 Word 里转存为 .docx 再导入');
      throw new Error('zip 内没有 .docx（找到: ' + (keys.slice(0, 6).join(',') || '空') + '）');
    }
    docx = await zipUnpack(files[docxName]); // 外层 zip 包 docx → 再解一层
  }
  const docXmlKey = Object.keys(docx).find((n) => /^word\/document\.xml$/i.test(n));
  if (!docXmlKey) throw new Error('docx 内无 word/document.xml（不是有效 Word 文件？）');
  const stylesKey = Object.keys(docx).find((n) => /^word\/styles\.xml$/i.test(n));
  const styleMap = styleMapFromStylesXml(stylesKey ? bytesToUtf8(docx[stylesKey]) : null);
  const structured = ingestDocumentXml(bytesToUtf8(docx[docXmlKey]), styleMap, spec, version);
  const { schema, problems } = buildSchema(structured);
  return { schema, structured, problems, stats: structured.stats, docxName: docxName || '(docx)' };
}

function sampleStopHit(spec, iei, msgType = null) {
  for (const q of SAMPLE_STOP_ROWS) {
    if (q.spec !== spec || !q.ieis) continue; // BJ：row 条目（行名键）不经 iei 匹配器
    if (!q.ieis.includes(iei)) continue;
    if (q.msgTypes && !q.msgTypes.includes(msgType)) continue;
    return q;
  }
  return null;
}

// ---- BJ 批（v1.66.0）：行名键匹配器族 --------------------------------------
// 行名归一口径与 BI semanticDtapValue 同：trim + 去「(n.n)」节号注记 + lowercase
//（采样循环 name 已 lowercase，归一幂等）。row 条目必带 spec+row，id/reason/
// evidence/batch 台账字段与 (spec,iei) 条目同规（nas_quirks.test.js 台账卫生钉）。
function quirkRowKey(name) {
  return String(name || '').trim().replace(/\s*\(\d+(?:\.\d+)*\)\s*$/, '').toLowerCase();
}

function rowStopHit(spec, name, msgName = null, fmt = null) {
  const k = quirkRowKey(name);
  for (const q of SAMPLE_STOP_ROWS) {
    if (q.spec !== spec || !q.row || q.row !== k) continue;
    // BL（v1.68.0）：tshark RR 解剖表消息特定——同一行名在 A 消息有路径、B 消息无路径
    //（CKSN：PAGING RESPONSE 有路径门内 CLEAN / TALKER INDICATION 无路径恒病实证）。
    // 条目可选 msgs（正则源串，对消息名 test）与 fmt（行格式全等）——命中才停采，缺省全消息。
    if (q.msgs && !(msgName && new RegExp(q.msgs).test(msgName))) continue;
    if (q.fmt && q.fmt !== fmt) continue;
    return q;
  }

// ---- TSHARK_ARTIFACTS：oracle L3 显示伪影豁免台账 --------------------------
// 豁免条件全 AND（任一不中仍按 EXTRACT 失败）：
//   ① spec ② 字段名全等（PDML field name）③ 声称跨度 size === claimedSize
//   ④ 帧切片 ≡ claimedSlice（逐字节，不是前缀）⑤ headerIntact：从 pos 起
//   [类型 2B][长度 2B][体 len B] 完整落帧内（帧侧结构自洽锚点）。
const TSHARK_ARTIFACTS = [
  {
    id: 'PFCP-322-METADATA-BINARY-DISPLAY',
    spec: '29244', field: 'pfcp.metadata.binary_metadata', claimedSize: 3, claimedSlice: '014200', headerIntact: true,
    reason: 'tshark 4.6.8 PFCP Metadata（IE 322，8.2.219）解剖器显示伪影：binary_metadata 字段 pos/size 指向 IE 头 3 字节（0142 00）而 value 为帧外自产值——五起（db9ac5/8d8bd2/9545e9/e08713/78ee81）均不在帧内、亦非体任何校验和/摘要前缀，显示字段自证矛盾即证据不可用。帧 CLEAN、L2 12897 IE 全过、AY worktree 对拍同 5 起（AZ 前已存在）；记 artifacts 如实计数，322 体不冒充已核',
    evidence: 'tmp/_ba1_322_probe.mjs + tmp/_ba1_322_probe_result.json（单帧 PDML 复现）+ tmp/_ba_review_az1_ext_k10_2024.json（评审段五起）',
    batch: 'BA（v1.58.0）',
  },
];

function tsharkArtifactMatch({ spec, field, pos, size, frameHex }) {
  if (typeof pos !== 'number' || typeof size !== 'number' || !frameHex) return null;
  for (const a of TSHARK_ARTIFACTS) {
    if (a.spec !== spec || a.field !== field) continue;
    if (a.claimedSize != null && size !== a.claimedSize) continue;
    const slice = frameHex.slice(pos * 2, (pos + size) * 2);
    if (!slice || (a.claimedSlice != null && slice !== a.claimedSlice)) continue;
    if (a.headerIntact) {
      const lenHex = frameHex.slice((pos + 2) * 2, (pos + 4) * 2);
      const len = parseInt(lenHex, 16);
      if (!Number.isFinite(len) || len < 0 || pos + 4 + len > frameHex.length / 2) continue;
    }
    return a;
  }
  return null;
}

// ==== tools/nassample.mjs ====
// nassample.mjs — M4 对拍采样器：schema 驱动随机消息 → JSONL（供 pycrate 线缆级校验 /
// 全版本回环门禁）。采样规则：M 行必采（V 按定长随机字节 / VH 随机半八位组 / TV 按 len-1 /
// TLV-LV 优先 IE 布局字段采样、否则按 len 区间随机）；C/O 行 p=0.4 随机出现；T 行 p=0.3。
// 用法：node tools/nassample.mjs --schema <schema.json> --samples <N> --out <file.jsonl>
//       [--seed 42] [--msgs 正则] [--allow-stopped 1]

// mulberry32（与 src/schema/ast.js 同族）
function rng32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- 批次 W：值域语义采样（按 IE 名白名单） -------------------------------------
// 目标：消除「线缆结构合法但随机值违反内容语义」类 malformed——值内长度前缀与实际
// 字节数一致、PFCP 标志位（V4/V6）与变长地址部分一致、BCD 数字域合法。
// 只覆盖高杠杆 IE；嵌入协议类（RAN Transparent/CAMEL 容器等）保持随机（既定归因）。
function rndByte(rng) { return Math.floor(rng() * 256); }
function bcdDigits(rng, nDigits) {
  const out = [];
  let left = nDigits;
  while (left >= 2) { out.push((Math.floor(rng() * 10) << 4) | Math.floor(rng() * 10)); left -= 2; }
  if (left) out.push((Math.floor(rng() * 10) << 4) | 0xf); // 奇数位：末半字节 F 结束标记
  return out;
}
function ipv4(rng) { return [rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]; }
function ipv6(rng) { return Array.from({ length: 16 }, () => rndByte(rng)); }

    // 须先于下方通用 MM CONTEXT 分支。
    return Uint8Array.from([0x03, 0x27, 0x00, 0x40, 0x02, 0x30, 0x00, 0x00]);
  }
  if (/MM CONTEXT/.test(n) && spec === '29274') {
    // 8.38（iei 103-108 行，GSM triplets 形）：flags(0x00) + 序字节(0x10——nr_tri=1、
    // UAMBR/SAMBR 指示位 0) + 1×triplet（KC 8B + RAND 16B + SRES 4B）+ UE/MS 能力长度
    // 与 MEI 长度三零字节封口 = 33B。隔离+真帧双口径 CLEAN 的**定长**形（探针 AR-7：
    // 同语境下随机 triplet 字节判违——内容敏感，整体零随机定形）。注：8.90 SRVCC
    // 行名亦含 MM CONTEXT，已由上方前缀分支截获。
    return Uint8Array.from([0x00, 0x10,
      0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08,
      0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1a, 0x1b, 0x1c, 0x1d, 0x1e, 0x1f, 0x20,
      0x01, 0x02, 0x03, 0x04, 0x00, 0x00, 0x00]);
  }
  // 7.7.38 UTRAN transparent container（×2/版）：AN 期立档「值内嵌 RRC 消息（tshark 按
  // UPER 解剖）不建模」——协议判读有误（29060 侧值为 RANAP APER 非 RRC），且探针帧体
  // 错位判定无效；AW 批（v1.54.0）已勘正为零串定形建模（见上方 AW 块）。
  if (/^USER LOCATION INFORMATION/.test(n) && spec === '29274') {
    // 8.21（GTPv2 侧）：oct5 八个存在标志与后续条件字段体必须自洽——位布局随机 flags
    // （实测帧 0x83=ExtMacro+SAI+CGI）而体字节缺席，tshark 按标志读 e212.* 越界（AM 探针：
    // [83] 判违、RAI+3B 越界判违；空 flags 干净，RAI+6B、CGI+7B 亦净——采最小一致内容
    // 空 flags=空 ULI 合法形态）。同名 29.060 §7.7.51 ULI 结构相反（纯 RAI 六字节体、
    // 无 flags 字节，现状布局采样即合法）——spec 限定防误伤 29060。
    return Uint8Array.from([0x00]);
  }
  // ---- AO 批（v1.47.0）：29274 容器尾定点（探针 Q1/R1/T1/T3 变体裁决）----
  // §8.132 Secondary RAT Usage Data Report 于 AR 批（v1.50.0）改为 27B 全形建模（上方
  // AR 块）——AO 期「12B 定长」缺 DL/UL 各 8B 计数域（tshark 双时间戳后无条件读），
  // 正帧溢读后续 IE 即判违，故当期回滚立档。§8.90 SRVCC 同于 AR 批破案。
  if (n === 'EXTENDED TRACE INFORMATION' && spec === '29274') {
    // 8.136：PLMN digits(3B)+Trace ID(3B)+Triggering Events/Trace Depth/List of Interfaces
    // 三个长度前缀段——位布局随机长度前缀（实测 trig_event_len=192）而段体缺席越界。
    // 探针 Q1：三段全零长度串（12B）干净。
    return Uint8Array.from([0x21, 0x63, 0x54, 0x12, 0x34, 0x56, 0, 0, 0, 0, 0, 0]);
  }
  if (n === 'MONITORING EVENT EXTENSION INFORMATION' && spec === '29274') {
    // 8.137：flags+SCEF Reference ID(4B)+SCEF ID Length+SCEF ID(+SRIE=1 时的 report 段)。
    // 布局随机 SCEF ID Length（实测 59）而 ID 体缺席越界；探针 R1：flags=0+SCEF ID
    // len=1+1 字节（7B）干净（无 report 段）。
    return Uint8Array.from([0x00, 0x00, 0x00, 0x00, 0x01, 0x01, 0x61]);
  }
  if (/^PACKET TMSI/.test(n) && spec === '29274') {
    // 8.41：P-TMSI 定长 4B（布局 open 行随机 2B——探针 T2 2B 判违、T1 4B 干净）。
    return Uint8Array.from([rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'P-TMSI SIGNATURE' && spec === '29274') {
    // 8.42：P-TMSI Signature 定长 3B（探针 T3）。
    return Uint8Array.from([rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'TMSI' && spec === '29274') {
    // 8.23：TMSI 定长 4B（TS 23.003）——布局 open 行（'5-n*'，字段名含规范散文）采 3B，
    // 解剖器读第 4 字节越界（j50/j60 CS Paging Indication 帧，IE 恰为帧尾）；4B 双语境
    // CLEAN（AQ 探针 v2；3B 帧中段因溢读后续字节假净——位置依赖，与 AO 201 同族教训）。
    return Uint8Array.from([rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  // 立档不建模：§8.38 MM Context（超复杂 bitmask 容器 ×8）与 §8.90 Additional MM
  // context for SRVCC（内嵌 Classmark 2/3 链 + gsm_a 副解构，探针 S1/S2 均 MAL——×4）。
  if (n === 'NODE NUMBER') {
    // 8.106：Length of Node Number 与内容字节数一致（节点号为数字串）
    return Uint8Array.from([0x01, 0x30 + Math.floor(rng() * 10)]);
  }
  if (n === 'LOAD METRIC') {
    // 29.274 §8.xxx：Load Metric 取值 0..100（百分比）——随机全域会被独立实现方判非法。
    return Uint8Array.from([Math.floor(rng() * 101)]);
  }
  if (n === 'PRESENCE REPORTING AREA ACTION') {
    // 8.108：oct9..14 计数域（TAI/RAI/MeNB/HeNB/ECGI/SAI/CGI）与变长列表必须自洽——
    // 位布局随机计数（实测帧 NoTAI=12/RAI=5/ECGI=16）而列表字节缺席，tshark 逐条越界
    // 异常（29274 五版 21 帧 malformed 主因；AL 批探针同时证伪「Action 0x07 超枚举」
    // 假设：0..7 全被解剖、0 标 Unknown 也接受）。
    // 最小一致内容：oct5 = Spare(bits8:5 全 0)|INAPRA(bit4)|Action(命名值 1..3，占 bits3:1)
    // + PRI 3 字节随机标识 + 计数全 0（空列表=合法形态）。AM-1 勘正（v1.45.0，AL 评审
    // P2-AL1）：原 <<4 把 INAPRA 写进 Spare 区（bit5=0x10），规范/schema 摄取/tshark
    // 三源一致 bit4=0x08；同批 P3-AL1 勘正「实读 2 bit」表述——tshark action mask=0x03，
    // 对定义值 0..3 与规范 3 位（0x07）解码等价（0x07→Modify(3) 逐值实证），仅 v≥4
    // 越界值分歧，Action 仍按规范 3 位写 1..3。TAI 条目 5 字节已实证（1×4B/1×6B 判违、
    // 15×5B 干净）；RAI 计数>1 有未解怪癖（1×6B 干净/2×6B 判违）——列表建模暂不启用。
    const oct5 = (Math.floor(rng() * 2) << 3) | (1 + Math.floor(rng() * 3));
    return Uint8Array.from([oct5, rndByte(rng), rndByte(rng), rndByte(rng), 0, 0, 0, 0, 0, 0]);
  }
  if (/^FULLY QUALIFIED TEID \(F-TEID\)$/.test(n)) {
    // 8.22：V4/V6 双 0（不带地址，仅 TEID）+ Interface Type 低 6 位；TEID 4 字节。
    // 本 schema 只建模 flag+TEID 定长部（IP 地址为条件变长部，未摄取）——双 0 形态
    // 使 tshark 与本构建解析结构一致。
    const ifType = Math.floor(rng() * 16);
    return Uint8Array.from([ifType, rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'SCEF PDN CONNECTION') {
    // 29.060 7.7.121：APN Length 与实际 APN 字节数一致（本布局建模 1 字节 APN）
    return Uint8Array.from([0x01, 0x61 + Math.floor(rng() * 26)]);
  }
  return null;
}

// PFCP：标志位与变长地址部分一致（V4/V6 恒有且仅有所选地址族）。
// v1.42.0 P3-6：导出——原先仅内部使用，PFCP 半边零测试不可钉（同 semanticGtpValue 的
// 剥尾注为防御性归一化，非「激活」，叙事勘正见上）。
function semanticPfcpValueImpl(name, rng) {
  const n = String(name || '').trim().replace(/\s*\(\d+(?:\.\d+)*\)\s*$/, '').toUpperCase(); // 防御性归一化（同 semanticGtpValue）
  if (n === 'PFD CONTENTS') {
    // 8.2.39（AY 批 v1.56.0）：octet 5 = 内容类型标志位（ADNP/AURL/AFD/DNP/CP/DN/URL/FD）
    // + octet 6 Spare——布局只建模这两字节、无内容体行；flags 随机置位（实测帧 0xfd=8 位
    // 全置）时 tshark 按位读 8 段长度前缀内容即越界判违（58 Application ID's PFDs 组内
    // 嵌套 61 出现，扩窗 seed 2024 实测 15 帧/版）。零标志形 [00 00] = 最小一致形（探针
    // tmp/_v10_ay9：[00 00] CLEAN 29 字段全解剖、[fd 00] MAL 负对照）。AT 立档「tshark
    // 需内联 AppID+PFD Context 全形」由此收口。
    return Uint8Array.from([0x00, 0x00]);
  }
  if (n === 'NODE ID') {
    // 8.2.38：Type 0=IPv4（4B）/ 1=IPv6（16B）
    return rng() < 0.7
      ? Uint8Array.from([0x00, ...ipv4(rng)])
      : Uint8Array.from([0x01, ...ipv6(rng)]);
  }
  if (n === 'F-SEID') {
    // 8.2.37：位序与 F-TEID **相反**——V4=bit2(0x02)/V6=bit1(0x01)（schema hi=2/hi=1）。
    const v4 = rng() < 0.75;
    const body = Array.from({ length: 8 }, () => rndByte(rng));
    return Uint8Array.from([v4 ? 0x02 : 0x01, ...body, ...(v4 ? ipv4(rng) : ipv6(rng))]);
  }
  if (n === 'F-TEID') {
    // 8.2.3：位序 V4=bit1(0x01)/V6=bit2(0x02)——原「v4?0x02:0x01」与 schema 及 tshark
    // 实测（0x02→V6 Present）相反：分支产物恒声称 V6 却给 IPv4（或反之），tshark 按标志
    // 读 16B IPv6 越界——F-TEID 只在 29244 组内出现，病面藏于组桶（311/Create PDR 炸因）。
    const v4 = rng() < 0.75;
    const body = Array.from({ length: 4 }, () => rndByte(rng));
    return Uint8Array.from([v4 ? 0x01 : 0x02, ...body, ...(v4 ? ipv4(rng) : ipv6(rng))]);
  }
  if (n === 'UE IP ADDRESS' || n === 'SOURCE IP ADDRESS' || n === 'ALTERNATIVE SMF IP ADDRESS') {
    const v4 = rng() < 0.75;
    const flags = v4 ? 0x02 : 0x01; // 其余标志（S/D/CHV/IP6PL/MPL/PPE）全 0
    return Uint8Array.from([flags, ...(v4 ? ipv4(rng) : ipv6(rng))]);
  }
  // ---- AN 批（v1.46.0）：29244 组内子 IE「标志位与条件字段体自洽」族 + FQ-CSID/池标识 ----
  // 与 8.21 ULI 同病族：布局只摄取 flags 行（条件地址/列表行未摄取），随机置位 → tshark
  // 按标志读地址/列表越界。探针口径（k10 病帧 lastField 实证：remote_gtp_u_peer.flags.v6、
  // packet_rate_status.flags.ul、mapped_n6…flags.v4、mac_address.flags.sour 各族停点）。
  if (n === 'REMOTE GTP-U PEER' || n === 'MAPPED N6 IP ADDRESS' || n === 'MAC ADDRESS' || n === 'PACKET RATE STATUS') {
    // flags 全 0 = 无条件地址/无 DL/UL 计数体/空包速率状态——最小一致内容。
    return Uint8Array.from([0x00]);
  }
  if (/FULLY QUALIFIED.*(PDN CONNECTION SET|CSID)/.test(n)) {
    // 8.2.43：Node-ID Type(4b)=0 IPv4 + Number of CSIDs(4b)=1 + 4B 地址 + 1×2B CSID
    // （与 GTP 侧 FQ-CSID 同构；布局随机 num 与体长不配 → csid/num_csid 越界）。
    return Uint8Array.from([0x01, ...ipv4(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'UE IP ADDRESS POOL IDENTITY') {
    // 8.2.128：Pool Id Length(2B) 与实际标识字节数一致（布局随机 2B 长度前缀 →
    // ue_ip_address_pool_length 巨值越界）；取 len=1 + 1 字节标识。
    return Uint8Array.from([0x00, 0x01, 0x61 + Math.floor(rng() * 26)]);
  }
  // ---- AT 批（v1.52.0）：29244 组内子 IE 清账族——十桶病根 = 布局摄取形态与
  // tshark 解剖器期望不配（标志位声称的条件内容缺席 / 特异布局需补域 / 需最小形）。
  // 全部形经隔离探针 + 真组合成双口径裁决（tmp/_v9_at_probe4-8）。
  if (n === 'SDF FILTER') {
    // 8.2.5：tshark 在 flags 后无条件读 [Spare 1B][FD Length 2B][FD 内容 lenB]——
    // 最小形 flags0+spare0+FD 空；FD 形 flags=0x01+空描述同样 CLEAN（fd 内容随机易炸）。
    return Uint8Array.from([0x00, 0x00, 0x00, 0x00]);
  }
  if (n === 'FAILED RULE ID') {
    // 8.2.80：[Rule ID Type 1B][Rule ID value N B]——值宽跟随被引 IE：PDR(0)/MAR(4)
    // 2B（8.2.36/8.2.123），FAR(1)/QER(2)/UBR(3) 4B（8.2.74/75/xx）；tshark 按类型读宽。
    const t = Math.floor(rng() * 5);
    const nb = t === 1 || t === 2 || t === 3 ? 4 : 2;
    return Uint8Array.from([t, ...Array.from({ length: nb }, () => rndByte(rng))]);
  }
  if (n === 'GTP-U PATH INTERFACE TYPE' || n === 'NUMBER OF UE IP ADDRESSES' || n === 'LINK-SPECIFIC MULTIPATH IP ADDRESS' || n === 'MPTCP LINK-SPECIFIC IP ADDRESS') {
    // 8.2.166 / 8.2.183 / 8.2.158：唯一 CLEAN 形 = [0x00]——tshark 对 N3/N9（241）、
    // IPv6/IPv4（268）、NV6/NV4/V6/V4（229）置位都要读后续接口/计数字节而布局/期望不配。
    return Uint8Array.from([0x00]);
  }
  if (n === 'DL DATA PACKETS SIZE') {
    // 8.2.173：恰 2B（tshark 读 16bit 后残留即炸）。
    return Uint8Array.from([rndByte(rng), rndByte(rng)]);
  }
  if (n === 'CP IP ADDRESS') {
    // 8.2.199：位序 V4=0x02/V6=0x01（与 F-TEID 相反！schema hi=2/hi=1 + tshark 双证）。
    return rng() < 0.75
      ? Uint8Array.from([0x02, ...ipv4(rng)])
      : Uint8Array.from([0x01, ...ipv6(rng)]);
  }
  if (n === 'MPQUIC ADDRESS INFORMATION') {
    // 8.2.226：[flags][Proxy Type][Proxy Port 2B][地址按 flags]——位序 V4=0x01/V6=0x02。
    const v4 = rng() < 0.75;
    return Uint8Array.from([v4 ? 0x01 : 0x02, 0x00, rndByte(rng), rndByte(rng), ...(v4 ? ipv4(rng) : ipv6(rng))]);
  }
  if (n === 'MBS SESSION IDENTIFIER' || n === 'MBSN4RESP-FLAGS') {
    // 8.2.206 / 8.2.211：flags 位随机置位 → tshark 读 TMGI 6B / NIDI 源地址长度域越界；
    // 0x00 最小形 CLEAN（残留 Note 不致命，但零残留更净）。
    return Uint8Array.from([0x00]);
  }
  if (n === 'LOCAL INGRESS TUNNEL') {
    // 8.2.209：[flags][UDP Port 2B][V4 地址 4B]——位序 V4=0x01/V6=0x02。
    const v4 = rng() < 0.75;
    return Uint8Array.from([v4 ? 0x01 : 0x00, rndByte(rng), rndByte(rng), ...(v4 ? ipv4(rng) : [])]);
  }
  if (n === 'RAT TYPE') {
    // def/ref 双空（schema 275 行）落 2-9B 随机的唯一入口；tshark 读 1B 枚举（0..6 全收）。
    return Uint8Array.from([Math.floor(rng() * 7)]);
  }
  if (n === 'SOURCE INTERFACE') {
    // 8.2.2：1B（低半八位组 Interface value 0..3），open 尾已由 suppressExplicitTails 抑制。
    return Uint8Array.from([Math.floor(rng() * 4)]);
  }
  if (n === 'DOWNLINK DATA SERVICE INFORMATION' || n === 'DATA STATUS' || n === 'DL DATA STATUS') {
    // 8.2.27 / 8.2.179：flags 置位声明条件体（DLPSI→2B 等）而体不摄 → 0x00 最小形。
    return Uint8Array.from([0x00]);
  }
  if (n === 'IP MULTICAST ADDRESS') {
    // 8.2.137：位序 V4=0x02/V6=0x01 + 地址按 flags（同 292 族）。
    return rng() < 0.75
      ? Uint8Array.from([0x02, ...ipv4(rng)])
      : Uint8Array.from([0x01, ...ipv6(rng)]);
  }
  if (n === 'CP PFCP ENTITY IP ADDRESS') {
    // 8.2.135：位序同 CP IP Address（V4=0x02/V6=0x01），同族同治（Session Retention 组炸因）。
    return rng() < 0.75
      ? Uint8Array.from([0x02, ...ipv4(rng)])
      : Uint8Array.from([0x01, ...ipv6(rng)]);
  }
  if (n === 'N6 ROUTING INFORMATION') {
    // 8.2.243：DPO/DIPV6/DIPV4/SPO/SIPV6/SIPV4 六标志各声明条件地址/指示体而体不摄 →
    // 0x00 最小形（f34 实证六位全开连环炸）。
    return Uint8Array.from([0x00]);
  }
  // ---- AT 批续（URR/MAR 计量叶族，探针 11/12 矩阵）：Create/Update URR 内的条件体 IE。
  if (n === 'VOLUME THRESHOLD' || n === 'SUBSEQUENT VOLUME THRESHOLD' || n === 'DROPPED DL TRAFFIC THRESHOLD') {
    // 8.2.13 / 8.2.16 / 8.2.49：flags 置位声明 8B 计量体（DLVOL/ULVOL/TOVOL、DLBY/DLPA）
    // 而体不摄 → 0x00 最小形（flags+3×8B 亦 CLEAN，取最小）。
    return Uint8Array.from([0x00]);
  }
  if (n === 'EVENT THRESHOLD' || n === 'EVENT QUOTA') {
    // 8.2.113 / 8.2.112：flags 0 反而 MAL——tshark 无条件读 4B 计数；[0x01+4B] CLEAN。
    return Uint8Array.from([0x01, rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'QUOTA VALIDITY TIME') {
    // 8.2.132：布局 Timer 1B，tshark 读 4B（同 IE 35 家族口径）。
    return Uint8Array.from([rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'TIME QUOTA MECHANISM') {
    // 8.2.81：[Base Time Interval Type 1B][Base Time Interval 4B]——Rel-17 增 4B 间隔域，
    // 1B 形（spec 布局）与 ≤4B 形全 MAL，5B 起 CLEAN。
    return Uint8Array.from([0x00, rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'QOS MONITORING MEASUREMENT') {
    // 8.2.171（IE 248）：八标志各声明测量容器而体不摄 → 0x00 最小形（Session Report→
    // QoS Monitoring Report 组炸因）。
    return Uint8Array.from([0x00]);
  }
  if (n === 'OUTER HEADER CREATION') {
    // 8.2.56（IE 84）：desc 16bit——0x0000 干净；置 GTP-U/UDP/IPv4|IPv6 位则 tshark 强制
    // 读 TEID(4B)+地址；仅 UDP/IPv4 位（0x0400）无地址体反 MAL。
    const r = rng();
    if (r < 0.6) return Uint8Array.from([0x00, 0x00]);
    if (r < 0.8) return Uint8Array.from([0x01, 0x00, ...Array.from({ length: 4 }, () => rndByte(rng)), ...ipv4(rng)]);
    return Uint8Array.from([0x02, 0x00, ...Array.from({ length: 4 }, () => rndByte(rng)), ...ipv6(rng)]);
  }
  if (n === 'MULTICAST TRANSPORT INFORMATION') {
    // 8.2.207（IE 306）：[Spare][CTEID 4B][Distribution Addr Type(2b)|Len(6b)+地址]
    // + [Source Addr Type|Len + 地址]——**双地址块**，缺 Source 块 tshark 消化完仍判
    // malformed（探针 v9at26 实证）。Type 0=IPv4(len4)/1=IPv6(len16)。
    const v4 = rng() < 0.75;
    const d = v4 ? [0x04, ...ipv4(rng)] : [0x50, ...ipv6(rng)];
    const s = v4 || rng() < 0.5 ? [0x04, ...ipv4(rng)] : [0x50, ...ipv6(rng)];
    return Uint8Array.from([0x00, rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng), ...d, ...s]);
  }
  if (n === '5GS USER PLANE NODE ID') {
    // 8.2.143（IE 198）：布局只摄 BID 位，tshark 另有 SOUR 位（置位即读后续源接口域）
    // → 0x00 最小形（Created Bridge/Router Info 组炸因）。
    return Uint8Array.from([0x00]);
  }
  if (n === 'REDIRECT INFORMATION') {
    // 8.2.20：[Redirect Address Type 1B][Server Address Length 2B][Address]——布局长度
    // 行名带 docx 脚注后缀「=a」逃过 isInnerLenRow 修补 → 2B 随机巨值。type 1=IPv4/2=IPv6。
    return rng() < 0.75
      ? Uint8Array.from([0x01, 0x00, 0x04, ...ipv4(rng)])
      : Uint8Array.from([0x02, 0x00, 0x10, ...ipv6(rng)]);
  }
  if (n === 'FORWARDING POLICY') {
    // 8.2.23：布局只有「Forwarding Policy Identifier Length」行、标识内容行未摄取 →
    // 长度随机巨值越界；len=1..3 + 等长 ASCII 标识。
    const l = 1 + Math.floor(rng() * 3);
    return Uint8Array.from([l, ...Array.from({ length: l }, () => 0x61 + Math.floor(rng() * 26))]);
  }
  if (n === 'HEADER ENRICHMENT') {
    // 8.2.67：[Header Type 1B][Name Len 1B][Name][Value Len 2B][Value]——布局缺 Value
    // 段，tshark 读完 Name 强制读 Value Len 2B → [type 0][len1 'a'][0000] 最小形。
    return Uint8Array.from([0x00, 0x01, 0x61, 0x00, 0x00]);
  }
  if (n === 'VOLUME QUOTA' || n === 'SUBSEQUENT VOLUME QUOTA' || n === 'VOLUME MEASUREMENT') {
    // 8.2.50 / 8.2.86 / 8.2.44：同 Volume Threshold——flags 置位声明 8B 计量体而不摄 →
    // 0x00 最小形（NOP 位形亦 MAL，探针 v9at31）。
    return Uint8Array.from([0x00]);
  }
  if (n === 'MPTCP ADDRESS INFORMATION') {
    // 8.2.157（IE 228）：v4/v6 置位形 MAL（同 MPQUIC 首扫），最小形 [flags0][type][port] CLEAN。
    return Uint8Array.from([0x00, 0x00, rndByte(rng), rndByte(rng)]);
  }
  if (n === 'PMF ADDRESS INFORMATION') {
    // 8.2.159（IE 230）：MAC 形 [flags=0x08][MAC 6B][Port 2B] CLEAN；0x00/纯 V4/V6 形 MAL
    // （探针 v9at31——tshark 对 MAC 位形消化最完整）。
    return Uint8Array.from([0x08, ...Array.from({ length: 6 }, () => rndByte(rng)), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'TRACE INFORMATION') {
    // 8.2.108（IE 152）：[MCC/MNC 3B（BCD 数字 0-9）][Trace ID 3B][Triggering Events
    // Length 1B=1][Events 1B][Depth 1B][接口域 2B]——tshark 读完 Depth 强制再读 2B
    // （探针 v9at32：≤10B 全 MAL，11B CLEAN）；布局缺 Depth/接口域。
    const d = () => Math.floor(rng() * 10);
    return Uint8Array.from([
      (d() << 4) | d(), (d() << 4) | d(), (d() << 4) | d(),
      rndByte(rng), rndByte(rng), rndByte(rng),
      0x01, 1 + Math.floor(rng() * 15), 1 + Math.floor(rng() * 3), 0x00, 0x00,
    ]);
  }
  if (n === 'USER ID' || n === 'DL FLOW LEVEL MARKING' || n === 'THRESHOLDS' || n === 'THRESHOLD VALUES' || n === 'PACKET RATE') {
    // 8.2.101 / 8.2.66 / 8.2.196 / 8.2.63（IE 94）：flags 置位声明 len+体（IMEI 数字串/
    // TTC 2B/RTT-PLR 阈值/包速率 2B 项）而不摄 → 0x00 最小形（探针 v9at33/34/38——
    // Packet Rate 置位形反全 MAL，0x00 唯一净形）。
    return Uint8Array.from([0x00]);
  }
  if (n === 'MAC ADDRESSES DETECTED' || n === 'MAC ADDRESSES REMOVED') {
    // 8.2.103 / 8.2.104：[Number of MAC addresses k][k×6B MAC]——计数行不是 length 形
    // （名「Number of …」）不进内嵌长度修补，随机 k 与 6B 固定体不配 → k=1+单 MAC 形。
    return Uint8Array.from([0x01, ...Array.from({ length: 6 }, () => rndByte(rng))]);
  }
  if (n === 'UE LEVEL MEASUREMENTS CONFIGURATION') {
    // 8.2.245（IE 353）：[Job Type][k][k×Measurement Type][Time Period 3B]——tshark 无
    // 条件读 3B Time Period（探针 v9at42：缺/2B/4B 全 MAL，恰 3B CLEAN）。
    return Uint8Array.from([0x00, 0x01, 1 + Math.floor(rng() * 15), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'DL PERIODICITY') {
    // 8.2.221（IE 326）：布局 null 落随机长；tshark 读 [flags 1B][periodicity 4B]（探针
    // v9at46：≤4B 全 MAL，5B CLEAN）。
    return Uint8Array.from([0x00, rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'TRAFFIC PARAMETER THRESHOLD' || n === 'REQUESTED QOS MONITORING' || n === 'REPORTING FREQUENCY'
    || n === 'PACKET DELAY THRESHOLDS' || n === 'REPORTING THRESHOLDS') {
    // 8.2.220 / 8.2.167 / 8.2.168 / 8.2.169 / 8.2.240：Create/Update SRR 子树 flags 叶——
    // 0x00 形全 CLEAN（探针 v9at44），布局随机置位或缺布局落随机长的病面一并封死。
    return Uint8Array.from([0x00]);
  }
  if (n === 'PMF CONTROL INFORMATION') {
    // 8.2.156（IE 224）：tshark 只消化 flags 字节本身——PQPM/DRTTI 置位或带 QFI 体
    // （布局 Number of QFI 行）皆 MAL（探针 v9at50-53 全扫）；恰 1B flags（0/1/3）CLEAN。
    return Uint8Array.from([0x00]);
  }
  if (n === 'TIMER' || n === 'MINIMUM WAIT TIME') {
    // 8.2.35 / 8.2.170：布局 Timer 1B，tshark 按「Subsequent Time Threshold」读 4B
    // （探针 v9at7：1B/2B/3B 全 MAL，4B 起 CLEAN）。
    return Uint8Array.from([rndByte(rng), rndByte(rng), rndByte(rng), rndByte(rng)]);
  }
  if (n === 'L2TP USER AUTHENTICATION') {
    // 8.2.187（IE 278）：[Proxy Authen Type 2B][spare+PAI/PAR/PAC/PAN flags 1B][按标志
    // len+值]——tshark 把 type 读 16 位（布局只摄 1B），flags 随机置位即越界（探针 v9at59）。
    const forms = [
      [0x00, 0x01, 0x00],
      [0x00, 0x01, 0x01, 0x01, 0x61],
      [0x00, 0x01, 0x08, 0x01, 0x61],
    ];
    return Uint8Array.from(forms[Math.floor(rng() * forms.length)]);
  }
  return null;
}

function fixedLenOf(lenStr) {
  const s = (lenStr || '').trim();
  if (s === '1/2') return 0.5;
  return /^\d+$/.test(s) ? parseInt(s, 10) : null;
}

// 'a-b' 区间 → 值字节数区间（len 列含框架字节：TLV 减 2、LV 减 1、E 类减 2）
function lenRangeOf(lenStr, fmt) {
  const s = (lenStr || '').trim();
  const m = /^(\d+)\s*-\s*(\d+)$/.exec(s);
  const hdr = fmt === 'LV' ? 1 : 2;
  // BK 批（v1.67.0）：固定单值 len（如 44.018 VGCS target mode '3'）——此前仅识别区间形，
  // 单值行落到 TLV/LV 随机 1-24B 长度回退 → 规范定长 TLV 值长随机（44018 ASSIGNMENT
  // COMMAND 实证：L=5 触发 tshark RR 解剖器读穿自爆 extraneous_data dissector bug）。
  // 固定单值 = [L-hdr, L-hdr] 定长档（值多样性在内容字节，长度合规优先）。
  if (!m) {
    const one = /^\d+$/.exec(s);
    if (!one) return null;
    const v = Math.max(1, parseInt(one[0], 10) - hdr);
    return [v, v];
  }
  return [Math.max(1, parseInt(m[1], 10) - hdr), Math.max(1, parseInt(m[2], 10) - hdr)];
}

// 采样一个 schema：返回 { lines, skipped, okMsgs }（lines = JSON 对象数组）
function sampleSchema(schema, N, seed, msgRe = null, opts = {}) {
  if (schema.spec === '29274') return sampleGtpcSchema(schema, N, seed, msgRe);
  if (schema.spec === '29060') return sampleGtpv1Schema(schema, N, seed, msgRe);
  // BF 批（v1.62.0）：29.281 GTPv1-U 与 29.060 同头形（PT=1）同行模型——此前走通用
  // 路径产空载荷（消息表只含 IE 行、无头行），oracle/gate 无对象。路由进 gtpv1 采样：
  // 头 0x32（v1|PT|S）+ Length=帧长−8 + consults 按 spec 查表（29281 零登记 = 无操作）。
  if (schema.spec === '29281') return sampleGtpv1Schema(schema, N, seed, msgRe);
  if (schema.spec === '29244') return samplePfcpSchema(schema, N, seed, msgRe);
  const rng = rng32(seed);
  const rnd = (n) => Math.floor(rng() * n);
  const rbytes = (n) => Uint8Array.from({ length: n }, () => rnd(256));
  const spec = schema.spec;
  // BK 批（v1.67.0）：dtap 族（GSMTAP ABIS oracle 接入面）——TI 半组特判的族集合；
  // BL（v1.68.0）族集合改 nas_quirks.mjs DTAP_SPECS 共享导出（加族单点改）。
  const dtapSpec = DTAP_SPECS.includes(spec);
  const lines = [];
  const skipped = {};
  let okMsgs = 0;

  // 行的值：优先按 IE 布局字段采样（值更合法），无布局则不透明随机字节。
  // V/TV 行定长校验：布局字节数 ≠ 定长 → 回退不透明（布局含开区间尾段等情况）。
  function sampleRowValue(r, fmt, flen) {
    const ref = r.def || (r.ref && schema.ies[r.ref] ? r.ref : null);
    if (ref) {
      const lay = schema.ies[ref].layouts[0];
      if (lay && lay.octets.length) {
        const framed = fmt === 'TV' || fmt === 'TLV' || fmt === 'TLV-E' || fmt === 'LV' || fmt === 'LV-E';
        const { bytes } = layoutSample(lay.octets, rng, framed);
        const expect = fmt === 'V' ? flen : fmt === 'TV' ? (flen != null ? flen - 1 : null) : null;
        // BK 批（v1.67.0）：TLV/LV-E/LV 族布局路径长度合规校验——此前 expect=null 直接
        // 采纳布局长度，行 len 列声明的值域（lenRangeOf）被旁路（44018 VGCS target mode
        // 固定 '3' 行采出 4B 值 → tshark RR 解剖器读穿自爆）。布局产出值长 ∉ 行声明值域
        // → 回退不透明路径（rg 档内采样）。
        const rgFramed = framed && fmt !== 'TV' ? lenRangeOf(r.len, fmt) : null;
        const okLen = expect != null ? bytes.length === expect
          : rgFramed ? (bytes.length >= rgFramed[0] && bytes.length <= rgFramed[1])
          : true;
        if (okLen) {
          if (bytes.length) return bytes;
        }
        // 定长不符 → 落到不透明回退（线缆级合法，内部语义可能被 oracle 拒：单列计）
      }
    }
    if (fmt === 'TLV' || fmt === 'TLV-E') {
      const rg = lenRangeOf(r.len, fmt);
      if (rg) return rbytes(rg[0] + rnd(Math.min(rg[1] - rg[0] + 1, 24)));
      return rbytes(1 + rnd(24));
    }
    if (fmt === 'LV' || fmt === 'LV-E') {
      const rg = lenRangeOf(r.len, fmt);
      if (rg) return rbytes(rg[0] + rnd(rg[1] - rg[0] + 1));
      return rbytes(1 + rnd(32));
    }
    if (fmt === 'V' && flen == null) {
      // 可变 V（尾行自定位，如安全保护帧的明文消息 / 附件消息的载荷）：采 2..9 字节，
      // 编码器原样写出、解码器吞到消息尾——仅当该行为表尾时解码才成立（否则后续行
      // 失败、该次尝试被丢弃，由重试机制消化）。
      return rbytes(2 + rnd(8));
    }
    if (fmt === 'TV' && flen != null) return rbytes(flen - 1);
    if (fmt === 'V' && flen != null) return rbytes(flen);
    return null;
  }

  for (const [msgName, insts] of Object.entries(schema.messages)) {
    if (msgRe && !msgRe.test(msgName)) continue;

    // 归一）——SECURITY PROTECTED 容器消息的 SHT=0 明文采样形无线缆语义（BU/BV 载体侧
    // KNOWN_FORM_NOTES 跳采的上游根因面）；--allow-stopped 1 保留旧采样行为（回退/诊断
    // 通道）。停采即消息整体不产帧，skipped 以 `#*` 键如实记账。边界：GTP 专用路径
    //（sampleGtpc/Gtpv1/Pfcp）不经本表——登记仅 NAS 族，扩展时按 spec 路由对应路径接线。
    if (!opts.allowStopped) {

      if (stopQ) { skipped[`${msgName}#*`] = `形态面停采（${stopQ.id}）`; continue; }
    }

      const instKey = `${msgName}#${ii}`;

    if (inst.rows.some((r, idx) => rowFormat(r) === 'V' && fixedLenOf(r.len) == null && idx !== lastIdx)) {
      skipped[instKey] = skipped[instKey] || '可变V非表尾（草稿 TBD）';
      continue;

    if (inst.rows.some((r) => (r.format || '').trim().toUpperCase() === 'TV-E')) {
      skipped[instKey] = skipped[instKey] || 'TV-E 格式未实现（附件 E）';

    }

      for (let k = 0; k < N * 3 && made < N; k++) {
        try {
          const parts = [];
          let ok = true;
          for (let ri = 0; ri < inst.rows.length; ri++) {
            const r = inst.rows[ri];
            const iei = (r.iei || '').replace(/[^0-9a-f]/gi, '');
            const fmt = rowFormat(r); // V/VH/T/TV1/TV/TLV/LV/TLV-E/LV-E 与 codec 同口径

            const name = (r.name || '').toLowerCase();
            const mandatory = /^M$/i.test((r.presence || '').trim());
            if (/extended protocol discriminator|security header type|message (identity|type)/.test(name)) continue; // 头行自动
            if (/^spare half octet$/.test(name) || /^protocol discriminator$/.test(name)) continue; // spare/PD 自动
            // BJ 批（v1.66.0）：行守卫 consult 迁 nas_quirks.mjs SAMPLE_STOP_ROWS 行名键
            //（rowStopHit）——BI 期 24008 四行硬编码 continue（skip indicator 钉 0 §10.3.1 /
            // Emergency Number List 上下文敏感停采 / Additional update type TV1-tF 证据空洞 /
            // Integrity algorithm TV1-t9 证据空洞）迁登记表，continue 落点与硬编码同位
            //（行 rng 判定前，采样流零漂移；条目见 nas_quirks.mjs DTAP-* 四条）。
            if (rowStopHit(spec, name, msgName, fmt)) continue;
            if (iei && r.iei.includes('TBD')) continue; // 规范 TBD 占位行不可编码
            if (fmt === 'UNK') { if (!mandatory) continue; ok = false; break; } // NOTE 行跳过；FFS 必配行不可采样
