<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRC Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* RRC Workbench v2 — 浅色仪器主题。令牌见 docs/DESIGN.md（Wireshark 字节窗格 + Carbon + Pttrns 分组列表） */
:root{
  --bg-page:#f4f5f6;--bg-panel:#ffffff;--bg-sunken:#fafafa;--bg-hover:#f4f4f4;
  --ink1:#1c1f22;--ink2:#575e64;--ink3:#8d939a;--ink4:#b4b9be;
  --accent:#0f62fe;--accent-hi:#0353e9;--ring:#78a9ff;
  --ok:#198038;--ok-bg:#e3f5e8;--warn:#b28600;--warn-bg:#fcf4d6;
  --danger:#da1e28;--danger-bg:#ffe9e9;--info-bg:#f4f4f4;
  --bd-strong:#a8adb3;--bd:#d5d9dd;--bd-faint:#e8eaec;
  --add-bg:#e6f4ea;--add-tx:#1a7f37;--del-bg:#ffebe9;--del-tx:#c72c27;
  --sans:'Inter',system-ui,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink1);font:400 13px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:#d0e2ff}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;height:44px;padding:0 16px;background:var(--bg-panel);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:7px;color:var(--ink1);font-weight:600;font-size:13px}
.logo .dim{color:var(--ink3);font-weight:400}
.tabs{display:flex;gap:0;height:100%}
.tab{border:0;background:transparent;color:var(--ink2);font:500 13px var(--sans);padding:0 13px;cursor:pointer;height:100%;border-bottom:2px solid transparent;border-top:2px solid transparent}
.tab:hover{color:var(--ink1);background:var(--bg-hover)}
.tab.on{color:var(--ink1);border-bottom-color:var(--accent)}
.ver{margin-left:auto;font:400 11px var(--mono);color:var(--ink3)}

/* ===== 页面骨架 ===== */
main{max-width:1280px;margin:0 auto;padding:20px 20px 56px}
.page{display:none}
.page.on{display:block}
.page-head{margin-bottom:14px}
.eyebrow{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
h1{font:600 16px/1.35 var(--sans);color:var(--ink1)}
.sub{font:400 12.5px/1.55 var(--sans);color:var(--ink2);margin-top:2px;max-width:90ch}
.panel{background:var(--bg-panel);border:1px solid var(--bd);border-radius:4px}
.panel-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd-faint);font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.panel-b{padding:12px}
.stack>*+*{margin-top:12px}
a{color:var(--accent)}

/* ===== 控件 ===== */
button{font-family:var(--sans)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:3px;border:1px solid var(--bd-strong);background:var(--bg-panel);color:var(--ink1);font:500 12px var(--sans);cursor:pointer;transition:background .08s,border-color .08s}
.btn:hover{background:var(--bg-hover)}
.btn:active{background:#ececee}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{height:24px;padding:0 8px;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--bd-strong);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--bg-panel);color:var(--ink2);font:500 12px var(--sans);padding:5px 12px;cursor:pointer;border-left:1px solid var(--bd)}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--bg-hover)}
.seg button.on{background:#e8f1ff;color:var(--ink1);box-shadow:inset 0 -2px 0 var(--accent)}
select,input[type=number],input[type=text]{background:var(--bg-panel);border:1px solid var(--bd-strong);border-radius:3px;color:var(--ink1);font:400 12.5px var(--mono);padding:4px 8px;outline:none;min-width:0}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--ring)}
select option{background:var(--bg-panel)}
input.bad,textarea.bad{border-color:var(--danger)}
textarea{width:100%;min-height:170px;background:var(--bg-panel);border:1px solid var(--bd-strong);border-radius:3px;color:var(--ink1);font:400 12px/1.55 var(--mono);padding:10px;outline:none;resize:vertical}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--ring)}

/* ===== 表单（Pttrns 分组行语义） ===== */
.frow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;align-items:center;gap:10px;min-height:34px;padding:2px 8px;border-radius:3px}
.frow:hover,.frow.hl{background:var(--bg-hover)}
.frow label{font:500 12px var(--sans);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow label small{display:block;font:400 10px var(--mono);color:var(--ink3)}
.frow .ctrl{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.fset{border:1px solid var(--bd-faint);border-radius:3px;padding:6px 4px;margin:4px 0;background:var(--bg-sunken)}
.fset>legend{font:500 10.5px var(--mono);color:var(--ink3);padding:0 5px}
.nest{margin-left:10px;padding-left:10px;border-left:1px solid var(--bd-faint)}

/* ===== bit 视图（Wireshark 字节窗格同构：浅底分组色块） ===== */
.bitwrap{display:flex;flex-wrap:wrap;gap:5px;font:500 12.5px var(--mono)}
.bgroup{display:flex;gap:1px;padding:2px;border-radius:2px;cursor:default}
.bgroup.c0 .bcell{background:#d9e6fb}.bgroup.c1 .bcell{background:#def0da}
.bgroup.c2 .bcell{background:#faeecd}.bgroup.c3 .bcell{background:#ececee}
.bgroup.hl{outline:2px solid var(--accent)}
.bgroup.preamble{background:var(--warn-bg)} .bgroup.preamble .bcell{color:var(--warn)}
.bgroup.open{background:#e8f1ff}
.bgroup.pad .bcell{color:var(--ink4);background:repeating-linear-gradient(45deg,#fafafa,#fafafa 3px,#f0f0f1 3px,#f0f0f1 6px);border-style:dashed}
.bgroup.mut .bcell{color:var(--danger);border-color:var(--danger)}
.bcell{width:20px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--bg-panel);border:1px solid var(--bd-faint);border-radius:2px;color:var(--ink1)}
.bitcap{margin-top:8px;font:400 11px var(--mono);color:var(--ink3);min-height:15px}
.bitcap b{color:var(--ink1);font-weight:500}
.hexout{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hexstr{flex:1;font:500 15px/1.4 var(--mono);color:var(--ink1);letter-spacing:.1em;word-break:break-all}
.copied{color:var(--ok)!important;border-color:var(--ok)!important}

/* ===== 树 ===== */
.tree{font:400 12.5px/1.85 var(--mono)}
.tnode{padding:0 8px;border-radius:2px}
.tnode .k{color:var(--ink2)} .tnode .v{color:var(--ink1)}
.tnode .ty{color:var(--ink3);font-size:10.5px;margin-left:8px}
.tnode .rng{float:right;color:var(--ink4);font-size:10.5px}
.tkids{margin-left:9px;padding-left:10px;border-left:1px solid var(--bd-faint)}
.tnode:hover{background:var(--bg-hover)}
.tnode.differ{background:#eef4fc;box-shadow:inset 2px 0 0 var(--accent)}

/* ===== diff ===== */
.diffpanes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dpane-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--bd-faint)}
.dpane-h .rel{font:500 12px var(--sans);color:var(--ink1)}
.dpane-h .n{font:400 11px var(--mono);color:var(--ink3)}
.dlines{padding:6px 0;font:400 12px/1.7 var(--mono);overflow:auto;max-height:430px;background:var(--bg-panel)}
.dline{display:flex;min-width:max-content;padding:0 12px}
.dline .ln{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--ink4);font-size:10px;user-select:none}
.dline .tx{white-space:pre;color:var(--ink1)}
.dline.add{background:var(--add-bg)} .dline.add .tx{color:var(--add-tx)}
.dline.del{background:var(--del-bg)} .dline.del .tx{color:var(--del-tx)}
.dline.gap{background:var(--bg-sunken)} .dline.gap .tx{color:transparent}
.dline.hl-ln{outline:1px solid var(--warn);outline-offset:-1px}
.finding{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--bd-faint);border-radius:3px;margin-bottom:8px;cursor:pointer;background:var(--bg-panel)}
.finding:hover{background:var(--bg-hover)}
.finding h4{font:500 12.5px var(--sans);color:var(--ink1)} .finding h4 code{font:500 12px var(--mono);color:var(--ink1)}
.finding p{font:400 12px/1.55 var(--sans);color:var(--ink2);margin-top:2px}
.finding.ok{background:var(--ok-bg)} .finding.ok h4{color:var(--ok)}
.finding.warn{background:var(--warn-bg)} .finding.warn h4{color:var(--warn)}
.finding.info{background:var(--info-bg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;margin-top:5px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.info{background:var(--ink3)}
.report{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column} .stat b{font:600 20px var(--sans)}
.stat span{font:400 11px var(--sans);color:var(--ink3)}
.verdict{flex:1;min-width:280px;font:400 12.5px/1.6 var(--sans);color:var(--ink1);border-left:2px solid var(--bd);padding-left:16px}
.empty{padding:20px 16px;text-align:center;color:var(--ink3);font:400 12.5px var(--sans);border-top:1px solid var(--bd-faint)}
.errcard{border:1px solid var(--danger);background:var(--danger-bg);padding:10px 14px;border-radius:3px;font:400 12px/1.6 var(--mono);color:var(--danger);margin-bottom:12px;display:none;white-space:pre-wrap}
.errcard.show{display:block}

/* ===== 表格（规范库） ===== */
.libtable{width:100%;border-collapse:collapse;font:400 12.5px var(--sans)}
.libtable th{font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--bd);background:var(--bg-sunken)}
.libtable td{padding:7px 10px;border-bottom:1px solid var(--bd-faint);color:var(--ink1);vertical-align:top}
.libtable tr:hover td{background:var(--bg-hover)}
.badge{font:500 11px var(--sans);padding:1px 7px;border-radius:2px;white-space:nowrap}
.badge.verified{color:var(--ok);background:var(--ok-bg)}
.badge.verified-derivation{color:#0e6027;background:#eef7f0}
.badge.reference{color:var(--warn);background:var(--warn-bg)}
.badge.synthetic,.badge.user-imported{color:var(--accent);background:#e8f1ff}
.badge.builtin{color:var(--ink2);background:var(--info-bg)}

/* ===== about（文档面板，非落地页） ===== */
.doc p{font:400 13px/1.7 var(--sans);color:var(--ink1);margin:0 0 10px}
.doc p.muted{color:var(--ink2)}
.doc dl{display:grid;grid-template-columns:210px 1fr;row-gap:8px;column-gap:16px;font:400 12.5px/1.6 var(--sans)}
.doc dt{color:var(--ink2);font-weight:500}
.doc dd{color:var(--ink1);margin:0}
.kv-num{font:500 13px var(--mono);color:var(--ink1)}
.checklist li{list-style:none;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd-faint);font:400 12.5px/1.6 var(--sans);color:var(--ink1)}
.checklist li:last-child{border-bottom:0}
.checklist .n{flex:none;width:18px;height:18px;border:1px solid var(--bd-strong);display:flex;align-items:center;justify-content:center;font:500 10.5px var(--mono);color:var(--ink2);margin-top:2px}
.foot{max-width:1280px;margin:0 auto;padding:0 20px 44px;font:400 11.5px var(--sans);color:var(--ink3)}
.mutcard.flash{animation:pulse .3s}
@keyframes pulse{0%{outline:2px solid var(--danger)}100%{outline:2px solid transparent}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.encgrid{display:grid;grid-template-columns:440px 1fr;gap:12px;align-items:start}
@media (max-width:960px){.diffpanes,.cmpgrid,.two-col,.encgrid{grid-template-columns:1fr}}

/* v1 变量名别名（JS 内联样式兼容层） */
:root{--t1:var(--ink1);--t2:var(--ink2);--t3:var(--ink2);--t4:var(--ink3);--brand:var(--accent);--bg-input:var(--bg-panel);--bd-subtle:var(--bd);--ok-dim:var(--ok-bg);--warn-dim:var(--warn-bg);--danger-dim:var(--danger-bg)}
.card{background:var(--bg-panel);border:1px solid var(--bd);border-radius:4px}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd-faint);font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.card-b{padding:12px}

/* ===== Spec 摄入向导 ===== */
.dropzone{border:1.5px dashed var(--bd-strong);border-radius:4px;padding:20px 16px;text-align:center;color:var(--ink2);font:400 12.5px var(--sans);cursor:pointer;transition:border-color .12s,background .12s;user-select:none}
.dropzone:hover{background:var(--bg-sunken)}
.dropzone.drag{border-color:var(--accent);background:#e8f1ff;color:var(--ink1)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font:500 11px var(--sans);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.err{background:var(--danger-bg);color:var(--danger)}
.pill.run{background:var(--info-bg);color:var(--ink2)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}

</style>
</head>
<body>
<div id="app-root"></div>
<script>

(function () {
'use strict';
const APP_VERSION = "1.85.0";
// ==== src/per/bits.js ====
// 位流原语：UPER 引擎的读写底座。MSB 先；octetAlign 是 UPER 长度行列式/开放类型的对齐动作。
class BitWriter {
  constructor() { this.bits = []; }
  write(value, n) {
    if (n > 31) {
      // >32 位用 BigInt（JS 位移按 32 位取模，2^33 级约束整数如 38.331 的
      // Orbital-r17 semiMajorAxis 会高位损坏）
      const v = BigInt(value);
      for (let i = n - 1; i >= 0; i--) this.bits.push(Number((v >> BigInt(i)) & 1n));
      return;
    }
    for (let i = n - 1; i >= 0; i--) this.bits.push((value >>> i) & 1);
  }
  writeBits(bits) { for (const b of bits) this.bits.push(b ? 1 : 0); }
  octetAlign() { while (this.bits.length % 8 !== 0) this.bits.push(0); }
  padToOctet() { this.octetAlign(); }
  get length() { return this.bits.length; }
  toBits() { return this.bits.slice(); }
  toHex() {
    this.octetAlign();
    let s = '';
    for (let i = 0; i < this.bits.length; i += 4)
      s += parseInt(this.bits.slice(i, i + 4).join(''), 2).toString(16).toUpperCase();
    return s;
  }
}

class BitReader {
  constructor(bits) { this.bits = bits; this.pos = 0; }
  read(n) {
    if (this.pos + n > this.bits.length)
      throw new Error(`位流不足：剩余 ${this.bits.length - this.pos} bit，还需 ${n} bit`);
    if (n > 31) {
      let v = 0n;
      for (let i = 0; i < n; i++) v = (v << 1n) | BigInt(this.bits[this.pos++]);
      return Number(v);
    }
    let v = 0;
    for (let i = 0; i < n; i++) v = (v << 1) | this.bits[this.pos++];
    return v;
  }
  readBit() { return this.read(1); }
  octetAlign() { while (this.pos % 8 !== 0) this.pos++; }
  remaining() { return this.bits.length - this.pos; }
}

function hexToBits(hex) {
  const clean = String(hex).replace(/[^0-9a-fA-F]/g, '');
  const bits = [];
  for (const ch of clean) {
    const v = parseInt(ch, 16);
    for (let i = 3; i >= 0; i--) bits.push((v >> i) & 1);
  }
  return bits;
}

// ==== src/per/uper.js ====
// IR 驱动的 UPER（unaligned PER, X.691）编码/解码引擎。
// 规则口径经 pycrate 0.8.1 源码交叉确证（tests/oracle/pycrate_oracle.py）：
//   - 无约束长度计数（整数/开放类型/串）：1 bit form(0=short) + 7 bit count，UPER 下不对齐
//   - ENUM/CHOICE 扩展索引：normally-small = 1 bit big(0) + 6 bit 值
//   - SEQUENCE 扩展：ext bit → root presence → root 字段 → [big(0)+6bit(位图位数-1) + 位图 + 每组一个开放类型]
//   - [[ ]] 版本组 = 一个扩展组（一个位图位），组内容编码为 SEQ 放入开放类型（补齐到八位组）
// 值形式见 docs/spec.md §3；choice 值 = {alt, val}；扩展组字段平铺在 seq 值对象里。


const ceilLog2 = (n) => Math.ceil(Math.log2(n));
const rangeBits = (l, u) => ceilLog2(u - l + 1);

// ---- 无约束长度计数（octets）：1 bit form + 7 bit count（单段 ≤127） ----
// X.691 计数行列式三阶梯（pycrate encode_count_ws 口径）：
//   0..127：0 + 7bit；128..16383：1 0 + 14bit；16384/32768/49152/65536：1 1 + 6bit 段码（分段起点）
function writeCount(w, count) {
  if (count >= 0 && count <= 127) { w.write(0, 1); w.write(count, 7); }
  else if (count <= 16383) { w.write(1, 1); w.write(0, 1); w.write(count, 14); }
  else if ([16384, 32768, 49152, 65536].includes(count)) {
    // 分段起点码（_CntUndef_LUT：16384→0, 32768→1, 49152→2, 65536→3）
    w.write(1, 1); w.write(1, 1); w.write([16384, 32768, 49152, 65536].indexOf(count), 6);
  } else throw new Error(`计数 ${count} 需要长度分段（>16383），暂不支持`);
}
function readCount(r) {
  const form = r.read(1);
  if (form === 0) return r.read(7);
  const undef = r.read(1);
  if (undef === 0) return r.read(14);
  return [16384, 32768, 49152, 65536][r.read(6)]; // 分段起点（后续段未支持，解码将位流不足报错）
}

// ---- normally-small 非负整数（ENUM/CHOICE 扩展索引、位图长度）：1 bit big + 6 bit 值 ----
function writeNS(w, value) {
  if (value > 63) throw new Error('暂不支持 normally-small ≥64');
  w.write(0, 1);
  w.write(value, 6);
}
function readNS(r) {
  const big = r.read(1);
  if (big) throw new Error('暂不支持 normally-small ≥64');
  return r.read(6);
}

// ---- 无约束整数：count(octets) + 二补码最小八位组（正值首八位组最高位为 1 时补 0x00） ----
function intOctets(value) {
  if (value === 0) return [0x00];
  if (value > 0) {
    const o = [];
    let u = value;
    while (u > 0) { o.unshift(u & 0xff); u = Math.floor(u / 256); }
    if (o[0] & 0x80) o.unshift(0x00);
    return o;
  }
  const o = [];
  let t = value;
  for (;;) { o.unshift(t & 0xff); t = Math.floor(t / 256); if (t === 0 && !(o[0] & 0x80)) break; if (t === -1 && (o[0] & 0x80)) break; }
  return o;
}
function writeUnconstrainedInt(w, value) {
  const o = intOctets(value);
  writeCount(w, o.length);
  for (const b of o) w.write(b, 8);
}
function readUnconstrainedInt(r) {
  const n = readCount(r);
  let v = r.read(8);
  if (v & 0x80) v -= 256;
  for (let i = 1; i < n; i++) v = v * 256 + r.read(8);
  return v;
}

// ---- 开放类型：count(八位组) + 内容（补齐到八位组） ----
function writeOpenType(w, contentBits) {
  const padded = contentBits.slice();
  while (padded.length % 8) padded.push(0);
  if (padded.length === 0) padded.push(0, 0, 0, 0, 0, 0, 0, 0); // empty content = one 0x00 octet (pycrate-verified)
  writeCount(w, padded.length / 8);
  w.writeBits(padded);
}
function readOpenTypeBits(r) {
  const n = readCount(r);
  const bits = [];
  for (let i = 0; i < n * 8; i++) bits.push(r.read(1));
  return bits;
}

function checkInt(node, value) {
  if (typeof value !== 'number' || !Number.isInteger(value))
    throw new Error(`INTEGER 需要整数值，得到 ${JSON.stringify(value)}`);
  if (value < node.min || value > node.max)
    throw new Error(`INTEGER 值 ${value} 超出约束 (${node.min}..${node.max}) 范围`);
}

function encodeNode(node, value, w, ctx) {
  switch (node.kind) {
    case 'bool': w.write(value ? 1 : 0, 1); break;
    case 'null': break;
    case 'int':
      if (node.min !== undefined && node.max !== undefined) {
        if (node.extensible) {
          const inRange = value >= node.min && value <= node.max;
          w.write(inRange ? 0 : 1, 1);
          if (inRange) { checkInt(node, value); w.write(value - node.min, rangeBits(node.min, node.max)); }
          else writeUnconstrainedInt(w, value);
        } else { checkInt(node, value); w.write(value - node.min, rangeBits(node.min, node.max)); }
      } else writeUnconstrainedInt(w, value);
      break;
    case 'enum': {
      const rootIdx = node.root.indexOf(value);
      if (node.extensible) {
        w.write(rootIdx >= 0 ? 0 : 1, 1);
        if (rootIdx >= 0) w.write(rootIdx, rangeBits(0, node.root.length - 1));
        else {
          const extIdx = (node.ext || []).indexOf(value);
          if (extIdx < 0) throw new Error(`未知枚举值 ${value}`);
          writeNS(w, extIdx);
        }
      } else {
        if (rootIdx < 0) throw new Error(`未知枚举值 ${value}（不可扩展枚举）`);
        w.write(rootIdx, rangeBits(0, node.root.length - 1));
      }
      break;
    }
    case 'bitstr': {
      const bits = value.bits;
      if (node.size && node.size.l === node.size.u) {
        if (bits.length !== node.size.u) throw new Error(`BIT STRING 需 ${node.size.u} 位，得到 ${bits.length}`);
        w.writeBits(bits);
      } else if (node.size && node.size.u < 65536) {
        if (bits.length < node.size.l || bits.length > node.size.u)
          throw new Error(`BIT STRING 长度 ${bits.length} 超出 SIZE(${node.size.l}..${node.size.u})`);
        w.write(bits.length - node.size.l, rangeBits(node.size.l, node.size.u));
        w.writeBits(bits);
      } else {

        writeCount(w, bits.length);
        w.writeBits(bits);

    case 'octstr': {
      let n;
      if (value.length % 2) throw new Error('OCTET STRING 需偶数个 hex 字符');
      n = value.length / 2;
      if (node.size && node.size.l === node.size.u) {
        if (n !== node.size.u) throw new Error(`OCTET STRING 需 ${node.size.u} 八位组`);
      } else if (node.size && node.size.u < 65536) {
        if (n < node.size.l || n > node.size.u) throw new Error('OCTET STRING 长度超出 SIZE 约束');
        w.write(n - node.size.l, rangeBits(node.size.l, node.size.u));
      } else writeCount(w, n);
      for (let i = 0; i < value.length; i += 2) w.write(parseInt(value.slice(i, i + 2), 16), 8);
      break;
    }
    case 'seq': encodeSeq(node, value, w, ctx); break;
    case 'choice': encodeChoice(node, value, w, ctx); break;
    case 'seqof': encodeSeqOf(node, value, w, ctx); break;
    case 'ref': {
      const target = ctx.get(node.name);
      if (!target) throw new Error(`未解析的类型引用: ${node.name}`);
      encodeNode(target, value, w, ctx);
      break;
    }

  }

// SEQUENCE：preamble = [ext bit] + root 可选字段 presence；扩展组一个位图位一个开放类型
function encodeSeq(node, value, w, ctx) {
  const optRoot = node.fields.filter(f => f.optional || f.default !== undefined);
  const hasExt = node.extensible;
  const presentGroups = hasExt
    ? (node.additions || []).map(g => g.fields.some(f => f.name in value))
    : [];

  if (hasExt) w.write(anyExt ? 1 : 0, 1);

  const defaultEq = (a, b) => a === b ||

    if (f.forbidden && f.name in value) throw new Error(`字段 ${f.name} 被 WITH COMPONENTS 约束禁止（ABSENT）`);

    else if (!(f.name in value)) throw new Error(`缺少必选字段 ${f.name}`);
    encodeNode(f.type, value[f.name], w, ctx);

  if (hasExt && anyExt) {
    const ldet = presentGroups.length;
    writeNS(w, ldet - 1);
    for (const p of presentGroups) w.write(p ? 1 : 0, 1);
    (node.additions || []).forEach((g, gi) => {
      if (!presentGroups[gi]) return;
      const inner = new BitWriter();
      if (g.single) {
        encodeNode(g.fields[0].type, value[g.fields[0].name], inner, ctx);
        writeOpenType(w, inner.bits);

      const innerOpt = g.fields.filter(f => f.optional);
      for (const f of innerOpt) inner.write(f.name in value ? 1 : 0, 1);
      for (const f of g.fields) {

      writeOpenType(w, inner.bits);
    });

}

function encodeChoice(node, value, w, ctx) {

    w.write(ri, rangeBits(0, node.alts.length - 1));
    encodeNode(node.alts[ri].type, value.val, w, ctx);

    const ai = (node.additions || []).findIndex(a => a.name === value.alt);
    if (ai < 0) throw new Error(`未知 CHOICE 分支 ${value.alt}`);
    if (!node.extensible) throw new Error(`不可扩展 CHOICE 无扩展分支 ${value.alt}`);
    w.write(1, 1);
    writeNS(w, ai);
    const inner = new BitWriter();
    encodeNode(node.additions[ai].type, value.val, inner, ctx);
    writeOpenType(w, inner.bits);

function encodeSeqOf(node, value, w, ctx) {
  if (!Array.isArray(value)) throw new Error('SEQUENCE OF 需要数组值');
  if (node.size && node.size.u < 65536) {
    if (value.length < node.size.l || value.length > node.size.u)

// tr: 可选位段收集器 {stack:[], root:[]}；label 由父级传入（字段名/分支名）

    case 'bitstr': {

function decodeChoice(node, r, ctx, tr) {

  for (let i = 0; i < n; i++) out.push(decodeNode(node.of, r, ctx, tr, `[${i}]`));

const APER = (() => {

const ceilLog2 = (n) => Math.ceil(Math.log2(n));

    writeConstrainedInt(w, ldet - node.size.l, node.size.u - node.size.l + 1);

    align(w);
    writeCount(w, ldet);

      w.write(idx, cdyn);

// SEQUENCE：preamble = [ext bit] + root 可选字段 presence 位（不对齐）；扩展组 = NS + 位图 + 每组开放类型
function encodeSeq(node, value, w, ctx) {

function encodeChoice(node, value, w, ctx) {

function encodeSeqOf(node, value, w, ctx) {

function decodeCharStr(node, r) {

// 位级布局：hex → {value, tree, usedBits, totalBits}

function decodeSeq(node, r, ctx, tr, label) {

// IR 校验 / 上下文 / 采样器。IR 定义见 docs/spec.md §3。

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const KINDS = new Set(['seq', 'choice', 'enum', 'int', 'bool', 'null', 'bitstr', 'octstr', 'charstr', 'oid', 'seqof', 'open', 'class', 'classref', 'ref', 'ffs']);

// 字符串采样字母表（与 aper.js 编码口径一致：每字符必须落在字母表内）
const CHAR_ALPHABETS = {
  visible: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-.',
  ia5: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,-@',
  printable: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ()+=,-./:?',
  numeric: '0123456789',
  utf8: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .-',
  bmp: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
};

function validateNode(node, path, errors) {
  const p = path || node.kind;
  if (!node || typeof node !== 'object') { errors.push(`${p}: 节点非对象`); return; }
  if (!KINDS.has(node.kind)) { errors.push(`${p}: 未支持的构词类型 ${node.kind}`); return; }
  switch (node.kind) {
    case 'seq': {
      const seen = new Set();
      const chk = (fields, zone) => {
        for (const f of fields || []) {
          if (!f.name) errors.push(`${p}: ${zone} 字段缺 name`);
          if (seen.has(f.name)) errors.push(`${p}: 字段重名 ${f.name}`);
          seen.add(f.name);
          validateNode(f.type, `${p}.${f.name}`, errors);
        }
      };
      chk(node.fields, 'root');
      for (const g of node.additions || []) chk(g.fields, `扩展组${g.rel || ''}`);
      if (node.extensible && !(node.additions || []).length) { /* 有扩展标记但无扩展组：合法 */ }
      break;
    }
    case 'choice': {
      const seen = new Set();
      for (const a of node.alts || []) {
        if (seen.has(a.name)) errors.push(`${p}: 分支重名 ${a.name}`);
        seen.add(a.name);
        validateNode(a.type, `${p}~${a.name}`, errors);
      }
      for (const a of node.additions || []) {
        if (seen.has(a.name)) errors.push(`${p}: 分支重名 ${a.name}`);
        seen.add(a.name);
        validateNode(a.type, `${p}~${a.name}`, errors);
      }
      break;
    }
    case 'enum':
      if (!node.root || !node.root.length) errors.push(`${p}: root 枚举值为空`);
      break;
    case 'int':
      if (node.min !== undefined && node.max !== undefined && node.min > node.max)
        errors.push(`${p}: INTEGER 约束 min(${node.min}) > max(${node.max})`);
      break;
    case 'seqof':
      if (!node.of) errors.push(`${p}: SEQUENCE OF 缺 of`);
      else validateNode(node.of, `${p}[]`, errors);
      if (node.size && node.size.l > node.size.u) errors.push(`${p}: SIZE ${node.size.l}..${node.size.u} 非法`);
      break;
    case 'bitstr': case 'octstr':
      if (node.size && node.size.l > node.size.u) errors.push(`${p}: SIZE ${node.size.l}..${node.size.u} 非法`);
      break;
    case 'charstr':
      if (node.size && node.size.l > node.size.u) errors.push(`${p}: SIZE ${node.size.l}..${node.size.u} 非法`);
      break;
    case 'oid':
      break;
    case 'class':
      // 信息对象类定义：字段类型递归校验
      for (const f of node.fields || []) {
        if (f.type) validateNode(f.type, `${p}.&${f.name}`, errors);
      }
      break;
    case 'classref':
      // 中间节点：resolveIOC 后不应残留在可编码 IR 中（校验期容忍）
      break;
    case 'open':
      if (!node.keyField) errors.push(`${p}: open 缺 keyField`);
      for (const r of node.table || []) validateNode(r.type, `${p}[${r.key}]`, errors);
      break;
    case 'ref':
      if (!node.name) errors.push(`${p}: ref 缺 name`);
      break;
  }
}

// 草稿宽容（15.0.0）：复制粘贴导致的重复字段名——保留首个出现，
// 其余丢弃（不去重则重复字段会被编码两次）。仅 draftTolerant 模块调用。
function dedupeDraftFields(mod) {
  const fix = (node) => {
    if (!node || typeof node !== 'object') return;
    if (node.kind === 'seq' || node.kind === 'choice') {
      const seen = new Set();
      const keep = (f) => (seen.has(f.name) ? false : (seen.add(f.name), true));
      node.fields = (node.fields || []).filter(keep);
      node.alts = (node.alts || []).filter(keep);
      for (const arr of [node.fields, node.alts]) for (const f of arr) fix(f.type);
      for (const g of node.additions || []) {
        if (g.fields) {
          g.fields = g.fields.filter(keep);
          for (const f of g.fields) fix(f.type);
        } else if (keep(g)) fix(g.type); // choice 的扁平扩展字段
      }
    }
    if (node.kind === 'seqof') fix(node.of);
    if ((node.kind === 'bitstr' || node.kind === 'octstr') && node.containing) fix(node.containing);
  };
  for (const t of mod.types.values()) fix(t);
}

function validateModule(mod, errors, registry) {
  if (!mod.name) errors.push('模块缺 name');
  if (mod.draftTolerant) dedupeDraftFields(mod);
  if (!(mod.types instanceof Map)) { errors.push('模块 types 应为 Map'); return; }
  for (const [name, node] of mod.types) validateNode(node, name, errors);
  // 引用闭包检查
  const ctx = makeCtx(mod, registry);
  const walk = (node, stack, from) => {
    if (!node) return;
    if (node.kind === 'ref') {
      const t = ctx.get(node.name);
      // 草稿宽容（15.0.0）：悬空引用不阻断摄入；该类型不可编码，其余类型不受影响
      if (!t && !mod.draftTolerant) errors.push(`${from}: 未解析的类型引用 ${node.name}`);
      // 递归引用（RRCReconfiguration → criticalExtensions → …）是合法 ASN.1：
      // 编码递归受值约束、采样有深度截断；这里只需防走不完，不再报错。
      else if (!stack.has(node.name)) walk(t, new Set([...stack, node.name]), from);
      return;
    }
    if (node.kind === 'seq' || node.kind === 'choice') {
      for (const f of [...(node.fields || []), ...(node.alts || []), ...((node.additions || []).flatMap(g => g.fields || []))])
        walk(f.type, stack, from);
    }
    if (node.kind === 'seqof') walk(node.of, stack, from);
    if ((node.kind === 'bitstr' || node.kind === 'octstr') && node.containing)
      walk(node.containing, stack, from);
  };
  for (const [name, node] of mod.types) {
    if (node && node.params) continue; // 参数化模板：体内参数名是悬空 ref，属预期
    walk(node, new Set([name]), name);
  }
}

function makeCtx(mod, registry) {
  // registry: 裸 Map<moduleName, module> 或 SchemaRegistry（.modules），
  // 跨模块 IMPORTS 解析用；两者都归一成模块集合。
  const mods = !registry ? null : (registry.modules ? registry.modules : registry);
  return {
    get(name) {
      if (mod.types.has(name)) return mod.types.get(name);
      if (mods) for (const m of mods.values()) if (m.types.has(name)) return m.types.get(name);
      return undefined;
    },
  };
}

// 随机采样合法值（roundtrip 属性测试与 UI 默认值用）。
// opts.maxItems：seqof 元素数上限（对拍 harness 用来避免 SIZE(1..65536) 采出巨型数组）
// opts.maxNodes：整个样本的结构节点预算（AP 族深图采样成本控制——可选省略修复后
// 原先"采样即抛"的大类型会采出完整深树，预算耗尽在可选位置按 absent 收敛）
function sampleValue(node, rng, ctx, depth = 0, opts = {}) {
  ctx = ctx || { get: () => undefined };
  const maxItems = opts.maxItems ?? Infinity;
  const budget = opts._budget || (opts._budget = { n: opts.maxNodes ?? 700 });
  if (node.kind === 'ref') {
    const t = ctx.get(node.name);
    if (!t) throw new Error(`采样失败：未解析引用 ${node.name}`);
    if (depth > 8) return null; // 递归类型截断：取可空路径由上层决定
    return sampleValue(t, rng, ctx, depth + 1, opts);
  }
  if (node.kind === 'seq' || node.kind === 'choice' || node.kind === 'seqof') {
    if (--budget.n < 0) throw new Error('采样预算耗尽（结构过大）');
  }
  switch (node.kind) {
    case 'bool': return rng() < 0.5;
    case 'null': return null;
    case 'ffs': return undefined; // 占位：不可采样
    case 'int': {
      // 联合约束（INTEGER (1..30|40|50...)）：必须采成员值（并集空洞值属于扩展段语义）
      if (node.parts && node.parts.length) {
        const part = node.parts[Math.floor(rng() * node.parts.length)];
        return part.min + Math.floor(rng() * (part.max - part.min + 1));
      }
      if (node.min !== undefined && node.max !== undefined)
        return node.min + Math.floor(rng() * (node.max - node.min + 1));
      return Math.floor(rng() * 200) - 50;
    }
    case 'enum': {
      const pool = node.root || [];
      return pool[Math.floor(rng() * pool.length)];
    }
    case 'bitstr': {
      let n = node.size ? (node.size.l === node.size.u ? node.size.u : node.size.l + Math.floor(rng() * (node.size.u - node.size.l + 1)))
        : Math.floor(rng() * 16);
      if (n > maxItems * 8) n = Math.max(node.size ? node.size.l : 0, maxItems * 8);
      return { bits: Array.from({ length: n }, () => (rng() < 0.5 ? 1 : 0)) };
    }
    case 'octstr': {
      let n = node.size ? (node.size.l === node.size.u ? node.size.u : node.size.l + Math.floor(rng() * (node.size.u - node.size.l + 1)))
        : 1 + Math.floor(rng() * 4);
      if (n > maxItems) n = Math.max(node.size ? node.size.l : 0, maxItems);
      let hex = '';
      for (let i = 0; i < n; i++) hex += Math.floor(rng() * 256).toString(16).toUpperCase().padStart(2, '0');
      return hex;
    }
    case 'charstr': {
      const alpha = node.alpha || CHAR_ALPHABETS[node.subtype] || CHAR_ALPHABETS.visible;
      let n = node.size ? (node.size.l === node.size.u ? node.size.u : node.size.l + Math.floor(rng() * (node.size.u - node.size.l + 1)))
        : 1 + Math.floor(rng() * 8);
      if (n > maxItems) n = Math.max(node.size ? node.size.l : 0, maxItems);
      let s = '';
      for (let i = 0; i < n; i++) s += alpha[Math.floor(rng() * alpha.length)];
      return s;
    }
    case 'oid':
      return '2.16.840.1.113694.1';
    case 'open': {
      const row = (node.table || [])[Math.floor(rng() * (node.table || []).length)];
      if (!row) throw new Error(`open 无可用表行`);
      return sampleValue(row.type, rng, ctx, depth, opts);
    }
    case 'seq': {
      const out = {};
      // open 字段（IOC 值）先选表行：键字段值必须与行一致，否则编码查表失败
      const opens = (node.fields || []).filter(f => f.type && f.type.kind === 'open');
      const chosen = new Map();
      for (const f of opens) {
        const rows = f.type.table || [];
        if (rows.length) chosen.set(f.name, rows[Math.floor(rng() * rows.length)]);
      }
      for (const f of node.fields || []) {
        if (f.forbidden) continue; // WITH COMPONENTS ABSENT：值域禁止
        if (f.type && f.type.kind === 'ffs') continue; // 草稿占位：永不采样
        // 空表 open（合法空对象集，如某些 X-ExtIEs ::= {...}）：可选字段按缺省省略；
        // 必选字段落到 open case 报错（容器无任何合法内容，本就不可编码）
        if (f.type && f.type.kind === 'open' && !(f.type.table || []).length
          && (f.optional || f.default !== undefined)) continue;
        const isOpt = f.optional || f.default !== undefined;
        if (isOpt && rng() < 0.5) continue;
        if (chosen.has(f.name)) {
          // 可选字段采样失败（如扩展容器行表为空——规范预留的空 ExtIEs 集）→ 按 absent 省略
          if (isOpt) { try { out[f.name] = sampleValue(chosen.get(f.name).type, rng, ctx, depth, opts); } catch { } }
          else out[f.name] = sampleValue(chosen.get(f.name).type, rng, ctx, depth, opts);
          continue;
        }
        if (isOpt) { try { out[f.name] = sampleValue(f.type, rng, ctx, depth, opts); } catch { } }
        else out[f.name] = sampleValue(f.type, rng, ctx, depth, opts);
      }
      for (const [fname, row] of chosen) {
        const kf = opens.find(o => o.name === fname).type.keyField;
        out[kf] = row.key; // 键字段以选中行为准（先行采样可能不一致）
      }
      for (const g of node.additions || []) {
        const take = rng() < 0.35;
        if (!take) continue;
        for (const f of g.fields) {
          if (f.type && f.type.kind === 'ffs') continue;
          if (f.type && f.type.kind === 'open' && !(f.type.table || []).length) continue; // 空表扩展容器
          if (f.optional && rng() < 0.4) continue;
          out[f.name] = sampleValue(f.type, rng, ctx, depth, opts);
        }
      }
      return out;
    }
    case 'choice': {
      const pool = node.alts || [];
      const a = pool[Math.floor(rng() * pool.length)];
      return { alt: a.name, val: sampleValue(a.type, rng, ctx, depth, opts) };
    }
    case 'seqof': {
      let n = node.size ? (node.size.l === node.size.u ? node.size.u : node.size.l + Math.floor(rng() * (node.size.u - node.size.l + 1)))
        : Math.floor(rng() * 5);
      if (n > maxItems) n = maxItems;
      return Array.from({ length: n }, () => sampleValue(node.of, rng, ctx, depth, opts));
    }
    default: throw new Error(`采样失败：${node.kind}`);
  }
}

// ==== src/asn1/parser.js ====
// ASN.1 子集解析器（3GPP RRC 方言）：文本 → AST（带行号）。
// 支持范围见 docs/spec.md §6；不支持项一律显式报错（带行号），不静默吞。
// AST 与引擎 IR 同构，区别仅在于 ref 未解析、default 为字面量、enum 扩展独立存放。

const KEYWORDS = new Set(['SEQUENCE', 'CHOICE', 'ENUMERATED', 'INTEGER', 'BOOLEAN', 'NULL',
  'BIT', 'OCTET', 'STRING', 'OF', 'SIZE', 'OPTIONAL', 'DEFAULT', 'BEGIN', 'END',
  'DEFINITIONS', 'SET']);

// 受限字符串族 → 引擎子类型名（aper.js charstr 口径）
const STR_TYPES = {
  VisibleString: 'visible', IA5String: 'ia5', PrintableString: 'printable',
  NumericString: 'numeric', UTF8String: 'utf8', BMPString: 'bmp',
};

function tokenize(src) {
  const toks = [];
  let i = 0, line = 1;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { line++; i++; continue; }
    if (/\s/.test(c)) { i++; continue; }
    if (c === '-' && src[i + 1] === '-') {
      // 注释：3GPP 实践为单行注释（X.680 的成对 -- 终止在正文含 -- 时会截断，
      // 如 v15.0.0 的 `-- Msg1 ...): -- UE may ...`），按行尾结束。
      i += 2;
      const cs = i;
      while (i < n && src[i] !== '\n') i++;
      // AP 族注释续行约定：注释尾部 `--` 后跟的分隔符串（如 --| --, --} --}| --},）
      // = 藏在注释里的结构性分隔符，逐个还原
      let ce = i;
      if (ce > cs && src[ce - 1] === '\r') ce--;
      const ctext = src.slice(cs, ce).replace(/\s+$/, '');
      const mSep = ctext.match(/--\s*([|,})\]]+)\s*$/);
      if (mSep) for (const ch of mSep[1]) toks.push({ t: ch, line });
      continue;
    }
    if (/[A-Za-z]/.test(c)) {
      // X.680 词法：连字符不能是末字符、不能连写（OPTIONAL-- 注释因此能正确切出）
      let j = i;
      while (j < n) {
        if (/[A-Za-z0-9_]/.test(src[j])) { j++; continue; }
        if (src[j] === '-' && j + 1 < n && /[A-Za-z0-9_]/.test(src[j + 1])) { j++; continue; }
        break;
      }
      // 38.331 v15.0.0 草稿占位伪类型 TYPE_FFS!/Type_FFS!（大小写变体均见）/ DEFAULT FFS!
      if (src[j] === '!' && /^(type_?)?ffs$/i.test(src.slice(i, j))) {
        toks.push({ t: 'ffs', line });
        i = j + 1; continue;
      }
      toks.push({ t: 'id', v: src.slice(i, j), line });
      i = j; continue;
    }
    if (/[0-9]/.test(c)) {
      let j = i;
      while (j < n && /[0-9]/.test(src[j])) j++;
      // 15.0.0：数字开头的枚举名（64QAM/256QAM）——数字后紧跟字母则整体按标识符
      if (j < n && /[A-Za-z_]/.test(src[j])) {
        let k = j;
        while (k < n && /[A-Za-z0-9_-]/.test(src[k])) k++;
        toks.push({ t: 'id', v: src.slice(i, k), line });
        i = k; continue;
      }
      toks.push({ t: 'num', v: parseInt(src.slice(i, j), 10), line });
      i = j; continue;
    }
    // 负数：约束里的一元负号（INTEGER (-270..270)）。裸 '-' 只会在数值前合法出现，
    // 标识符内的 '-' 已被上方 id 分支整体吞掉。
    if (c === '-' && /[0-9]/.test(src[i + 1] || '')) {
      let j = i + 1;
      while (j < n && /[0-9]/.test(src[j])) j++;
      toks.push({ t: 'num', v: parseInt(src.slice(i, j), 10), line });
      i = j; continue;
    }
    if (src.startsWith('...', i)) { toks.push({ t: '...', line }); i += 3; continue; }
    if (src.startsWith('::=', i)) { toks.push({ t: '::=', line }); i += 3; continue; }
    if (src.startsWith('[[', i)) { toks.push({ t: '[[', line }); i += 2; continue; }
    if (src.startsWith(']]', i)) { toks.push({ t: ']]', line }); i += 2; continue; }
    if (src.startsWith('..', i)) { toks.push({ t: '..', line }); i += 2; continue; }
    if (c === '"') {
      // ASN.1 cstring（双引号字符串字面量，FROM 约束/值赋值用）；"" 为转义引号
      let j = i + 1, buf = '';
      for (;;) {
        if (j >= n) throw new Error(`[ASN.1 行 ${line}] 字符串缺少闭合双引号`);
        if (src[j] === '\n') throw new Error(`[ASN.1 行 ${line}] 字符串不能跨行`);
        if (src[j] === '"') {
          if (src[j + 1] === '"') { buf += '"'; j += 2; continue; }
          j++; break;
        }
        buf += src[j]; j++;
      }
      toks.push({ t: 'str', v: buf, line });
      i = j; continue;
    }
    if (c === '&') {
      // 类字段引用：&name（CLASS 定义体 / Class.&field 类型引用）
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_-]/.test(src[j])) j++;
      if (j === i + 1) throw new Error(`[ASN.1 行 ${line}] & 后应有字段名`);
      toks.push({ t: 'amp', v: src.slice(i + 1, j), line });
      i = j; continue;
    }
    if (c === '@') {
      // 表约束键字段：({Set}{@fieldName})
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_-]/.test(src[j])) j++;
      if (j === i + 1) throw new Error(`[ASN.1 行 ${line}] @ 后应有字段名`);
      toks.push({ t: 'at', v: src.slice(i + 1, j), line });
      i = j; continue;
    }
    if (c === "'") {
      // ASN.1 字面量：'1100'B（位串）/ '0AB9'H（八位组串）。内容可含空格。
      const close = src.indexOf("'", i + 1);
      if (close < 0) throw new Error(`[ASN.1 行 ${line}] 字面量缺少闭合单引号`);
      const content = src.slice(i + 1, close).replace(/\s+/g, '');
      const base = src[close + 1];
      if (base !== 'B' && base !== 'H') throw new Error(`[ASN.1 行 ${line}] 字面量后缀应为 B 或 H，得到 "${base ?? 'EOF'}"`);
      toks.push({ t: 'lit', v: content, base, line });
      i = close + 2; continue;
    }
    if ('{}()[],;:.[]|'.includes(c)) { toks.push({ t: c, line }); i++; continue; }
    throw new Error(`[ASN.1 行 ${line}] 无法识别的字符 "${c}"`);
  }
  toks.push({ t: 'eof', line });
  return toks;
}

// 15.0.0 深草稿文本修复（逐行，tokenize 之前——tokenizer 全文先行，
// 散文里的引号/问号等任何杂字符都会先炸掉）：
// a) 行首 FFS 散文（FFS: / FFS. 开头）→ 剥离词与杂字符，只保留结构括号
//    （`FFS: Value range }}` → `}}`）；
// b) `EQUENCE`（丢 S 笔误）→ SEQUENCE。
function repairDraftText(text, draftTolerant = false) {
  const NL = '\n';
  // 全部修补仅对草稿宽容模式（15.0.0 一类预冻结草稿）激活；
  // 正式版本（15.1.0+）文本是干净的，任何修补都只有引入回归的风险。
  if (!draftTolerant) return text;
  const lines = text.split(NL);
  const KEEP_BARE = new Set(['BEGIN', 'END', 'IMPORTS', 'EXPORTS', 'FROM', 'SIZE']);
  const TYPE_START = /^(SEQUENCE|CHOICE|ENUMERATED|INTEGER|BOOLEAN|BIT|OCTET|NULL|TYPE_FFS)\b/;
  const nextMeaningful = (idx) => {
    for (let k = idx + 1; k < lines.length; k++) {
      const t = lines[k].trim();
      if (t && !t.startsWith('--')) return t;
    }
    return '';
  };
  const prevMeaningful = (idx) => {
    for (let k = idx - 1; k >= 0; k--) {
      const t = lines[k].trim();
      if (t && !t.startsWith('--')) return t;
    }
    return '';
  };
  const repaired = lines.map((line, idx) => {
    if (/^\s*FFS[\s:.]/.test(line)) return line.replace(/[^{}()[\],]+/g, '');
    // 15.0.0：`OPTIONAL -- Need OP ]]` —— 收口 ]] 落在行尾注释内会被注释吞掉
    // （版本组永不闭合）。把 ]] 提到注释之前：`OPTIONAL ]] -- Need OP`
    const cm = line.match(/^(.*?)\s*(--[^\]]*)\s*(\]\])\s*$/);
    if (cm && cm[1].trim() && !cm[1].includes(']]')) {
      return cm[1].replace(/\s+$/, '') + ' ]] ' + cm[2].trim();
    }
    // 15.0.0：孤儿字段名（类型被草稿删除，如 pdsch-BundleSize 独占一行）。
    // 仅当下一有效行是完整 `name TYPE` 字段（而非该名的类型）时判定为孤儿删除；
    // IMPORTS 列表与“名换行类型”式不受影响。
    const ORPHAN_RE = /^\s*[A-Za-z][A-Za-z0-9_-]*\s*(,?)\s*$/;
    if (ORPHAN_RE.test(line)) {
      const hadComma = !!line.trim().match(/[A-Za-z0-9_-]\s*,\s*$/);
      const bare = line.trim().replace(/,\s*$/, '');
      const nxt = nextMeaningful(idx);
      // 前一行以 OF / ::= / { 结尾时，本行可能是 seqof 元素类型/赋值体/CHOICE 变体名，保留；
      // 但带尾逗号的孤儿不可能是“名等类型”（逗号应在类型之后），不受此保护
      const prv = prevMeaningful(idx);
      // prv 结尾细分：OF → 本行是 seqof 元素类型（元素后可跟逗号）；::= → 赋值体；
      // { → 组内首行（孤儿字段名带逗号可删，见 38.331 CSI 区）
      const endsWithOF = /(^|\s)OF\s*$/.test(prv);
      const endsWithAssign = /::=\s*$/.test(prv);
      const endsWithBrace = /\{\s*$/.test(prv);
      // 前一行也是裸标识符 = 本行是它的类型（名字换行类型式），保留
      const prvIsBareId = /^[A-Za-z][A-Za-z0-9_-]*$/.test(prv);
      // nxt 须像完整字段起点（词 词…），其次词不能是 OPTIONAL/DEFAULT——
      // 否则 nxt 是「类型 OPTIONAL」行，本行是它的字段名
      const nm = nxt.match(/^([A-Za-z][A-Za-z0-9_-]*)\s+([A-Za-z][A-Za-z0-9_-]*)/);
      const nxtIsFieldStart = !!nm && !['OPTIONAL', 'DEFAULT'].includes(nm[2]);
      if (!KEEP_BARE.has(bare) && !TYPE_START.test(nxt) && !nxt.startsWith('::=')
        && !nxt.startsWith('FROM') && !endsWithOF && !endsWithAssign
        && (!endsWithBrace || hadComma) && !prvIsBareId
        && nxtIsFieldStart) {
        return '';
      }
    }
    let out = line.replace(/\bEQUENCE\b/g, 'SEQUENCE');
    // 15.0.0：`SEQUENCE (SIZE (1..X),` 行（行以约束+逗号结尾、无 OF 后缀、
    // 括号不闭合）按差额补右括号。缺外括号但后随 OF 的形态由 parseConstraint
    // 容错，不可在此补（会追加到行尾出错）。
    const trimmed = out.trim();
    if (/SIZE/.test(trimmed) && !/\bOF\b/.test(trimmed) && /,\s*$/.test(trimmed)) {
      const opens = (out.match(/\(/g) || []).length;
      const closes = (out.match(/\)/g) || []).length;
      const diff = opens - closes;
      if (diff >= 1) out = out.replace(/,\s*$/, ')'.repeat(diff) + ',');
    }
    return out;
  });
  return repaired.join(NL);
}

function parseModule(text, opts = {}) {
  const toks = tokenize(repairDraftText(text, !!opts.draftTolerant));
  let p = 0;
  const peek = () => toks[p];
  const next = () => toks[p++];
  const at = (t) => toks[p].t === t;
  const atId = (v) => toks[p].t === 'id' && toks[p].v === v;
  const errAt = (tk, msg) => { throw new Error(`[ASN.1 行 ${tk.line ?? '?'}] ${msg}`); };
  const expect = (t, v) => {
    const tk = next();
    if (tk.t === 'eof') errAt(tk, `意外结束（EOF），期望 ${v || t}`);
    if (tk.t !== t || (v !== undefined && tk.v !== v))
      errAt(tk, `期望 ${v || t}，得到 "${tk.v ?? tk.t}"`);
    return tk;
  };

  // FROM 约束的字符集合：(FROM ("A".."Z") | "0" | "abc")——元素可带分组括号（元素级 ()），
  // 并集 | / 逗号分隔；`...` 可扩展 → 约束失效，记 extensible
  function parseFromSet() {
    const chars = new Set();
    let extensible = false;
    const addStr = (s) => { for (const ch of s) chars.add(ch); };
    const parseElem = () => {
      if (at('(')) { // 元素分组括号：( "A".."Z" )
        next();
        parseElems();
        expect(')');
        return;
      }
      const tk = next();
      if (tk.t !== 'str') errAt(tk, `FROM 项应为字符串字面量，得到 "${tk.v ?? tk.t}"`);
      if (at('..')) {
        next();
        const hi = next();
        if (hi.t !== 'str' || hi.v.length !== 1 || tk.v.length !== 1)
          errAt(hi, 'FROM 范围两端应为单字符');
        for (let c = tk.v.codePointAt(0); c <= hi.v.codePointAt(0); c++) chars.add(String.fromCodePoint(c));
      } else addStr(tk.v);
    };
    function parseElems() {
      for (;;) {
        if (at('...')) { next(); extensible = true; if (at(',')) next(); continue; }
        parseElem();
        if (at('|')) { next(); continue; }
        if (at(',')) { next(); continue; }
        break;
      }
    }
    parseElems();
    return { chars: [...chars].sort().join(''), extensible };
  }

  // ---- 信息对象类 / 对象 / 对象集（X.682 子集，NGAP/S1AP/XnAP/F1AP 全家桶） ----

  // CLASS 体：{ &id Type UNIQUE, &criticality Type DEFAULT lit, &Value (无类型=型字段) }
  const parseClassBody = () => {
    expect('id', 'CLASS');
    expect('{');
    const fields = [];
    for (;;) {
      if (at('}')) break;
      if (at(',')) { next(); continue; }
      const amp = expect('amp');
      const f = { name: amp.v };
      if (atId('OPTIONAL')) { next(); f.optional = true; }
      else if (atId('UNIQUE')) { next(); f.unique = true; }
      else if (!at(',') && !at('}')) {
        f.type = parseType();
        for (;;) {
          if (atId('UNIQUE')) { next(); f.unique = true; continue; }
          if (atId('OPTIONAL')) { next(); f.optional = true; continue; }
          if (atId('DEFAULT')) {
            next();
            const lit = next();
            f.default = lit.t === 'num' ? lit.v : String(lit.v);
            continue;
          }
          break;
        }
      }
      fields.push(f);
      if (at(',')) next();
    }
    expect('}');
    // WITH SYNTAX：{ LIT &field [LIT &field] ... }（[] 为可选组）
    let syntax;
    if (atId('WITH')) {
      next(); expect('id', 'SYNTAX');
      expect('{');
      syntax = [];
      const readItem = (into) => {
        const t = next();
        if (t.t === 'amp') into.push({ field: t.v });
        else if (t.t === 'id') into.push({ lit: t.v });
        else errAt(t, `WITH SYNTAX 项应为字面量或 &字段`);
      };
      for (;;) {
        if (at('}')) break;
        if (at('[')) {
          next();
          const grp = [];
          while (!at(']')) { if (at('eof')) errAt(peek(), 'WITH SYNTAX 可选组缺 ]'); readItem(grp); }
          expect(']');
          syntax.push({ opt: grp });
          continue;
        }
        readItem(syntax);
      }
      expect('}');
    }
    return { kind: 'class', fields, syntax };
  };

  // 对象体通用捕获：光标在 '{' 之后，读至匹配 '}'（已消费）。嵌套 {} 折叠为 {t:'brace', items}。
  const captureBraced = () => {
    const items = [];
    for (;;) {
      if (at('}')) { next(); return items; }
      if (at('eof')) errAt(peek(), '对象/集合缺少 }');
      if (at('{')) { next(); items.push({ t: 'brace', items: captureBraced() }); continue; }
      items.push(next());
    }
  };

  // 对象集成员：顶层按 | / , 分组；成员 = 裸标识符引用 | 匿名 {} 对象
  const parseSetMembers = (items) => {
    const members = [];
    let extensible = false;
    let cur = [];
    const flush = () => {
      if (!cur.length) return;
      if (cur.length === 1 && cur[0].t === 'brace') members.push({ obj: cur[0].items });
      else if (cur.length === 1 && cur[0].t === 'id') members.push({ ref: cur[0].v });
      else members.push({ raw: cur });
      cur = [];
    };
    for (const t of items) {
      if (t.t === '|') { flush(); continue; }
      if (t.t === ',') { flush(); continue; }
      if (t.t === '...') { extensible = true; continue; }
      cur.push(t);
    }
    flush();
    return { members, extensible };
  };

  // 值字面量：数字 | FFS:数字（15.0.0 草稿） | 常量别名（toir 阶段解析）
  function parseValueLiteral() {
    const lit = next();
    if (lit.t === 'num') return lit.v;
    if (lit.t === 'id' && lit.v === 'FFS' && at(':')) { next(); return expect('num').v; }
    if (lit.t === 'id') {
      // docx 提取融合行：`::= 925id-CSI-RS...`（换行丢失）→ 数值 925 + 回插余部标识符
      const m = lit.v.match(/^(\d+)(id-[A-Za-z].*)$/);
      if (m) { toks.splice(p, 0, { t: 'id', v: m[2], line: lit.line }); return Number(m[1]); }
      return String(lit.v);
    }
    errAt(lit, `值赋值字面量应为数字或常量名，得到 "${lit.v ?? lit.t}"`);
  }

  function parseConstraint() {
    // '(' (SIZE '(' b ')') | b ')' ；b = NUM|常量名 ['..' NUM|常量名] [', ...']
    // 边界可为常量名（如 maxDRB），在 toir 阶段解析成数值。
    expect('(');
    let size = false;
    if (atId('SIZE')) { next(); size = true; expect('('); }
    const parseBound = () => {
      if (at('[')) next(); // 15.0.0：INTEGER(1..[16]) 方括号包数字
      if (at('ffs')) { next(); return 'FFS'; } // (0..FFS!) 占位边界 → toir 的 FFS 哨兵路径
      const tk = peek();
      if (tk.t === 'num' || tk.t === 'id') { next(); }
      else errAt(tk, `约束边界应为数字或常量名，得到 "${tk.v ?? tk.t}"`);
      if (at(']')) next();
      return tk.v;
    };
    const lo = parseBound();
    let hi = lo;
    if (at('..')) { next(); hi = parseBound(); }
    else if (at('...')) {
      // 15.0.0 笔误：`1...Max` 融合省略号（= 1..Max）
      next();
      hi = parseBound();
    }
    // 约束并集（NGAP 族：INTEGER (1..30|40|50|...|181)）：PER 口径取覆盖极值
    // （X.691 10.5.2 有效范围 = 并集覆盖的最小单区间），成员列表留给 diff 展示
    const parts = [{ min: lo, max: hi }];
    let min = lo, max = hi;
    while (at('|')) {
      next();
      const lo2 = parseBound();
      let hi2 = lo2;
      if (at('..')) { next(); hi2 = parseBound(); }
      parts.push({ min: lo2, max: hi2 });
      if (typeof lo2 === 'number' && (typeof min !== 'number' || lo2 < min)) min = lo2;
      if (typeof hi2 === 'number' && (typeof max !== 'number' || hi2 > max)) max = hi2;
    }
    if (typeof lo === 'number' && typeof hi === 'number' && lo > hi)
      errAt(peek(), `约束非法 (${lo}..${hi})`);
    let extensible = false, extRange;
    const parseExtRange = () => {
      // 扩展段（INTEGER (0..3, ..., 4 | 5 | 6) / (1..65535, ..., 65536..109999)）：
      // 可为并集；记录覆盖极值供展示/diff。PER 编码按 pycrate 口径：
      // 扩展值一律无约束整数（不使用扩展段下界）
      const lo3 = parseBound();
      let hi3 = lo3;
      if (at('..')) { next(); hi3 = parseBound(); }
      extRange = { min: lo3, max: hi3 };
      while (at('|')) {
        next();
        const l4 = parseBound();
        let h4 = l4;
        if (at('..')) { next(); h4 = parseBound(); }
        if (typeof l4 === 'number' && l4 < extRange.min) extRange.min = l4;
        if (typeof h4 === 'number' && h4 > extRange.max) extRange.max = h4;
      }
    };
    if (size) {
      // SIZE 括号内的可扩展标记（NGAP 族写法：SIZE(1..150, ...)）
      if (at(',') && toks[p + 1] && toks[p + 1].t === '...') {
        next(); next(); extensible = true;
        if (at(',')) next(); // `..., ` 之后可跟扩展段范围
        if (!at(')') && !at(',') && !at('}')) parseExtRange();
      }
      expect(')');
    }
    if (at(',')) {
      next();
      // 15.0.0：约束内尾随杂逗号（(SIZE (1..X),)）；正规形态为 `, ...`；
      // NGAP：`(1..65535, ..., 65536..109999)` 省略号后再逗号+扩展段范围
      if (at('...')) {
        next(); extensible = true;
        if (at(',')) next();
        if (!at(')') && !at('}') && (at('num') || at('id') || at('['))) parseExtRange();
      }
    }
    // 15.0.0 笔误两则：`SEQUENCE (SIZE (1..N) OF` 缺尾括号（后随 OF 时容忍）；
    // `INTEGER (0..137}` 约束被 } 收束（不吞 }，留给外层字段表）
    if (!atId('OF') && !at('}')) expect(')');
    const result = { min, max, extensible };
    if (extRange) result.extRange = extRange;
    if (parts.length > 1) result.parts = parts;
    return result;
  }

  function parseFieldList(closer) {
    const fields = [], additions = [];
    let extensible = false;
    let afterExt = false; // `...` 后的裸成员 = 单字段扩展
    for (;;) {
      if (at(closer)) break;
      if (at(',')) { next(); continue; } // 空槽容错（与枚举一致）
      if (at('...')) { next(); extensible = true; afterExt = true; if (at(',')) next(); continue; }
      if (afterExt && at('id') && !atId('OPTIONAL') && !atId('DEFAULT') && !KEYWORDS.has(toks[p].v)) {
        // 单字段扩展（SEQUENCE 字段或 CHOICE 分支）：X.691 编码为位图位 + 该值单独的开放类型
        const fld = parseField();
        additions.push({ rel: null, fields: [fld], single: true, line: fld.line });
        if (at(',')) next();
        continue;
      }
      if (at('[[')) {
        const g = next();
        const grp = { rel: null, fields: [], line: g.line };
        while (!at(']]')) {
          if (at('eof')) errAt(peek(), '版本组缺少 ]]');
          if (at(',')) { next(); continue; }
          grp.fields.push(parseField());
        }
        expect(']]');
        additions.push(grp);
        if (at(',')) next();
        continue;
      }
      fields.push(parseField());
      if (at(',')) next();
    }
    return { fields, additions, extensible };
  }

  function parseField() {
    const nameTk = expect('id');
    if (KEYWORDS.has(nameTk.v)) errAt(nameTk, `字段名不能是关键字 "${nameTk.v}"`);
    // 15.0.0：变体名后杂逗号（`semiPersistent, NULL`）。名字与类型间的逗号
    // 不可能是合法字段分隔（那等于本字段无类型），跳过安全。
    if (at(',')) { next(); }
    const type = parseType();
    const f = { name: nameTk.v, type, line: nameTk.line, optional: false };
    if (atId('OPTIONAL')) { next(); f.optional = true; }
    else if (atId('DEFAULT')) {
      next();
      if (at('ffs')) {
        // 15.0.0：DEFAULT FFS!（缺省值未定）→ 按 OPTIONAL 无缺省处理
        next();
        f.optional = true;
      } else {
        const lit = next();
        if (lit.t === 'num' || lit.t === 'id') f.default = String(lit.v);
        else if (lit.t === 'lit') f.default = { __lit: lit.base, v: lit.v };
        else errAt(lit, 'DEFAULT 值应为数字或标识符');
        f.optional = true; // 编码语义同 OPTIONAL
      }
    }
    return f;
  }

  // 15.0.0：`SEQUENCE (SIZE(0..160) OF {` —— seqof 元素为匿名内联 SEQUENCE
  const parseInlineOrType = () => {
    if (at('{')) {
      next();
      const r = parseFieldList('}');
      expect('}');
      return { kind: 'seq', fields: r.fields, additions: r.additions, extensible: r.extensible };
    }
    return parseType();
  };

  function parseType() {
    const tk = peek();
    if (tk.t === 'ffs') { next(); return { kind: 'ffs', line: tk.line }; }
    if (tk.t !== 'id') errAt(tk, `期望类型名，得到 "${tk.v ?? tk.t}"`);
    switch (tk.v) {
      case 'SEQUENCE': {
        next();
        if (at('(')) {
          const c = parseConstraint();
          if (!atId('OF')) {
            // 15.0.0：`SEQUENCE (SIZE (1..X),`（丢了 OF X 尾巴的 seqof，草稿残缺）。
            // 约束后直接是字段边界则降级为 ffs 占位；否则仍报错。
            if (at(',') || at('}') || at(')')) return { kind: 'ffs', line: tk.line };
            errAt(peek(), 'SEQUENCE (SIZE) 后应为 OF');
          }
          next();
          return { kind: 'seqof', size: { l: c.min, u: c.max }, sizeExt: c.extensible, of: parseInlineOrType(), line: tk.line };
        }
        if (atId('OF')) {
          // 无约束 SEQUENCE OF（15.0.0 用法；长度按不受限计数前缀编码）
          next();
          return { kind: 'seqof', size: undefined, of: parseInlineOrType(), line: tk.line };
        }
        if (atId('SIZE')) {
          // 38.331 v18.0.0 笔误容错：`SEQUENCE SIZE(1..X) OF` 缺外层括号
          // （18.1.0 起已修正；容错不改变语义）
          next();
          const c = parseConstraint();
          if (!atId('OF')) errAt(peek(), 'SEQUENCE SIZE(...) 后应为 OF');
          next();
          return { kind: 'seqof', size: { l: c.min, u: c.max }, sizeExt: c.extensible, of: parseInlineOrType(), line: tk.line };
        }
        if (at('{')) next(); // 15.0.0：SEQUENCE 换行丢 `{`（字段直接另起行）
        const r = parseFieldList('}');
        expect('}');
        return { kind: 'seq', fields: r.fields, additions: r.additions, extensible: r.extensible, line: tk.line };
      }
      case 'CHOICE': {
        next();
        if (at('{')) next(); // 15.0.0：同 SEQUENCE 丢 `{`
        const r = parseFieldList('}');
        expect('}');
        return { kind: 'choice', alts: r.fields, additions: r.additions, extensible: r.extensible, line: tk.line };
      }
      case 'ENUMERATED': {
        next();
        expect('{');
        const root = [], ext = [];
        let extensible = false, inExt = false, sawFfs = false;
        for (;;) {
          if (at('}')) break;
          if (at(')')) break; // 15.0.0 笔误：ENUMERATED {…)
          if (at(',')) { next(); continue; } // 15.0.0：`, , spare15` 空槽
          if (at('ffs')) { next(); sawFfs = true; if (at(',')) next(); continue; } // {FFS!} 占位值
          if (at('[')) { // 15.0.0 草稿标记：[URLLC2] 方括号值照常收录
            next();
            const bracketed = expect('id');
            if (KEYWORDS.has(bracketed.v)) errAt(bracketed, `枚举值不能是关键字 "${bracketed.v}"`);
            expect(']');
            (inExt ? ext : root).push(bracketed.v);
            if (at(',')) next();
            continue;
          }
          if (at('...')) { next(); extensible = true; inExt = true; if (at(',')) next(); continue; }
          const id = expect('id');
          if (KEYWORDS.has(id.v)) errAt(id, `枚举值不能是关键字 "${id.v}"`);
          if (at('(')) { next(); expect('num'); expect(')'); } // 命名编号：忽略索引
          (inExt ? ext : root).push(id.v);
          if (at(',')) next();
        }
        if (at(')')) next(); // 15.0.0 笔误：以 ) 收束
        else expect('}');
        // 15.0.0：ENUMERATED { FFS: ... } 散文 / {FFS!} 占位值被跳过后为空 → 占位类型
        if (!root.length) return { kind: 'ffs', line: tk.line };
        if (sawFfs) return { kind: 'ffs', line: tk.line }; // {真值, FFS!} 混合也按占位（草稿残缺区）
        return { kind: 'enum', root, ext: ext.length ? ext : undefined, extensible, line: tk.line };
      }
      case 'INTEGER': {
        next();
        // 命名值列表：INTEGER { spare (0), highest (1), ... } (0..15)
        // PER 编码只看范围约束；名字记录供展示/diff
        let named;
        if (at('{')) {
          next();
          named = {};
          for (;;) {
            if (at('}')) break;
            if (at(',')) { next(); continue; }
            const nm = expect('id').v;
            if (at('(')) {
              next();
              const t = next();
              named[nm] = t.t === 'num' ? t.v : String(t.v);
              expect(')');
            } else named[nm] = null;
            if (at(',')) next();
          }
          expect('}');
        }
        if (at('(')) {
          const c = parseConstraint();
          return { kind: 'int', min: c.min, max: c.max, extensible: c.extensible, parts: c.parts, extRange: c.extRange, named, line: tk.line };
        }
        return { kind: 'int', extensible: false, named, line: tk.line };
      }
      case 'BOOLEAN': next(); return { kind: 'bool', line: tk.line };
      case 'NULL': next(); return { kind: 'null', line: tk.line };
      case 'BIT': case 'OCTET': {
        next();
        expect('id', 'STRING');
        let size, containing, namedBits, sizeExt = false;
        // 命名位列表（BIT STRING {nea1-128(1), nea2-128(2)}）：纯语义标记，
        // PER 编码只看 SIZE 约束；名字与位号记录供展示/diff
        if (at('{')) {
          next();
          namedBits = {};
          for (;;) {
            if (at('}')) break;
            if (at(',')) { next(); continue; }
            const nm = expect('id').v;
            if (at('(')) { next(); const t = next(); namedBits[nm] = t.t === 'num' ? t.v : null; expect(')'); }
            else namedBits[nm] = null;
            if (at(',')) next();
          }
          expect('}');
        }
        // 前瞻 '(' 后是否为 CONTAINING（OCTET STRING (CONTAINING T)：内容约束，
        // UPER 下外层仍按无界 OCTET STRING 编码；T 记入 containing 供 diff/展示）
        if (at('(') && toks[p + 1] && toks[p + 1].t === 'id' && toks[p + 1].v === 'CONTAINING') {
          next(); next(); // '(' 'CONTAINING'
          containing = parseType();
          expect(')');
        } else if (at('(')) {
          const c = parseConstraint();
          size = { l: c.min, u: c.max };
          sizeExt = c.extensible;
        }
        return { kind: tk.v === 'BIT' ? 'bitstr' : 'octstr', size, sizeExt, containing, namedBits, extensible: false, line: tk.line };
      }
      case 'SET': errAt(tk, '不支持 SET（3GPP RRC 子集不含 SET）');
      default: {
        if (KEYWORDS.has(tk.v)) errAt(tk, `不支持的关键字作类型 "${tk.v}"`);
        // 受限字符串族（NGAP/S1AP/XnAP/F1AP 用 VisibleString/PrintableString/UTF8String）
        if (STR_TYPES[tk.v]) {
          next();
          let size, alpha, extensible = false;
          if (at('(')) {
            const isSize = toks[p + 1] && toks[p + 1].t === 'id' && toks[p + 1].v === 'SIZE';
            const isFrom = toks[p + 1] && toks[p + 1].t === 'id' && toks[p + 1].v === 'FROM';
            if (isSize) {
              const c = parseConstraint(); // (SIZE (l..u) [, ...])
              size = { l: c.min, u: c.max };
              extensible = c.extensible;
            } else if (isFrom) {
              next(); next(); // 外层 ( 与 FROM；集合元素直到约束右括号
              alpha = parseFromSet();
              expect(')'); // 约束括号闭合
            } else errAt(peek(), '字符串约束应为 SIZE 或 FROM');
          }
          return { kind: 'charstr', subtype: STR_TYPES[tk.v], size, alpha, extensible, line: tk.line };
        }
        // OBJECT IDENTIFIER（PrivateIE-ID global 分支等；PER 下按无约束八位组串编码）
        if (tk.v === 'OBJECT' && toks[p + 1] && toks[p + 1].t === 'id' && toks[p + 1].v === 'IDENTIFIER') {
          next(); next();
          return { kind: 'oid', line: tk.line };
        }
        next();
        // 类字段引用：Class.&field [({Set}) | ({Set}{@keyField})]
        if (at('.') && toks[p + 1] && toks[p + 1].t === 'amp') {
          next();
          const fld = next(); // amp
          let table;
          if (at('(') && toks[p + 1] && toks[p + 1].t === '{') {
            next(); // (
            next(); // {
            const set = expect('id').v;
            expect('}'); // 集合名括号闭合
            let key;
            if (at('{')) { next(); key = expect('at').v; expect('}'); } // {@keyField}
            expect(')');
            table = { set, key };
          }
          return { kind: 'classref', cls: tk.v, field: fld.v, table, line: tk.line };
        }
        // 参数化使用：Name { ArgType } / Name { {Set} } / Name { 0, maxN, {Set} }（NGAP 容器族）
        let args;
        if (at('{')) {
          next();
          args = [];
          for (;;) {
            if (at('{')) { // 嵌套花括号 = 集合实参 {{IEsSet}}
              next();
              const nm = expect('id').v;
              expect('}');
              args.push({ kind: 'ref', name: nm, setArg: true });
            } else if (at('num')) { // 数字实参（SIZE 边界参数）
              const t = next();
              args.push({ kind: 'litnum', v: t.v });
            } else args.push(parseType());
            if (at(',')) { next(); continue; }
            break;
          }
          expect('}');
        }
        // 内型约束：Name (WITH COMPONENTS {..., f ABSENT/PRESENT})（36.331 传源 SIB1 用）
        if (at('(') && toks[p + 1] && toks[p + 1].t === 'id' && toks[p + 1].v === 'WITH'
            && toks[p + 2] && toks[p + 2].t === 'id' && toks[p + 2].v === 'COMPONENTS') {
          next(); next(); next(); // ( WITH COMPONENTS
          expect('{');
          const withComponents = [];
          for (;;) {
            if (at('}')) break;
            if (at('...')) { next(); if (at(',')) next(); continue; }
            const fname = expect('id');
            if (atId('ABSENT') || atId('PRESENT')) {
              withComponents.push({ name: fname.v, presence: next().v });
            } else if (at('(')) {
              // 子约束（本方言暂不解释内容，仅跳过平衡括号）
              let depth = 0;
              do { const t = next(); if (t.t === '(') depth++; else if (t.t === ')') depth--; } while (depth > 0 && !at('eof'));
            } else errAt(peek(), `WITH COMPONENTS 项应为 ABSENT/PRESENT，得到 "${peek().v ?? peek().t}"`);
            if (at(',')) next();
          }
          expect('}');
          expect(')');
          return { kind: 'ref', name: tk.v, withComponents, line: tk.line };
        }
        return { kind: 'ref', name: tk.v, args, line: tk.line };
      }
    }
  }

  // ---- 模块头 ----
  const nameTk = expect('id');
  // 模块 OID 身份块（跨行）：Name { itu-t (0) ... ngran-Access (22) ... }——不影响编码，跳平衡括号
  if (at('{')) {
    let depth = 0;
    do { const t = next(); if (t.t === '{') depth++; else if (t.t === '}') depth--; }
    while (depth > 0 && !at('eof'));
  }
  if (atId('DEFINITIONS')) {
    next();
    // TagDefault：AUTOMATIC TAGS 即 ASN.1 默认，编码不受影响，安全接受；
    // EXPLICIT/IMPLICIT（NGAP 族用）与 EXTENSIBILITY IMPLIED 留给 M3，先显式报错。
    if (atId('AUTOMATIC')) { next(); expect('id', 'TAGS'); }
    else if (atId('EXPLICIT') || atId('IMPLICIT'))
      errAt(peek(), '暂不支持 EXPLICIT/IMPLICIT TAGS（M3 传输层族再扩展）');
    if (atId('EXTENSIBILITY')) errAt(peek(), '暂不支持 EXTENSIBILITY IMPLIED');
  }
  expect('::=');
  expect('id', 'BEGIN');

  // IMPORTS / EXPORTS（紧跟 BEGIN）。导入名可带参数化标记（PrivateIE-Container{}），
  // 跳过平衡花括号即可（不影响编码）。
  const skipBraces = () => {
    if (!at('{')) return;
    let depth = 0;
    do { const t = next(); if (t.t === '{') depth++; else if (t.t === '}') depth--; }
    while (depth > 0 && !at('eof'));
  };
  const imports = [];
  if (atId('IMPORTS')) {
    next();
    for (;;) {
      const names = [expect('id').v];
      skipBraces();
      while (at(',')) { next(); names.push(expect('id').v); skipBraces(); }
      expect('id', 'FROM');
      const from = expect('id').v;
      imports.push({ names, from });
      if (at(';')) { next(); break; }
      if (atId('EXPORTS') || at('eof')) errAt(peek(), 'IMPORTS 缺少结尾 ;');
    }
  }
  if (atId('EXPORTS')) {
    next();
    if (atId('ALL')) next();
    else { expect('id'); while (at(',')) { next(); expect('id'); } }
    expect(';'); // 导出限制不影响编码，语法上接受即可
  }

  const types = new Map();
  const values = new Map();
  const objects = new Map(); // 对象赋值：name → {kind:'object', class, toks}
  const sets = new Map();    // 对象集：name → {kind:'objset', class, members, extensible}
  while (!atId('END') && !at('eof')) {
    if (at(',')) { next(); continue; } // 15.0.0：顶层杂逗号（丢 ::= 的赋值后面跟着 ,）
    if (at('}')) { next(); continue; } // 15.0.0：CSI-RS-ResourceMobility 区孤儿括号
    if (atId('OPTIONAL') || atId('DEFAULT')) { next(); continue; } // 15.0.0：赋值尾粘的 OPTIONAL,
    // 15.0.0：类型头整行丢失的残段（`name SomeRef OPTIONAL` / `name SomeRef,` 等
    // + 孤儿 `}`）——名字 + 引用 + 字段边界（OPTIONAL/,/}) 的碎片按不可重建垃圾跳过
    if (toks[p].t === 'id' && !KEYWORDS.has(toks[p].v)
        && toks[p + 1] && toks[p + 1].t === 'id'
        && !KEYWORDS.has(toks[p + 1].v)
        && !['SEQUENCE', 'CHOICE', 'ENUMERATED', 'INTEGER', 'BOOLEAN', 'BIT', 'OCTET', 'NULL'].includes(toks[p + 1].v)
        && ((toks[p + 2] && toks[p + 2].t === 'id' && toks[p + 2].v === 'OPTIONAL')
          || (toks[p + 2] && (toks[p + 2].t === ',' || toks[p + 2].t === '}')))) {
      p += 3;
      if (at(',')) next();
      continue;
    }
    const aName = expect('id');
    if (KEYWORDS.has(aName.v)) errAt(aName, `类型名不能是关键字 "${aName.v}"`);
    // 参数化定义 LHS：Name { Param } 或 Name { CLASS : param }（NGAP 容器族）
    let params;
    if (at('{')) {
      next();
      params = [];
      for (;;) {
        const t1 = expect('id');
        if (at(':')) { next(); params.push({ cls: t1.v, name: expect('id').v }); }
        else params.push({ name: t1.v });
        if (at(',')) { next(); continue; }
        break;
      }
      expect('}');
    }
    // 对象 / 对象集赋值：Name ClassName ::= {...}——类名与 ::= 连成的三元结构；
    // 不能与参数化类型使用 `Final ::= Container {IesSet}`（::= 后即 类名{）混淆
    if (!params && toks[p].t === 'id' && !KEYWORDS.has(toks[p].v)
        && toks[p + 1] && toks[p + 1].t === '::=') {
      const cls = next().v;
      next(); // ::=
      if (at('{')) {
        next();
        let items;
        try { items = captureBraced(); }
        catch (e) { throw new Error(`[对象 ${aName.v} (类 ${cls})] ${e.message}`); }
        const isSet = items.some(t => t.t === '|' || t.t === '...' || t.t === 'brace');
        if (isSet) {
          const { members, extensible } = parseSetMembers(items);
          sets.set(aName.v, { kind: 'objset', class: cls, members, extensible });
        } else {
          objects.set(aName.v, { kind: 'object', class: cls, toks: items });
        }
        continue;
      }
      // 非 { 开头 = 带类型名的值赋值（id-xxx ProcedureCode ::= 0）——落入下方值赋值路径
      values.set(aName.v, parseValueLiteral());
      continue;
    }
    if (at('::=')) {
      next();
      // 信息对象类定义
      if (atId('CLASS')) {
        const c = parseClassBody();
        if (params) c.params = params;
        types.set(aName.v, c);
        continue;
      }
      const t = parseType();
      if (params) t.params = params;
      types.set(aName.v, t);
      continue;
    }
    // 15.0.0：顶层赋值丢 ::=（`X SEQUENCE {` 直接开头，共 3 处）——类型关键字
    // 跟在名字后、且后面不是 `::=`（那会撞值赋值 `X INTEGER ::= 5`），
    // 不可能构成别的合法产生式，按缺 ::= 的类型赋值处理
    const TYPE_KWS = ['SEQUENCE', 'CHOICE', 'ENUMERATED', 'INTEGER', 'BOOLEAN', 'BIT', 'OCTET', 'NULL'];
    if (!params && ((toks[p].t === 'id' && TYPE_KWS.includes(toks[p].v)
        && !(toks[p + 1] && toks[p + 1].t === '::=')) || toks[p].t === 'ffs')) {
      const t = parseType();
      types.set(aName.v, t);
      continue;
    }
    // 值赋值：name TypeName ::= 字面量（INTEGER 之外还有 NGAP 的 ProcedureCode 等——
    // 编码语义就是数值/枚举名，类型仅作展示）
    const vType = next();
    if (vType.t !== 'id') errAt(vType, `期望 ::=，得到 "${vType.v ?? vType.t}"`);
    expect('::=');
    values.set(aName.v, parseValueLiteral());
  }
  let noEnd = false;
  if (!atId('END')) {
    if (at('eof')) noEnd = true; // 15.0.0 草稿：模块没有 END 就到文件尾（提示见 toir warnings）
    else errAt(peek(), '模块缺少 END（意外结束）');
  } else expect('id', 'END');
  return { name: nameTk.v, types, values, objects, sets, imports, noEnd, line: 1 };
}

// ==== src/asn1/toir.js ====
// AST → 引擎 IR 转换 + 规范库注册。
// parseToModule(text, meta)：文本 → {module, errors}；errors 非空时不注册。
// meta: { provenance, spec, label, id } —— provenance: verified | verified-derivation | reference | synthetic | user-imported


function convertNode(ast) {
  if (!ast) return ast;
  switch (ast.kind) {
    case 'seq':
      return { kind: 'seq', extensible: ast.extensible,
        params: ast.params,
        fields: ast.fields.map(convertField),
        additions: ast.additions.map(convertGroup) };
    case 'choice':
      return { kind: 'choice', extensible: ast.extensible,
        params: ast.params,
        alts: ast.alts.map(convertField),
        additions: ast.additions.flatMap(g => g.fields.map(f => ({ ...convertField(f), zone: 'ext' }))) };
    case 'enum':
      return { kind: 'enum', root: ast.root, ext: ast.ext, extensible: ast.extensible };
    case 'int':
      return { kind: 'int', min: ast.min, max: ast.max, extensible: ast.extensible, parts: ast.parts, extRange: ast.extRange, named: ast.named };
    case 'litnum':
      return { kind: 'litnum', v: ast.v };
    case 'bool': case 'null': case 'ffs':
      return { kind: ast.kind };
    case 'bitstr': case 'octstr':
      return { kind: ast.kind, size: ast.size, sizeExt: !!ast.sizeExt, containing: convertNode(ast.containing), namedBits: ast.namedBits };
    case 'charstr':
      return { kind: 'charstr', subtype: ast.subtype, size: ast.size,
        alpha: ast.alpha && !ast.alpha.extensible ? ast.alpha.chars : undefined, extensible: !!ast.extensible };
    case 'oid':
      return { kind: 'oid' };
    case 'class':
      // 信息对象类：字段类型照常转换（ref 未解析），syntax 原样保留供对象解释
      return { kind: 'class', fields: ast.fields.map(f => ({
        name: f.name, type: f.type ? convertNode(f.type) : undefined,
        unique: !!f.unique, default: f.default })), syntax: ast.syntax };
    case 'classref':
      // Class.&field 表约束：由 finalizeModule 的 resolveIOC 落地为 open/基类型
      return { kind: 'classref', cls: ast.cls, field: ast.field, table: ast.table };
    case 'seqof':
      return { kind: 'seqof', size: ast.size, sizeExt: !!ast.sizeExt, params: ast.params, of: convertNode(ast.of) };
    case 'ref':
      // params 必须随行：ProtocolIE-SingleContainer 是参数化 REF（容器族模板）
      return { kind: 'ref', name: ast.name, withComponents: ast.withComponents, setArg: ast.setArg,
        params: ast.params, args: ast.args ? ast.args.map(convertNode) : undefined };
    default:
      throw new Error(`未知 AST 节点类型 ${ast.kind}`);
  }
}

function convertField(f) {
  return { name: f.name, type: convertNode(f.type), optional: !!f.optional,
    default: f.default !== undefined ? litToJs(f.default, f.type) : undefined,
    line: f.line, zone: 'root' };
}

function convertGroup(g) {
  const rel = g.fields.length && /-r(\d+)$/.test(g.fields[0].name)
    ? `rel-${RegExp.$1}` : (g.rel || null);
  return { rel, single: !!g.single, fields: g.fields.map(f => ({ ...convertField(f), zone: 'ext' })) };
}

function litToJs(lit, typeAst) {
  if (lit !== null && typeof lit === 'object' && lit.__lit) {
    // 位串/八位组串字面量 → 值形式（bitstr {bits:[]}/ octstr hex 串）
    if (lit.__lit === 'B') return { bits: Array.from(lit.v, ch => (ch === '1' ? 1 : ch === '0' ? 0 : NaN)) };
    return lit.v.toUpperCase();
  }
  if (typeAst && typeAst.kind === 'bool') return lit === 'true';
  const n = Number(lit);
  return Number.isFinite(n) && String(n) === lit ? n : lit; // 数字转数值，其余（枚举名）保持字符串
}

function parseToModule(text, meta = {}, registry = null) {
  const errors = [];
  const warnings = [];
  let module = null;
  try {
    module = buildModule(text, meta, warnings);
    finalizeModule(module, registry, errors, warnings);
  } catch (e) {
    errors.push(e.message);
  }
  return { module: errors.length ? null : module, errors, warnings };
}

// 阶段一：纯语法 → IR（无跨模块语义）
function buildModule(text, meta, warnings = []) {
  const ast = parseModule(text, { draftTolerant: !!meta.draftTolerant });
  const types = new Map();
  for (const [name, node] of ast.types) types.set(name, convertNode(node));
  if (ast.noEnd) warnings.push(`模块 ${ast.name} 缺少 END（草稿版 EOF 收尾）`);
  // 15.0.0：FFS_Value/FFS_Ref 等草稿占位类型引用（无定义）→ ffs 占位节点
  const rewriteFfsRefs = (node) => {
    if (!node || typeof node !== 'object') return;
    if (node.kind === 'ref' && /^ffs/i.test(node.name)) {
      warnings.push(`FFS 占位类型引用 ${node.name} → ffs`);
      node.kind = 'ffs';
      delete node.name;
      delete node.args;
    }
    for (const f of [...(node.fields || []), ...(node.alts || []),
      ...((node.additions || []).flatMap((g) => g.fields || (g.name ? [g] : [])))]) {
      if (f.type) rewriteFfsRefs(f.type);
    }
    if (node.of) rewriteFfsRefs(node.of);
    if (node.containing) rewriteFfsRefs(node.containing);
  };
  for (const node of types.values()) rewriteFfsRefs(node);
  return { name: ast.name, types,
    values: ast.values || new Map(),
    objects: ast.objects || new Map(),
    sets: ast.sets || new Map(),
    imports: ast.imports || [],
    draftTolerant: !!meta.draftTolerant,
    provenance: meta.provenance || 'user-imported', meta };
}

// 阶段二：语义 pass（值解析 → 符号边界 → 参数化实例化 → 校验）。
// registry 需已包含全部相关模块（含"后文"模块，h00 的前向跨模块引用）。
function finalizeEarly(module, registry, errors, warnings) {
  // 阶段 A：值/边界/参数化实例化（必须全模块完成后才能跨模块做 IOC 落地）
  repairDoubledSegmentRefs(module, registry, warnings);
  resolveValues(module, registry, errors, warnings);
  if (!errors.length) resolveSymbolicBounds(module, registry, errors, warnings);
  if (module.draftTolerant) clampInvertedRanges(module, warnings); // 需在符号边界解析之后
  if (!errors.length) instantiateParams(module, registry, errors);
}

function finalizeLate(module, registry, errors, warnings) {
  // 阶段 B：IOC 落地（classref → open/基类型；依赖全部模块的阶段 A 产物）
  if (!errors.length) resolveIOC(module, registry, errors, warnings);
  if (!errors.length) instantiateWithComponents(module, registry, errors);
  if (!errors.length) validateModule(module, errors, registry || undefined);
}

function finalizeModule(module, registry, errors, warnings) {
  finalizeEarly(module, registry, errors, warnings);
  if (!errors.length) finalizeLate(module, registry, errors, warnings);
}

const FFS_SENTINEL = 9999; // 草稿版 FFS 占位（ffsValue/ffsUpperLimit…）的哨兵上界

// 值赋值解析：别名链（a ::= b）→ 跨模块值 → FFS 哨兵 → 报错。
// 终态 module.values 全为数字（供约束符号边界解析）。
function resolveValues(module, registry, errors, warnings) {
  const raw = new Map(module.values);
  // 本模块内别名定殖（有界迭代即可覆盖链式别名，环收敛为字符串走报错路径）
  for (let round = 0; round < raw.size + 2; round++) {
    let changed = false;
    for (const [k, v] of raw) {
      if (typeof v === 'string' && raw.has(v) && raw.get(v) !== v) {
        raw.set(k, raw.get(v));
        changed = true;
      }
    }
    if (!changed) break;
  }
  const extVal = (name) => {
    if (!registry) return undefined;
    const mods = registry.modules ? [...registry.modules.values()]
      : registry instanceof Map ? [...registry.values()] : [];
    for (const m of mods) if (m.values && typeof m.values.get(name) === 'number') return m.values.get(name);
    return undefined;
  };
  const out = new Map();
  for (const [k, v] of raw) {
    if (typeof v === 'number') { out.set(k, v); continue; }
    const x = extVal(v);
    if (typeof x === 'number') { out.set(k, x); continue; }
    if (/^ffs/i.test(v)) {
      out.set(k, FFS_SENTINEL);
      warnings.push(`FFS 占位：${k} ::= ${v} 按哨兵 ${FFS_SENTINEL} 处理（草稿版未定值）`);
    } else {
      errors.push(`${k}: 未解析的值引用 ${v}`);
    }
  }
  module.values = out;
}

// 把约束里的符号边界（字符串常量名）解析成数值。本模块 values 优先，
// 其后在 registry 全部模块的 values 里找（IMPORTS 带来的跨模块常量）。
function resolveSymbolicBounds(module, registry, errors, warnings) {
  const val = (name) => {
    if (module.values.has(name)) return module.values.get(name);
    if (registry) {
      const mods = registry.modules ? [...registry.modules.values()]
        : registry instanceof Map ? [...registry.values()] : [];
      for (const m of mods) if (m.values && m.values.has(name)) return m.values.get(name);
    }
    return undefined;
  };
  const walk = (node, path) => {
    if (!node || typeof node !== 'object') return;
    if (node.kind === 'int') {
      for (const k of ['min', 'max']) {
        if (typeof node[k] === 'string') {
          const v = val(node[k]);
          if (v === undefined && (/^ffs/i.test(node[k]) || module.draftTolerant)) {
            warnings.push(`占位边界：${path} 的 ${node[k]} 按哨兵 ${FFS_SENTINEL} 处理（草稿未定值）`);
            node[k] = FFS_SENTINEL;
          } else if (v === undefined) errors.push(`${path}: 未解析的常量 ${node[k]}（INTEGER 边界）`);
          else node[k] = v;
        }
      }
    }
    if ((node.kind === 'seqof' || node.kind === 'bitstr' || node.kind === 'octstr') && node.size) {
      for (const k of ['l', 'u']) {
        if (typeof node.size[k] === 'string') {
          const v = val(node.size[k]);
          if (v === undefined && (/^ffs/i.test(node.size[k]) || module.draftTolerant)) {
            warnings.push(`占位边界：${path} SIZE 的 ${node.size[k]} 按哨兵 ${FFS_SENTINEL} 处理（草稿未定值）`);
            node.size[k] = FFS_SENTINEL;
