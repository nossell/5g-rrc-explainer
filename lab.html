      csn1Tables.push({ section: sec, title: (sections.find((x) => x.num === sec) || {}).title || '', cells: [], alias: `SI ${am[1]} Rest Octets` });
    }
  }
  return {
    version,
    spec,
    sections,
    bits,
    msgs,
    typeTables,
    valueTables,
    csn1: csn1Tables,
    stats: { bitTables: bits.length, msgTables: msgs.length, otherTables: other, csn1Tables: csn1Tables.length },
  };
}

// ---- 消息类型值表 ------------------------------------------------------------
// 行形如 [0,1,0,0,0,0,0,1, '', 'Registration request']（8 bit 列 + 空 + 名称）；
// 类别行（含 '-'）与空行跳过。
function parseTypeTables(tables) {
  const out = {};
  for (const t of tables || []) {
    let group = null;
    for (const cells of t.rows) {
      const texts = cells.filter((c) => c !== '');
      if (!texts.length) continue;
      const bitCells = cells.slice(0, 8).filter((c) => /^[01]$/.test(c));
      const name = texts[texts.length - 1];
      if (bitCells.length === 8) {
        if (!name) continue;
        const val = bitCells.reduce((a, b) => (a << 1) | +b, 0);
        out[name.toLowerCase()] = { type: val, group: group || null };
      } else if (name && bitCells.length === 0) {
        group = name; // '5GS mobility management messages' 类别行
      }
    }
  }
  return out;
}

// ---- 消息类型值挂接 ----------------------------------------------------------
// caption 名（大写）↔ 类型表名（首字母大写）：小写比对；同名多值（MO/MT）按方向消歧。
const DIR_QUAL = [
  [/UE to network/, /ue originating|mobile originating|\(mo\)/i],
  [/network to UE/, /ue terminated|mobile terminated|\(mt\)/i],
];
function resolveMsgType(name, direction, msgTypes) {
  const key = name.toLowerCase();
  let cands = Object.entries(msgTypes).filter(([n]) => n === key);
  if (cands.length === 0) {
    // 容错：类型表名去掉括号限定后比对（'Deregistration request (UE originating)' 已是独立键）
    cands = Object.entries(msgTypes).filter(([n]) => n.replace(/\s*\(.*\)$/, '') === key);
  }
  if (cands.length === 0) return null;
  if (cands.length === 1) return cands[0][1].type;
  if (direction) {
    const qual = DIR_QUAL.filter(([dir]) => dir.test(direction)).map(([, q]) => q);
    const hit = cands.find(([n]) => qual.some((q) => q.test(n)));
    if (hit) return hit[1].type;
  }
  return cands[0][1].type; // 歧义时取首值（由校验报告暴露）
}

// ---- IE 布局库 ---------------------------------------------------------------
// _pending 行（parseBitTable 位宽门禁不过的挂起行）：有锚点的节交给 walkRow 走查恢复，
// 无锚点的节放弃（诚实拒绝）。走查/纠偏统一后经 correctIes 收口。
function buildIes(bits, valueTables) {
  const ies = {};
  const anchorsBySection = extractBitAnchors(valueTables);
  for (const b of bits) {
    if (!b.section) continue;
    const anchors = anchorsBySection[b.section];
    const octs = [];
    const notes = [];
    for (const row of b.octets || []) {
      if (!row._pending) { octs.push(row); continue; }
      if (!anchors || !anchors.length) continue;
      const rowTotal = row.half ? 4 : 8 * (row.count || 1);
      if (rowTotal !== 4 && rowTotal !== 8) continue;
      const wnotes = [];
      const fixed = walkRow(row.fields, rowTotal, anchors, row.octet, wnotes);
      if (!fixed || !fixed.some((f) => f.anchor)) { notes.push(`octet ${row.octet}: 锚点走查未收敛，行放弃`); continue; }
      const { _pending, ...clean } = row;
      clean.fields = fixed.map(({ spare, anchor, ...rest }) => {
        if (!rest.pre) delete rest.pre;
        return rest;
      });
      octs.push(clean);
      notes.push(...wnotes);
    }
    if (!octs.length) continue;
    if (!ies[b.section]) ies[b.section] = { name: b.name, layouts: [] };
    ies[b.section].layouts.push({
      figure: b.figure,
      octets: octs,
      ...((b.warnings && b.warnings.length) || notes.length ? { warnings: [...new Set([...(b.warnings || []), ...notes])] } : {}),
    });
  }
  return correctIes(ies, anchorsBySection);
}

// ---- 值语义表 → 位布局（v1.14.1）----------------------------------------------------
// 24.301 的 IE 位图 figure 是嵌入图片，Word 表只携带值语义：字段名自带 '(octet N[, bit M])'
// 注记 + 'Bit' + 位号行 + 0/1 值行（§9.9.3.0B Additional update type / §9.9.3.34 UE network
// capability 实证——24.008 正文只写「See 24.301」的那两个 IE 就在这）。信息足以无损重建位
// 布局：产出与 parseBitTable 同构的 octets/fields。行天然从内容八位组起（无 IEI/Length 行，
// TV/TLV 值域剥壳本就由 codec 负责）。取舍：值语义文本不随布局携带（消费者按位解、UI 显数值）；
// 置信门禁 ≥2 字段，不足返回 null（散文杂表不误收）。
// 行形态：① 字段头（恰一非空格，含 (octet N, bit M[to K]) 注记；注记可在行中——
//         'ProSe (octet 7, bit 7)This bit…'，取最后一处注记）→ 字段成形，随后 0/1 行是值；
//        ② 字段头只带 (octet N) → 等下一行裁决：'Bit' + 位号行（1..4 个 1-8 数字格，降序）
//          则成形；等来又一个字段头则它是组头（'EPS encryption algorithms supported
//          (octet 3)'），丢弃；
//        ③ 值行：前导 0/1 单字符格（个数 = 字段位宽）+ 描述格；前导格空而描述非空 = 描述续行；
//        ④ 'all other bits in octet X to Y are spare' → 尾部开区间 optional spare 行。
// 行内空隙记 pre（前导空位，与 packRow/layoutUnpack 共语义）；组内字段按 hi 降序，八位组升序。
function parseValueLayout(rowsText) {
  const fields = [];
  let cur = null; // 等位号行裁决的无注记字段头（或组头）
  let last = null; // 最近成形的字段（值行挂靠）
  let spareFrom = null;
  const ANNO = /\(octet\s+(\d+)\s*(?:,\s*bits?\s+(\d+)(?:\s+to\s+(\d+))?)?\)/i;
  for (const row of rowsText || []) {
    const texts = (row || []).map((c) => String(c ?? '').trim());
    const ne = texts.filter((t) => t !== '');
    if (!ne.length) continue;
    const joined = ne.join(' ');
    const sm = /all other bits[^\n]*?octet\s+(\d+)/i.exec(joined);
    if (sm && !cur) {
      spareFrom = parseInt(sm[1], 10);
      continue;
    }
    if (ne.length === 1 && /^bits?\s*:?\s*$/i.test(ne[0])) continue; // 'Bit' 标记
    if (ne.length === 1) {
      const m = ANNO.exec(ne[0]);
      if (m) {
        // 散文排除（看第一处注记之前的名部）：字段描述会成句引用位号——'This bit indicates
        // …(CP CIoT) bit (octet 8, bit 3) is set to 1…'（句号/This bit 开头）。字段头是
        // 「名字 + 注记」，名字后可再跟 '\n' 描述或同行走文（'ProSe (octet 7, bit 7)This bit…'），
        // 其注记也可能在后文被引用多次（S1-U 行实证），注记个数不是判据。
        const before = ne[0].slice(0, m.index);
        const prose = /\.\s/.test(before) || /^this bit/i.test(before);
        if (!prose) {
          const name = ne[0].slice(0, m.index).replace(/[\s:]+$/, '').trim();
          if (m[2] != null) {
            last = { name, octet: m[1], hi: +m[2], lo: m[3] != null ? +m[3] : +m[2] };
            fields.push(last);
            cur = null;
          } else {
            cur = { name, octet: m[1] };
          }
          continue;
        }
      }
    }
    if (cur && ne.length <= 4 && ne.every((t) => /^[1-8]$/.test(t))
      && ne.every((t, i) => i === 0 || +ne[i - 1] > +t)) {
      // 位号行（严格降序排除值行 ['1','1',…] 误中）
      last = { name: cur.name, octet: cur.octet, hi: +ne[0], lo: +ne[ne.length - 1] };
      fields.push(last);
      cur = null;
      continue;
    }
    // 值行 / 描述续行 / 散文——值语义不随布局携带，一并忽略
    void joined;
  }
  if (fields.length < 2) return null;
  const byOct = new Map();
  for (const f of fields) {
    if (!byOct.has(f.octet)) byOct.set(f.octet, []);
    byOct.get(f.octet).push(f);
  }
  const octs = [...byOct.keys()].map(Number).sort((a, b) => a - b).map((n) => {
    const fs = (byOct.get(String(n)) || []).sort((a, b) => b.hi - a.hi);
    let prevLo = 9;
    return {
      octet: String(n),
      count: 1,
      fields: fs.map((f) => {
        const pre = prevLo - f.hi - 1;
        prevLo = f.lo;
        return { name: f.name, bits: f.hi - f.lo + 1, hi: f.hi, lo: f.lo, ...(pre > 0 ? { pre } : {}) };
      }),
    };
  });
  // 内容值可变长（len 列 '4 - 15' 类）：首个内容八位组之后全部标 optional（'*'），解码时
  // 字节耗尽即缺席；spare 尾注从最后一个字段八位组的下一八位组起吞尾
  for (let i = 1; i < octs.length; i++) {
    if (!/-/.test(octs[i].octet)) octs[i].octet += '*';
  }
  if (spareFrom != null && octs.length) {
    const lastN = +octs[octs.length - 1].octet.replace(/\*$/, '');
    const start = Math.max(spareFrom, lastN + 1);
    if (start > lastN) octs.push({ octet: `${start}-n*`, count: 1, open: true, fields: [{ name: 'Spare', bits: 8, hi: 8, lo: 1 }] });
  }
  return { octets: octs };
}

// ---- 值域表位号锚点（v1.13）--------------------------------------------------------
// 位图 figure 的配套 prose 表给出明文位号，两种形态：
//   跨行：['Follow-on proceed (octet 1)',''] → ['Bit'] → ['4']；
//         ['Type of attach (octet 1, bit 1 to 3)',…]（位号内联在名称格里）；
//         ['CSMT (1 bit field)'] → ['Bit'] → ['1']（无 octet 号——单八位组图省略）。
//   内嵌：'CS Domain TSC Set (octet 2): …\nBit\n1 2\n0 0 TSC set 1…'（10.5.2.82 巨格）。
// 产物：{ 节号: [{ name, octet, hi, lo }] }；octet=null 表示适用该节任一单八位组行。
function extractBitAnchors(valueTables) {
  const out = {};
  const normText = (t) => (t || '').replace(/\s*\n\s*/g, ' ').trim();
  const bitsFromSpec = (spec) => {
    const nums = (spec.match(/\d+/g) || []).map(Number).filter((n) => n >= 1 && n <= 8);
    if (!nums.length) return null;
    if (/to|-|—/.test(spec)) return { hi: Math.max(...nums), lo: Math.min(...nums) };
    const hi = Math.max(...nums);
    const lo = Math.min(...nums);
    if (nums.length > 1 && hi - lo + 1 !== nums.length) return null; // 非连续位号 → 不作锚
    return { hi, lo };
  };
  const NAME_OCT = /^(.{2,70}?)\s*\(\s*octet\s+(\d+)\s*(?:,\s*bits?\s+([\d\- to]+?)\s*)?\)\s*:?\s*$/i;
  const NAME_FIELD = /^(.{2,70}?)\s*\(\s*(\d+)\s*bit\s+field\s*\)\s*:?\s*$/i;
  const generic = (n) => /^(the|value|information|element|note|bits?)\b/i.test(n || '');
  const push = (sec, name, octet, spec) => {
    const b = bitsFromSpec(spec || '');
    if (!b || !name || generic(name)) return;
    (out[sec] = out[sec] || []).push({ name: normText(name), octet: octet == null ? null : Number(octet), hi: b.hi, lo: b.lo });
  };
  for (const vt of valueTables || []) {
    const sec = vt.section;
    if (!sec) continue;
    for (let ri = 0; ri < (vt.rows || []).length; ri++) {
      for (const cellText of vt.rows[ri]) {
        if (!cellText) continue;
        // 形态 A：巨格内嵌——按行扫：name(octet N): 散文… 行挂起（冒号后可接散文，44.018
        // 10.5.2.82 实证），'Bit(s)' 裸行武装或 'bit N' 内联位号（44.018 10.5.2.49 实证），
        // 数字行收锚
        if (cellText.includes('\n')) {
          let pending = null;
          for (const line of cellText.split('\n')) {
            const t = line.trim();
            const nm = /^(.{2,70}?)\s*\(\s*octet\s+(\d+)\s*(?:,\s*bits?\s+([\d\- to]+?)\s*)?\)\s*:?\s*(.*)$/i.exec(t);
            if (nm && !generic(nm[1])) {
              if (pending && pending.spec) push(sec, pending.name, pending.octet, pending.spec);
              const inline = nm[3] && /^[\d ]+(?:\s*to\s*\d+)?$/i.test(nm[3].trim()) ? nm[3].trim() : null;
              pending = { name: normText(nm[1]), octet: Number(nm[2]), spec: inline };
              continue;
            }
            const bt = /^bits?\s*[:=]?\s*(\d[\d ]*(?:\s*to\s*\d+)?)$/i.exec(t);
            if (bt) {
              if (pending) { push(sec, pending.name, pending.octet, bt[1]); pending = null; }
              continue;
            }
            if (/^bits?\s*:?\s*$/i.test(t)) { if (pending && !pending.spec) pending.armed = true; continue; }
            const dm = /^([\d ]+)$/.exec(t);
            if (dm && pending && (pending.armed || pending.spec)) {
              push(sec, pending.name, pending.octet, pending.spec || t);
              pending = null;
            }
          }
          if (pending && pending.spec) push(sec, pending.name, pending.octet, pending.spec);
          continue;
        }
        const t = normText(cellText);
        const nm = NAME_OCT.exec(t);
        if (nm) {
          // 形态 B：名称格 → 向下找 Bit 行 → 数字行（位号也可能已内联）
          const name = normText(nm[1]);
          const octet = Number(nm[2]);
          if (nm[3]) { push(sec, name, octet, nm[3]); continue; }
          const bj = vt.rows.findIndex((r, k) => k > ri && r.some((c) => /^bits?\s*:?$/i.test(normText(c))));
          if (bj < 0) continue;
          const dig = (vt.rows[bj + 1] || []).map(normText).filter((c) => /^\d{1,2}$/.test(c) && +c <= 8);
          if (dig.length) push(sec, name, octet, dig.join(' '));
          continue;
        }
        const nf = NAME_FIELD.exec(t);
        if (nf) {
          const bj = vt.rows.findIndex((r, k) => k > ri && r.some((c) => /^bits?\s*:?$/i.test(normText(c))));
          if (bj < 0) continue;
          const dig = (vt.rows[bj + 1] || []).map(normText).filter((c) => /^\d{1,2}$/.test(c) && +c <= 8);
          if (dig.length) push(sec, normText(nf[1]), null, dig.join(' '));
        }
      }
    }
  }
  return out;
}

// ---- 布局锚点走查（v1.13）----------------------------------------------------------
// 加宽数字格区列宽膨胀（10.5.5.x 实证：FOP 画 3 格实占 1 位）→ parseBitTable 行位宽合计
// 不合而跳过。此处用同节值域表锚点恢复：字段按序自 MSB 游标堆叠（pre = 前导空位）；锚点
// 字段钉在锚点位号；后续锚点位区被上游字段侵入时，回缩最近的无锚/弹性（spare）字段——
// spare 收缩到锚点上沿，无锚命名字段收缩至锚点上沿（FOP→bit4、10.5.2.82 TSC Value 收缩
// 至 8-6 实证）。走查失败（溢出/锚点倒序）→ 返回 null，行保持跳过（诚实拒绝）。
function walkRow(fields, rowTotal, anchors, octetNo, notes, mode = 'flex') {
  const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const tokens = (s) => (s || '').toLowerCase().split(/[^a-z0-9]+/).filter((t) => t.length >= 2 || /\d/.test(t));
  const isSpareName = (n) => /spare/i.test(n) || n === '0' || n === '';
  const octetOk = (a) => !(a.octet != null && octetNo != null && Number(a.octet) !== Number(octetNo));
  const placed = fields.map((f) => ({ ...f, spare: isSpareName(f.name) }));
  // 锚点三遍独占匹配：精确 → 字符包含（FOP↔Follow-on proceed、TMSI↔TMSI flag 实证）→
  // 词子集（Type of algorithm ↔ Type of ciphering algorithm 实证）；每锚至多一字段。
  // 精确轮先行防贪心：'X IEI' 与 'X' 同现时 'X' 先锁锚（10.5.4.12 实证）
  const used = new Set();
  const assigned = new Map();
  for (const f of placed) {
    if (f.spare) continue;
    const n = norm(f.name);
    const a = anchors.find((x) => !used.has(x) && octetOk(x) && norm(x.name) === n);
    if (a) { used.add(a); assigned.set(f, a); }
  }
  for (const f of placed) {
    if (f.spare || assigned.has(f)) continue;
    const n = norm(f.name);
    let best = null;
    for (const x of anchors) {
      if (used.has(x) || !octetOk(x)) continue;
      const an = norm(x.name);
      if (an && (an.includes(n) || n.includes(an)) && (!best || an.length > norm(best.name).length)) best = x;
    }
    if (best) { used.add(best); assigned.set(f, best); }
  }
  for (const f of placed) {
    if (f.spare || assigned.has(f)) continue;
    const ft = tokens(f.name);
    if (!ft.length) continue;
    let best = null;
    for (const x of anchors) {
      if (used.has(x) || !octetOk(x)) continue;
      const xt = tokens(x.name);
      const [short, long] = ft.length <= xt.length ? [ft, xt] : [xt, ft];
      if (short.length && short.every((t) => long.includes(t)) && (!best || xt.length > tokens(best.name).length)) best = x;
    }
    if (best) { used.add(best); assigned.set(f, best); }
  }
  // 放置：非 spare 字段按序自 MSB 游标堆叠；锚点字段钉在锚点位号——游标与锚点顶之间的
  // 空隙归该字段前导 spare（pre 桥接，取 min）；锚点位区被上游无锚字段侵入时回缩最近的
  // 无锚字段。mode='flex'（挂起行救援）：spare 字段不占游标，段末重排进空隙；
  // mode='keep'（已解析行校验）：spare 字段宽度已过 acc 门禁，按列宽正常占游标。
  let cursor = rowTotal;
  for (let i = 0; i < placed.length; i++) {
    const f = placed[i];
    if (f.spare && mode === 'flex') continue;
    const a = assigned.get(f);
    if (a) {
      if (a.hi > cursor) {
        // 回缩：自尾端向前找可收缩的无锚命名字段，收缩至锚点上沿
        let j = i - 1;
        for (; j >= 0; j--) {
          const p = placed[j];
          if (p.spare || assigned.has(p)) continue;
          if (p.lo != null && p.lo <= a.hi && a.hi < p.hi) {
            p.lo = a.hi + 1;
            notes.push(`字段 ${p.name} 列宽与锚点冲突，收缩至 bit ${a.hi + 1}（锚点 ${a.name}）`);
            break;
          }
          return null; // 无可收缩字段 → 锚点倒序，放弃
        }
        if (j < 0) return null;
        cursor = a.hi; // 回缩后游标贴锚点上沿（下方 hi0 再减 pre）
      }
      if (a.lo > a.hi || a.lo < 1) return null;
      // pre 桥接取 min（列宽 pre 伪影截断到真实空隙）；空隙大于图内 pre 时多余部分由
      // 重排段归还给 spare 字段（10.5.6.4 '0 0 0 0 spare'[8-5] 保留实证）
      f.pre = Math.min(f.pre || 0, cursor - a.hi);
      notes.push(`字段 ${f.name} 锚定 bit ${a.hi}${a.hi === a.lo ? '' : '-' + a.lo}`);
      f.hi = a.hi;
      f.lo = a.lo;
      f.anchor = true;
      cursor = a.lo - 1;
    } else {
      const hi0 = cursor - (f.pre || 0);
      const lo = hi0 - f.bits + 1;
      if (lo < 1) return null;
      f.hi = hi0;
      f.lo = lo;
      cursor = lo - 1;
    }
  }
  if (cursor < 0) return null;
  if (mode === 'keep') return placed; // 已解析行：列宽受 acc 门禁保护，不做段末重排
  // spare 字段在锚点回缩后可能越界/重叠——按序重排进空隙，段内最后一个 spare 吞剩余
  let top = rowTotal;
  const out = [];
  for (let i = 0; i < placed.length; i++) {
    const f = placed[i];
    if (!f.spare) {
      if (f.hi > top) return null;
      out.push(f);
      top = f.lo - 1;
      continue;
    }
    const nxt = placed.slice(i + 1).find((g) => !g.spare);
    const floor = nxt ? nxt.hi + (nxt.pre || 0) + 1 : 1;
    let avail = top - floor + 1;
    if (avail < 0) return null;
    const run = [f];
    for (let k = i + 1; k < placed.length && placed[k].spare; k++) run.push(placed[k]);
    const consumed = run.length; // 段内原始 spare 数（splice 丢弃后仍按原占用推进游标）
    let wTop = top;
    for (let k = 0; k < run.length; k++) {
      const w = k === run.length - 1 ? Math.max(0, Math.min(run[k].bits, avail)) : Math.min(run[k].bits, avail);
      run[k].hi = wTop;
      run[k].lo = Math.max(floor, wTop - w + 1);
      if (run[k].lo > run[k].hi) { run.splice(k, 1); k--; continue; } // 空隙耗尽的 spare 丢弃
      wTop = run[k].lo - 1;
      avail = wTop - floor + 1;
      out.push(run[k]);
    }
    top = wTop;
    i += consumed - 1;
  }
  return out;
}

// 锚点走查入口（已解析行的校验层）：列派生位号经 acc 门禁 + 图网格一致，为本——走查
// 仅校验，与锚点不一致时记告警、不改位（Classmark 1 octet2 实证：改写会丢 spare 字段并
// 顶错 Revision）。挂起行的救援走查在 buildIes（mode='flex'，覆写位号）。
function correctIes(ies, anchorsBySection) {
  for (const [sec, ie] of Object.entries(ies || {})) {
    const anchors = anchorsBySection[sec];
    if (!anchors || !anchors.length) continue;
    for (const lay of ie.layouts) {
      for (const row of lay.octets || []) {
        if (row.compressed || row._pending) continue;
        const rowTotal = row.half ? 4 : 8 * (row.count || 1);
        if (rowTotal !== 4 && rowTotal !== 8) continue;
        const notes = [];
        const fixed = walkRow(row.fields, rowTotal, anchors, row.octet, notes, 'keep');
        if (!fixed || !fixed.some((f) => f.anchor)) continue; // 无锚命中不校验
        const cur = row.fields.map((f) => `${f.hi}-${f.lo}`).join(',');
        const nex = fixed.map((f) => `${f.hi}-${f.lo}`).join(',');
        if (cur !== nex) {
          (lay.warnings = lay.warnings || []).push(`octet ${row.octet}: 锚点走查与列派生位号不一致，保持列派生（${cur} vs ${nex}）`);
        }
      }
    }
  }
  return ies;
}

// ---- 消息库 ------------------------------------------------------------------
function buildMessages(msgs, msgTypes, bits) {
  const out = {};
  const problems = [];
  for (const m of msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const rows = m.rows.map((r) => ({
      ...r,
      def: r.ref && bits.find((b) => b.section === r.ref) ? r.ref : null,
    }));
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      rows,
    };
    inst.msgType = resolveMsgType(m.name, m.direction, msgTypes);
    if (inst.msgType == null) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return { out, problems };
}

// 结构化 → schema（codec 消费形态）+ 建库问题清单
function buildSchema(structured, opts = {}) {
  if (structured.spec === '24008') return buildSchema24008(structured, opts);
  if (structured.spec === '29274') return buildSchema29274(structured);
  if (structured.spec === '44018') return buildSchema44018(structured, opts.fillBits, opts.fillValueTables, opts.fillCsn1);
  if (structured.spec === '24080') return buildSchema24080(structured);
  if (structured.spec === '24011') return buildSchema24011(structured);
  if (structured.spec === '23040') return buildSchema23040(structured);
  const msgTypes = parseTypeTables(structured.typeTables);
  const ies = buildIes(structured.bits, structured.valueTables);
  const { out: messages, problems } = buildMessages(structured.msgs, msgTypes, structured.bits);
  return {
    schema: { spec: structured.spec, version: structured.version, msgTypes, ies, messages },
    problems,
  };
}

// ---- CSN.1 Rest Octets 描述符建库（批次D）------------------------------------------------
// 文法表（<ver>.json 的 csn1 键，格文本原样）→ { 节号: { root, defs } }。
// 定义全局池化：SI7/SI8/17/20 别名节的 root 定义位于 SI4/16/18 的表内，按定义名全局检索；
// 44.018 §10.5.1.x 委托 24.008（--fill 并池）。Spare Half Octet（10.5.1.8）两规范均纯散文，
// 按 24.007 Annex B.1.3 预定义库记法合成 <spare half octet> ::= <spare bit>(4)（通用记法，非规范数据）。
const csn1Key = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();

function buildCsn1Descriptors(csn1Tables, sections) {
  const pool = new Map(); // defKey → body
  const secDefs = new Map(); // 节号 → [defKey]
  for (const t of csn1Tables || []) {
    for (const cell of t.cells || []) {
      let parsed;
      try { parsed = parseGrammar(cell); } catch { continue; }
      for (const d of parsed.defs) {
        const k = csn1Key(d.name);
        if (!pool.has(k)) pool.set(k, d.body);
        const arr = secDefs.get(t.section) || [];
        if (!arr.includes(k)) arr.push(k);
        secDefs.set(t.section, arr);
      }
    }
  }
  const titleOf = (sec) => {
    const s = (sections || []).find((x) => x.num === sec);
    return s ? s.title || '' : '';
  };
  const out = {};
  const ensure = (sec, rootKey) => {
    if (!pool.has(rootKey) || out[sec]) return;
    const defs = {};
    const walk = (body) => {
      if (!body || typeof body !== 'object') return;
      if (body.t === 'ref' && body.name) {
        const k = csn1Key(body.name);
        if (pool.has(k) && !Object.prototype.hasOwnProperty.call(defs, k)) {
          defs[k] = pool.get(k);
          walk(defs[k]);
        }
        return;
      }
      if (body.t === 'typed') return walk(body.body);
      if (body.t === 'seq' && body.items) return body.items.forEach(walk);
      if (body.t === 'choice' && body.alts) return body.alts.forEach(walk);
      if (body.t === 'rep') return walk(body.body);
    };
    defs[rootKey] = pool.get(rootKey);
    walk(pool.get(rootKey));
    out[sec] = { root: rootKey, defs };
  };
  // ① 有文法表的节（含 fill 并入节）：root = 节标题匹配的定义，否则节内首定义
  for (const [sec, keys] of secDefs) {
    const tk = csn1Key(titleOf(sec));
    ensure(sec, keys.includes(tk) ? tk : keys[0]);
  }
  // ② 别名节（本节无文法表）：节标题匹配的定义全局检索
  for (const s of sections || []) {
    const tk = csn1Key(s.title || '');
    if (tk && pool.has(tk)) ensure(s.num, tk);
  }
  // ②b 散文别名（'coded/defined as the SI 16/18 Rest Octets' 摄取期解析）：按别名定义名检索
  for (const t of csn1Tables || []) {
    if (t.alias && !out[t.section]) {
      const ak = csn1Key(t.alias);
      if (pool.has(ak)) ensure(t.section, ak);
    }
  }
  // ③ Spare Half Octet：记法库合成
  for (const s of sections || []) {
    if (!out[s.num] && csn1Key(s.title || '') === 'sparehalfoctet') {
      out[s.num] = { root: 'spare half octet', defs: { 'spare half octet': { t: 'spare', n: 4 } } };
    }
  }
  // ④ 并入 ies（位布局可共存——同名 IE 同时有 layouts 与 csn1 时解码优先 csn1）
  return out;
}

function mergeCsn1IntoIes(ies, csn1, sections) {
  for (const [sec, d] of Object.entries(csn1 || {})) {
    const s = (sections || []).find((x) => x.num === sec);
    ies[sec] = { name: (ies[sec] && ies[sec].name) || (s ? s.title : sec), layouts: (ies[sec] && ies[sec].layouts) || [], csn1: d };
  }
  return ies;
}

// ---- 24.008（GSM/UMTS 传承 NAS）建库 -----------------------------------------------
// 差异点（对照 24.501/24.301 管线）：
//   1) 类型值表（§10.2/10.3/10.4/10.4a…）用 x/-/0/1 位模式：x/- = 通配（TI/序号位），
//      建库产出 { value, mask }，解码侧按 (b & mask) === value 匹配；
//   2) 组行（'x x 0 0 - - - - | Registration messages:'）的模式被后续消息行继承；
//   3) 消息内容表是「双物理行」（名称行 + 引用行）→ 合并；IE 名前可能带协议组前缀行；
//   4) 头部 = [PD(V 1/2), SkipInd/TI(V 1/2), Message type(V 1)]：PD 占 octet1 低半
//      （24.007 §10.2/10.3：skip/TI = bits 5-8），表序先低规则与 24.501 一致；
//   5) PD 值按 §9.x 族（TS 24.007 §11.2.3.1.3 分配，pycrate ProtDisc_dict 同源）：
//      RR=6 / MM=5 / CC=3 / GMM=8 / SM=10（GPRS Session Management——非 SMS(9)，
//      wire oracle 实证：pycrate SMActivatePDPContextRequest 帧 octet1=0x0a）。
const PD24008 = { '9.1': 6, '9.2': 5, '9.3': 3, '9.4': 8, '9.5': 10 };

// 24.008 IE 节正文只写「See 3GPP TS 24.301 subclause 9.9.3.x」的映射（10.5.5.0/10.5.5.26：
// 正文为一句引用 + 嵌入图片 figure，无自带位表）。布局取自 24.301 的值语义表
// （parseValueLayout），建库时经 --fill24301 提供同管线摄取的 24.301 产物并入。
const SEE_24301 = { '10.5.5.0': '9.9.3.0B', '10.5.5.26': '9.9.3.34' };

function rowIsTv1(r) {
  const f = (r.format || '').trim().toUpperCase();
  return f === 'TV' && /^[0-9a-fA-F]-$/i.test((r.iei || '').trim());
}

function fillSee24301(ies, messages, fill24301) {
  if (!fill24301) return [];
  const vts = fill24301.valueTables || [];
  const filled = [];
  for (const [sec, ref] of Object.entries(SEE_24301)) {
    if (ies[sec]) continue; // 本版自带布局则让位（未来 24.008 若补位表即自动停用）
    const vt = vts.find((t) => t.section === ref);
    if (!vt || !Array.isArray(vt.rows)) continue;
    const lay = parseValueLayout(vt.rows);
    if (!lay) continue;
    // TV/1（type1，IEI 半八位组）行消费的是 nibble——八位组布局换半八位组行（位号 ≤4）
    const isTv1 = (messages ? Object.values(messages) : []).some((insts) =>
      (insts || []).some((inst) => (inst.rows || []).some((r) => (r.ref === sec || r.def === sec) && rowIsTv1(r))));
    const row = lay.octets[0];
    if (isTv1 && row && !row.half && row.fields.every((f) => f.hi <= 4)) {
      let prevLo = 5;
      row.fields = row.fields.map((f) => {
        const pre = prevLo - f.hi - 1;
        prevLo = f.lo;
        return { name: f.name, bits: f.bits, hi: f.hi, lo: f.lo, ...(pre > 0 ? { pre } : {}) };
      });
      row.half = true;
    }
    ies[sec] = {
      name: (vt.title || '').replace(/^[A-Za-z]\s+/, '') || sec,
      layouts: [{ figure: null, octets: lay.octets }],
      fillFrom: `24.301 ${fill24301.version || ''} §${ref}`.trim(),
    };
    filled.push(`${sec} ← ${ref}`);
  }
  return filled;
}

function parseTypeTables24008(tables) {
  const out = {};
  for (const t of tables || []) {
    let cur = { value: 0, mask: 0 }; // 组模式（未定义位全通配）
    for (const cells of t.rows) {
      const texts = cells.filter((c) => c !== '');
      if (!texts.length) continue;
      const bits = cells.slice(0, 8);
      const name = (texts[texts.length - 1] || '').trim();
      let value = 0;
      let mask = 0;
      let nFixed = 0;
      bits.forEach((b, i) => {
        const s = (b || '').trim();
        if (s === '0' || s === '1') {
          mask |= 1 << (7 - i);
          if (s === '1') value |= 1 << (7 - i);
          nFixed++;
        }
      });
      if (!name && !nFixed) continue;
      const isMsg = /^-\s/.test(name) || /^-\s/.test(texts[0] || '') || nFixed >= 5;
      // 键清洗：规范笔误（'AUTHENTICATION FAILURE…………..'）与缩写原样保留，仅去尾点/省略号
      const clean = name.replace(/^-\s*/, '').replace(/\s+/g, ' ').trim().replace(/[.…\s]+$/, '');
      if (!clean) continue;
      if (isMsg || (!nFixed && cur.mask)) {
        // 消息行：组模式 + 行模式叠加
        const m = cur.mask | mask;
        const v = (cur.value & cur.mask) | (value & mask);
        out[clean.toLowerCase()] = { type: v, mask: m, group: null };
      } else if (nFixed) {
        // 组行：模式被后续消息行继承
        cur = { value, mask };
      }
      // 无位信息且非消息行 → 续行文本（跨行组名），忽略
    }
  }
  return out;
}

function resolveMsgType24008(name, msgTypes, direction) {
  const key = name.toLowerCase();
  const exact = msgTypes[key];
  if (exact) return exact;
  const base = key.replace(/\s*\(.*\)$/, '');
  if (msgTypes[base]) return msgTypes[base];
  // GMM/SM 类型表用缩写名（'Authentication and ciphering req'）、SM 方向变体
  // （'…request(network to ms direction)'）与 9.4.20 等别名 → 前缀匹配 + 方向消歧 + 最长优先
  let pref = Object.entries(msgTypes).filter(([k]) => (k.startsWith(base) || base.startsWith(k)) && Math.min(k.length, base.length) >= 8);
  if (pref.length > 1 && direction) {
    const dirKey = /network to (ms|mobile)/i.test(direction) ? 'network to ms'
      : /(ms|mobile) to network/i.test(direction) ? 'ms to network' : null;
    if (dirKey) {
      const byDir = pref.filter(([k]) => k.includes(dirKey) || !/direction\)/.test(k));
      if (byDir.length >= 1) pref = byDir;
    }
  }
  if (pref.length >= 1) {
    pref.sort((a, b) => b[0].length - a[0].length);
    return pref[0][1];
  }
  const suf = Object.entries(msgTypes).filter(([k]) => key.endsWith(k) || k.endsWith(key));
  if (suf.length === 1) return suf[0][1];
  return null;
}

// 24.008 §10.4 的 4 个子表无域标签且跨域同名（identity request：MM 0x18 组继承 vs GMM
// 0x15 全位）——合并 map 会同键覆盖，让 MM 实例挂上 GMM 值（wire oracle 实证）。
// 域归属：每个子表与"行名命中最多的消息族"配对（数据驱动，版本鲁棒），resolve 时先查域表。
const DOM24008 = [['9.2', 'mm'], ['9.3', 'cc'], ['9.4', 'gmm'], ['9.5', 'sm']];

// 消息内容表双物理行合并 + 名称清理 + def 解析（24008/44018/24080 三族共用）。
// 引用行（名称全空，仅 ref）与名称续行（长 IE 名跨两物理行，如 'Ciphering key sequence'
// +'number'）都并入前行。续行不占字节，但若不并会把相邻半八位组行拆成两个独立 VH run
// 各吞整字节——wire oracle 实证多算 1 字节。引用有两种落点：ref 列（r.ref）或直接把
// 节号写进 name 列（'10.5.3.5a'）——都收。
const REF_ONLY = /^\d+(?:\.\d+)+[A-Za-z]?$/;

function mergeContentRows(structured, rows) {
  const merged = [];
  for (const r of rows) {
    const prev = merged[merged.length - 1];
    if (prev && !(r.iei || '').trim() && !(r.presence || '').trim() && !(r.format || '').trim() && !(r.len || '').trim()) {
      const nm = (r.name || '').trim();
      // 'TS 24.008' 跨规范引用拆出的 'TS' 是规范指称不是名称续词（24.080 RELEASE COMPLETE
      // 的 Cause 行），不并入名称
      const refInName = !r.ref && REF_ONLY.test(nm) ? nm : null;
      if (nm && !refInName && !/^TS\b/i.test(nm) && !(prev.name || '').toLowerCase().includes(nm.toLowerCase())) {
        prev.name = `${(prev.name || '').trim()} ${nm}`.replace(/\s+/g, ' ');
      }
      const ref = r.ref || refInName;
      if (ref && !prev.def && !prev.ref) {
        prev.ref = ref;
        prev.def = structured.bits.find((b) => b.section === ref) ? ref : null;
      }
      continue;
    }
    merged.push({ ...r });
  }
  // IE 名去协议组前缀行（'Mobility management\nProtocol discriminator' → 取末行）
  for (const r of merged) {
    if (r.name && r.name.includes('\n')) {
      const lines = r.name.split('\n').map((s) => s.trim()).filter(Boolean);
      if (lines.length > 1) r.name = lines[lines.length - 1];
    }
    // def 解析：精确节号 → 字母后缀变体回退基表（'10.5.7.4a' GPRS Timer 3 值域格式
    // 与 10.5.7.4 同族，语义展示用）；名称尾带节号的（'… 10.5.5.15a'）拆出。
    if (!r.ref) {
      const sm = /^(.*?)\s+(\d+(?:\.\d+)+[A-Za-z]?)$/.exec((r.name || '').trim());
      if (sm) { r.name = sm[1].trim(); r.ref = sm[2]; }
    }
    if (r.ref && !r.def) {
      r.def = structured.bits.find((b) => b.section === r.ref)
        ? r.ref
        : structured.bits.find((b) => b.section === r.ref.replace(/[A-Za-z]$/, ''))
          ? r.ref.replace(/[A-Za-z]$/, '')
          : null;
      // 子节号前缀回退：IE 定义拆多幅图时消息行只引基节号（44.018 10.5.2.13 → 10.5.2.13.2…）
      if (!r.def) {
        const sub = structured.bits.find((b) => b.section && b.section.startsWith(`${r.ref}.`));
        if (sub) r.def = sub.section;
      }
    }
  }
  return merged;
}

function buildSchema24008(structured, opts = {}) {
  const msgTypes = parseTypeTables24008(structured.typeTables);
  const domNames = {};
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const d = DOM24008.find(([p]) => (m.section || '').startsWith(p));
    if (d) (domNames[d[1]] = domNames[d[1]] || new Set()).add(m.name.toLowerCase());
  }
  const tableOf = {};
  for (const t of structured.typeTables || []) {
    const map = parseTypeTables24008([t]);
    const scored = DOM24008.map(([, d]) => [d, Object.keys(map).filter((k) => domNames[d]?.has(k)).length])
      .sort((a, b) => b[1] - a[1]);
    if (scored[0][1] > 0 && scored[0][1] > scored[1][1]) {
      tableOf[scored[0][0]] = { ...(tableOf[scored[0][0]] || {}), ...map }; // 同域多表合并（MO/MT 同名同值）
    }
  }
  const ies = buildIes(structured.bits, structured.valueTables);
  mergeCsn1IntoIes(ies, buildCsn1Descriptors(structured.csn1, structured.sections), structured.sections);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows(structured, m.rows);
    const pd = PD24008[Object.keys(PD24008).find((k) => (m.section || '').startsWith(k))] ?? null;
    const dom = DOM24008.find(([p]) => (m.section || '').startsWith(p));
    const domMap = (dom && tableOf[dom[1]]) || null;
    const t = (domMap && resolveMsgType24008(m.name, domMap, m.direction))
      || resolveMsgType24008(m.name, msgTypes, m.direction);
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd,
      rows: merged,
    };
    if (t) {
      inst.msgType = t.type;
      inst.msgMask = t.mask;
    } else {
      inst.msgType = null;
      problems.push(`${m.section} ${m.name}: 无消息类型值`);
    }
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  const filled = fillSee24301(ies, out, opts.fill24301);
  return {
    schema: { spec: '24008', version: structured.version, msgTypes, ies, messages: out },
    problems,
    filled,
  };
}

// ---- 29.274（GTPv2-C）建库 ----------------------------------------------------------
// 框架语义（29.274 §5.1/§8.2.1 原文锚点）：GTPv2-C 头 = [flags: V3|P|T|spare3][Message
// Type(1)][Message Length(2)][TEID(4) 若 T=1][Seq(3)][Spare(1)]；Message Length = 头前 4
// 八位组之外的全部字节数（TEID/Seq/Spare 计入，§5.1 原文）。IE 一律 TLIV（§8.2.1 "all of
// them shall be TLIV"）：Type(1)+Length(2, 不含 IE 自身前 4 八位组)+octet4(Spare|Instance)
// +content；分组 IE 值 = 子 TLIV 串（§6.1.2）。消息类型值 §6.1-1（十进制，'N to M' 区间
// Reserved 跳过）；IE 类型值/长度类别/定长 §8.1-1（'Variable Length / 8.6' 反查位表节号）；
// 消息表 5 列（Information elements|P|Condition / Comment|IE Type|Ins.）——行身份 =
// (IE Type, Instance)，Ins. 'VS'/空 = 实例通配（§6.1.3 vendor-specific）。
const GTP_KEY = (s) => String(s || '').toLowerCase().replace(/note\s*\d+/gi, '').replace(/[^a-z0-9]/g, '');

function gtpIeNameKeys(name) {
  const keys = new Set([GTP_KEY(name)]);
  const noParen = String(name || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  keys.add(GTP_KEY(noParen));
  for (const m of String(name || '').matchAll(/\(([^)]+)\)/g)) keys.add(GTP_KEY(m[1]));
  // 首字母缩写键（§8.1 名称无括号缩写、消息表用缩写的形态——'Trusted WLAN Mode Indication'↔TWMI 实证）
  const words = noParen.split(/\s+/).filter((w) => /^[A-Za-z]/.test(w));
  if (words.length >= 2) keys.add(GTP_KEY(words.map((w) => w[0]).join('')));
  return [...keys].filter(Boolean);
}

// 编辑距离（≤2 截断，小表无性能压力）
function gtpLev(a, b, max = 2) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const prev = new Array(b.length + 1);
  const cur = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    cur[0] = i;
    let rowMax = cur[0];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      rowMax = Math.min(rowMax, cur[j]);
    }
    if (rowMax > max) return max + 1;
    for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

// 拼写容差（规范笔误：§8.1 'Local Distiguished Name' 漏 i，消息表拼对——实证）：
// 只看 ≥6 字符的全称键——缩写/首字母键在编辑距离 2 下互相碰撞（'ldn'↔'apn'/'sn'/'pn'
// 十余个 3 字母键全命中，歧义即全灭——实证），缩写只进精确 keyMap。候选唯一才接受。
function gtpFuzzyEntry(typeCell, entries) {
  const keys = gtpIeNameKeys(typeCell).filter((k) => k.length >= 6);
  let hit = null;
  for (const e of entries) {
    for (const k of gtpIeNameKeys(e.name)) {
      if (k.length < 6) continue;
      for (const q of keys) {
        if (gtpLev(q, k) <= 2) {
          if (hit && hit !== e) return null;
          hit = e;
        }
      }
    }
  }
  return hit;
}

function parseGtpMsgTypes(rows) {
  const out = {};
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    const name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim(); // 格内换行=接口方向注释（'Modify Bearer Command\n(MME/SGSN…)'）
    if (!name || !/^\d+$/.test(first) || /^reserved/i.test(name)) continue;
    out[GTP_KEY(name)] = { type: parseInt(first, 10), mask: 0xff, name };
  }
  return out;
}

function parseGtpIeTypes(rows) {
  const entries = [];
  for (const cells of rows || []) {
    const first = (cells[0] || '').trim();
    const name = (cells[1] || '').split('\n')[0].replace(/\s+/g, ' ').trim();
    const refCell = (cells[2] || '').trim();
    const fixed = (cells[3] || '').trim();
    if (!name || !/^\d+$/.test(first) || /^reserved|^spare/i.test(name)) continue;
    const rm = /((?:Fixed|Variable)\s+Length|Extendable)\s*\/\s*(8\.\d+[a-z]?)/i.exec(refCell); // 'Extendable / 8.28' 无 Length 单词
    entries.push({
      value: parseInt(first, 10),
      name,
      ref: rm ? rm[2] : null,
      kind: rm ? rm[1].toLowerCase() : null,
      fixed: /^\d+$/.test(fixed) ? parseInt(fixed, 10) : null,
    });
  }
  const keyMap = new Map();
  for (const e of entries) for (const k of gtpIeNameKeys(e.name)) if (!keyMap.has(k)) keyMap.set(k, e);
  return { entries, keyMap };
}

function gtpTranslateRows(rows, ctx, problems) {
  const out = [];
  for (const cells of rows || []) {
    const name = (cells[0] || '').replace(/\s+/g, ' ').trim();
    const pres = (cells[1] || '').trim();
    const cond = (cells[2] || '').replace(/\s+/g, ' ').trim();
    const typeCell = (cells[3] || '').trim();
    const insCell = (cells[4] || '').trim();
    if (!typeCell || /^note\b/i.test(typeCell)) continue; // 条件续行 / NOTE 行
    const typeClean = typeCell.replace(/\(\s*see\s+note[^)]*\)/ig, '').replace(/\s+/g, ' ').trim(); // 'IP Address\n(See NOTE 2)' 格内注记后缀
    if (!typeClean || /^note\b/i.test(typeClean)) continue;
    let e = ctx.keyMap.get(GTP_KEY(typeClean));
    if (!e) e = gtpFuzzyEntry(typeClean, ctx.entries); // 拼写容差（唯一命中才接受）
    if (!e) problems.push(`IE 类型未识别: ${typeClean}（${name || cond.slice(0, 30)}）`);
    const ref = e && e.ref ? e.ref : null;
    out.push({
      iei: e ? String(e.value) : null,
      name,
      presence: pres || 'O',
      cond,
      format: 'TLV',
      len: e && e.fixed != null ? String(e.fixed) : null,
      ins: /^\d+$/.test(insCell) ? parseInt(insCell, 10) : null, // 'VS'/空 = 实例通配
      ref,
      def: ref && ctx.ies[ref] && (ctx.ies[ref].layouts?.length || ctx.ies[ref].grouped) ? ref : null,
    });
  }
  return out;
}

function buildSchema29274(structured) {
  const problems = [];
  const t61 = (structured.typeTables || []).find((t) => t.section === '6.1' || t.section === '6.1.0');
  const t81 = (structured.typeTables || []).find((t) => t.section === '8.1');
  const msgTypes = parseGtpMsgTypes(t61 && t61.rows);
  if (!Object.keys(msgTypes).length) problems.push('§6.1 消息类型值表未捕获');
  const ieTypes = parseGtpIeTypes(t81 && t81.rows);
  if (!ieTypes.entries.length) problems.push('§8.1 IE 类型值表未捕获');
  // ies：§8.x 位表直出布局；8.1 反查补 ieType/定长/长度类别
  const ies = {};
  for (const b of structured.bits || []) {
    if (!b.section || !/^8\./.test(b.section)) continue;
    ies[b.section] = { name: b.name, layouts: [{ figure: b.figure, octets: b.octets }], ...(b.warnings && b.warnings.length ? { warnings: b.warnings } : {}) };
  }
  for (const e of ieTypes.entries) {
    if (e.ref && ies[e.ref]) {
      ies[e.ref].ieType = e.value;
      ies[e.ref].fixed = e.fixed;
      ies[e.ref].kind = e.kind;
    }
  }
  // 分组 IE 内容行：§8.x 定义表优先，§7.x 内嵌表仅补缺
  // 分组 IE 内容行：§8.x 的同名表只是 NOTE 占位（NOTE: This table uses a 5-column…，真身内嵌 §7.x）——
  // 无类型格行的一律跳过；§7.x 内嵌表为唯一内容源（同名多表取首个含数据的）
  const gtpHasData = (rows) => (rows || []).some((r) => (r[3] || '').trim() && !/^note/i.test((r[3] || '').trim()));
  const groupedRows = new Map();
  for (const m of structured.msgs || []) {
    if (m.kind !== 'grouped' || !m.groupName) continue;
    if (!gtpHasData(m.rows)) continue;
    if (!groupedRows.has(GTP_KEY(m.groupName))) groupedRows.set(GTP_KEY(m.groupName), m.rows);
  }
  const ctx = { ies, keyMap: ieTypes.keyMap, entries: ieTypes.entries };
  for (const [k, rows] of groupedRows) {
    const e = ieTypes.keyMap.get(k);
    const sec = e && e.ref ? e.ref : null;
    if (sec && ies[sec] === undefined && e.ref) ies[sec] = { name: e.name, layouts: [] };
    if (sec && ies[sec]) {
      ies[sec].grouped = gtpTranslateRows(rows, ctx, problems);
      if (ies[sec].ieType == null) { ies[sec].ieType = e.value; ies[sec].fixed = e.fixed; }
    }
  }
  // 消息实例（§7.x）
  const out = {};
  for (const m of structured.msgs || []) {
    if (m.kind !== 'message' || !/^7\./.test(m.section || '')) continue;
    const rows = gtpTranslateRows(m.rows, ctx, problems);
    const t = msgTypes[GTP_KEY(m.name)];
    if (!t) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    const inst = { section: m.section, tableId: null, direction: null, pd: null, msgType: t ? t.type : null, rows };
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return { schema: { spec: '29274', version: structured.version, msgTypes, ies, messages: out }, problems };
}

// ---- 44.018（GSM RR）建库 -----------------------------------------------------------------
// 24.007 半八位组头家族：PD(V 1/2 低半) + Skip Indicator(V 1/2 高半) + Message type(V 1)；
// CCCH/BCCH 消息（paging/immediate assignment/SI）头部多一行 L2 Pseudo Length(V 1)——
// 通用定长 V 行处理，无需特判；消息尾 Rest Octets（CSN.1）为可变 V 行吞尾。
// 类型值来源 §10.4：10.4.1 主表为多行单元格（类别行 + 'b b b b b b b b NAME' 模式行，全固定位）；
// 10.4.2 为 SACCH 子类型（分离数字格 5 位 + 隐含高位 000：bit8 扩展位恒 0、bit7-6 恒 0）；
// 10.4.3（GTTP）模式行会被收进映射但无消息实例引用；10.4.4/10.4.5（EC-GSM）模式行不足
// 8 位，天然跳过（对应 pycrate 亦无这些 RR 类，wire oracle 同步豁免）。
const PD44018 = 6; // TS 24.007 §11.2.3.1.3：RR=6

function parseTypeTables44018(tables) {
  const out = {};
  const LINE = /^([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01])\s+(.+)$/;
  const normKey = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  for (const t of tables || []) {
    if (!/^10\.4/.test(t.section || '')) continue;
    for (const cells of t.rows) {
      for (const cell of cells) {
        for (const line of String(cell).split('\n')) {
          const m = LINE.exec(line.trim());
          if (!m) continue;
          const name = m[9].trim().replace(/[.…\s]+$/, '');
          if (!name || /^reserved/i.test(name)) continue; // 'Reserved (see NOTE)' 占位
          const type = parseInt(m.slice(1, 9).join(''), 2);
          out[normKey(name)] = { type, mask: 0xff };
        }
      }
      // 形态二：SACCH 子类型（≥4 个分离 0/1 数字格 + 末格名称；表头只有 bits 5-1）
      const digs = [];
      let name = null;
      for (const c of cells) {
        const s = String(c).trim();
        if (!name && /^[01]$/.test(s)) digs.push(s);
        else if (s) name = s;
      }
      if (digs.length >= 4 && name && digs.length <= 7) {
        const bits8 = '0'.repeat(8 - digs.length) + digs.join('');
        out[normKey(name)] = { type: parseInt(bits8, 2), mask: 0xff };
      }
    }
  }
  return out;
}

// 名称对齐（跨表名称形态差异实证）：'CDMA 2000 …' vs 'CDMA2000 …'（去非字母数字）、
// 'CONFIGURATION CHANGE ACK.' vs '… ACKNOWLEDGE'（规范化后前缀匹配，最长优先）、
// 内容表偶漏 'TYPE' 词（'SYSTEM INFORMATION 15'，j00 9.1.43j）→ 双侧均试去 type 形态。
function resolveMsgType44018(name, msgTypes) {
  const normKey = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const key = normKey(name);
  const keyT = key.replace(/type/g, '');
  for (const c of [key, keyT]) if (msgTypes[c]) return msgTypes[c];
  let best = null;
  for (const [k, v] of Object.entries(msgTypes)) {
    for (const kk of new Set([k, k.replace(/type/g, '')])) {
      for (const c of [key, keyT]) {
        if ((kk.startsWith(c) || c.startsWith(kk)) && Math.min(kk.length, c.length) >= 8) {
          if (!best || kk.length > best[0]) best = [kk.length, v];
        }
      }
    }
  }
  return best ? best[1] : null;
}

function buildSchema44018(structured, fillBits, fillValueTables, fillCsn1) {
  // 跨规范位表并入：44.018 §10.5.1.x（Mobile Identity / Classmark / LAI 等）正文只有
  // 'See 3GPP TS 24.008.'——节号与 24.008 §10.5.1.x 同编，用 24.008 摄取产物的位表补齐
  // （只并本地缺失的节号，本地优先）。并入节的值域表随行并入（挂起行的锚点走查依赖）；
  // CSN.1 文法表同路并入（10.5.1.7 MS Classmark 3 = 24.008 CSN.1 文法）。
  const localBits = new Set(structured.bits.map((b) => b.section));
  const extraBits = (fillBits || []).filter((b) => b.section && !localBits.has(b.section));
  const allBits = structured.bits.concat(extraBits);
  const localVt = new Set((structured.valueTables || []).map((v) => v.section));
  const allValueTables = (structured.valueTables || []).concat(
    (fillValueTables || []).filter((v) => v.section && !localVt.has(v.section))
  );
  const localCsn1 = new Set((structured.csn1 || []).map((v) => v.section));
  const allCsn1 = (structured.csn1 || []).concat(
    (fillCsn1 || []).filter((v) => v.section && !localCsn1.has(v.section))
  );
  const msgTypes = parseTypeTables44018(structured.typeTables);
  const ies = buildIes(allBits, allValueTables);
  mergeCsn1IntoIes(ies, buildCsn1Descriptors(allCsn1, structured.sections), structured.sections);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows({ ...structured, bits: allBits }, m.rows);
    const t = resolveMsgType44018(m.name, msgTypes);
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd: PD44018,
      mtOff: mtOffset(merged),
      rows: merged,
    };
    if (t) {
      inst.msgType = t.type;
      inst.msgMask = t.mask;
    } else {
      inst.msgType = null;
      problems.push(`${m.section} ${m.name}: 无消息类型值`);
    }
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return {
    schema: { spec: '44018', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// Message type 行的八位组偏移（wireshark 平文本派发用；44.018 CCCH 消息头部多 L2 Pseudo
// Length → 2，其余 → 1）。行序累计：VH 0.5、定长 V 按字节数，遇 message type 行为止。
function mtOffset(rows) {
  let acc = 0;
  for (const r of rows) {
    if (/message (identity|type)/i.test((r.name || ''))) break;
    const f = rowFormat(r);
    if (f === 'VH') acc += 0.5;
    else if (f === 'V') acc += fixedLen(r.len) ?? 0;
  }
  return Math.round(acc);
}

// ---- 24.080（SS/USSD）建库 -----------------------------------------------------------------
// 24.007 半八位组头家族：PD(V 1/2 低半) + Transaction identifier(V 1/2 高半) + Message type(V 1)。
// 三消息（FACILITY/REGISTER/RELEASE COMPLETE）的 IE 全是 TLV/LV 不透明载荷（Facility 的
// ROSE 组件是 BER 编码，不在位表管线范围）。
// 消息类型值（表 3.1，x/. 通配形态不机读；高两位 CS 域序号位编码 0）：FACILITY=0x3A、
// REGISTER=0x3B、RELEASE COMPLETE=0x2A——与 24.008 §10.3.2 同源且分配恒定，pycrate
// TS24080 出帧实证（0b3a/0b3b/0b2a）。三常量硬编码与 PD24008 同一待遇。
const PD24080 = 11; // TS 24.007 §11.2.3.1.3：SS=11

const SS_MSG_TYPES = {
  facility: { type: 0x3a, mask: 0xff },
  register: { type: 0x3b, mask: 0xff },
  'release complete': { type: 0x2a, mask: 0xff },
};

function buildSchema24080(structured) {
  const ies = buildIes(structured.bits, structured.valueTables);
  const msgTypes = {};
  for (const [k, v] of Object.entries(SS_MSG_TYPES)) msgTypes[k] = { ...v, group: null };
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows(structured, m.rows);
    const t = SS_MSG_TYPES[m.name.toLowerCase()] || null;
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd: PD24080,
      mtOff: 1,
      rows: merged,
    };
    if (t) {
      inst.msgType = t.type;
      inst.msgMask = t.mask;
    } else {
      inst.msgType = null;
      problems.push(`${m.section} ${m.name}: 无消息类型值`);
    }
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return {
    schema: { spec: '24080', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// ---- 24.011（SMS CP/RP 层）建库 -------------------------------------------------------------
// CP 消息（§7.2.x）：24.007 半八位组头家族 PD(V 1/2 低半) + Transaction identifier(V 1/2 高半)
// + Message type(V 1)，PD=9（SMS）；CP-User data = LV、CP-Cause = V 1（消息表 + pycrate
// Type4LV/Type3V 双证——§8.1.4.x 元素图里的 'IEI' 行是遗迹，线上无 IEI 字节）。
// RP 消息（§7.3.x）：无 PD——octet1 = RP-Message Type（3 位 MTI + spare，整字节常量）；
// 地址/载荷全 LV，RP-ACK/RP-ERROR 的 RP-User data = TLV(0x41)。RP-MTI 值来自表 8.3
// （3 位 + 方向 + 名称），方向编码 ms->n/n->ms；表缺项时用常量兜底（五版表 8.3 全赋值）。
const PD24011_CP = 9; // TS 24.007 §11.2.3.1.3：SMS=9

const CP24011_TYPES = { 'cp-data': 0x01, 'cp-ack': 0x04, 'cp-error': 0x10 };
const RP24011_TYPES = {
  'rp-data|ms->n': 0x00,
  'rp-data|n->ms': 0x01,
  'rp-ack|ms->n': 0x02,
  'rp-ack|n->ms': 0x03,
  'rp-error|ms->n': 0x04,
  'rp-error|n->ms': 0x05,
  'rp-smma|ms->n': 0x06,
};

// CP 表 8.1：多行单元格位模式（'0 0 0 0 0 0 0 1 CP-DATA'，44.018 §10.4.1 同款）；
// RP 表 8.3：['0 0 0','ms -> n','RP-DATA'] 三元行（3 位 + 方向 + 名称，Reserved 跳过）。
function parseTypeTables24011(tables) {
  const out = {};
  const LINE = /^([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01])\s+(.+)$/;
  for (const t of tables || []) {
    for (const cells of t.rows) {
      for (const cell of cells) {
        for (const line of String(cell).split('\n')) {
          const m = LINE.exec(line.trim());
          if (!m) continue;
          const name = m[9].trim().replace(/[.…\s]+$/, '');
          if (!name) continue;
          out[`${name.toLowerCase()}|`] = { type: parseInt(m.slice(1, 9).join(''), 2), mask: 0xff, dir: null };
        }
      }
      const digs = String(cells[0] || '').trim();
      if (/^[01] [01] [01]$/.test(digs) && cells.length >= 3) {
        const dir = String(cells[1] || '').replace(/\s+/g, '');
        const nm = String(cells[2] || '').trim();
        if (dir && nm && !/^reserved/i.test(nm)) {
          out[`${nm.toLowerCase()}|${dir}`] = { type: parseInt(digs.replace(/ /g, ''), 2), mask: 0xff, dir };
        }
      }
    }
  }
  return out;
}

// CP 类型表键带 '|' 后缀（无方向），与 RP 方向键 'name|dir' 统一前缀查找。
// 实例方向已知 → 单值；未知（RP-ACK/RP-ERROR 双向共用一张内容表）→ 每方向一实例。
function resolveMsgType24011(name, direction, msgTypes) {
  const key = `${name.toLowerCase()}|`;
  const dirEntries = Object.entries(msgTypes).filter(([k]) => k.startsWith(key));
  if (dirEntries.some(([, v]) => v.dir)) {
    const dirKey = direction
      ? (/network to ms/i.test(direction) ? 'n->ms' : /ms to network/i.test(direction) ? 'ms->n' : null)
      : null;
    if (dirKey) {
      const hit = dirEntries.find(([k]) => k.endsWith(`|${dirKey}`));
      if (hit) return [hit[1]];
    }
    return dirEntries.map(([, v]) => v);
  }
  const e = msgTypes[key] || null;
  return e ? [e] : [];
}

// len 列归一化：'1/2 octet'→'1/2'、'2-3 octets'→'2-3'、'3 bits'→'1'（RP-MTI 3 位 + spare 位 0）。
function normRow24011(r) {
  const len = (r.len || '').trim();
  const nl = /^3 bits$/i.test(len) ? '1' : len.replace(/\s*octets?\s*$/i, '').trim();
  return { ...r, len: nl };
}

function buildSchema24011(structured) {
  const parsed = parseTypeTables24011(structured.typeTables);
  const msgTypes = {};
  for (const [k, v] of Object.entries(CP24011_TYPES)) if (!parsed[`${k}|`]) msgTypes[`${k}|`] = { type: v, mask: 0xff, dir: null };
  for (const [k, v] of Object.entries(RP24011_TYPES)) if (!parsed[k]) msgTypes[k] = { type: v, mask: 0xff, dir: k.split('|')[1] };
  for (const [k, v] of Object.entries(parsed)) msgTypes[k] = { ...v };
  const ies = buildIes(structured.bits, structured.valueTables);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const merged = mergeContentRows(structured, m.rows).map(normRow24011);
    const cands = resolveMsgType24011(m.name, m.direction, msgTypes);
    if (!cands.length) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    for (const t of cands.length ? cands : [null]) {
      const inst = {
        section: m.section,
        tableId: m.tableId,
        direction: t?.dir ? (t.dir === 'ms->n' ? 'ms to network' : 'network to ms') : m.direction,
        pd: t && !t.dir ? PD24011_CP : null,
        mtOff: mtOffset(merged),
        rows: merged,
      };
      inst.msgType = t ? t.type : null;
      inst.msgMask = t ? t.mask : null;
      (out[m.name] = out[m.name] || []).push(inst);
    }
  }
  return {
    schema: { spec: '24011', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// ---- 23.040（SMS TPDU 层）建库 --------------------------------------------------------------
// TPDU 参数表（Abbr./Reference/P/R/Description）→ codec 行。与 IE 行表的结构差异：
//   1) octet1 是位打包（TP-MTI 2 位 + 若干 1 位参数）→ 单一 V 1 行，名称取规范全称
//      'TP-Message Type Indicator'（含 'message type' 词 → codec 自动行 + 掩码匹配），
//      msgMask=0x03；其余位参数并入该字节（problems 记录，解码显示原始八位组）；
//   2) TP-OA/TP-DA/TP-RA 自描述地址（长度按半八位组计）→ 行格式 ADDR（codec 扩展）；
//   3) TP-VP 长度由 octet1 的 TP-VPF 位定（0/1/7）→ 行格式 VP（codec 扩展）；
//   4) 最后一个 M 行之后的 O 行折叠为消息尾可变 V 行——TP-PI 位门控的
//      TP-PID/TP-DCS/TP-UDL/TP-UD 整段有字节则吞入、无则缺席（wire 级精确；
//      位级展开留语义层）；
//   5) TP-MTI 值：§9.2.3.1 散文（00/01/10 两两按方向成对，按名唯一）→ 常量；
//   6) TP-CD：k00 表丢行（f00 有）——按 TP-CDL 定义补可变 V 尾行，problems 记录。
const SMS23040_TYPES = {
  'sms-deliver': { type: 0x00, mask: 0x03 },
  'sms-deliver-report': { type: 0x00, mask: 0x03 },
  'sms-submit': { type: 0x01, mask: 0x03 },
  'sms-submit-report': { type: 0x01, mask: 0x03 },
  'sms-status-report': { type: 0x02, mask: 0x03 },
  'sms-command': { type: 0x02, mask: 0x03 },
};

const SMS23040_ADDR = new Set(['TP-OA', 'TP-DA', 'TP-RA']);

function rows23040(rows, problems, section, name) {
  const abbrOf = (r) => (r.name || '').replace(/\s*\d+\)\s*$/, '').trim().replace(/\s+/g, ' ');
  const presOf = (r) => (/^[MO]/i.test((r.presence || '').trim()) ? r.presence.trim().charAt(0).toUpperCase() : 'O');
  const isBit = (r) => /^(?:1|2)?b$/i.test((r.format || '').trim()); // 'b'（1 位）/ '2b'（TP-VPF）；TP-MTI 先行分支
  let lastM = -1;
  rows.forEach((r, i) => { if (presOf(r) === 'M' && !isBit(r)) lastM = i; });
  const out = [];
  const bits = [];
  const tail = [];
  let hasCD = false;
  rows.forEach((r, i) => {
    const abbr = abbrOf(r);
    if (abbr === 'TP-CD') hasCD = true;
    const pres = presOf(r);
    const ref = r.ref && /^TP-/i.test(r.ref) ? r.ref : null; // ref 列是参数全称，非节号
    if (abbr === 'TP-MTI') {
      out.push({ iei: '', name: 'TP-Message Type Indicator', ref, presence: 'M', format: 'V', len: '1' });
      return;
    }
    if (i > lastM) { tail.push({ abbr, pres, ref }); return; }
    if (isBit(r)) { bits.push(`${abbr}${pres === 'O' ? '(O)' : ''}`); return; }
    if (SMS23040_ADDR.has(abbr)) {
      out.push({ iei: '', name: abbr, ref, presence: pres, format: 'ADDR', len: (r.len || '').trim() });
      return;
    }
    if (abbr === 'TP-VP') {
      out.push({ iei: '', name: abbr, ref, presence: pres, format: 'VP', len: (r.len || '').trim() });
      return;
    }
    if (abbr === 'TP-CD') {
      // 长度 = TP-CDL（f00 表标 'o' 不准）——可变尾行
      out.push({ iei: '', name: abbr, ref, presence: pres, format: 'V', len: '' });
      return;
    }
    const m = /^(\d+)o$/i.exec((r.format || '').trim());
    out.push({ iei: '', name: abbr, ref, presence: pres, format: 'V', len: m ? m[1] : '1' });
  });
  if (tail.length) {
    const gated = tail.length > 1 || tail[0].abbr === 'TP-PI';
    out.push({
      iei: '',
      name: gated ? `${tail.map((t) => t.abbr).join(' / ')} (TP-PI bit gated)` : tail[0].abbr,
      ref: tail[0].ref,
      presence: tail.some((t) => t.pres === 'M') ? 'M' : 'O',
      format: 'V',
      len: '',
    });
  } else if (hasCD) {
    out.push({ iei: '', name: 'TP-CD', ref: null, presence: 'O', format: 'V', len: '' });
  }
  if (name === 'SMS-COMMAND' && !tail.length && !hasCD) {
    // k00 表丢了 TP-CD 行（f00 有，TP-CDL 定义 'length of the TP-CD field'）——补尾行
    out.push({ iei: '', name: 'TP-CD', ref: null, presence: 'O', format: 'V', len: '' });
    problems.push(`${section} ${name}: 表缺 TP-CD 行（k00 编辑遗漏，f00 有）——按 TP-CDL 定义补可变尾行`);
  }
  if (bits.length) problems.push(`${section} ${name}: octet1 位参数并入 TP-MTI 字节（${bits.join(', ')}）`);
  return out;
}

function buildSchema23040(structured) {
  const msgTypes = {};
  for (const [k, v] of Object.entries(SMS23040_TYPES)) msgTypes[k] = { ...v, group: null };
  const ies = buildIes(structured.bits, structured.valueTables);
  const out = {};
  const problems = [];
  for (const m of structured.msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const rows = rows23040(m.rows, problems, m.section, m.name);
    const base = m.name.toLowerCase().replace(/\s*\(.*\)$/, '');
    const t = msgTypes[base] || null;
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      pd: null,
      mtOff: 0,
      rows,
    };
    inst.msgType = t ? t.type : null;
    inst.msgMask = t ? t.mask : null;
    if (!t) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    (out[m.name] = out[m.name] || []).push(inst);
  }
  return {
    schema: { spec: '23040', version: structured.version, msgTypes, ies, messages: out },
    problems,
  };
}

// ---- 浏览器/通用入口：docx（或内含 docx 的 zip）→ { schema, structured, problems, stats } ----
// zipBytes: .docx 自身即 zip；也接受包着一个 .docx 的外层 zip（3GPP 官方分发形态），
// 或解开的 docx 目录 zip（含 word/document.xml）。.doc 老格式浏览器侧不处理。
async function ingestDocxZip(zipBytes, { spec, version }) {
  const files = await zipUnpack(zipBytes);
  const keys = Object.keys(files);
  let docx = files;
  let docxName = keys.find((n) => /\.docx$/i.test(n) && !n.startsWith('__MACOSX'));
  if (!keys.some((n) => /^word\/document\.xml$/i.test(n))) {
    if (!docxName) {
      if (keys.some((n) => /\.doc$/i.test(n)))
        throw new Error('老格式 .doc：请先在 Word 里转存为 .docx 再导入');
      throw new Error('zip 内没有 .docx（找到: ' + (keys.slice(0, 6).join(',') || '空') + '）');
    }
    docx = await zipUnpack(files[docxName]); // 外层 zip 包 docx → 再解一层
  }
  const docXmlKey = Object.keys(docx).find((n) => /^word\/document\.xml$/i.test(n));
  if (!docXmlKey) throw new Error('docx 内无 word/document.xml（不是有效 Word 文件？）');
  const stylesKey = Object.keys(docx).find((n) => /^word\/styles\.xml$/i.test(n));
  const styleMap = styleMapFromStylesXml(stylesKey ? bytesToUtf8(docx[stylesKey]) : null);
  const structured = ingestDocumentXml(bytesToUtf8(docx[docXmlKey]), styleMap, spec, version);
  const { schema, problems } = buildSchema(structured);
  return { schema, structured, problems, stats: structured.stats, docxName: docxName || '(docx)' };
}

// ==== tools/nassample.mjs ====
// nassample.mjs — M4 对拍采样器：schema 驱动随机消息 → JSONL（供 pycrate 线缆级校验 /
// 全版本回环门禁）。采样规则：M 行必采（V 按定长随机字节 / VH 随机半八位组 / TV 按 len-1 /
// TLV-LV 优先 IE 布局字段采样、否则按 len 区间随机）；C/O 行 p=0.4 随机出现；T 行 p=0.3。
// 用法：node tools/nassample.mjs --schema <schema.json> --samples <N> --out <file.jsonl>
//       [--seed 42] [--msgs 正则]

// mulberry32（与 src/schema/ast.js 同族）
function rng32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fixedLenOf(lenStr) {
  const s = (lenStr || '').trim();
  if (s === '1/2') return 0.5;
  return /^\d+$/.test(s) ? parseInt(s, 10) : null;
}

// 'a-b' 区间 → 值字节数区间（len 列含框架字节：TLV 减 2、LV 减 1、E 类减 2）
function lenRangeOf(lenStr, fmt) {
  const m = /^(\d+)\s*-\s*(\d+)$/.exec((lenStr || '').trim());
  if (!m) return null;
  const hdr = fmt === 'LV' ? 1 : 2;
  return [Math.max(1, parseInt(m[1], 10) - hdr), Math.max(1, parseInt(m[2], 10) - hdr)];
}

// 采样一个 schema：返回 { lines, skipped, okMsgs }（lines = JSON 对象数组）
function sampleSchema(schema, N, seed, msgRe = null) {
  if (schema.spec === '29274') return sampleGtpcSchema(schema, N, seed, msgRe);
  const rng = rng32(seed);
  const rnd = (n) => Math.floor(rng() * n);
  const rbytes = (n) => Uint8Array.from({ length: n }, () => rnd(256));
  const spec = schema.spec;
  const lines = [];
  const skipped = {};
  let okMsgs = 0;

  // 行的值：优先按 IE 布局字段采样（值更合法），无布局则不透明随机字节。
  // V/TV 行定长校验：布局字节数 ≠ 定长 → 回退不透明（布局含开区间尾段等情况）。
  function sampleRowValue(r, fmt, flen) {
    const ref = r.def || (r.ref && schema.ies[r.ref] ? r.ref : null);
    if (ref) {
      const lay = schema.ies[ref].layouts[0];
      if (lay && lay.octets.length) {
        const framed = fmt === 'TV' || fmt === 'TLV' || fmt === 'TLV-E' || fmt === 'LV' || fmt === 'LV-E';
        const { bytes } = layoutSample(lay.octets, rng, framed);
        const expect = fmt === 'V' ? flen : fmt === 'TV' ? (flen != null ? flen - 1 : null) : null;
        if (expect == null || bytes.length === expect) {
          if (bytes.length) return bytes;
        }
        // 定长不符 → 落到不透明回退（线缆级合法，内部语义可能被 oracle 拒：单列计）
      }
    }
    if (fmt === 'TLV' || fmt === 'TLV-E') {
      const rg = lenRangeOf(r.len, fmt);
      if (rg) return rbytes(rg[0] + rnd(Math.min(rg[1] - rg[0] + 1, 24)));
      return rbytes(1 + rnd(24));
    }
    if (fmt === 'LV' || fmt === 'LV-E') {
      const rg = lenRangeOf(r.len, fmt);
      if (rg) return rbytes(rg[0] + rnd(rg[1] - rg[0] + 1));
      return rbytes(1 + rnd(32));
    }
    if (fmt === 'V' && flen == null) {
      // 可变 V（尾行自定位，如安全保护帧的明文消息 / 附件消息的载荷）：采 2..9 字节，
      // 编码器原样写出、解码器吞到消息尾——仅当该行为表尾时解码才成立（否则后续行
      // 失败、该次尝试被丢弃，由重试机制消化）。
      return rbytes(2 + rnd(8));
    }
    if (fmt === 'TV' && flen != null) return rbytes(flen - 1);
    if (fmt === 'V' && flen != null) return rbytes(flen);
    return null;
  }

  for (const [msgName, insts] of Object.entries(schema.messages)) {
    if (msgRe && !msgRe.test(msgName)) continue;
    for (let ii = 0; ii < insts.length; ii++) {
      const inst = insts[ii];
      const instKey = `${msgName}#${ii}`;
      // 可变 V 行不在表尾 → 草稿 TBD 结构，机械上不可编码，诚实跳过
    const lastIdx = inst.rows.length - 1;
    if (inst.rows.some((r, idx) => rowFormat(r) === 'V' && fixedLenOf(r.len) == null && idx !== lastIdx)) {
      skipped[instKey] = skipped[instKey] || '可变V非表尾（草稿 TBD）';
      continue;
    }
    // TV-E（附件 E 以太网口管理）：规范未给出定义文字，不猜编法，诚实跳过
    if (inst.rows.some((r) => (r.format || '').trim().toUpperCase() === 'TV-E')) {
      skipped[instKey] = skipped[instKey] || 'TV-E 格式未实现（附件 E）';
      continue;
    }
    let made = 0;
      for (let k = 0; k < N * 3 && made < N; k++) {
        try {
          const parts = [];
          let ok = true;
          for (let ri = 0; ri < inst.rows.length; ri++) {
            const r = inst.rows[ri];
            const iei = (r.iei || '').replace(/[^0-9a-f]/gi, '');
            const fmt = rowFormat(r); // V/VH/T/TV1/TV/TLV/LV/TLV-E/LV-E 与 codec 同口径
            const flen = fixedLenOf(r.len);
            const name = (r.name || '').toLowerCase();
            const mandatory = /^M$/i.test((r.presence || '').trim());
            if (/extended protocol discriminator|security header type|message (identity|type)/.test(name)) continue; // 头行自动
            if (/^spare half octet$/.test(name) || /^protocol discriminator$/.test(name)) continue; // spare/PD 自动
            if (iei && r.iei.includes('TBD')) continue; // 规范 TBD 占位行不可编码
            if (fmt === 'UNK') { if (!mandatory) continue; ok = false; break; } // NOTE 行跳过；FFS 必配行不可采样
            if (!mandatory && rng() > (fmt === 'T' ? 0.3 : 0.4)) continue; // 可选行随机缺席
            if (fmt === 'VP') continue; // TP-VP 长度随 octet1 的 VPF 位：自动 MTI 行写 msgType（VPF=0）→ 恒缺席
            let value;
            if (fmt === 'VH' || fmt === 'TV1') { value = rnd(16); }
            else if (fmt === 'T') { value = null; }
            else if (fmt === 'ADDR') {
              const n = rnd(7) * 2; // 偶数个有效半八位组（免半字节填充）
              const a = [n, 0x91];
              for (let i = 0; i < n / 2; i++) a.push(rnd(256));
              value = Uint8Array.from(a);
            }
            else {
              value = sampleRowValue(r, fmt, flen);
              if (value == null) { ok = false; break; }
            }
            parts.push({ rowIdx: ri, value });
          }
          if (!ok) { skipped[instKey] = skipped[instKey] || '可变V'; continue; }
          const bytes = encMsg(inst, parts, spec);
          lines.push({
            msg: msgName, inst: ii, section: inst.section,
            hex: Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join(''),
          });
          made++;
        } catch (e) {
          skipped[instKey] = skipped[instKey] || e.message.slice(0, 60);
        }
      }
      if (made > 0) okMsgs++;
    }
  }
  return { lines, skipped, okMsgs };
}


// ---- GTPv2-C（29.274）采样：头 T=1/TEID=0/Seq=0（encGtpcMsg 缺省零值，回环确定性）；
// 行序 TLIV；分组 IE（Bearer Context/PDN Connection）按子行表递归构值（M 必采、C/CO/O p=0.4）；
// 值来源优先级：分组递归 > IE 位布局（layoutSample）> 定长随机 > 2-9 字节随机。
function gtpcSampleValue(r, schema, rng, depth = 0) {
  const ref = r.def || (r.ref && schema.ies[r.ref] ? r.ref : null);
  if (ref && depth < 4) {
    const ie = schema.ies[ref];
    if (ie.grouped) {
      const body = [];
      for (const cr of ie.grouped) {
        if (cr.iei == null) continue;
        if (!/^M$/i.test((cr.presence || '').trim()) && rng() > 0.4) continue;
        body.push(...gtpcTli(parseInt(cr.iei, 10), cr.ins != null ? cr.ins : 0, gtpcSampleValue(cr, schema, rng, depth + 1)));
      }
      return Uint8Array.from(body);
    }
    if (ie.layouts && ie.layouts[0] && ie.layouts[0].octets.length) {
      const { bytes } = layoutSample(ie.layouts[0].octets, rng, false);
      if (bytes.length) return bytes;
    }
    if (r.len && /^\d+$/.test(r.len)) return Uint8Array.from({ length: +r.len }, () => Math.floor(rng() * 256));
  }
  return Uint8Array.from({ length: 2 + Math.floor(rng() * 8) }, () => Math.floor(rng() * 256));
}

function sampleGtpcSchema(schema, N, seed, msgRe) {
  const rng = rng32(seed);
  const lines = [];
  const skipped = {};
  let okMsgs = 0;
  for (const [msgName, insts] of Object.entries(schema.messages)) {
    if (msgRe && !msgRe.test(msgName)) continue;
    for (let ii = 0; ii < insts.length; ii++) {
      const inst = insts[ii];
      const instKey = `${msgName}#${ii}`;
      if (inst.msgType == null) { skipped[instKey] = skipped[instKey] || '无消息类型值'; continue; }
      let made = 0;
      for (let k = 0; k < N * 3 && made < N; k++) {
        try {
          const parts = [];
          let ok = true;
          for (let ri = 0; ri < inst.rows.length; ri++) {
            const r = inst.rows[ri];
            if (r.iei == null) {
              if (/^M$/i.test((r.presence || '').trim())) { ok = false; break; }
              continue;
            }
            if (!/^M$/i.test((r.presence || '').trim()) && rng() > 0.4) continue;
            parts.push({ rowIdx: ri, value: gtpcSampleValue(r, schema, rng) });
          }
          if (!ok) { skipped[instKey] = skipped[instKey] || '必配行无类型值'; continue; }
          const bytes = encMsg(inst, parts, schema.spec);
          lines.push({
            msg: msgName, inst: ii, section: inst.section,
            hex: Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join(''),
          });
          made++;
        } catch (e) {
          skipped[instKey] = skipped[instKey] || e.message.slice(0, 60);
        }
      }
      if (made > 0) okMsgs++;
    }
  }
  return { lines, skipped, okMsgs };
}

function refreshMessages() {
  messages = BUILTIN_LIST.map(b => ({ ...b }));
  for (const mod of registry.modules.values()) {
    if (mod.provenance === 'builtin') continue;
    for (const [name, type] of mod.types) {
      if (type.params || type.kind === 'ffs' || type.kind === 'class' || type.kind === 'open') continue; // 模板/占位/类/开放类型本体不可编码
      messages.push({
        // defaults 惰性采样：整版本载入后类型数以千计，逐个预采样会卡 UI
        id: mod.name + '.' + name, label: `${name} · ${mod.name}`,
        provenance: mod.provenance, note: '', spec: '', module: mod, type, defaults: undefined,
      });
    }
  }
  messages.sort((a, b) => (a.provenance === 'builtin' ? -1 : 1) - (b.provenance === 'builtin' ? -1 : 1) || a.label.localeCompare(b.label));
}
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const $ = (id) => document.getElementById(id);

function fmtVal(v) {
  if (v === null) return 'NULL';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') return v;
  if (v && v.bits) return '0b' + v.bits.join('');
  if (v && v.alt) return v.alt;
  return JSON.stringify(v);
}
function bitstrToHex(bits) {
  const p = bits.slice(); while (p.length % 4) p.push(0);
  let s = ''; for (let i = 0; i < p.length; i += 4) s += parseInt(p.slice(i, i + 4).join(''), 2).toString(16).toUpperCase();
  return s;
}

  return bits.slice(0, n);
}

function lcsDiff(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: 'eq', li: i, ri: j }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', li: i }); i++; }
    else { ops.push({ t: 'add', ri: j }); j++; }
  }
  while (i < n) ops.push({ t: 'del', li: i++ });
  while (j < m) ops.push({ t: 'add', ri: j++ });
  return ops;
}

}

function valueHost(node, holder, key, ctx) {

  if (!resolved) resolved = { kind: 'null' };
  const rt = (t) => t && t.kind === 'ref' ? (ctx.get(t.name) || { kind: 'null' }) : (t || { kind: 'null' });
  if (resolved.kind === 'seq') {
    box.appendChild(buildCtrl(resolved, holder[key], '', ctx));
  } else if (resolved.kind === 'choice') {
    if (!holder[key] || !holder[key].alt)
      holder[key] = { alt: resolved.alts[0].name, val: sampleValue(rt(resolved.alts[0].type), mulberry32(3), ctx) };
    const val = holder[key];
    const sel = document.createElement('select');
    const allAlts = [...resolved.alts, ...(resolved.additions || [])];
    sel.innerHTML = allAlts.map(a => `<option${a.name === val.alt ? ' selected' : ''}>${esc(a.name)}</option>`).join('');
    sel.addEventListener('change', () => {
      const alt = allAlts.find(a => a.name === sel.value);
      val.alt = alt.name; val.val = sampleValue(rt(alt.type), mulberry32(3), ctx);
      renderEncodeOut(); renderForm();
    });
    box.appendChild(sel);
    const alt = allAlts.find(a => a.name === val.alt);
    if (alt) { const inner = document.createElement('div'); inner.className = 'nest'; inner.appendChild(valueHost(rt(alt.type), val, 'val', ctx)); box.appendChild(inner); }
  } else {
    box.appendChild(leafCtrl(resolved, holder, ctx, key));
  }

}

/* ============ 版本对全量对比（M1 发布件核心功能） ============ */
function vdParse(slot) {
  const label = $('vdLabel' + slot).value.trim() || (slot === 'L' ? '旧版本' : '新版本');
  const text = $('vdText' + slot).value;
  if (!text.trim()) { throw new Error(slot + '：请先粘贴或上传 .asn 文本'); }

    stats: { modules: parsed.modules.length, types: types.size, values: values.size, warns: parsed.warnings.length } };
}

        versionStore[slot] = v;
        $('vdStat' + slot).textContent = `✓ ${v.label}：${v.stats.modules} 模块 / ${v.stats.types} 类型 / ${v.stats.values} 常量` + (v.stats.warns ? ` / ${v.stats.warns} 草稿警告` : '');
      } catch (e) { errEl.textContent = e.message; errEl.classList.add('show'); }
    };
    $('vdFile' + slot).onchange = (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        $('vdText' + slot).value = rd.result;
        if (!$('vdLabel' + slot).value.trim()) $('vdLabel' + slot).value = f.name.replace(/\.asn$/i, '');
        $('vdLoad' + slot).click();
      };
      rd.readAsText(f);
    };

    $('vdFiles' + slot).onchange = async (ev) => {
      const files = [...ev.target.files]; if (!files.length) return;
      const lib = V._files[slot] = V._files[slot] || [];
      for (const f of files) {
        const text = await f.text();
        const name = f.name.replace(/\.asn$/i, '');
        if (!lib.some(x => x.name === name)) lib.push({ name, text });
      }
      lib.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      const pick = $('vdPick' + slot);
      pick.style.display = '';
      pick.innerHTML = '<option value="">— 版本库（' + lib.length + '）—</option>' + lib.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
      pick.onchange = () => {
        const it = lib.find(x => x.name === pick.value); if (!it) return;

      if (!rn) { rows.push({ name, cls: 'removed', verdict: '删除', note: '旧版本存在，新版本已删除' }); continue; }
      if (!ln) { rows.push({ name, cls: 'added', verdict: '新增', note: '新版本新增类型' }); continue; }
      if (ln.params || rn.params) { rows.push({ name, cls: 'info', verdict: '模板', note: '参数化模板（结构对比见单类型模式）' }); continue; }
      const d = diffIR(ln, rn);
      finalizeReport(d);
      const first = d.findings.find(f => f.sev === 'warn') || d.findings[0];
      rows.push({
        name, cls: d.report.warn > 0 ? 'break' : (d.findings.length ? 'compatible' : 'same'),
        verdict: d.report.warn > 0 ? '⚠️ 破坏' : (d.findings.length ? '✅ 兼容变化' : '无变化'),
        note: first ? first.title : '', nwarn: d.report.warn, ninfo: d.findings.length, out: d,
      });
    }
    rows.sort((a, b) => ({ break: 0, removed: 1, compatible: 2, added: 3, info: 4, same: 5 }[a.cls] - { break: 0, removed: 1, compatible: 2, added: 3, info: 4, same: 5 }[b.cls]) || a.name.localeCompare(b.name));
    versionStore._rows = rows;
    const cnt = { break: 0, removed: 0, compatible: 0, added: 0, info: 0, same: 0 };
    rows.forEach(r => cnt[r.cls]++);
    $('vdSummary').textContent = `${L.label} → ${R.label}：共 ${rows.length} 类型 ｜ ⚠️ 破坏 ${cnt.break} ｜ 删除 ${cnt.removed} ｜ 兼容变化 ${cnt.compatible} ｜ 新增 ${cnt.added} ｜ 无变化 ${cnt.same}`;
    vdRenderRows();
  } catch (e) { errEl.textContent = e.message; errEl.classList.add('show'); }
}

// 报告导出：Markdown（含破坏性 findings 全文）/ CSV（全类型清单）
function vdExport(kind) {
  if (!versionStore._rows || !versionStore.L || !versionStore.R) { $('vdErr').textContent = '请先运行全量对比'; $('vdErr').classList.add('show'); return; }
  const L = versionStore.L.label, R = versionStore.R.label;
  const rows = versionStore._rows;
  const cnt = { break: 0, removed: 0, compatible: 0, added: 0, info: 0, same: 0 };
  rows.forEach(r => cnt[r.cls]++);
  const stamp = new Date().toISOString().slice(0, 10);
  let content, filename, mime;
  if (kind === 'md') {
    const changed = rows.filter(r => r.cls !== 'same');
    const lines = [];
    lines.push(`# RRC Workbench 版本对比报告：${L} → ${R}`);
    lines.push('');
    lines.push(`- 生成日期：${stamp} ｜ 工具：RRC Workbench v1.4（UPER/APER 引擎与 pycrate 0.8.1 全类型字节级 0 差异）`);
    lines.push(`- 范围：全部 ${rows.length} 个公共/独有类型`);
    lines.push(`- 结论：**${cnt.break > 0 ? '存在 ' + cnt.break + ' 个破坏性变更——新旧版本编码不兼容，升级需双栈或协商机制' : '无破坏性变更——旧版本消息可被新版本安全解码'}**`);
    lines.push(`- 计数：⚠️ 破坏 ${cnt.break} ｜ 删除 ${cnt.removed} ｜ 兼容变化 ${cnt.compatible} ｜ 新增 ${cnt.added} ｜ 模板对比 ${cnt.info} ｜ 无变化 ${cnt.same}`);
    lines.push('');
    lines.push('## 变更清单');
    lines.push('');
    lines.push('| 类型 | 判定 | 要点 |');
    lines.push('|---|---|---|');
    for (const r of changed) lines.push(`| \`${r.name}\` | ${r.verdict.replace('⚠️ ', '**⚠️ 破坏**').replace('✅ ', '✅ 兼容')} | ${(r.note || '—').replace(/\|/g, '/')} |`);
    if (cnt.break > 0) {
      lines.push('');
      lines.push('## 破坏性变更详情');
      for (const r of rows.filter(x => x.cls === 'break' && x.out)) {
        lines.push('');
        lines.push(`### ${r.name}`);
        for (const f of r.out.findings) {
          if (f.sev !== 'warn') continue;
          const lref = (f.lines?.left || []).join(',') || '—';
          const rref = (f.lines?.right || []).join(',') || '—';
          lines.push(`- ⚠️ **${f.title}**（${L} 行 ${lref} → ${R} 行 ${rref}）`);
          lines.push(`  - ${f.detail}`);
        }
      }
    }
    lines.push('');
    lines.push('---');
    lines.push('*判定规则 D1–D13 与编码口径见 RRC Workbench 使用手册 §5.2/§9。*');
    content = lines.join('\n');
    filename = `rrc-diff-${L}-to-${R}.md`.replace(/[^\w.-]/g, '_');
    mime = 'text/markdown';
  } else {
    const esc2 = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
    const ehead = ['type', 'verdict', 'class', 'note', 'left_lines', 'right_lines'];
    const out = [ehead.join(',')];
    for (const r of rows) {
      const f = r.out && r.out.findings ? (r.out.findings.find(x => x.sev === 'warn') || r.out.findings[0]) : null;
      out.push([r.name, r.verdict, r.cls, r.note || '', (f && f.lines && f.lines.left || []).join(' '), (f && f.lines && f.lines.right || []).join(' ')].map(esc2).join(','));
    }
    content = '\ufeff' + out.join('\r\n'); // BOM：Excel 直接打开中文不乱码
    filename = `rrc-diff-${L}-to-${R}.csv`.replace(/[^\w.-]/g, '_');
    mime = 'text/csv';
  }
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function vdSnippet(slot, ln) {
  const v = versionStore[slot];
  if (!v || !ln || ln < 1 || ln > v.lines.length) return '';
  const from = Math.max(1, ln - 2), to = Math.min(v.lines.length, ln + 2);

  for (let i = from; i <= to; i++) {

    out += `<div style="${mark};white-space:pre;font:400 10.5px/1.5 var(--mono);color:var(--t3);padding:0 6px">${esc(v.lines[i - 1] || '')}</div>`;
  }
  return `<div style="border:1px solid var(--bd-faint);border-radius:3px;margin-top:4px;overflow-x:auto">${out}</div>`;
}
