            // HDR 729 起单一根因，tmp/_bi_probe11.mjs 帧 2249 定案）。
            // BI 批（v1.65.0）：dtap 族事务标识半组（CC/SM/SS 首八位组 bit8=TI flag、bit7-5=TI）
            // ——TI 半组 ∈ 8-f 置位 TI flag、TIO=7 保留值 ⇒ tshark 吃 tie 扩展全帧错位

            //——tmp/_bk80_ti.mjs 16 半组 × 3 消息穷举；24011 CP 头 flag 置位合法但保守域同收）。

            // 零平铺政策进 consult 链架构：**默认零平铺**（BI 绿线基线保持——DTAP 深语义
            // 解剖面对随机字节大面积病〔BI 普查 94%〕，全域随机步幅过大；零平铺是 GTP 族
            // BC 期全域政策的对应物）；DOMAIN 行名键命中 → dtapFixed 派生形（q.len 探针

            //（len 不变、content=random 升级）。后续批次逐行开域（每行 wide 证据为准）。
            if (dtapSpec && value != null) {
              const dq = rowDomainHit(spec, name);
              if (dq) value = domainDerive(dq.domain, value, dq);
              else {
                const cq = rowCanonicalizeHit(spec, name);
                if (cq) {

                    ? parseInt(cq.pattern, 16)
                    : Uint8Array.from({ length: value.length }, () => parseInt(cq.pattern, 16));

                  // 2024：ASSIGNMENT COMMAND Extraneous dissector bug 面等）；病行语义形/
                  // 停采经登记表逐行开域（与 BI 弧线同构）。BL（v1.68.0）记档：此默认零平铺
                  // 是 44018 族级政策（未登记行一律零值），24011/24080 为默认保留随机值。
                  value = typeof value === 'number' ? 0 : new Uint8Array(value.length);
                }
                // 24011/24080（BK）默认保留采样随机值——两族探针实证 CLEAN 面大
                //（24011 CP 面/24080 非 Facility 行），病行 wide 归因进登记表
                //（与 GTP 弧线收敛路径同构）。
              }
            }
            parts.push({ rowIdx: ri, value });
          }
          if (!ok) { skipped[instKey] = skipped[instKey] || '可变V'; continue; }
          const bytes = encMsg(inst, parts, spec);
          lines.push({
            msg: msgName, inst: ii, section: inst.section,
            hex: Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join(''),
          });
          made++;
        } catch (e) {
          skipped[instKey] = skipped[instKey] || e.message.slice(0, 60);
        }
      }
      if (made > 0) okMsgs++;
    }
  }
  return { lines, skipped, okMsgs };
}


// ---- GTPv2-C（29.274）采样：头 T=1/TEID=0/Seq=0（encGtpcMsg 缺省零值，回环确定性）；
// 行序 TLIV；分组 IE（Bearer Context/PDN Connection）按子行表递归构值（M 必采、C/CO/O p=0.4）；
// 值来源优先级：分组递归 > IE 位布局（layoutSample）> 定长随机 > 2-9 字节随机。

// BE 批（v1.61.0）C-②：值域生成器（nas_quirks.mjs VALUE_DOMAIN_ROWS）——自原采样值
// **确定性派生**合法值域字节，不消耗额外 rng（下游采样流与派生前同序）。形态由隔离
// 探针矩阵定案（tmp/_be_c2_probe.mjs + _be_c2_probe2.mjs，最小帧 × 值矩阵直喂 tshark）：
//   tbcdDigits    电话号码族：首字节是**计数域**（数字 nibble 直接放首字节必炸——计数
//                 大于尾容量触发深挖异常；首00+尾0..7 全 CLEAN），故首字节定 00，尾随
//                 字节半八位组收敛数字 0-9（BC 期「全零平铺 CLEAN」的多样化推广——
//                 多样性保留在尾部）；
//   addrLenPrefix 地址族：[首][次][尾] 三段——首字节=尾随字节数（自洽）、**次字节定形
//                 03**（探针定案：次字节 04 触发子类型深挖——probe1 三 MAL 形
//                 02048e/0004020304/ff048e 次字节全 04；次字节 01/02/03 矩阵全 CLEAN），
//                 其余尾字节保留原采样随机性。
function domainDerive(domain, v, q = null) {
  if (domain === 'tbcdDigits') {
    const out = Uint8Array.from(v);
    if (out.length) out[0] = 0x00; // 首字节=计数域，0 = 不声明数字（尾随被容忍）
    for (let i = 1; i < out.length; i++) out[i] = (out[i] & 0x0f) % 10 | (((out[i] >> 4) % 10) << 4);
    return out;
  }
  if (domain === 'addrLenPrefix') {
    if (v.length < 2) return v;
    const out = Uint8Array.from(v);
    out[0] = (v.length - 1) & 0xff; // 长度前缀自洽
    out[1] = 0x03;                  // 次字节定形（04 触发深挖）
    return out;
  }
  // BG 批（v1.63.0）两域（探针 tmp/_bg_probe2/3.mjs 定案）：
  //   pfcList6   IE 179 List of set-up PFCs 长度档病（CLEAN 档 {1,6,11-20}，tshark 按
  //              1+5n 条目解析）——定长 6B = [条目数 1][原值前 5B 不足补 00]，尾保留多样性；
  //              长度可能改变 ⇒ 下游 rng 流重排（漂移有因，wide 重验为权威）；
  //   secondZero IE 186 长度档病（≥2B 任意 CLEAN、1B MAL、[ff ff] 特例）——1B 补 [v0,00]、
  //              ≥2B 次字节定 00（深挖敏感位），其余字节保留原值。
  if (domain === 'pfcList6') {
    const out = new Uint8Array(6);
    out[0] = 0x01;
    for (let i = 1; i < 6; i++) out[i] = i - 1 < v.length ? v[i - 1] : 0x00;
    return out;
  }
  if (domain === 'secondZero') {
    if (v.length === 1) return Uint8Array.from([v[0], 0x00]);
    if (v.length >= 2) {
      const out = Uint8Array.from(v);
      out[1] = 0x00;
      return out;
    }
    return v;
  }
  // BJ 批（v1.66.0）：24008 dtapFixed 域形（BI semanticDtapValue 迁 nas_quirks 行名键
  // 条目）——q.len = 探针 CLEAN 档定形值长（tmp/_bi_probe15.mjs 行×值长矩阵）；
  // content='random' 原值循环填充（零额外 rng，值多样性保留在内容字节——BI 全零形的
  // 多样化推广）；content='zero' 全零定形（内容敏感行降级档）。
  if (domain === 'dtapFixed') {
    const n = q && q.len ? q.len : v.length;
    const out = new Uint8Array(n);
    if (q && q.content !== 'zero' && v.length) {
      for (let i = 0; i < n; i++) out[i] = v[i % v.length];
    }
    return out;
  }
  // BM 批（v1.69.0）：24008 内容深挖行细域形（zero 降级行的逐行开域）——
  //   dtapBcd   e212/BCD 数字域（RAI2/LAI2/PLMN/LSA/TZT）：dtapFixed 同款定形（q.len
  //             原值循环填充）后每半八位组收敛数字 0-9——tshark e212/BCD 解码对数字
  //             半组合法（BM 隔离探针全宿主 10/10 CLEAN，tmp/_bm_probe/_bm_probe2.mjs）；
  //   codecSid  Supported Codec List：多宿主分裂定案（sid+rawTail 在 CALL CONFIRMED/
  //             CC-ESTABLISHMENT CONFIRMED MAL、其余宿主 CLEAN）——唯全域 CLEAN 形 =
  //             首字节 system identification ∈ 0-15（保原值低半组多样性）+ 零尾。
  if (domain === 'dtapBcd') {
    const n = q && q.len ? q.len : v.length;
    const out = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const x = v.length ? v[i % v.length] : 0;
      out[i] = ((x >> 4) % 10) << 4 | ((x & 0x0f) % 10);
    }
    return out;
  }
  if (domain === 'codecSid') {
    const n = q && q.len ? q.len : (v.length || 4);
    const out = new Uint8Array(n);
    if (v.length) out[0] = v[0] & 0x0f;
    return out;
  }
  // BK 批（v1.67.0）：24080 SS reject 形——A4 03 80 01 <p>（BN 起并入 dtapSsComponent 四态）。
  // BN 批（v1.70.0）：24080 BER 组件四态（nas_quirks DTAP-SS-*-REJECT-FORM 换域）——BK「A1/
  // A2/A3 形全 MAL」被模板细扫推翻（是模板结构要求而非全域病）：invoke 最小模板
  // [A1][06][02 01 id][02 01 op]、returnResult 无 op 形 [A2][03][02 01 id]、returnError 形
  // [A3][06][02 01 id][02 01 err] 双宿主（REGISTER/RELEASE COMPLETE）各 8/8 CLEAN
  //（tmp/_bn_probe/_bn_probe2.mjs）；组件形态由原值首字节 %4 确定性轮转（reject/invoke/
  // returnResult/returnError），id 与 op/err 字节保原值多样性——值域多样性较 reject 单形
  // 大幅恢复。长度随形态 4-8B 变化 ⇒ 帧长由 wide 重验为权威。
  if (domain === 'dtapSsComponent') {
    const pick = v.length ? v[0] % 4 : 0;
    const b1 = v.length > 1 ? v[1] : 0; // invokeID
    const b2 = v.length > 2 ? v[2] : 0; // op / error code
    if (pick === 1) return Uint8Array.from([0xa1, 0x06, 0x02, 0x01, b1, 0x02, 0x01, b2]); // invoke
    if (pick === 2) return Uint8Array.from([0xa2, 0x03, 0x02, 0x01, b1]);                 // returnResult（无 op 形）
    if (pick === 3) return Uint8Array.from([0xa3, 0x06, 0x02, 0x01, b1, 0x02, 0x01, b2]); // returnError
    return Uint8Array.from([0xa4, 0x03, 0x80, 0x01, b1]);                                 // reject（BK 形）
  }
  // BK 批（v1.67.0）：24011 RPDU 首字节安全域（nas_quirks DTAP-SMS-RP-FIRST-BYTE-SAFE）——
  // RP 消息类型识别值 {0,1,4,5}（RP-DATA/RP-ERROR）触发 tshark RP IE/TPDU 深挖 Exception；
  // 首字节 <7 时 |0x08（落 8-0xe 浅解析域），0x07-0xff 原样——低位多样性保留、其余字节不动。
  if (domain === 'dtapSmsRpFirst') {
    if (!v.length || v[0] >= 0x07) return v;
    const out = Uint8Array.from(v);
    out[0] = v[0] | 0x08;
    return out;
  }
  // BO 批（v1.71.0）：24008 容器行开域（BM 负结果两处勘正在案——hdr01/hdr00 系 [code][rand]
  // 无载荷体自相矛盾形、E-UTRAN「嵌入 NAS」方向误判；探针 tmp/_bo_probe1-4.mjs）：
  //   nbifomElem  NBIFOM container（10.5.6.21 值 = 24.161 NBIFOM 参数列表，tshark
  //               nbifom.param_id/param_contents.len 字段实证 [param_id][len][contents]
  //               重复列）——单元素正形 [c][n][n B 内容]：n 2-5（深挖码 {1,2,3,7,8} 拒空
  //               载荷），内容 v 循环保留多样性（rand/zero 双档 CLEAN）；毒码 {4,5}
  //               zero/任意内容全 MAL（八形抢救负结果）映射出域（4→6、5→7）；
  //   eutranCap   E-UTRAN inter RAT information container（10.5.5.27 值 = 36.331
  //               UE-EUTRA-Capability APER——tshark 走 lte-rrc 解剖器，非 NAS 面）——
  //               零模板 + 安全位掩码（单位矩阵 SAFE 25/56、首字节全扫 SAFE 0-31；
  //               组合形 run50 双宿主双上下文全 CLEAN）：b0&1f b1&1f b2&fc b3&0f
  //               b4&e0 b5=0（全 UNSAFE）b6&80，24 位多样性。
  //   撤回记档（同批）：同宿主 UTRAN 容器（inter rat information container，10.5.5.24，
  //   rrc 解剖器）首字节单域形探针 100/100 CLEAN 后 wide 撤回——tshark 对 START-CS
  //   位域做重组呈现（rrc.start_CS 重组值 ≠ 帧切片，零值恒等、非零即差），四 seed
  //   26 不符全归因此（tmp/_bo_probe4.mjs + sweep 实证）；位域呈现性质非值域可修，
  //   回默认零平铺。教训：值域探针判定面须含 oracle compare（单查 malformed 对
  //   位域/重组呈现字段失明——BG 178/142「矩阵 CLEAN 不足以退役」的呈现面升维）。
  if (domain === 'nbifomElem') {
    let c = v.length ? v[0] : 0;
    if (c === 4) c = 6; else if (c === 5) c = 7;
    const n = 2 + (v.length > 1 ? v[1] % 4 : 0);
    const out = new Uint8Array(2 + n);
    out[0] = c;
    out[1] = n;
    for (let i = 0; i < n; i++) out[2 + i] = v.length ? v[(i + 2) % v.length] : 0;
    return out;
  }
  if (domain === 'eutranCap') {
    const g = (i) => (i < v.length ? v[i] : 0);
    return Uint8Array.from([g(0) & 0x1f, g(1) & 0x1f, g(2) & 0xfc, g(3) & 0x0f, g(4) & 0xe0, 0x00, g(6) & 0x80]);
  }
  return v;
}

function applyDomainHit(spec, iei, value) {
  const q = domainValueHit(spec, iei);
  if (!q) return value;
  return domainDerive(q.domain, value, q);
}

function gtpcSampleValue(r, schema, rng, depth = 0) {
  const ref = r.def || (r.ref && schema.ies[r.ref] ? r.ref : null);
  if (ref && depth < 4) {
    const ie = schema.ies[ref];
    // 分组 IE 优先按子行表递归构值——语义值规则只作用于非分组 IE
    // （例：29274 8.126 分组名与 29.060 的 SCEF PDN Connection IE 同名）。
    if (ie.grouped) {
      const body = [];
      for (const cr of ie.grouped) {
        if (cr.iei == null) {
          // 批次 W：分组内必配行若无类型值，该组不可完整构造——抛错交由采样重试，
          // 否则会产出缺必配子行的帧（解码端「必配行缺失」，此前潜伏未命中）。
          if (/^M$/i.test((cr.presence || '').trim())) throw new Error(`分组必配行无类型值: ${cr.name}`);
          continue;
        }
        if (!/^M$/i.test((cr.presence || '').trim()) && rng() > 0.4) continue;
        // BE 批（v1.61.0）C-①：组内行 consult 对称化（BC 审核段 P3-1 收口）——停采/
        // 重映射/规范化与顶层行同规。msgTypes 限定条目组内不生效（组上下文无宿主消息
        // 类型可门，保守只放行 null 门条目）；命中必配行 ⇒ 该组不可构造，抛错交重试
        // （与顶层「整实例退网」同语义的组内形态）。探针实证（tmp/_be_c1_probe 内联）：
        // 当前登记面唯一组内重叠 = 29244 IE 327（AZ 组内守卫先例，presence C），gtpc/
        // gtpv1 侧零重叠——本对称化对现行采样流零漂移。
        const stopQ = sampleStopHit(schema.spec, parseInt(cr.iei, 10), null);
        if (stopQ) {
          if (/^M$/i.test((cr.presence || '').trim())) throw new Error(`分组必配行停采退网: ${cr.name}`);
          continue;
        }
        let cv = gtpcSampleValue(cr, schema, rng, depth + 1);
        const remapped = valueRemapHit(schema.spec, parseInt(cr.iei, 10), cr.format, cv);
        if (remapped) cv = remapped;
        const canonQ = canonicalizeHit(schema.spec, parseInt(cr.iei, 10));
        if (canonQ) cv = Uint8Array.from({ length: cv.length }, () => parseInt(canonQ.pattern, 16));
        cv = applyDomainHit(schema.spec, parseInt(cr.iei, 10), cv);
        body.push(...gtpcTli(parseInt(cr.iei, 10), cr.ins != null ? cr.ins : 0, cv));
      }
      return Uint8Array.from(body);
    }
    // v1.43.0 AK P3-13：语义规则兜底查行名——ies 条目名与行名可不同（29274 8.113 条目名
    // 'Metric' vs 组行名 'Load Metric'，精确分支按条目名永不命中 → 布局随机 0..255 全域，
    // >100 会被独立实现方判非法；行名回退后命中 LOAD METRIC 0..100 约束。全族探针实测
    // 新增命中仅 3 处：29274 Load Metric×1 + 29060 行名 'MSISDN'×2，29244 为 0）。
    const sem = semanticGtpValue(ie.name, rng, schema.spec)
      || (r.name && r.name !== ie.name ? semanticGtpValue(r.name, rng, schema.spec) : null);
    if (sem) return sem;
    if (ie.layouts && ie.layouts[0] && ie.layouts[0].octets.length) {
      const { bytes } = layoutSample(ie.layouts[0].octets, rng, false);
      if (bytes.length) return bytes;
    }
    if (r.len && /^\d+$/.test(r.len)) return Uint8Array.from({ length: +r.len }, () => Math.floor(rng() * 256));
  }
  return Uint8Array.from({ length: 2 + Math.floor(rng() * 8) }, () => Math.floor(rng() * 256));
}

function sampleGtpcSchema(schema, N, seed, msgRe) {
  const rng = rng32(seed);
  const lines = [];
  const skipped = {};
  let okMsgs = 0;
  for (const [msgName, insts] of Object.entries(schema.messages)) {
    if (msgRe && !msgRe.test(msgName)) continue;
    for (let ii = 0; ii < insts.length; ii++) {
      const inst = insts[ii];
      const instKey = `${msgName}#${ii}`;
      if (inst.msgType == null) { skipped[instKey] = skipped[instKey] || '无消息类型值'; continue; }
      let made = 0;
      for (let k = 0; k < N * 3 && made < N; k++) {
        try {
          const parts = [];
          let ok = true;
          let stopRetired = false; // BD 批（v1.60.0）：区分「必配行无类型值」与「停采必配行退网」两成因（BC 审核段 E-2）
          for (let ri = 0; ri < inst.rows.length; ri++) {
            const r = inst.rows[ri];
            if (r.iei == null) {
              if (/^M$/i.test((r.presence || '').trim())) { ok = false; break; }
              continue;
            }
            if (!/^M$/i.test((r.presence || '').trim()) && rng() > 0.4) continue;
            // BC 批（v1.59.0）：行守卫 consult（nas_quirks.mjs SAMPLE_STOP_ROWS）——
            // 29274 t96/t89 内容无关恒炸停采；落点在 p=0.4 判定后（AW/AZ 同款），
            // 未采中登记行的帧 rng 零漂移。此前三循环仅 gtpc 顶层缺守卫（此前 29274
            // 从无停采条目）。命中必配行 ⇒ 整实例不产帧（与必配行无类型值同路径——
            // tshark 不可核验的消息族如实退网）。
            const stopQ = sampleStopHit(schema.spec, parseInt(r.iei, 10), inst.msgType);
            if (stopQ) {
              if (/^M$/i.test((r.presence || '').trim())) { ok = false; stopRetired = true; break; }
              continue;
            }
            let gtpcValue = gtpcSampleValue(r, schema, rng);
            const remapped = valueRemapHit(schema.spec, parseInt(r.iei, 10), r.format, gtpcValue);
            if (remapped) gtpcValue = remapped;
            // BC 批（v1.59.0）：值区规范化 consult（nas_quirks.mjs VALUE_CANONICALIZE_ROWS）——
            // 登记行整值平铺为 pattern（长度不变），rng 消耗不变，漂移局限采中登记行的帧。
            const canonQ = canonicalizeHit(schema.spec, parseInt(r.iei, 10));
            if (canonQ) gtpcValue = Uint8Array.from({ length: gtpcValue.length }, () => parseInt(canonQ.pattern, 16));
            gtpcValue = applyDomainHit(schema.spec, parseInt(r.iei, 10), gtpcValue);
            parts.push({ rowIdx: ri, value: gtpcValue });
          }
          if (!ok) { skipped[instKey] = skipped[instKey] || (stopRetired ? '停采必配行退网' : '必配行无类型值'); continue; }
          const bytes = encMsg(inst, parts, schema.spec);
          lines.push({
            msg: msgName, inst: ii, section: inst.section,
            hex: Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join(''),
          });
          made++;
        } catch (e) {
          skipped[instKey] = skipped[instKey] || e.message.slice(0, 60);
        }
      }
      if (made > 0) okMsgs++;
    }
  }
  return { lines, skipped, okMsgs };
}

// ---- PFCP（29.244）采样：IE 框架 Type(2)+Length(2)，分组子 IE 同；M 必采、其余 p=0.4。
function pfcpSampleValue(r, schema, rng, depth = 0) {
  const ref = r.def || (r.ref && schema.ies[r.ref] ? r.ref : null);
  if (ref && depth < 4) {
    const ie = schema.ies[ref];
    if (ie.grouped) {
      const body = [];
      for (const cr of ie.grouped) {
        if (cr.iei == null) {
          if (/^M$/i.test((cr.presence || '').trim())) throw new Error(`分组必配行无类型值: ${cr.name}`);
          continue;
        }
        if (!/^M$/i.test((cr.presence || '').trim()) && rng() > 0.4) continue;
        // AZ 批（v1.57.0）：IE 327 N6 Jitter Measurement（Rel-18 新 IE，8.2.222 def 未摄取）
        // 组内停采——探针 tmp/_v10_az1_probe：324 组内 327 与任一他子项共现 tshark 4.6.8

        // 未采中 327 的帧 rng 消耗序列零漂移（AW 行守卫同款）。
        // BA 起（v1.58.0）迁 nas_quirks.mjs SAMPLE_STOP_ROWS 登记表——匹配条件与原硬编码
        // 逐字等价（spec 29244 + iei 327 + 任意消息），落点不变，采样流零漂移。
        // BE 批（v1.61.0）C-①：并入统一组内 consult 路径（msgTypes 限定条目组内不生效
        // ——null 门保守放行；必配行命中 ⇒ 抛错退网）。327 presence=C，行为不变。
        const stopQ = sampleStopHit(schema.spec, parseInt(cr.iei, 10), null);
        if (stopQ) {
          if (/^M$/i.test((cr.presence || '').trim())) throw new Error(`分组必配行停采退网: ${cr.name}`);
          continue;
        }
        let cv = pfcpSampleValue(cr, schema, rng, depth + 1);

function samplePfcpSchema(schema, N, seed, msgRe) {
  const rng = rng32(seed);
  const lines = [];
  const skipped = {};
  let okMsgs = 0;
  for (const [msgName, insts] of Object.entries(schema.messages)) {
    if (msgRe && !msgRe.test(msgName)) continue;
    for (let ii = 0; ii < insts.length; ii++) {
      const inst = insts[ii];
      const instKey = `${msgName}#${ii}`;
      if (inst.msgType == null) { skipped[instKey] = skipped[instKey] || '无消息类型值'; continue; }
      let made = 0;
      for (let k = 0; k < N * 3 && made < N; k++) {
        try {
          const parts = [];
          let ok = true;
          for (let ri = 0; ri < inst.rows.length; ri++) {
            const r = inst.rows[ri];
            if (r.iei == null) {
              if (/^M$/i.test((r.presence || '').trim())) { ok = false; break; }

            if (!/^M$/i.test((r.presence || '').trim()) && rng() > 0.4) continue;

            const remapped = valueRemapHit(schema.spec, parseInt(r.iei, 10), r.format, pfcpValue);
            if (remapped) pfcpValue = remapped;
            const canonQ = canonicalizeHit(schema.spec, parseInt(r.iei, 10));

            parts.push({ rowIdx: ri, value: pfcpValue });
          }
          if (!ok) { skipped[instKey] = skipped[instKey] || '必配行无类型值'; continue; }

          lines.push({
            msg: msgName, inst: ii, section: inst.section,
            hex: Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join(''),

          made++;
        } catch (e) {
          skipped[instKey] = skipped[instKey] || e.message.slice(0, 60);

  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: 'eq', li: i, ri: j }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', li: i }); i++; }
    else { ops.push({ t: 'add', ri: j }); j++; }

}

  const rt = (t) => t && t.kind === 'ref' ? (ctx.get(t.name) || { kind: 'null' }) : (t || { kind: 'null' });
  if (resolved.kind === 'seq') {

      holder[key] = { alt: resolved.alts[0].name, val: sampleValue(rt(resolved.alts[0].type), mulberry32(3), ctx) };
    const val = holder[key];
    const sel = document.createElement('select');
    const allAlts = [...resolved.alts, ...(resolved.additions || [])];
    sel.innerHTML = allAlts.map(a => `<option${a.name === val.alt ? ' selected' : ''}>${esc(a.name)}</option>`).join('');
    sel.addEventListener('change', () => {
      const alt = allAlts.find(a => a.name === sel.value);
      val.alt = alt.name; val.val = sampleValue(rt(alt.type), mulberry32(3), ctx);
      renderEncodeOut(); renderForm();

function vdParse(slot) {
  const label = $('vdLabel' + slot).value.trim() || (slot === 'L' ? '旧版本' : '新版本');

  for (const m of parsed.modules) { for (const [k, v] of m.types) types.set(k, v); for (const [k, v] of m.values) values.set(k, v); }

    stats: { modules: parsed.modules.length, types: types.size, values: values.size, warns: parsed.warnings.length } };

    if (!versionStore.L) { $('vdLoadL').click(); }
    if (!versionStore.R) { $('vdLoadR').click(); }
    if (!versionStore.L || !versionStore.R) throw new Error('两个版本都载入后才能运行');
    const L = versionStore.L, R = versionStore.R;
    const rows = [];
    const all = new Set([...L.types.keys(), ...R.types.keys()]);
    for (const name of all) {
      const ln = L.types.get(name), rn = R.types.get(name);
      if (!rn) { rows.push({ name, cls: 'removed', verdict: '删除', note: '旧版本存在，新版本已删除' }); continue; }
      if (!ln) { rows.push({ name, cls: 'added', verdict: '新增', note: '新版本新增类型' }); continue; }
      if (ln.params || rn.params) { rows.push({ name, cls: 'info', verdict: '模板', note: '参数化模板（结构对比见单类型模式）' }); continue; }
      const d = diffIR(ln, rn);
      finalizeReport(d);
      const first = d.findings.find(f => f.sev === 'warn') || d.findings[0];
      rows.push({
        name, cls: d.report.warn > 0 ? 'break' : (d.findings.length ? 'compatible' : 'same'),
        verdict: d.report.warn > 0 ? '⚠️ 破坏' : (d.findings.length ? '✅ 兼容变化' : '无变化'),
        note: first ? first.title : '', nwarn: d.report.warn, ninfo: d.findings.length, out: d,
      });
    }
    rows.sort((a, b) => ({ break: 0, removed: 1, compatible: 2, added: 3, info: 4, same: 5 }[a.cls] - { break: 0, removed: 1, compatible: 2, added: 3, info: 4, same: 5 }[b.cls]) || a.name.localeCompare(b.name));
    versionStore._rows = rows;
    const cnt = { break: 0, removed: 0, compatible: 0, added: 0, info: 0, same: 0 };
    rows.forEach(r => cnt[r.cls]++);
    $('vdSummary').textContent = `${L.label} → ${R.label}：共 ${rows.length} 类型 ｜ ⚠️ 破坏 ${cnt.break} ｜ 删除 ${cnt.removed} ｜ 兼容变化 ${cnt.compatible} ｜ 新增 ${cnt.added} ｜ 无变化 ${cnt.same}`;
    vdRenderRows();
  } catch (e) { errEl.textContent = e.message; errEl.classList.add('show'); }
}
function vdRenderRows() {

  $('vdTable').querySelectorAll('tr[data-vd]').forEach(tr => tr.onclick = () => vdShowDetail(tr.dataset.vd));
}
// 报告导出：Markdown（含破坏性 findings 全文）/ CSV（全类型清单）
function vdExport(kind) {
  if (!versionStore._rows || !versionStore.L || !versionStore.R) { $('vdErr').textContent = '请先运行全量对比'; $('vdErr').classList.add('show'); return; }
  const L = versionStore.L.label, R = versionStore.R.label;
  const rows = versionStore._rows;
  const cnt = { break: 0, removed: 0, compatible: 0, added: 0, info: 0, same: 0 };
  rows.forEach(r => cnt[r.cls]++);
  const stamp = new Date().toISOString().slice(0, 10);
  let content, filename, mime;
  if (kind === 'md') {
    const changed = rows.filter(r => r.cls !== 'same');
    const lines = [];
    lines.push(`# RRC Workbench 版本对比报告：${L} → ${R}`);
    lines.push('');
    lines.push(`- 生成日期：${stamp} ｜ 工具：RRC Workbench v1.4（UPER/APER 引擎与 pycrate 0.8.1 全类型字节级 0 差异）`);
    lines.push(`- 范围：全部 ${rows.length} 个公共/独有类型`);
    lines.push(`- 结论：**${cnt.break > 0 ? '存在 ' + cnt.break + ' 个破坏性变更——新旧版本编码不兼容，升级需双栈或协商机制' : '无破坏性变更——旧版本消息可被新版本安全解码'}**`);
    lines.push(`- 计数：⚠️ 破坏 ${cnt.break} ｜ 删除 ${cnt.removed} ｜ 兼容变化 ${cnt.compatible} ｜ 新增 ${cnt.added} ｜ 模板对比 ${cnt.info} ｜ 无变化 ${cnt.same}`);
    lines.push('');
    lines.push('## 变更清单');
    lines.push('');
    lines.push('| 类型 | 判定 | 要点 |');
    lines.push('|---|---|---|');
    for (const r of changed) lines.push(`| \`${r.name}\` | ${r.verdict.replace('⚠️ ', '**⚠️ 破坏**').replace('✅ ', '✅ 兼容')} | ${(r.note || '—').replace(/\|/g, '/')} |`);
    if (cnt.break > 0) {
      lines.push('');
      lines.push('## 破坏性变更详情');
      for (const r of rows.filter(x => x.cls === 'break' && x.out)) {
        lines.push('');
        lines.push(`### ${r.name}`);
        for (const f of r.out.findings) {
          if (f.sev !== 'warn') continue;
          const lref = (f.lines?.left || []).join(',') || '—';
          const rref = (f.lines?.right || []).join(',') || '—';
          lines.push(`- ⚠️ **${f.title}**（${L} 行 ${lref} → ${R} 行 ${rref}）`);
          lines.push(`  - ${f.detail}`);
        }
      }
    }
    lines.push('');
    lines.push('---');
    lines.push('*判定规则 D1–D13 与编码口径见 RRC Workbench 使用手册 §5.2/§9。*');
    content = lines.join('\n');
    filename = `rrc-diff-${L}-to-${R}.md`.replace(/[^\w.-]/g, '_');
    mime = 'text/markdown';
  } else {
    const esc2 = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
    const ehead = ['type', 'verdict', 'class', 'note', 'left_lines', 'right_lines'];
    const out = [ehead.join(',')];
    for (const r of rows) {
      const f = r.out && r.out.findings ? (r.out.findings.find(x => x.sev === 'warn') || r.out.findings[0]) : null;
      out.push([r.name, r.verdict, r.cls, r.note || '', (f && f.lines && f.lines.left || []).join(' '), (f && f.lines && f.lines.right || []).join(' ')].map(esc2).join(','));
    }
    content = '\ufeff' + out.join('\r\n'); // BOM：Excel 直接打开中文不乱码
    filename = `rrc-diff-${L}-to-${R}.csv`.replace(/[^\w.-]/g, '_');
    mime = 'text/csv';
  }
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
// 行号 → 源码片段（±2 行，引用行高亮）。ln 为 1-based。
function vdSnippet(slot, ln) {
  const v = versionStore[slot];
  if (!v || !ln || ln < 1 || ln > v.lines.length) return '';
  const from = Math.max(1, ln - 2), to = Math.min(v.lines.length, ln + 2);
  let out = '';
  for (let i = from; i <= to; i++) {
    const mark = i === ln ? 'background:#fff3cd' : '';
    out += `<div style="${mark};white-space:pre;font:400 10.5px/1.5 var(--mono);color:var(--t3);padding:0 6px">${esc(v.lines[i - 1] || '')}</div>`;
  }

}
// CC（v1.85.0）：csn1 items 差异树呈现（有界截断，默认折叠）——仅呈现层

function runDiffCore(leftText, rightText, leftType, rightType) {
  const errEl = $('diffErr'); errEl.classList.remove('show');
  const L = parseToModule(leftText, { provenance: 'user-imported' }, registry.modules);
  const R = parseToModule(rightText, { provenance: 'user-imported' }, registry.modules);
  const errs = [];
  if (L.errors.length) errs.push('左模块：\n' + L.errors.join('\n'));
  if (R.errors.length) errs.push('右模块：\n' + R.errors.join('\n'));
  if (errs.length) { errEl.textContent = errs.join('\n\n'); errEl.classList.add('show'); return; }
  // 确定对比类型
  if (!leftType) {
    const common = [...L.module.types.keys()].find(t => R.module.types.has(t));
    if (!common) { errEl.textContent = '两模块无共有类型，请在"对比类型"中分别指定（旧名/新名用 | 分隔，如 Old|New）'; errEl.classList.add('show'); return; }
    leftType = rightType = common;
  }
  [leftType, rightType] = (leftType + '|' + rightType).split('|');
  if (leftType.includes('|')) [leftType, rightType] = leftType.split('|');
  const ln = L.module.types.get(leftType), rn = R.module.types.get(rightType);
  if (!ln || !rn) { errEl.textContent = `类型未找到：${!ln ? leftType : rightType}`; errEl.classList.add('show'); return; }
  $('leftRel').textContent = `${L.module.name} · ${leftType}`;
  $('rightRel').textContent = `${R.module.name} · ${rightType}`;
  // 文本行 diff
  const la = leftText.split('\n'), ra = rightText.split('\n');
  $('leftN').textContent = la.length + ' 行'; $('rightN').textContent = ra.length + ' 行';
  const ops = lcsDiff(la, ra);
  const mk = (pane, side, src) => {
    pane.innerHTML = '';
    ops.forEach(op => {
      if (op.t === 'eq' || op.t === side) {
        const idx = side === 'del' ? op.li : op.ri;
        const d = document.createElement('div'); d.className = 'dline ' + op.t; d.dataset.li = idx;
        d.innerHTML = `<span class="ln">${idx + 1}</span><span class="tx">${esc(src[idx])}</span>`;
        pane.appendChild(d);
      } else {
        const g = document.createElement('div'); g.className = 'dline gap';
        g.innerHTML = '<span class="ln"></span><span class="tx"> </span>';
        pane.appendChild(g);
      }
    });
  };
  mk($('leftPane'), 'del', la); mk($('rightPane'), 'add', ra);
  // 语义发现
  const out = diffIR(ln, rn);
  const fl = $('findings'); fl.innerHTML = '';
  if (!out.findings.length) fl.innerHTML = '<div class="empty">两版本结构完全一致</div>';
  for (const f of out.findings) {
    const d = document.createElement('div'); d.className = 'finding ' + f.sev;
    d.innerHTML = `<span class="dot ${f.sev}"></span><div><h4><code>${esc(f.title)}</code></h4><p>${esc(f.detail)}</p>
      <p style="color:var(--t4);font-size:11px">${f.lines && f.lines.left && f.lines.left.length ? '旧行 ' + f.lines.left.join(',') : ''}${f.lines && f.lines.right && f.lines.right.length ? ' · 新行 ' + f.lines.right.join(',') : ''}</p></div>`;
    const lines = [...(f.lines?.left || []), ...(f.lines?.right || [])].filter(x => x);
    if (lines.length) d.addEventListener('click', () => {
      document.querySelectorAll('.dline').forEach(x => x.classList.remove('hl-ln'));
      lines.forEach(li => document.querySelectorAll(`.dline[data-li="${li}"]`).forEach(x => { x.classList.add('hl-ln'); x.scrollIntoView({ block: 'nearest' }); }));
    });
    fl.appendChild(d);
  }
  const rep = out.report;
  $('report').innerHTML = `
    <div class="stat"><b style="color:var(--ok)">${rep.ok}</b><span>兼容变更</span></div>
    <div class="stat"><b style="color:${rep.warn ? 'var(--warn)' : 'var(--t1)'}">${rep.warn}</b><span>破坏性变更</span></div>
    <div class="stat"><b style="color:var(--t3)">${rep.info}</b><span>信息级</span></div>
    <div class="verdict">${esc(rep.verdict)}</div>`;
}

function renderCmp() {
  const err = $('cmpErr'); err.classList.remove('show');
  $('hexA').classList.remove('bad'); $('hexB').classList.remove('bad');
  const va = $('hexA').value.trim(), vb = $('hexB').value.trim();
  const bad = (v) => !/^[0-9a-fA-F]*$/.test(v) || v.length % 2;
  if (bad(va) || bad(vb)) {
    err.textContent = bad(va) ? '帧 A：hex 无效（偶数个 0-9/a-f）' : '帧 B：hex 无效（偶数个 0-9/a-f）';
    err.classList.add('show');
    (bad(va) ? $('hexA') : $('hexB')).classList.add('bad');
    return;
  }
  let A, B;
  try { A = decTreeFor(cmpMsg)(cmpMsg.type, va, ctxFor(cmpMsg)); } catch (e) { err.textContent = '帧 A：' + e.message; err.classList.add('show'); $('hexA').classList.add('bad'); return; }
  try { B = decTreeFor(cmpMsg)(cmpMsg.type, vb, ctxFor(cmpMsg)); } catch (e) { err.textContent = '帧 B：' + e.message; err.classList.add('show'); $('hexB').classList.add('bad'); return; }
  $('cmpNote').textContent = `${A.usedBits} bit 内容 / ${va.length / 2} 字节`;
  // 差异集：按 label+路径
  const differs = new Set();
  (function cmpWalk(an, bn) {
    if (!an || !bn) return;
    if (JSON.stringify(an.value) !== JSON.stringify(bn.value)) differs.add(an.label);
    const bc = bn.children || [], ac = an.children || [];
    for (let i = 0; i < Math.max(ac.length, bc.length); i++) cmpWalk(ac[i], bc[i]);
  })(A.tree[0], B.tree[0]);
  renderTreeCmp('treeA', A.tree, differs);
  renderTreeCmp('treeB', B.tree, differs);
  const dl = $('cmpDiff');
  if (!differs.size) { dl.innerHTML = '<div class="empty">两帧完全一致</div>'; return; }
  dl.innerHTML = '';
  const flatA = [], flatB = [];
  (function fw(n, out) { for (const x of n) { if (x.children && x.children.length) fw(x.children, out); else out.push(x); } })(A.tree, flatA);
  (function fw(n, out) { for (const x of n) { if (x.children && x.children.length) fw(x.children, out); else out.push(x); } })(B.tree, flatB);
  const rows = [];
  flatA.forEach((a, i) => {
    const b = flatB[i];
    if (b && JSON.stringify(a.value) !== JSON.stringify(b.value)) rows.push([a, b]);
  });
  for (const [a, b] of rows) {
    const d = document.createElement('div'); d.className = 'finding warn';
    d.innerHTML = `<span class="dot warn"></span><div><h4>${esc(a.label)}</h4><p>A = <b style="font-family:var(--mono)">${esc(fmtVal(a.value)).slice(0, 32)}</b> · B = <b style="font-family:var(--mono)">${esc(fmtVal(b.value)).slice(0, 32)}</b> <span style="color:var(--t4)">（bit [${a.start}..${a.start + a.len - 1}]，${a.len} bit）</span></p></div>`;
    dl.appendChild(d);
  }
}
function renderTreeCmp(el, nodes, differs) {
  const host = $(el); host.innerHTML = '';
  (function rec(nodes, parent) {
    for (const n of nodes) {
      const d = document.createElement('div');
      d.className = 'tnode' + ((n.children && n.children.length) ? ' seq' : '') + (differs.has(n.label) ? ' differ' : '');
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span class="k">${esc(n.label)}</span> <span class="v">${esc(fmtVal(n.value)).slice(0, 40)}</span><span class="ty">${esc(n.type || '')}</span><span class="rng">bit [${n.start}..${n.start + n.len - 1}]</span>`;
      d.appendChild(row);
      if (n.children && n.children.length) { const k = document.createElement('div'); k.className = 'tkids'; rec(n.children, k); d.appendChild(k); }
      parent.appendChild(d);
    }
  })(nodes, host);

// 导出 JSON 与 nasdef 产物逐字节一致）；ASN.1 走 extractFromDocumentXml（ASN1START 块拼接）。
const ingestState = { results: [], seq: 0 };
const NAS_SPECS = ['24501', '24301', '24008', '44018', '24080', '24011', '23040', '29274', '29060', '29244', '29281']; // CB（v1.84.0）补 29281（GTPv1-U 消息面 UI 接入；encGtpv1Msg 头参数全默认值可独立编码）

function ingestAutoName(fname) {
  const m = /^(?:[3GPP ]*)?(\d{5})-([0-9a-z]+)\.(?:zip|docx)$/i.exec(fname.trim());
  return m ? { spec: m[1], ver: m[2] } : null;
}

async function ingestHandleFiles(files, kind) {
  for (const f of files) {
    const auto = kind === 'nas' ? ingestAutoName(f.name) : { label: f.name.replace(/\.(zip|docx)$/i, '') };
    const r = {
      id: ++ingestState.seq,
      file: f.name,
      fileObj: f,
      kind,
      spec: auto && auto.spec ? auto.spec : '',
      ver: auto && auto.ver ? auto.ver : '',
      label: kind === 'asn' ? auto.label : '',
      status: 'run',
      note: '',
      error: '',
      schema: null,
      asnText: null,
      imported: false,
    };
    ingestState.results.push(r);
    await ingestProcess(r);
  }
}

async function ingestProcess(r) {
  r.status = 'run';
  r.error = '';
  ingestRenderRows();
  try {
    const buf = new Uint8Array(await r.fileObj.arrayBuffer());
    if (r.kind === 'nas') {
      if (!r.spec || !r.ver) throw new Error('文件名不含 spec-版本（如 24501-i70.zip），请手动补两栏后点重跑');
      const out = await ingestDocxZip(buf, { spec: r.spec, version: r.ver });
      r.schema = out.schema;
      r.note = `位表 ${out.stats.bitTables} · 消息表 ${out.stats.msgTables} · 类型表 ${out.structured.typeTables.length} · 章节 ${out.structured.sections.length}`;
    } else {
      r.asnText = await ingestAsnText(buf);
      const nBlocks = (r.asnText.match(/ASN1STOP/g) || []).length;
      r.note = `ASN.1 块 ${nBlocks} · ${(r.asnText.length / 1024).toFixed(0)} KB`;
      if (!nBlocks) throw new Error('未找到 ASN1START/ASN1STOP 块——这是 NAS 类 spec？请走上面 NAS 族入口');
    }
    r.status = 'ok';
  } catch (e) {
    r.status = 'err';
    r.error = String(e.message || e);
  }
  ingestRenderRows();
}

// docx zip（或外层包一层的官方 zip）→ ASN.1 全文（ASN1START 块拼接，example 剔除）
async function ingestAsnText(buf) {
  let files = await zipUnpack(buf);
  if (!Object.keys(files).some((n) => /^word\/document\.xml$/i.test(n))) {
    const docxName = Object.keys(files).find((n) => /\.docx$/i.test(n) && !n.startsWith('__MACOSX'));
    if (!docxName) throw new Error('zip 内没有 .docx');
    files = await zipUnpack(files[docxName]);
  }
  const docKey = Object.keys(files).find((n) => /^word\/document\.xml$/i.test(n));
  if (!docKey) throw new Error('docx 内无 word/document.xml（不是有效 Word 文件？）');
  const ext = extractFromDocumentXml(bytesToUtf8(files[docKey]));
  if (ext.warnings.length) ingestAsnText._warn = ext.warnings;
  return ext.text;
}

function ingestRenderRows() {
  const box = $('ingRows');
  if (!ingestState.results.length) {
    box.innerHTML = `<p class="dim" style="font:400 12px var(--sans)">尚未导入。上方拖入文件开始。</p>`;
  } else {
    box.innerHTML = ingestState.results.map((r) => {
      const pill = r.status === 'run' ? '<span class="pill run">解析中…</span>'
        : r.status === 'ok' ? '<span class="pill ok">完成</span>'
        : `<span class="pill err" title="${esc(r.error)}">失败</span>`;
      const nameCell = r.kind === 'nas'
        ? `<input type="text" data-ing="${r.id}" data-f="spec" value="${esc(r.spec)}" style="width:72px" title="spec 编号"> - <input type="text" data-ing="${r.id}" data-f="ver" value="${esc(r.ver)}" style="width:64px" title="版本（如 i70）">`
        : `<input type="text" data-ing="${r.id}" data-f="label" value="${esc(r.label)}" style="width:150px" title="规范库名称">`;
      const acts = [];
      if (r.status === 'err') acts.push(`<button class="btn sm" data-ingact="rerun" data-ing="${r.id}">重跑</button>`);
      if (r.status === 'ok' && r.kind === 'nas') {
        acts.push(`<button class="btn sm" data-ingact="import" data-ing="${r.id}" ${r.imported ? 'disabled' : ''}>${r.imported ? '已入库 ✓' : '入库 NAS'}</button>`);
        acts.push(`<button class="btn sm" data-ingact="export" data-ing="${r.id}">导出 JSON</button>`);
      }
      if (r.status === 'ok' && r.kind === 'asn') {
        acts.push(`<button class="btn sm" data-ingact="asnim" data-ing="${r.id}" ${r.imported ? 'disabled' : ''}>${r.imported ? '已入库 ✓' : '加入规范库'}</button>`);
        acts.push(`<button class="btn sm" data-ingact="export" data-ing="${r.id}">导出 .asn</button>`);
      }
      return `<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd-faint)">
        <span style="font:400 12px var(--mono);width:230px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.file)}">${esc(r.file)}</span>
        ${nameCell}
        <span style="flex:1;min-width:0;font:400 11px var(--mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.error || r.note)}">${esc(r.note)}</span>
        ${pill}${acts.map((a) => a).join('')}</div>`;
    }).join('');
    box.querySelectorAll('[data-ingact]').forEach((b) => b.addEventListener('click', () => ingestAct(b.dataset.ingact, parseInt(b.dataset.ing, 10))));
    box.querySelectorAll('input[data-ing]').forEach((i) => i.addEventListener('change', () => {
      const r = ingestState.results.find((x) => x.id === parseInt(i.dataset.ing, 10));
      if (r) r[i.dataset.f] = i.value.trim();
    }));
  }
  const done = ingestState.results.filter((r) => r.status === 'ok').length;
  $('ingCount').textContent = ingestState.results.length ? `${done}/${ingestState.results.length} 完成` : '';
  $('ingImportAll').disabled = !ingestState.results.some((r) => r.status === 'ok' && !r.imported);
  $('ingExportAll').disabled = !ingestState.results.some((r) => r.status === 'ok');
}

async function ingestAct(act, id) {
  const r = ingestState.results.find((x) => x.id === id);
  if (!r) return;
  if (act === 'rerun') {
    if (!r.fileObj) { r.note = '文件句柄已释放，请重新拖入'; ingestRenderRows(); return; }
    await ingestProcess(r);
    return;
  }
  if (act === 'import' && r.kind === 'nas') {
    if (!r.spec || !r.ver) { r.note = '先补齐 spec/版本号'; ingestRenderRows(); return; }
    nasState.schemas[nasKey(r.spec, r.ver)] = r.schema;
    nasRefreshSelectors();
    r.imported = true;
    ingestRenderRows();
    return;
  }
  if (act === 'asnim' && r.kind === 'asn') {
    const label = r.label || r.file.replace(/\.(zip|docx)$/i, '');
    $('page-ingest').querySelector('.page-head h1').textContent = '解析 ASN.1 中…（' + label + '）';
    setTimeout(() => {
      try {
        const parsed = parseAsn1File(r.asnText, { provenance: 'user-imported', spec: label }, registry);
        if (parsed.errors.length) { r.note = 'ASN.1 解析失败：' + parsed.errors[0]; }
        else { registryAddVersion(label); r.imported = true; }
      } catch (e) { r.note = 'ASN.1 解析异常：' + e.message; }
      $('page-ingest').querySelector('.page-head h1').textContent = '官方 docx 进来，可用规范出去';
      ingestRenderRows();
    }, 30);
    return;
  }
  if (act === 'export') {
    if (r.kind === 'nas') ingestDownload(`${r.spec}-${r.ver}.nas.json`, JSON.stringify(r.schema, null, 1), 'application/json');
    else ingestDownload(`${r.label || 'spec'}.asn`, r.asnText, 'text/plain');
  }
}

function ingestAll(mode) {
  const ok = ingestState.results.filter((r) => r.status === 'ok');
  for (const r of ok) {
    if (mode === 'export') {
      if (r.kind === 'nas') ingestDownload(`${r.spec}-${r.ver}.nas.json`, JSON.stringify(r.schema, null, 1), 'application/json');
      else ingestDownload(`${r.label || 'spec'}.asn`, r.asnText, 'text/plain');
    } else if (r.kind === 'nas' && !r.imported) {
      if (r.spec && r.ver) { nasState.schemas[nasKey(r.spec, r.ver)] = r.schema; r.imported = true; }
    }
  }
  if (mode === 'import') { nasRefreshSelectors(); persistNasSchemas(); }
  ingestRenderRows();
}

function ingestDownload(filename, content, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

        <li><span class="n">2</span>解析器覆盖 3GPP RRC + AP 族方言（含信息对象类/参数化/表约束）；NAS（24.501/24.301，TS 24.007 TLV）由独立 codec 引擎覆盖（NAS 页签，schema 由用户以 tools/nasdef.mjs 从规范表格生成）</li>
        <li><span class="n">3</span>逐字节验证当前仅 MIB-NR 过外部 oracle；正式发包前须做 Wireshark/asn1c 三方交叉验证</li>
        <li><span class="n">4</span>内置 schema 不含 3GPP 官方 .asn 全文（版权纪律：正式分发采用"用户自带 spec"模式）</li>
      </ul>

    </div></div>
  </div>`;
}

/* ============ F6 NAS（24.501/24.301 TLV） ============ */
const nasState = { schemas: {}, spec: '24501', ver: null, msg: null, instIdx: 0, form: {}, decoded: null };
const NAS_HEAD_ROW = /extended protocol discriminator|^security header type|^spare half octet$|^protocol discriminator$|message (identity|type)/i;

function nasKey(spec, ver) { return `${spec} ${ver}`; }
function nasCur() { return nasState.schemas[nasKey(nasState.spec, nasState.ver)] || null; }
function nasMsgList() {
  const s = nasCur();
  return s ? Object.keys(s.messages) : [];
}
function nasCurInst() {
  const s = nasCur();
  if (!s || !nasState.msg || !s.messages[nasState.msg]) return null;
  const arr = s.messages[nasState.msg];
  return arr[Math.min(nasState.instIdx, arr.length - 1)];
}

// 完整性/加密算法下拉：5G = NIA0-3/NEA0-3（24.501 §9.11.3.34），EPS = EIA0-2/EEA0-2（24.301 §9.9.3.23）
function nasSecRefreshAlgos() {
  const g = nasState.spec === '24301';
  const intAlgos = g ? ['EIA0（Null）', 'EIA1（SNOW 3G）', 'EIA2（AES-CMAC）'] : ['NIA0（Null）', 'NIA1（SNOW 3G）', 'NIA2（AES-CMAC）', 'NIA3（ZUC）'];
  const encAlgos = g ? ['EEA0（Null）', 'EEA1（SNOW 3G）', 'EEA2（AES-CTR）'] : ['NEA0（Null）', 'NEA1（SNOW 3G）', 'NEA2（AES-CTR）', 'NEA3（ZUC）'];
  $('nasSecAlgInt').innerHTML = intAlgos.map((s, i) => `<option value="${i}" ${i === 1 ? 'selected' : ''}>${i} ${s.split('（')[0]}</option>`).join('');
  $('nasSecAlgEnc').innerHTML = encAlgos.map((s, i) => `<option value="${i}" ${i === 1 ? 'selected' : ''}>${i} ${s.split('（')[0]}</option>`).join('');
  $('nasSecBearer').innerHTML = g ? '<option value="0">BEARER=0（EPS 恒定）</option>' : '<option value="1">BEARER=1（3GPP 接入）</option><option value="2">BEARER=2（non-3GPP）</option>';
}

// 派生 K_NASint/K_NASenc（33.501 A.8 FC=0x69 / 33.401 A.7 FC=0x15；输出低 128 位）
function nasSecDerive() {
  const host = $('nasSecKeysInfo');
  const parent = ($('nasSecParent').value || '').replace(/[^0-9a-fA-F]/g, '');
  if (parent.length !== 64) { host.innerHTML = '<span style="color:#da1e28">父密钥须为 64 位 hex（32 字节 K_AMF/K_ASME）</span>'; return; }
  const k = Uint8Array.from(parent.match(/../g).map((x) => parseInt(x, 16)));
  const algInt = parseInt($('nasSecAlgInt').value, 10);
  const algEnc = parseInt($('nasSecAlgEnc').value, 10);
  const kInt = nasKeyDerivation(nasState.spec, k, 0x02, algInt);
  const kEnc = nasKeyDerivation(nasState.spec, k, 0x01, algEnc);
  nasState.secKeys = { kInt, kEnc, algInt, algEnc };
  const hx = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
  host.innerHTML = `K_NASint <span style="font:11px var(--mono)">${hx(kInt)}</span> · K_NASenc <span style="font:11px var(--mono)">${hx(kEnc)}</span>`;
}

// MAC 校验（24.501 §4.4.3.3 覆盖 octet7..n / 24.301 §4.4.3.3 octets6..n；COUNT=0x00‖OVF‖SQN）。
// fillMode=true 时不做比对，只把计算出的 MAC 写进封装输入。
function nasSecVerify(fillMode = false) {
  const host = $('nasSecOut');
  const hexIn = ($('nasHexIn').value || '').replace(/[^0-9a-fA-F]/g, '');
  if (!nasState.secKeys) { inlineMsg('nasSecOut', '先派生 K_NAS 密钥（父密钥 → 派生）。'); return; }
  try {
    let seq, payload, frameMac = null;
    if (hexIn) {
      const d = decSec(nasCur() || { messages: {} }, OCT(hexIn), nasState.spec);
      seq = d.seq;
      payload = d.payload;
      frameMac = d.mac;
    } else if (fillMode) {
      // 无已解帧：按「即将封装的内容」计算（载荷 = 当前输出；SHT=2/4 时先 EEA 加密，
      // MAC 覆盖密文——与 encSecProtected 语义一致），序号取封装输入
      const plain = ($('nasHexOut').textContent || '').replace(/[^0-9a-fA-F]/g, '');
      const isFrame = nasState.spec === '24501' ? /^7e0[1-4]/i.test(plain) : /^[1-4]7/i.test(plain);
      if (!plain || isFrame) { inlineMsg('nasSecOut', '先在「解码」卡粘贴安全帧，或在左侧编码出明文消息。'); return; }
      seq = parseInt($('nasSecSeq').value, 10) || 0;
      const shtSel = parseInt($('nasSecSht').value, 10);
      const dir0 = parseInt($('nasSecDir').value, 10);
      const bearer0 = parseInt($('nasSecBearer').value, 10);
      const ovf0 = parseInt(($('nasSecOvf').value || '0').replace(/[^0-9a-fA-F]/g, ''), 16) || 0;
      const cnt0 = ((ovf0 & 0xffff) << 8) | seq;
      payload = (shtSel === 2 || shtSel === 4)
        ? nasCipher(nasState.spec, nasState.secKeys.algEnc, nasState.secKeys.kEnc, cnt0, dir0, bearer0, OCT(plain))
        : OCT(plain);
    } else {
      inlineMsg('nasSecOut', '先在「解码」卡粘贴安全帧 hex。');
      return;
    }
    const ovf = parseInt(($('nasSecOvf').value || '0').replace(/[^0-9a-fA-F]/g, ''), 16) || 0;
    const count24 = ((ovf & 0xffff) << 8) | seq;
    const dir = parseInt($('nasSecDir').value, 10);
    const bearer = parseInt($('nasSecBearer').value, 10);
    const mac = nasMac(nasState.spec, nasState.secKeys.algInt, nasState.secKeys.kInt, count24, dir, bearer, seq, payload);
    const hx = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
    if (fillMode) {
      $('nasSecMac').value = hx(mac);
      const shtSel = parseInt($('nasSecSht').value, 10);
      host.innerHTML = `<p style="font:400 12px var(--sans)">MAC 计算值 <span style="font:11.5px var(--mono)">${hx(mac)}</span> 已填入封装输入（载荷 ${payload.length} 字节${shtSel === 2 || shtSel === 4 ? '，已按 EEA' + nasState.secKeys.algEnc + ' 加密——MAC 覆盖密文' : '，明文'}，seq=${seq}）——点「封装当前输出」生效。</p>`;
      return;
    }
    const ok = !!frameMac && hx(frameMac) === hx(mac);
    host.innerHTML = `<p style="font:400 12px/1.7 var(--sans)">帧 MAC <span style="font:11.5px var(--mono)">${frameMac ? hx(frameMac) : '—'}</span> · 计算 MAC <span style="font:11.5px var(--mono)">${hx(mac)}</span><br>
      <span style="font:500 13px var(--sans);color:${ok ? '#198038' : '#da1e28'}">${ok ? '✓ MAC 一致——帧完整性与密钥匹配' : '✗ MAC 不一致（密钥/COUNT/方向/BEARER 不匹配或帧被改）'}</span><br>
      <span style="color:var(--ink3)">输入：alg=${nasState.secKeys.algInt} COUNT=0x${count24.toString(16).padStart(6, '0')} dir=${dir} bearer=${bearer} 覆盖 ${payload.length + 1} 字节（序号+载荷）</span></p>`;
  } catch (e) {
    host.innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`;
  }
}

// SHT=2/4 载荷解密（NEA/EIA 同参数；EEA0 透传）→ 明文写回解码输入
function nasSecDecipher() {
  const host = $('nasSecOut');
  const hexIn = ($('nasHexIn').value || '').replace(/[^0-9a-fA-F]/g, '');
  if (!hexIn) { inlineMsg('nasSecOut', '先在「解码」卡粘贴安全帧 hex。'); return; }
  if (!nasState.secKeys) { inlineMsg('nasSecOut', '先派生 K_NAS 密钥。'); return; }
  try {
    const pre = decSec(nasCur() || { messages: {} }, OCT(hexIn), nasState.spec);
    if (!(pre.sht === 2 || pre.sht === 4)) { host.innerHTML = '<p style="font:400 12px var(--sans)">SHT=1/3 载荷本就是明文——直接点「解安全帧」。</p>'; return; }
    const ovf = parseInt(($('nasSecOvf').value || '0').replace(/[^0-9a-fA-F]/g, ''), 16) || 0;
    const count24 = ((ovf & 0xffff) << 8) | pre.seq;
    const dir = parseInt($('nasSecDir').value, 10);
    const bearer = parseInt($('nasSecBearer').value, 10);
    const { plain, plainFrame, macPlain } = decipherSec(nasCur() || { messages: {} }, OCT(hexIn), { count24, dir, bearer, keys: nasState.secKeys }, nasState.spec);
    const hx = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
    const plainHex = hx(plain);
    $('nasHexIn').value = hx(plainFrame);
    host.innerHTML = `<p style="font:400 12px var(--sans)">已解密 ${plain.length} 字节并重组为 SHT=1 明文帧（MAC 已按明文载荷重算：${hx(macPlain)}，原 MAC 覆盖的是密文）写入解码输入——点「解安全帧」看内层消息。<br><span style="font:11px var(--mono);color:var(--ink3)">明文 hex：${plainHex.slice(0, 64)}${plainHex.length > 64 ? '…' : ''}</span></p>`;
  } catch (e) {
    host.innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`;
  }
}

function nasImportFiles(ev) {
  const files = Array.from(ev.target.files || []);
  let pending = files.length;
  for (const f of files) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = JSON.parse(rd.result);
        if (!s.messages || !s.spec || !s.version) throw new Error('缺 spec/version/messages');
        nasState.schemas[nasKey(s.spec, s.version)] = s;
        persistNasSchemas();
      } catch (e) { inlineMsg('nasImportInfo', `导入失败 ${f.name}: ${e.message}`); }
      if (--pending === 0) nasRefreshSelectors();
    };
    rd.readAsText(f);
  }
  ev.target.value = '';
}

function nasRefreshSelectors() {
  const specs = [...new Set(Object.keys(nasState.schemas).map((k) => k.split(' ')[0]))].sort();
  if (!nasState.spec || !specs.includes(nasState.spec)) nasState.spec = specs[0] || '24501';
  const vers = Object.keys(nasState.schemas).filter((k) => k.startsWith(nasState.spec + ' ')).map((k) => k.split(' ')[1]).sort();
  if (!nasState.ver || !vers.includes(nasState.ver)) nasState.ver = vers[vers.length - 1] || null;
  $('nasSpec').innerHTML = specs.map((s) => `<option ${s === nasState.spec ? 'selected' : ''}>${esc(s)}</option>`).join('');
  $('nasVer').innerHTML = vers.map((v) => `<option ${v === nasState.ver ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const msgs = nasMsgList();
  if (!nasState.msg || !msgs.includes(nasState.msg)) nasState.msg = msgs[0] || null;
  $('nasMsg').innerHTML = msgs.map((m) => `<option ${m === nasState.msg ? 'selected' : ''}>${esc(m)}</option>`).join('');
  const s = nasCur();
  const insts = s && nasState.msg ? s.messages[nasState.msg] : [];
  if (nasState.instIdx >= insts.length) nasState.instIdx = 0;
  $('nasInst').innerHTML = insts.map((x, i) => `<option value="${i}" ${i === nasState.instIdx ? 'selected' : ''}>#${i}${x.direction ? ' ' + esc(x.direction) : ''}</option>`).join('');
  $('nasMsgNote').textContent = s
    ? `${nasKey(nasState.spec, nasState.ver)}：${Object.keys(s.messages).length} 消息 / ${Object.keys(s.msgTypes || {}).length} 消息类型值 / ${Object.keys(s.ies || {}).length} IE 节`
    : '尚未导入 schema——用 tools/nasdef.mjs 从官方 docx 表格生成（见手册 §7）。';
  // 33.501/33.401 SHT 安全帧封装仅 LTE/5G NAS 有：GSM RR 的 A5 在 RR 层（44.018 无
  // SHT 帧形态）、SS 消息不加密——这两族隐藏安全卡
  const secCard = $('nasSecCard');
  if (secCard) secCard.style.display = ['44018', '24080', '24011', '23040', '29274', '29060', '29244', '29281'].includes(nasState.spec) ? 'none' : '';
  $('nasDiffL').innerHTML = Object.keys(nasState.schemas).map((k) => `<option>${esc(k)}</option>`).join('');
  $('nasDiffR').innerHTML = Object.keys(nasState.schemas).map((k) => `<option>${esc(k)}</option>`).join('');
  nasSecRefreshAlgos();
  nasRenderForm();
}

function nasRenderForm() {
  const inst = nasCurInst();
  const host = $('nasForm');
  if (!inst) { host.innerHTML = '<p class="muted">无消息。</p>'; return; }
  nasState.form = {};
  const rows = inst.rows.map((r, ri) => {
    const name = r.name || '';
    const isHead = NAS_HEAD_ROW.test(name);
    const fmt = rowFormat(r);
    const ieiVal = rowIei(r);
    const flen = fixedLen(r.len);
    const pres = rowPresence(r.presence);
    const optional = pres !== 'M';
    let input = '';
    if (isHead) {
      const v = /^message (identity|type)/i.test(name) && inst.msgType != null ? `0x${inst.msgType.toString(16).padStart(2, '0')}`
        : (nasState.spec === '24301' && /^protocol discriminator$/i.test(name)) ? `${nasPD(inst)}（PD）`
        : /extended protocol discriminator/i.test(name) ? (nasState.spec === '24501' ? '0x7E' : '半八位组')
        : '自动';
      // CC（v1.85.0）：24.501 头八位组模型注记（呈现层——0xe 为固定半填充，pycrate oracle
      // 同构，非用户数据；线缆行为由 codec.js EPD 特判决定，本注不改编码）
      const epdTip = nasState.spec === '24501' ? ' title="24.501 头八位组模型：EPD 占高半、低半为固定半填充 0xe（pycrate oracle 同构）——非用户数据，编码由引擎按 5GMM 0x7E / 5GSM 0x2E 决定"' : '';
      input = `<span class="dim" style="font:11px var(--mono)"${epdTip}>${v}</span>`;
    } else if (fmt === 'UNK' || (ieiVal == null && (r.iei || '').trim() !== '')) {
      input = `<span class="dim" style="font:11px var(--mono)">占位行（不可编码）</span>`;
    } else if (fmt === 'VH' || fmt === 'TV1') {
      nasState.form[ri] = { val: '0', nib: true };
      input = `<input data-ri="${ri}" data-kind="nib" value="0" maxlength="2" style="width:56px;font:12px var(--mono)">`;
    } else if (fmt === 'V' || fmt === 'TV') {
      const nb = flen != null ? (fmt === 'TV' ? (flen - 1) * 2 : flen * 2) : null;
      nasState.form[ri] = { val: '' };
      input = `<input data-ri="${ri}" data-kind="hex" placeholder="hex${nb ? `（${nb} 位）` : '（至尾）'}" ${nb ? `maxlength="${nb}"` : ''} style="flex:1;font:12px var(--mono)">`;
      if (/DNN/i.test(r.name || '')) {
        input += `<input data-ri="${ri}" data-kind="apn" placeholder="APN 点分域名" style="flex:1;font:12px var(--sans)">`;
      }
    } else if (fmt === 'T') {
      input = `<span class="dim" style="font:11px var(--mono)">仅 IEI</span>`;
    } else {
      nasState.form[ri] = { val: '', on: false };
      input = `<textarea data-ri="${ri}" data-kind="hex" rows="2" placeholder="值 hex（长度自描述）" style="flex:1;font:12px var(--mono)"></textarea>`;
      if (/DNN/i.test(r.name || '')) {
        input += `<input data-ri="${ri}" data-kind="apn" placeholder="APN 点分域名" style="flex:1;font:12px var(--sans)">`;
      }
    }
    const badge = optional
      ? `<label style="display:flex;align-items:center;gap:4px;font:400 11px var(--sans);color:var(--t3);white-space:nowrap"><input type="checkbox" data-ri="${ri}" data-kind="on" ${nasState.form[ri] && nasState.form[ri].on ? 'checked' : ''}>${esc(r.presence)}</label>`
      : `<span style="font:400 11px var(--mono);color:var(--t4);white-space:nowrap">${esc(r.presence)}</span>`;
    return `<div data-ref="${esc(r.ref || r.def || '')}" data-iei="${esc(r.iei || '')}" style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd-faint)">
      <span style="font:400 11px var(--mono);color:var(--t4);width:44px;flex-shrink:0">${esc(r.iei || '·')}</span>
      <span style="font:400 12px var(--sans);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(name)}">${esc(name)}<span class="dim" style="font:10px var(--mono)"> ${esc(fmt)}</span></span>
      ${input}${badge}</div>`;
  });
  host.innerHTML = rows.join('');
  host.querySelectorAll('input[data-kind],textarea[data-kind]').forEach((el) => {
    el.addEventListener('input', () => {
      const f = nasState.form[el.dataset.ri];
      if (el.dataset.kind === 'apn' && f) {
        try {
          const hexStr = Array.from(apnEncode(el.value)).map((b) => b.toString(16).padStart(2, '0')).join('');
          const hexEl = host.querySelector(`[data-ri="${el.dataset.ri}"][data-kind="hex"]`); // TLV 行为 textarea
          if (hexEl) hexEl.value = hexStr;
          f.val = hexStr;
          return;
        } catch { /* 输入未完成时不更新 */ }
      }
      if (f) f.val = el.value;
      if (el.dataset.kind === 'on' && f) f.on = el.checked;
    });
    if (el.dataset.kind === 'on') {
      const f = nasState.form[el.dataset.ri];
      if (f) { f.on = el.checked; el.addEventListener('change', () => { f.on = el.checked; }); }
    }
  });
}

function nasBuildParts() {
  const parts = [];
  for (const [ri, f] of Object.entries(nasState.form)) {
    if (f.on === false) continue;
    if (f.val === '' || f.val == null) continue;
    if (f.nib) {
      const v = parseInt(f.val, 10);
      if (isNaN(v) || v < 0 || v > 15) throw new Error(`行 ${ri}: 半八位组值须 0-15`);
      parts.push({ rowIdx: parseInt(ri, 10), value: v });
    } else {
      const clean = f.val.replace(/[^0-9a-fA-F]/g, '');
      if (clean.length % 2) throw new Error(`行 ${ri}: hex 长度须为偶数`);
      parts.push({ rowIdx: parseInt(ri, 10), value: OCT(clean) });
    }
  }
  return parts;
}

// 29274/29060：重编码回传解码时的 TEID/Seq/piggyback（连接状态不是表内 IE，见 gtpc.js/gtpv1.js）。
// 防跨消息泄漏：当前选择与解码上下文（spec/ver/msg/instIdx）不一致时不回传。
function nasGtpcHdr() {
  const c = nasState._decodedCtx;
  if (!c || c.hdr == null) return undefined;
  if (c.spec !== nasState.spec || String(c.ver) !== String(nasState.ver) || c.msg !== nasState.msg || c.instIdx !== nasState.instIdx) return undefined;
  return c.hdr;
}

function nasEncode() {
  const inst = nasCurInst();
  if (!inst) return;
  try {
    const bytes = encMsg(inst, nasBuildParts(), nasState.spec, nasGtpcHdr());
    $('nasHexOut').textContent = Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    $('nasHexOut').textContent = '';
    inlineMsg('nasEncErr', e.message);
  }
}

function nasSample() {
  const s = nasCur();
  const inst = nasCurInst();
  if (!inst) return;
  const { lines } = sampleSchema({ spec: nasState.spec, messages: { [nasState.msg]: [inst] }, ies: s.ies }, 1, (Math.random() * 1e9) | 0);
  if (!lines.length) { inlineMsg('nasEncErr', '该实例不可盲采样（可变 V / FFS 存根等）。'); return; }
  $('nasHexOut').textContent = lines[0].hex;
  nasDecodeFrom(lines[0].hex);
}

// CSN.1 rest octets 解码树行（批次D）：trace → [depth, 名称, 值]；fixed/spare/pad/rep 为结构位不进树
function csn1TraceLines(trace, warnings, ext) {
  const lines = [];
  for (const op of trace || []) {
    const pad = op.d || 0;
    if (op.kind === 'field' || op.kind === 'mark') {
      lines.push([pad, op.name, op.bits ? `${op.value}（${op.bits} 位）` : String(op.value)]);
    } else if (op.kind === 'bitstring') {
      lines.push([pad, op.name, `${op.value}（${op.bits} 位）`]);
    } else if (op.kind === 'choice' && op.tag) {
      lines.push([pad, `判别 ${op.tag}`, '']);
    } else if (op.kind === 'ext') {
      lines.push([pad, `⚠ 外部结构 ${op.name}`, `其后 ${op.bits} 位保留原样`]);
    }
  }
  for (const w of warnings || []) lines.push([0, `⚠ ${w}`, '']);
  return lines;
}

// 值语义展示：位布局字段展开 + APN/PLMN 语义解码（解析失败回退原始 hex）
function nasValueHtml(r, value) {
  const raw = value == null ? '—'
    : typeof value === 'number' ? `0x${value.toString(16)}`
    : Array.from(value).map((b) => b.toString(16).padStart(2, '0')).join('');
  if (value == null || (typeof value !== 'number' && !value.length)) return raw; // 数值放行：半八位组布局按 nibble 解
  const sem = [];
  const lname = r.name || '';
  if (/DNN/i.test(lname)) {
    try { sem.push(['APN', apnDecode(value)]); } catch {}
  }
  if (/PLMN/i.test(lname)) {
    try { const p2 = plmnDecode(value); sem.push(['PLMN', `MCC ${p2.mcc} / MNC ${p2.mnc}`]); } catch {}
  }
  if (/^TP-(OA|DA|RA)$/.test(lname)) {
    try { const a = smsAddrDecode(value); sem.push(['号码', `${a.number}（TON ${a.ton} / NPI ${a.npi}）`]); } catch {}
  }
  if (/^TP-(SCTS|DT)$/.test(lname)) {
    try { sem.push(['时间', smsSctsDecode(value)]); } catch {}
  }
  const cur = nasCur();
  let ref = r.def || (r.ref && cur && cur.ies[r.ref] ? r.ref : null);
  let refOwner = cur;
  if (!ref && r.ref) {
    for (const sc of Object.values(nasState.schemas || {})) {
      if (sc.ies && sc.ies[r.ref]) { ref = r.ref; refOwner = sc; break; }
    }
  }
  let fieldRows = '';
  if (ref && refOwner.ies[ref].csn1) {
    // CSN.1 rest octets（批次D）：位级解码树（外部结构引用部分解码 + 原始尾位保留）
    try {
      const c = refOwner.ies[ref].csn1;
      const defs = new Map(Object.entries(c.defs));
      const bytes = typeof value === 'number' ? Uint8Array.of(value) : value;
      const d = csn1Decode(defs, defs.get(c.root), bytes, { areaBytes: bytes.length });
      const lines = csn1TraceLines(d.trace, d.warnings, d.external);
      if (lines.length) {
        fieldRows = `<table style="margin:2px 0 2px 14px;font:11px var(--mono);border-collapse:collapse">${lines.map(([dep, k, v]) => `<tr><td style="padding:1px 8px 1px 0;color:var(--t3)">${'&nbsp;'.repeat(dep * 2)}${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
      }
    } catch {}
  }
  if (ref) {
    const lay = refOwner.ies[ref].layouts[0];
    if (lay && lay.octets.length) {
      const framed = rowFormat(r) !== 'V' && rowFormat(r) !== 'VH';
      try {
        const { fields, warnings } = layoutUnpack(lay.octets, value, framed);
        const ks = Object.keys(fields);
        if (ks.length) {
          fieldRows = `<table style="margin:2px 0 2px 14px;font:11px var(--mono);border-collapse:collapse">${ks.map((k) => `<tr><td style="padding:1px 8px 1px 0;color:var(--t3)">${esc(k)}</td><td>${fields[k]}（0x${fields[k].toString(16)}）</td></tr>`).join('')}${warnings.map((w) => `<tr><td colspan="2" style="color:#f1c21b">${esc(w)}</td></tr>`).join('')}</table>`;
        }
      } catch {}
    }
  }
  if (!sem.length && !fieldRows) return raw;
  return raw + (sem.map(([k, v]) => `<div style="font:400 11px var(--sans);color:#198038">${esc(k)}: ${esc(v)}</div>`).join('')) + fieldRows;
}

// 29274 解码行渲染：分组 IE 子树（p.children 递归缩进）+ piggyback 内嵌消息段
function nasGtpcPartRows(p, depth, indent0 = 0) {
  const pad = 14 * (depth + indent0);
  const head = depth
    ? `<tr><td style="padding:2px 3px;color:var(--t4)">↳</td><td style="padding:2px 3px;padding-left:${14 + pad}px">└ ${esc(p.row.name)} <span style="color:var(--t4)">（Type ${esc(p.row.iei)}/实例 ${p.ins ?? '—'}）</span></td><td style="padding:2px 3px">${nasValueHtml(p.row, p.value)}</td></tr>`
    : `<tr><td style="padding:3px;color:var(--t4)">${p.rowIdx}</td><td style="padding:3px;padding-left:${pad}px">${esc(p.row.name)}</td><td style="padding:3px">${nasValueHtml(p.row, p.value)}</td></tr>`;
  return head + (p.children || []).map((c) => nasGtpcPartRows(c, depth + 1, indent0)).join('');
}

function nasGtpcPiggyRows(piggy) {
  return (piggy || []).map((pg) =>
    `<tr><td colspan="3" style="padding:7px 3px 2px;font:600 11.5px var(--sans);color:var(--t3)">▸ 内嵌消息（piggybacked）：${esc(pg.name)}（帧 ${pg.hex.length / 2} 字节，重编码字节保真回嵌）</td></tr>` +
    pg.parts.map((p) => nasGtpcPartRows(p, 0, 1)).join('') +
    ((pg.warnings || []).length ? `<tr><td colspan="3" style="padding:2px 3px;font:400 11px var(--sans);color:#f1c21b">${pg.warnings.map((s) => `⚠ ${esc(s)}`).join('<br>')}</td></tr>` : '')
  ).join('');
}

function nasDecodeFrom(hex) {
  const inst = nasCurInst();
  if (!inst) return;
  try {
    const { parts, warnings, hdr, piggy } = decMsg(inst, OCT(hex), nasState.spec, nasCur());
    nasState.decoded = parts;
    nasState._decodedCtx = { inst, spec: nasState.spec, ver: nasState.ver, msg: nasState.msg, instIdx: nasState.instIdx, hex, parts, warnings, hdr, piggy: piggy || [] };
    const smsSem = smsMsgSemantics(parts);
    const l2pl = l2plCheck(inst, OCT(hex), parts);
    $('nasDecOut').innerHTML = `<table style="width:100%;font:11.5px var(--mono);border-collapse:collapse">
      <tr style="color:var(--t4)"><th style="text-align:left;padding:3px">行</th><th style="text-align:left;padding:3px">IE</th><th style="text-align:left;padding:3px">值</th></tr>
      ${parts.map((p) => nasGtpcPartRows(p, 0)).join('')}
      ${(piggy || []).length ? nasGtpcPiggyRows(piggy) : ''}
      ${(warnings || []).length ? `<tr><td colspan="3" style="padding:3px;font:400 11px var(--sans);color:#f1c21b">${warnings.map((s) => `⚠ ${esc(s)}`).join('<br>')}</td></tr>` : ''}
      ${smsSem.length ? `<tr><td colspan="3" style="padding:3px;font:400 11px var(--sans);color:#198038">${smsSem.map((s) => `📩 ${esc(s)}`).join('<br>')}</td></tr>` : ''}
      ${l2pl.length ? `<tr><td colspan="3" style="padding:3px;font:400 11px var(--sans);color:var(--t3)">${l2pl.map((s) => `📏 ${esc(s)}`).join('<br>')}</td></tr>` : ''}
    </table>`;
  } catch (e) {
    nasState.decoded = null;
    nasState._decodedCtx = null;
    $('nasDecOut').innerHTML = `<p style="font:400 12px var(--sans);color:#da1e28">${esc(e.message)}</p>`;
  }
}

// ---- NAS 报告导出（.md/.json；与 Release Diff 导出同一 ingestDownload 通道）----------
// 值语义文本版（nasValueHtml 的 md 对应物）：raw hex + APN/PLMN + 位布局字段展开
function nasValueText(r, value) {
  const raw = value == null ? '—'
    : typeof value === 'number' ? `0x${value.toString(16)}`
    : Array.from(value).map((b) => b.toString(16).padStart(2, '0')).join('');
  if (value == null || (typeof value !== 'number' && !value.length)) return raw; // 数值放行：半八位组布局按 nibble 解
  const sem = [];
  const lname = r.name || '';
  if (/DNN/i.test(lname)) { try { sem.push(`APN: ${apnDecode(value)}`); } catch {} }
  if (/PLMN/i.test(lname)) { try { const p2 = plmnDecode(value); sem.push(`PLMN: MCC ${p2.mcc} / MNC ${p2.mnc}`); } catch {} }
  if (/^TP-(OA|DA|RA)$/.test(lname)) { try { const a = smsAddrDecode(value); sem.push(`号码: ${a.number} (TON ${a.ton}/NPI ${a.npi})`); } catch {} }
  if (/^TP-(SCTS|DT)$/.test(lname)) { try { sem.push(`时间: ${smsSctsDecode(value)}`); } catch {} }
  const cur = nasCur();
  let ref = r.def || (r.ref && cur && cur.ies[r.ref] ? r.ref : null);
  let refOwner = cur;
  if (!ref && r.ref) {
    for (const sc of Object.values(nasState.schemas || {})) {
      if (sc.ies && sc.ies[r.ref]) { ref = r.ref; refOwner = sc; break; }
    }
  }
  if (ref && refOwner.ies[ref].csn1) {
    try {
      const c = refOwner.ies[ref].csn1;
      const defs = new Map(Object.entries(c.defs));
      const bytes = typeof value === 'number' ? Uint8Array.of(value) : value;
      const d = csn1Decode(defs, defs.get(c.root), bytes, { areaBytes: bytes.length });
      for (const [dep, k, v] of csn1TraceLines(d.trace, d.warnings, d.external)) {
        sem.push(`${'  '.repeat(dep)}${k}${v ? ': ' + v : ''}`);
      }
    } catch {}
  }
  if (ref) {
    const lay = refOwner.ies[ref].layouts[0];
    if (lay && lay.octets.length) {
      const framed = rowFormat(r) !== 'V' && rowFormat(r) !== 'VH';
      try {
        const { fields, warnings } = layoutUnpack(lay.octets, value, framed);
        for (const k of Object.keys(fields)) sem.push(`${k}: ${fields[k]} (0x${fields[k].toString(16)})`);
        sem.push(...warnings.map((w) => `⚠ ${w}`));
      } catch {}
    }
  }
  return sem.length ? `${raw}（${sem.join('; ')}）` : raw;
}

function nasDoDiff() {
  const lk = $('nasDiffL').value, rk = $('nasDiffR').value;
  if (!lk || !rk) return;
  if (lk === rk) { inlineMsg('nasDiffOut', '左右选了同一个版本——选两个不同版本再比对。'); return; }
  const L = nasState.schemas[lk], R = nasState.schemas[rk];
  const isGtp = (s) => s && (s.spec === '29060' || s.spec === '29274' || s.spec === '29244');
  let out;
  try {
    if (isGtp(L) && isGtp(R)) {
      if (L.spec !== R.spec) { inlineMsg('nasDiffOut', `跨规范对比（${L.spec} vs ${R.spec}）无语义可比性——选同一规范的两个版本。`); return; }
      out = diffGtpSchema(L, R); // GTP 族：消息表行级 + IE 节定义/布局行级（批次L）
    } else if (!isGtp(L) && !isGtp(R)) {
      out = diffNasSchema(L, R);
    } else {
      inlineMsg('nasDiffOut', `混族对比（${L.spec || '?'} vs ${R.spec || '?'}）不支持——NAS 与 GTP 的消息/IE 表语义不同。`);
      return;
    }
  } catch (e) {
    inlineMsg('nasDiffOut', `Diff 失败：${e.message}`);
    return;
  }
  const { findings, counts } = out;
  nasState._diff = { lk, rk, findings, counts };
  nasState._chain = null;
  const color = { break: '#da1e28', warn: '#f1c21b', info: 'var(--t3)', ok: '#198038' };
  $('nasDiffOut').innerHTML = `
    <p style="font:400 12px var(--sans);color:var(--t3);margin-bottom:8px">${esc(lk)} → ${esc(rk)}：break ${counts.break} · warn ${counts.warn} · info ${counts.info} · ok ${counts.ok}　<span class="dim">（点击带定位的条目跳到消息表）</span></p>

    </div>`;
}

function nasDiffFnFor(spec) {
  // CB（v1.84.0）补 29281：GTPv1-U 与 29060 同 'gtp' 行模型——误走 diffNasSchema 会拿

function nasDoDiffChain() {

// Q1：finding 点击定位——loc.msg 直接切消息；仅 loc.ref 时找首个引用该 IE 节的消息；
// 渲染后高亮对应行（data-ref/data-iei）。定位到右版本（diff 的目标版本）。
function nasDiffLocate(ev) {
  const el = ev.target.closest && ev.target.closest('.diff-finding');
  if (!el) return;
  let loc;
  try { loc = JSON.parse(el.dataset.loc || '{}'); } catch { return; }
  // v1.38.0 P3：链式 diff 原先 _diff 为 null 即整条早退——点击死交互。
  // 链式 finding 自带 data-rk（段右版本），普通 diff 用 _diff.rk。
  const rk = el.dataset.rk || (nasState._diff && nasState._diff.rk);
  const schema = rk && nasState.schemas[rk];
  if (!schema) return;
  let msg = loc.msg && schema.messages[loc.msg] ? loc.msg : null;
  if (!msg && loc.ref) {
    for (const [name, insts] of Object.entries(schema.messages || {})) {
      if (insts.some((inst) => (inst.rows || []).some((r) => r.ref === loc.ref || r.def === loc.ref))) { msg = name; break; }
    }
  }
  if (!msg) return;
  nasState.spec = schema.spec;
  nasState.ver = schema.version;
  nasState.msg = msg;
  nasState.instIdx = 0;
  nasRefreshSelectors();
  const host = $('nasForm');
  if (!host) return;
  const sel = loc.ref
    ? `[data-ref="${CSS.escape ? CSS.escape(loc.ref) : loc.ref}"]`
    : (loc.iei ? `[data-iei="${CSS.escape ? CSS.escape(String(loc.iei)) : String(loc.iei)}"]` : '');
  const hit = sel ? host.querySelector(sel) : null;
  if (hit) {
    hit.style.outline = '2px solid #f1c21b';
    hit.style.outlineOffset = '-2px';
    hit.scrollIntoView({ block: 'center' });
  } else {
    host.scrollIntoView({ block: 'start' });
  }
}

// ---- GTP-U 隧道帧构造/解析（29.281 + 38.415 §5.5/§6，批次 AE UI 面）----
// hex/kvparse/payload 纯函数在 src/ui/uifns.js（v1.39.0 可测化抽离）
function gtpuWarnHtml(warns) {
  return warns.length
    ? warns.map((w) => '<div class="finding warn" style="cursor:default;padding:5px 10px;margin-bottom:4px"><span class="dot warn"></span><p style="margin:0;font:400 11.5px/1.5 var(--sans)">' + esc(String(w)) + '</p></div>').join('')
    : '';
}
function gtpuBuildUi() {
  const out = $('gtpuBuildOut');
  try {
    const teid = parseInt(String($('gtpuTeid').value).replace(/^0x/i, ''), 16) || 0;
    const seqv = $('gtpuSeq').value.trim();
    const payload = gtpuPayloadOf($('gtpuPayload').value.trim());
    const exts = [];
    const warns = [];
    for (const pair of [['gtpuPscDl', 'dl'], ['gtpuPscUl', 'ul'], ['gtpuPset', 'pset']]) {
      const kv = $(pair[0]).value.trim();
      if (!kv) continue;
      const f = gtpuKvParse(kv);
      if (pair[1] === 'pset') {
        for (const uk of pscUnknownKeys('pset', f)) warns.push('PSET 未知键 ' + uk.key + '（已忽略）' + (uk.near ? '——最近似正名 ' + uk.near : ''));
        const c = pduSetInfo(f);
        if (c.warnings) warns.push(...c.warnings);
        exts.push({ type: 0x04, content: c });
      } else {
        for (const uk of pscUnknownKeys(pair[1], f)) warns.push('PSC ' + pair[1].toUpperCase() + ' 未知键 ' + uk.key + '（已忽略）' + (uk.near ? '——最近似正名 ' + uk.near : ''));
        f.dir = pair[1];
        const c = pduSessionInfo(f);
        if (c.warnings) warns.push(...c.warnings);
        exts.push({ type: 0x85, content: c });
      }
    }
    const bytes = gtpuBuild({ teid, seq: seqv === '' ? null : Number(seqv), exts, payload });
    if (bytes.warnings) warns.push(...bytes.warnings);
    const hex = Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
    out.innerHTML = '<div class="hexout"><div class="hexstr">' + hex + '</div>'
      + '<button class="btn sm" id="gtpuCopy">复制</button></div>'
      + '<div style="font:400 11px var(--mono);color:var(--ink3);margin-top:4px">' + bytes.length + ' 字节 · 扩展头 '
      + (exts.length ? exts.map((e) => '0x' + e.type.toString(16).padStart(2, '0')).join(' → ') + ' → 0x00' : '无') + '</div>'
      + gtpuWarnHtml(warns);
    $('gtpuCopy').addEventListener('click', function () { fallbackCopy(hex, function () {}); });
  } catch (e) {
    out.innerHTML = '<div class="finding warn" style="cursor:default"><span class="dot warn"></span><p style="margin:0">' + esc(e.message) + '</p></div>';
  }
}
function gtpuDecUi() {
  const out = $('gtpuDecOut');
  try {
    const bytes = gtpuHexToBytes($('gtpuHexIn').value);
    const r = gtpuParse(bytes);
    const rows = [];
    rows.push('<div class="tnode"><span class="k">GTP-U</span> <span class="v">v' + r.hdr.ver + ' PT=' + r.hdr.pt + ' E=' + r.hdr.e + ' S=' + r.hdr.s + ' PN=' + r.hdr.pn + '</span> <span class="ty">type 0x' + r.hdr.type.toString(16) + ' len ' + r.hdr.length + ' teid 0x' + r.hdr.teid.toString(16).padStart(8, '0') + '</span></div>');
    if (r.hdr.seq != null) rows.push('<div class="tnode"><span class="k">seq</span> <span class="v">' + r.hdr.seq + '</span> <span class="k">npdu</span> <span class="v">' + r.hdr.npdu + '</span> <span class="k">nextExt</span> <span class="v">0x' + r.hdr.nextExt.toString(16).padStart(2, '0') + '</span></div>');
    for (const e of r.exts) {
      rows.push('<div class="tnode"><span class="k">ext 0x' + e.type.toString(16).padStart(2, '0') + '</span> <span class="v">' + esc(GTPU_EXT_TYPES[e.type] || 'Unknown') + '</span> <span class="ty">len ' + e.length + ' content ' + gtpuBytesToHex(e.content) + ' next 0x' + e.next.toString(16).padStart(2, '0') + '</span></div>');
      if (e.type === 0x85) {
        try {
          const psc = parsePduSessionInfo(e.content);
          rows.push('<div class="tkids"><div class="tnode"><span class="k">PSC ' + psc.dir.toUpperCase() + '</span> <span class="v">' + esc(gtpuKvLine(psc, ['pduType', 'dir', 'warnings', 'futureRaw'])) + '</span></div>'
            + (psc.futureRaw ? '<div class="tnode"><span class="k">futureRaw</span> <span class="v">' + gtpuBytesToHex(psc.futureRaw) + '</span></div>' : '')
            + (psc.warnings || []).map((w) => '<div class="tnode"><span class="ty">⚠ ' + esc(w) + '</span></div>').join('') + '</div>');
        } catch (err) { rows.push('<div class="tkids"><div class="tnode"><span class="ty">PSC 反解失败: ' + esc(err.message) + '</span></div></div>'); }
      }
      if (e.type === 0x04) {
        try {
          const ps = parsePduSetInfo(e.content);
          rows.push('<div class="tkids"><div class="tnode"><span class="k">PSET</span> <span class="v">' + esc(gtpuKvLine(ps, ['pduType', 'warnings', 'futureRaw'])) + '</span></div>'
            + (ps.futureRaw ? '<div class="tnode"><span class="k">futureRaw</span> <span class="v">' + gtpuBytesToHex(ps.futureRaw) + '</span></div>' : '')
            + (ps.warnings || []).map((w) => '<div class="tnode"><span class="ty">⚠ ' + esc(w) + '</span></div>').join('') + '</div>');
        } catch (err) { rows.push('<div class="tkids"><div class="tnode"><span class="ty">PSET 反解失败: ' + esc(err.message) + '</span></div></div>'); }
      }
    }
    rows.push('<div class="tnode"><span class="k">payload</span> <span class="v">' + r.payload.length + 'B</span> <span class="ty">' + gtpuBytesToHex(r.payload).slice(0, 64) + (r.payload.length > 32 ? '…' : '') + '</span></div>');
    for (const w of r.warnings || []) rows.push('<div class="tnode"><span class="ty">⚠ ' + esc(w) + '</span></div>');
    out.innerHTML = '<div class="tree">' + rows.join('') + '</div>';
  } catch (e) {
    out.innerHTML = '<div class="finding warn" style="cursor:default"><span class="dot warn"></span><p style="margin:0">' + esc(e.message) + '</p></div>';
  }
}
