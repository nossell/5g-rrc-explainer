  is(k, v) { const t = this.peek(); return !!t && t.k === k && (v === undefined || t.v === v); }
  isBarToken() {
    const t = this.peek();
    if (!t) return false;
    if (t.k === 'bar') return true;
    if (t.k === 'word' && /^(I|or)$/i.test(t.v)) return true; // 字体伪影
    return false;
  }
  isBarTokenAt(o) {
    const t = this.peek(o);
    if (!t) return false;
    if (t.k === 'bar') return true;
    if (t.k === 'word' && /^(I|or)$/i.test(t.v)) return true;
    return false;
  }
  ctx(n = 9) {
    return this.toks.slice(Math.max(0, this.i - 3), this.i + n).map((x) => x.v ?? x.k).join(' ');
  }

  // 单元（cell）解析：若干定义 + 散排散文降级
  parseUnit() {
    const defs = [];
    const notes = [];
    while (this.i < this.toks.length) {
      if (this.is('lt') && this.looksLikeDef()) {
        const save = this.i;
        try {
          defs.push(this.parseDef());
          if (this.i === save) this.i++; // 防御：空推进
          continue;
        } catch (e) {
          this.i = save;
          notes.push('定义解析失败: ' + e.message);
          this.skipToNextDef();
          if (this.i <= save) this.i = save + 1; // 保证推进，防死循环
          continue;
        }
      }
      this.next();
    }
    return { defs, notes };
  }
  skipToNextDef() {
    while (this.i < this.toks.length) {
      if (this.is('lt') && this.looksLikeDef()) return;
      this.next();
    }
  }
  looksLikeDef() {
    for (let o = 0; o < 12 && this.i + o < this.toks.length; o++) {
      const t = this.toks[this.i + o];
      if (t.k === 'def') return true;
      if (['lt', 'gt', 'word', 'n01', 'colon', 'lp', 'rp'].includes(t.k)) continue;
      return false;
    }
    return false;
  }

  parseDef() {
    if (!this.is('lt')) throw new Error('定义须以 < 开头');
    const a = this.parseAngle();
    if (this.is('colon')) this.next(); // '> : :=' 笔误变体：冒号在尖括号外
    if (!this.is('def')) throw new Error(`定义 ${a.name} 缺 ::=`);
    this.next();
    // 缺 '{' 容差：游离 '}'（规范丢左括号，SI2ter 3G MP struct 实测）后接新选择 → seq-of-choices
    const parts = [this.parseAltList('top')];
    for (;;) {
      if (this.is('semi') || !this.peek()) break;
      if (this.is('rb')) { this.next(); continue; }
      if (this.is('lt') && this.looksLikeDef()) break;
      parts.push(this.parseAltList('top'));
    }
    this.eatTerminator();
    const body = parts.length === 1 ? parts[0] : { t: 'seq', items: parts };
    return { name: csn1NormName(a.name), raw: a.name, kind: a.kind, body };
  }
  eatTerminator() {
    if (this.is('semi')) this.next(); // 分号可省略（'} // ;' 实测）
  }

  // <…> 内部 → { name, kind:'ref'|'labeled', descParts?, trailing? }
  parseAngle() {
    if (!this.is('lt')) throw new Error('期望 <');
    this.next();
    let depth = 1;
    let braceDepth = 0;
    const parts = [];
    while (this.i < this.toks.length) {
      const t = this.peek();
      if (t.k === 'lt') { depth++; parts.push(t); this.next(); continue; }
      if (t.k === 'gt') {
        depth--;
        if (depth === 0) { this.next(); break; }
        parts.push(t);
        this.next();
        continue;
      }
      // 规范笔误容差：'}' 出现在未闭合角度内 → 视作提前闭合（不消费）
      // （'< Timing Advance : bit (6) }' 实测）；但角内花括号组的 '}' 除外——
      // 按 lb 深度判归属（'<X : { 1 < ref > } ** 0>' 内联重复实测）；
      // ';' 当标签分隔（'< EC Page Extension ; bit (4) >' 实测，花括号内同理不触发）
      if (t.k === 'lb') { braceDepth++; parts.push(t); this.next(); continue; }
      if (t.k === 'rb') {
        if (braceDepth > 0) { braceDepth--; parts.push(t); this.next(); continue; }
        break;
      }
      if (braceDepth === 0 && t.k === 'semi') break;
      if (depth > 1 && t.k === 'def') break; // '>> ::= ' 缺闭合级联：内角未闭遇 ::= → 提前闭合
      parts.push(t);
      this.next();
    }
    // 顶层 ':' 或 '::='（< Priority1 ::= Priority > 实测变体）作标签分隔
    let colon = -1;
    let d2 = 0;
    for (let x = 0; x < parts.length; x++) {
      if (parts[x].k === 'lt') d2++;
      else if (parts[x].k === 'gt') d2--;
      else if (d2 === 0 && (parts[x].k === 'def' || parts[x].k === 'colon' || parts[x].k === 'semi')) { colon = x; break; }
    }
    if (colon < 0) {
      // trailing 取原始 parts 切片（含括号）——fieldFromWords 的 'bit (n)' 正则依赖字面括号
      // 两级候选：① 名字头非空的尾部描述（'<TLLI / G-RNTI bit (32)>' 实测）；
      // ② 内联类型（'< relative_position: < bit (1 + val(modulus)) >>' 实测，体=类型描述，
      //    须能解析为字段才接受——'<spare padding>' 的 'spare' 是名字本体，由此排除）
      for (const start of [1, 0]) {
        for (let x = start; x < parts.length; x++) {
          if (parts[x].k === 'word' && /^(bit|string|octet|spare)$/i.test(parts[x].v)) {
            const cand = parts.slice(x);
            const head = parts.slice(0, x).filter((p) => p.k === 'word' || p.k === 'n01').map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
            if (!head) {
              if (start === 0 && this.fieldFromWords('inline', cand)) {
                return { name: 'inline', kind: 'ref', trailing: cand };
              }
              continue;
            }
            return { name: head, kind: 'ref', trailing: cand };
          }
        }
      }
      const name = parts.filter((p) => p.k === 'word' || p.k === 'n01').map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
      if (!name) throw new Error('空引用名');
      return { name, kind: 'ref', trailing: null };
    }
    const nameWords = parts.slice(0, colon).filter((p) => p.k === 'word' || p.k === 'n01');
    const name = nameWords.map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
    return { name, kind: 'labeled', descParts: parts.slice(colon + 1) };
  }

  // 选择列表：seq (bar seq)*；mode: 'top'（定义体）| 'brace'（{} 内）
  parseAltList(mode) {
    const alts = [this.parseSeq(mode)];
    while (this.isBarToken()) {
      this.next();
      alts.push(this.parseSeq(mode));
    }
    if (alts.length === 1) return alts[0];
    return { t: 'choice', alts };
  }

  parseSeq(mode) {
    const items = [];
    for (;;) {
      const t = this.peek();
      if (!t) break;
      if (t.k === 'semi' || t.k === 'rb') break;
      if (this.isBarToken()) break;
      if (mode === 'top' && (t.k === 'def' || (t.k === 'lt' && this.looksLikeDef()))) break; // 无分号定义衔接
      items.push(this.parseItem());
      this.parseSuffix(items);
      if (this.is('eq')) { // 'bit ** = <no string>' 语义注解（= 后随角度整体丢弃）
        this.next();
        if (this.is('lt')) { this.parseAngle(); }
      }
      this.relabelColon(items); // '<FDD_ARFCN> : bit(14)' 冒号在外变体
    }
    if (items.length === 0) return { t: 'null' };
    if (items.length === 1) return items[0];
    return { t: 'seq', items };
  }

  // 重复后缀（A2）：**(expr) / ** 0 空终止 / *(expr) / * term 短记法 / (n) 定长
  parseSuffix(items) {
    for (;;) {
      if (this.is('star2') || this.is('star')) {
        const tk = this.next();
        let count;
        if (this.is('lp')) {
          this.next();
          const e = this.parseExpr();
          if (!this.is('rp')) throw new Error('重复表达式缺 )');
          this.next();
          count = { k: 'expr', e };
        } else if (tk.k === 'star2' && this.is('n01')) {
          count = { k: 'nullterm', tag: this.next().v }; // ** 0：读到位标记即停
        } else if (this.is('word') && !this.isBarToken()) {
          count = { k: 'expr', e: this.parseExprTerm() }; // * val(X) 单项短记法
        } else if (this.is('n01')) {
          count = { k: 'expr', e: this.parseExprTerm() };
        } else {
          count = { k: 'star' };
        }
        items.push({ t: 'rep', body: items.pop(), count });
        continue;
      }
      if (this.is('lp')) {
        const save = this.i;
        this.next();
        if (this.is('star')) { // '( *)' 无界（A2 星号指数）
          this.next();
          if (this.is('rp')) this.next();
          items.push({ t: 'rep', body: items.pop(), count: { k: 'star' } });
          continue;
        }
        try {
          const e = this.parseExpr();
          if (!this.is('rp')) throw 0;
          this.next();
          items.push({ t: 'rep', body: items.pop(), count: { k: 'expr', e } });
          continue;
        } catch {
          this.i = save;
        }
      }
      break;
    }
  }

  // 冒号在外变体：ref 项后跟 ':' + 描述 → 改写为 labeled 字段
  relabelColon(items) {
    if (!this.is('colon') || !items.length) return;
    const prev = items[items.length - 1];
    if (prev.t !== 'ref') { this.next(); return; } // 游离冒号丢弃
    this.next();
    const desc = [];
    while (this.peek() && !CSN1_DELIM.has(this.peek().k) && !this.isBarToken()) desc.push(this.next());
    items[items.length - 1] = this.labeledNode(prev.raw || prev.name, desc);
  }

  parseItem() {
    const t = this.peek();
    if (!t) throw new Error('意外结尾');
    if (t.k === 'lb') return this.parseBrace();
    if (t.k === 'gt') { this.next(); return { t: 'null' }; } // 游离 '>'（'<X : ref>>' 双闭合实测）
    if (t.k === 'lt') return this.parseAngleItem();
    if (t.k === 'n01') { this.next(); return { t: 'fixed', bits: t.v }; }
    if (t.k === 'word') {
      const v = t.v;
      if (/^L$/i.test(v)) { this.next(); return { t: 'fixed', bits: 'L' }; }
      if (/^H$/i.test(v)) { this.next(); return { t: 'fixed', bits: 'H' }; }
      if (/^[LH]+$/i.test(v)) { // LL/LH 粘词（IA '{ LL <' 实测）→ 单位串
        this.next();
        return { t: 'seq', items: [...v.toUpperCase()].map((ch) => ({ t: 'fixed', bits: ch })) };
      }
      if (/^null$/i.test(v)) { this.next(); return { t: 'null' }; }
      if (/^bit$/i.test(v)) { this.next(); return { t: 'bits', name: 'bit', n: 1 }; } // B.1.3 裸 bit
      if (/^(I|or)$/i.test(v)) { this.next(); return { t: 'null' }; } // 伪影兜底
      if (/^-$/.test(v)) { this.next(); return { t: 'null' }; } // 游离 '-' 噪声（散文残段）
      // 缺尖括号字段容错：本词起 K token 内有冒号（中间只许 word/bits）→ 词到冒号为名
      // （'BSIC : bit (6)' / 'E-UTRAN Measurement Parameters Description : <…>' EC 实测）
      for (let o = 1; o <= 8; o++) {
        const nt = this.peek(o);
        if (!nt || CSN1_DELIM.has(nt.k) || this.isBarTokenAt(o)) break;
        if (nt.k === 'colon') {
          this.next();
          while (!this.is('colon')) this.next();
          this.next();
          const desc = [];
          while (this.peek() && !CSN1_DELIM.has(this.peek().k) && !this.isBarToken()) desc.push(this.next());
          return this.labeledNode(v, desc);
        }
        if (!['word', 'n01'].includes(nt.k)) break;
      }
      throw new Error(`意外词元 ${v} 上下文: ${this.ctx()}`);
    }
    throw new Error(`意外词元 ${t.k} 上下文: ${this.ctx()}`);
  }

  parseBrace() {
    this.next(); // {
    const body = this.parseAltList('brace');
    if (!this.is('rb')) throw new Error(`选择缺 } 上下文: ${this.ctx()}`);
    this.next();
    return body;
  }

  parseAngleItem() {
    const a = this.parseAngle();
    if (a.kind === 'labeled') return this.labeledNode(a.name, a.descParts);
    if (a.trailing && a.trailing.length) {
      const node = this.fieldFromWords(a.name, a.trailing);
      if (node) return node;
    }
    const rk = csn1NormKey(a.name);
    if (rk === 'sparepadding') return { t: 'pad' };
    if (rk === 'sparebit') return { t: 'spare', n: 1 };
    if (rk === 'sparehalfoctet') return { t: 'spare', n: 4 };
    this.onRef(a.name);
    return { t: 'ref', name: csn1NormName(a.name), raw: a.name };
  }

  labeledNode(name, descParts) {
    if (!descParts.length) {
      const rk = csn1NormKey(name);
      if (rk === 'sparepadding') return { t: 'pad' };
      if (rk === 'sparebit') return { t: 'spare', n: 1 };
      this.onRef(name);
      return { t: 'ref', name: csn1NormName(name), raw: name };
    }
    const flat = descParts.map((p) => (p.k === 'eq' ? '==' : p.k === 'colon' ? ':' : p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.k === 'lb' ? '{' : p.k === 'rb' ? '}' : p.k === 'bar' ? '|' : p.v ?? p.k)).join(' ');
    let m = /^bit\s*==\s*(L|H)$/i.exec(flat);
    if (m) return { t: 'eqbit', name, eq: m[1].toUpperCase() === 'L' ? 'L' : 'H' };
    if (descParts.length === 1 && descParts[0].k === 'n01' && /^[01]+$/.test(descParts[0].v)) {
      return { t: 'valtag', name, values: [descParts[0].v] };
    }
    if (descParts[0].k === 'lb') {
      const vals = this.parseValueGroup(descParts);
      // 纯值组：全部 token 都是终端位串/L/H 与分隔（'<Multiband supported : { 101 | 110 }>' 实测）
      const pureGroup = descParts.every((p) => ['lb', 'rb', 'bar', 'n01'].includes(p.k)
        || (p.k === 'word' && /^[LH]$/i.test(p.v)));
      if (vals.length && pureGroup) return { t: 'valtag', name, values: vals };
      // 排除值组：'< NO_NCELL_M : { bit (3) := 111 } >'（':=' 为规范 '≠' 的 docx 伪影）
      {
        const w = descParts.map((p) => (p.k === 'def' ? ':=' : p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.v ?? p.k)).join(' ');
        const mx = /^\{\s*(?:bit(?:\s*string)?|spare\s*bit)\s*\(\s*(\d+)\s*\)\s*:=\s*([01]+)\s*\}$/i.exec(w);
        if (mx) return { t: 'bits', name, n: parseInt(mx[1], 10), exclude: mx[2] };
      }
      // 内联重复表达式：'<X : { 1 < ref struct > } ** 0>'（SI2n/14/15 实测）——按完整文法解析
      try {
        const sub = new Csn1Parser(descParts);
        const body = sub.parseSeq('brace');
        if (body && body.t !== 'null') return { t: 'typed', name, body };
      } catch { /* 落到后续兜底 */ }
    }
    if (descParts.length >= 2 && descParts[0].k === 'lt') {
      try {
        const sub = new Csn1Parser(descParts);
        const a = sub.parseAngle();
        // 内联类型形态 '<X: < bit (1 + val(modulus)) >>'——体是类型描述而非引用
        if (a.trailing && a.trailing.length) {
          const f = this.fieldFromWords(a.name, a.trailing);
          if (f) return { t: 'typed', name, body: f };
        }
        return this.typedRefNode(name, a);
      } catch { /* 落到类型描述 */ }
    }
    const f = this.fieldFromWords(name, descParts);
    if (f) return f;
    // 描述内嵌散文/散角：首段（到首个顶层 <）若可作字段则取之（'< Ignore : bit <no string>' 类实测）
    const cut = descParts.findIndex((p) => p.k === 'lt');
    if (cut > 0) {
      const f2 = this.fieldFromWords(name, descParts.slice(0, cut));
      if (f2) return f2;
    }
    const words = descParts.filter((p) => p.k === 'word' || p.k === 'n01');
    if (words.length && words.length === descParts.length) {
      const refName = words.map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
      if (!/^(bit|string|octet|spare)/i.test(refName)) return this.typedRefNode(name, { name: refName });
    }
    throw new Error(`标签 ${name} 描述不可解析: ${flat.slice(0, 60)}`);
  }

  // { … } 值组：bits 串与 L/H 终端的并集（'<X : { 101 | 110 }>' / '<X : {L | H}>' 实测）
  parseValueGroup(descParts) {
    const sub = new Csn1Parser(descParts);
    sub.next(); // {
    const vals = [];
    for (;;) {
      const t = sub.peek();
      if (!t) break;
      if (t.k === 'n01') { vals.push(sub.next().v); continue; }
      if (t.k === 'word' && /^[LH]$/i.test(t.v)) { vals.push(sub.next().v.toUpperCase()); continue; }
      if (sub.isBarToken()) { sub.next(); continue; }
      if (t.k === 'rb') { sub.next(); break; }
      sub.next();
    }
    return vals;
  }

  typedRefNode(name, angle) {
    if (csn1NormKey(angle.name) === 'bitstring') return { t: 'bitstring', name };
    this.onRef(angle.name);
    return { t: 'typed', name, body: { t: 'ref', name: csn1NormName(angle.name), raw: angle.name } };
  }

  // 类型描述词组 → 字段节点
  fieldFromWords(name, toks) {
    const words = toks.map((p) => (p.k === 'eq' ? '==' : p.k === 'star2' ? '**' : p.k === 'star' ? '*' : p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.v ?? p.k)).join(' ');
    let m = /^(?:bit\s*string|bit)\s*\((.+)\)\s*$/i.exec(words);
    if (m) return { t: 'bits', name, n: this.exprOrNum(m[1]) };
    m = /^bit\s*\(\s*(\d+)\s*\)\s*==\s*([01]+)\s*$/i.exec(words) || /^(?:bit\s*string|bit)\s*==\s*([01]+)\s*$/i.exec(words);
    if (m) return { t: 'valtag', name, values: [m[2]] }; // 值约束位字段（'<modulus : bit (4) == 0000>' 实测）
    m = /^bit\s*\(\s*(\d+)\s*\)\s*exclude\s*([01]+)\s*$/i.exec(words) || /^(?:bit\s*string|bit)\s*exclude\s*([01]+)\s*$/i.exec(words);
    if (m) return { t: 'bits', name, n: parseInt(m[1], 10) || m[2].length, exclude: m[2] }; // 值排除约束（SI9 modulus 实测）
    m = /^bit\s*(\d+)\s*\)\s*$/i.exec(words);
    if (m) return { t: 'bits', name, n: parseInt(m[1], 10) }; // 'bit6 )' 括号丢失实测
    if (/^bit$/i.test(words)) return { t: 'bits', name, n: 1 };
    if (/^bit\s*\*\*?$/i.test(words)) return { t: 'bitstring', name }; // bit** 无界（A2）
    m = /^octet\s*\((.+)\)\s*$/i.exec(words);
    if (m) return { t: 'octets', name, n: this.exprOrNum(m[1]) };
    m = /^spare\s*bit\s*\((.+)\)\s*$/i.exec(words);
    if (m) return { t: 'spare', n: this.exprOrNum(m[1]) };
    if (/^spare\s*bits?$/i.test(words)) return { t: 'pad' };
    return null;
  }
  exprOrNum(s) {
    const t = String(s).trim();
    if (/^\d+$/.test(t)) return { k: 'num', v: parseInt(t, 10) };
    const p = new Csn1Parser(csn1Tokenize(t));
    return { k: 'expr', e: p.parseExpr() };
  }

  // 算术表达式（A2）：数字 / val(Name) / Name / + - * / 与括号
  parseExpr() {
    let left = this.parseExprTerm();
    for (;;) {
      const t = this.peek();
      if (t && t.k === 'word' && /^[+\-*/]$/.test(t.v)) {
        this.next();
        left = { t: 'bin', op: t.v, a: left, b: this.parseExprTerm() };
        continue;
      }
      if (t && t.k === 'star') {
        this.next();
        left = { t: 'bin', op: '*', a: left, b: this.parseExprTerm() };
        continue;
      }
      break;
    }
    return left;
  }
  parseExprTerm() {
    const t = this.peek();
    if (!t) throw new Error('表达式意外结尾');
    if ((t.k === 'n01' || t.k === 'word') && /^\d+$/.test(t.v)) { this.next(); return { t: 'num', v: parseInt(t.v, 10) }; }
    if (t.k === 'lp') {
      this.next();
      const e = this.parseExpr();
      if (!this.is('rp')) throw new Error('表达式缺 )');
      this.next();
      return e;
    }
    if (t.k === 'word') {
      this.next();
      const w = t.v;
      if (/^val$/i.test(w) && this.is('lp')) {
        this.next();
        const nameParts = [];
        while (this.peek() && !this.is('rp') && !this.is('rb')) { nameParts.push(this.next().v); }
        if (this.is('rp')) this.next(); // 缺右括号容差（不越花括号）
        return { t: 'val', name: csn1NormName(nameParts.join(' ')) };
      }
      return { t: 'val', name: csn1NormName(w) };
    }
    throw new Error('表达式不可解析: ' + t.k);
  }
}

// ---------- 顶层 ----------
// parseGrammar(cellText) → { defs:[{name,raw,body}], notes:[], refs:[...] }
function parseGrammar(cellText) {
  const refs = new Set();
  const p = new Csn1Parser(csn1Tokenize(cellText), { onRef: (n) => refs.add(csn1NormName(n)) });
  const { defs, notes } = p.parseUnit();
  return { defs, notes, refs: [...refs] };
}

// ==== src/nas/codec.js ====
// src/nas/codec.js — M4：NAS 消息级编解码（schema 驱动，行序扫描）。
//
// schema 形如 tools/nasdef.mjs 产物：messages[名称] = 实例数组（行表）+ ies 布局库。
// 编解码规则（TS 24.007 §11 + 24.501/24.301 消息表）：
//   - 消息 = EPD 八位组 + 安全头八位组 + 按表序的 IE 行；
//   - 行格式判定：iei 列 1 位十六进制+ '-' → 半八位组 IEI（T=type2/TV=type1）；
//     2 位 → 全八位组 IEI（TV=type3/TLV=type4）；'V' = 无 IEI（定长由 len 列）；
//     TLV-E/LV-E = type6（16 bit 长度）；len '1/2' = 半八位组行（两行配一字节，高半在前）；
//   - 可选/条件行（presence O/C/CH…）缺省即跳过；M 行缺失报错；
//   - 解码到表尾仍有余字节 → 报错（未知 IE / 版本不匹配的信号）。

// 行格式归类（机械规则，见模块注释）
function rowFormat(r) {
  const iei = (r.iei || '').replace(/[^0-9a-f]/gi, '');
  const fmt = (r.format || '').trim().toUpperCase();
  const len = (r.len || '').trim();
  if (fmt === 'V') return len.startsWith('1/2') ? 'VH' : 'V'; // VH = 半八位组 V（'1/2' 或复合 '1/2- 3/2'——SM TI 行 24.008 §9.5 写法）
  if (fmt === 'T') return 'T'; // type 2：仅 IEI
  if (fmt === 'TV') return iei.length === 1 ? 'TV1' : 'TV'; // type1 / type3
  if (fmt === 'TLV') return 'TLV';
  if (fmt === 'LV') return 'LV';
  if (fmt === 'TLV-E') return 'TLV-E';
  if (fmt === 'LV-E') return 'LV-E';
  // 23.040 TPDU 专用（buildSchema23040 生成）：ADDR = 自描述地址（[长度(半八位组)][TOA][数字]），
  // VP = TP-VP（长度由 octet1 的 TP-VPF 位定：0/1/7 八位组）
  if (fmt === 'ADDR') return 'ADDR';
  if (fmt === 'VP') return 'VP';
  // 'FFS'（早期 Rel-8 占位）/ 其他未知写法 → UNK（不可编解码，解码时跳过）
  return 'UNK';
}

// len 列 → 固定字节数；'1/2' → 0.5（半八位组）；区间/可变（'3-n' 等）→ null
function fixedLen(lenStr) {
  const s = (lenStr || '').trim();
  if (!s) return null;
  if (s === '1/2') return 0.5;
  if (!/^\d+$/.test(s)) return null;
  return parseInt(s, 10);
}

const isMandatory = (p) => /^(M|C(H|L|H)?)$/i.test((p || '').trim()) ? !/^C/i.test(p.trim()) : false;
// M → 必须；C* → 条件（编码时给了值才出现；解码时可有可无）；O* → 可选
function rowPresence(p) {
  const s = (p || '').trim();
  if (/^M$/i.test(s)) return 'M';
  if (/^C/i.test(s)) return 'C';
  return 'O';
}

// IEI 列 → 数值；不可解析 → null（该行不可编解码）。合法单元格：'' / '5B-' / 'B-' 这类
// 1-2 位十六进制（可带尾短横）；'8x'/'Cx'/'Ax' 半八位组 IEI 通配（44.018 §10.5 type1 TV
// 写法，低半是取值域——CHANNEL RELEASE 实证）取高半；'TBD' / 'FFS'（早期 Rel-8 占位）/
// '72C'（规范笔误）都拒绝。
function rowIei(r) {
  const s = (r.iei || '').trim().replace(/-$/, '').trim();
  const xw = /^([0-9a-fA-F])x$/i.exec(s);
  if (xw) return parseInt(xw[1], 16);
  if (!/^[0-9a-fA-F]{1,2}$/.test(s)) return null;
  const v = parseInt(s, 16);
  return isNaN(v) ? null : v;
}

const EPD = { 24501: 0x7e, 24301: null }; // 24301：半八位组 PD，按消息族取值（见 nasPD）

// 24.301 半八位组 protocol discriminator：EMM 消息=7、ESM 消息=5（按规范 §8.2/§8.3 节前缀）；
// 24.008：建库时按 §9.x 族写入 inst.pd（RR=6/MM=5/CC=3/GMM=8/SM=9）；
// 44.018（RR=6）/24.080（SS=11）：同样建库写入。24080 的 inst.pd 覆盖 8.3 前缀猜测——
// 24080 消息节是 2.x，会误判 7，故 inst.pd 必须先命中。
function nasPD(inst) {
  if (inst.pd != null) return inst.pd;
  return /^8\.3/.test(inst.section || '') ? 5 : 7;
}
// 半八位组行名是否为 protocol discriminator（24.301 表头行）
const isPDRow = (name) => /^protocol discriminator$/.test(name);
// 哪些 spec 的半八位组行做 PD 语义校验（值固定，错位即暴露——防 run 位序反转的自洽盲区）
const VH_PD_SPECS = new Set(['24301', '24008', '44018', '24080', '24011']);

// 半八位组 run 位序计划（TS 24.007 §11.2.1：连续半八位组 IE 序列中，先出现者占
// bits 1-4（低半），第二个占 bits 5-8，交替；内容表行序 = 出现序，规范 §8.1 b)）。
// 无任何例外——24.501 头对 [SHT, spare] 表序 SHT 先 → SHT 低半（pycrate oracle
// SHT=1 帧 = 7e01…、SHT=2 → octet2=0x02 实证）；24.301 头对 [PD, SHT] → PD 低半（0x17 帧）。
// runRows: [{ r, idx }]（连续 VH 行）。返回 { positions: [{ rowIdx, row, oct, half }], runBytes }。
function planVhRun(runRows) {
  let oct = 0;
  let half = 'low'; // 交替游标
  let maxOct = 0;
  const positions = [];
  for (const { r, idx } of runRows) {
    positions.push({ rowIdx: idx, row: r, oct, half });
    maxOct = Math.max(maxOct, oct);
    if (half === 'low') half = 'high';
    else { oct += 1; half = 'low'; }
  }
  return { positions, runBytes: maxOct + 1 };
}

// ---- 解码 ----------------------------------------------------------------------
// bytes: Uint8Array；inst: 消息实例（schema.messages[name][k]）；spec: '24501'|'24301'
// 返回 { parts: [{ row, rowIdx, value }], consumed, warnings }；value：V/VH=字节数/半八位组数值，
// TV/TLV/LV/E 类=值部分字节，T=null。message identity 行校验 msgType。
// warnings：宽容处理的提示串（可选行 IEI 命中但长度越界按缺席等），空数组 = 无。
// 条件/可选的非 IEI 定长 V 行（presence C/O）线缆级不可探测——按包含数递增枚举组合
// （cap 2^6），首个整流成功的组合为准（最小包含优先）。
function decMsg(inst, bytes, spec = '24501') {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  // GTPv2-C（29.274）：头与 IE 框架不同（TLIV/Instance），派发专用实现（src/nas/gtpc.js）
  if (spec === '29274') return decGtpcMsg(inst, u8);
  // 歧义行：非头部的 C/O 定长 V 行
  const amb = [];
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const name = (r.name || '').toLowerCase();
    if (rowFormat(r) !== 'V') continue;
    if (/extended protocol discriminator|security header type|message (identity|type)/.test(name)) continue;
    if (fixedLen(r.len) == null) continue; // 可变 V 走剩余全吞，无歧义
    if (rowPresence(r.presence) !== 'M') amb.push(ri);
  }
  const k = Math.min(amb.length, 6);
  let lastErr = null;
  for (let mask = 0; mask < (1 << k); mask++) {
    const force = new Set();
    for (let b = 0; b < k; b++) if (mask & (1 << b)) force.add(amb[b]);
    const notes = [];
    try {
      const r = decOnce(inst, u8, spec, force, notes);
      return { ...r, warnings: notes };
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('解码失败');
}

function decOnce(inst, u8, spec, force, notes = []) {
  let off = 0;
  const parts = [];
  const epd = EPD[spec];
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const f = rowFormat(r);
    const name = (r.name || '').toLowerCase();
    const pres = rowPresence(r.presence);
    // 消息头三件：EPD / 安全头 / 消息类型（表内 V 行，特判）
    if (f === 'V' && /extended protocol discriminator/.test(name)) {
      if (off >= u8.length) { if (pres === 'M') throw new Error('消息截断（EPD）'); break; }
      const b = u8[off++];
      if (epd && b !== epd) throw new Error(`EPD 不匹配: 0x${b.toString(16)} ≠ 0x${epd.toString(16)}`);
      parts.push({ row: r, rowIdx: ri, value: Uint8Array.of(b) });
      continue;
    }
    if (f === 'V' && /security header type/.test(name)) {
      if (off >= u8.length) { if (pres === 'M') throw new Error('消息截断（SHT）'); break; }
      parts.push({ row: r, rowIdx: ri, value: Uint8Array.of(u8[off++]) });
      continue;
    }
    if (f === 'V' && /message (identity|type)/.test(name)) {
      if (off >= u8.length) { if (pres === 'M') throw new Error('消息截断（消息类型）'); break; }
      const b = u8[off++];
      // 24.008 类型表含通配位（TI/序号），按掩码比较；24.501/24.01 精确比较
      if (inst.msgType != null && (inst.msgMask != null ? (b & inst.msgMask) !== (inst.msgType & inst.msgMask) : b !== inst.msgType)) {
        throw new Error(`消息类型不匹配: 0x${b.toString(16)} ≠ 0x${inst.msgType.toString(16)}`);
      }
      parts.push({ row: r, rowIdx: ri, value: Uint8Array.of(b) });
      continue;
    }
    if (f === 'VH') {
      // 半八位组 run：整段按 planVhRun 位序一起处理（TS 24.007 §11.2.1 先出现占低半）
      let j = ri;
      while (j < inst.rows.length && rowFormat(inst.rows[j]) === 'VH') j++;
      const runRows = inst.rows.slice(ri, j).map((rr, k) => ({ r: rr, idx: ri + k }));
      const { positions, runBytes } = planVhRun(runRows);
      if (off + runBytes > u8.length) throw new Error('消息截断（半八位组行）');
      for (const p of positions) {
        const pname = (p.row.name || '').toLowerCase();
        const byte = u8[off + p.oct];
        const n = p.half === 'high' ? byte >> 4 : byte & 0x0f;
        if (VH_PD_SPECS.has(spec) && isPDRow(pname) && n !== nasPD(inst)) {
          throw new Error(`PD 不匹配: ${n} ≠ ${nasPD(inst)}`);
        }
        parts.push({ row: p.row, rowIdx: p.rowIdx, value: /spare half octet/i.test(pname) ? null : n });
      }
      off += runBytes;
      ri = j - 1; // 外层 for ++ 后跳到 run 后
      continue;
    }
    const flen = fixedLen(r.len);
    if (f === 'V') {
      // 可变 V（len 含 n）：值 = 至消息尾（规范注记式 IE，如 EMM TRANSPORT 的 Data
      // container『encoded in all remaining octets』）。M 必吞；C/O 尾随自定位——
      // 有余字节即在并吞到结尾，无则缺席。
      if (flen == null) {
        if (pres === 'M' || off < u8.length) {
          parts.push({ row: r, rowIdx: ri, value: u8.slice(off) });
          off = u8.length;
        }
        continue;
      }
      // 定长 V：M 必配；C/O 非输出行不可探测，由外层枚举 force 决定
      if (pres !== 'M' && !force.has(ri)) continue;
      if (off + flen > u8.length) {
        if (pres === 'M') throw new Error(`消息截断（${r.name} 需要 ${flen} 字节）`);
        break;
      }
      parts.push({ row: r, rowIdx: ri, value: u8.slice(off, off + flen) });
      off += flen;
      continue;
    }
    if (f === 'T' || f === 'TV1' || f === 'TV' || f === 'TLV' || f === 'TLV-E') {
      // 有 IEI 的行：peek 匹配才消费；IEI 不可解析（规范 'TBD' 占位）→ 该行不可编解码，跳过
      const ieiVal = rowIei(r);
      if (ieiVal == null) continue;
      if (f === 'T') {
        if (off < u8.length && u8[off] === ieiVal) {
          parts.push({ row: r, rowIdx: ri, value: null });
          off += 1;
        } else if (pres === 'M') throw new Error(`必配 T 行缺失: ${r.name} (IEI 0x${ieiVal.toString(16)})`);
        continue;
      }
      if (f === 'TV1') {
        if (off < u8.length && (u8[off] >> 4) === ieiVal) {
          parts.push({ row: r, rowIdx: ri, value: u8[off] & 0x0f });
          off += 1;
        } else if (pres === 'M') throw new Error(`必配 TV1 行缺失: ${r.name}`);
        continue;
      }
      // TV/TLV/TLV-E：首字节 = IEI
      if (off < u8.length && u8[off] === ieiVal) {
        const fmt = f;
        if (fmt === 'TV') {
          const vlen = flen == null ? null : flen - 1; // len 列含 IEI 八位组
          if (vlen == null) {
            parts.push({ row: r, rowIdx: ri, value: u8.slice(off + 1) });
            off = u8.length;
          } else if (off + 1 + vlen > u8.length) {
            // 可选行 IEI 命中但字节不足 → 按缺席处理（后续行的数据，非本 IE）
            if (pres === 'M') throw new Error(`消息截断（TV ${r.name}）`);
            notes.push(`IEI 0x${ieiVal.toString(16)}（${r.name}）命中但余字节不足，按缺席处理`);
          } else {
            parts.push({ row: r, rowIdx: ri, value: u8.slice(off + 1, off + 1 + vlen) });
            off += 1 + vlen;
          }
        } else {
          // 可选 TLV 行长度越界（L > 余量）→ 按缺席处理：该字节属于后续行/尾段
          let sane = true;
          if (fmt === 'TLV') {
            if (off + 1 >= u8.length || off + 2 + u8[off + 1] > u8.length) sane = false;
          } else if (off + 2 >= u8.length || off + 3 + ((u8[off + 1] << 8) | u8[off + 2]) > u8.length) sane = false;
          if (!sane && pres !== 'M') {
            notes.push(`IEI 0x${ieiVal.toString(16)}（${r.name}）命中但长度越界，按缺席处理`);
            continue;
          }
          const { value, next } = decIE(fmt, ieiVal, u8, off);
          parts.push({ row: r, rowIdx: ri, value });
          off = next;
        }
      } else if (pres === 'M') throw new Error(`必配行缺失: ${r.name} (IEI 0x${ieiVal.toString(16)})`);
      continue;
    }
    if (f === 'ADDR') {
      // 23.040 TP-OA/TP-DA/TP-RA：[长度（有效半八位组数 0-12）][TOA][数字半八位组]
      if (off >= u8.length) {
        if (pres === 'M') throw new Error('消息截断（TP 地址）');
        break;
      }
      const total = 2 + Math.ceil(u8[off] / 2);
      if (off + total > u8.length) throw new Error('消息截断（TP 地址）');
      parts.push({ row: r, rowIdx: ri, value: u8.slice(off, off + total) });
      off += total;
      continue;
    }
    if (f === 'VP') {
      // 23.040 TP-VP：长度由 octet1 的 TP-VPF 位定（位5-4：00 无 / 10 相对 1 八位组 /
      // 01 增强 7 / 11 绝对 7）——u8[0] 恒为 TPDU 首字节（TP-MTI 行所在）
      const vpf = (u8[0] >> 3) & 0x03;
      const vlen = vpf === 0 ? 0 : vpf === 2 ? 1 : 7;
      if (vlen) {
        if (off + vlen > u8.length) throw new Error('消息截断（TP-VP）');
        parts.push({ row: r, rowIdx: ri, value: u8.slice(off, off + vlen) });
        off += vlen;
      }
      continue;
    }
    if (f === 'LV' || f === 'LV-E') {
      // 无 IEI 的长度前置行。M：必须消费；C/O：消息尾部的可选 LV 自定位——
      // 有余字节即在并消费（NAS 中可选非 IEI 行只出现在表尾），无则缺席。
      if (pres === 'M' || off < u8.length) {
        const { value, next } = decIE(f, null, u8, off);
        parts.push({ row: r, rowIdx: ri, value });
        off = next;
      }
      continue;
    }
    if (f === 'UNK') continue; // FFS 等占位行：不可解码
    throw new Error(`行 ${r.name}: 未知格式 ${f}`);
  }
  if (off !== u8.length) {
    throw new Error(`消息尾部余 ${u8.length - off} 字节（未知 IE 或 schema 版本不匹配）`);
  }
  return { parts, consumed: off };
}

// ---- 编码 ----------------------------------------------------------------------
// parts: [{ rowIdx, value }]（value 语义同 decMsg）；缺省 V 行取默认值（EPD/SHT=0，消息类型=msgType，
// spare 半八位组=0）；C/O 行仅当给出 part 才编码。返回 Uint8Array。
function encMsg(inst, parts = [], spec = '24501', gtpcHdr = undefined) {
  // GTPv2-C：头（TEID/Seq 非表内 IE）经第 4 参还原，缺省 T=1/TEID=0/Seq=0（采样/回环零值）
  if (spec === '29274') return encGtpcMsg(inst, parts, gtpcHdr);
  const byRow = new Map(parts.map((p) => [p.rowIdx, p.value]));
  const out = [];
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const f = rowFormat(r);
    const name = (r.name || '').toLowerCase();
    const has = byRow.has(ri);
    const val = byRow.get(ri);
    if (f === 'V' && /extended protocol discriminator/.test(name)) {
      out.push(has ? val[0] : (EPD[spec] || 0));
      continue;
    }
    if (f === 'V' && /security header type/.test(name)) {
      out.push(has ? val[0] : 0);
      continue;
    }
    if (f === 'V' && /message (identity|type)/.test(name)) {
      out.push(has ? val[0] : inst.msgType ?? 0);
      continue;
    }
    if (f === 'VH') {
      // 半八位组 run：整段按 planVhRun 位序一次写入（低半补位由 0 填充）
      let j = ri;
      while (j < inst.rows.length && rowFormat(inst.rows[j]) === 'VH') j++;
      const runRows = inst.rows.slice(ri, j).map((rr, k) => ({ r: rr, idx: ri + k }));
      const { positions, runBytes } = planVhRun(runRows);
      const buf = new Uint8Array(runBytes);
      for (const p of positions) {
        const pname = (p.row.name || '').toLowerCase();
        let v;
        if (VH_PD_SPECS.has(spec) && isPDRow(pname)) v = nasPD(inst);
        else if (/spare half octet/i.test(pname)) v = 0;
        else v = byRow.has(p.rowIdx) ? byRow.get(p.rowIdx) : 0;
        if (v == null || typeof v !== 'number') v = 0;
        buf[p.oct] |= p.half === 'high' ? (v & 0x0f) << 4 : v & 0x0f;
      }
      out.push(...buf);
      ri = j - 1;
      continue;
    }
    const pres = rowPresence(r.presence);
    if (f === 'V') {
      if (!has) {
        if (pres === 'M') throw new Error(`必配 V 行缺值: ${r.name}`);
        continue;
      }
      out.push(...val);
      continue;
    }
    if (f === 'T') {
      const ieiVal = rowIei(r);
      if (ieiVal == null || !has) { if (ieiVal != null && pres === 'M') throw new Error(`必配 T 行缺值: ${r.name}`); continue; }
      out.push(ieiVal);
      continue;
    }
    if (f === 'TV1') {
      const ieiVal = rowIei(r);
      if (ieiVal == null || !has) { if (ieiVal != null && pres === 'M') throw new Error(`必配 TV1 行缺值: ${r.name}`); continue; }
      out.push(encIE('TV1', ieiVal, val)[0]);
      continue;
    }
    if (f === 'ADDR' || f === 'VP') {
      // 23.040：值原样回写（ADDR 含长度/TOA；VP 按 VPF 定长的字节串）；VP 缺席 = VPF 为 0
      if (!has) {
        if (pres === 'M') throw new Error(`必配行缺值: ${r.name}`);
        continue;
      }
      out.push(...val);
      continue;
    }
    if (f === 'TV' || f === 'TLV' || f === 'TLV-E' || f === 'LV' || f === 'LV-E') {
      const ieiVal = rowIei(r);
      if (ieiVal == null && f !== 'LV' && f !== 'LV-E') {
        continue; // TBD IEI：不可编码
      }
      if (!has) { if (pres === 'M') throw new Error(`必配行缺值: ${r.name}`); continue; }
      out.push(...encIE(f, ieiVal, val));
      continue;
    }
    if (f === 'UNK') { if (pres === 'M') throw new Error(`必配行格式未知(FFS 存根): ${r.name}`); continue; }
    throw new Error(`行 ${r.name}: 未知格式 ${f}`);
  }
  return Uint8Array.from(out);
}

// ==== src/nas/values.js ====
// src/nas/values.js — M4：IE 位布局 → 值采样（字段级合法值）与字段打包。
//
// 布局 = parseBitTable 产物（schema.ies[section].layouts[n].octets）：
//   [{ octet:'3', count:1, open, compressed, fields:[{name,bits,hi,lo}] }]
// 采样规则：
//   - spare / '0' / 空名 → 0；其余字段按位宽均匀取值；
//   - count>1：按行布局重复 count 个 octet（值可各不相同）；
//   - open（'3-n' 开区间尾段）：采 1..3 个该行布局的 octet；
//   - framed=true（TV/TLV/LV 外框由 codec 提供）：剥离首部 '…IEI' 与 'Length of …' 行。
function layoutSample(octets, rng, framed = false) {
  const rows = [...octets];
  if (framed) {
    while (rows.length && isIeiRow(rows[0])) rows.shift();
    while (rows.length && isLenRow(rows[0])) rows.shift();
  }
  const fields = {};
  const bytes = [];
  for (const row of rows) {
    const n = row.compressed ? 1 : row.count || 1;
    const reps = row.open ? 1 + Math.floor(rng() * 3) : n;
    for (let k = 0; k < reps; k++) bytes.push(...packRow(row, fields, rng, k, reps));
  }
  return { bytes: Uint8Array.from(bytes), fields };
}

function isIeiRow(row) {
  return row.fields.length === 1 && row.fields[0].bits === 8 && / IEI$/i.test(row.fields[0].name);
}
function isLenRow(row) {
  return row.fields.length === 1 && row.fields[0].bits === 8 && /^length of /i.test(row.fields[0].name);
}

function packRow(row, fields, rng, rep, reps) {
  const out = [];
  let acc = 0;
  let bits = 0;
  for (const f of row.fields) {
    let v;
    if (/spare/i.test(f.name) || f.name === '0' || f.name === '') v = 0;
    else {
      v = Math.floor(rng() * (2 ** f.bits));
      const key = reps > 1 ? `${f.name}[${rep}]` : f.name;
      fields[key] = v;
    }
    acc = (acc << ((f.pre || 0) + f.bits)) | v;
    bits += (f.pre || 0) + f.bits;
  }
  // 行内字段按 hi→lo（MSB first）已依序拼装（pre = 前导空位补 0）；若行不满 8*count 位，
  // 低位补 0 由调用方保证
  const totalBits = row.half ? 4 : 8 * (row.compressed ? 1 : row.count || 1);
  const pad = Math.max(0, totalBits - bits);
  acc <<= pad;
  const nb = row.half ? 1 : totalBits / 8;
  for (let i = 0; i < nb; i++) out.push((acc >> (8 * (nb - 1 - i))) & 0xff);
  return out;
}

// 字段值 → 布局字节（UI 编辑/回编用）：fields 命名同 layoutSample。
function layoutPack(octets, fieldVals, framed = false) {
  const rows = [...octets];
  if (framed) {
    while (rows.length && isIeiRow(rows[0])) rows.shift();
    while (rows.length && isLenRow(rows[0])) rows.shift();
  }
  const bytes = [];
  for (let ri = 0; ri < rows.length; ri++) {
    const row = rows[ri];
    const n = row.compressed ? 1 : row.count || 1;
    for (let k = 0; k < n; k++) {
      let acc = 0;
      let bits = 0;
      for (const f of row.fields) {
        const key = n > 1 ? `${f.name}[${k}]` : f.name;
        const v = (fieldVals[key] ?? (isSpare(f) ? 0 : 0));
        acc = (acc << ((f.pre || 0) + f.bits)) | (v & ((1 << f.bits) - 1));
        bits += (f.pre || 0) + f.bits;
      }
      const totalBits = row.half ? 4 : 8 * (row.compressed ? 1 : row.count || 1);
      acc <<= Math.max(0, totalBits - bits);
      const nb = row.half ? 1 : totalBits / 8;
      for (let i = 0; i < nb; i++) bytes.push((acc >> (8 * (nb - 1 - i))) & 0xff);
    }
  }
  return Uint8Array.from(bytes);
}

function isSpare(f) {
  return /spare/i.test(f.name) || f.name === '0' || f.name === '';
}

// ---- 位布局反解（layoutPack/layoutSample 的逆） --------------------------------
// bytes → 命名字段值。framed=true 时先剥离首部 IEI 行与 Length 行（TV/TLV/LV 值域）。
// 半八位组布局（half 行）：VH/TV1 行的值是 nibble 数值（0-15）——直接按 4 位域解。
// 字节不足/剩余未知字节 → 抛错（调用方回退原始 hex 展示）。
function layoutUnpack(octets, bytes, framed = false) {
  const rows = [...octets];
  if (framed) {
    while (rows.length && isIeiRow(rows[0])) rows.shift();
    while (rows.length && isLenRow(rows[0])) rows.shift();
  }
  const fields = {};
  const warnings = [];
  if (typeof bytes === 'number') {
    let acc = bytes & 0x0f;
    let shift = 4;
    for (const row of rows) {
      if (!row.half) throw new Error('布局反解：数值输入仅适用于半八位组布局');
      for (const f of row.fields) {
        shift -= f.pre || 0;
        if (f.pre) {
          const pv = (acc >> shift) & ((1 << f.pre) - 1);
          if (pv) warnings.push(`${f.name} 前导空位应为 0，实为 ${pv}`);
        }
        shift -= f.bits;
        const v = (acc >> shift) & ((1 << f.bits) - 1);
        if (isSpare(f)) {
          if (v !== 0) warnings.push(`${f.name} 应为 spare 0，实为 ${v}`);
          continue;
        }
        fields[f.name] = v;
      }
    }
    return { fields, warnings };
  }
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  let pos = 0;
  for (const row of rows) {
    const rowBytes = row.half ? 1 : row.compressed ? 1 : row.count || 1;
    const n = row.compressed ? 1 : row.count || 1;
    // 可选 octet（标签带 *）在字节耗尽时缺席
    const optional = /\*$/.test(row.octet);
    if (optional && u8.length - pos < rowBytes) break;
    const reps = row.open ? Math.max(1, Math.floor((u8.length - pos) / rowBytes)) : n;
    for (let k = 0; k < reps; k++) {
      if (pos + rowBytes > u8.length) throw new Error(`布局反解：字节不足（${row.octet} 行）`);
      let acc = 0;
      for (let i = 0; i < rowBytes; i++) acc = (acc << 8) | u8[pos++];
      let shift = row.half ? 4 : rowBytes * 8;
      if (row.half) acc &= 0x0f;
      for (const f of row.fields) {
        shift -= f.pre || 0;
        if (f.pre) {
          const pv = (acc >> shift) & ((1 << f.pre) - 1);
          if (pv) warnings.push(`${f.name} 前导空位应为 0，实为 ${pv}`);
        }
        shift -= f.bits;
        const v = (acc >> shift) & ((1 << f.bits) - 1);
        const key = n > 1 || row.open ? `${f.name}[${k}]` : f.name;
        if (isSpare(f)) {
          if (v !== 0) warnings.push(`${key} 应为 spare 0，实为 ${v}`);
          continue; // spare 不进字段表
        }
        fields[key] = v;
      }
    }
  }
  if (pos !== u8.length) throw new Error(`布局反解：尾部余 ${u8.length - pos} 字节（开区间行与实际长度不符）`);
  return { fields, warnings };
}

// ==== src/nas/diff.js ====
// src/nas/diff.js — M4：NAS 版本间语义 Diff。
//
// NAS 不是 ASN.1：语义规则按消息表/IE 表重定义（ASN.1 的 D1-D13 不适用）。
// 判定口径（两侧版本各自的规范表格为准）：
//   - 消息族新增/删除 → info（新消息老收端忽略不了——但 NAS 收端对未知消息类型回
//     STATUS/#97，属协议内处理路径，不算字节破坏）；
//   - 同名消息 msgType 值变更 → break（同名消息在线缆上变成另一种语义）；
//   - 行新增（含 IEI 的 TV/TLV 类，O/C）→ ok（老收端按 IEI 未知跳过，24.501 §4.4.6 /
//     24.301 §4.4.6 忽略未知 IE）；
//   - 行新增（V/VH/LV 类无 IEI）→ warn（老收端无法定位，后续 IE 全部错位）；
//   - 行删除 → info（新版本流里可能出现的 IE 老收端不认识——若删除行携带 IEI，老收端
//     忽略之；M 行删除 = 新版本流不再有，老流照旧可解）；
//   - 同 IEI 行格式变更（TV→TLV / len 变化破坏位流）→ break；
//   - 同 IEI 行 presence M→O → info；O→M → warn（新要求）；
//   - 同 IEI 行指向的 IE 定义变更 → info（值语义变化，框架位流不破）。
// 产出 findings：{ severity: 'ok'|'info'|'warn'|'break', kind, msg, detail }，
// 与 ASN.1 diff 的 finalizeReport 口径一致。

const rowKey = (r) => {
  const i = rowIei(r);
  return i == null ? `n:${(r.name || '').toLowerCase()}` : `i:${i}`;
};

// inst = 消息实例（schema.messages[name][k]）；比较行集合
function diffMessageRows(name, li, ri, findings) {
  const lmap = new Map();
  for (const r of li.rows) lmap.set(rowKey(r), r);
  const rmap = new Map();
  for (const r of ri.rows) rmap.set(rowKey(r), r);
  for (const [k, rr] of rmap) {
    if (!lmap.has(k)) {
      const hasIei = k.startsWith('i:');
      const sev = hasIei ? 'ok' : 'warn';
      findings.push({
        severity: sev,
        kind: 'nas-row-add',
        msg: `${name}：新增 IE 行 ${rr.name}${hasIei ? `（IEI ${rr.iei}，老收端按未知 IE 跳过）` : '（无 IEI——老收端无法定位，后续 IE 错位风险）'}`,
      });
    }
  }
  for (const [k, lr] of lmap) {
    const rr = rmap.get(k);
    if (!rr) {
      findings.push({
        severity: 'info',
        kind: 'nas-row-del',
        msg: `${name}：删除 IE 行 ${lr.name}${lr.iei ? `（IEI ${lr.iei}）` : ''}`,
      });
      continue;
    }
    if ((lr.format || '').toUpperCase() !== (rr.format || '').toUpperCase() ||
        (lr.len || '').replace(/\s/g, '') !== (rr.len || '').replace(/\s/g, '')) {
      findings.push({
        severity: 'break',
        kind: 'nas-row-format',
        msg: `${name}：IE ${rr.name} 框架变更 ${lr.format}/${lr.len} → ${rr.format}/${rr.len}`,
      });
    }
    const lp = (lr.presence || '').trim();
    const rp = (rr.presence || '').trim();
    if (lp !== rp) {
      if (lp === 'M' && rp !== 'M') {
        findings.push({ severity: 'info', kind: 'nas-row-presence', msg: `${name}：IE ${rr.name} 必配→可选（${lp}→${rp}）` });
      } else if (lp !== 'M' && rp === 'M') {
        findings.push({ severity: 'warn', kind: 'nas-row-presence', msg: `${name}：IE ${rr.name} 可选→必配（${lp}→${rp}，新版本要求）` });
      }
    }
  }
}

// 消息显示名 → 类型值查找：msgTypes 键与 messages 键的形态随建库器而异——
// 24501/24301 类型表名小写 vs 显示名大写；44018 键名去非字母数字（'handovercommand'）；
// 24080 三常量键（'release complete'）。依次试原键 / 小写 / 归一化（与 resolveMsgType44018 同则）。
function msgTypeOf(schema, name) {
  const mt = schema.msgTypes || {};
  const hit = mt[name] || mt[name.toLowerCase()] || mt[name.toLowerCase().replace(/[^a-z0-9]/g, '')];
  return hit && hit.type != null ? hit.type : null;
}

function diffNasSchema(left, right) {
  const findings = [];
  const lmsg = left.messages || {};
  const rmsg = right.messages || {};
  for (const name of Object.keys(rmsg)) {
    if (!lmsg[name]) {
      const mt = msgTypeOf(right, name);
      findings.push({ severity: 'info', kind: 'nas-msg-add', msg: `新增消息 ${name}（${mt != null ? `类型 0x${mt.toString(16)}` : '附件/保护类'}）` });
      continue;
    }
    // 同名消息：逐实例配对（MO/MT 变体按 direction 匹配，失配则按下标）
    const rinsts = rmsg[name];
    const linsts = lmsg[name];
    for (let i = 0; i < rinsts.length; i++) {
      const ri = rinsts[i];
      const li = linsts.find((x) => x.direction === ri.direction) || linsts[Math.min(i, linsts.length - 1)];
      if (li.msgType != null && ri.msgType != null && li.msgType !== ri.msgType) {
        findings.push({ severity: 'break', kind: 'nas-msgtype', msg: `${name}（${ri.direction || '?'}）：消息类型值变更 0x${li.msgType.toString(16)} → 0x${ri.msgType.toString(16)}` });
      }
      diffMessageRows(name, li, ri, findings);
    }
  }
  for (const name of Object.keys(lmsg)) {
    if (!rmsg[name]) {
      findings.push({ severity: 'info', kind: 'nas-msg-del', msg: `删除消息 ${name}` });
    }
  }
  const sevRank = { break: 0, warn: 1, info: 2, ok: 3 };
  findings.sort((a, b) => sevRank[a.severity] - sevRank[b.severity]);
  const counts = { break: 0, warn: 0, info: 0, ok: 0 };
  for (const f of findings) counts[f.severity]++;
  return { findings, counts };
}

// ==== src/nas/security.js ====
// src/nas/security.js — M4：NAS 安全保护帧（24.501 §4.4.6/§9.1.1、24.301 §8.2.23 结构级）。
//
// 结构：24.501 = EPD(0x7E) + [spare 高 | SHT 低] + MAC(4) + Seqn(1) + 明文 NAS 消息；
//       24.301 = [SHT 高 | PD 低(EMM=7)] + MAC(4) + Seqn(1) + 明文 NAS 消息。
// SHT 位序差异实证（pycrate oracle）：24.501 SHT=1 帧 = 7e01…（SHT 低半，TS 24.007
// 先出现占低半，表序 [SHT, spare]）；24.301 SHT=1 帧 = 17…（SHT 高半，表序 [PD, SHT]）。
// SHT 值域（24.501 §9.3.1，pycrate SecHdrType_dict 同源）：0=无保护，1/3=仅完整性保护
// （明文可读），2/4=完整性保护+加密（载荷不可读）。MAC 计算需 K_NAS 密钥与 5G-IA/EIA
// 算法，本层不涉及——MAC 作为 4 字节透明域，由上层工具/密钥持有者填入。

const SHT_DESC = {
  0: 'plain（无安全保护）',
  1: 'integrity protected（明文可读）',
  2: 'integrity protected and ciphered（载荷不可读）',
  3: 'integrity protected with new 5G NAS security context（明文可读）',
  4: 'integrity protected and ciphered with new 5G NAS security context（载荷不可读）',
};

// SHT∈{1,3} 时内层明文可读
function shtReadable(sht) {
  return sht === 1 || sht === 3;
}

const hex = (bytes) => Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');

// 内层明文消息派发：按 msgType 字节在 schema.messages 里找实例（同名多实例依次试解码）。
// 24501 明文消息 = EPD(o1) + SHT/spare(o2) + MsgType(o3)；24301 = PD/SHT(o1) + MsgType(o2)。
function dispatchInner(schema, payload, spec) {
  const mt = spec === '24501' ? payload[2] : payload[1];
  if (mt == null) return null;
  const cands = [];
  for (const [name, insts] of Object.entries(schema.messages || {})) {
    for (let i = 0; i < insts.length; i++) {
      if (insts[i].msgType === mt) cands.push({ name, inst: insts[i], instIdx: i });
    }
  }
  for (const c of cands) {
    try {
      const { parts } = decMsg(c.inst, payload, spec);
      return { msg: c.name, instIdx: c.instIdx, section: c.inst.section, parts };
    } catch {
      // 同类型值的其他实例（MO/MT 变体）继续尝试
    }
  }
  return null;
}

// 安全保护帧结构级解码。返回
// { sht, shtDesc, mac, seq, payload, readable, inner }（inner = {msg, instIdx, section, parts} | null）。
// 非法帧（长度不足/EPD 或 PD 不符）抛错。
function decSec(schema, bytes, spec = '24501') {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  const minLen = spec === '24501' ? 7 : 6;
  if (u8.length < minLen) throw new Error(`安全保护帧过短（需 ≥${minLen} 字节，得 ${u8.length}）`);
  let sht;
  if (spec === '24501') {
    if (u8[0] !== 0x7e) throw new Error(`EPD 不匹配: 0x${u8[0].toString(16)} ≠ 0x7e`);
    sht = u8[1] & 0x0f; // SHT 低半（表序 [SHT, spare]，TS 24.007 先出现占低半）
  } else {
    const pd = u8[0] & 0x0f;
    if (pd !== 7) throw new Error(`PD 不匹配: ${pd} ≠ 7（EMM）`);
    sht = u8[0] >> 4; // SHT 高半（表序 [PD, SHT]）
  }
  const macOff = spec === '24501' ? 2 : 1;
  const mac = u8.slice(macOff, macOff + 4);
  const seq = u8[macOff + 4];
  const payload = u8.slice(macOff + 5);
  const readable = shtReadable(sht);
  const inner = readable && payload.length ? dispatchInner(schema, payload, spec) : null;
  return {
    sht,
    shtDesc: SHT_DESC[sht] ?? `保留值 0x${sht.toString(16)}`,
    mac,
    seq,
    payload,
    readable,
    inner,
  };
}

// 安全保护帧编码。plain：明文 NAS 消息字节；opts = { sht=1, mac='00000000'（hex 8 位）, seq=0 }。
function encSec(plain, opts = {}, spec = '24501') {
  const sht = opts.sht ?? 1;
  if (!(sht >= 0 && sht <= 15)) throw new Error(`SHT 越界: ${sht}`);
  if (sht === 0) throw new Error('SHT=0 为普通明文消息，无需安全保护封装');
  const mac = typeof opts.mac === 'string' ? OCT(opts.mac) : opts.mac;
  if (!mac || mac.length !== 4) throw new Error('MAC 须为 4 字节（8 位 hex）');
  const seq = opts.seq ?? 0;
  if (!(seq >= 0 && seq <= 255)) throw new Error('SEQ 越界 (0-255)');
  const p = plain instanceof Uint8Array ? plain : Uint8Array.from(plain);
  if (spec === '24501') {
    return Uint8Array.of(0x7e, sht & 0x0f, ...mac, seq, ...p); // SHT 低半 + spare 高半 0（=pycrate oracle 7e01…）
  }
  return Uint8Array.of((sht << 4) | 7, ...mac, seq, ...p); // PD=7（EMM）
}

// 供 UI 展示的行摘要
function secSummary(d) {
  const lines = [
    `SHT ${d.sht}：${d.shtDesc}`,
    `MAC：${hex(d.mac)}（透明域——需 K_NAS 与 5G-IA/EIA 计算）`,
    `Sequence number：${d.seq}`,
  ];
  if (d.inner) {
    lines.push(`内层消息：${d.inner.msg}（${d.inner.section}，${d.inner.parts.length} 行已解）`);
  } else if (d.readable) {
    lines.push('内层消息：未能派发（msgType 不在当前 schema）——载荷 hex 见下');
  } else {
    lines.push('载荷已加密（结构级不可读）');
  }
  return lines;
}

// ---- 受保护帧的加密/解密（端到端语义，UI 与测试共用）----------------------------
// 约定（33.501 §6.4 / 33.401 §8：发送端先 EEA 加密、后 EIA 完整性保护）——MAC 覆盖的
// 是**密文**载荷（v1.7 decipher 语义已锚定：解密后重组 SHT=1 帧、MAC 按明文重算才自洽）。
// SHT∈{2,4} 载荷为密文；SHT∈{1,3} 载荷为明文；EEA0（algEnc=0）载荷原样透传。

// 正向加密封装。opts = { sht=2, seq=0, count24=0, dir=0, bearer=0,
//   keys: {algInt, kInt, algEnc, kEnc}, mac（hex 串，仅 SHT=1/3 无密钥时的透明域回退） }。
// SHT∈{2,4}：EEA 加密载荷 + MAC 覆盖密文（必须已派生 K_NASenc/K_NASint）；
// SHT∈{1,3}：载荷原样，已派生 K_NASint 时 MAC 覆盖明文自动填入，否则用 opts.mac。
// 返回 { frame, payload, mac, ciphered }（payload = 入帧载荷，mac = 帧内 MAC）。
function encSecProtected(schema, plain, opts = {}, spec = '24501') {
  const sht = opts.sht ?? 2;
  if (!shtReadable(sht) && !(sht === 2 || sht === 4)) {
    throw new Error(`SHT=${sht} 不是可封装值（1-4；0 为明文消息无需封装）`);
  }
  const ciphered = sht === 2 || sht === 4;
  const { seq = 0, count24 = 0, dir = 0, bearer = 0, keys } = opts;
  if (ciphered && !(keys && keys.kEnc != null)) throw new Error('SHT=2/4 加密封装需先派生 K_NASenc');
  if (ciphered && !(keys && keys.kInt != null)) throw new Error('SHT=2/4 封装需先派生 K_NASint（MAC 覆盖密文）');
  const p = plain instanceof Uint8Array ? plain : Uint8Array.from(plain);
  const payload = ciphered ? nasCipher(spec, keys.algEnc, keys.kEnc, count24, dir, bearer, p) : p.slice();
  const mac = keys && keys.kInt != null
    ? nasMac(spec, keys.algInt, keys.kInt, count24, dir, bearer, seq, payload)
    : OCT(opts.mac || '00000000');
  const frame = encSec(payload, { sht, mac, seq }, spec);
  return { frame, payload, mac, ciphered };
}

// 加密载荷解密 + 明文重组。decSec → EEA 解密（EEA0 原样）→ 重组 SHT=1 明文帧，
// MAC 按明文载荷重算（原 MAC 覆盖的是密文，SHT 八位组不在 MAC 覆盖域内）。
// opts = { count24=0, dir=0, bearer=0, keys }。SHT∈{1,3}（本就可读）直接返回结构级结果。
// 返回 { d（decSec 结果）, plain, plainFrame, macPlain, readable }。
function decipherSec(schema, bytes, opts = {}, spec = '24501') {
  const d = decSec(schema, bytes, spec);
  if (!isCipheredSht(d.sht)) return { d, plain: d.payload, plainFrame: null, macPlain: null, readable: true };
  const { count24 = 0, dir = 0, bearer = 0, keys } = opts;
  if (!(keys && keys.kEnc != null)) throw new Error('SHT=2/4 解密需先派生 K_NASenc');
  if (!(keys && keys.kInt != null)) throw new Error('SHT=2/4 解密需先派生 K_NASint（重组帧 MAC 按明文重算）');
  const plain = nasCipher(spec, keys.algEnc, keys.kEnc, count24, dir, bearer, d.payload);
  const macPlain = nasMac(spec, keys.algInt, keys.kInt, count24, dir, bearer, d.seq, plain);
  const plainFrame = encSec(plain, { sht: 1, mac: macPlain, seq: d.seq }, spec);
  return { d, plain, plainFrame, macPlain, readable: false };
}

function isCipheredSht(sht) {
  return sht === 2 || sht === 4;
}

// ==== src/nas/semantics.js ====
// src/nas/semantics.js — M4：IE 值语义层（特殊值编码）。
//
// 覆盖三类 NAS 常用特殊编码（编码规则依 TS 23.003 / 24.501 §9.11 系列）：
//   - APN/DNN：点分标签 ⇔ 长度前缀标签串（DNN 值域）；
//   - PLMN：MCC/MNC 半八位组交换编码（3 八位组，F 填充）；
//   - BCD：半八位组数字串（身份类 IE 的数字域）。
// 均为纯函数，双向可逆；黄金向量见 test/nas_semantics.test.js（APN 向量与 pycrate
// TS24501_IE.DNN 编码实测一致）。

// ---- APN / DNN ----------------------------------------------------------------
// 'imstest.mnc001.mcc001.gprs' → 07 696d73746573 74 06... （每标签 1 长度字节 + ASCII）
function apnEncode(dotted) {
  const labels = (dotted || '').split('.').filter((s) => s !== '');
  const out = [];
  for (const label of labels) {
    if (label.length > 63) throw new Error(`APN 标签过长（>63）: ${label}`);
    for (let i = 0; i < label.length; i++) {
      const c = label.charCodeAt(i);
      if (c < 0x21 || c > 0x7e) throw new Error(`APN 标签含非法字符: ${label}`);
      out.push(c);
    }
    out.splice(out.length - label.length, 0, label.length);
  }
  return Uint8Array.from(out);
}

function apnDecode(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  const labels = [];
  let i = 0;
  while (i < u8.length) {
    const l = u8[i];
    if (l === 0) break; // 空标签 = 根域终止
    if (i + 1 + l > u8.length) throw new Error('APN 编码截断');
    let ok = true;
    let s = '';
    for (let k = 0; k < l; k++) {
      const c = u8[i + 1 + k];
      if (c < 0x21 || c > 0x7e) { ok = false; break; }
      s += String.fromCharCode(c);
    }
    if (!ok) throw new Error('APN 标签含非法字节');
    labels.push(s);
    i += 1 + l;
  }
  return labels.join('.');
}

// ---- PLMN（MCC/MNC 半八位组交换） ----------------------------------------------
// MCC=460 MNC=00 → 64 F0 00：octet1 = mcc2<<4|mcc1；octet2 = mnc3<<4|mcc3；octet3 = mnc2<<4|mnc1
// 两位 MNC 时 mnc3 = 0xF。
function plmnEncode(mcc, mnc) {
  const mc = String(mcc);
  const mn = String(mnc);
  if (!/^\d{3}$/.test(mc)) throw new Error(`MCC 须 3 位数字: ${mcc}`);
  if (!/^\d{2,3}$/.test(mn)) throw new Error(`MNC 须 2-3 位数字: ${mnc}`);
  const d = (s, i) => parseInt(s[i], 10);
  const f = (n) => (n == null ? 0x0f : n);
  const mnc3 = mn.length === 3 ? d(mn, 2) : null;
  return Uint8Array.of(
    (d(mc, 1) << 4) | d(mc, 0),
    (f(mnc3) << 4) | d(mc, 2),
    (d(mn, 1) << 4) | d(mn, 0)
  );
}

function plmnDecode(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  if (u8.length < 3) throw new Error('PLMN 须 3 八位组');
  const dig = (n) => (n <= 9 ? String(n) : n === 0x0f ? '' : `?${n.toString(16)}?`);
  const mcc = dig(u8[0] & 0x0f) + dig(u8[0] >> 4) + dig(u8[1] & 0x0f);
  const mnc = dig(u8[2] & 0x0f) + dig(u8[2] >> 4) + dig(u8[1] >> 4);
  return { mcc, mnc: mnc.replace(/F$/i, '') || mnc };
}

// ---- BCD 数字串（身份类 IE 数字域） --------------------------------------------
// nibble 序 0-9 为数字，0xF 为填充（跳过）；其它值报告为 <hex>。
function bcdDecode(bytes, { skipFiller = true } = {}) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  let out = '';
  for (const b of u8) {
    for (const n of [b & 0x0f, b >> 4]) {
      if (n <= 9) out += String(n);
      else if (n === 0x0f && skipFiller) continue;
      else out += `<${n.toString(16)}>`;
    }
  }
  return out;
}

function bcdEncode(digits) {
  const s = String(digits).replace(/\s+/g, '');
  if (!/^\d*(F\d*)*$/i.test(s)) throw new Error(`BCD 含非数字: ${digits}`);
  const nib = [...s].map((c) => (c.toUpperCase() === 'F' ? 0x0f : parseInt(c, 10)));
  if (nib.length % 2) nib.push(0x0f);
  const out = new Uint8Array(nib.length / 2);
  for (let i = 0; i < nib.length; i += 2) out[i >> 1] = nib[i] | (nib[i + 1] << 4);
  return out;
}

// ---- SMS（23.040 TPDU / 23.038 字母表）------------------------------------------
// GSM 7-bit 默认字母表（23.038 §6.2.1，0x00-0x7F）与扩展表（0x1B 转义）。
const GSM7_ALPHABET = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞ\x1bÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà';
// 扩展表（0x1B 转义后跟的 septet）：10=FF、20=^、40/41/47/60/61/62/64=印刷符号、101=€
// （23.038 §6.2.1.1.1；13=CR2、27=SS2 两个控制项按 pycrate TS23038 十二项表对齐，
//  以最接近的 ASCII 控制符渲染）。审核修正：0x0a 原误写 '\n'，应为换页 FF '\x0c'。
const GSM7_EXT = { 0x0a: '\x0c', 0x0d: '\r', 0x14: '^', 0x1b: '\x1b', 0x28: '{', 0x29: '}', 0x2f: '\\', 0x3c: '[', 0x3d: '~', 0x3e: ']', 0x40: '|', 0x65: '€' };

// 7 位打包解包：bitOffset 起按 7 位一个字符连续取 septets 个（UDH 时数据从
// (1+UDHL)*8 + 填充位 起——填充使 (1+UDHL)*8+fill 为 7 的倍数）。
function gsm7Unpack(bytes, septets, bitOffset = 0) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes ?? []);
  let bit = bitOffset;
  let out = '';
  let ext = false;
  for (let i = 0; i < septets; i++) {
    const b0 = u8[bit >> 3] ?? 0;
    const b1 = u8[(bit >> 3) + 1] ?? 0;
    const shift = bit & 7;
    const v = ((b0 >> shift) | (b1 << (8 - shift))) & 0x7f;
    bit += 7;
    if (ext) {
      out += GSM7_EXT[v] ?? '';
      ext = false;
      continue;
    }
    if (v === 0x1b) {
      ext = true;
      continue;
    }
    out += GSM7_ALPHABET[v] ?? String.fromCharCode(v);
  }
  return out;
}

// TP-User Data 语义解码（23.038 §4 TP-DCS 编码组按高 4 位选择字母表；组语义与
// pycrate TS23038 SMS_DCS 十二组对照）：组 0-3 通用数据编码 + 组 4-7 自动删除组
//   ——字母表位 3-2（00=7bit 01=8bit 10=UCS2 11=保留），组 2/3/6/7 = 压缩（23.042，
//   不可明文解）；组 12/13 消息等待（丢弃/存储）= 默认字母表，字母表位 1/3 = 保留；
//   组 14 = UCS2；组 15 数据编码/消息类 = 字母表位 3-2；组 8-11 保留。
// udhi = octet1 的 TP-UDHI 位（0x40）；udl = TP-User-Data-Length 行值。
// 返回 { alphabet, text }；text 为 null 表示该编码组不可机读（保留/压缩）。
function smsTpUdText({ ud, udl = null, dcs = 0, udhi = false }) {
  const u8 = ud instanceof Uint8Array ? ud : Uint8Array.from(ud ?? []);
  const grp = dcs >> 4;
  const cs = (dcs >> 2) & 0x03;
  let alpha = null; // 0=7bit 1=8bit 2=UCS2
  if (grp <= 7) alpha = cs;
  else if (grp === 12 || grp === 13) alpha = cs === 0 || cs === 2 ? 0 : null;
  else if (grp === 14) alpha = 2;
  else if (grp === 15) alpha = cs;
  if (alpha === 3 || alpha == null) return { alphabet: 'unknown', text: null };
  const compressed = grp <= 7 && !!(grp & 0x02); // 组 2/3/6/7：压缩
  if (compressed) return { alphabet: ((alpha === 2 ? 'UCS2' : alpha === 1 ? '8bit' : 'GSM 7-bit') + '（压缩）'), text: null };
  if (alpha === 2) {
    let t = '';
    for (let i = 0; i + 1 < u8.length; i += 2) t += String.fromCharCode((u8[i] << 8) | u8[i + 1]); // UTF-16BE
    return { alphabet: 'UCS2', text: t };
  }
  if (alpha === 1) return { alphabet: '8bit', text: null };
  // 7-bit：UDL 计 septets（含 UDH 头）；UDH 时数据从头部后的 septet 边界起。
  // UDL 超出可用数据（截断帧/缺省怪帧）→ 按可解数截断并注记，不输出填充垃圾。
  if (udhi) {
    const hdr = 1 + (u8[0] ?? 0);
    const fill = (7 - (hdr % 7)) % 7;
    const hdrSeptets = Math.ceil((hdr * 8) / 7);
    const want = Math.max(0, (udl ?? hdrSeptets + u8.length) - hdrSeptets);
    const avail = Math.max(0, Math.floor((u8.length * 8 - (hdr * 8 + fill)) / 7));
    const text = gsm7Unpack(u8, Math.min(want, avail), hdr * 8 + fill);
    return { alphabet: 'GSM 7-bit', text, truncated: want > avail ? avail : undefined };
  }
  const want = udl ?? Math.floor((u8.length * 8) / 7);
  const avail = Math.floor((u8.length * 8) / 7);
  const text = gsm7Unpack(u8, Math.min(want, avail));
  return { alphabet: 'GSM 7-bit', text, truncated: want > avail ? avail : undefined };
}

// TP-OA/TP-DA/TP-RA 地址行解码：[有效半八位组数][TOA][数字 BCD]。
function smsAddrDecode(value) {
  const u8 = value instanceof Uint8Array ? value : Uint8Array.from(value ?? []);
  if (u8.length < 2) throw new Error('TP 地址须 ≥2 八位组');
  const n = u8[0];
  const toa = u8[1];
  const digits = bcdDecode(u8.slice(2)).slice(0, n);
  const ton = (toa >> 4) & 0x07;
  const prefix = ton === 1 ? '+' : '';
  return { number: prefix + digits, ton, npi: toa & 0x0f };
}

// TP-SCTS/TP-DT 时间戳：7 个半八位组交换十进制 YY MM DD HH MM SS + 时区。
// 时区（§9.2.3.11，与 24.008 §10.5.3.8 同一定义）：半八位组表示——高半 = 个位、
// 低 3 位 = 十位、bit3 = 代数符号（0 正 1 负），值为刻钟数。规范锚点：英国夏令时
// （+1h=4 刻钟）= 01000000 (0x40)；+8h = 32 刻钟 = 0x23。审核注：pycrate TS23040 的
// TimeZone 模型按十六进制 nibble（+8h→0x02）与此不符，以规范文本为准（见偏差台账）。
function smsSctsDecode(value) {
  const u8 = value instanceof Uint8Array ? value : Uint8Array.from(value ?? []);
  if (u8.length < 7) throw new Error('TP 时间戳须 7 八位组');
  const d = (b) => `${b & 0x0f}${b >> 4}`;
  const tz = u8[6];
  const quarters = (tz >> 4) + (tz & 0x07) * 10;
  const sign = tz & 0x08 ? '-' : '+';
  return `20${d(u8[0])}-${d(u8[1])}-${d(u8[2])} ${d(u8[3])}:${d(u8[4])}:${d(u8[5])} GMT${sign}${quarters / 4}`;
}

// 23.040 消息级语义摘要（解码树的汇总行）：从 parts 里找 MTI/DCS/UDL/UD/PI 行算 TP-UD 原文。
// 返回字符串数组（无 SMS 语义时为空）。
function smsMsgSemantics(parts) {
  const find = (re) => parts.find((p) => re.test(p.row.name || ''));
  const mti = find(/TP-Message Type Indicator/i);
  const udRow = find(/^TP-UD$|TP-PI bit gated/i);
  if (!mti || !udRow || udRow.value == null || !(udRow.value instanceof Uint8Array) || !udRow.value.length) return [];
  const oct1 = mti.value instanceof Uint8Array ? mti.value[0] : mti.value;
  const udhi = !!(Number(oct1) & 0x40);
  const dcsRow = find(/^TP-DCS$/);
  const udlRow = find(/^TP-UDL$/);
  let dcs = dcsRow && dcsRow.value instanceof Uint8Array ? dcsRow.value[0] : 0;
  let udl = udlRow && udlRow.value instanceof Uint8Array ? udlRow.value[0] : null;
  let udBytes = udRow.value;
  // 门控尾行（TP-PI bit gated）时 UD 藏在 [PI][PID?][DCS?][UDL?][UD] 串里——按 PI 位取段。
  // §9.2.3.27：ext 位（bit7）=1 → 另一 PI 八位组紧随其后；TP-PID/DCS/UDL 参数位定义在
  // 第一 PI 八位组（后续 PI 的参数位当前规范版本未定义）——跳过 ext 链后按首 PI 位取段。
  if (/TP-PI bit gated/i.test(udRow.row.name || '')) {
    const v = udRow.value;
    const pi0 = v[0] ?? 0;
    let off = 1;
    let pi = pi0;
    while (pi & 0x80) {
      pi = v[off] ?? 0;
      off += 1;
    }
    if (pi0 & 0x01) off += 1; // TP-PID
    if (pi0 & 0x02) {
      if (dcsRow == null) dcs = v[off];
      off += 1;
    }
    if (!(pi0 & 0x04)) return []; // TP-UD 不在
    udl = v[off];
    off += 1;
    udBytes = v.slice(off);
  }
  const { alphabet, text, truncated } = smsTpUdText({ ud: udBytes, udl, dcs, udhi });
  if (text == null || !text.length) return [];
  return [`TP-UD（${alphabet}）：${JSON.stringify(text)}${truncated != null ? `（UDL 声明超出可用数据，仅解出前 ${truncated} 字符）` : ''}`];
}

// 44.018 L2 Pseudo Length 语义校验（§10.5.2.19）：值 = 消息中按 T/V/TV/LV/TLV 格式化的
// 八位组数（Rest Octets 除外），且八位组低两位恒 '01'。仅对 CCCH/BCCH 头形态（mtOff=2）
// 的实例有意义；BCCH 上的 SI 消息规范允许 MS 忽略该值——一律返回提示串而非报错。
// 返回字符串数组（无校验意义时为空）。
function l2plCheck(inst, frameBytes, parts) {
  if (!inst || inst.mtOff !== 2) return [];
  const u8 = frameBytes instanceof Uint8Array ? frameBytes : Uint8Array.from(frameBytes ?? []);
  if (!u8.length) return [];
  const o1 = u8[0];
  const out = [];
  if ((o1 & 0x03) !== 0x01) out.push(`L2 Pseudo Length 低两位 = 0b${(o1 & 0x03).toString(2).padStart(2, '0')} ≠ 01`);
  const value = o1 >> 2;
  let restBytes = 0;
  for (const p of parts || []) {
    if (/rest octets/i.test(p.row.name || '') && p.value instanceof Uint8Array) restBytes += p.value.length;
  }
  const formatted = u8.length - 1 - restBytes;
  if (value !== formatted) {
    out.push(`L2 Pseudo Length 值 ${value} ≠ 格式化八位组数 ${formatted}（总长 ${u8.length} − L2PL 1 − Rest Octets ${restBytes}）`);
  } else {
    out.push(`L2 Pseudo Length 值 ${value} = 格式化八位组数 ✓（Rest Octets ${restBytes} 字节不计）`);
  }
  return out;
}

// ==== src/nas/crypto.js ====
// crypto.js — NAS 完整性/机密性算法层（clean-room，锚定规范测试向量）。
//
// 来源规范（本地归档 D:/AI/cache/algo35_doc + sage_*.pdf）：
//   SHA-256:  FIPS 180-4；HMAC: RFC 2104（向量 RFC 4231）
//   KDF:      TS 33.220 Annex B.2.0（= HMAC-SHA256(KEY, S)）
//   NAS 密钥: TS 33.501 A.8（FC=0x69, KEY=K_AMF）/ TS 33.401 A.7（FC=0x15, KEY=K_ASME）
//   SNOW 3G:  TS 35.202/35.215 SAGE spec v1.1（UEA2/UIA2 核心）
//   UEA2/UIA2: SAGE Document 1 v2.1 §3.4/§4.4（EEA1/NIA1 = f8/f9，EIA1 fresh=bearer<<27）
//   AES-CMAC: RFC 4493（EIA2/NIA2 按 33.401 B.2.3 拼输入）
//   AES-CTR:  SP 800-38A（EEA2/NEA2 按 33.401 B.1.3 构造计数器）
//   ZUC:      TS 35.222 SAGE ZUC spec v1.6；EEA3/EIA3 按 TS 35.221/33.401 B.1.4/B.2.4
// NAS 帧的 MAC 覆盖域与 COUNT/BEARER/DIRECTION 约定见 nasMacFrame()（24.501 §4.4.3.3
// octet 7..n；24.301 §4.4.3.3 octets 6..n；33.501 §6.4.3.1 BEARER=连接号；33.401 §8.1.1 BEARER=0）。



// ---- SHA-256 ------------------------------------------------------------------
const K256 = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
];
const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;

function sha256(msg) {
  const u8 = msg instanceof Uint8Array ? msg : Uint8Array.from(msg);
  const bitLen = u8.length * 8;
  const withPad = (((u8.length + 8) >> 6) + 1) * 64;
  const buf = new Uint8Array(withPad);
  buf.set(u8);
  buf[u8.length] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(withPad - 4, bitLen >>> 0);
  dv.setUint32(withPad - 8, Math.floor(bitLen / 0x100000000));
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a,
    h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Array(64);
  for (let off = 0; off < withPad; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);

function wordsToBytes(words) {

// opt.msg 为解码得到的明文（或密文）消息体；seq 为序号字节。
function nasMacInput(seq, msgBytes) {

function nasMac(spec, algId, kNasInt, count24, dir, bearer, seq, msgBytes) {

  return f(kNasInt, nasCount32(count24), bearer, dir, inp, inp.length * 8);

// 加解密（keystream 异或，同函数逆）。msg 为待处理字节串。
function nasCipher(spec, algId, kNasEnc, count24, dir, bearer, data) {
  if (algId === 0) return data instanceof Uint8Array ? data.slice() : Uint8Array.from(data);

// 真实形态锚点（test/fixtures/ws_real.json，tshark 4.x 生成）：
//   [{ _index, _type, _source: { layers: { frame, eth, ip, sctp, s1ap|ngap, [_ws.malformed] } } }]

// 解析 JSON 文本 → 帧数组 [{ idx, time, layers, malformed }]；非数组形态（{packets:[…]}/单帧对象）容忍。
function wsFrames(jsonText) {
  let data;
  try {
    data = JSON.parse(jsonText);
  } catch (e) {
    throw new Error('不是有效的 JSON：' + e.message);
  }
  let arr = Array.isArray(data) ? data : Array.isArray(data?.packets) ? data.packets : [data];
  return arr.map((fr, idx) => {
    const layers = fr?._source?.layers ?? fr?.layers ?? {};
    return {
      idx,
      time: layers.frame?.frame?.time_epoch ?? layers.frame?.['frame.time_epoch'] ?? layers.frame?.time ?? null,
      layers,
      malformed: !!(layers['_ws.malformed'] || layers._ws?.malformed != null),
    };
  });
}

      const p = path ? `${path}.${k}` : k;
      if (typeof v === 'string') {
        if (NAS_PDU_KEY.test(k) && v.length >= 4 && HEXISH.test(v)) {
          const hex = v.replace(/[^0-9a-fA-F]/g, '');
          if (hex.length >= 4 && hex.length % 2 === 0) out.push({ path: p, hex });
        }
      } else if (v && typeof v === 'object') {
        walk(v, p);
      }
    }
  };
  walk(layers, '');
  return out;
}

function wsHexToBytes(str) {
  const hex = str.replace(/[^0-9a-fA-F]/g, '');
  return OCT(hex);
}

// 平文本 NAS 的 msgType 位置：24.501 = [EPD, SHT/spare, msgType, …]；24.301/24.008/24.080
// = [PD|SHT/TI, msgType, …]；44.018 按实例 mtOff（CCCH 消息头部多 L2 Pseudo Length → 2，
// 其余 1，建库写入）。
function plainMsgType(bytes, spec) {
  return spec === '24501' ? bytes[2] : bytes[1];
}

// msgType 命中：24008/44018 类型表含通配或掩码（msgMask），其余精确比较——与 codec.js 口径一致。
// off 取实例级 mtOff（缺省按 spec 旧口径）。
function typeHit(insts, mt, bytes, spec) {
  return insts.some((i) => {
    if (i.msgType == null) return false;
    const off = i.mtOff ?? (spec === '24501' ? 2 : 1);
    const b = bytes[off];
    if (b == null) return false;
    return i.msgMask != null ? (b & i.msgMask) === (i.msgType & i.msgMask) : b === i.msgType;
  });
}

// 候选字节 → { schemas: [{key, spec, ver, via, names, namesSecure}], best } | null
// schemas: nasState.schemas 形态 { '24501 i70': schema }。不强行全行解码——报告 msgType 命中与结构合法性。
function wsMatchSchema(schemas, bytes, helpers) {
  const { decSec } = helpers;
  const hits = [];
  for (const [key, schema] of Object.entries(schemas || {})) {
    const spec = schema.spec;
    const names = [];
    const namesSecure = [];
    let secInfo = null;
    // 平文本：msgType 派发
    const mt = plainMsgType(bytes, spec);
    if (mt != null) {
      for (const [name, insts] of Object.entries(schema.messages || {})) {
        if (typeHit(insts, mt, bytes, spec)) names.push(name);
      }
    }
    // 安全帧：结构解码（SHT≠0）；可读载荷再按 msgType 派发（不要求全行解码成功）
    try {
      const d = decSec(schema, bytes, spec);
      secInfo = { sht: d.sht, seq: d.seq, readable: d.readable, inner: d.inner ? d.inner.msg : null };
      if (d.inner) namesSecure.push(d.inner.msg);
      if (d.readable && d.payload.length) {
        const smt = plainMsgType(d.payload, spec);
        if (smt != null && !namesSecure.length) {
          for (const [name, insts] of Object.entries(schema.messages || {})) {
            if (typeHit(insts, smt, d.payload, spec)) namesSecure.push(name);
          }
        }
      }
    } catch {
      // 非安全帧形态
    }
    if (names.length || namesSecure.length || secInfo) {
      hits.push({
        key,
        spec,
        ver: schema.version,
        names,
        namesSecure,
        secInfo,
        score: (secInfo?.inner ? 4 : 0) + (names.length ? 2 : 0) + (namesSecure.length ? 2 : 0),
      });
    }
  }
  if (!hits.length) return null;
  hits.sort((a, b) => b.score - a.score);
  return { hits, best: hits[0] };
}

// ==== src/nas/ingest.js ====
// ingest.js — NAS spec docx → 结构化 → schema 的纯函数管线（CLI 与浏览器共用）。
// 来源：tools/nasingest.mjs（单文档分类循环）与 tools/nasdef.mjs（建库器）的纯逻辑搬家——
// CLI 保留壳（目录遍历/文件 IO），核心在此保证「浏览器产物 = CLI 产物逐字节一致」。
// 依赖：docxtables.js（表格抽取，纯 JS）、docxzip.js（zip 读取，浏览器/Node 双端）。


// 标题/表题文本 '9.11.3.1 5GMM capability' → { num, title }
function splitHeading(text) {
  const m = /^((?:\d+|[A-Z])(?:\.\d+)*)\s*(.*)$/.exec(text);
  return m ? { num: m[1], title: m[2] } : { num: null, title: text };
}

// 节号带字母后缀的标题（'9.9.3.0B Additional update type'）——splitHeading 的节号词法
// 不含字母，后缀会被吞进标题（num '9.9.3.0' + title 'B …'，与 9.9.3.0A 撞节号）。
// 24.301 §9.9.3.0A/0B 实证。后缀后必须跟空白，纯数字节号回落 splitHeading。
function splitHeadingSfx(text) {
  const hm = /^\s*((?:\d+\.)+\d+[a-zA-Z])\s+(.*)$/.exec(text);
  if (hm) return { num: hm[1], title: hm[2].trim() };
  return splitHeading(text);
}

// caption 段：'Table 8.2.6.1.1: …'（24.501/24.301）或 'Table 9.2.12/3GPP TS 24.008: …'（24.008）→ 元数据
// 取窗口内最后一个 Table 段（最贴近表格的即本表 caption）——24.080 实证：相邻两表只隔
// 一段说明文字，上一表的 caption 会滞留在 3 段窗口里，取第一个会把 REGISTER MT 的表
// 标成 FACILITY（caption 与内容错位）。
function parseCaption(paras) {
  const cap = (paras || []).filter((p) => /^Table\s/i.test(p)).pop();
  if (!cap) return null;
  // caption 内嵌换行（44.018 9.1.15b 实证 '…HANDOVER\nCOMMAND message content'）→ 拍平再匹配
  const flat = cap.replace(/\s*\n\s*/g, ' ').trim();
  let m = /^Table\s+([\w.]+)\s*:\s*(.+)$/i.exec(flat);
  if (!m) m = /^Table\s+([\w.]+)\/[^:]*:\s*(.+)$/i.exec(flat);
  // 24.008 部分表题无冒号（'Table 9.2.18/3GPP TS 24.008 MM INFORMATION message content'）
  if (!m) m = /^Table\s+([\w.]+)\/\s*3GPP TS [\w.]+\s*:?\s*(.+)$/i.exec(flat);
  // 缺冒号且表号与名称直接连写（44.018 9.1.51 实证 'Table 9.1.51.1EXTENDED MEASUREMENT
  // ORDER message content'）——纯数字节号（小写字母后缀，大写 E 属于名称）+ 大写名称首字母为界
  if (!m) m = /^Table\s+(\d+(?:\.\d+)+[a-z]?)([A-Z].+)$/.exec(flat);
  if (!m) return { caption: cap };
  let name = m[2];
  const kind = /message content/i.test(name) ? 'message' : 'other';
  name = name.replace(/\s*message content.*$/i, '');
  return { caption: cap, tableId: m[1], name, kind };
}

// 样式映射：.doc 转换的 docx 用数字 styleId，需从 styles.xml 解析 heading 名
function styleMapFromStylesXml(stylesXml) {
  const styleMap = {};
  if (!stylesXml) return styleMap;
  for (const m of stylesXml.matchAll(/<w:style [^>]*w:styleId="([^"]+)"[^>]*>([\s\S]*?)<\/w:style>/g)) {
    const nm = /<w:name w:val="([^"]+)"/.exec(m[2]);
    if (nm && /^heading (\d+)$/i.test(nm[1])) styleMap[m[1]] = `Heading${nm[1].match(/\d+/)[0]}`;
  }
  return styleMap;
}

// 单文档分类循环：document.xml → 结构化 {version, spec, sections, bits, msgs, typeTables, stats}
// （字段顺序即 CLI 落盘 JSON 的键序，勿动——nasdef 门禁产物以此比对）
function ingestDocumentXml(xml, styleMap, spec, version) {
  const items = flowFromXml(xml, styleMap);
  const bits = [];
  const msgs = [];
  const typeTables = [];
  const valueTables = [];
  const csn1Tables = [];
  const secProse = new Map();
  let other = 0;
  const sections = [];
  let curH3 = null;
  for (const it of items) {
    if (it.kind === 'p') {
      if (/^Heading[234]$/.test(it.style) && it.text) {
        const sh = splitHeading(it.text);
        const hm = /^\s*((?:\d+\.)+\d+)([a-zA-Z])\s+(.*)$/.exec(it.text);
        if (hm) {
          // splitHeading 吃掉节号字母后缀（'10.5.2.35a'→num '10.5.2.35' + title 'a …'；
          // 大写后缀 24.301 '9.9.3.0B' 同病）——重建
          const fixed = { num: hm[1] + hm[2], title: hm[3].trim(), style: it.style };
          sections.push(fixed);
          curH3 = fixed;
        } else if (sh.num) {
          sections.push({ num: sh.num, title: sh.title, style: it.style });
          curH3 = sh;
        }
      } else if (curH3 && it.text) {
        secProse.set(curH3.num, (secProse.get(curH3.num) || '') + ' ' + it.text);
      }
      continue;
    }
    // 消息类型值表：24.501 §9.7 / 24.301 §9.8 / 24.008 与 44.018 §10.4 / 24.011 §8.1-8.2
    // 一类——原样保留行文本供建库解析。23.040 的 TP-MTI 值是散文（§9.2.3.1），无类型值表。
    // 29.274：§6.1-1 消息类型值表（§6.1 标题段无 Heading 样式，表落在 6.1.0 'Message Type'
    // 标题下）+ §8.1-1 IE 类型值表——节号精确匹配防 6.1.x/8.1.x 子节混入
    if (spec === '29274' && curH3 && /^(6\.1|6\.1\.0|8\.1)$/.test(curH3.num || '')) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    const ttRe = spec === '24008' || spec === '44018' ? /^10\.4[a-z]?\b/
      : spec === '24011' ? /^8\.[12]\b/
      : spec === '23040' ? null
      : /^9\.[78]\b/;
    if (ttRe && curH3 && ttRe.test(curH3.num) && /message type/i.test(curH3.title)) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    // CSN.1 文法表（Rest Octets / Classmark 3，批次D）：含 '::=' 的格原样留存。
    // 节归属优先级：① 根定义名 ↔ 节标题（'<IAR Rest Octets>' ↔ '10.5.2.17 IAR Rest Octets'；
    // 旧节题注会滞留在 paras 里跨节泄漏，题注不可信）；② 题注 'Table 10.5.2.78.1:'（IPA 等
    // 节标题无 Heading 样式且定义名不匹配时）；③ 表 heading。
    if (it.rows.some((r) => r.some((c) => (c.text || '').includes('::=')))) {
      const cells = it.rows.flat().filter((c) => (c.text || '').includes('::=')).map((c) => c.text);
      const hSec = it.heading ? (it.heading.text.match(/^\s*((?:\d+\.)+\d+[a-z]?)\s/) || [])[1] || null : null;
      const capSec = (it.paras || []).map((p) => /^Table\s+(\d+(?:\.\d+)+[a-z]?)\s*\.\s*\d+\s*:/i.exec(p)).find(Boolean);
      let sec = capSec ? capSec[1] : hSec;
      const dm = cells[0] ? /<\s*([^<>:]+?)\s*>\s*::=/.exec(cells[0]) : null;
      if (dm) {
        const dk = dm[1].replace(/\s+/g, '').toLowerCase();
        // 限定 §10.5 IE 定义区——§9 消息区存在同名子标题（9.1.20.4 'IAR Rest Octets' 实测）
        const secByTitle = (sections || []).find((s) => /^10\.5/.test(s.num)
          && (s.title || '').replace(/\s+/g, '').toLowerCase() === dk);
        if (secByTitle) sec = secByTitle.num;
      }
      if (sec) {
        csn1Tables.push({
          section: sec,
          title: (it.heading ? it.heading.text.replace(/^\s*\S+\s+/, '') : '') || (capSec ? it.paras.find((p) => /^Table/i.test(p)) || '' : ''),
          cells,
        });
        continue;
      }
    }
    // 29.274 §8.x IE 位布局表（gutter 形——parseBitTable 不识别）：布局直出
    if (spec === '29274') {
      const gt = parseGtpIeTable(it.rows);
      if (gt) {
        const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
        bits.push({ section: sh.num, name: sh.title, figure: it.paras?.find((p) => /^Figure/i.test(p)) || null, octets: gt.octets, ...(gt.warnings && gt.warnings.length ? { warnings: gt.warnings } : {}) });
        continue;
      }
    }
    const bt = parseBitTable(it.rows);
    if (bt) {
      const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
      bits.push({ section: sh.num, name: sh.title, figure: it.paras?.find((p) => /^Figure/i.test(p)) || null, octets: bt.octets });
      continue;
    }
    // 23.040 TPDU 参数表（Abbr./Reference/P/R/Description）→ 原样入 msgs，行翻译在 buildSchema23040
    if (spec === '23040') {
      const pt = parseSmsElementsTable(it.rows);
      if (pt) {
        const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
        // 同节双变体（RP-ERROR / RP-ACK）靠正文 '(i) … for RP-ERROR' 行区分，后缀进名称
        const variant = (it.paras || []).map((p) => /^\((?:i|ii|iii)+\)\s+.+?\s+for\s+(RP-ACK|RP-ERROR)\s*\.?$/i.exec(p)).find(Boolean);
        // 节号字母后缀（'9.2.2.1a'）被 splitHeading 拆进标题 → 剥小写字母前缀
        const base = (sh.title || '').replace(/^[a-z]\s+/, '').replace(/\s*type\s*$/i, '').trim();
        msgs.push({
          section: sh.num,
          tableId: null,
          name: variant ? `${base} (${variant[1].toUpperCase()})` : base,
          kind: 'message',
          direction: null,
          rows: pt,
        });
        continue;
      }
    }
    // 29.274 §7.x 消息内容表 / 分组 IE 内容表（5 列：Information elements|P|Condition|IE Type|Ins.）
    if (spec === '29274') {
      const gm = parseGtpMsgRows(it.rows);
      if (gm) {
        const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
        msgs.push({
          section: sh.num,
          tableId: null,
          name: gm.groupName || sh.title,
          kind: gm.groupName ? 'grouped' : 'message',
          direction: null,
          groupName: gm.groupName,
          rows: gm.rows,
        });
        continue;
      }
    }
    const mt = parseMessageTable(it.rows);
    if (mt) {
      const cap = parseCaption(it.paras) || (mt.capText ? parseCaption([mt.capText]) : null);
      const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
      const dirP = (it.paras || []).find((p) => /^Direction:/i.test(p));
      // 24.011 无 'Direction:' 段——方向在正文 'sent in MSC -> MS direction'（RP 消息按方向
      // 分 MTI 值，解析失手则建库按类型表全方向展开，wire 仍正确）
      let direction = dirP ? dirP.replace(/^Direction:\s*/i, '') : null;
      if (!direction && (spec === '24011' || spec === '23040')) {
        for (const p of it.paras || []) {
          const dm = /\b(MSC|network|mobile station|MS)\s*(?:->|—)\s*(MSC|network|mobile station|MS)\b/i.exec(p);
          if (dm) {
            const side = (s) => /^msc$|^network$/i.test(s) ? 'network' : 'ms';
            direction = `${side(dm[1])} to ${side(dm[2])}`;
            break;
          }
        }
      }
      // 24.008 的消息名在正文段 'Message type: IDENTITY REQUEST'（caption 名是大写下划线形态）
      const mtName = (it.paras || []).map((p) => /^Message type:\s*(.+)$/i.exec(p)).find(Boolean);
      const name = (spec === '24008' && mtName ? mtName[1].trim() : null) || cap?.name || sh.title;
      msgs.push({
        section: sh.num,
        tableId: cap?.tableId || null,
        name,
        kind: cap?.kind || 'other',
        direction,
        rows: mt.rows,
      });
      continue;
    }
    // 值域表（位图 figure 的配套 prose 表）：'Follow-on proceed (octet 1)' + 'Bit' + '4'
    // 行组 / 'CS Domain TSC Set (octet 2): …\nBit\n1 2' 巨格——位号锚点来源（v1.13 走查纠偏）
    if (it.rows.some((r) => r.some((c) => /\(\s*octet\s+\d+\s*[,)]/i.test(c.text) || /^\s*bits?\s*:?\s*$/i.test(c.text.trim())))) {
      const sh = it.heading ? splitHeadingSfx(it.heading.text) : { num: null, title: null };
      valueTables.push({ section: sh.num, title: sh.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    other++;
  }
  // 散文别名（10.5.x 无文法表节）：'coded as the SI 16 Rest Octets' / 'defined as the SI 18 …'
  // （SI17→SI16、SI20→SI18 实测）——csn1 条目带 alias 字段，建库时池内检索根定义
  const csn1Secs = new Set(csn1Tables.map((t) => t.section));
  for (const [sec, text] of secProse) {
    if (csn1Secs.has(sec) || !/^10\.5/.test(sec)) continue;
    const am = /(?:coded|defined) as (?:the )?(?:described in [^.]*?)?SI\s?(\d+[a-z]?)\s*(?:Rest Octets)?/i.exec(text);
    if (am) {
