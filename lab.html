    .map((b) => b.toString(16).padStart(2, '0')).join('');

// 半八位组打包：type 1 IE 的 (iei<<4)|value。
// 24.501 的半八位组 IEI 用满 0-15（F = SMS indication / Release assistance /
// Allowed SSC mode 等，与 24.007 的 '1111 保留' 不同），故上限取 15。
function encHalf(iei, value) {
  if (iei < 0 || iei > 15) throw new Error(`TV1 IEI 越界 (0-15): ${iei}`);
  if (value < 0 || value > 15) throw new Error(`TV1 值越界 (0-15): ${value}`);
  return (iei << 4) | value;
}

// 半八位组行序列 → 字节流（TS 24.007 §11.2.1：先出现者占低半；奇数尾行占低半、高半补 0）。
// 供独立半八位组序列打包用；消息内 VH 行的配对由 codec.planVhRun 处理。
function packHalfOctets() {
  const nibbles = [];
  return {
    push(n) {
      if (n < 0 || n > 15) throw new Error(`半八位组越界: ${n}`);
      nibbles.push(n);
    },
    bytes() {
      const out = new Uint8Array(Math.ceil(nibbles.length / 2));
      for (let i = 0; i < nibbles.length; i++) {
        if (i % 2 === 0) out[i >> 1] |= nibbles[i] & 0x0f; // 低半
        else out[i >> 1] |= (nibbles[i] & 0x0f) << 4; // 高半
      }
      return out;
    },
  };
}

const isBytes = (v) => v instanceof Uint8Array || (Array.isArray(v) && v.every((x) => typeof x === 'number'));

// 格式框架编码。val：字节序列（T 为 null；TV1 为 0-15 数值）。
// 返回 Uint8Array。
function encIE(format, iei, val) {
  switch (format) {
    case 'V':
      return Uint8Array.from(val);
    case 'T':
      return Uint8Array.of(iei);
    case 'TV':
      return Uint8Array.of(iei, ...val);
    case 'TV1':
      return Uint8Array.of(encHalf(iei, val));
    case 'LV':
    case 'LV-E': {
      if (!isBytes(val)) throw new Error('LV 值必须是字节序列');
      const e = format === 'LV-E';
      const len = val.length;
      if (!e && len > 255) throw new Error(`LV 长度溢出: ${len}`);
      if (e && len > 65535) throw new Error(`LV-E 长度溢出: ${len}`);
      return e ? Uint8Array.of((len >> 8) & 0xff, len & 0xff, ...val) : Uint8Array.of(len, ...val);
    }
    case 'TLV':
    case 'TLV-E': {
      if (!isBytes(val)) throw new Error('TLV 值必须是字节序列');
      const e = format === 'TLV-E';
      const len = val.length;
      if (!e && len > 255) throw new Error(`TLV 长度溢出: ${len}`);
      if (e && len > 65535) throw new Error(`TLV-E 长度溢出: ${len}`);
      return e
        ? Uint8Array.of(iei, (len >> 8) & 0xff, len & 0xff, ...val)
        : Uint8Array.of(iei, len, ...val);
    }
    default:
      throw new Error(`未知 IE 格式: ${format}`);
  }
}

// 格式框架解码。bytes/offset → { value, next }。
// TV1 返回半八位组数值（含 IEI 可由调用方按 (b>>4) 提取）。
function decIE(format, iei, bytes, off = 0) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  const need = (n, what) => {
    if (off + n > u8.length) throw new Error(`IE 截断（${what} 需要 ${n} 字节，余 ${u8.length - off}）`);
  };
  switch (format) {
    case 'V':
      return { value: u8.slice(off), next: u8.length }; // 定长 V 的裁剪由调用方按 IE 定义处理
    case 'T': {
      need(1, 'T');
      return { value: null, next: off + 1 };
    }
    case 'TV1': {
      need(1, 'TV1');
      return { value: u8[off] & 0x0f, next: off + 1 };
    }
    case 'TV': {
      need(1, 'TV IEI');
      // TV 值定长：由 IE 定义给出；这里返回剩余全部，调用方裁剪。
      return { value: u8.slice(off + 1), next: u8.length };
    }
    case 'LV':
    case 'LV-E': {
      const e = format === 'LV-E';
      need(e ? 2 : 1, '长度');
      const len = e ? (u8[off] << 8) | u8[off + 1] : u8[off];
      const hlen = e ? 2 : 1;
      need(hlen + len, 'LV 值');
      return { value: u8.slice(off + hlen, off + hlen + len), next: off + hlen + len };
    }
    case 'TLV':
    case 'TLV-E': {
      const e = format === 'TLV-E';
      need(e ? 3 : 2, 'IEI+长度');
      const len = e ? (u8[off + 1] << 8) | u8[off + 2] : u8[off + 1];
      const hlen = e ? 3 : 2;
      need(hlen + len, 'TLV 值');
      return { value: u8.slice(off + hlen, off + hlen + len), next: off + hlen + len };
    }
    default:
      throw new Error(`未知 IE 格式: ${format}`);
  }
}

// ==== src/nas/csn1.js ====
// csn1.js — CSN.1 位级运行时：AST（tools/csn1parse.js 产物）→ 解码树 + 编码回放。
// 记法权威：TS 24.007 Annex B；L/H = 填充位值/另一值（GSM 全零填充 → L='0'、H='1'）。
// 关键解码策略：
//   - 截断假定（44.018 'truncation … bits "L" assumed'）：越界读按 L(0) 假定并告警一次
//   - <spare padding> 吞到区域尾（接收方任意位可接受），编码按 GSM 填充八位组 0x2B 补齐
//   - 外部结构引用（44.060 等）→ Csn1External：部分解码 + 原始尾位保留（诚实降级）
//   - choice 判别折叠：候选支前导固定终端（0/1/L/H/null）即判别位；null 支仅在位耗尽时选中
// trace 形态（编码回放序）：{d,kind,...}
//   fixed {bits} ｜ field {name,bits,value} ｜ choice {alt} ｜ mark {name,value}（零位记录）
//   spare {bits} ｜ pad {start} ｜ rep {n} ｜ bitstring {name,value(hex)} ｜ ext {name,bits}

class Csn1External extends Error {
  constructor(name) {
    super('外部结构引用: ' + name);
    this.name = 'Csn1External';
    this.extName = name;
  }
}

// ---------- 位读取 ----------
class Csn1BitReader {
  constructor(bytes, bitOff = 0, areaBits = (bytes.length * 8) - bitOff) {
    this.bytes = bytes;
    this.pos = bitOff;
    this.end = bitOff + areaBits; // 区域位界（消息尾即区域尾）
    this.truncated = false;
  }
  get left() { return this.end - this.pos; }
  get exhausted() { return this.pos >= this.end; }
  readBit() {
    if (this.pos >= this.end) {
      this.truncated = true;
      return 0; // 截断假定：缺失位按 L(0)
    }
    const byte = this.bytes[this.pos >> 3];
    const bit = (byte >> (7 - (this.pos & 7))) & 1;
    this.pos++;
    return bit;
  }
  peekBit() {
    if (this.pos >= this.end) return null; // 无位可窥（区别于截断假定）
    return (this.bytes[this.pos >> 3] >> (7 - (this.pos & 7))) & 1;
  }
  readBits(n) {
    let v = 0;
    for (let k = 0; k < n; k++) v = v * 2 + this.readBit();
    return v; // ≤53 位精确（VSTK_RAND 36 / TLLI 32 均覆盖）
  }
  readBitsStr(n) {
    let s = '';
    for (let k = 0; k < n; k++) s += this.readBit();
    return s;
  }
}

// ---------- 值表达式（A2：val(Name) 与 + - * /） ----------
function evalExpr(e, scope) {
  if (e == null) return 0;
  if (e.t === 'num') return e.v;
  if (e.t === 'val') {
    const v = scope.get(String(e.name || '').replace(/\s+/g, ' ').trim().toLowerCase());
    if (v == null) throw new Csn1External('val(' + e.name + ')');
    return v;
  }
  if (e.t === 'bin') {
    const a = evalExpr(e.a, scope);
    const b = evalExpr(e.b, scope);
    switch (e.op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b ? Math.floor(a / b) : 0;
      default: throw new Error('未知运算符 ' + e.op);
    }
  }
  if (e.t === 'call') {
    // AZ 批（v1.57.0）：函数记法（csn1parse §11.2.21 max(val(X)) 同款 AST）——
    // 重复上界聚合；未知函数名显式炸（不猜语义）。
    const args = (e.args || []).map((a) => evalExpr(a, scope));
    if (e.fn === 'max') return args.length ? Math.max(...args) : 0;
    if (e.fn === 'min') return args.length ? Math.min(...args) : 0;
    if (e.fn === 'ceil') return Math.ceil(args[0]);
    if (e.fn === 'floor') return Math.floor(args[0]);
    throw new Error('未知函数 ' + e.fn);
  }
  throw new Error('表达式不可求值');
}
function countOf(n, scope) {
  if (n == null) return 1;
  if (n.k === 'num') return n.v;
  return evalExpr(n.e, scope);
}

// ---------- 解码 ----------
// defs: Map(normName → body AST)；areaBytes 为 rest octets 区域字节数（编码回填用）
function csn1Decode(defs, root, bytes, { bitOff = 0, areaBytes = bytes.length - (bitOff >> 3) } = {}) {
  const warnings = [];
  const trace = [];
  const scope = new Map(); // 字段值 val() 查找表（名字归一）
  const r = new Csn1BitReader(bytes, bitOff, areaBytes * 8);
  let extHit = null;
  let depth = 0;

  const warn = (m) => { if (warnings.length < 40 && !warnings.includes(m)) warnings.push(m); };

  // 支路判别折叠：返回 {tag, tagLen, eqField, valtag, body} 或 null（无判别）
  function altTag(alt) {
    if (!alt) return { tag: '', tagLen: 0, headCount: 0, body: alt }; // null 支
    const items = alt.t === 'seq' && alt.items ? alt.items : [alt];
    // 前导 fixed 终端整串为判别（'{ LL <…> }' 两位判别实测——只取首项会把 LL 误作单位 L；
    // LL 粘词解析产物是内嵌 seq，下钻一层收齐）
    let tag = '';
    let i = 0;
    while (i < items.length && items[i]) {
      const it = items[i];
      if (it.t === 'fixed') { tag += it.bits; i++; continue; }
      if (it.t === 'seq' && it.items && it.items.every((x) => x && x.t === 'fixed')) {
        tag += it.items.map((x) => x.bits).join('');
        i++;
        continue;
      }
      break;
    }
    if (tag) return { tag, tagLen: tag.length, headCount: i, body: alt };
    const first = items[0];
    if (first && first.t === 'eqbit') return { tag: first.eq === 'L' ? 'L' : 'H', tagBits: first.eq === 'L' ? '0' : '1', tagLen: 1, headCount: 1, eqField: first, body: alt };
    if (first && first.t === 'valtag') {
      const len = first.values[0].length;
      return { tag: first.values[0], tagBits: null, tagLen: len, headCount: 1, valtag: first, body: alt };
    }
    return null;
  }

  function decodeNode(node) {
    if (extHit) return;
    switch (node.t) {
      case 'null':
        return;
      case 'seq': {
        for (const it of node.items) decodeNode(it);
        return;
      }
      case 'fixed': {
        const n = node.bits.length;
        const got = r.readBitsStr(n);
        const want = [...node.bits].map((c) => (c === 'L' ? '0' : c === 'H' ? '1' : c)).join('');
        if (got !== want && !r.truncated) warn(`固定位不符: 期望 ${want} 读到 ${got}`);
        trace.push({ d: depth, kind: 'fixed', bits: node.bits, got, at: r.pos - n });
        return;
      }
      case 'bits': {
        if (process.env.CSN1_DEBUG) console.error('[bits]', node.name, 'pos-before', r.pos);
        const n = countOf(node.n, scope);
        if (n <= 0) return;
        const v = r.readBits(n);
        if (node.exclude != null) {
          // v1.53.0 AU：多排除值 '|' 连接（44.060 CD_LENGTH 双 exclude 实测）逐值比对
          const exs = String(node.exclude).split('|');
          const vs = v.toString(2).padStart(n, '0');
          if (exs.some((e) => vs === expand(e))) {
            warn(`字段 ${node.name} 取到排除值 ${node.exclude}（保留值）`);
          }
        }
        if (node.name) scope.set(csn1ScopeKey(node.name), v);
        trace.push({ d: depth, kind: 'field', name: node.name, bits: n, value: v, at: r.pos - n });
        return;
      }
      case 'octets': {
        const n = countOf(node.n, scope) * 8;
        if (n <= 0) return;
        const v = r.readBits(n);
        if (node.name) scope.set(csn1ScopeKey(node.name), v);
        trace.push({ d: depth, kind: 'field', name: node.name, bits: n, value: v, octets: true });
        return;
      }
      case 'bitstring': {
        const n = Math.max(0, r.left);
        const s = r.readBitsStr(n);
        if (node.name) trace.push({ d: depth, kind: 'bitstring', name: node.name, bits: n, value: bitsToHex(s) });
        else trace.push({ d: depth, kind: 'bitstring', name: 'bit string', bits: n, value: bitsToHex(s) });
        return;
      }
      case 'eqbit': {
        const v = r.readBit();
        const want = node.eq === 'L' ? 0 : 1;
        if (v !== want && !r.truncated) warn(`值约束位 ${node.name}: 期望 ${node.eq}(${want}) 读到 ${v}`);
        scope.set(csn1ScopeKey(node.name), v);
        trace.push({ d: depth, kind: 'field', name: node.name, bits: 1, value: v, eq: node.eq, at: r.pos - 1 });
        return;
      }
      case 'valtag': {
        const len = node.values[0].length;
        const got = r.readBitsStr(len);
        const want0 = [...node.values[0]].map((c) => (c === 'L' ? '0' : c === 'H' ? '1' : c)).join('');
        const want1 = node.values[1] ? [...node.values[1]].map((c) => (c === 'L' ? '0' : c === 'H' ? '1' : c)).join('') : null;
        const ok = got === want0 || (want1 != null && got === want1);
        if (!ok && !r.truncated) warn(`值组 ${node.name}: 读到 ${got}，允许 {${node.values.join('|')}}`);
        const v = parseInt(got, 2);
        scope.set(csn1ScopeKey(node.name), v);
        trace.push({ d: depth, kind: 'field', name: node.name, bits: len, value: v, allowed: node.values });
        return;
      }
      case 'spare': {
        const n = countOf(node.n, scope);
        if (n > 0) {
          r.readBits(n);
          trace.push({ d: depth, kind: 'spare', bits: n });
        }
        return;
      }
      case 'pad': {
        const n = Math.max(0, r.left);
        r.readBits(n);
        trace.push({ d: depth, kind: 'pad', start: r.pos - n, bits: n });
        return;
      }
      case 'ref': {
        const key = csn1ScopeKey(node.name);
        const body = defs.get(key);
        if (!body) throw new Csn1External(node.raw || node.name);
        decodeNode(body);
        return;
      }
      case 'typed': {
        depth++;
        trace.push({ d: depth, kind: 'mark', name: node.name, open: true });
        decodeNode(node.body);
        trace.push({ d: depth, kind: 'mark', name: node.name, open: false });
        depth--;
        return;
      }
      case 'choice': {
        if (process.env.CSN1_DEBUG) console.error('[choice] pos-before', r.pos);
        depth++;
        // 判别折叠
        const tagged = node.alts.map((a) => ({ a, t: altTag(a) }));
        const withTag = tagged.filter((x) => x.t && x.t.tagLen > 0);
        const nullAlts = tagged.filter((x) => !x.t || x.t.tagLen === 0);
        let chosen = null;
        let tagGot = '';
        if (r.exhausted && nullAlts.length) {
          chosen = nullAlts[0]; // 位耗尽 → null 支（消息在此结束）
        } else if (withTag.length) {
          const tagLen = Math.max(...withTag.map((x) => x.t.tagLen));
          tagGot = r.readBitsStr(tagLen);
          // 混长判别（'00'/'01'/'1'）：按各支 tagLen 前缀匹配；选中后回退未消费的尾位
          const byPrefix = (x) => {
            const sub = tagGot.slice(0, x.t.tagLen);
            if (x.t.valtag) return x.t.valtag.values.some((v) => expand(v) === sub);
            return expand(x.t.tag) === sub;
          };
          chosen = withTag.find((x) => x.t.tagLen === tagLen && byPrefix(x))
            || withTag.find(byPrefix);
          if (chosen) {
            const used = chosen.t.tagLen;
            r.pos -= tagLen - used; // 回退多读的判别尾位（归支体）
            tagGot = tagGot.slice(0, used);
          } else {
            chosen = nullAlts[0] || withTag[0];

// bytes 长度 = areaBytes；GSM 填充八位组 0x2B（00101011）从区域首铺满，再叠加内容位——

    pos++;

      case 'fixed': {
        const want = [...op.bits].map((c) => (c === 'L' ? '0' : c === 'H' ? '1' : c)).join('');

        break;

        break;

        if (depth === 1 && parts.length && parts[parts.length - 1].k === 'colon') {
          parts.push(t);
          this.next();
          continue;
        }
        depth--;
        if (depth === 0) { this.next(); break; }
        parts.push(t);
        this.next();
        continue;
      }
      // 规范笔误容差：'}' 出现在未闭合角度内 → 视作提前闭合（不消费）
      // （'< Timing Advance : bit (6) }' 实测）；但角内花括号组的 '}' 除外——
      // 按 lb 深度判归属（'<X : { 1 < ref > } ** 0>' 内联重复实测）；
      // ';' 当标签分隔（'< EC Page Extension ; bit (4) >' 实测，花括号内同理不触发）
      if (t.k === 'lb') { braceDepth++; parts.push(t); this.next(); continue; }
      if (t.k === 'rb') {
        if (braceDepth > 0) { braceDepth--; parts.push(t); this.next(); continue; }
        break;
      }
      if (braceDepth === 0 && t.k === 'semi') break;
      if (depth > 1 && t.k === 'def') break; // '>> ::= ' 缺闭合级联：内角未闭遇 ::= → 提前闭合
      parts.push(t);
      this.next();
    }
    // 顶层 ':' 或 '::='（< Priority1 ::= Priority > 实测变体）作标签分隔
    let colon = -1;
    let d2 = 0;
    for (let x = 0; x < parts.length; x++) {
      if (parts[x].k === 'lt') d2++;
      else if (parts[x].k === 'gt') d2--;
      else if (d2 === 0 && (parts[x].k === 'def' || parts[x].k === 'colon' || parts[x].k === 'semi')) { colon = x; break; }
    }
    if (colon < 0) {
      // trailing 取原始 parts 切片（含括号）——fieldFromWords 的 'bit (n)' 正则依赖字面括号
      // 两级候选：① 名字头非空的尾部描述（'<TLLI / G-RNTI bit (32)>' 实测）；
      // ② 内联类型（'< relative_position: < bit (1 + val(modulus)) >>' 实测，体=类型描述，
      //    须能解析为字段才接受——'<spare padding>' 的 'spare' 是名字本体，由此排除）
      for (const start of [1, 0]) {
        for (let x = start; x < parts.length; x++) {
          if (parts[x].k === 'word' && /^(bit|string|octet|spare)$/i.test(parts[x].v)) {
            const cand = parts.slice(x);
            const head = parts.slice(0, x).filter((p) => p.k === 'word' || p.k === 'n01').map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
            if (!head) {
              if (start === 0 && this.fieldFromWords('inline', cand)) {
                return { name: 'inline', kind: 'ref', trailing: cand };
              }
              continue;
            }
            return { name: head, kind: 'ref', trailing: cand };
          }
        }
      }
      const name = parts.filter((p) => p.k === 'word' || p.k === 'n01').map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
      if (!name) throw new Error('空引用名');
      return { name, kind: 'ref', trailing: null };
    }
    const nameWords = parts.slice(0, colon).filter((p) => p.k === 'word' || p.k === 'n01');
    const name = nameWords.map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
    return { name, kind: 'labeled', descParts: parts.slice(colon + 1) };
  }

  // 选择列表：seq (bar seq)*；mode: 'top'（定义体）| 'brace'（{} 内）
  parseAltList(mode) {
    const alts = [this.parseSeq(mode)];
    while (this.isBarToken()) {
      this.next();
      alts.push(this.parseSeq(mode));
    }
    if (alts.length === 1) return alts[0];
    return { t: 'choice', alts };
  }

  parseSeq(mode) {
    const items = [];
    for (;;) {
      const t = this.peek();
      if (!t) break;
      if (t.k === 'semi' || t.k === 'rb') break;
      if (this.isBarToken()) break;
      if (mode === 'top' && (t.k === 'def' || (t.k === 'lt' && this.looksLikeDef()))) break; // 无分号定义衔接
      items.push(this.parseItem());
      this.parseSuffix(items);
      if (this.is('eq')) { // 'bit ** = <no string>' 语义注解（= 后随角度整体丢弃）
        this.next();
        if (this.is('lt')) { this.parseAngle(); }
      }
      this.relabelColon(items); // '<FDD_ARFCN> : bit(14)' 冒号在外变体
    }
    if (items.length === 0) return { t: 'null' };
    if (items.length === 1) return items[0];
    return { t: 'seq', items };
  }

  // 重复后缀（A2）：**(expr) / ** 0 空终止 / *(expr) / * term 短记法 / (n) 定长
  parseSuffix(items) {
    for (;;) {
      if (this.is('star2') || this.is('star')) {
        const tk = this.next();
        let count;
        if (this.is('lp')) {
          this.next();
          const e = this.parseExpr();
          if (!this.is('rp')) throw new Error('重复表达式缺 )');
          this.next();
          count = { k: 'expr', e };
        } else if (tk.k === 'star2' && this.is('n01')) {
          count = { k: 'nullterm', tag: this.next().v }; // ** 0：读到位标记即停
        } else if (this.is('word') && !this.isBarToken()) {
          count = { k: 'expr', e: this.parseExprTerm() }; // * val(X) 单项短记法
        } else if (this.is('n01')) {
          count = { k: 'expr', e: this.parseExprTerm() };
        } else {
          count = { k: 'star' };
        }
        items.push({ t: 'rep', body: items.pop(), count });
        continue;
      }
      if (this.is('lp')) {
        const save = this.i;
        this.next();
        if (this.is('star')) { // '( *)' 无界（A2 星号指数）
          this.next();
          if (this.is('rp')) this.next();
          items.push({ t: 'rep', body: items.pop(), count: { k: 'star' } });
          continue;
        }
        try {
          const e = this.parseExpr();
          if (!this.is('rp')) throw 0;
          this.next();
          items.push({ t: 'rep', body: items.pop(), count: { k: 'expr', e } });
          continue;
        } catch {
          this.i = save;
        }
      }
      break;
    }
  }

  // 冒号在外变体：ref 项后跟 ':' + 描述 → 改写为 labeled 字段
  relabelColon(items) {
    if (!this.is('colon') || !items.length) return;
    const prev = items[items.length - 1];
    if (prev.t !== 'ref') { this.next(); return; } // 游离冒号丢弃
    this.next();
    const desc = [];
    while (this.peek() && !CSN1_DELIM.has(this.peek().k) && !this.isBarToken()) desc.push(this.next());
    items[items.length - 1] = this.labeledNode(prev.raw || prev.name, desc);
  }

  parseItem() {
    const t = this.peek();
    if (!t) throw new Error('意外结尾');
    if (t.k === 'lb') return this.parseBrace();
    if (t.k === 'gt') { this.next(); return { t: 'null' }; } // 游离 '>'（'<X : ref>>' 双闭合实测）
    if (t.k === 'lt') return this.parseAngleItem();
    if (t.k === 'n01') { this.next(); return { t: 'fixed', bits: t.v }; }
    if (t.k === 'word') {
      const v = t.v;
      if (/^L$/i.test(v)) { this.next(); return { t: 'fixed', bits: 'L' }; }
      if (/^H$/i.test(v)) { this.next(); return { t: 'fixed', bits: 'H' }; }
      if (/^[LH]+$/i.test(v)) { // LL/LH 粘词（IA '{ LL <' 实测）→ 单位串
        this.next();
        return { t: 'seq', items: [...v.toUpperCase()].map((ch) => ({ t: 'fixed', bits: ch })) };
      }
      if (/^null$/i.test(v)) { this.next(); return { t: 'null' }; }
      if (/^bit$/i.test(v)) { this.next(); return { t: 'bits', name: 'bit', n: 1 }; } // B.1.3 裸 bit
      if (/^(I|or)$/i.test(v)) { this.next(); return { t: 'null' }; } // 伪影兜底
      if (/^reserved$/i.test(v)) { this.next(); return { t: 'null' }; } // v1.53.0 AU：值保留裸词备选（44.060 §11.2.0.1 '< … == 1 10101 > reserved |' 实测）
      if (/^[.·]+$/.test(v)) { this.next(); return { t: 'null' }; } // v1.53.0 AU：docx 提取散点噪声（'< … struct > ::= . { 0 | 1 …' §11.2.21 实测）
      if (v === '&') { this.next(); return { t: 'null' }; } // v1.55.0 AX：CSN.1 '&' 值连接符作拼接跳过（44.060 §12.3.1 '< bit (val(L)) > & < struct >' 实测——体级；标签描述内的 & 仍拦）
      if (/^z$/i.test(v)) { this.next(); return { t: 'null' }; } // v1.53.0 AU：'< padding bits >z' 散点（§11.2.17c 实测——z=填充尾标记伪影）
      if (/^-$/.test(v)) { this.next(); return { t: 'null' }; } // 游离 '-' 噪声（散文残段）
      // 缺尖括号字段容错：本词起 K token 内有冒号（中间只许 word/bits）→ 词到冒号为名
      // （'BSIC : bit (6)' / 'E-UTRAN Measurement Parameters Description : <…>' EC 实测）
      for (let o = 1; o <= 8; o++) {
        const nt = this.peek(o);
        if (!nt || CSN1_DELIM.has(nt.k) || this.isBarTokenAt(o)) break;
        if (nt.k === 'colon') {
          this.next();
          while (!this.is('colon')) this.next();
          this.next();
          const desc = [];
          while (this.peek() && !CSN1_DELIM.has(this.peek().k) && !this.isBarToken()) desc.push(this.next());
          return this.labeledNode(v, desc);
        }
        if (!['word', 'n01'].includes(nt.k)) break;
      }
      throw new Error(`意外词元 ${v} 上下文: ${this.ctx()}`);
    }
    throw new Error(`意外词元 ${t.k} 上下文: ${this.ctx()}`);
  }

  parseBrace() {
    this.next(); // {
    const body = this.parseAltList('brace');
    if (!this.is('rb')) {
      // AZ 批（v1.57.0）：花括号失衡容差——文档级少一个 '}'（§11.2.10 Repeated Iu Page
      // info struct / §11.2.23a PSI6 实测，剥注释后 lb=rb+1）。定义边界（';' / EOF /
      // 新定义头）处组必须收口，闭合位置无歧义——不消费边界词元，静默闭合。
      const t = this.peek();
      if (t && t.k !== 'semi' && !(t.k === 'lt' && this.looksLikeDef())) {
        throw new Error(`选择缺 } 上下文: ${this.ctx()}`);
      }
      return body;
    }
    this.next();
    return body;
  }

  parseAngleItem() {
    const a = this.parseAngle();
    if (a.kind === 'labeled') return this.labeledNode(a.name, a.descParts);
    if (a.trailing && a.trailing.length) {
      const node = this.fieldFromWords(a.name, a.trailing);
      if (node) return node;
    }
    const rk = csn1NormKey(a.name);
    if (rk === 'sparepadding') return { t: 'pad' };
    if (rk === 'sparebit') return { t: 'spare', n: 1 };
    if (rk === 'sparehalfoctet') return { t: 'spare', n: 4 };
    this.onRef(a.name);
    return { t: 'ref', name: csn1NormName(a.name), raw: a.name };
  }

  labeledNode(name, descParts) {
    if (!descParts.length) {
      const rk = csn1NormKey(name);
      if (rk === 'sparepadding') return { t: 'pad' };
      if (rk === 'sparebit') return { t: 'spare', n: 1 };
      this.onRef(name);
      return { t: 'ref', name: csn1NormName(name), raw: name };
    }
    // AZ 批（v1.57.0）：'< X : >Ref IE > >' 缺 '<' 容差（§11.2.6a 文档原样排版实测，
    // docx XML 逐字核实 ': >Channel Request Description IE > >' 系规范自身笔误）——
    // 描述以游离 '>' 开头时视为缺失的 '<'，语义唯一（引用名与标签名同构）。
    if (descParts[0] && descParts[0].k === 'gt') {
      try {
        // 首部 gt 是缺失 '<' 的伪影本体——剥掉再作引用解析（未闭合角由 parseAngle
        // 的名字提取兜底）。
        const sub = new Csn1Parser([{ k: 'lt' }, ...descParts.slice(1)]);
        const a = sub.parseAngle();
        if (a.name) return this.typedRefNode(name, a);
      } catch { /* 落后续兜底 */ }
    }
    // AZ 批（v1.57.0）：'bit (expr) & { 值组 ** 错误标签 }' 形（§12.8.3 Pulse Format
    // Bitmap 实测）——& 后组为编码侧值枚举/错误出口，解码建模为位段本身（AX '&' 体级
    // 拼接跳过的标签描述内同族收口）。
    const amp = descParts.findIndex((p) => p.k === 'word' && p.v === '&');
    if (amp > 0) {
      const fAmp = this.fieldFromWords(name, descParts.slice(0, amp));
      if (fAmp) return fAmp;
    }
    const flat = descParts.map((p) => (p.k === 'eq' ? '==' : p.k === 'colon' ? ':' : p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.k === 'lb' ? '{' : p.k === 'rb' ? '}' : p.k === 'bar' ? '|' : p.v ?? p.k)).join(' ');
    let m = /^bit\s*==\s*(L|H)$/i.exec(flat);
    if (m) return { t: 'eqbit', name, eq: m[1].toUpperCase() === 'L' ? 'L' : 'H' };
    // AZ 批（v1.57.0）：裸值组 '< X : 1 | 01 | 00 >'（§12.8.3 Non Hopping Carrier Pulse
    // Format 实测——值组花括号省略形）——全 n01/L/H/bar 描述直接按值组建模。
    if (descParts.length >= 3
      && descParts.every((p) => p.k === 'n01' || p.k === 'bar' || (p.k === 'word' && /^[LH]$/i.test(p.v)))) {
      const vals = this.parseValueGroup([{ k: 'lb' }, ...descParts, { k: 'rb' }]);
      if (vals.length) return { t: 'valtag', name, values: vals };
    }
    if (descParts.length === 1 && descParts[0].k === 'n01' && /^[01]+$/.test(descParts[0].v)) {
      return { t: 'valtag', name, values: [descParts[0].v] };
    }
    // 字面判别前缀（v1.43.0 AK，44.060 §11.1/11.2 实测 92 格）：'< MESSAGE_TYPE : 1 bit (5) >'
    // '< One Phase Access Request : 0 < MultislotClass : bit (5) > < Priority : bit (2) > … >'——
    // 判别位串 + 类型描述，等价展开为 fixed 前缀项 + 余下描述（字段词组走 fieldFromWords
    // 整体解析——parseItem 会把裸 'bit' 截成单项；内联角才逐项取全）。
    if (descParts.length >= 2 && descParts[0].k === 'n01' && /^[01]+$/.test(descParts[0].v)) {
      const restParts = descParts.slice(1);
      let restBody;
      if (restParts[0].k === 'lt') {
        const sub = new Csn1Parser(restParts);
        const items = [sub.parseItem()];
        // 停机集不含 lt——内联角是合法项起点（'< X : 0 < A > < B > >' 实测，lt 作分隔会截断）
        while (sub.peek() && !['rb', 'semi', 'def'].includes(sub.peek().k) && !sub.isBarToken()) items.push(sub.parseItem());
        restBody = items.length === 1 ? items[0] : { t: 'seq', items };
      } else {
        restBody = this.fieldFromWords(name, restParts);
        if (!restBody) throw new Error(`标签 ${name} 描述不可解析: ${flat.slice(0, 60)}`);
      }
      return { t: 'typed', name, body: { t: 'seq', items: [{ t: 'fixed', bits: descParts[0].v }, restBody] } };
    }
    if (descParts[0].k === 'lb') {
      // 双 exclude 值组（v1.53.0 AU 先于值组路径）：'{ bit ( 5 ) exclude 00000 exclude 11111 }'
      const w2 = descParts.map((p) => (p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.k === 'lb' ? '{' : p.k === 'rb' ? '}' : p.v ?? p.k)).join(' ');
      const me = /^\{\s*bit\s*\(\s*(\d+)\s*\)\s*((?:exclude\s+[01]+\s*)+)\}\s*$/.exec(w2);
      if (me) {
        const ex = [...me[2].matchAll(/exclude\s+([01]+)/gi)].map((x) => x[1]).join('|');
        return { t: 'bits', name, n: parseInt(me[1], 10) || ex.length, exclude: ex };
      }
      const vals = this.parseValueGroup(descParts);
      // 纯值组：全部 token 都是终端位串/L/H 与分隔（'<Multiband supported : { 101 | 110 }>' 实测）
      const pureGroup = descParts.every((p) => ['lb', 'rb', 'bar', 'n01'].includes(p.k)
        || (p.k === 'word' && /^[LH]$/i.test(p.v)));
      if (vals.length && pureGroup) return { t: 'valtag', name, values: vals };
      // 排除值组：'< NO_NCELL_M : { bit (3) := 111 } >'（':=' 为规范 '≠' 的 docx 伪影）
      {
        const w = descParts.map((p) => (p.k === 'def' ? ':=' : p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.v ?? p.k)).join(' ');
        const mx = /^\{\s*(?:bit(?:\s*string)?|spare\s*bit)\s*\(\s*(\d+)\s*\)\s*:=\s*([01]+)\s*\}$/i.exec(w);
        if (mx) return { t: 'bits', name, n: parseInt(mx[1], 10), exclude: mx[2] };
      }
      // 内联重复表达式：'<X : { 1 < ref struct > } ** 0>'（SI2n/14/15 实测）——按完整文法解析
      try {
        const sub = new Csn1Parser(descParts);
        const body = sub.parseSeq('brace');
        if (body && body.t !== 'null') return { t: 'typed', name, body };
      } catch { /* 落到后续兜底 */ }
    }
    if (descParts.length >= 2 && descParts[0].k === 'lt') {
      try {
        const sub = new Csn1Parser(descParts);
        const a = sub.parseAngle();
        // 内联类型形态 '<X: < bit (1 + val(modulus)) >>'——体是类型描述而非引用
        if (a.trailing && a.trailing.length) {
          const f = this.fieldFromWords(a.name, a.trailing);
          if (f) return { t: 'typed', name, body: f };
        }
        return this.typedRefNode(name, a);
      } catch { /* 落到类型描述 */ }
    }
    const f = this.fieldFromWords(name, descParts);
    if (f) return f;
    // 描述内嵌散文/散角：首段（到首个顶层 <）若可作字段则取之（'< Ignore : bit <no string>' 类实测）
    const cut = descParts.findIndex((p) => p.k === 'lt');
    if (cut > 0) {
      const f2 = this.fieldFromWords(name, descParts.slice(0, cut));
      if (f2) return f2;
    }
    const words = descParts.filter((p) => p.k === 'word' || p.k === 'n01');
    if (words.length && words.length === descParts.length) {
      const refName = words.map((p) => p.v).join(' ').replace(/\s+/g, ' ').trim();
      if (!/^(bit|string|octet|spare)/i.test(refName)) return this.typedRefNode(name, { name: refName });
    }
    throw new Error(`标签 ${name} 描述不可解析: ${flat.slice(0, 60)}`);
  }

  // { … } 值组：bits 串与 L/H 终端的并集（'<X : { 101 | 110 }>' / '<X : {L | H}>' 实测）
  parseValueGroup(descParts) {
    const sub = new Csn1Parser(descParts);
    sub.next(); // {
    const vals = [];
    for (;;) {
      const t = sub.peek();
      if (!t) break;
      if (t.k === 'n01') { vals.push(sub.next().v); continue; }
      if (t.k === 'word' && /^[LH]$/i.test(t.v)) { vals.push(sub.next().v.toUpperCase()); continue; }
      if (sub.isBarToken()) { sub.next(); continue; }
      if (t.k === 'rb') { sub.next(); break; }
      sub.next();
    }
    return vals;
  }

  typedRefNode(name, angle) {
    if (csn1NormKey(angle.name) === 'bitstring') return { t: 'bitstring', name };
    this.onRef(angle.name);
    return { t: 'typed', name, body: { t: 'ref', name: csn1NormName(angle.name), raw: angle.name } };
  }

  // 类型描述词组 → 字段节点
  fieldFromWords(name, toks) {
    // v1.53.0 AU：lb/rb/bar 补映射（'{ 0000 | 0010 }' 值组形态此前落字面 'lb' 永不中）
    const words = toks.map((p) => (p.k === 'eq' ? '==' : p.k === 'star2' ? '**' : p.k === 'star' ? '*' : p.k === 'lp' ? '(' : p.k === 'rp' ? ')' : p.k === 'lb' ? '{' : p.k === 'rb' ? '}' : p.k === 'bar' ? '|' : p.v ?? p.k)).join(' ');
    // 'bit-string(4)' 连字符变体（24008 §10.5.5.11 sapi 实测，v1.43.0 AK 收编）
    let m = /^(?:bit[-\s]*(?:string)?|bit)\s*\((.+)\)\s*$/i.exec(words);
    if (m) return { t: 'bits', name, n: this.exprOrNum(m[1]) };
    // 值约束位字段（'<modulus : bit (4) == 0000>' 实测）；v1.43.0 AK 收编值内空格形态
    // （'< MESSAGE_TYPE : bit (6) == 1 00001 >' 44.060 §11.2 顶层消息文法实测——剥空格归一）
    m = /^bit\s*\(\s*(\d+)\s*\)\s*==\s*((?:[01]\s*)+)$/i.exec(words) || /^(?:bit\s*string|bit)\s*==\s*([01]+)\s*$/i.exec(words);
    if (m) return { t: 'valtag', name, values: [m[2].replace(/\s+/g, '')] };
    m = /^bit\s*\(\s*(\d+)\s*\)\s*exclude\s*([01]+)\s*$/i.exec(words) || /^(?:bit\s*string|bit)\s*exclude\s*([01]+)\s*$/i.exec(words);
    if (m) return { t: 'bits', name, n: parseInt(m[1], 10) || m[2].length, exclude: m[2] }; // 值排除约束（SI9 modulus 实测）
    // 双 exclude 值组（v1.53.0 AU）：'< CD_LENGTH : { bit (5) exclude 00000 exclude 11111 } >'
    // （44.060 §11.2.9e/17a 实测）——多排除值 '|' 连接，csn1.js 解码侧拆分逐值比对。
    m = /^bit\s*\(\s*(\d+)\s*\)\s*((?:exclude\s+[01]+\s*)+)$/i.exec(words);
    if (m) {
      const ex = [...m[2].matchAll(/exclude\s+([01]+)/gi)].map((x) => x[1]).join('|');
      return { t: 'bits', name, n: parseInt(m[1], 10) || ex.length, exclude: ex };
    }
    m = /^bit\s*(\d+)\s*\)\s*$/i.exec(words);
    if (m) return { t: 'bits', name, n: parseInt(m[1], 10) }; // 'bit6 )' 括号丢失实测
    // 位字段 + 值组（v1.53.0 AU）：'< TBF_RELEASE_CAUSE : bit ( 4 ) { 0000 | 0010 } >' §11.2.26/56 实测
    m = /^bit\s*\(\s*(\d+)\s*\)\s*\{\s*([01 |]+)\s*\}\s*$/.exec(words);
    if (m) return { t: 'valtag', name, values: m[2].split('|').map((x) => x.replace(/\s+/g, '')).filter(Boolean) };
    m = /^bit\s*\(\s*(\d+)\s*\)\s*(?:>|gt)\s*$/.exec(words);
    if (m) return { t: 'bits', name, n: parseInt(m[1], 10) }; // 'bit ( 7 ) >' 游离 gt（§11.2.29 实测）
    m = /^bit\s*\(\s*(\d+)\s*$/.exec(words);
    if (m) return { t: 'bits', name, n: parseInt(m[1], 10) }; // 'bit ( 5' 缺右括号（§11.2.41 MS_ID 实测）
    if (/^bit$/i.test(words)) return { t: 'bits', name, n: 1 };
    if (/^bit\s*\*\*?$/i.test(words)) return { t: 'bitstring', name }; // bit** 无界（A2）
    if (/^octet\s*\*\*?$/.test(words)) return { t: 'bitstring', name }; // octet ** 无界（v1.53.0 AU：44.060 §11.2.17c/36/47 CONTAINER_DATA/Application Data 实测）
    m = /^octet\s*\((.+)\)\s*$/i.exec(words);
    if (m) return { t: 'octets', name, n: this.exprOrNum(m[1]) };
    m = /^spare\s*bit\s*\((.+)\)\s*$/i.exec(words);
    if (m) return { t: 'spare', n: this.exprOrNum(m[1]) };
    if (/^spare\s*bits?$/i.test(words)) return { t: 'pad' };
    return null;
  }
  exprOrNum(s) {
    const t = String(s).trim();
    if (/^\d+$/.test(t)) return { k: 'num', v: parseInt(t, 10) };
    const p = new Csn1Parser(csn1Tokenize(t));
    return { k: 'expr', e: p.parseExpr() };
  }

  // 算术表达式（A2）：数字 / val(Name) / Name / + - * / 与括号
  parseExpr() {
    let left = this.parseExprTerm();
    for (;;) {
      const t = this.peek();
      if (t && t.k === 'word' && /^[+\-*/]$/.test(t.v)) {
        this.next();
        left = { t: 'bin', op: t.v, a: left, b: this.parseExprTerm() };
        continue;
      }
      if (t && t.k === 'star') {
        this.next();
        left = { t: 'bin', op: '*', a: left, b: this.parseExprTerm() };
        continue;
      }
      break;
    }
    return left;
  }
  parseExprTerm() {
    const t = this.peek();
    if (!t) throw new Error('表达式意外结尾');
    if ((t.k === 'n01' || t.k === 'word') && /^\d+$/.test(t.v)) { this.next(); return { t: 'num', v: parseInt(t.v, 10) }; }
    if (t.k === 'lp') {
      this.next();
      const e = this.parseExpr();
      if (!this.is('rp')) throw new Error('表达式缺 )');
      this.next();
      return e;
    }
    if (t.k === 'word') {
      this.next();
      const w = t.v;
      if (/^val$/i.test(w) && this.is('lp')) {
        this.next();
        const nameParts = [];
        while (this.peek() && !this.is('rp') && !this.is('rb')) { nameParts.push(this.next().v); }
        if (this.is('rp')) this.next(); // 缺右括号容差（不越花括号）
        return { t: 'val', name: csn1NormName(nameParts.join(' ')) };
      }
      // AZ 批（v1.57.0）：函数记法 '* (1 + max(val(X)))'（§11.2.21 Neighbour Cell params
      // 2 struct 实测）——此前 max 落 val(max) 后遇 '(' 即断，rep 表达式报「缺 )」。
      if (this.is('lp')) {
        this.next();
        const args = [this.parseExpr()];
        while (this.peek() && !this.is('rp') && !this.is('rb')) { args.push(this.parseExpr()); }
        if (this.is('rp')) this.next();
        return { t: 'call', fn: csn1NormName(w), args };
      }
      return { t: 'val', name: csn1NormName(w) };
    }
    throw new Error('表达式不可解析: ' + t.k);
  }
}

// ---------- 顶层 ----------
// CSN.1 `!` 错误标签剥除（v1.53.0 AU）：`! <名 : bit (N|*) = < no string > [fallback]>`——
// 错误标签零编码（throw 位置），语义建模 = 整体剔除、`= < no string >` 后若带 fallback
// 角组则原位保留（44.060 §11.1.3.1 'Generic error labels' 53 项主形态 + §11.2.x 消息文法
// 尾部 `! < Unknown message type … >` 族——原词法把 ! 静默丢弃、标签体进标签解析炸 star/
// no string，整定义连坐失败 83 项中的 65 项）。平衡 <> 扫描；未闭合则截断到 ! 为止。
function stripCsn1ErrorLabels(text) {
  let src = String(text);
  let n = 0;
  for (;;) {
    const bang = src.indexOf('!');
    if (bang < 0) break;
    const start = src.indexOf('<', bang);
    if (start < 0) { src = src.slice(0, bang); n++; break; }
    let depth = 0;
    let j = start;
    for (; j < src.length; j++) {
      if (src[j] === '<') depth++;
      else if (src[j] === '>') { depth--; if (depth === 0) break; }
    }
    if (depth !== 0) { src = src.slice(0, bang); n++; break; } // 未闭合：截到 ! 为止
    const label = src.slice(start + 1, j);
    let repl = '';
    const m = /<\s*no\s*string\s*>/.exec(label);
    if (m) {
      const rest = label.slice(m.index + m[0].length);
      const f = /^([\s]*<[\s\S]*>)[\s]*$/.exec(rest);
      if (f) repl = f[1].trim(); // fallback 内容原位保留
    }
    src = src.slice(0, bang) + repl + src.slice(j + 1);
    n++;
  }
  // 裸 no-string 值形（v1.53.0 AU 二型）：{ 11 bit (*) = < no string > }——无 ! 无标签壳，
  // 位模式备选直接落 throw（44.060 §11.2.7 CARRIER_SPECIFIC_INFO 实测）；连前导判别位一起剔除。
  src = src.replace(/(?:[01]+\s+)?bit\s*(?:\(\s*\*\s*\)|\*\*)\s*=\s*<\s*no\s*string\s*>/g, () => { n++; return ''; });
  return { text: src, count: n };
}

// parseGrammar(cellText) → { defs:[{name,raw,body}], notes:[], refs:[...], errorLabels }
function parseGrammar(cellText) {
  const refs = new Set();
  const stripped = stripCsn1ErrorLabels(cellText);
  const p = new Csn1Parser(csn1Tokenize(stripped.text), { onRef: (n) => refs.add(csn1NormName(n)) });
  const { defs, notes } = p.parseUnit();
  return { defs, notes, refs: [...refs], errorLabels: stripped.count };
}

// ==== src/nas/gtpc.js ====
// src/nas/gtpc.js — GTPv2-C（TS 29.274）消息级编解码（schema 驱动）。
//
// 头（§5.1）：[flags: V3|P|T|spare3][Message Type(1)][Message Length(2)]
// [TEID(4) 若 T=1][Sequence Number(3)][Spare(1)]，头长恒为 4 的倍数（T=1 → 12，T=0 → 8）；
// Message Length = 头前 4 八位组之外的本消息全部字节（TEID/Seq/Spare 计入）——不含
// 内嵌消息：piggybacked 消息与前序 triggered response「shall have their own length」
// 各自带各自长度（原文 ¶952/¶953 实证）。
// IE 一律 TLIV（§8.2.1）：Type(1)+Length(2，不含 IE 自身前 4 八位组)+octet4(Spare|Instance)
// +content(Length 八位组)。行身份 = (IE Type, Instance 低半八位组)——同一 IE 类型可带不同
// Instance 在同消息多次出现（F-TEID 0-7 实证）；表行 Ins. 'VS'/空 = 实例通配（§6.1.3）。
// 未知 IE 按长度跳过（§7.7.9 前向兼容，note 记录）；缺失必配行报错（§7.7.6）。
// 分组 IE（§6.1.2）值 = 子 TLIV 串——解码按分组子行表递归展开挂 part.children（显示层
// 用），值不透明回写（编码层零感知）；采样器经 gtpcTli 递归构值。
// Piggybacking（§5.1/§7.7.0）：P=1 → 内嵌完整 GTPv2-C 消息（自带头与体）跟在本消息
// 4+Message Length 处（¶944），内嵌消息 P 位应为 0（¶945，一级为限——观测到 P=1 记
// warning 不再展开）。解码按 schema 类型表接续解码（piggy[] 返回，内嵌帧 hex 随行），
// 重编码经 hdr.piggy + hdr.piggyHex 字节保真回嵌（内嵌消息不参与字段编辑）；无 schema
// 诚实降级不展开。
// 头的 TEID/Sequence Number 是连接状态不是表内 IE：解码在 hdr 中返回，编码经 hdr 参数
// 还原（缺省 T=1/TEID=0/Seq=0——采样器与回环门禁用确定性零值）。

function gtpPresence(p) {
  const s = (p || '').trim();
  if (/^M$/i.test(s)) return 'M';
  if (/^C/i.test(s)) return 'C';
  return 'O';
}

function gtpRowType(r) {
  const s = String(r.iei ?? '').trim();
  return /^\d+$/.test(s) ? parseInt(s, 10) : null;
}

function gtpcHeader(u8) {
  if (!u8 || u8.length < 4) throw new Error('GTP-C 头截断');
  const flags = u8[0];
  const ver = flags >> 5;
  if (ver !== 2) throw new Error(`GTP 版本非 2: ${ver}`);
  const piggy = (flags >> 4) & 1;
  const t = (flags >> 3) & 1;
  const msgType = u8[1];
  const msgLen = (u8[2] << 8) | u8[3];
  let off = 4;
  let teid = null;
  if (t) {
    if (u8.length < 8) throw new Error('GTP-C 头截断（TEID）');
    teid = (((u8[4] << 24) | (u8[5] << 16) | (u8[6] << 8) | u8[7]) >>> 0);
    off = 8;
  }
  if (off + 4 > u8.length) throw new Error('GTP-C 头截断（Seq/Spare）');
  const seq = (u8[off] << 16) | (u8[off + 1] << 8) | u8[off + 2];
  const spare = u8[off + 3];
  off += 4;
  return { flags, ver, piggy, t, msgType, msgLen, teid, seq, spare, off };
}

// TLIV 三件套（分组 IE 采样构值用）：type + instance 低半 + content
function gtpcTli(type, ins, content) {
  return Uint8Array.from([type & 255, (content.length >> 8) & 255, content.length & 255, ins & 0x0f, ...content]);
}

// TLIV 行扫描（消息体与分组子体共用）：rows 按表序匹配 (Type, Instance)——从上次命中
// 行之后顺序找（乱序 M 行防御报错）；未知 IE 按长度跳过（§7.7.9）。
function gtpcWalk(rows, u8, start, end) {
  const notes = [];
  const parts = [];
  let off = start;
  let ri = 0;
  while (off + 4 <= end) {
    const type = u8[off];
    const len = (u8[off + 1] << 8) | u8[off + 2];
    const instN = u8[off + 3] & 0x0f;
    if (off + 4 + len > end) throw new Error(`IE 0x${type.toString(16)} 长度越界（${len}，余 ${end - off - 4}）`);
    let match = -1;
    for (let j = ri; j < rows.length; j++) {
      if (gtpRowType(rows[j]) !== type) continue;
      if (rows[j].ins != null && rows[j].ins !== instN) continue;
      match = j;
      break;
    }
    if (match < 0) {
      notes.push(`未知 IE（Type ${type}，实例 ${instN}）按长度跳过（§7.7.9）`);
      off += 4 + len;
      continue;
    }
    for (let j = ri; j < match; j++) {
      if (gtpPresence(rows[j].presence) === 'M' && gtpRowType(rows[j]) != null) {
        throw new Error(`必配行缺失: ${rows[j].name}（IE Type ${type}/实例 ${instN} 先行）`);
      }
    }
    parts.push({ row: rows[match], rowIdx: match, value: u8.slice(off + 4, off + 4 + len), ins: instN });
    off += 4 + len;
    ri = match + 1;
  }
  for (let j = ri; j < rows.length; j++) {
    if (gtpPresence(rows[j].presence) === 'M' && gtpRowType(rows[j]) != null) {
      throw new Error(`必配行缺失: ${rows[j].name}`);
    }
  }
  // end < off 只见于畸形 msgLen（小于头变量部长度）——由上层「Message Length 与帧长不符」
  // 注覆盖，这里不再报负数余量（审计轮合成畸形帧探针抓获）
  if (off < end) notes.push(`表尾余 ${end - off} 字节未匹配任何行`);
  return { parts, off, notes };
}

const gtpGroupOf = (schema, row) =>
  schema && row && row.def && schema.ies[row.def] && schema.ies[row.def].grouped;

// 分组 IE 子树解码：值按子行表再走一遍 TLIV 扫描，嵌套分组递归（显示层；值不透明回写）
function gtpcDecGroup(schema, rows, u8) {
  const walk = gtpcWalk(rows, u8, 0, u8.length);
  const notes = [...walk.notes];
  for (const p of walk.parts) {
    const g = gtpGroupOf(schema, p.row);
    if (!g || !p.value.length) continue;
    const sub = gtpcDecGroup(schema, g, p.value);
    p.children = sub.parts;
    notes.push(...sub.notes.map((n) => `${p.row.name}: ${n}`));
  }
  return { parts: walk.parts, notes };
}

function gtpcInstByType(schema, type) {
  for (const [name, insts] of Object.entries(schema.messages || {})) {
    for (const inst of insts) if (inst.msgType === type) return { name, inst };
  }
  return null;
}

const gtpHex = (u8) => Array.from(u8).map((b) => b.toString(16).padStart(2, '0')).join('');

function decGtpcMsg(inst, u8, schema = null, depth = 0) {
  const h = gtpcHeader(u8);
  const notes = [];
  if (inst.msgType != null && h.msgType !== inst.msgType) {
    throw new Error(`消息类型不匹配: ${h.msgType} ≠ ${inst.msgType}`);
  }
  const end = Math.min(u8.length, 4 + h.msgLen);
  const walk = gtpcWalk(inst.rows || [], u8, h.off, end);
  const parts = walk.parts;
  notes.push(...walk.notes);
  if (schema) {
    for (const p of parts) {
      const g = gtpGroupOf(schema, p.row);
      if (!g || !p.value.length) continue;
      const sub = gtpcDecGroup(schema, g, p.value);
      p.children = sub.parts;
      notes.push(...sub.notes.map((n) => `${p.row.name}: ${n}`));
    }
  }
  const hdr = { t: h.t, teid: h.teid, seq: h.seq, piggy: h.piggy, spare: h.spare };
  const piggy = [];
  if (h.piggy && depth > 0) {
    notes.push('内嵌消息 P=1 违反 §5.1（piggybacked 消息 P 位应为 0）——不再展开其内嵌');
  } else if (h.piggy) {
    // P=1：内嵌完整 GTPv2-C 消息跟在本消息 4+Message Length 处（§5.1 ¶944）
    if (!schema) {
      notes.push('P=1（piggybacked 内嵌消息）——无 schema 未展开，尾部字节保留');
    } else {
      let poff = end;
      if (u8.length - poff < 8) {
        notes.push(`P=1 但内嵌区仅 ${u8.length - poff} 字节，不足完整 GTP-C 头，保留原样`);
      }
      while (poff + 8 <= u8.length) {
        let h2;
        try {
          h2 = gtpcHeader(u8.subarray(poff));
        } catch {
          notes.push(`内嵌区 0x${poff.toString(16)} 起不足完整 GTP-C 头，余 ${u8.length - poff} 字节保留原样`);
          break;
        }
        if (h2.ver !== 2) {
          notes.push(`内嵌区 0x${poff.toString(16)} 起非 GTPv2 头（版本 ${h2.ver}），余 ${u8.length - poff} 字节保留原样`);
          break;
        }
        if (poff + 4 + h2.msgLen > u8.length) {
          notes.push(`内嵌消息（类型 ${h2.msgType}）长度越界（${h2.msgLen}），余 ${u8.length - poff} 字节保留原样`);
          break;
        }
        const span = 4 + h2.msgLen;
        const found = gtpcInstByType(schema, h2.msgType);
        if (!found) {
          notes.push(`内嵌消息类型 ${h2.msgType} 无 schema 实例，${span} 字节按长度跳过`);
          hdr.piggyHex = (hdr.piggyHex || '') + gtpHex(u8.subarray(poff, poff + span));
          poff += span;
          continue;
        }
        const sub = decGtpcMsg(found.inst, u8.subarray(poff, poff + span), schema, 1);
        piggy.push({ name: found.name, msgType: h2.msgType, ...sub, hex: gtpHex(u8.subarray(poff, poff + span)) });
        hdr.piggyHex = (hdr.piggyHex || '') + gtpHex(u8.subarray(poff, poff + span));
        poff += span;
      }
      if (poff !== u8.length) notes.push(`内嵌区尾余 ${u8.length - poff} 字节未构成完整 GTP-C 消息，保留原样`);
    }
  } else if (u8.length !== 4 + h.msgLen) {
    notes.push(`Message Length ${h.msgLen} 与帧长 ${u8.length - 4} 不符，按较小者解码`);
  }
  return { parts, consumed: walk.off, warnings: notes, hdr, piggy };
}

function encGtpcMsg(inst, parts = [], hdr = {}) {
  const t = hdr.t != null ? hdr.t : 1;
  const teid = (hdr.teid || 0) >>> 0;
  const seq = (hdr.seq || 0) >>> 0;
  // P=1 重编码：内嵌消息字节保真回嵌（§5.1 ¶945 内嵌 P 位为 0 由解码侧保证）
  const piggyHex = hdr.piggy && hdr.piggyHex ? String(hdr.piggyHex).replace(/[^0-9a-f]/gi, '') : '';
  if (piggyHex.length % 2) throw new Error('piggybacked 帧 hex 长度须为偶数');
  const body = [];
  for (const p of parts) {
    const r = inst.rows[p.rowIdx];
    if (!r || r.iei == null) continue;
    const content = p.value instanceof Uint8Array ? p.value : Uint8Array.from(p.value ?? []);
    body.push(...gtpcTli(parseInt(r.iei, 10), p.ins != null ? p.ins : (r.ins != null ? r.ins : 0), content));
  }
  const msgLen = body.length + 4 + (t ? 4 : 0); // §5.1 ¶952：不含内嵌消息（各自头带各自长度）
  const head = [(2 << 5) | (piggyHex ? 0x10 : 0) | (t ? 0x08 : 0), inst.msgType != null ? inst.msgType & 255 : 0, (msgLen >> 8) & 255, msgLen & 255];
  if (t) head.push((teid >> 24) & 255, (teid >> 16) & 255, (teid >> 8) & 255, teid & 255);
  head.push((seq >> 16) & 255, (seq >> 8) & 255, seq & 255, 0);
  const out = [...head, ...body];
  for (let i = 0; i < piggyHex.length; i += 2) out.push(parseInt(piggyHex.slice(i, i + 2), 16));
  return Uint8Array.from(out);
}

// ==== src/nas/gtpv1.js ====
// src/nas/gtpv1.js — GTPv1-C（TS 29.060）消息级编解码（schema 驱动）。
//
// 头（§6）：[flags: V3|PT|(*)|E|S|PN][Message Type(1)][Length(2)][TEID(4)]，必配部 8 八位组
//（TEID 恒在）；可选部 4 八位组（Seq(2)|N-PDU(1)|Next Ext Type(1)）在 S/PN/E 任一置位时
// 整块出现——'0' 位字段「not present or, if present, shall not be interpreted」（§6 原文）。
// Length = 第 8 八位组之后的全部载荷：可选部、扩展头链、TLR 串都计入（§6 Length 字段原文
// 'the rest of the packet following the mandatory part of the GTP header (that is the first
// 8 octets)'——与 v2 的「不含内嵌」不同，v1 无 piggyback）。
// 扩展头链（E=1，§6.1）：每节 [Length(1, 4 八位组单位含自身 4 字节)][content][Next Type(1)]，
// 链至 Next Type=0（'No more extension headers'）——字节保真保留（extHex），不参与字段编辑。
// IE 无 Instance（v2 的 TLIV 四件套在 v1 退化为 T+V 或 T+L+V）：格式与定长由 §7.7.0 主表
// 给出（schema.ies[ref].format 'TV'|'TLV' + .fixed = Type 八位组之外的定长值字节数）。
// TV 定长：[Type][value(fixed)]；TLV：[Type][Length][value]——Length 域**宽度逐 IE 不同**：
// 通例 2 八位组（§7.7 原文 'The Length field contains the length of the information element
// excluding the Type and Length field'；EUA/MM Context/Private Extension 等图均画 octets 2-3），
// 但 §7.7.40 Extension Header Type List（IE 141）图形画在 octet 2**单八位组**（schema 标
// lenBytes: 1；五版本全量图形普查后仅此一例，tshark 同口径独立实证——见 nas_oracle_deviations.md）。
// Type 位 8 区分格式：0=TV（1-127）、1=TLV（128-255）（§7.7 原文）。
// 未知 IE Type 无法定界（不知道该读定长还是 Length）——诚实停走记注（v2 未知 IE 可按长
// 度跳过的前向兼容在 v1 不存在，如实入账）。行按表序匹配（乱序 M 行防御报错同 v2）；
// 必配行缺失报错。
// 头的 TEID/Seq 是连接状态不是表内 IE：解码在 hdr 中返回，编码经 hdr 参数还原（缺省
// PT=1/S=1/TEID=0/Seq=0——采样器与回环门禁用确定性值）。

function gtpPresence(p) {
  const s = (p || '').trim();
  if (/^M/i.test(s)) return 'M';
  if (/^C/i.test(s)) return 'C';
  return 'O';
}

function gtpv1Header(u8) {
  if (!u8 || u8.length < 8) throw new Error('GTPv1 头截断（必配部 8 八位组）');
  const flags = u8[0];
  const ver = flags >> 5;
  if (ver !== 1) throw new Error(`GTP 版本非 1: ${ver}`);
  const pt = (flags >> 4) & 1;
  const e = (flags >> 2) & 1;
  const s = (flags >> 1) & 1;
  const pn = flags & 1;
  const msgType = u8[1];
  const msgLen = (u8[2] << 8) | u8[3];
  const teid = (((u8[4] << 24) | (u8[5] << 16) | (u8[6] << 8) | u8[7]) >>> 0);
  let off = 8;
  let seq = 0;
  let npdu = 0;
  let nextExt = 0;
  if (s || pn || e) {
    if (u8.length < 12) throw new Error('GTPv1 头截断（可选部 4 八位组）');
    seq = (u8[8] << 8) | u8[9];
    npdu = u8[10];
    nextExt = u8[11];
    off = 12;
  }
  // 扩展头链（E=1）：每节 4×Length 八位组，Next Type=0 终止；越界诚实保留原样
  let extHex = '';
  let extBytes = 0;
  if (e && nextExt) {
    let guard = 0;
    while (off + 4 <= u8.length && guard++ < 64) {
      const unit = u8[off];
      if (unit < 1) break; // 长度 0 非法——诚实保留
      const size = unit * 4;
      if (off + size > u8.length) break; // 越界——由上层注覆盖
      extBytes += size;
      extHex += Array.from(u8.subarray(off, off + size)).map((b) => b.toString(16).padStart(2, '0')).join('');
      off += size;
      if (u8[off - 1] === 0) break; // Next Type=0 链终
    }
  }
  return { flags, ver, pt, e, s, pn, msgType, msgLen, teid, seq, npdu, nextExt, extHex, extBytes, off };
}

// 行扫描：行身份 = IE Type 值（主表 §7.7.0）；TV 定长 vs TLV 由行 format/fixed（主表填充）
// 或 schema.ies 反查。未知 Type 无法定界 → 诚实停走。
function gtpv1Walk(rows, u8, start, end, typeIndex) {
  const notes = [];
  const parts = [];
  let off = start;
  let ri = 0;
  while (off < end) {
    const type = u8[off];
    const info = typeIndex.get(type);
    if (!info) {
      notes.push(`未知 IE Type ${type} 无法定界（29.060 无长度前缀的未知 IE 不可跳过）——停走，余 ${end - off} 字节未解`);
      break;
    }
    let total;
    if (info.format === 'TLV') {
      const lb = info.lenBytes === 1 ? 1 : 2;
      if (off + 1 + lb > end) throw new Error(`IE 0x${type.toString(16)}（TLV）头截断`);
      const len = lb === 1 ? u8[off + 1] : (u8[off + 1] << 8) | u8[off + 2];
      total = 1 + lb + len;
      if (off + total > end) throw new Error(`IE 0x${type.toString(16)} 长度越界（${len}，余 ${end - off - 1 - lb}）`);
    } else {
      total = 1 + (info.fixed || 0);
      if (off + total > end) throw new Error(`IE 0x${type.toString(16)}（TV 定长 ${info.fixed}）越界，余 ${end - off - 1}`);
    }
    let match = -1;
    for (let j = ri; j < rows.length; j++) {
      if (rows[j].iei == null) continue;
      if (parseInt(rows[j].iei, 10) !== type) continue;
      match = j;
      break;
    }
    if (match < 0) {
      // 已知 IE 但不在本消息行表——无法按行装配，停走诚实保留
      notes.push(`IE Type ${type} 不在本消息行表（未预期）——停走，余 ${end - off} 字节未解`);
      break;
    }
    for (let j = ri; j < match; j++) {
      if (gtpPresence(rows[j].presence) === 'M' && rows[j].iei != null) {
        throw new Error(`必配行缺失: ${rows[j].name}（IE Type ${type} 先行）`);
      }
    }
    parts.push({ row: rows[match], rowIdx: match, value: u8.slice(off + (info.format === 'TLV' ? (info.lenBytes === 1 ? 2 : 3) : 1), off + total) });
    off += total;
    ri = match + 1;
  }
  for (let j = ri; j < rows.length; j++) {
    if (gtpPresence(rows[j].presence) === 'M' && rows[j].iei != null) {
      throw new Error(`必配行缺失: ${rows[j].name}`);
    }
  }
  if (off < end) notes.push(`表尾余 ${end - off} 字节未匹配任何行`);
  return { parts, off, notes };
}

function gtpv1TypeIndex(schema) {
  const m = new Map();
  for (const ie of Object.values(schema?.ies || {})) {
    if (ie.ieType == null) continue;
    if (!m.has(ie.ieType)) m.set(ie.ieType, { format: ie.format === 'TLV' ? 'TLV' : 'TV', fixed: ie.fixed || 0, lenBytes: ie.lenBytes === 1 ? 1 : 2 });
  }
  return m;
}

const gtpv1Hex = (u8) => Array.from(u8).map((b) => b.toString(16).padStart(2, '0')).join('');

function decGtpv1Msg(inst, u8, schema = null) {
  const h = gtpv1Header(u8);
  const notes = [];
  if (inst.msgType != null && h.msgType !== inst.msgType) {
    throw new Error(`消息类型不匹配: ${h.msgType} ≠ ${inst.msgType}`);
  }
  const end = Math.min(u8.length, 8 + h.msgLen);
  if (u8.length !== 8 + h.msgLen) notes.push(`Length ${h.msgLen} 与帧长 ${u8.length - 8} 不符，按较小者解码`);
  if (h.e && h.nextExt === 0) notes.push('E=1 但 Next Extension Header Type=0——按无扩展头处理');
  if (h.extBytes && 8 + h.msgLen < 12 + h.extBytes) notes.push(`扩展头链 ${h.extBytes} 字节越出 Length 界——按 Length 界解码`);
  // h.off 已随扩展头链推进（S=0 无可选部=8；E=1 链后=TLR 起点）——直接即 TLR 起点
  const tlrStart = h.off;
  const walk = gtpv1Walk(inst.rows || [], u8, tlrStart, end, gtpv1TypeIndex(schema));
  return {
    parts: walk.parts,
    consumed: walk.off,
    warnings: [...notes, ...walk.notes],
    hdr: { pt: h.pt, e: h.e, s: h.s, pn: h.pn, teid: h.teid, seq: h.seq, npdu: h.npdu, nextExt: h.nextExt, extHex: h.extHex },
    piggy: [],
  };
}

function encGtpv1Msg(inst, parts = [], hdr = {}) {
  const pt = hdr.pt != null ? hdr.pt : 1;
  const e = hdr.e ? 1 : 0;
  const s = hdr.s != null ? hdr.s : 1;
  const pn = hdr.pn ? 1 : 0;
  const teid = (hdr.teid || 0) >>> 0;
  const seq = (hdr.seq || 0) & 0xffff;
  const npdu = hdr.npdu || 0;
  const extHex = e && hdr.extHex ? String(hdr.extHex).replace(/[^0-9a-f]/gi, '') : '';
  if (extHex.length % 2) throw new Error('扩展头链 hex 长度须为偶数');
  const extLen = extHex.length / 2;
  const body = [];
  for (const p of parts) {
    const r = inst.rows[p.rowIdx];
    if (!r || r.iei == null) continue;
    const content = p.value instanceof Uint8Array ? p.value : Uint8Array.from(p.value ?? []);
    if (r.format === 'TLV') {
      const lb = r.lenBytes === 1 ? 1 : 2; // §7.7.40 IE 141 单八位组长度域（行级 lenBytes 由建库标注）
      if (lb === 1 && content.length > 255) throw new Error(`行 ${r.name}：TLV 值 ${content.length} 字节超 1 八位组长度域`);
      if (lb === 2 && content.length > 65535) throw new Error(`行 ${r.name}：TLV 值 ${content.length} 字节超 2 八位组长度域`);
      body.push(parseInt(r.iei, 10), ...(lb === 1 ? [content.length & 255] : [(content.length >> 8) & 255, content.length & 255]), ...content);
    } else {
      const fixed = r.len != null && /^\d+$/.test(r.len) ? parseInt(r.len, 10) : null;
      if (fixed != null && content.length !== fixed) {
        throw new Error(`行 ${r.name}：TV 定长 ${fixed}，实得 ${content.length}`);
      }
      body.push(parseInt(r.iei, 10), ...content);
    }
  }
  const optBlock = s || pn || e ? 4 : 0;
  const msgLen = optBlock + extLen + body.length; // §6：第 8 八位组之后的全部载荷
  const flags = (1 << 5) | ((pt & 1) << 4) | (e ? 0x04 : 0) | (s ? 0x02 : 0) | (pn ? 0x01 : 0);
  const head = [flags, inst.msgType != null ? inst.msgType & 255 : 0, (msgLen >> 8) & 255, msgLen & 255,
    (teid >> 24) & 255, (teid >> 16) & 255, (teid >> 8) & 255, teid & 255];
  if (optBlock) {
    // octet 12 = 首扩展头类型声明（§6.1：类型只在 octet 12 声明，链内单元是
    // [Length][content][Next Type]——extHex 首字节是长度不是类型，不能由此派生）；
    // E=1 无链时 hdr.nextExt 缺省 0，解码端注记按无扩展头处理，自洽
    head.push((seq >> 8) & 255, seq & 255, npdu & 255, e ? (hdr.nextExt || 0) & 255 : 0);
  }
  const out = [...head];
  for (let i = 0; i < extHex.length; i += 2) out.push(parseInt(extHex.slice(i, i + 2), 16));
  out.push(...body);
  return Uint8Array.from(out);
}

// ==== src/nas/pfcp.js ====
// src/nas/pfcp.js — 29.244（PFCP）编解码：头（Flags/Type/Length/SEID/Seq/Spare）+
// IE 框架 Type(2 字节)+Length(2 字节)+Value。无 Instance 列（与 GTPv2-C TLIV 的区别）。
//
// 头（§7.2.2）：
//   octet1: Version(3) | spare | spare | FO | MP | S；Version=1，S=1 表示含 SEID
//   octet2: Message Type；octet3-4: Message Length（= 总长 - 4，含 SEID/Seq/Spare）
//   S=1: SEID(8) + Seq(3) + Spare(1)；S=0: Seq(3) + Spare(1)
// 会话消息（类型 ≥ 50）S=1；节点消息 S=0（29.244 §7.2.2.2/.3）。

const pfcpRd16 = (u8, o) => (u8[o] << 8) | u8[o + 1];
const pfcpRd32 = (u8, o) => ((u8[o] << 24) | (u8[o + 1] << 16) | (u8[o + 2] << 8) | u8[o + 3]) >>> 0;

function pfcpHeader(u8) {
  if (!u8 || u8.length < 8) throw new Error('PFCP 头截断');
  const flags = u8[0];
  const ver = flags >> 5;
  if (ver !== 1) throw new Error(`PFCP 版本非 1: ${ver}`);
  const s = flags & 1;
  const mp = (flags >> 1) & 1;
  const fo = (flags >> 2) & 1;
  const msgType = u8[1];
  const msgLen = pfcpRd16(u8, 2);
  let off = 4;
  let seidHex = null;
  if (s) {
    if (u8.length < 16) throw new Error('PFCP 头截断（SEID）');
    seidHex = Array.from(u8.slice(4, 12)).map((b) => b.toString(16).padStart(2, '0')).join('');
    off = 12;
  }
  if (off + 4 > u8.length) throw new Error('PFCP 头截断（Seq/Spare）');
  const seq = (u8[off] << 16) | (u8[off + 1] << 8) | u8[off + 2];
  const spare = u8[off + 3];
  off += 4;
  return { flags, ver, s, mp, fo, msgType, msgLen, seidHex, seq, spare, off, total: 4 + msgLen };
}

function pfcpIe(type, content) {
  const n = content.length;
  return Uint8Array.from([(type >> 8) & 255, type & 255, (n >> 8) & 255, n & 255, ...content]);
}

// IE 序列扫描：Type(2)+Length(2)+Value；未知类型按 Length 跳过（前向兼容）。
// 行匹配按 (Type) 首个未消费行（PFCP 允许同类型重复出现）；分组 IE 递归解出 children。
function pfcpWalk(rows, u8, start, end, schema, depth = 0) {
  const notes = [];
  const parts = [];
  const used = new Set();
  let off = start;
  while (off + 4 <= end) {
    const type = pfcpRd16(u8, off);
    const len = pfcpRd16(u8, off + 2);
    if (off + 4 + len > end) throw new Error(`IE 0x${type.toString(16)} 长度越界（${len}，余 ${end - off - 4}）`);
    const val = u8.slice(off + 4, off + 4 + len);
    let ri = -1;
    for (let i = 0; i < rows.length; i++) {
      if (used.has(i)) continue;
      if (rows[i].iei != null && parseInt(rows[i].iei, 10) === type) { ri = i; break; }
    }
    if (ri < 0) {
      // 已消费的同类型行（重复次数超出表行）→ 仍按未知 IE 跳过，但提示
      notes.push(`未知/超额 IE type ${type}（${len} 字节，按 Length 跳过）`);
    } else {
      used.add(ri);
      const row = rows[ri];
      const part = { row, rowIdx: ri, value: val };
      const def = row.def;
      const grouped = def && schema && schema.ies && schema.ies[def] && schema.ies[def].grouped;
      if (grouped && depth < 4) {
        const sub = pfcpWalk(grouped, val, 0, val.length, schema, depth + 1);
        part.children = sub.parts;
        notes.push(...sub.warnings.map((w) => `${row.name}: ${w}`));
      } else if (grouped) {
        notes.push(`${row.name}: 分组 IE 嵌套超 4 层，子行未展开`);
      }
      parts.push(part);
    }
    off += 4 + len;
  }
  if (off !== end) throw new Error(`PFCP IE 区尾部余 ${end - off} 字节`);
  return { parts, warnings: notes };
}

function decPfcpMsg(inst, u8, schema) {
  const hdr = pfcpHeader(u8);
  const end = Math.min(hdr.total, u8.length);
  const { parts, warnings } = pfcpWalk(inst.rows || [], u8, hdr.off, end, schema);
  return { hdr, parts, warnings };
}

function encPfcpMsg(inst, parts = [], hdr = {}) {
  const s = inst.session != null ? !!inst.session : (inst.msgType != null ? inst.msgType >= 50 : false);
  const fo = hdr.fo ? 1 : 0;
  const mp = hdr.mp ? 1 : 0;
  const body = [];
  for (const p of parts) {
    const row = p.row || (inst.rows && inst.rows[p.rowIdx]);
    const type = parseInt(row && row.iei, 10);
    // 批次 U5：无法定行的 part 不能静默丢弃——编码结果会少 IE 且调用方无感知。
    if (!Number.isFinite(type)) throw new Error(`PFCP 编码：part 无 IE 类型（rowIdx ${p.rowIdx}），无法序列化`);
    body.push(...pfcpIe(type, p.value || new Uint8Array(0)));
  }
  const hdrLen = s ? 16 : 8;
  const msgLen = hdrLen - 4 + body.length;
  const out = [(1 << 5) | (fo << 2) | (mp << 1) | (s ? 1 : 0), inst.msgType ?? hdr.msgType ?? 0, (msgLen >> 8) & 255, msgLen & 255];
  if (s) {
    const hex = (hdr.seidHex || '').replace(/[^0-9a-f]/gi, '').padStart(16, '0').slice(-16);
    out.push(...Array.from({ length: 8 }, (_, i) => parseInt(hex.slice(i * 2, i * 2 + 2), 16)));
  }
  const seq = hdr.seq != null ? hdr.seq : 0;
  out.push((seq >> 16) & 255, (seq >> 8) & 255, seq & 255, 0);
  return Uint8Array.from([...out, ...body]);
}

// ---- 批次 Y：F-SEID 头部联动（会话请求/响应样例帧组） ------------------------------
// F-SEID 值 = flags(1) + SEID(8) + 可选地址；返回 SEID 8 字节 hex，布局不足返回 null。
function pfcpSeidHex(value) {
  if (!value || value.length < 9) return null;
  return Array.from(value.slice(1, 9)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

// 请求/响应头 SEID 联动（29.244 §7.2.2.2/.3）：会话消息头 SEID 指向会话的 CP 侧 SEID。
// establishment=true（建立流程）时请求头 SEID 保持 0（会话尚未建立），响应头 SEID =
// 请求 CP F-SEID；其余流程（mod/del/report）请求与响应头 SEID 均 = CP 侧 SEID——请求未带
// F-SEID（条件 IE 未采样）时用调用方提供的 sessionSeid（CLI 按 seed 确定性生成）。
// 响应 UP F-SEID 仅作展示（UP 侧独立分配，不互相复制）。
function pfcpLinkFlow(reqInst, reqBytes, resInst, resBytes, { establishment = false, sessionSeid = null } = {}) {
  const warnings = [];
  const rq = decPfcpMsg(reqInst, reqBytes, null);
  const rs = decPfcpMsg(resInst, resBytes, null);
  const cpPart = rq.parts.find((p) => /CP F-SEID/i.test(String((p.row && p.row.name) || '')));
  const cpSeid = cpPart ? pfcpSeidHex(cpPart.value) : null;
  const session = cpSeid || (sessionSeid
    ? String(sessionSeid).replace(/[^0-9a-f]/gi, '').padStart(16, '0').slice(-16)
    : null);
  if (!session) warnings.push('请求缺少 CP F-SEID 且未提供 sessionSeid——请求/响应头 SEID 保持原值');
  const upPart = rs.parts.find((p) => /UP F-SEID/i.test(String((p.row && p.row.name) || '')));
  const upSeid = upPart ? pfcpSeidHex(upPart.value) : null;
  const headReq = session && !establishment ? session : null;
  const headRes = session || null;
  const reqOut = encPfcpMsg(reqInst, rq.parts, { seidHex: headReq != null ? headReq : rq.hdr.seidHex, seq: rq.hdr.seq });
  const resOut = encPfcpMsg(resInst, rs.parts, { seidHex: headRes != null ? headRes : rs.hdr.seidHex, seq: rs.hdr.seq });
  return { reqBytes: reqOut, resBytes: resOut, cpSeidHex: session, upSeidHex: upSeid, warnings };
}

// ==== src/nas/gtpu.js ====
// src/nas/gtpu.js — 29.281（GTP-U）隧道头 + 扩展头链构造/反解。
//
// 头（§5.1）：Flags(Version 3 | PT | spare | E | S | PN) | Message Type | Length(2) |
//   TEID(4)；E/S/PN 任一置位时追加 Sequence(2) + N-PDU(1) + Next Extension Header Type(1)。
//   最小头 8 字节，Length = 总长 - 8。
// 扩展头（§5.2.1）：Length(1，以 4 octet 为单位) + Content(4n-2) + Next Type(1)。
//   类型值表见 §5.2.2（Figure 5.2.1-3）：0x00 结束、0x40 UDP Port、0x85 PDU Session
//   Container 等；高比特=comprehension required，未知且 required 时告警。
const gtpuRd16 = (u8, o) => (u8[o] << 8) | u8[o + 1];
const gtpuRd32 = (u8, o) => ((u8[o] << 24) | (u8[o + 1] << 16) | (u8[o + 2] << 8) | u8[o + 3]) >>> 0;
const gtpuWr16 = (v) => [(v >> 8) & 255, v & 255];
const gtpuWr32 = (v) => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];

const GTPU_EXT_TYPES = {
  0x00: 'No more extension headers',
  0x03: 'Long PDCP PDU Number',
  0x04: 'PDU Set Information Container',
  0x20: 'Service Class Indicator',
  0x40: 'UDP Port',
  0x81: 'RAN Container',
  0x82: 'Long PDCP PDU Number (legacy)',
  0x83: 'Xw RAN Container',
  0x84: 'NR RAN Container',
  0x85: 'PDU Session Container',
  0x86: 'PDU Set Information Container (legacy)',
  0xC0: 'PDCP PDU Number',
};

// BF 批（v1.62.0）：消息 IE 几何常量表——29.281 §8.2-8.8 图形核实（docx 直读）：
// TV 定长 = Type 八位组之外的值字节数；TLV 长度域宽度 = 值 Length 字段的八位组数。
// 29.281 建库只吃 §5.2.1/§6.1/§8.1 三张类型表（位表不采），编解码器（gtpv1.js 同款
// 行模型）所需的定长/长度域宽度以常量表登记，建库时按 §8.1 Format 列交叉核对——
// 缺行或 TV/TLV 不符 → problems fatal（GTPU_EXT_TYPES 对拍同款「硬编码 ← → 规范表格
// 互证」机制）。141 与 29.060 §7.7.40 同为全族唯一单八位组长度域例外。
const GTPU_IE_GEOMETRY = {
  14:  { format: 'TV',  fixed: 1 },     // §8.2 Recovery：octet 2 重启计数 1B
  16:  { format: 'TV',  fixed: 4 },     // §8.3 Tunnel Endpoint Identifier Data I：octets 2-5
  133: { format: 'TLV', lenBytes: 2 },  // §8.4 GTP-U Peer Address（Length 值域 {4,16}，采样语义定形）
  141: { format: 'TLV', lenBytes: 1 },  // §8.5 Extension Header Type List：单八位组长度域
  230: { format: 'TLV', lenBytes: 2 },  // §8.7 GTP-U Tunnel Status Information
  231: { format: 'TLV', lenBytes: 2 },  // §8.8 Recovery Time Stamp
  255: { format: 'TLV', lenBytes: 2 },  // §8.6 Private Extension
};

function gtpuHeader(u8) {
  if (!u8 || u8.length < 8) throw new Error('GTP-U 头截断');
  const flags = u8[0];
  const ver = flags >> 5;
  if (ver !== 1) throw new Error(`GTP-U 版本非 1: ${ver}`);
  const pt = (flags >> 4) & 1;
  const e = (flags >> 2) & 1;
  const s = (flags >> 1) & 1;
  const pn = flags & 1;
  const type = u8[1];
  const length = gtpuRd16(u8, 2);
  const teid = gtpuRd32(u8, 4);
  let off = 8;
  let seq = null;
  let npdu = null;
  let nextExt = 0;
  if (e || s || pn) {
    if (u8.length < 12) throw new Error('GTP-U 头截断（Seq/NextExt）');
    seq = gtpuRd16(u8, 8);
    npdu = u8[10];
    nextExt = u8[11];
    off = 12;
  }
  return { flags, ver, pt, e, s, pn, type, length, teid, seq, npdu, nextExt, off, total: 8 + length };
}

// 扩展头链：返回 [{type,length,content,next,raw}] 与 T-PDU payload。
function gtpuExtensionChain(u8, start, nextType, end = u8.length) {
  const exts = [];
  const warnings = [];
  let pos = start;
  let type = nextType;
  while (type) {
    if (pos + 4 > end) throw new Error(`GTP-U 扩展头截断（type 0x${type.toString(16)}）`);
    const n = u8[pos];
    if (!n) throw new Error(`GTP-U 扩展头长度 0（type 0x${type.toString(16)}）`);
    const total = n * 4;
    if (pos + total > end) throw new Error(`GTP-U 扩展头长度越界（type 0x${type.toString(16)}，${total}）`);
    const content = u8.slice(pos + 1, pos + total - 1);
    const next = u8[pos + total - 1];
    exts.push({ type, length: n, content, next, raw: u8.slice(pos, pos + total) });
    if (!(type in GTPU_EXT_TYPES) && (type & 0x80)) warnings.push(`未知扩展头 type 0x${type.toString(16)}（comprehension required）`);
    pos += total;
    type = next;
  }
  return { exts, payload: u8.slice(pos, end), warnings };
}

function gtpuParse(u8) {
  const h = gtpuHeader(u8);
  const end = Math.min(h.total, u8.length);
  const chain = gtpuExtensionChain(u8, h.off, h.e ? h.nextExt : 0, end);
  return { hdr: h, exts: chain.exts, payload: chain.payload, warnings: chain.warnings };
}

// 单个扩展头编码：Length 向上取整到 4 octet；content 尾部补 0；Next Type 由链式编码填。
function gtpuExtBytes(type, content, next = 0) {
  const c = content instanceof Uint8Array ? content : Uint8Array.from(content || []);
  const n = Math.max(1, Math.ceil((c.length + 2) / 4));
  const out = new Uint8Array(n * 4);
  out[0] = n;
  out.set(c.slice(0, n * 4 - 2), 1);
  out[n * 4 - 1] = next & 0xff;
  return out;
}

// ---- 批次 X：T-PDU 载荷构造（最小合法 IPv4/IPv6/以太网帧）+ GTP-U Echo --------------
const gtpuBytes = (v, n, what) => {
  const a = v instanceof Uint8Array ? v : Uint8Array.from(v || []);
  if (a.length !== n) throw new Error(`${what} 长度应为 ${n}（实为 ${a.length}）`);
  return a;
};

// IPv4：20 字节头 + 载荷；Total Length 与头校验和实算（RFC 791）。
function ipv4Frame({ src = [10, 0, 0, 1], dst = [10, 0, 0, 2], proto = 17, ttl = 64, tos = 0, id = 0, flagsFrag = 0, payload = [] } = {}) {
  const s = gtpuBytes(src, 4, 'IPv4 源地址');
  const d = gtpuBytes(dst, 4, 'IPv4 目的地址');
  const pl = payload instanceof Uint8Array ? payload : Uint8Array.from(payload || []);
  const total = 20 + pl.length;
  if (total > 0xffff) throw new Error(`IPv4 Total Length 越界（${total} > 65535）`);
  if (!Number.isInteger(ttl) || ttl < 0 || ttl > 255) throw new Error(`IPv4 TTL 越界（${ttl}）`);
  if (!Number.isInteger(proto) || proto < 0 || proto > 255) throw new Error(`IPv4 protocol 越界（${proto}）`);
  if (!Number.isInteger(id) || id < 0 || id > 0xffff) throw new Error(`IPv4 identification 越界（${id}）`);
  if (!Number.isInteger(flagsFrag) || flagsFrag < 0 || flagsFrag > 0xffff) throw new Error(`IPv4 flags/fragment 越界（${flagsFrag}）`);
  const h = new Uint8Array(20);
  h[0] = 0x45; h[1] = tos & 0xff;
  h[2] = total >> 8; h[3] = total & 0xff;
  h[4] = id >> 8; h[5] = id & 0xff;
  h[6] = (flagsFrag >> 8) & 0xff; h[7] = flagsFrag & 0xff;
  h[8] = ttl; h[9] = proto & 0xff;
  h.set(s, 12); h.set(d, 16);
  let sum = 0;
  for (let i = 0; i < 20; i += 2) sum += (h[i] << 8) | h[i + 1];
  while (sum >> 16) sum = (sum & 0xffff) + (sum >> 16);
  const c = (~sum) & 0xffff;
  h[10] = c >> 8; h[11] = c & 0xff;
  return Uint8Array.from([...h, ...pl]);
}

// IPv6：40 字节固定头 + 载荷（RFC 8200）；Payload Length 16-bit。
function ipv6Frame({ src, dst, nextHeader = 17, hopLimit = 64, trafficClass = 0, flowLabel = 0, payload = [] } = {}) {
  const s = gtpuBytes(src, 16, 'IPv6 源地址');
  const d = gtpuBytes(dst, 16, 'IPv6 目的地址');
  const pl = payload instanceof Uint8Array ? payload : Uint8Array.from(payload || []);
  if (pl.length > 0xffff) throw new Error(`IPv6 Payload Length 越界（${pl.length} > 65535）`);
  if (!Number.isInteger(hopLimit) || hopLimit < 0 || hopLimit > 255) throw new Error(`IPv6 Hop Limit 越界（${hopLimit}）`);
  if (!Number.isInteger(nextHeader) || nextHeader < 0 || nextHeader > 255) throw new Error(`IPv6 Next Header 越界（${nextHeader}）`);
  if (!Number.isInteger(trafficClass) || trafficClass < 0 || trafficClass > 255) throw new Error(`IPv6 Traffic Class 越界（${trafficClass}）`);
  if (!Number.isInteger(flowLabel) || flowLabel < 0 || flowLabel > 0xfffff) throw new Error(`IPv6 Flow Label 越界（${flowLabel}）`);
  const h = new Uint8Array(40);
  h[0] = (6 << 4) | (trafficClass >> 4);
  h[1] = ((trafficClass & 0x0f) << 4) | ((flowLabel >> 16) & 0x0f);
  h[2] = (flowLabel >> 8) & 0xff; h[3] = flowLabel & 0xff;
  h[4] = pl.length >> 8; h[5] = pl.length & 0xff;
  h[6] = nextHeader & 0xff; h[7] = hopLimit;
  h.set(s, 8); h.set(d, 24);
  return Uint8Array.from([...h, ...pl]);
}

// 以太网 II：14 字节头 + 载荷。
function ethernetFrame({ dst = [0, 0, 0, 0, 0, 0], src = [2, 0, 0, 0, 0, 1], etherType = 0x0800, payload = [] } = {}) {
  const d = gtpuBytes(dst, 6, '以太网目的地址');
  const s = gtpuBytes(src, 6, '以太网源地址');
  if (!Number.isInteger(etherType) || etherType < 0 || etherType > 0xffff) throw new Error(`EtherType 越界（${etherType}）`);
  const pl = payload instanceof Uint8Array ? payload : Uint8Array.from(payload || []);
  return Uint8Array.from([...d, ...s, (etherType >> 8) & 0xff, etherType & 0xff, ...pl]);
}

// GTP-U Echo Request(1)/Response(2)：Recovery IE = 类型 14 + 1 字节值（29.281 §7.2/§8.2）。
function gtpuEcho({ type = 1, recovery = 0, teid = 0 } = {}) {
  if (type !== 1 && type !== 2) throw new Error(`GTP-U Echo 类型应为 1/2（${type}）`);
  if (!Number.isInteger(recovery) || recovery < 0 || recovery > 255) throw new Error(`Recovery 越界（${recovery}）`);
  return gtpuBuild({ teid, type, payload: Uint8Array.from([14, recovery & 0xff]) });
}

function gtpuEchoRecovery(u8) {
  const r = gtpuParse(u8);
  if (r.hdr.type !== 1 && r.hdr.type !== 2) throw new Error(`非 GTP-U Echo 消息（type ${r.hdr.type}）`);
  const p = r.payload;
  if (p.length >= 2 && p[0] === 14) return p[1];
  throw new Error('Echo 消息缺少 Recovery IE');
}

function gtpuBuild({ teid = 0, type = 0xff, seq = null, npdu = null, exts = [], payload = [] } = {}) {
  // v1.34.0 批次 AB：29.281 §5.2 NOTE 5/6 线缆约束——PSIC（0x04）有 PSC 时应为第二
  // 扩展头（紧跟 0x85 之后）、无 PSC 时应为第一扩展头；QFI 跨容器同现时 shall 同值。
  // 违例不阻断构造（should/shall 混合：链序 should、QFI shall——统一以 warning 留痕，
  // 调用方按需升格），警告以 out.warnings 属性附带。
  const buildWarnings = [];
  // v1.38.0 P3 勘正：守卫原用 findIndex 只看首个 0x85/0x04——多容器（malformed）漏检。
  // 改为全量索引：计数超 1 直接告警，链序/QFI 逐对核查，消息去重。
  const idxAll = (t) => exts.map((e, i) => ((e.type & 0xff) === t ? i : -1)).filter((i) => i >= 0);
  const pscIdx = idxAll(0x85);
  // v1.42.0 P3-2：PSIC（PDU Set Information Container）有两个线缆值——0x04 与 0x86（legacy，
  // 见 GTPU_EXT_TYPES 0x86 '…(legacy)' 与 §5.2.1 类型表两行同名）。NOTE 5/6 守卫原只索引
  // 0x04——0x85+0x86 组合 QFI 错配零告警；归并为同一逻辑容器参与计数/链序/QFI 检查。
  const psicIdx = [...idxAll(0x04), ...idxAll(0x86)].sort((a, b) => a - b);
  const psicName = (i) => `0x${(exts[i].type & 0xff).toString(16).padStart(2, '0')}`;
  if (pscIdx.length > 1) buildWarnings.push(`GTP-U 扩展头链（29.281 §5.2）：PDU Session Container（0x85）出现 ${pscIdx.length} 次——应至多一次`);
  if (psicIdx.length > 1) buildWarnings.push(`GTP-U 扩展头链（29.281 §5.2）：PDU Set Information Container（0x04/0x86）出现 ${psicIdx.length} 次——应至多一次`);
  for (const iPsc of pscIdx) {
    for (const iPsic of psicIdx) {
      if (iPsic !== iPsc + 1) buildWarnings.push('GTP-U 扩展头链序（29.281 §5.2 NOTE 5）：PDU Set Information Container（0x04/0x86）应为第二扩展头、紧跟 PDU Session Container（0x85）之后');
      const c1 = exts[iPsc].content;
      const c2 = exts[iPsic].content;
      const q1 = c1 && c1.length >= 2 ? c1[1] & 0x3f : null; // PSC QFI：octet2 bits 5-0
      const q2 = c2 && c2.length >= 2 ? (c2[1] >> 2) & 0x3f : null; // PSIC QFI：octet2 bits 7-2
      if (q1 != null && q2 != null && q1 !== q2) buildWarnings.push(`GTP-U QFI 跨容器不一致（29.281 §5.2 NOTE 6，shall）：0x85 QFI ${q1} vs ${psicName(iPsic)} QFI ${q2}——两容器同时出现时必须同值`);
    }
  }
  for (const iPsic of psicIdx) {
    if (!pscIdx.length && iPsic !== 0) buildWarnings.push('GTP-U 扩展头链序（29.281 §5.2 NOTE 5）：无 PDU Session Container 时 PDU Set Information Container（0x04/0x86）应为第一扩展头');
  }
  const uniqWarnings = [...new Set(buildWarnings)];
  const chain = [];
  for (let i = 0; i < exts.length; i++) {
    const e = exts[i];
    const next = i + 1 < exts.length ? (exts[i + 1].type & 0xff) : 0;
    chain.push(...gtpuExtBytes(e.type, e.content, next));
  }
  const withOpt = chain.length > 0 || seq != null || npdu != null;
  const pl = payload instanceof Uint8Array ? payload : Uint8Array.from(payload || []);
  const hdrLen = withOpt ? 12 : 8;
  const length = hdrLen - 8 + chain.length + pl.length;
  // 批次 U5：Length 是 16-bit，超出即无法表达——静默按位掩码会产出坏帧。
  if (length > 0xffff) throw new Error(`GTP-U 编码：载荷超 16-bit Length（${length} > 65535）`);
  if (seq != null && (!Number.isInteger(seq) || seq < 0 || seq > 0xffff)) throw new Error(`GTP-U 编码：seq 越界（${seq}）`);
  if (npdu != null && (!Number.isInteger(npdu) || npdu < 0 || npdu > 0xff)) throw new Error(`GTP-U 编码：N-PDU 越界（${npdu}）`);
  if (!Number.isInteger(teid) || teid < 0 || teid > 0xffffffff) throw new Error(`GTP-U 编码：TEID 越界（${teid}）`);
  const flags = (1 << 5) | (1 << 4)
    | (chain.length ? 0x04 : 0) | (seq != null ? 0x02 : 0) | (npdu != null ? 0x01 : 0);
  const out = [flags, type & 0xff, ...gtpuWr16(length), ...gtpuWr32(teid >>> 0)];
  if (withOpt) out.push(...gtpuWr16(seq || 0), (npdu || 0) & 0xff, chain.length ? (exts[0].type & 0xff) : 0);
  const buf = Uint8Array.from([...out, ...chain, ...pl]);
  if (uniqWarnings.length) buf.warnings = uniqWarnings;
  return buf;
}

// ---- PDU Session Information（38.415 §5.5，GTP-U 扩展头 0x85 内容）----------------
// 批次 V（v1.31.0）：字段级构造/反解。位布局与域序以线帧格式常量实现（§5.5.2.1 DL
// PDU Type 0 / §5.5.2.2 UL PDU Type 1 两张帧格式表 + §5.5.3.x 各 IE 位宽散文）；
// 权威布局摄取进 38415 schema（tools/nas38415.mjs），gate:nas38415 做 schema ↔ 本常量
// 交叉校验 + 随机回环，防两处漂移。帧长（含 padding/future ext）= n*4-2 octets（§5.5.3.5）。
const PSC_FIELDS = {
  dl: {
    octet1: [{ key: 'pduType', hi: 7, lo: 4 }, { key: 'qmp', hi: 3, lo: 3 }, { key: 'snp', hi: 2, lo: 2 }, { key: 'msnp', hi: 1, lo: 1 }, { key: 'spare', hi: 0, lo: 0, implOnly: true }],
    octet2: [{ key: 'ppp', hi: 7, lo: 7 }, { key: 'rqi', hi: 6, lo: 6 }, { key: 'qfi', hi: 5, lo: 0 }],
    condBitField: {
      on: 'ppp',
      fields: [{ key: 'ppi', hi: 7, lo: 5 }, { key: 'spare', hi: 4, lo: 2, implOnly: true }, { key: 'bssi', hi: 1, lo: 1 }, { key: 'ttnbi', hi: 0, lo: 0 }],
    },
    condOctets: ['dlSendTs:8:qmp', 'dlSeq:3:snp', 'dlMbsSeq:4:msnp', 'bssize:3:bssi', 'ttnb:2:ttnbi'],
  },
  ul: {
    octet1: [{ key: 'pduType', hi: 7, lo: 4 }, { key: 'qmp', hi: 3, lo: 3 }, { key: 'dlDelayInd', hi: 2, lo: 2 }, { key: 'ulDelayInd', hi: 1, lo: 1 }, { key: 'snp', hi: 0, lo: 0 }],
    octet2: [{ key: 'n3n9DelayInd', hi: 7, lo: 7 }, { key: 'newIeFlag', hi: 6, lo: 6 }, { key: 'qfi', hi: 5, lo: 0 }],
    condOctets: ['dlSendTsRep:8:qmp', 'dlRecvTs:8:qmp', 'ulSendTs:8:qmp', 'dlDelay:4:dlDelayInd', 'ulDelay:4:ulDelayInd', 'ulSeq:3:snp', 'n3n9Delay:4:n3n9DelayInd', 'd1Ind:1:@newIe:0', 'ulCong:2:@newIe:1', 'dlCong:2:@newIe:2', 'ulBitrate:4:@newIe:3', 'dlBitrate:4:@newIe:4'],
  },
  // New IE Flags Octet 位号（§5.5.2.2 正文：bit0=D1、1=UL 拥塞、2=DL 拥塞、3=UL 码率、
  // 4=DL 码率；末位 bit7=扩展旗标 E，§A.1.1）
  newIeFlags: { d1Ind: 0, ulCong: 1, dlCong: 2, ulBitrate: 3, dlBitrate: 4, ext: 7 },
};

// CLI --psc-dl/--psc-ul 可设键集合 = 构造器实际读取的字段（v1.33.0 AA4：P3-2 实测
// `dlSendTs` 误传 UL 侧被静默忽略、帧内域全 0——拼错键无任何告警）。派生指示位
// （snp/msnp/bssi/ttnbi/ppp/newIeFlag/dlDelayInd/ulDelayInd/n3n9DelayInd）以域存在性
// 推导、不可直设；padding 由 CLI 特判转 hex。PSC_KEYS_XCHECK 测试钉：condOctets 全部
// 域键必须在本集合内，防 PSC_FIELDS 扩域后集合失同步。
const PSC_SETTABLE = {
  dl: ['qfi', 'qmp', 'ppi', 'rqi', 'dlSendTs', 'dlSeq', 'dlMbsSeq', 'bssize', 'ttnb', 'padding'],
  ul: ['qfi', 'qmp', 'dlSendTsRep', 'dlRecvTs', 'ulSendTs', 'dlDelay', 'ulDelay', 'ulSeq', 'n3n9Delay', 'd1Ind', 'ulCong', 'dlCong', 'ulBitrate', 'dlBitrate', 'padding'],
};

// 未知键检测：返回 [{ key, near }]，near=最近似正名（大小写/分隔归一相等 > 前缀互含），
// 无近似为 null。dir 侧集合外的键一律报出——含把对方方向键误传本方向（P3-2 场景）。
// v1.34.0 起同时覆盖 --pset（PSET_SETTABLE）。v1.38.0 P3：dir 键不再豁免——方向由
// --psc-dl/--psc-ul flag（或 UI 面板选择）决定，混入 k=v 即报出，防静默覆盖翻转方向。
function pscUnknownKeys(dir, obj) {
  const known = PSC_SETTABLE[dir] || PSET_SETTABLE[dir] || [];
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const out = [];
  for (const k of Object.keys(obj || {})) {
    if (known.includes(k)) continue;
    const nk = norm(k);
    const near = known.find((x) => norm(x) === nk)
      || known.find((x) => norm(x).startsWith(nk) && nk.length >= 3)
      || known.find((x) => nk.startsWith(norm(x)) && nk !== norm(x));
    out.push({ key: k, near: near || null });
  }
  return out;
}

const PSC_U8 = (v, name, max, tag = 'PSC') => {
  if (!Number.isInteger(v) || v < 0 || v > max) throw new Error(`${tag} ${name} 越界（${v}，0..${max}）`);
  return v;
};
function pscWr64(v, name) {
  const b = typeof v === 'bigint' ? v : BigInt(v);
  if (b < 0n || b >= 1n << 64n) throw new Error(`PSC ${name} 越界（64-bit，§5.5.3.9）`);
  const out = [];
  for (let i = 7; i >= 0; i--) out.push(Number((b >> BigInt(i * 8)) & 0xffn));
  return out;
}
const pscWrN = (v, name, bytes, max, tag = 'PSC') => {
  const n = PSC_U8(v, name, max, tag);
  const out = [];
  for (let i = bytes - 1; i >= 0; i--) out.push((n >> (i * 8)) & 0xff);
  return out;
};

// 构造 PDU Session Information 帧（扩展头 0x85 内容）。存在性推导：条件域给值 ⇒ 指示位=1
//（ppi/ppp、dlSeq/snp、dlMbsSeq/msnp、bssize/bssi、ttnb/ttnbi、dlDelay/dlDelayInd、
// ulDelay/ulDelayInd、n3n9Delay/n3n9DelayInd、新 IE/flags 位）；反向矛盾（域缺位=1 或
// 位=0 域在）按规范不可能出现，构造器以域存在性为唯一事实源。QMP=1 而时间戳未给时补
// 0 值并告警（0 是合法 {0..2^64-1} 值）；QMP=0 而给了时间戳抛错（§5.5.3.8）。
function pduSessionInfo(f = {}) {
  const dir = f.dir || 'dl';
  const warnings = [];
  const qfi = f.qfi != null ? PSC_U8(f.qfi, 'QFI', 63) : 0;
  const body = [];
  if (dir === 'dl') {
    const qmp = f.qmp ? 1 : 0;
    if (!qmp && f.dlSendTs != null) throw new Error('PSC DL：给出 DL Sending Time Stamp 但 QMP=0（§5.5.3.8——时间戳仅在 QMP=1 时在场）');
    const ts = f.dlSendTs != null ? f.dlSendTs : (qmp ? (warnings.push('QMP=1 未给 DL Sending Time Stamp——按 0 值构造'), 0) : null);
    const oct1 = (qmp << 3) | ((f.dlSeq != null ? 1 : 0) << 2) | ((f.dlMbsSeq != null ? 1 : 0) << 1);
    const ppp = f.ppi != null ? 1 : 0;
    const oct2 = (ppp << 7) | ((f.rqi ? 1 : 0) << 6) | qfi;
    body.push(oct1, oct2);
    if (ppp) body.push(((f.ppi & 7) << 5) | ((f.bssize != null ? 1 : 0) << 1) | (f.ttnb != null ? 1 : 0));
    if (qmp) body.push(...pscWr64(ts, 'DL Sending Time Stamp'));
    if (f.dlSeq != null) body.push(...pscWrN(f.dlSeq, 'DL QFI Sequence Number', 3, 0xffffff));
    if (f.dlMbsSeq != null) body.push(...pscWrN(f.dlMbsSeq, 'DL MBS QFI Sequence Number', 4, 0xffffffff));
    if (f.bssize != null) body.push(...pscWrN(f.bssize, 'BSSize', 3, 0xffffff));
    if (f.ttnb != null) body.push(...pscWrN(f.ttnb, 'TTNB', 2, 0xffff));
  } else if (dir === 'ul') {
    const qmp = f.qmp ? 1 : 0;
    const tsReq = [['dlSendTsRep', 'DL Sending Time Stamp Repeated'], ['dlRecvTs', 'DL Received Time Stamp'], ['ulSendTs', 'UL Sending Time Stamp']];
    for (const [k, nm] of tsReq) {
      if (!qmp && f[k] != null) throw new Error(`PSC UL：给出 ${nm} 但 QMP=0（§5.5.3.8）`);
      if (qmp && f[k] == null) warnings.push(`QMP=1 未给 ${nm}——按 0 值构造`);
    }
    const newIe = f.d1Ind != null || f.ulCong != null || f.dlCong != null || f.ulBitrate != null || f.dlBitrate != null;
    const oct1 = (1 << 4) | (qmp << 3) | ((f.dlDelay != null ? 1 : 0) << 2) | ((f.ulDelay != null ? 1 : 0) << 1) | (f.ulSeq != null ? 1 : 0);
    const oct2 = ((f.n3n9Delay != null ? 1 : 0) << 7) | ((newIe ? 1 : 0) << 6) | qfi;
    body.push(oct1, oct2);
    if (qmp) for (const [k] of tsReq) body.push(...pscWr64(f[k] != null ? f[k] : 0, k));
    if (f.dlDelay != null) body.push(...pscWrN(f.dlDelay, 'DL Delay Result', 4, 0xffffffff));
    if (f.ulDelay != null) body.push(...pscWrN(f.ulDelay, 'UL Delay Result', 4, 0xffffffff));
    if (f.ulSeq != null) body.push(...pscWrN(f.ulSeq, 'UL QFI Sequence Number', 3, 0xffffff));
    if (f.n3n9Delay != null) body.push(...pscWrN(f.n3n9Delay, 'N3/N9 Delay Result', 4, 0xffffffff));
    if (newIe) {
