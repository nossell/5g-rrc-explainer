      const F = PSC_FIELDS.newIeFlags;
      let flags = 0;
      if (f.d1Ind != null) flags |= 1 << F.d1Ind;
      if (f.ulCong != null) flags |= 1 << F.ulCong;
      if (f.dlCong != null) flags |= 1 << F.dlCong;
      if (f.ulBitrate != null) flags |= 1 << F.ulBitrate;
      if (f.dlBitrate != null) flags |= 1 << F.dlBitrate;
      body.push(flags);
      if (f.d1Ind != null) body.push(PSC_U8(f.d1Ind, 'D1 UL PDCP Delay Result Ind', 1));
      if (f.ulCong != null) body.push(...pscWrN(f.ulCong, 'UL Congestion Information', 2, 10000));
      if (f.dlCong != null) body.push(...pscWrN(f.dlCong, 'DL Congestion Information', 2, 10000));
      if (f.ulBitrate != null) body.push(...pscWrN(f.ulBitrate, 'UL Available Bitrate', 4, 4000000000));
      if (f.dlBitrate != null) body.push(...pscWrN(f.dlBitrate, 'DL Available Bitrate', 4, 4000000000));
    }
  } else throw new Error(`PSC dir 应为 dl/ul（${dir}）——PDU Type 2-15 保留（§5.5.3.1）`);
  // future ext（raw）与 padding：总长（含两者）= n*4-2，即本内容 + 扩展头 type/len 字节凑 4 的倍数
  const fext = f.futureExt instanceof Uint8Array ? f.futureExt : Uint8Array.from(f.futureExt || []);
  let pad = f.padding instanceof Uint8Array ? f.padding : Uint8Array.from(f.padding || []);
  if (f.padding == null) {
    const need = (2 + body.length + fext.length) % 4;
    pad = Uint8Array.from(need ? new Array(4 - need).fill(0) : []);
  } else if ((2 + body.length + fext.length + pad.length) % 4 !== 0) {
    // v1.42.0 nit：帧长口径统一为「含 2 octets type/len 框架的扩展头总长」（与解析侧同义——
    // 原先构建侧含框架、解析侧不含，同括注两义）。
    warnings.push(`PSC 显式 padding 后帧长 ${2 + body.length + fext.length + pad.length} octets（含 2 octets type/len 框架）非 4 的倍数（§5.5.3.5）`);
  }
  const out = new Uint8Array(body.length + fext.length + pad.length);
  out.set(Uint8Array.from(body), 0);
  out.set(fext, body.length);
  out.set(pad, body.length + fext.length);
  if (warnings.length) out.warnings = warnings;
  return out;
}

// 反解：域序与条件位按 §5.5.2 两表；指示位=1 而域截断即抛错；指示位=0 的多余尾部按
// 全 0=padding、非 0=futureExt raw（不猜测语义，告警）。时间戳以 BigInt 返回（64-bit
// 无损）；New IE Flags 的 E 位（bit7）按 §A.1.1 连续读扩展 flags octet（其新 IE 值不
// 解析，raw 保留——诚实边界）。
function parsePduSessionInfo(u8) {
  if (!u8 || u8.length < 2) throw new Error('PSC 帧截断（<2 octet）');
  const warnings = [];
  const pduType = u8[0] >> 4;
  if (pduType > 1) throw new Error(`PSC PDU Type ${pduType} 保留（2-15，§5.5.3.1）`);
  const dir = pduType === 0 ? 'dl' : 'ul';
  const rd = (off, n, name) => {
    if (off + n > u8.length) throw new Error(`PSC ${dir} ${name} 截断（需 ${n} 字节 @${off}，总 ${u8.length}）`);
    let v = 0n;
    for (let i = 0; i < n; i++) v = (v << 8n) | BigInt(u8[off + i]);
    return v;
  };
  const f = { pduType, dir, warnings };
  let off = 2;
  if (dir === 'dl') {
    f.qmp = (u8[0] >> 3) & 1;
    f.snp = (u8[0] >> 2) & 1;
    f.msnp = (u8[0] >> 1) & 1;
    if (u8[0] & 1) warnings.push('PSC DL octet1 bit0（spare）非 0');
    f.ppp = (u8[1] >> 7) & 1;
    f.rqi = (u8[1] >> 6) & 1;
    f.qfi = u8[1] & 0x3f;
    if (f.ppp) {
      if (off >= u8.length) throw new Error('PSC DL：PPP=1 但 octet3（PPI）缺失');
      const b = u8[off++];
      f.ppi = (b >> 5) & 7;
      f.bssi = (b >> 1) & 1;
      f.ttnbi = b & 1;
      if ((b >> 2) & 7) warnings.push('PSC DL octet3 bits4-2（spare）非 0');
    }
    if (f.qmp) f.dlSendTs = rd(off, 8, 'DL Sending Time Stamp'), off += 8;
    if (f.snp) f.dlSeq = Number(rd(off, 3, 'DL QFI Sequence Number')), off += 3;
    if (f.msnp) f.dlMbsSeq = Number(rd(off, 4, 'DL MBS QFI Sequence Number')), off += 4;
    if (f.ppp && f.bssi) f.bssize = Number(rd(off, 3, 'BSSize')), off += 3;
    if (f.ppp && f.ttnbi) f.ttnb = Number(rd(off, 2, 'TTNB')), off += 2;
  } else {
    f.qmp = (u8[0] >> 3) & 1;
    f.dlDelayInd = (u8[0] >> 2) & 1;
    f.ulDelayInd = (u8[0] >> 1) & 1;
    f.snp = u8[0] & 1;
    f.n3n9DelayInd = (u8[1] >> 7) & 1;
    f.newIeFlag = (u8[1] >> 6) & 1;
    f.qfi = u8[1] & 0x3f;
    if (f.qmp) {
      f.dlSendTsRep = rd(off, 8, 'DL Sending Time Stamp Repeated'), off += 8;
      f.dlRecvTs = rd(off, 8, 'DL Received Time Stamp'), off += 8;
      f.ulSendTs = rd(off, 8, 'UL Sending Time Stamp'), off += 8;
    }
    if (f.dlDelayInd) f.dlDelay = Number(rd(off, 4, 'DL Delay Result')), off += 4;
    if (f.ulDelayInd) f.ulDelay = Number(rd(off, 4, 'UL Delay Result')), off += 4;
    if (f.snp) f.ulSeq = Number(rd(off, 3, 'UL QFI Sequence Number')), off += 3;
    if (f.n3n9DelayInd) f.n3n9Delay = Number(rd(off, 4, 'N3/N9 Delay Result')), off += 4;
    if (f.newIeFlag) {
      if (off >= u8.length) throw new Error('PSC UL：New IE Flag=1 但 New IE Flags Octet 缺失');
      let flags = u8[off++];
      const F = PSC_FIELDS.newIeFlags;
      f.newIeFlagsRaw = flags;
      const extOctets = [];
      while ((flags >> F.ext) & 1) {
        if (off >= u8.length) throw new Error('PSC UL：New IE Flags 扩展位 E=1 但后续 octet 缺失（§A.1.1）');
        flags = u8[off++];
        extOctets.push(flags);
        warnings.push('PSC UL：New IE Flags 扩展 octet 在场——其新 IE 值不解析（raw 保留）');
      }
      if (extOctets.length) f.newIeFlagsExt = extOctets;
      if ((flags >> F.d1Ind) & 1) f.d1Ind = PSC_U8(u8[off++], 'D1 Ind', 1);
      if ((flags >> F.ulCong) & 1) f.ulCong = Number(rd(off, 2, 'UL Congestion Information')), off += 2;
      if ((flags >> F.dlCong) & 1) f.dlCong = Number(rd(off, 2, 'DL Congestion Information')), off += 2;
      if ((flags >> F.ulBitrate) & 1) f.ulBitrate = Number(rd(off, 4, 'UL Available Bitrate')), off += 4;
      if ((flags >> F.dlBitrate) & 1) f.dlBitrate = Number(rd(off, 4, 'DL Available Bitrate')), off += 4;
    }
  }
  const rest = u8.slice(off);
  if (rest.length && rest.every((b) => b === 0)) f.padding = rest;
  else if (rest.length) { f.futureRaw = rest; warnings.push(`PSC ${dir}：${rest.length} 字节非零尾部按 future extension raw 保留（不解析）`); }
  if ((u8.length + 2) % 4 !== 0) warnings.push(`PSC 帧长 ${u8.length + 2} octets（含 2 octets type/len 框架）非 4 的倍数（§5.5.3.5）`);
  return f;
}

// ---- PDU Set Information（38.415 §6，GTP-U 扩展头 0x04 内容）------------------------
// 批次 AB（v1.34.0）：R19 第二协议层字段级构造/反解，与 §5.5 PSC 同构。§6.5.2.1 仅
// DL PDU Type 0（j10 无 UL 帧型）。布局：octet1 位域（PDU Type/EDB/EPDU/PSSI/Spare）+
// octet2-3 合并 16-bit 视图（QFI bits15-10 + PSSN bits9-0——PSSN 10 bit 跨 octet2 低
// 2 位与 octet3 全字节，§6.5.3.10）+ octet4（Spare/PSI 4 bit）+ PSN 1 octet（恒在场）
// + PSSize 0 or 3 octets（PSSI 指示，§6.5.3.12）+ padding（n*4-2，§6.5.3.13）。布局
// 权威摄取进 38415 schema（frames.pset），gate:nas38415 交叉校验 + 回环。
const PSET_FIELDS = {
  octet1: [{ key: 'pduType', hi: 7, lo: 4 }, { key: 'edb', hi: 3, lo: 3 }, { key: 'epdu', hi: 2, lo: 2 }, { key: 'pssi', hi: 1, lo: 1 }, { key: 'spare', hi: 0, lo: 0, implOnly: true }],
  span: [{ key: 'qfi', hi: 15, lo: 10 }, { key: 'pssn', hi: 9, lo: 0 }],
  octet4: [{ key: 'spare', hi: 7, lo: 4, implOnly: true }, { key: 'psi', hi: 3, lo: 0 }],
  condOctets: ['psn:1:', 'pssize:3:pssi'], // on 空 = 恒在场（§6.5.2.1 表 'PSN | 1'）
};
// CLI --pset 可设键集合（构造器实际读取；pssi 由 pssize 存在性推导、不可直设）。
const PSET_SETTABLE = {
  pset: ['qfi', 'pssn', 'psi', 'psn', 'pssize', 'edb', 'epdu', 'padding'],
};

// 构造 DL PDU SET INFORMATION 帧（扩展头 0x04 内容）。存在性推导：PSSI = PSSize 在场
//（§6.5.3.5——PSSI 指示 PSSize 在场，无独立输入）；PSN 恒在场（缺省 0）；PSI 缺省 0
//（§6.5.3.9：0=发送方无法定义重要度）。帧长（含 padding/future ext）= n*4-2 octets。
function pduSetInfo(f = {}) {
  const warnings = [];
  const qfi = f.qfi != null ? PSC_U8(f.qfi, 'QFI', 63, 'PSET') : 0;
  const pssn = f.pssn != null ? PSC_U8(f.pssn, 'PSSN', 0x3ff, 'PSET') : 0;
  const psi = f.psi != null ? PSC_U8(f.psi, 'PSI', 15, 'PSET') : 0;
  const psn = f.psn != null ? PSC_U8(f.psn, 'PSN', 255, 'PSET') : 0;
  const edb = f.edb ? 1 : 0;
  const epdu = f.epdu ? 1 : 0;
  const pssi = f.pssize != null ? 1 : 0;
  const body = [
    (edb << 3) | (epdu << 2) | (pssi << 1), // octet1（bits7-4 = PDU Type 0）
    ((qfi << 2) | (pssn >> 8)) & 0xff, // octet2：QFI bits7-2 + PSSN 高 2 位
    pssn & 0xff, // octet3：PSSN 低 8 位
    psi & 0x0f, // octet4：spare bits7-4 + PSI bits3-0
    psn & 0xff, // octet5：PSN
  ];
  if (pssi) body.push(...pscWrN(f.pssize, 'PSSize', 3, 0xffffff, 'PSET'));
  const fext = f.futureExt instanceof Uint8Array ? f.futureExt : Uint8Array.from(f.futureExt || []);
  let pad = f.padding instanceof Uint8Array ? f.padding : Uint8Array.from(f.padding || []);
  if (f.padding == null) {
    const need = (2 + body.length + fext.length) % 4;
    pad = Uint8Array.from(need ? new Array(4 - need).fill(0) : []);
  } else if ((2 + body.length + fext.length + pad.length) % 4 !== 0) {
    warnings.push(`PSET 显式 padding 后帧长 ${2 + body.length + fext.length + pad.length} octets（含 2 octets type/len 框架）非 4 的倍数（§6.5.3.13）`);
  }
  const out = new Uint8Array(body.length + fext.length + pad.length);
  out.set(Uint8Array.from(body), 0);
  out.set(fext, body.length);
  out.set(pad, body.length + fext.length);
  if (warnings.length) out.warnings = warnings;
  return out;
}

// 反解：§6.5.2.1 帧序；PSSI=1 而 PSSize 截断即抛错；PDU Type≠0 抛错（§6.5.3.1：1-15
// 保留）；指示位/spare 非 0 告警；尾部全 0=padding、非 0=futureExt raw（不猜测语义）。
function parsePduSetInfo(u8) {
  if (!u8 || u8.length < 5) throw new Error('PSET 帧截断（<5 octet：octet1-5 恒在场）');
  const warnings = [];
  const pduType = u8[0] >> 4;
  if (pduType !== 0) throw new Error(`PSET PDU Type ${pduType} 保留（仅 0=DL PDU SET INFORMATION，§6.5.3.1）`);
  const f = { pduType, warnings };
  f.edb = (u8[0] >> 3) & 1;
  f.epdu = (u8[0] >> 2) & 1;
  f.pssi = (u8[0] >> 1) & 1;
  if (u8[0] & 1) warnings.push('PSET octet1 bit0（spare）非 0');
  f.qfi = (u8[1] >> 2) & 0x3f;
  f.pssn = ((u8[1] & 0x03) << 8) | u8[2];
  if (u8[3] >> 4) warnings.push('PSET octet4 bits7-4（spare）非 0');
  f.psi = u8[3] & 0x0f;
  f.psn = u8[4];
  let off = 5;
  if (f.pssi) {
    if (off + 3 > u8.length) throw new Error('PSET：PSSI=1 但 PSSize 截断（需 3 字节）');
    f.pssize = (u8[off] << 16) | (u8[off + 1] << 8) | u8[off + 2];
    off += 3;
  }
  const rest = u8.slice(off);
  if (rest.length && rest.every((b) => b === 0)) f.padding = rest;
  else if (rest.length) { f.futureRaw = rest; warnings.push(`PSET：${rest.length} 字节非零尾部按 future extension raw 保留（不解析）`); }
  if ((u8.length + 2) % 4 !== 0) warnings.push(`PSET 帧长 ${u8.length + 2} octets（含 2 octets type/len 框架）非 4 的倍数（§6.5.3.13）`);
  return f;
}

// ==== src/nas/codec.js ====
// src/nas/codec.js — M4：NAS 消息级编解码（schema 驱动，行序扫描）。
//
// schema 形如 tools/nasdef.mjs 产物：messages[名称] = 实例数组（行表）+ ies 布局库。
// 编解码规则（TS 24.007 §11 + 24.501/24.301 消息表）：
//   - 消息 = EPD 八位组 + 安全头八位组 + 按表序的 IE 行；
//   - 行格式判定：iei 列 1 位十六进制+ '-' → 半八位组 IEI（T=type2/TV=type1）；
//     2 位 → 全八位组 IEI（TV=type3/TLV=type4）；'V' = 无 IEI（定长由 len 列）；
//     TLV-E/LV-E = type6（16 bit 长度）；len '1/2' = 半八位组行（两行配一字节，高半在前）；
//   - 可选/条件行（presence O/C/CH…）缺省即跳过；M 行缺失报错；
//   - 解码到表尾仍有余字节 → 报错（未知 IE / 版本不匹配的信号）。

// 行格式归类（机械规则，见模块注释）
function rowFormat(r) {
  const iei = (r.iei || '').replace(/[^0-9a-f]/gi, '');
  const fmt = (r.format || '').trim().toUpperCase();
  const len = (r.len || '').trim();
  if (fmt === 'V') return len.startsWith('1/2') ? 'VH' : 'V'; // VH = 半八位组 V（'1/2' 或复合 '1/2- 3/2'——SM TI 行 24.008 §9.5 写法）
  if (fmt === 'T') return 'T'; // type 2：仅 IEI
  if (fmt === 'TV') return iei.length === 1 ? 'TV1' : 'TV'; // type1 / type3
  if (fmt === 'TLV') return 'TLV';
  if (fmt === 'LV') return 'LV';
  if (fmt === 'TLV-E') return 'TLV-E';
  if (fmt === 'LV-E') return 'LV-E';
  // 23.040 TPDU 专用（buildSchema23040 生成）：ADDR = 自描述地址（[长度(半八位组)][TOA][数字]），
  // VP = TP-VP（长度由 octet1 的 TP-VPF 位定：0/1/7 八位组）
  if (fmt === 'ADDR') return 'ADDR';
  if (fmt === 'VP') return 'VP';
  // 'FFS'（早期 Rel-8 占位）/ 其他未知写法 → UNK（不可编解码，解码时跳过）
  return 'UNK';
}

// len 列 → 固定字节数；'1/2' → 0.5（半八位组）；区间/可变（'3-n' 等）→ null
function fixedLen(lenStr) {
  const s = (lenStr || '').trim();
  if (!s) return null;
  if (s === '1/2') return 0.5;
  if (!/^\d+$/.test(s)) return null;
  return parseInt(s, 10);
}

const isMandatory = (p) => /^(M|C(H|L|H)?)$/i.test((p || '').trim()) ? !/^C/i.test(p.trim()) : false;
// M → 必须；C* → 条件（编码时给了值才出现；解码时可有可无）；O* → 可选
function rowPresence(p) {
  const s = (p || '').trim();
  if (/^M$/i.test(s)) return 'M';
  if (/^C/i.test(s)) return 'C';
  return 'O';
}

// IEI 列 → 数值；不可解析 → null（该行不可编解码）。合法单元格：'' / '5B-' / 'B-' 这类
// 1-2 位十六进制（可带尾短横）；'8x'/'Cx'/'Ax' 半八位组 IEI 通配（44.018 §10.5 type1 TV
// 写法，低半是取值域——CHANNEL RELEASE 实证）取高半；'TBD' / 'FFS'（早期 Rel-8 占位）/
// '72C'（规范笔误）都拒绝。
function rowIei(r) {
  const s = (r.iei || '').trim().replace(/-$/, '').trim();
  const xw = /^([0-9a-fA-F])x$/i.exec(s);
  if (xw) return parseInt(xw[1], 16);
  if (!/^[0-9a-fA-F]{1,2}$/.test(s)) return null;
  const v = parseInt(s, 16);
  return isNaN(v) ? null : v;
}

const EPD = { 24501: 0x7e, 24301: null }; // 24301：半八位组 PD，按消息族取值（见 nasPD）

// 24501 头八位组：5GMM（非 8.3 节）=0x7e、5GSM（8.3 节）=0x2e——24.501 Table 9.2
// EPD 5GS MM=7 / 5GS SM=2（低半 0xe 为 24.501 头八位组模型的固定半填充，pycrate oracle
// SHT=1 帧 = 7e01 同构）。BV 批（v1.78.0）勘正：旧值全族同写 0x7e，tshark 对 SM 形
// 明文拒绝（「Not a NAS 5GS PD」）；0x2e 形完整解出消息名（tmp/_bv_probe1）。
// 编码（encMsg）与解码（decOnce）双侧共用本函数——EPD 期望值单点。
function epdOf(spec, inst) {
  if (spec === '24501') return /^8\.3/.test(inst.section || '') ? 0x2e : 0x7e;
  return EPD[spec] || 0;
}

// 24.301 半八位组 protocol discriminator：EMM 消息=7、ESM 消息=2（24.301 Table 9.1：
// EPS session management messages = 2——v1.77.0 BU 勘正：旧值 5 系 §8.2/§8.3 节前缀误读，
// tshark 探针实证 PD5 被 nas-eps 解剖器拒绝（「Not a NAS EPS PD 5」）、PD2 帧按
// [PD|SHT][EBI][TYPE] 头模型正确解出 ESM type（tmp/_bu_esm_probe/_bu_esm2）；
// 24.008：建库时按 §9.x 族写入 inst.pd（RR=6/MM=5/CC=3/GMM=8/SM=10——§9.5 实测 pd=10，
// 独立审核段〔2026-10-28〕勘正旧注「SM=9」笔误）；
// 44.018（RR=6）/24.080（SS=11）：同样建库写入。24080 的 inst.pd 覆盖 8.3 前缀猜测——
// 24080 消息节是 2.x，会误判 7，故 inst.pd 必须先命中。
function nasPD(inst) {
  if (inst.pd != null) return inst.pd;
  return /^8\.3/.test(inst.section || '') ? 2 : 7;
}
// 半八位组行名是否为 protocol discriminator（24.301 表头行）
const isPDRow = (name) => /^protocol discriminator$/.test(name);
// 哪些 spec 的半八位组行做 PD 语义校验（值固定，错位即暴露——防 run 位序反转的自洽盲区）
const VH_PD_SPECS = new Set(['24301', '24008', '44018', '24080', '24011']);

// 半八位组 run 位序计划（TS 24.007 §11.2.1：连续半八位组 IE 序列中，先出现者占
// bits 1-4（低半），第二个占 bits 5-8，交替；内容表行序 = 出现序，规范 §8.1 b)）。
// 无任何例外——24.501 头对 [SHT, spare] 表序 SHT 先 → SHT 低半（pycrate oracle
// SHT=1 帧 = 7e01…、SHT=2 → octet2=0x02 实证）；24.301 头对 [PD, SHT] → PD 低半（0x17 帧）。
// runRows: [{ r, idx }]（连续 VH 行）。返回 { positions: [{ rowIdx, row, oct, half }], runBytes }。
function planVhRun(runRows) {
  let oct = 0;
  let half = 'low'; // 交替游标
  let maxOct = 0;
  const positions = [];
  for (const { r, idx } of runRows) {
    positions.push({ rowIdx: idx, row: r, oct, half });
    maxOct = Math.max(maxOct, oct);
    if (half === 'low') half = 'high';
    else { oct += 1; half = 'low'; }
  }
  return { positions, runBytes: maxOct + 1 };
}

// ---- 解码 ----------------------------------------------------------------------
// bytes: Uint8Array；inst: 消息实例（schema.messages[name][k]）；spec: '24501'|'24301'
// 返回 { parts: [{ row, rowIdx, value }], consumed, warnings }；value：V/VH=字节数/半八位组数值，
// TV/TLV/LV/E 类=值部分字节，T=null。message identity 行校验 msgType。
// warnings：宽容处理的提示串（可选行 IEI 命中但长度越界按缺席等），空数组 = 无。
// 条件/可选的非 IEI 定长 V 行（presence C/O）线缆级不可探测——按包含数递增枚举组合
// （cap 2^6），首个整流成功的组合为准（最小包含优先）。
// schema（可选）：29274 分支用于分组 IE 子树展开与 piggyback 内嵌消息类型反查（src/nas/gtpc.js）；
// 其余 spec 忽略。
function decMsg(inst, bytes, spec = '24501', schema = null) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  // GTPv2-C（29.274）：头与 IE 框架不同（TLIV/Instance），派发专用实现（src/nas/gtpc.js）
  if (spec === '29274') return decGtpcMsg(inst, u8, schema);
  // GTPv1-C（29.060）：头 8 八位组必配 + TV/TLV 主表驱动，派发专用实现（src/nas/gtpv1.js）
  // BF 批（v1.62.0）：29.281 GTPv1-U 消息面同款行模型（同头形、同 §8.1 Format 语义，
  // 几何经 GTPU_IE_GEOMETRY 标注进 schema）——同路派发。
  if (spec === '29060' || spec === '29281') return decGtpv1Msg(inst, u8, schema);
  // PFCP（29.244）：Type(2)+Length(2) IE 框架，派发专用实现（src/nas/pfcp.js）
  if (spec === '29244') return decPfcpMsg(inst, u8, schema);
  // 歧义行：非头部的 C/O 定长 V 行
  const amb = [];
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const name = (r.name || '').toLowerCase();
    if (rowFormat(r) !== 'V') continue;
    if (/extended protocol discriminator|security header type|message (identity|type)/.test(name)) continue;
    if (fixedLen(r.len) == null) continue; // 可变 V 走剩余全吞，无歧义
    if (rowPresence(r.presence) !== 'M') amb.push(ri);
  }
  const k = Math.min(amb.length, 6);
  let lastErr = null;
  for (let mask = 0; mask < (1 << k); mask++) {
    const force = new Set();
    for (let b = 0; b < k; b++) if (mask & (1 << b)) force.add(amb[b]);
    const notes = [];
    try {
      const r = decOnce(inst, u8, spec, force, notes);
      return { ...r, warnings: notes };
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('解码失败');
}

function decOnce(inst, u8, spec, force, notes = []) {
  let off = 0;
  const parts = [];
  const epd = epdOf(spec, inst);
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const f = rowFormat(r);
    const name = (r.name || '').toLowerCase();
    const pres = rowPresence(r.presence);
    // 消息头三件：EPD / 安全头 / 消息类型（表内 V 行，特判）
    if (f === 'V' && /extended protocol discriminator/.test(name)) {
      if (off >= u8.length) { if (pres === 'M') throw new Error('消息截断（EPD）'); break; }
      const b = u8[off++];
      if (epd && b !== epd) throw new Error(`EPD 不匹配: 0x${b.toString(16)} ≠ 0x${epd.toString(16)}`);
      parts.push({ row: r, rowIdx: ri, value: Uint8Array.of(b) });
      continue;
    }
    if (f === 'V' && /security header type/.test(name)) {
      if (off >= u8.length) { if (pres === 'M') throw new Error('消息截断（SHT）'); break; }
      parts.push({ row: r, rowIdx: ri, value: Uint8Array.of(u8[off++]) });
      continue;
    }
    if (f === 'V' && /message (identity|type)/.test(name)) {
      if (off >= u8.length) { if (pres === 'M') throw new Error('消息截断（消息类型）'); break; }
      const b = u8[off++];
      // 24.008 类型表含通配位（TI/序号），按掩码比较；24.501/24.01 精确比较
      if (inst.msgType != null && (inst.msgMask != null ? (b & inst.msgMask) !== (inst.msgType & inst.msgMask) : b !== inst.msgType)) {
        throw new Error(`消息类型不匹配: 0x${b.toString(16)} ≠ 0x${inst.msgType.toString(16)}`);
      }
      parts.push({ row: r, rowIdx: ri, value: Uint8Array.of(b) });
      continue;
    }
    if (f === 'VH') {
      // 半八位组 run：整段按 planVhRun 位序一起处理（TS 24.007 §11.2.1 先出现占低半）
      let j = ri;
      while (j < inst.rows.length && rowFormat(inst.rows[j]) === 'VH') j++;
      const runRows = inst.rows.slice(ri, j).map((rr, k) => ({ r: rr, idx: ri + k }));
      const { positions, runBytes } = planVhRun(runRows);
      if (off + runBytes > u8.length) throw new Error('消息截断（半八位组行）');
      for (const p of positions) {
        const pname = (p.row.name || '').toLowerCase();
        const byte = u8[off + p.oct];
        const n = p.half === 'high' ? byte >> 4 : byte & 0x0f;
        if (VH_PD_SPECS.has(spec) && isPDRow(pname) && n !== nasPD(inst)) {
          throw new Error(`PD 不匹配: ${n} ≠ ${nasPD(inst)}`);
        }
        parts.push({ row: p.row, rowIdx: p.rowIdx, value: /spare half octet/i.test(pname) ? null : n });
      }
      off += runBytes;
      ri = j - 1; // 外层 for ++ 后跳到 run 后
      continue;
    }
    const flen = fixedLen(r.len);
    if (f === 'V') {
      // 可变 V（len 含 n）：值 = 至消息尾（规范注记式 IE，如 EMM TRANSPORT 的 Data
      // container『encoded in all remaining octets』）。M 必吞；C/O 尾随自定位——
      // 有余字节即在并吞到结尾，无则缺席。
      if (flen == null) {
        if (pres === 'M' || off < u8.length) {
          parts.push({ row: r, rowIdx: ri, value: u8.slice(off) });
          off = u8.length;
        }
        continue;
      }
      // 定长 V：M 必配；C/O 非输出行不可探测，由外层枚举 force 决定
      if (pres !== 'M' && !force.has(ri)) continue;
      if (off + flen > u8.length) {
        if (pres === 'M') throw new Error(`消息截断（${r.name} 需要 ${flen} 字节）`);
        break;
      }
      parts.push({ row: r, rowIdx: ri, value: u8.slice(off, off + flen) });
      off += flen;
      continue;
    }
    if (f === 'T' || f === 'TV1' || f === 'TV' || f === 'TLV' || f === 'TLV-E') {
      // 有 IEI 的行：peek 匹配才消费；IEI 不可解析（规范 'TBD' 占位）→ 该行不可编解码，跳过
      const ieiVal = rowIei(r);
      if (ieiVal == null) continue;
      if (f === 'T') {
        if (off < u8.length && u8[off] === ieiVal) {
          parts.push({ row: r, rowIdx: ri, value: null });
          off += 1;
        } else if (pres === 'M') throw new Error(`必配 T 行缺失: ${r.name} (IEI 0x${ieiVal.toString(16)})`);
        continue;
      }
      if (f === 'TV1') {
        if (off < u8.length && (u8[off] >> 4) === ieiVal) {
          parts.push({ row: r, rowIdx: ri, value: u8[off] & 0x0f });
          off += 1;
        } else if (pres === 'M') throw new Error(`必配 TV1 行缺失: ${r.name}`);
        continue;
      }
      // TV/TLV/TLV-E：首字节 = IEI
      if (off < u8.length && u8[off] === ieiVal) {
        const fmt = f;
        if (fmt === 'TV') {
          const vlen = flen == null ? null : flen - 1; // len 列含 IEI 八位组
          if (vlen == null) {
            parts.push({ row: r, rowIdx: ri, value: u8.slice(off + 1) });
            off = u8.length;
          } else if (off + 1 + vlen > u8.length) {
            // 可选行 IEI 命中但字节不足 → 按缺席处理（后续行的数据，非本 IE）
            if (pres === 'M') throw new Error(`消息截断（TV ${r.name}）`);
            notes.push(`IEI 0x${ieiVal.toString(16)}（${r.name}）命中但余字节不足，按缺席处理`);
          } else {
            parts.push({ row: r, rowIdx: ri, value: u8.slice(off + 1, off + 1 + vlen) });
            off += 1 + vlen;
          }
        } else {
          // 可选 TLV 行长度越界（L > 余量）→ 按缺席处理：该字节属于后续行/尾段
          let sane = true;
          if (fmt === 'TLV') {
            if (off + 1 >= u8.length || off + 2 + u8[off + 1] > u8.length) sane = false;
          } else if (off + 2 >= u8.length || off + 3 + ((u8[off + 1] << 8) | u8[off + 2]) > u8.length) sane = false;
          if (!sane && pres !== 'M') {
            notes.push(`IEI 0x${ieiVal.toString(16)}（${r.name}）命中但长度越界，按缺席处理`);
            continue;
          }
          const { value, next } = decIE(fmt, ieiVal, u8, off);
          parts.push({ row: r, rowIdx: ri, value });
          off = next;
        }
      } else if (pres === 'M') throw new Error(`必配行缺失: ${r.name} (IEI 0x${ieiVal.toString(16)})`);
      continue;
    }
    if (f === 'ADDR') {
      // 23.040 TP-OA/TP-DA/TP-RA：[长度（有效半八位组数 0-12）][TOA][数字半八位组]
      if (off >= u8.length) {
        if (pres === 'M') throw new Error('消息截断（TP 地址）');
        break;
      }
      const total = 2 + Math.ceil(u8[off] / 2);
      if (off + total > u8.length) throw new Error('消息截断（TP 地址）');
      parts.push({ row: r, rowIdx: ri, value: u8.slice(off, off + total) });
      off += total;
      continue;
    }
    if (f === 'VP') {
      // 23.040 TP-VP：长度由 octet1 的 TP-VPF 位定（位5-4：00 无 / 10 相对 1 八位组 /
      // 01 增强 7 / 11 绝对 7）——u8[0] 恒为 TPDU 首字节（TP-MTI 行所在）
      const vpf = (u8[0] >> 3) & 0x03;
      const vlen = vpf === 0 ? 0 : vpf === 2 ? 1 : 7;
      if (vlen) {
        if (off + vlen > u8.length) throw new Error('消息截断（TP-VP）');
        parts.push({ row: r, rowIdx: ri, value: u8.slice(off, off + vlen) });
        off += vlen;
      }
      continue;
    }
    if (f === 'LV' || f === 'LV-E') {
      // 无 IEI 的长度前置行。M：必须消费；C/O：消息尾部的可选 LV 自定位——
      // 有余字节即在并消费（NAS 中可选非 IEI 行只出现在表尾），无则缺席。
      if (pres === 'M' || off < u8.length) {
        const { value, next } = decIE(f, null, u8, off);
        parts.push({ row: r, rowIdx: ri, value });
        off = next;
      }
      continue;
    }
    if (f === 'UNK') continue; // FFS 等占位行：不可解码
    throw new Error(`行 ${r.name}: 未知格式 ${f}`);
  }
  if (off !== u8.length) {
    throw new Error(`消息尾部余 ${u8.length - off} 字节（未知 IE 或 schema 版本不匹配）`);
  }
  return { parts, consumed: off };
}

// ---- 编码 ----------------------------------------------------------------------
// parts: [{ rowIdx, value }]（value 语义同 decMsg）；缺省 V 行取默认值（EPD/SHT=0，消息类型=msgType，
// spare 半八位组=0）；C/O 行仅当给出 part 才编码。返回 Uint8Array。
function encMsg(inst, parts = [], spec = '24501', gtpcHdr = undefined) {
  // GTPv2-C：头（TEID/Seq 非表内 IE）经第 4 参还原，缺省 T=1/TEID=0/Seq=0（采样/回环零值）
  if (spec === '29274') return encGtpcMsg(inst, parts, gtpcHdr);
  if (spec === '29060' || spec === '29281') return encGtpv1Msg(inst, parts, gtpcHdr);
  if (spec === '29244') return encPfcpMsg(inst, parts, gtpcHdr);
  const byRow = new Map(parts.map((p) => [p.rowIdx, p.value]));
  const out = [];
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const f = rowFormat(r);
    const name = (r.name || '').toLowerCase();
    const has = byRow.has(ri);
    const val = byRow.get(ri);
    if (f === 'V' && /extended protocol discriminator/.test(name)) {
      out.push(has ? val[0] : epdOf(spec, inst));
      continue;
    }
    if (f === 'V' && /security header type/.test(name)) {
      out.push(has ? val[0] : 0);
      continue;
    }
    if (f === 'V' && /message (identity|type)/.test(name)) {
      out.push(has ? val[0] : inst.msgType ?? 0);
      continue;
    }
    if (f === 'VH') {
      // 半八位组 run：整段按 planVhRun 位序一次写入（低半补位由 0 填充）
      let j = ri;
      while (j < inst.rows.length && rowFormat(inst.rows[j]) === 'VH') j++;
      const runRows = inst.rows.slice(ri, j).map((rr, k) => ({ r: rr, idx: ri + k }));
      const { positions, runBytes } = planVhRun(runRows);
      const buf = new Uint8Array(runBytes);
      for (const p of positions) {
        const pname = (p.row.name || '').toLowerCase();
        let v;
        if (VH_PD_SPECS.has(spec) && isPDRow(pname)) v = nasPD(inst);
        else if (/spare half octet/i.test(pname)) v = 0;
        else v = byRow.has(p.rowIdx) ? byRow.get(p.rowIdx) : 0;
        if (v == null || typeof v !== 'number') v = 0;
        buf[p.oct] |= p.half === 'high' ? (v & 0x0f) << 4 : v & 0x0f;
      }
      out.push(...buf);
      ri = j - 1;
      continue;
    }
    const pres = rowPresence(r.presence);
    if (f === 'V') {
      if (!has) {
        if (pres === 'M') throw new Error(`必配 V 行缺值: ${r.name}`);
        continue;
      }
      out.push(...val);
      continue;
    }
    if (f === 'T') {
      const ieiVal = rowIei(r);
      if (ieiVal == null || !has) { if (ieiVal != null && pres === 'M') throw new Error(`必配 T 行缺值: ${r.name}`); continue; }
      out.push(ieiVal);
      continue;
    }
    if (f === 'TV1') {
      const ieiVal = rowIei(r);
      if (ieiVal == null || !has) { if (ieiVal != null && pres === 'M') throw new Error(`必配 TV1 行缺值: ${r.name}`); continue; }
      out.push(encIE('TV1', ieiVal, val)[0]);
      continue;
    }
    if (f === 'ADDR' || f === 'VP') {
      // 23.040：值原样回写（ADDR 含长度/TOA；VP 按 VPF 定长的字节串）；VP 缺席 = VPF 为 0
      if (!has) {
        if (pres === 'M') throw new Error(`必配行缺值: ${r.name}`);
        continue;
      }
      out.push(...val);
      continue;
    }
    if (f === 'TV' || f === 'TLV' || f === 'TLV-E' || f === 'LV' || f === 'LV-E') {
      const ieiVal = rowIei(r);
      if (ieiVal == null && f !== 'LV' && f !== 'LV-E') {
        continue; // TBD IEI：不可编码
      }
      if (!has) { if (pres === 'M') throw new Error(`必配行缺值: ${r.name}`); continue; }
      out.push(...encIE(f, ieiVal, val));
      continue;
    }
    if (f === 'UNK') { if (pres === 'M') throw new Error(`必配行格式未知(FFS 存根): ${r.name}`); continue; }
    throw new Error(`行 ${r.name}: 未知格式 ${f}`);
  }
  return Uint8Array.from(out);
}

// BI 批（v1.65.0）：24008 GSMTAP 真机 oracle 配套——行级字节布局计算器。
// 与 encMsg 同一游标算术（分支逐一对齐：头 V 行恒 1B、VH run 恒 runBytes、TLV=2+值、
// TLV-E=3+值、LV=1+值、LV-E=2+值、TV=1+值、TV1/T=1、ADDR/VP=值原样），只记跨度不产字节。
// 每条在 parts 里在场的行（及恒在场的头行/VH run 全部半八位组位）得到
// { rowIdx, row, pos, size, half?, kind }（pos 相对消息起点；VH 行两半共享同一字节跨度，
// half 标记归属）；headerEnd = 'Message type/identity' 行末（无该行的消息回退到首个 VH
// run 末）。oracle ourFrame 以此构建本构建侧 IE 跨度做包含/覆盖对拍；spare/缺席行无跨度。
function layoutRows(inst, parts, spec = '24501') {
  const byRow = new Map(parts.map((p) => [p.rowIdx, p.value]));
  const spans = [];
  let cur = 0;
  let headerEnd = null;
  let leadVhEnd = null;
  for (let ri = 0; ri < inst.rows.length; ri++) {
    const r = inst.rows[ri];
    const f = rowFormat(r);
    const name = (r.name || '').toLowerCase();
    if (f === 'VH') {
      let j = ri;
      while (j < inst.rows.length && rowFormat(inst.rows[j]) === 'VH') j++;
      const runRows = inst.rows.slice(ri, j).map((rr, k) => ({ r: rr, idx: ri + k }));
      const { positions, runBytes } = planVhRun(runRows);
      for (const p of positions) spans.push({ rowIdx: p.rowIdx, row: p.row, pos: cur + p.oct, size: 1, half: p.half, kind: 'VH' });
      cur += runBytes;
      if (leadVhEnd == null) leadVhEnd = cur;
      ri = j - 1;
      continue;
    }
    const flen = fixedLen(r.len);
    const has = byRow.has(ri);
    const val = byRow.get(ri);
    if (f === 'V') {
      // 头三件恒在场（编码缺省值）；IE 区 V 行以 parts 在场性为准
      const isHdr = /extended protocol discriminator|security header type|message (identity|type)/.test(name);
      const size = isHdr ? 1 : has ? (flen == null ? val.length : flen) : 0;
      if (size > 0) {
        spans.push({ rowIdx: ri, row: r, pos: cur, size, kind: 'V' });
        cur += size;
      }
      if (isHdr && /message (identity|type)/.test(name) && headerEnd == null) headerEnd = cur;
      continue;
    }
    const sizeOf = (f === 'T' || f === 'TV1') ? (has ? 1 : 0)
      : f === 'TV' ? (has ? 1 + val.length : 0)
      : f === 'TLV' ? (has ? 2 + val.length : 0)
      : f === 'TLV-E' ? (has ? 3 + val.length : 0)
      : f === 'LV' ? (has ? 1 + val.length : 0)
      : f === 'LV-E' ? (has ? 2 + val.length : 0)
      : f === 'ADDR' || f === 'VP' ? (has ? val.length : 0)
      : 0; // UNK：零字节
    if (sizeOf > 0) {
      spans.push({ rowIdx: ri, row: r, pos: cur, size: sizeOf, kind: f });
      cur += sizeOf;
    }
  }
  return { spans, headerEnd: headerEnd != null ? headerEnd : (leadVhEnd != null ? leadVhEnd : 0), total: cur };
}

// ==== src/nas/values.js ====
// src/nas/values.js — M4：IE 位布局 → 值采样（字段级合法值）与字段打包。
//
// 布局 = parseBitTable 产物（schema.ies[section].layouts[n].octets）：
//   [{ octet:'3', count:1, open, compressed, fields:[{name,bits,hi,lo}] }]
// 采样规则：
//   - spare / '0' / 空名 → 0；其余字段按位宽均匀取值；
//   - count>1：按行布局重复 count 个 octet（值可各不相同）；
//   - open（'3-n' 开区间尾段）：采 1..3 个该行布局的 octet；
//   - framed=true（TV/TLV/LV 外框由 codec 提供）：剥离首部 '…IEI' 与 'Length of …' 行。
function layoutSample(octets, rng, framed = false, opts = {}) {
  const rows = [...octets];
  if (framed) {
    while (rows.length && isIeiRow(rows[0])) rows.shift();
    while (rows.length && isLenRow(rows[0])) rows.shift();
  }
  const fields = {};
  const bytes = [];
  // 批次 AC（v1.35.0）：内嵌长度字段一致性——布局中部的「Length of X」/「X Length」
  // 单八位组行（MM Context APN、Node Identifier、SCEF ID、Remote User ID、Classmark 2
  // 等）原先按随机值采样，与后随内容字节数不符 → 独立实现方按长度越界读、判 malformed。
  // 现记录长度字节位偏移，行扫描完成后回填实际后随行的采样字节数（open 行按本回合
  // 采到的重复数折算）。只回填不改变行序与其它字段值。
  const lenPatches = [];
  const rowRanges = [];
  // 批次 AT（v1.52.0）：suppressExplicitTails——PFCP 布局的「These octet(s) is/are
  // present only if explicitly specified」尾段行按规范语义是缺省不存在的；随机吐
  // 1..3 字节在分组 IE 内成为残留（tshark 子 IE 解剖器读完核心后残留 → 下一子头错位
  // 连环炸）。开启后该固定文案 open 行采 0 重复；不影响 Network Instance 等内容型 open 行。
  // 同旗标还修 PFCP 侧 count² 平方病：count>1 行 packRow 每次重复已产 count 字节，
  // 而 reps 又取 count → 4B 行（Precedence/Measurement Period/延迟阈值）产 16B 且低位
  // 恒零。旗标下改为 count=1 行克隆逐八位组独立采样（「值可各不相同」的本意）；旗标
  // 关闭时 29060/29274 行为逐字节不变（那些路径有定长校验兜底，不碰回归风险）。
  const suppressTails = !!opts.suppressExplicitTails;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    // AT 批：PFCP 旗标下放行多字节长度行（isInnerLenRow 旧守卫 count===1 把 294 DNS
    // Query/Response Filter 的 2B「Length of Domain Name Pattern」整个排除在修补外，
    // 高字节随机 → tshark 读巨值越界）。旗标关闭时守卫照旧，29060/29274 零漂移。
    const lenShape = isInnerLenRow(row, suppressTails);
    const n = row.compressed ? 1 : row.count || 1;
    const explicitTail = suppressTails && row.open
      && /present only if explicitly specified/i.test(String(row.fields?.[0]?.name || ''));
    // 长度形态行恒采 1 个重复（长度字段自身不重复——8.123 Remote User ID 等全 open
    // 布局里 Length 行与内容行同为 '5-n*'，重复无意义）
    let reps;
    let rowRep = row;
    if (lenShape) reps = 1;
    else if (explicitTail) reps = 0;
    else if (row.open) reps = 1 + Math.floor(rng() * 3);
    else if (suppressTails && n > 1) { reps = n; rowRep = { ...row, count: 1 }; }
    else reps = n;
    const start = bytes.length;
    for (let k = 0; k < reps; k++) bytes.push(...packRow(rowRep, fields, rng, k, reps));
    rowRanges[i] = [start, bytes.length];
    if (lenShape && rows[i + 1]) lenPatches.push({ at: start, width: bytes.length - start, next: i + 1, name: row.fields[0].name });
  }
  for (const p of lenPatches) {
    // AT 批（v1.52.0）：长度行按行宽做大端回填（旧行为只写字节 0——PFCP 侧 2B 长度行
    // 〔DNS Query/Response Filter 的 Length of Domain Name Pattern〕在 count 拆分后高
    // 字节随机 → tshark 读巨值越界；1B 行为与旧版完全一致）。
    const L = rowRanges[p.next][1] - rowRanges[p.next][0];
    for (let bi = 0; bi < p.width; bi++) {
      bytes[p.at + p.width - 1 - bi] = (L >> (8 * bi)) & 0xff;
    }
    fields[p.name] = L;
  }
  return { bytes: Uint8Array.from(bytes), fields };
}

// 布局中部的长度指示行：单字段、整 8 bit、名形如 'Length of X' / 'X Length'。
// （framed 剥离只针对行首外框 Length；此处补内嵌长度行——open 标记不豁免，见上。）
// allowMulti（AT 批）：PFCP 旗标下放行多字节长度行（294 DNS 过滤器的 2B 长度域），
// 由调用侧按行宽做大端回填；缺省守卫 count===1 维持 29060/29274 旧行为。
function isInnerLenRow(row, allowMulti = false) {
  return !row.half && !row.compressed && (allowMulti || (row.count || 1) === 1)
    && row.fields.length === 1 && row.fields[0].bits === 8
    && /^(length of .+|.+ length)$/i.test(String(row.fields[0].name || '').trim());
}

function isIeiRow(row) {
  return row.fields.length === 1 && row.fields[0].bits === 8 && / IEI$/i.test(row.fields[0].name);
}
function isLenRow(row) {
  return row.fields.length === 1 && row.fields[0].bits === 8 && /^length of /i.test(row.fields[0].name);
}

// 采样值域（批次 R）：数字域（MCC/MNC/IMSI 等）只取 0-9，避免独立实现方按 BCD
// 解码时因 0xA-0xF 非法数字早停；8 位 IMSI/MSISDN/IMEI 格按两个 BCD 数字填，
// 其余字段仍全域均匀。语义级内容（TFT/APN 内部长度等）不在采样器建模范围。
// 批次 U3：Value-Digits 是二进制整数（29244 §8.2.84 Multiplier 的 48-bit 值）的
// 字节，不是 BCD 数字串——排除出 digit 分支，按全域采样。
const NON_BCD_DIGIT = /^value[-\s]?digits?$/i;
function sampleValue(f, rng) {
  if (/digit/i.test(f.name) && !NON_BCD_DIGIT.test(String(f.name || '').trim())) {
    return Math.floor(rng() * Math.min(10, 2 ** f.bits));
  }
  if (/^(IMSI|MSISDN|IMEI)$/i.test(f.name) && f.bits === 8) {
    return (Math.floor(rng() * 10) << 4) | Math.floor(rng() * 10);
  }
  return Math.floor(rng() * 2 ** f.bits);
}

function packRow(row, fields, rng, rep, reps) {
  const out = [];
  let acc = 0;
  let bits = 0;
  for (const f of row.fields) {
    let v;
    const fv = fillerValue(f);
    if (fv != null) {
      v = fv;
      const key = reps > 1 ? `${f.name}[${rep}]` : f.name;
      fields[key] = v; // 填充位按字面常量展示（'1111' → 15）
    } else if (isSpare(f)) v = 0;
    else {
      v = sampleValue(f, rng);
      const key = reps > 1 ? `${f.name}[${rep}]` : f.name;
      fields[key] = v;
    }
    acc = (acc << ((f.pre || 0) + f.bits)) | v;
    bits += (f.pre || 0) + f.bits;
  }
  // 行内字段按 hi→lo（MSB first）已依序拼装（pre = 前导空位补 0）；若行不满 8*count 位，
  // 低位补 0 由调用方保证
  const totalBits = row.half ? 4 : 8 * (row.compressed ? 1 : row.count || 1);
  const pad = Math.max(0, totalBits - bits);
  acc <<= pad;
  const nb = row.half ? 1 : totalBits / 8;
  for (let i = 0; i < nb; i++) out.push((acc >> (8 * (nb - 1 - i))) & 0xff);
  return out;
}

// 字段值 → 布局字节（UI 编辑/回编用）：fields 命名同 layoutSample。
function layoutPack(octets, fieldVals, framed = false) {
  const rows = [...octets];
  if (framed) {
    while (rows.length && isIeiRow(rows[0])) rows.shift();
    while (rows.length && isLenRow(rows[0])) rows.shift();
  }
  const bytes = [];
  for (let ri = 0; ri < rows.length; ri++) {
    const row = rows[ri];
    const n = row.compressed ? 1 : row.count || 1;
    for (let k = 0; k < n; k++) {
      let acc = 0;
      let bits = 0;
      for (const f of row.fields) {
        const key = n > 1 ? `${f.name}[${k}]` : f.name;
        const fv = fillerValue(f);
        // 填充位是规范字面常量（29.060 §7.7.64 '1111' = MNC 第三位无值）：回编恒写字面，
        // 不采信编辑值——写错即filler 语义破坏（反解侧对非字面值告警）。
        const v = fv != null ? fv : (fieldVals[key] ?? 0);
        acc = (acc << ((f.pre || 0) + f.bits)) | (v & ((1 << f.bits) - 1));
        bits += (f.pre || 0) + f.bits;
      }
      const totalBits = row.half ? 4 : 8 * (row.compressed ? 1 : row.count || 1);
      acc <<= Math.max(0, totalBits - bits);
      const nb = row.half ? 1 : totalBits / 8;
      for (let i = 0; i < nb; i++) bytes.push((acc >> (8 * (nb - 1 - i))) & 0xff);
    }
  }
  return Uint8Array.from(bytes);
}

function isSpare(f) {
  return /spare/i.test(f.name) || f.name === '0' || f.name === ''
    || /^x(\nx)*$/.test(f.name); // x 位 = spare（29.060 §7.7.25B 散文锚：'The spare bits x … shall be set to 0 by the sending side and shall not be evaluated by the receiving side'——v1.22.0 起表/图管线的 x 记号统一按 spare 置 0，不再随机取值）
}

// 填充位：字段名是纯 0/1 串（29.060 §7.7.64 '1111'：MNC 只两位时 bits 5-8 of octet 5
// 编码为 1111——规范字面常量，不是 spare 也不是随机值）。返回字面数值，否则 null。
function fillerValue(f) {
  const s = String(f.name || '').replace(/\s+/g, '');
  return /^[01]+$/.test(s) ? parseInt(s, 2) : null;
}

// ---- 位布局反解（layoutPack/layoutSample 的逆） --------------------------------
// bytes → 命名字段值。framed=true 时先剥离首部 IEI 行与 Length 行（TV/TLV/LV 值域）。
// 半八位组布局（half 行）：VH/TV1 行的值是 nibble 数值（0-15）——直接按 4 位域解。
// 字节不足/剩余未知字节 → 抛错（调用方回退原始 hex 展示）。
function layoutUnpack(octets, bytes, framed = false) {
  const rows = [...octets];
  if (framed) {
    while (rows.length && isIeiRow(rows[0])) rows.shift();
    while (rows.length && isLenRow(rows[0])) rows.shift();
  }
  const fields = {};
  const warnings = [];
  if (typeof bytes === 'number') {
    // type-1 TV 旧形态容差：24.008/44.018 自带表把 IEI 半字段与内容写在同一整八位组行
    //（首域占高位半八位组 lo≥5、余域 hi≤4）——与整八位组 IEI 行（isIeiRow）同理在消费
    // 侧剥离，余域按基 5 重排为半八位组行（与建库侧 fillSee24301 的 TV/1 适配同构），
    // 否则数值路径只能抛「仅适用于半八位组布局」而整行失明。仅 TV1 行触发本路径（codec
    // 已消费高位 IEI），位置判据足够、不看域名；几何不一致（bits≠hi−lo+1、重排后超 4 位
    // ——bitsanchor 走查伪影，台账在案）不容差，保持抛错（诚实失明优于垃圾值）。
    // 数值路径仅在 VH（framed=false）/ TV1（framed=true）行触发；本容差只对 framed
    //（TV1——codec 已消费高位 IEI）生效，VH 行走规范半八位组布局不容差。
    if (framed) for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (r.half) continue;
      const f0 = r.fields[0];
      if (!f0 || (f0.lo || 8) < 5) continue;
      const rest = r.fields.slice(1);
      if (!rest.length || !rest.every((f) => (f.hi || 8) <= 4)) continue;
      if (!rest.every((f) => f.bits === f.hi - f.lo + 1)) continue;
      let prevLo = 5;
      let total = 0;
      let ok = true;
      const nf = rest.map((f) => {
        const pre = prevLo - f.hi - 1;
        if (pre < 0) ok = false;
        prevLo = f.lo;
        total += Math.max(pre, 0) + f.bits;
        return { name: f.name, bits: f.bits, hi: f.hi, lo: f.lo, ...(pre > 0 ? { pre } : {}) };
      });
      if (!ok || total > 4) continue;
      rows[i] = { ...r, half: true, fields: nf };
    }
    let acc = bytes & 0x0f;
    for (const row of rows) {
      if (!row.half) throw new Error('布局反解：数值输入仅适用于半八位组布局');
      let shift = 4; // 每行独立解读同一 nibble（nibble 只承载一个半八位组；多行=同八位组变体伪影，逐行覆盖）
      for (const f of row.fields) {
        shift -= f.pre || 0;
        if (f.pre) {
          const pv = (acc >> shift) & ((1 << f.pre) - 1);
          if (pv) warnings.push(`${f.name} 前导空位应为 0，实为 ${pv}`);
        }
        shift -= f.bits;
        const v = (acc >> shift) & ((1 << f.bits) - 1);
        const fv = fillerValue(f);
        if (fv != null) {
          if (v !== fv) warnings.push(`${f.name} 应为填充值 ${fv}（二进制 ${f.name.replace(/\s+/g, '')}），实为 ${v}`);
          fields[f.name] = v;
          continue;
        }
        if (isSpare(f)) {
          if (v !== 0) warnings.push(`${f.name} 应为 spare 0，实为 ${v}`);
          continue;
        }
        fields[f.name] = v;
      }
    }
    return { fields, warnings };
  }
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  let pos = 0;
  for (const row of rows) {
    const rowBytes = row.half ? 1 : row.compressed ? 1 : row.count || 1;
    const n = row.compressed ? 1 : row.count || 1;
    // 可选 octet（标签带 *）在字节耗尽时缺席
    const optional = /\*$/.test(row.octet);
    if (optional && u8.length - pos < rowBytes) break;
    const reps = row.open ? Math.max(1, Math.floor((u8.length - pos) / rowBytes)) : n;
    for (let k = 0; k < reps; k++) {
      if (pos + rowBytes > u8.length) throw new Error(`布局反解：字节不足（${row.octet} 行）`);
      let acc = 0;
      for (let i = 0; i < rowBytes; i++) acc = (acc << 8) | u8[pos++];
      let shift = row.half ? 4 : rowBytes * 8;
      if (row.half) acc &= 0x0f;
      for (const f of row.fields) {
        shift -= f.pre || 0;
        if (f.pre) {
          const pv = (acc >> shift) & ((1 << f.pre) - 1);
          if (pv) warnings.push(`${f.name} 前导空位应为 0，实为 ${pv}`);
        }
        shift -= f.bits;
        const v = (acc >> shift) & ((1 << f.bits) - 1);
        const key = n > 1 || row.open ? `${f.name}[${k}]` : f.name;
        const fv = fillerValue(f);
        if (fv != null) {
          if (v !== fv) warnings.push(`${key} 应为填充值 ${fv}（二进制 ${f.name.replace(/\s+/g, '')}），实为 ${v}`);
          fields[key] = v;
          continue;
        }
        if (isSpare(f)) {
          if (v !== 0) warnings.push(`${key} 应为 spare 0，实为 ${v}`);
          continue; // spare 不进字段表
        }
        fields[key] = v;
      }
    }
  }
  if (pos !== u8.length) throw new Error(`布局反解：尾部余 ${u8.length - pos} 字节（开区间行与实际长度不符）`);
  return { fields, warnings };
}

// ==== src/nas/diff.js ====
// src/nas/diff.js — M4：NAS 版本间语义 Diff。
//
// NAS 不是 ASN.1：语义规则按消息表/IE 表重定义（ASN.1 的 D1-D13 不适用）。
// 判定口径（两侧版本各自的规范表格为准）：
//   - 消息族新增/删除 → info（新消息老收端忽略不了——但 NAS 收端对未知消息类型回
//     STATUS/#97，属协议内处理路径，不算字节破坏）；
//   - 同名消息 msgType 值变更 → break（同名消息在线缆上变成另一种语义）；
//   - 行新增（TLV/LV 类带 IEI）→ ok（老收端按 IEI 未知跳过，24.501 §4.4.6 /
//     24.301 §4.4.6 忽略未知 IE；长度域保证可跳过）；
//   - 行新增（TV 类带 IEI）→ warn（TV 无长度域，老收端不识该 IEI 即不知值宽、无法跳过，
//     后续 IE 全部错位——v1.23.0 起分档，原先「有 IEI 即 ok」的推理对 TV 不成立）；
//   - 行新增（V/VH/LV 类无 IEI）→ warn（老收端无法定位，后续 IE 全部错位）；
//   - 行删除 → info（新版本流里可能出现的 IE 老收端不认识——若删除行携带 IEI，老收端
//     忽略之；M 行删除 = 新版本流不再有，老流照旧可解）；
//   - 同 IEI 行格式变更（TV→TLV / len 变化破坏位流）→ break；
//   - 同 IEI 行 presence M→O → info；O→M → warn（新要求）；
//   - 同 IEI 行指向的 IE 定义变更 → info（值语义变化，框架位流不破）。
// 产出 findings：{ severity: 'ok'|'info'|'warn'|'break', kind, msg, detail }，
// 与 ASN.1 diff 的 finalizeReport 口径一致。

const rowKey = (r) => {
  const i = rowIei(r);
  return i == null ? `n:${(r.name || '').toLowerCase()}` : `i:${i}`;
};

// 实例配对：同 direction 按出现序消费（44018 IMMEDIATE ASSIGNMENT 两实例同 direction——
// v1.22.0 前的 find 配对把它们全部塌到 inst0，产生同版本对上的幻影删除）；direction
// 不匹配回退剩余未消费实例（按右实例序），每个左实例至多消费一次；仍无可用 → null
// （调用方按「新增消息表实例」入账，不再拿左末实例重复比对）。
// 返回 { paired, unused }：unused = 左实例中未被配对的（调用方按「删除实例」入账）。
function pairLeftByDirection(linsts, rinsts) {
  const q = new Map();
  for (const x of linsts) {
    const d = x.direction ?? null;
    if (!q.has(d)) q.set(d, []);
    q.get(d).push(x);
  }
  const used = new Set();
  const exact = rinsts.map((ri) => {
    const arr = q.get(ri.direction ?? null);
    if (arr && arr.length) { const x = arr.shift(); used.add(x); return x; }
    return null;
  });
  const rest = linsts.filter((x) => !used.has(x));
  let k = 0;
  const paired = exact.map((x) => x || (k < rest.length ? rest[k++] : null));
  return { paired, unused: rest.slice(k) };
}

// 键映射：重复键加出现序号（#2/#3 按位配对）。IEI 条件重复行、布局 octet 变体行
// （7.7.29 PDP Context 六变体、8.123 Remote User ID 八变体）与同行同名字段通用——
// v1.22.0 前直接以键为 Map 键把重复项折叠成一项（批次 L 修 IEI 行，v1.23.0 补齐
// 布局层同类塌缩）。
function mapWithOrdinal(items, keyOf) {
  const m = new Map();
  const seen = {};
  for (const it of items) {
    const k0 = keyOf(it);
    seen[k0] = (seen[k0] || 0) + 1;
    m.set(seen[k0] > 1 ? `${k0}#${seen[k0]}` : k0, it);
  }
  return m;
}

function rowMapWithOrdinal(rows) {
  return mapWithOrdinal(rows, rowKey);
}

// inst = 消息实例（schema.messages[name][k]）；比较行集合
function diffMessageRows(name, li, ri, findings) {
  const lmap = rowMapWithOrdinal(li.rows);
  const rmap = rowMapWithOrdinal(ri.rows);
  for (const [k, rr] of rmap) {
    if (!lmap.has(k)) {
      const hasIei = k.startsWith('i:');
      const framed = /^(tlv|lv)/i.test(rr.format || '');
      const sev = hasIei && framed ? 'ok' : 'warn';
      findings.push({
        severity: sev,
        kind: 'nas-row-add',
        msg: hasIei
          ? `${name}：新增 IE 行 ${rr.name}（IEI ${rr.iei}，${framed ? '老收端按未知 IE 跳过' : 'TV 无长度域——老收端不识该 IEI 即无法跳过，后续 IE 错位风险'}）`
          : `${name}：新增 IE 行 ${rr.name}（无 IEI——老收端无法定位，后续 IE 错位风险）`,
        loc: { msg: name, ...(hasIei ? { iei: String(rr.iei) } : {}), ...(rr.ref ? { ref: rr.ref } : {}) },
      });
    }
  }
  for (const [k, lr] of lmap) {
    const rr = rmap.get(k);
    if (!rr) {
      findings.push({
        severity: 'info',
        kind: 'nas-row-del',
        msg: `${name}：删除 IE 行 ${lr.name}${lr.iei ? `（IEI ${lr.iei}）` : ''}`,
        loc: { msg: name, ...(lr.iei ? { iei: String(lr.iei) } : {}), ...(lr.ref ? { ref: lr.ref } : {}) },
      });
      continue;
    }
    if ((lr.format || '').trim().toUpperCase() !== (rr.format || '').trim().toUpperCase() ||
        (lr.len || '').replace(/\s/g, '') !== (rr.len || '').replace(/\s/g, '')) {
      findings.push({
        severity: 'break',
        kind: 'nas-row-format',
        msg: `${name}：IE ${rr.name} 框架变更 ${lr.format}/${lr.len} → ${rr.format}/${rr.len}`,
        loc: { msg: name, ...(rr.iei ? { iei: String(rr.iei) } : {}), ...(rr.ref ? { ref: rr.ref } : {}) },
      });
    }
    const lp = (lr.presence || '').trim();
    const rp = (rr.presence || '').trim();
    if (lp !== rp) {
      if (lp === 'M' && rp !== 'M') {
        findings.push({ severity: 'info', kind: 'nas-row-presence', msg: `${name}：IE ${rr.name} 必配→可选（${lp}→${rp}）`, loc: { msg: name, ...(rr.iei ? { iei: String(rr.iei) } : {}), ...(rr.ref ? { ref: rr.ref } : {}) } });
      } else if (lp !== 'M' && rp === 'M') {
        findings.push({ severity: 'warn', kind: 'nas-row-presence', msg: `${name}：IE ${rr.name} 可选→必配（${lp}→${rp}，新版本要求）`, loc: { msg: name, ...(rr.iei ? { iei: String(rr.iei) } : {}), ...(rr.ref ? { ref: rr.ref } : {}) } });
      }
    }
  }
}

// 消息显示名 → 类型值查找：msgTypes 键与 messages 键的形态随建库器而异——
// 24501/24301 类型表名小写 vs 显示名大写；44018 键名去非字母数字（'handovercommand'）；
// 24080 三常量键（'release complete'）。依次试原键 / 小写 / 归一化（与 resolveMsgType44018 同则）。
function msgTypeOf(schema, name) {
  const mt = schema.msgTypes || {};
  const hit = mt[name] || mt[name.toLowerCase()] || mt[name.toLowerCase().replace(/[^a-z0-9]/g, '')];
  return hit && hit.type != null ? hit.type : null;
}

// ---- GTP 族（29.274/29.060）版本 Diff（批次L）--------------------------------------
// 与 NAS 同构（消息表行级）+ GTP 特有两层：行 ref→IE 节定义（同名节 ieType/format/fixed）
// 与 IE 布局行级（octets 逐行：长度变化/字段位序）。判定口径（协议依据）：
//   - 新增消息 → info（收端对未知消息类型回 Unsupported Message Type——29.274 §7.3.1
//     cause #1 / 29.060 'Message Type Non-Existent'——协议内处理路径，不算字节破坏）；
//   - 同名消息 msgType 值变更 → break（同节消息在线缆上变成另一种语义）；
//   - 行新增 → 按格式分档：TLV/LV 带长度域 → ok（GTP 收端 shall ignore 未知 IE——
//     29.274 §7.6.1，按 Length 自界跳过）；TV/fixed 无长度域 → warn（老收端不识 IEI
//     即不知值宽、无法跳过——GTPv1-C Echo 的 Recovery 即 TV 形态）；行删除 → info；
//   - 同 IEI 行指向的 IE 节变更（ref 换节）→ break（同 IEI 值整个换语义）；
//   - 行 format/len 变更 → break（TV↔TLV 破坏框架判读）；
//   - presence 词表归一（29060 长词 'Mandatory/Optional/Conditional'、29274 短码
//     M/C/CO/O）：必配→非必配 info；非必配→必配 warn（新要求）；条件档间变化 info；
//   - IE 定义层：ieType 值变更 / format 变更 → break；fixed 定长变更 → warn；
//     布局行级：总长变化——TLV/LV（收端按 Length 跳，框架自界）info、TV/fixed
//    （收端按定长读）warn；行 count/open 变化与字段增删/位序变更 → info（值语义）；
//   - 组内容表（ies[].grouped，PFCP Create/Update BAR/PDR/FAR/QER/URR 与 29.274
//     Bearer Contexts 等组族）子行级比对（v1.33.0 AA1——v1.32.0 审计 P1：组子行
//     变化原先完全不入账，k00→k10 的 Create/Update QER 各新增子行 IEI 408 漏报）：
//     判定沿用消息表行级口径——新增 TLV/LV → ok（收端在组内按 Length 跳过未知子 IE）、
//     TV/fixed → warn、删除 → info、ref 换节/格式变更 → break、presence 沿用上档；
//     cond 文本编辑性变化不入账（措辞微调非结构变更）。
// 只支持同 spec 两版本对比（跨规范 29060 vs 29274 无对比意义，抛错拒产）。
const gtpPresClass = (p) => {
  const s = (p || '').trim();
  if (!s) return '';
  const w = (s.split(/[\s(（]/)[0] || '').toUpperCase(); // 首词（容 '(NOTE)' 等后缀）
  if (w === 'M' || w === 'MANDATORY') return 'M';
  if (w === 'C' || w === 'CONDITIONAL') return 'C'; // 29060 长词与 29274 短码同档
  if (w === 'CO') return 'CO'; // 29.274 条件可选——与 C 分档（v1.23.0：原先 /^c/ 前缀把 CO 并入 C 静默吞掉档位变化）
  if (w === 'O' || w === 'OPTIONAL') return 'O';
  const c = w[0];
  return c === 'M' || c === 'C' || c === 'O' ? c : w;
};
// GTP 行键：同 IEI 多行（条件重复，如 Context Response 的多个 '* Context' 条件出现）按出现序配对
const rowMapGtp = (rows) => mapWithOrdinal(rows, (r) => String(r.iei));
const gtpFramed = (fmt) => /^(tlv|lv|tliv)/i.test(fmt || ''); // 带长度域、收端自界

function diffGtpIeLayout(ref, layL, layR, framed, findings) {
  const L = (octet, field) => ({ ref, octet: String(octet), ...(field ? { field } : {}) });
  // octet 标签出现序号配对：变体行共用同一标签（7.7.29 '3'×6、8.123 '5-n*'×8），
  // v1.23.0 前 Map 只保留最后一变体，其余被遮蔽（改第一变体将漏报）。
  const lmap = mapWithOrdinal(layL || [], (r) => String(r.octet));
  const rmap = mapWithOrdinal(layR || [], (r) => String(r.octet));
  for (const [k, rr] of rmap) {
    if (lmap.has(k)) continue;
    findings.push({
      severity: framed ? 'info' : 'warn',
      kind: 'gtp-ie-layout',
      msg: `${ref}：布局新增八位组行「${rr.octet}」（IE 总长变化——${framed ? 'TLV/LV 收端按 Length 跳过，框架自界' : '定长 IE：老收端按固定长度读会错位'}`,
      loc: L(rr.octet),
    });
  }
  for (const [k, lr] of lmap) {
    const rr = rmap.get(k);
    if (!rr) {
      findings.push({
        severity: framed ? 'info' : 'warn',
        kind: 'gtp-ie-layout',
        msg: `${ref}：布局删除八位组行「${lr.octet}」（IE 总长变化——${framed ? 'TLV/LV 框架自界' : '定长 IE：老收端会读到多余字节'}`,
        loc: L(lr.octet),
      });
      continue;
    }
    if ((lr.count || 1) !== (rr.count || 1) || !!lr.open !== !!rr.open) {
      findings.push({ severity: 'info', kind: 'gtp-ie-rowcount', msg: `${ref}：行「${rr.octet}」重复/开区间语义变化（count ${lr.count || 1}→${rr.count || 1}${lr.open || rr.open ? '、open 标记变化' : ''}）`, loc: L(rr.octet) });
    }
    const fkey = (f) => (String(f.name).split('\n')[0] || f.name).trim(); // 主名（字段名可带换行脚注句——脚注措辞微调不算字段变更）
    // 同名字段出现序号配对（行内重复的 Spare/字面量位字段）——与 octet 行同则
    const lf = mapWithOrdinal(lr.fields || [], fkey);
    const rf = mapWithOrdinal(rr.fields || [], fkey);
    for (const [nm, f] of rf) {
      const g = lf.get(nm);
      if (!g) { findings.push({ severity: 'info', kind: 'gtp-ie-field', msg: `${ref}：行「${rr.octet}」新增字段 ${nm}（bit ${f.hi}-${f.lo}）`, loc: L(rr.octet, nm) }); continue; }
      if (g.bits !== f.bits || g.hi !== f.hi || g.lo !== f.lo) {
        findings.push({ severity: 'info', kind: 'gtp-ie-field', msg: `${ref}：行「${rr.octet}」字段 ${nm} 位区间变化（bit ${g.hi}-${g.lo} → ${f.hi}-${f.lo}）`, loc: L(rr.octet, nm) });
      }
    }
    for (const [nm, g] of lf) {
      if (!rf.has(nm)) findings.push({ severity: 'info', kind: 'gtp-ie-field', msg: `${ref}：行「${rr.octet}」删除字段 ${nm}（bit ${g.hi}-${g.lo}）`, loc: L(rr.octet, nm) });
    }
  }
}

// 组内容表子行级比对（v1.33.0 AA1）。子行与消息表行同构（iei/presence/cond/format/len/
// ref），行键/配对沿用 rowMapGtp；kind 用 gtp-grouped-* 前缀，loc.ref=组节号、loc.rowRef=
// 子行指向的 IE 节（子行引用的节由 IE 定义层全量对比覆盖，此处不递归）。组表整侧出现/
// 消失按 info 入账（无法区分建库覆盖差异与规范变更，如实报）。cond 文本不比。
function diffGtpGrouped(ref, gName, lg, rg, findings) {
  const lrows = Array.isArray(lg) ? lg : [];
  const rrows = Array.isArray(rg) ? rg : [];
  if (!lrows.length && !rrows.length) return;
  if (!lrows.length || !rrows.length) {
    findings.push({
      severity: 'info',
      kind: 'gtp-grouped-tbl',
      msg: rrows.length
        ? `${ref} ${gName}：新增组内容表（${rrows.length} 行）`
        : `${ref} ${gName}：组内容表消失（原 ${lrows.length} 行）`,
      loc: { ref },
    });
    return;
  }
  const lmap = rowMapGtp(lrows);
  const rmap = rowMapGtp(rrows);
  for (const [k, rr] of rmap) {
    if (!lmap.has(k)) {
      const framedAdd = gtpFramed(rr.format);
      findings.push({
        severity: framedAdd ? 'ok' : 'warn',
        kind: 'gtp-grouped-row-add',
        msg: `${ref} ${gName}：组内新增子行 ${rr.name}（IEI ${rr.iei}，${framedAdd ? 'TLV/LV 收端在组内按 Length 跳过未知子 IE' : 'TV/fixed 无长度域——老收端不识 IEI 即无法跳过，错位风险'}）`,
        loc: { ref, iei: String(rr.iei), ...(rr.ref ? { rowRef: rr.ref } : {}) },
      });
      continue;
    }
    const lr = lmap.get(k);
    const loc = { ref, iei: String(rr.iei), ...(rr.ref ? { rowRef: rr.ref } : {}) };
    if ((lr.ref || null) !== (rr.ref || null)) {
      findings.push({ severity: 'break', kind: 'gtp-grouped-row-ref', msg: `${ref} ${gName}：组内 IEI ${rr.iei}（${rr.name}）指向的 IE 节变更 ${lr.ref || '?'} → ${rr.ref || '?'}（原 ${lr.name}）`, loc });
    }
    if ((lr.format || '').trim().toUpperCase() !== (rr.format || '').trim().toUpperCase() ||
        (lr.len || '').replace(/\s/g, '') !== (rr.len || '').replace(/\s/g, '')) {
      findings.push({ severity: 'break', kind: 'gtp-grouped-row-format', msg: `${ref} ${gName}：组内 ${rr.name} 框架变更 ${lr.format}/${lr.len || ''} → ${rr.format}/${rr.len || ''}`, loc });
    }
    const lc = gtpPresClass(lr.presence);
    const rc = gtpPresClass(rr.presence);
    if (lc !== rc) {
      if (lc === 'M') findings.push({ severity: 'info', kind: 'gtp-grouped-row-presence', msg: `${ref} ${gName}：组内 ${rr.name} 必配→非必配（${(lr.presence || '').trim()}→${(rr.presence || '').trim()}）`, loc });
      else if (rc === 'M') findings.push({ severity: 'warn', kind: 'gtp-grouped-row-presence', msg: `${ref} ${gName}：组内 ${rr.name} 非必配→必配（${(lr.presence || '').trim()}→${(rr.presence || '').trim()}，新版本要求）`, loc });
      else findings.push({ severity: 'info', kind: 'gtp-grouped-row-presence', msg: `${ref} ${gName}：组内 ${rr.name} presence 档位变化（${(lr.presence || '').trim()}→${(rr.presence || '').trim()}）`, loc });
    }
  }
  for (const [k, lr] of lmap) {
    if (!rmap.has(k)) findings.push({ severity: 'info', kind: 'gtp-grouped-row-del', msg: `${ref} ${gName}：组内删除子行 ${lr.name}（IEI ${lr.iei}）`, loc: { ref, iei: String(lr.iei), ...(lr.ref ? { rowRef: lr.ref } : {}) } });
  }
}

function diffGtpSchema(left, right) {
  if ((left.spec || '') !== (right.spec || '')) {
    throw new Error(`跨规范对比（${left.spec || '?'} vs ${right.spec || '?'}）——GTP Diff 只支持同一规范的两个版本`);
  }
  const findings = [];
  const lmsg = left.messages || {};
  const rmsg = right.messages || {};
  // 消息层：同名消息配对（同 direction 按序、失配回退下标——GTP 表分片 direction 全 null）+ 行级
  for (const name of Object.keys(rmsg)) {
    if (!lmsg[name]) {
      findings.push({ severity: 'info', kind: 'gtp-msg-add', msg: `新增消息 ${name}（类型 ${rmsg[name][0] && rmsg[name][0].msgType != null ? rmsg[name][0].msgType : '?'}）`, loc: { msg: name } });
      continue;
    }
    const rinsts = rmsg[name];
    const linsts = lmsg[name];
    const { paired, unused } = pairLeftByDirection(linsts, rinsts);
    for (const li of unused) {
      findings.push({ severity: 'info', kind: 'gtp-inst-del', msg: `${name}：删除消息表实例${li.direction ? `（direction ${li.direction}）` : ''}`, loc: { msg: name } });
    }
    for (let i = 0; i < rinsts.length; i++) {
      const ri = rinsts[i];
      const li = paired[i];
      if (!li) {
        findings.push({ severity: 'info', kind: 'gtp-inst-add', msg: `${name}：新增消息表实例${ri.direction ? `（direction ${ri.direction}）` : ''}（旧版本无对应表分片）`, loc: { msg: name } });
        continue;
      }
      if (li.msgType != null && ri.msgType != null && li.msgType !== ri.msgType) {
        findings.push({ severity: 'break', kind: 'gtp-msgtype', msg: `${name}：消息类型值变更 ${li.msgType} → ${ri.msgType}（0x${li.msgType.toString(16)} → 0x${ri.msgType.toString(16)}）`, loc: { msg: name } });
      }
      const lrow = rowMapGtp(li.rows);
      const rrow = rowMapGtp(ri.rows);
      for (const [k, rr] of rrow) {
        if (!lrow.has(k)) {
          const framedAdd = gtpFramed(rr.format);
          findings.push({
            severity: framedAdd ? 'ok' : 'warn',
            kind: 'gtp-row-add',
            msg: `${name}：新增 IE 行 ${rr.name}（IEI ${rr.iei}，${framedAdd ? 'TLV/LV 收端按 Length 跳过未知 IE' : 'TV/fixed 无长度域——老收端不识 IEI 即无法跳过，错位风险'}）`,
            loc: { msg: name, iei: String(rr.iei), ...(rr.ref ? { ref: rr.ref } : {}) },
          });
          continue;
        }
        const lr = lrow.get(k);
        if ((lr.ref || null) !== (rr.ref || null)) {
          findings.push({ severity: 'break', kind: 'gtp-row-ref', msg: `${name}：IEI ${rr.iei}（${rr.name}）指向的 IE 节变更 ${lr.ref || '?'} → ${rr.ref || '?'}（原 ${lr.name}）`, loc: { msg: name, iei: String(rr.iei), ...(rr.ref ? { ref: rr.ref } : {}) } });
        }
        if ((lr.format || '').trim().toUpperCase() !== (rr.format || '').trim().toUpperCase() ||
            (lr.len || '').replace(/\s/g, '') !== (rr.len || '').replace(/\s/g, '')) {
          findings.push({ severity: 'break', kind: 'gtp-row-format', msg: `${name}：IE ${rr.name} 框架变更 ${lr.format}/${lr.len || ''} → ${rr.format}/${rr.len || ''}`, loc: { msg: name, iei: String(rr.iei), ...(rr.ref ? { ref: rr.ref } : {}) } });
        }
        const lc = gtpPresClass(lr.presence);
        const rc = gtpPresClass(rr.presence);
        if (lc !== rc) {
          const loc = { msg: name, iei: String(rr.iei), ...(rr.ref ? { ref: rr.ref } : {}) };
          if (lc === 'M') findings.push({ severity: 'info', kind: 'gtp-row-presence', msg: `${name}：IE ${rr.name} 必配→非必配（${(lr.presence || '').trim()}→${(rr.presence || '').trim()}）`, loc });
          else if (rc === 'M') findings.push({ severity: 'warn', kind: 'gtp-row-presence', msg: `${name}：IE ${rr.name} 非必配→必配（${(lr.presence || '').trim()}→${(rr.presence || '').trim()}，新版本要求）`, loc });
          else findings.push({ severity: 'info', kind: 'gtp-row-presence', msg: `${name}：IE ${rr.name} presence 档位变化（${(lr.presence || '').trim()}→${(rr.presence || '').trim()}）`, loc });
        }
      }
      for (const [k, lr] of lrow) {
        if (!rrow.has(k)) findings.push({ severity: 'info', kind: 'gtp-row-del', msg: `${name}：删除 IE 行 ${lr.name}（IEI ${lr.iei}）`, loc: { msg: name, iei: String(lr.iei), ...(lr.ref ? { ref: lr.ref } : {}) } });
      }
    }
  }
  for (const name of Object.keys(lmsg)) {
    if (!rmsg[name]) findings.push({ severity: 'info', kind: 'gtp-msg-del', msg: `删除消息 ${name}`, loc: { msg: name } });
  }
  // IE 定义层：同名节（键=节号）全量对比（未被消息引用的节变更同样入账）
  const lies = left.ies || {};
  const ries = right.ies || {};
  for (const [ref, ri] of Object.entries(ries)) {
    const li = lies[ref];
    if (!li) { findings.push({ severity: 'info', kind: 'gtp-ie-add', msg: `新增 IE 节 ${ref} ${ri.name}`, loc: { ref } }); continue; }
    if (li.name !== ri.name) findings.push({ severity: 'info', kind: 'gtp-ie-name', msg: `${ref}：IE 名称变更 ${li.name} → ${ri.name}`, loc: { ref } });
    if (li.ieType != null && ri.ieType != null && li.ieType !== ri.ieType) {
      findings.push({ severity: 'break', kind: 'gtp-ie-type', msg: `${ref} ${ri.name}：IE Type 值变更 ${li.ieType} → ${ri.ieType}（老收端认不出/错认）`, loc: { ref } });
    }
    if ((li.format || '').trim().toUpperCase() !== (ri.format || '').trim().toUpperCase()) {
      findings.push({ severity: 'break', kind: 'gtp-ie-format', msg: `${ref} ${ri.name}：格式变更 ${li.format || '?'} → ${ri.format || '?'}（框架判读破坏）`, loc: { ref } });
    }
    if ((li.fixed ?? null) !== (ri.fixed ?? null)) {
      findings.push({ severity: 'warn', kind: 'gtp-ie-fixed', msg: `${ref} ${ri.name}：定长语义变更（fixed ${li.fixed ?? '无'} → ${ri.fixed ?? '无'}）`, loc: { ref } });
    }
    const ll = (li.layouts || [])[0], rl = (ri.layouts || [])[0];
    if (ll && rl) {
      const framed = gtpFramed(ri.format || li.format);
      diffGtpIeLayout(ref, ll.octets, rl.octets, framed, findings);
    } else if (rl && !ll) {
      findings.push({ severity: 'info', kind: 'gtp-ie-nolayout', msg: `${ref} ${ri.name}：旧版本无位布局（建库覆盖差异，非规范变更）`, loc: { ref } });
    } else if (ll && !rl) {
      findings.push({ severity: 'info', kind: 'gtp-ie-nolayout', msg: `${ref} ${li.name}：新版本无位布局（建库覆盖差异，非规范变更）`, loc: { ref } });
    }
    diffGtpGrouped(ref, ri.name, li.grouped, ri.grouped, findings);
  }
  for (const [ref, li] of Object.entries(lies)) {
    if (!ries[ref]) findings.push({ severity: 'info', kind: 'gtp-ie-del', msg: `删除 IE 节 ${ref} ${li.name}`, loc: { ref } });
  }
  const sevRank = { break: 0, warn: 1, info: 2, ok: 3 };
  findings.sort((a, b) => sevRank[a.severity] - sevRank[b.severity]);
  const counts = { break: 0, warn: 0, info: 0, ok: 0 };
  for (const f of findings) counts[f.severity]++;
  return { findings, counts };
}

// BQ（v1.73.0）：IE 定义节 diff——dtap 版本演进热点在 10.5.x 节增删/改名
//（24008 g40→k10 新增 10.5.4.21.x/10.5.6.3.1x 六节实证，消息表层反而稳定），为
// diffGtpSchema 的 gtp-ie-* 的 dtap 对应物。
// 勘正（BR 批 v1.74.0，独立审计 2026-10-30 实证）：24 系 ies 键并集 = name/layouts
//(,csn1,fillFrom)——无 rows 无 grouped。BQ 期「行级复用 diffMessageRows」在
// 生产 schema 上恒空转（rows 双侧 undefined→[]），实际产出止于节级。行级职责
// 重述：消息表行级 = messages[].rows（diffMessageRows 仍用）；IE 节行级 =
// layouts[].octets[].fields 位表（diffNasIeLayouts，本批接入）。grouped 对应物
// 在 24 系不存在（挂案收案，gtp-grouped-* 仅 GTP 族适用）。
function diffNasIes(left, right, findings) {
  const li = left.ies || {};
  const ri = right.ies || {};
  for (const ref of Object.keys(ri)) {
    const r = ri[ref];
    const l = li[ref];
    if (!l) {
      findings.push({ severity: 'info', kind: 'nas-ie-add', msg: `新增 IE 定义节 ${ref}（${r.name || ''}）`, loc: { msg: ref, ref } });
      continue;
    }
    if ((l.name || '') !== (r.name || '')) {
      findings.push({ severity: 'info', kind: 'nas-ie-name', msg: `IE 定义节 ${ref} 名称变更「${l.name || ''}」→「${r.name || ''}」`, loc: { msg: ref, ref } });
    }
    diffMessageRows(ref, { rows: l.rows || [] }, { rows: r.rows || [] }, findings);
    diffNasIeLayouts(ref, l, r, findings);
  }
  for (const ref of Object.keys(li)) {
    if (!ri[ref]) findings.push({ severity: 'info', kind: 'nas-ie-del', msg: `删除 IE 定义节 ${ref}（${li[ref].name || ''}）`, loc: { msg: ref, ref } });
  }
}

// BR（v1.74.0）：24 系 IE 节位表 diff（对齐 GTP 侧 diffGtpIeLayout 语义，kind 用
// nas-ie-* 命名空间分离）。只比 layouts[0]（多图为同 IE 变体图——图数变化单列
// nas-ie-figs 留痕）；全 info 档：位表/文法是建库呈现层，线缆破坏由消息表行
// nas-row-format 承担，且 dtap IE 节自身无 format 键、framed 未判不升档。
function diffNasIeLayouts(ref, lie, rie, findings) {
  const L = { msg: ref, ref };
  const ll = (lie.layouts || [])[0], rl = (rie.layouts || [])[0];
  // 图数变化只在双侧都有布局时报（单侧缺失走 nolayout——0↔n 与覆盖差异同义，不双计）
  if (ll && rl && (lie.layouts || []).length !== (rie.layouts || []).length) {
    findings.push({ severity: 'info', kind: 'nas-ie-figs', msg: `${ref}：位布局图数变化 ${(lie.layouts || []).length} → ${(rie.layouts || []).length}`, loc: L });
  }
  if (ll && rl) {
    const lmap = mapWithOrdinal(ll.octets || [], (r) => String(r.octet));
    const rmap = mapWithOrdinal(rl.octets || [], (r) => String(r.octet));
    for (const [k, rr] of rmap) {
      const lr = lmap.get(k);
      if (!lr) { findings.push({ severity: 'info', kind: 'nas-ie-layout', msg: `${ref}：布局新增八位组行「${rr.octet}」（IE 总长变化——框架自界性未判，宿主行框架变化见 nas-row-format）`, loc: L }); continue; }
      const fkey = (f) => (String(f.name).split('\n')[0] || f.name).trim(); // 主名（换行脚注句不算字段变更）
      const lf2 = mapWithOrdinal(lr.fields || [], fkey);
      const rf2 = mapWithOrdinal(rr.fields || [], fkey);
      for (const [nm, f] of rf2) {
        const g = lf2.get(nm);
        if (!g) { findings.push({ severity: 'info', kind: 'nas-ie-field', msg: `${ref}：行「${rr.octet}」新增字段 ${nm}（bit ${f.hi}-${f.lo}）`, loc: L }); continue; }
        if (g.bits !== f.bits || g.hi !== f.hi || g.lo !== f.lo) {
          findings.push({ severity: 'info', kind: 'nas-ie-field', msg: `${ref}：行「${rr.octet}」字段 ${nm} 位区间变化（bit ${g.hi}-${g.lo} → ${f.hi}-${f.lo}）`, loc: L });
        }
      }
      for (const [nm, g] of lf2) {
        if (!rf2.has(nm)) findings.push({ severity: 'info', kind: 'nas-ie-field', msg: `${ref}：行「${rr.octet}」删除字段 ${nm}（bit ${g.hi}-${g.lo}）`, loc: L });
      }
    }
    for (const [k, lr] of lmap) {
      if (!rmap.has(k)) findings.push({ severity: 'info', kind: 'nas-ie-layout', msg: `${ref}：布局删除八位组行「${lr.octet}」（IE 总长变化——同上未判）`, loc: L });
    }
  } else if (rl && !ll) {
    findings.push({ severity: 'info', kind: 'nas-ie-nolayout', msg: `${ref}：旧版本无位布局（建库覆盖差异，非规范变更）`, loc: L });
  } else if (ll && !rl) {
    findings.push({ severity: 'info', kind: 'nas-ie-nolayout', msg: `${ref}：新版本无位布局（建库覆盖差异，非规范变更）`, loc: L });
  }
  diffNasCsn1(ref, lie, rie, findings);
}

// BW 批（v1.79.0）：csn1 文法结构级 diff——csn1 JSON 形态 {root, defs{名→AST 节点}}：
//   def 键面增删/改名 → nas-ie-csn1-def；root 指向变化 → nas-ie-csn1-root；
//   单侧无 csn1 / 结构同形仅序列化差异 → 维持 nas-ie-csn1 二值留痕（全 info 档不变——
//   文法源是建库呈现层，线缆破坏由消息表行 nas-row-format 承担）。
// BZ 批（v1.82.0）：items 级语义对拍——AST 节点先经 csn1Canon 规范化（对象键序无关、
//   数组序语义保留）再对比：同名 def 真语义差 → nas-ie-csn1-items（BW 期「内容变化」
//   从 def kind 迁移，键面留 def）；语义等价仅序列化差异 → nas-ie-csn1（BW 回退分支
//   收窄到真等价面——键序假阳性防御）。探针实证（2026-10-31）：44018 的 16 条内容
//   变化 def 归一化后 0 条降级（全部真语义差）——本批零基线漂移，kind 迁移为主。
function csn1Canon(x) {
  if (Array.isArray(x)) return x.map(csn1Canon);
  if (x && typeof x === 'object') {
    const o = {};
    for (const k of Object.keys(x).sort()) o[k] = csn1Canon(x[k]);
    return o;
  }
  return x;
}
// CC 批（v1.85.0）：CSN.1 items 级差异树——canonical 归一后的逐节点路径差异（呈现层数据面）。
// 路径 = 对象键（字典序遍历，与 csn1Canon 同口径——键序差不产节点）/ 数组下标 [i]（数组序
// 语义保留）；标量差记 {path, old, new}；键增删记 (无)；每 def 节点上限 maxNodes（超出置
// truncated 如实截断）、深度上限 maxDepth（到顶记 '…' 摘要）。old/new：标量 String 原样、
// 结构紧凑 JSON。仅呈现层——msg/计数不变（零基线漂移），旧消费者忽略未知字段。
function csn1DiffPaths(l, r, opts = {}) {
  const maxNodes = opts.maxNodes ?? 8;
  const maxDepth = opts.maxDepth ?? 12;
  const nodes = [];
  let truncated = false;
  const j = (v) => (v == null || typeof v !== 'object' ? String(v) : JSON.stringify(v));
  const walk = (a, b, path, depth) => {
    if (nodes.length >= maxNodes) { truncated = true; return; }
    const bothObj = a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b);
    const bothArr = Array.isArray(a) && Array.isArray(b);
    if (bothObj || bothArr) {
      if (depth > maxDepth) { nodes.push({ path: path + '…', old: '…', new: '…' }); truncated = true; return; }
      if (bothObj) {
        const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
        for (const k of keys) {
          if (nodes.length >= maxNodes) { truncated = true; return; }
          const p = path ? `${path}.${k}` : k;
          const inA = k in a, inB = k in b;
          if (inA && !inB) nodes.push({ path: p, old: j(a[k]), new: '(无)' });
          else if (!inA && inB) nodes.push({ path: p, old: '(无)', new: j(b[k]) });
          else if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) walk(a[k], b[k], p, depth + 1);
        }
      } else {
        const n = Math.max(a.length, b.length);
        for (let i = 0; i < n; i++) {
          if (nodes.length >= maxNodes) { truncated = true; return; }
          const p = `${path}[${i}]`;
          if (i >= b.length) nodes.push({ path: p, old: j(a[i]), new: '(无)' });
          else if (i >= a.length) nodes.push({ path: p, old: '(无)', new: j(b[i]) });
          else if (JSON.stringify(a[i]) !== JSON.stringify(b[i])) walk(a[i], b[i], p, depth + 1);
        }
      }
    } else {
      nodes.push({ path: path || '(root)', old: j(a), new: j(b) });
    }
  };
  walk(l, r, '', 0);
  return { nodes, truncated };
}

function diffNasCsn1(ref, lie, rie, findings) {
  const L = { msg: ref, ref };
  if (!lie.csn1 || !rie.csn1) {
    if (JSON.stringify(lie.csn1 ?? null) !== JSON.stringify(rie.csn1 ?? null)) {
      const how = lie.csn1 ? '旧有新无' : '旧无新有';
      findings.push({ severity: 'info', kind: 'nas-ie-csn1', msg: `${ref}：CSN.1 文法源变化（${how}）`, loc: L });
    }
    return;
  }
  if (JSON.stringify(csn1Canon(lie.csn1)) === JSON.stringify(csn1Canon(rie.csn1))) {
    if (JSON.stringify(lie.csn1) !== JSON.stringify(rie.csn1)) {
      findings.push({ severity: 'info', kind: 'nas-ie-csn1', msg: `${ref}：CSN.1 文法源变化（语义等价，序列化差异）`, loc: L });
    }
    return;
  }
  const ld = lie.csn1.defs || {}, rd = rie.csn1.defs || {};
  const lk = Object.keys(ld), rk = Object.keys(rd);
  const added = rk.filter((k) => !(k in ld));
  const removed = lk.filter((k) => !(k in rd));
  const changed = lk.filter((k) => k in rd && JSON.stringify(csn1Canon(ld[k])) !== JSON.stringify(csn1Canon(rd[k])));
  if (added.length || removed.length) {
    const parts = [];
    if (added.length) parts.push(`新增 ${added.join('、')}`);
    if (removed.length) parts.push(`移除 ${removed.join('、')}`);
    findings.push({ severity: 'info', kind: 'nas-ie-csn1-def', msg: `${ref}：CSN.1 def 键面变化（${parts.join('；')}）`, loc: L });
  }
  if (changed.length) {
    // CC（v1.85.0）：差异树数据面——逐 changed def 的 canonical 路径节点（有界截断），
    // msg/计数不变（零基线漂移）；nasdiff 门只对拍 cumulative，D 侧报告重产刷新即含 tree。
    const tree = changed.map((k) => ({ def: k, ...csn1DiffPaths(ld[k], rd[k]) }));
    findings.push({ severity: 'info', kind: 'nas-ie-csn1-items', msg: `${ref}：CSN.1 items 语义变化 ×${changed.length}（${changed.slice(0, 3).join('、')}${changed.length > 3 ? ' 等' : ''}）`, loc: L, tree });
  }
  if ((lie.csn1.root ?? null) !== (rie.csn1.root ?? null)) {
    findings.push({ severity: 'info', kind: 'nas-ie-csn1-root', msg: `${ref}：CSN.1 root 指向变化「${lie.csn1.root ?? ''}」→「${rie.csn1.root ?? ''}」`, loc: L });
  }
  if (!added.length && !removed.length && !changed.length && (lie.csn1.root ?? null) === (rie.csn1.root ?? null)) {
    findings.push({ severity: 'info', kind: 'nas-ie-csn1', msg: `${ref}：CSN.1 文法源变化（结构面同形，序列化差异）`, loc: L });
  }
}

function diffNasSchema(left, right) {
  const findings = [];
  const lmsg = left.messages || {};
  const rmsg = right.messages || {};
  for (const name of Object.keys(rmsg)) {
    if (!lmsg[name]) {
      const mt = msgTypeOf(right, name);
      findings.push({ severity: 'info', kind: 'nas-msg-add', msg: `新增消息 ${name}（${mt != null ? `类型 0x${mt.toString(16)}` : '附件/保护类'}）`, loc: { msg: name } });
      continue;
    }
    // 同名消息：逐实例配对（同 direction 按序、失配回退下标——见 pairLeftByDirection）
    const rinsts = rmsg[name];
    const linsts = lmsg[name];
    const { paired, unused } = pairLeftByDirection(linsts, rinsts);
    for (const li of unused) {
      findings.push({ severity: 'info', kind: 'nas-inst-del', msg: `${name}（${li.direction || '?'}）：删除消息表实例`, loc: { msg: name } });
    }
    for (let i = 0; i < rinsts.length; i++) {
      const ri = rinsts[i];
      const li = paired[i];
      if (!li) {
        findings.push({ severity: 'info', kind: 'nas-inst-add', msg: `${name}（${ri.direction || '?'}）：新增消息表实例（旧版本无对应表分片）`, loc: { msg: name } });
        continue;
      }
      if (li.msgType != null && ri.msgType != null && li.msgType !== ri.msgType) {
        findings.push({ severity: 'break', kind: 'nas-msgtype', msg: `${name}（${ri.direction || '?'}）：消息类型值变更 0x${li.msgType.toString(16)} → 0x${ri.msgType.toString(16)}`, loc: { msg: name } });
      }
      diffMessageRows(name, li, ri, findings);
    }
  }
  for (const name of Object.keys(lmsg)) {
    if (!rmsg[name]) {
      findings.push({ severity: 'info', kind: 'nas-msg-del', msg: `删除消息 ${name}`, loc: { msg: name } });
    }
  }
  diffNasIes(left, right, findings);
  const sevRank = { break: 0, warn: 1, info: 2, ok: 3 };
  findings.sort((a, b) => sevRank[a.severity] - sevRank[b.severity]);
  const counts = { break: 0, warn: 0, info: 0, ok: 0 };
  for (const f of findings) counts[f.severity]++;
  return { findings, counts };
}

// 批次 Q3：链式多版本 diff（A→B→C…）。entries = [{ label, schema }]（已按版本序），
// diffFn = diffNasSchema | diffGtpSchema。返回逐段 findings/counts 与累计计数
// （break/warn 趋势 = Release 演进审查的主视图）。
function diffChain(entries, diffFn) {
  const segments = [];
  for (let i = 1; i < entries.length; i++) {
    const out = diffFn(entries[i - 1].schema, entries[i].schema);
    segments.push({ from: entries[i - 1].label, to: entries[i].label, findings: out.findings, counts: out.counts });
  }
  const cumulative = { break: 0, warn: 0, info: 0, ok: 0 };
  for (const s of segments) for (const k of Object.keys(cumulative)) cumulative[k] += s.counts[k];
  return { segments, cumulative };
}

// ==== src/nas/security.js ====
// src/nas/security.js — M4：NAS 安全保护帧（24.501 §4.4.6/§9.1.1、24.301 §8.2.23 结构级）。
//
// 结构：24.501 = EPD(0x7E) + [spare 高 | SHT 低] + MAC(4) + Seqn(1) + 明文 NAS 消息；
//       24.301 = [SHT 高 | PD 低(EMM=7)] + MAC(4) + Seqn(1) + 明文 NAS 消息。
// SHT 位序差异实证（pycrate oracle）：24.501 SHT=1 帧 = 7e01…（SHT 低半，TS 24.007
// 先出现占低半，表序 [SHT, spare]）；24.301 SHT=1 帧 = 17…（SHT 高半，表序 [PD, SHT]）。
// SHT 值域（24.501 §9.3.1，pycrate SecHdrType_dict 同源）：0=无保护，1/3=仅完整性保护
// （明文可读），2/4=完整性保护+加密（载荷不可读）。MAC 计算需 K_NAS 密钥与 5G-IA/EIA
// 算法，本层不涉及——MAC 作为 4 字节透明域，由上层工具/密钥持有者填入。

const SHT_DESC = {
  0: 'plain（无安全保护）',
  1: 'integrity protected（明文可读）',
  2: 'integrity protected and ciphered（载荷不可读）',
  3: 'integrity protected with new 5G NAS security context（明文可读）',
  4: 'integrity protected and ciphered with new 5G NAS security context（载荷不可读）',
};

// SHT∈{1,3} 时内层明文可读
function shtReadable(sht) {
  return sht === 1 || sht === 3;
}

const hex = (bytes) => Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');

// 内层明文消息派发：按 msgType 字节在 schema.messages 里找实例（同名多实例依次试解码）。
// 24501 明文消息 = EPD(o1) + SHT/spare(o2) + MsgType(o3)；24301 = PD/SHT(o1) + MsgType(o2)。
function dispatchInner(schema, payload, spec) {
  const mt = spec === '24501' ? payload[2] : payload[1];
  if (mt == null) return null;
  const cands = [];
  for (const [name, insts] of Object.entries(schema.messages || {})) {
    for (let i = 0; i < insts.length; i++) {
      if (insts[i].msgType === mt) cands.push({ name, inst: insts[i], instIdx: i });
    }
  }
  for (const c of cands) {
    try {
      const { parts } = decMsg(c.inst, payload, spec);
      return { msg: c.name, instIdx: c.instIdx, section: c.inst.section, parts };
    } catch {
      // 同类型值的其他实例（MO/MT 变体）继续尝试
    }
  }
  return null;
}

// 安全保护帧结构级解码。返回
// { sht, shtDesc, mac, seq, payload, readable, inner }（inner = {msg, instIdx, section, parts} | null）。
// 非法帧（长度不足/EPD 或 PD 不符）抛错。
function decSec(schema, bytes, spec = '24501') {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  const minLen = spec === '24501' ? 7 : 6;
  if (u8.length < minLen) throw new Error(`安全保护帧过短（需 ≥${minLen} 字节，得 ${u8.length}）`);
  let sht;
  if (spec === '24501') {
    if (u8[0] !== 0x7e) throw new Error(`EPD 不匹配: 0x${u8[0].toString(16)} ≠ 0x7e`);
    sht = u8[1] & 0x0f; // SHT 低半（表序 [SHT, spare]，TS 24.007 先出现占低半）
  } else {
    const pd = u8[0] & 0x0f;
    if (pd !== 7) throw new Error(`PD 不匹配: ${pd} ≠ 7（EMM）`);
    sht = u8[0] >> 4; // SHT 高半（表序 [PD, SHT]）
  }
  const macOff = spec === '24501' ? 2 : 1;
  const mac = u8.slice(macOff, macOff + 4);
  const seq = u8[macOff + 4];
  const payload = u8.slice(macOff + 5);
  const readable = shtReadable(sht);
  const inner = readable && payload.length ? dispatchInner(schema, payload, spec) : null;
  return {
    sht,
    shtDesc: SHT_DESC[sht] ?? `保留值 0x${sht.toString(16)}`,
    mac,
    seq,
    payload,
    readable,
    inner,
  };
}

// 安全保护帧编码。plain：明文 NAS 消息字节；opts = { sht=1, mac='00000000'（hex 8 位）, seq=0 }。
function encSec(plain, opts = {}, spec = '24501') {
  const sht = opts.sht ?? 1;
  if (!(sht >= 0 && sht <= 15)) throw new Error(`SHT 越界: ${sht}`);
  if (sht === 0) throw new Error('SHT=0 为普通明文消息，无需安全保护封装');
  const mac = typeof opts.mac === 'string' ? OCT(opts.mac) : opts.mac;
  if (!mac || mac.length !== 4) throw new Error('MAC 须为 4 字节（8 位 hex）');
  const seq = opts.seq ?? 0;
  if (!(seq >= 0 && seq <= 255)) throw new Error('SEQ 越界 (0-255)');
  const p = plain instanceof Uint8Array ? plain : Uint8Array.from(plain);
  if (spec === '24501') {
    return Uint8Array.of(0x7e, sht & 0x0f, ...mac, seq, ...p); // SHT 低半 + spare 高半 0（=pycrate oracle 7e01…）
  }
  return Uint8Array.of((sht << 4) | 7, ...mac, seq, ...p); // PD=7（EMM）
}

// 供 UI 展示的行摘要
function secSummary(d) {
  const lines = [
    `SHT ${d.sht}：${d.shtDesc}`,
    `MAC：${hex(d.mac)}（透明域——需 K_NAS 与 5G-IA/EIA 计算）`,
    `Sequence number：${d.seq}`,
  ];
  if (d.inner) {
    lines.push(`内层消息：${d.inner.msg}（${d.inner.section}，${d.inner.parts.length} 行已解）`);
  } else if (d.readable) {
    lines.push('内层消息：未能派发（msgType 不在当前 schema）——载荷 hex 见下');
  } else {
    lines.push('载荷已加密（结构级不可读）');
  }
  return lines;
}

// ---- 受保护帧的加密/解密（端到端语义，UI 与测试共用）----------------------------
// 约定（33.501 §6.4 / 33.401 §8：发送端先 EEA 加密、后 EIA 完整性保护）——MAC 覆盖的
// 是**密文**载荷（v1.7 decipher 语义已锚定：解密后重组 SHT=1 帧、MAC 按明文重算才自洽）。
// SHT∈{2,4} 载荷为密文；SHT∈{1,3} 载荷为明文；EEA0（algEnc=0）载荷原样透传。

// 正向加密封装。opts = { sht=2, seq=0, count24=0, dir=0, bearer=0,
//   keys: {algInt, kInt, algEnc, kEnc}, mac（hex 串，仅 SHT=1/3 无密钥时的透明域回退） }。
// SHT∈{2,4}：EEA 加密载荷 + MAC 覆盖密文（必须已派生 K_NASenc/K_NASint）；
// SHT∈{1,3}：载荷原样，已派生 K_NASint 时 MAC 覆盖明文自动填入，否则用 opts.mac。
// 返回 { frame, payload, mac, ciphered }（payload = 入帧载荷，mac = 帧内 MAC）。
function encSecProtected(schema, plain, opts = {}, spec = '24501') {
  const sht = opts.sht ?? 2;
  if (!shtReadable(sht) && !(sht === 2 || sht === 4)) {
    throw new Error(`SHT=${sht} 不是可封装值（1-4；0 为明文消息无需封装）`);
  }
  const ciphered = sht === 2 || sht === 4;
  const { seq = 0, count24 = 0, dir = 0, bearer = 0, keys } = opts;
  if (ciphered && !(keys && keys.kEnc != null)) throw new Error('SHT=2/4 加密封装需先派生 K_NASenc');
  if (ciphered && !(keys && keys.kInt != null)) throw new Error('SHT=2/4 封装需先派生 K_NASint（MAC 覆盖密文）');
  const p = plain instanceof Uint8Array ? plain : Uint8Array.from(plain);
  const payload = ciphered ? nasCipher(spec, keys.algEnc, keys.kEnc, count24, dir, bearer, p) : p.slice();
  const mac = keys && keys.kInt != null
    ? nasMac(spec, keys.algInt, keys.kInt, count24, dir, bearer, seq, payload)
    : OCT(opts.mac || '00000000');
  const frame = encSec(payload, { sht, mac, seq }, spec);
  return { frame, payload, mac, ciphered };
}

// 加密载荷解密 + 明文重组。decSec → EEA 解密（EEA0 原样）→ 重组 SHT=1 明文帧，
// MAC 按明文载荷重算（原 MAC 覆盖的是密文，SHT 八位组不在 MAC 覆盖域内）。
// opts = { count24=0, dir=0, bearer=0, keys }。SHT∈{1,3}（本就可读）直接返回结构级结果。
// 返回 { d（decSec 结果）, plain, plainFrame, macPlain, readable }。
function decipherSec(schema, bytes, opts = {}, spec = '24501') {
  const d = decSec(schema, bytes, spec);
  if (!isCipheredSht(d.sht)) return { d, plain: d.payload, plainFrame: null, macPlain: null, readable: true };
  const { count24 = 0, dir = 0, bearer = 0, keys } = opts;
  if (!(keys && keys.kEnc != null)) throw new Error('SHT=2/4 解密需先派生 K_NASenc');
  if (!(keys && keys.kInt != null)) throw new Error('SHT=2/4 解密需先派生 K_NASint（重组帧 MAC 按明文重算）');
  const plain = nasCipher(spec, keys.algEnc, keys.kEnc, count24, dir, bearer, d.payload);
  const macPlain = nasMac(spec, keys.algInt, keys.kInt, count24, dir, bearer, d.seq, plain);
  const plainFrame = encSec(plain, { sht: 1, mac: macPlain, seq: d.seq }, spec);
  return { d, plain, plainFrame, macPlain, readable: false };
}

function isCipheredSht(sht) {
  return sht === 2 || sht === 4;
}

// ==== src/nas/semantics.js ====
// src/nas/semantics.js — M4：IE 值语义层（特殊值编码）。
//
// 覆盖三类 NAS 常用特殊编码（编码规则依 TS 23.003 / 24.501 §9.11 系列）：
//   - APN/DNN：点分标签 ⇔ 长度前缀标签串（DNN 值域）；
//   - PLMN：MCC/MNC 半八位组交换编码（3 八位组，F 填充）；
//   - BCD：半八位组数字串（身份类 IE 的数字域）。
// 均为纯函数，双向可逆；黄金向量见 test/nas_semantics.test.js（APN 向量与 pycrate
// TS24501_IE.DNN 编码实测一致）。

// ---- APN / DNN ----------------------------------------------------------------
// 'imstest.mnc001.mcc001.gprs' → 07 696d73746573 74 06... （每标签 1 长度字节 + ASCII）
function apnEncode(dotted) {
  const labels = (dotted || '').split('.').filter((s) => s !== '');
  const out = [];
  for (const label of labels) {
    if (label.length > 63) throw new Error(`APN 标签过长（>63）: ${label}`);
    for (let i = 0; i < label.length; i++) {
      const c = label.charCodeAt(i);
      if (c < 0x21 || c > 0x7e) throw new Error(`APN 标签含非法字符: ${label}`);
      out.push(c);
    }
    out.splice(out.length - label.length, 0, label.length);
  }
  return Uint8Array.from(out);
}

function apnDecode(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  const labels = [];
  let i = 0;
  while (i < u8.length) {
    const l = u8[i];
    if (l === 0) break; // 空标签 = 根域终止
