        const rec = (n) => { if (!n || typeof n !== 'object') return;
          for (const f of [...(n.fields || []), ...(n.alts || [])]) if (f.type) f.type = walk(f.type);
          for (const g of (n.additions || [])) for (const f of (g.fields || [])) if (f.type) f.type = walk(f.type);
          if (n.of) n.of = walk(n.of);
        };
        rec(copy);
        return copy;
      }
      return copy; // 非 seq/choice 目标：约束不改变结构（保持副本）
    }
    const mapField = (f) => ({ ...f, type: walk(f.type) });
    if (node.kind === 'seq' || node.kind === 'choice') {
      const out = { ...node, fields: (node.fields || []).map(mapField), alts: (node.alts || []).map(mapField) };
      if (node.kind === 'seq') out.additions = (node.additions || []).map((g) => ({ ...g, fields: g.fields.map(mapField) }));
      else out.additions = (node.additions || []).map(mapField);
      return out;
    }
    if (node.kind === 'seqof') return { ...node, of: walk(node.of) };
    if ((node.kind === 'bitstr' || node.kind === 'octstr') && node.containing) return { ...node, containing: walk(node.containing) };
    return node;
  };
  for (const [name, node] of module.types) {
    if (node && node.params) continue;
    module.types.set(name, walk(node));
  }
}

// 参数化实例化：把 `Name {Arg}` 使用点替换成模板体（参数→实参）的深拷贝。
// 模板本体保留（带 params 标记）供 diff 展示，但不再是可编码类型。
// 38.331 实测只有 SetupRelease{ElementTypeParam} 单参模板；多参语法已支持。
function instantiateParams(module, registry, errors) {
  const findDef = (name) => {
    if (module.types.has(name)) return module.types.get(name);
    if (registry) {
      const mods = registry.modules ? [...registry.modules.values()]
        : registry instanceof Map ? [...registry.values()] : [];
      for (const m of mods) if (m.types && m.types.has(name)) return m.types.get(name);
    }
    return undefined;
  };
  const inst = (node, binding) => {
    if (!node || typeof node !== 'object') return node;
    if (node.setArg) {
      // 集合实参标记：参数名可能已被外层替换成 {__set:实际集合名}
      const v = binding && Object.prototype.hasOwnProperty.call(binding, node.name) ? binding[node.name] : node;
      if (v && v.__set) return v;
      if (v && v.kind === 'ref') return { __set: v.name };
      return { __set: node.name };
    }
    if (node.kind === 'classref') {
      // 表约束里的参数名 → 实参集合名（resolveIOC 只认具体集合名）
      if (node.table && binding) {
        const b = binding[node.table.set];
        if (b && b.__set) return { ...node, table: { ...node.table, set: b.__set } };
      }
      return node;
    }
    if (node.kind === 'litnum') return { __num: node.v }; // 数字实参（SIZE 边界）
    // INTEGER 类参数作边界（NGAP-Containers 的 lowerBound/upperBound）；
    // 模板内的全局常量边界（SIZE(0..maxProtocolIEs)）经 values 回退解析
    const regVal = (name) => {
      if (module.values.has(name)) return module.values.get(name);
      if (registry) {
        const mods = registry.modules ? [...registry.modules.values()]
          : registry instanceof Map ? [...registry.values()] : [];
        for (const m of mods) if (m.values && m.values.has(name)) return m.values.get(name);
      }
      return undefined;
    };
    const substBound = (v) => {
      if (typeof v !== 'string') return v;
      if (binding && Object.prototype.hasOwnProperty.call(binding, v)) {
        const b = binding[v];
        if (b && b.__num !== undefined) return b.__num;
        if (b && b.kind === 'ref') {
          const x = regVal(b.name);
          if (typeof x === 'number') return x;
        }
        return v;
      }
      const g = regVal(v);
      return typeof g === 'number' ? g : v;
    };
    {
      if (node.kind === 'int') {
        const mn = substBound(node.min), mx = substBound(node.max);
        if (mn !== node.min || mx !== node.max) node = { ...node, min: mn, max: mx };
      }
      if ((node.kind === 'seqof' || node.kind === 'bitstr' || node.kind === 'octstr' || node.kind === 'charstr') && node.size) {
        const l = substBound(node.size.l), u = substBound(node.size.u);
        if (l !== node.size.l || u !== node.size.u) node = { ...node, size: { ...node.size, l, u } };
      }
    }
    if (node.kind === 'ref') {
      if (!node.args) {
        if (binding && Object.prototype.hasOwnProperty.call(binding, node.name)) {
          const v = binding[node.name];
          return v && v.__set ? node : structuredClone(v);
        }
        return node;
      }
      const def = findDef(node.name);
      if (!def) { errors.push(`未解析的参数化类型引用 ${node.name}`); return node; }
      if (!def.params) { errors.push(`${node.name} 不是参数化类型，却给了实参`); return node; }
      if (def.params.length !== node.args.length) {
        errors.push(`${node.name} 参数个数不匹配：定义 ${def.params.length} 个，实给 ${node.args.length} 个`);
        return node;
      }
      const b = {};
      def.params.forEach((p, i) => { b[p.name] = inst(node.args[i], binding); });
      const body = { ...def };
      delete body.params;
      return inst(body, b);
    }
    const mapField = (f) => ({ ...f, type: inst(f.type, binding) });
    if (node.kind === 'seq' || node.kind === 'choice') {
      // seq.additions = 组数组；choice.additions = 扁平字段数组（toir 形状）
      const out = { ...node,
        fields: (node.fields || []).map(mapField),
        alts: (node.alts || []).map(mapField) };
      if (node.kind === 'seq')
        out.additions = (node.additions || []).map((g) => ({ ...g, fields: g.fields.map(mapField) }));
      else
        out.additions = (node.additions || []).map(mapField);
      return out;
    }
    if (node.kind === 'seqof') return { ...node, of: inst(node.of, binding) };
    if ((node.kind === 'bitstr' || node.kind === 'octstr') && node.containing)
      return { ...node, containing: inst(node.containing) };
    return node;
  };
  for (const [name, node] of module.types) {
    if (node && node.params) continue; // 模板本体不实例化
    module.types.set(name, inst(node, null));
  }
}

// 信息对象类落地：对象/对象集按 WITH SYNTAX 解释 → classref 解析为
//   标量列：基类型克隆（表约束不收窄 PER 编码——pycrate 实测 InitiatingMessage.procedureCode
//           保持 INTEGER(0..255) 基边界）；
//   型字段（&Value 类）：{kind:'open', keyField, table:[{key, type}]}——键取自关系约束
//   {@keyField} 指向的同 SEQ 前导字段（如 ProtocolIE-Field 的 id）。
// 必须在 instantiateParams 之后：表约束中的参数名此时已替换为实参集合名。
function resolveIOC(module, registry, errors, warnings) {
  const hasIOC = (module.objects && module.objects.size) || (module.sets && module.sets.size)
    || [...module.types.values()].some(t => t && (t.kind === 'classref' || t.kind === 'class'));
  if (!hasIOC) return;
  const regMods = () => registry ? (registry.modules ? [...registry.modules.values()]
    : registry instanceof Map ? [...registry.values()] : []) : [];
  const findClass = (name) => {
    const loc = module.types.get(name);
    if (loc && loc.kind === 'class') return loc;
    for (const m of regMods()) { const t = m.types && m.types.get(name); if (t && t.kind === 'class') return t; }
    return undefined;
  };
  const findType = (name) => {
    const loc = module.types.get(name);
    if (loc && loc.kind !== 'class') return structuredClone(loc);
    for (const m of regMods()) {
      const t = m.types && m.types.get(name);
      if (t && t.kind !== 'class') return structuredClone(t);
    }
    return undefined;
  };
  const findSet = (name) => {
    if (module.sets && module.sets.has(name)) return module.sets.get(name);
    for (const m of regMods()) if (m.sets && m.sets.has(name)) return m.sets.get(name);
    return undefined;
  };
  const findObject = (name) => {
    if (module.objects && module.objects.has(name)) return module.objects.get(name);
    for (const m of regMods()) if (m.objects && m.objects.has(name)) return m.objects.get(name);
    return undefined;
  };
  const valueOf = (v) => { // 常量别名 → 数值（module.values 已终态化为数字）
    if (typeof v !== 'string') return v;
    if (module.values.has(v)) return module.values.get(v);
    for (const m of regMods()) if (m.values && m.values.has(v)) return m.values.get(v);
    return v;
  };
  // 对象体解释：按类 WITH SYNTAX 线性匹配（可选组带回溯）。
  // 值捕获 = 1 个 token（id-name/枚举名/类型名/数字——NGAP 全部如此）。
  const primCache = new Map();
  const buildPrim = (text) => {
    if (primCache.has(text)) return primCache.get(text);
    let def;
    try {
      const r = parseToModule(`PrimBoundMod DEFINITIONS AUTOMATIC TAGS ::= BEGIN
PrimBound ::= ${text}
END
`, { provenance: 'user-imported' }, registry);
      def = r.errors.length ? undefined : (r.module && r.module.types.get('PrimBound'));
    } catch { def = undefined; }
    primCache.set(text, def);
    return def;
  };
  const interpretCache = new Map();
  const interpret = (obj) => {
    const cls = findClass(obj.class);
    if (!cls) { errors.push(`信息对象类 ${obj.class} 未找到`); return null; }
    const toks = obj.toks;
    const cacheKey = obj.class + '|' + toks.map(t => t.v ?? t.t).join(' ');
    if (interpretCache.has(cacheKey)) return interpretCache.get(cacheKey);
    const bind = (t) => (t.t === 'num' ? t.v : String(t.v));
    // TYPE/EXTENSION 列的绑定可带约束与多词基类型（OCTET STRING (CONTAINING X) 等）：
    // 一路吃到下一个语法字面量为止；单 token = 类型名，多 token = 还原文本 {__text}
    // （X.680：WITH SYNTAX 的字段之间必有字面量分隔，贪吃消费安全）
    const literals = new Set();
    const collectLits = (items) => {
      for (const it of items || []) {
        if (it.lit) literals.add(it.lit);
        if (it.opt) collectLits(it.opt);
      }
    };
    collectLits(cls.syntax);
    // 贪吃捕获的停止集合需含别名词，否则 TYPE 会被吞进上一个字段值
    if (module.draftTolerant) { literals.add('TYPE'); literals.add('EXTENSION'); }
    const captureVal = (ti) => {
      const t = toks[ti];
      if (!(t.t === 'id' && literals.has(t.v))) {
        let j = ti + 1;
        while (j < toks.length && !(toks[j].t === 'id' && literals.has(toks[j].v))) j++;
        if (j > ti + 1) return { val: { __text: toks.slice(ti, j).map(x => String(x.v ?? x.t)).join(' ') }, n: j - ti };
      }
      return { val: bind(t), n: 1 };
    };
    let result = null;
    // 草稿笔误宽容（仅 draftTolerant）：TYPE/EXTENSION 字面量互混（XnAP fj0/gh0 的
    // EXTENSION 类对象误用 TYPE——后期正式版已修正）
    const LIT_ALIAS = module.draftTolerant ? { TYPE: 'EXTENSION', EXTENSION: 'TYPE' } : null;
    const tokIsLit = (ti, lit) => ti < toks.length && toks[ti].t === 'id'
      && (toks[ti].v === lit || (LIT_ALIAS && LIT_ALIAS[lit] === toks[ti].v));
    const walk = (ti, si, out) => {
      if (result) return;
      if (si >= cls.syntax.length) { if (ti >= toks.length) result = out; return; }
      const item = cls.syntax[si];
      if (item.opt) {
        // 可选组：尝试整体匹配（组内顺序匹配），失败则跳过该组
        const tryGroup = (t2, o2, gi) => {
          if (result) return;
          if (gi >= item.opt.length) { walk(t2, si + 1, o2); return; }
          const g = item.opt[gi];
          if (g.lit) { if (tokIsLit(t2, g.lit)) tryGroup(t2 + 1, o2, gi + 1); }
          else if (t2 < toks.length) { const c = captureVal(t2); tryGroup(t2 + c.n, { ...o2, [g.field]: c.val }, gi + 1); }
        };
        tryGroup(ti, { ...out }, 0);
        walk(ti, si + 1, out); // 不取该可选组
        return;
      }
      if (item.lit) { if (tokIsLit(ti, item.lit)) walk(ti + 1, si + 1, out); return; }
      if (ti < toks.length) { const c = captureVal(ti); walk(ti + c.n, si + 1, { ...out, [item.field]: c.val }); }
    };
    if (cls.syntax) walk(0, 0, {});
    else {
      // 无 WITH SYNTAX 保底：{ &f v, &f v } 字段名形态
      const out = {};
      for (let i = 0; i + 1 < toks.length; i += 2)
        if (toks[i].t === 'amp') out[toks[i].v] = bind(toks[i + 1]);
      result = out;
    }
    if (!result) errors.push(`对象体与类 ${obj.class} 的 WITH SYNTAX 不匹配: ${toks.map(t => t.v ?? t.t).join(' ').slice(0, 300)}`);
    interpretCache.set(cacheKey, result);
    return result;
  };
  const resolveClassref = (node) => {
    const cls = findClass(node.cls);
    if (!cls) { errors.push(`类 ${node.cls} 未找到（classref）`); return node; }
    const fld = cls.fields.find(f => f.name === node.field);
    if (!fld) { errors.push(`类 ${node.cls} 无字段 &${node.field}`); return node; }
    if (fld.type) return structuredClone(fld.type); // 标量列：基类型，表约束不收窄编码
    if (!node.table || !node.table.key) {
      errors.push(`类字段 ${node.cls}.&${node.field} 需要关系约束 ({Set}{@key})`);
      return node;
    }
    const set = findSet(node.table.set);
    if (!set) { errors.push(`对象集 ${node.table.set} 未找到`); return node; }
    // 成员收集：引用可能指向对象或子集合（NGAP-ELEMENTARY-PROCEDURES = CLASS-1 | CLASS-2）
    const seenSets = new Set();
    const bindingsList = [];
    const collect = (setName) => {
      if (seenSets.has(setName)) return;
      seenSets.add(setName);
      const s = findSet(setName);
      if (!s) { errors.push(`对象集 ${setName} 未找到`); return; }
      for (const m of s.members) {
        if (m.ref) {
          if (findSet(m.ref)) { collect(m.ref); continue; }
          const o = findObject(m.ref);
          if (!o) { errors.push(`信息对象 ${m.ref} 未找到（集合 ${setName}）`); continue; }
          bindingsList.push(interpret(o));
        } else if (m.obj) bindingsList.push(interpret({ class: s.class, toks: m.obj }));
        else errors.push(`异常集合成员（集合 ${setName}）：${JSON.stringify(m).slice(0, 1500)}`);
      }
    };
    collect(node.table.set);
    const rows = [];
    for (const bindings of bindingsList) {
      if (!bindings) continue;
      const key = valueOf(bindings[node.table.key]);
      const typeName = bindings[fld.name];
      // 行缺该列绑定（如 CLASS-2 过程无 &SuccessfulOutcome）：该列的表中直接跳过
      if (typeName === undefined) continue;
      let def;
      if (typeName && typeName.__text) def = buildPrim(typeName.__text);
      else if (typeName && typeof typeName === 'object') def = structuredClone(typeName);
      else def = findType(typeName);
      if (!def) { errors.push(`IE 类型 ${typeName} 未找到（&${node.field} 绑定）`); continue; }
      rows.push({ key, typeName: typeof typeName === 'string' ? typeName : null, type: def });
    }
    return { kind: 'open', keyField: node.table.key, table: rows };
  };
  const walk = (node) => {
    if (!node || typeof node !== 'object') return node;
    if (node.kind === 'classref') return resolveClassref(node);
    if (node.kind === 'seq' || node.kind === 'choice') {
      const out = { ...node,
        fields: (node.fields || []).map(f => ({ ...f, type: walk(f.type) })),
        alts: (node.alts || []).map(f => ({ ...f, type: walk(f.type) })) };
      if (node.kind === 'seq')
        out.additions = (node.additions || []).map(g => ({ ...g, fields: g.fields.map(f => ({ ...f, type: walk(f.type) })) }));
      else
        out.additions = (node.additions || []).map(f => ({ ...f, type: walk(f.type) }));
      return out;
    }
    if (node.kind === 'seqof') return { ...node, of: walk(node.of) };
    return node;
  };
  for (const [name, t] of module.types) {
    if (!t || t.params || t.kind === 'class') continue;
    module.types.set(name, walk(t));
  }
}

// 官方 .asn 文件级入口：文本 → { modules, errors }。
// 按行扫描模块头（`Name DEFINITIONS ...`）切块，逐模块 parse/resolve/validate，
// 成功的模块即时入 registry（后续模块的 IMPORTS 能解析到先行模块）。
function parseAsn1File(text, meta = {}, registry = null) {
  const errors = [];
  const warnings = [];
  const modules = [];
  const HEADER = /^\s*[A-Za-z][A-Za-z0-9-]*\s+DEFINITIONS\b/;
  const HEADER_NONAME = /^\s*DEFINITIONS\b/; // NGAP 族：Name {OID...} 与 DEFINITIONS 分行
  const ENDLINE = /^\s*END\s*$/;
  const chunks = [];
  let cur = null;
  let pending = []; // DEFINITIONS 前的模块头行（名字/OID 块）
  for (const line of String(text).split('\n')) {
    // END 行收块：模块结束后的附录散文/尾巴不再粘进块（i90 文末有 ASN1START
    // 约定说明的 bullet 散文，粘进去会让 tokenizer 报错）
    if (cur && ENDLINE.test(line)) { cur.push(line); cur = null; pending = []; continue; }
    if (HEADER.test(line)) { cur = [line]; chunks.push(cur); pending = []; continue; }
    if (!cur && HEADER_NONAME.test(line)) {
      // 模块名与 OID 在前几行（NGAP-PDU-Descriptions { itu-t (0) ... }）——一并收进块
      cur = [...pending, line];
      chunks.push(cur);
      pending = [];
      continue;
    }
    if (cur) cur.push(line);
    else pending.push(line);
  }
  // 两阶段：先全部 build（阶段一），整体入 registry，再逐模块 finalize（阶段二）。
  // 这样 M1 可以引用后文 M2 里定义的类型（h00/38.331 v17.0.0 的前向跨模块引用）。
  const built = [];
  chunks.forEach((chunk, i) => {
    try {
      built.push(buildModule(chunk.join('\n'), meta, warnings));
    } catch (e) {
      errors.push(`[模块 #${i + 1}] ${e.message}`);
    }
  });
  for (const m of built) if (registry) registry.add(m);
  const failed = new Set();
  built.forEach((m, i) => {
    const errs = [];
    finalizeEarly(m, registry, errs, warnings);
    if (errs.length) { failed.add(m.name); errors.push(`[模块 #${i + 1} ${m.name}] ${errs.join(' | ')}`); }
  });
  // 阶段 B 需要全部模块的阶段 A 产物（跨模块 IOC 表引用参数化实例）
  built.forEach((m, i) => {
    if (failed.has(m.name)) return;
    const errs = [];
    finalizeLate(m, registry, errs, warnings);
    if (errs.length) errors.push(`[模块 #${i + 1} ${m.name}] ${errs.join(' | ')}`);
    else modules.push(m);
  });
  return { modules, errors, warnings };
}

// 规范库：内置 + 用户导入；提供 ctx 工厂
class SchemaRegistry {
  constructor(builtinModules = []) {
    this.modules = new Map(); // moduleName -> module
    for (const m of builtinModules) this.modules.set(m.name, m);
  }
  add(module) { this.modules.set(module.name, module); }
  ctxFor(module) {
    return makeCtx(module, this.modules);
  }
}

// ==== src/diff/engine.js ====
// 语义 Diff 引擎：IR×IR → findings + report。
// 规则表 D1–D13 见 docs/spec.md §5。核心差异化能力：位宽计算（纯文本 diff 不可见）。

function bitWidthInt(t) {
  if (t.min === undefined || t.max === undefined) return null; // 无约束：行列式编码
  return Math.ceil(Math.log2(t.max - t.min + 1));
}
function bitWidthEnum(t) {
  return t.root.length <= 1 ? 0 : Math.ceil(Math.log2(t.root.length));
}

function sevOf(n) { return n; }

function diffIR(l, r, path = '', lines = { left: [], right: [] }, out = null) {
  if (!out) out = { findings: [], report: { ok: 0, warn: 0, info: 0, verdict: '' } };
  const push = (sev, title, detail, ln) => {
    out.findings.push({ sev, title, detail, lines: ln || lines });
    out.report[sev === 'ok' ? 'ok' : sev === 'warn' ? 'warn' : 'info']++;
  };

  if (l.kind !== r.kind) {
    push('warn', `${path || '类型'} 类型替换`, `类型由 ${l.kind} 变为 ${r.kind}——编码完全改变。`);
    return out;
  }

  switch (l.kind) {
    case 'seq': diffSeq(l, r, path, lines, push, out); break;
    case 'choice': diffChoice(l, r, path, lines, push, out); break;
    case 'enum': diffEnum(l, r, path, lines, push); break;
    case 'int': diffInt(l, r, path, lines, push); break;
    case 'bitstr': case 'octstr': diffSize(l, r, path, lines, push); break;
    case 'open': diffOpen(l, r, path, lines, push, out); break;
    case 'seqof':
      if ((l.size && r.size) && (l.size.l !== r.size.l || l.size.u !== r.size.u)) {
        const wl = Math.ceil(Math.log2(l.size.u - l.size.l + 1));
        const wr = Math.ceil(Math.log2(r.size.u - r.size.l + 1));
        if (wl !== wr) push('warn', `${path} SIZE 位宽变化`, `数量编码 ${wl} bit → ${wr} bit，后续字段整体错位。`);
        else push('info', `${path} SIZE 约束变化`, `(${l.size.l}..${l.size.u}) → (${r.size.l}..${r.size.u})，位宽 ${wl} bit 不变。`);
      }
      diffIR(l.of, r.of, `${path}[]`, { left: lines.left, right: lines.right }, out);
      break;
    default: break; // bool/null 同型无参
  }
  if (!path) finalizeReport(out);
  return out;
}

function typeLabel(t) {
  if (t.kind === 'int') return t.min !== undefined ? `INTEGER (${t.min}..${t.max})` : 'INTEGER';
  if (t.kind === 'enum') return `ENUMERATED {${t.root.slice(0, 3).join(', ')}${t.root.length > 3 ? ', …' : ''}}`;
  return t.kind.toUpperCase();
}

function diffSeq(l, r, path, lines, push, out) {
  const pl = path ? path + '.' : '';
  // 扩展标记（preamble 语义）
  if (l.extensible !== r.extensible) {
    push('warn', `${path || 'SEQUENCE'} 扩展标记变化`,
      `${l.extensible ? '有' : '无'}扩展标记 → ${r.extensible ? '有' : '无'}。preamble 语义改变（多/少 1 个扩展位），旧编码全部错位。`, lines);
  }
  const lf = l.fields, rf = r.fields;
  const rUsed = new Set();
  const lNames = new Set(lf.map(f => f.name));
  // 逐个左字段找右字段（名字锚定；无同名时允许"未被名字占用的同型邻位"判为改名）
  lf.forEach((f, i) => {
    let g = rf.find(x => x.name === f.name);
    let renamed = false;
    if (!g) {
      const cand = rf[i];
      if (cand && !lNames.has(cand.name) && cand.type.kind === f.type.kind && typeEq(f.type, cand.type)) {
        g = cand; renamed = true;
      }
    }
    if (!g) {
      push('warn', `${pl}${f.name} 被删除`, `root 字段删除：新版无法解码含该字段的旧消息。`, { left: [f.line], right: [] });
      return;
    }
    if (rUsed.has(g.name)) return;
    rUsed.add(g.name);
    const ln = { left: [f.line], right: [g.line] };
    if (renamed) {
      push('info', `${pl}${f.name} → ${g.name} 改名`, `同型同位推断为重命名。编码位不变，但工具链/日志按名字解析会失配。`, ln);
    }
    // optional / default 语义
    if (f.optional && !g.optional) push('warn', `${pl}${f.name} 可选 → 必选`, `presence 位图语义变化：旧版本消息缺该字段时新版判定不完整。`, ln);
    else if (!f.optional && g.optional) push('ok', `${pl}${f.name} 必选 → 可选`, `兼容：新版容忍字段缺失（presence 位图新增）。`, ln);
    if (f.default !== undefined && g.default !== undefined && f.default !== g.default)
      push('info', `${pl}${f.name} DEFAULT 值变化`, `缺省值 ${JSON.stringify(f.default)} → ${JSON.stringify(g.default)}。`, ln);
    // 递归类型
    diffIR(f.type, g.type, pl + (renamed ? g.name : f.name), ln, out);
  });
  rf.forEach(g => {
    if (rUsed.has(g.name)) return;
    push('warn', `${pl}${g.name} 为新增 root 字段`, `root 区新增：旧消息无此字段，新版解码失败。`, { left: [], right: [g.line] });
  });
  // 扩展组：新增组=ok；删组=info
  const lrels = new Map((l.additions || []).map(g => [g.rel || g.fields.map(x => x.name).join(','), g]));
  const rrels = new Map((r.additions || []).map(g => [g.rel || g.fields.map(x => x.name).join(','), g]));
  for (const [k, g] of rrels) {
    if (!lrels.has(k))
      push('ok', `${path || 'SEQUENCE'} 扩展区新增组${g.rel ? `（${g.rel}）` : ''}`,
        `新增 ${g.fields.map(f => f.name).join(', ')} 位于扩展区（开放类型编码）：旧接收端按未知扩展跳过，向后兼容。`,
        { left: [], right: g.fields.map(f => f.line) });
  }
  for (const [k, g] of lrels) {
    if (!rrels.has(k))
      push('info', `${path || 'SEQUENCE'} 扩展组${g.rel ? `（${g.rel}）` : ''} 被移除`,
        `扩展组删除：新版不再产出该组内容；历史消息中的该组内容成为未知扩展。`, { left: g.fields.map(f => f.line), right: [] });
  }
}

function typeEq(a, b) {
  if (a.kind !== b.kind) return false;
  if (a.kind === 'int') return a.min === b.min && a.max === b.max;
  if (a.kind === 'enum') return a.root.join() === b.root.join();
  if (a.kind === 'bitstr' || a.kind === 'octstr') return JSON.stringify(a.size) === JSON.stringify(b.size);
  return true;
}

// open（IOC 关系约束）＝ IE 表：按 keyField 键控逐行比对。
// AP 族（NGAP/S1AP/XnAP/F1AP/E1AP）的消息结构差异核心就在容器集行表——
// 行增删不动位流（开放类型按 id 键控），同行载荷类型变更则该 IE 编码改变。
function diffOpen(l, r, path, lines, push, out) {
  const lt = l.table || [], rt = r.table || [];
  const lmap = new Map(lt.map(x => [x.key, x]));
  const rmap = new Map(rt.map(x => [x.key, x]));
  const label = (row) => `id=${row.key}${row.typeName ? `（${row.typeName}）` : ''}`;
  for (const [k, row] of rmap) {
    if (!lmap.has(k))
      push('ok', `${path || '容器'} IE 新增 ${label(row)}`,
        `表约束新增行：开放类型按 id 键控，旧接收端跳过未知 id 的 IE，向后兼容。`, lines);
  }
  for (const [k, row] of lmap) {
    if (!rmap.has(k))
      push('info', `${path || '容器'} IE 删除 ${label(row)}`,
        `表约束删除行：位级布局不变（其余 IE 按 id 键控不受影响），但新版不再定义该 IE 的收发语义。`, lines);
  }
  for (const [k, lr] of lmap) {
    const rr = rmap.get(k);
    if (!rr) continue;
    const same = lr.typeName && rr.typeName ? lr.typeName === rr.typeName
      : (!lr.typeName && !rr.typeName ? typeEq(lr.type || { kind: 'null' }, rr.type || { kind: 'null' }) : false);
    if (!same)
      push('warn', `${path || '容器'} IE 载荷类型变更 ${label(lr)}`,
        `id=${k} 行载荷 ${lr.typeName || '内联类型'} → ${rr.typeName || '内联类型'}：携带该 IE 的消息编码/解码改变。`, lines);
  }
}

function diffChoice(l, r, path, lines, push, out) {
  if (l.extensible !== r.extensible) {
    push('warn', `${path || 'CHOICE'} 扩展标记变化`, `索引空间与扩展位语义改变。`, lines);
  }
  const lnames = l.alts.map(a => a.name);
  const rnames = r.alts.map(a => a.name);
  for (const n of lnames) if (!rnames.includes(n))
    push('warn', `${path}~${n} 分支被删除`, `root 分支删除：索引重排，所有旧索引语义改变。`);
  for (const n of rnames) if (!lnames.includes(n))
    push('warn', `${path}~${n} 为新增 root 分支`, `root 区新增分支：索引位宽/语义可能变化。`);
  const wl = bitWidthEnum({ root: l.alts.map(a => a.name) });
  const wr = bitWidthEnum({ root: r.alts.map(a => a.name) });
  if (wl !== wr) push('warn', `${path || 'CHOICE'} 索引位宽变化`, `root 分支索引 ${wl} bit → ${wr} bit。`);
  for (const a of l.alts) {
    const g = r.alts.find(x => x.name === a.name);
    if (g) diffIR(a.type, g.type, `${path}~${a.name}`, { left: [a.line], right: [g.line] }, out);
  }
  const lAdd = (l.additions || []).length, rAdd = (r.additions || []).length;
  if (rAdd > lAdd) push('ok', `${path || 'CHOICE'} 扩展区新增分支`, `新增 ${rAdd - lAdd} 个扩展分支：旧接收端按未知扩展处理，兼容。`);
}

function diffEnum(l, r, path, lines, push) {
  const lset = new Set(l.root), rset = new Set(r.root);
  const removed = l.root.filter(x => !rset.has(x));
  const added = r.root.filter(x => !lset.has(x));
  if (removed.length || added.length || l.root.join() !== r.root.join()) {
    const wl = bitWidthEnum(l), wr = bitWidthEnum(r);
    const why = [];
    if (removed.length) why.push(`移除 ${removed.join(', ')}`);
    if (added.length) why.push(`新增 ${added.join(', ')}`);
    if (!removed.length && !added.length && l.root.join() !== r.root.join()) why.push('root 顺序重排');
    push('warn', `${path || 'ENUMERATED'} root 值集变化`, `${why.join('；')}。${wl} bit → ${wr} bit${wl !== wr ? '——索引位宽变化，编码错位。' : '——索引含义改变。'}`, lines);
  }
  const le = (l.ext || []).length, re = (r.ext || []).length;
  if (re > le) push('ok', `${path || 'ENUMERATED'} 扩展区新增 ${re - le} 值`, `扩展枚举值经 normally-small 索引编码，旧接收端跳过，兼容。`);
  if (le > re) push('info', `${path || 'ENUMERATED'} 扩展区移除 ${le - re} 值`, `历史编码中的扩展索引成为未知值。`);
}

function diffInt(l, r, path, lines, push) {
  if (l.min === undefined || r.min === undefined) {
    if ((l.min === undefined) !== (r.min === undefined))
      push('warn', `${path || 'INTEGER'} 约束形态变化`, `${l.min === undefined ? '无约束' : `(${l.min}..${l.max})`} → ${r.min === undefined ? '无约束' : `(${r.min}..${r.max})`}：编码从行列式切换为定长位（或反之）。`, lines);
    return;
  }
  if (l.min === r.min && l.max === r.max) return;
  const wl = bitWidthInt(l), wr = bitWidthInt(r);
  if (wl !== wr) {
    push('warn', `${path || 'INTEGER'} 约束变化（位宽 ${wl} bit → ${wr} bit）`,
      `(${l.min}..${l.max}) → (${r.min}..${r.max})。root 约束决定 UPER 位宽：${wl} bit → ${wr} bit，后续字段整体错位——存量消息无法被新版正确解码。`, lines);
  } else if (r.min > l.min || r.max < l.max) {
    push('warn', `${path || 'INTEGER'} 值域收窄（位宽不变）`,
      `(${l.min}..${l.max}) → (${r.min}..${r.max})：位宽 ${wl} bit 不变，但原合法值 ${r.min > l.min ? `[${l.min}..${r.min - 1}]` : ''}${r.max < l.max ? (r.min > l.min ? '、' : '') + `[${r.max + 1}..${l.max}]` : ''} 在新版中越界。`, lines);
  } else {
    push('ok', `${path || 'INTEGER'} 值域扩展（位宽不变）`,
      `(${l.min}..${l.max}) → (${r.min}..${r.max})：位宽 ${wl} bit 不变（填充 2 的幂区间），存量编码全部仍合法。`, lines);
  }
}

function diffSize(l, r, path, lines, push) {
  if (!l.size || !r.size) return;
  if (l.size.l === r.size.l && l.size.u === r.size.u) return;
  const wl = Math.ceil(Math.log2(l.size.u - l.size.l + 1));
  const wr = Math.ceil(Math.log2(r.size.u - r.size.l + 1));
  if (wl !== wr) push('warn', `${path} SIZE 位宽变化`, `长度编码 ${wl} bit → ${wr} bit。`);
  else push('info', `${path} SIZE 约束变化`, `(${l.size.l}..${l.size.u}) → (${r.size.l}..${r.size.u})，位宽不变。`);
}

// 生成结论话术
function finalizeReport(out) {
  const { ok, warn, info } = out.report;
  out.report.verdict = warn > 0
    ? `检出 ${warn} 处破坏性变更（另有 ${ok} 兼容 / ${info} 信息）：新旧版本编码不兼容，存量消息/日志按新 schema 解码会出错。升级需双栈或协商机制。`
    : `无破坏性变更：${ok} 处兼容变更、${info} 处信息级变更。旧版本消息可被新版安全解码（扩展区内容按未知扩展跳过）。`;
  return out;
}

// ==== tools/docxasn1.js ====
// docxasn1.js — extract ASN.1 text from a 3GPP spec .docx's word/document.xml.
//
// 3GPP RRC specs (TS 38.331 / 36.331) publish their ASN.1 in the Word body as
// many `-- ASN1START` … `-- ASN1STOP` chunks, interleaved with prose and with
// example snippets marked `-- /example/ ASN1START` (also "/bad example/",
// "/example 1/" variants). The full module(s) = all non-example chunks
// concatenated in document order.
//
// Shapes verified against 38331-i90.docx word/document.xml on 2026-09-27.

// Decode XML character references and the five predefined entities.
function unescapeXml(s) {
  return s.replace(/&(?:#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, (ent) => {
    switch (ent) {
      case '&lt;': return '<';
      case '&gt;': return '>';
      case '&quot;': return '"';
      case '&apos;': return "'";
      case '&amp;': return '&';
      default: {
        const m = /^&#x([0-9a-fA-F]+);$/.exec(ent) || /^&#([0-9]+);$/.exec(ent);
        return m ? String.fromCodePoint(parseInt(m[1], m[2] !== undefined ? 16 : 10)) : ent;
      }
    }
  });
}

// Split the document into paragraph texts. Depth-aware: <w:p> never nests
// except inside <w:txbxContent>, so a plain regex split would truncate the
// outer paragraph at the first inner close tag. Tokens of interest:
// `<w:p ` or `<w:p>` open, `</w:p>` close (exact — not `</w:pPr>`).
function paragraphsFromXml(xml) {
  // Open token also matches self-closing `<w:p .../>` (Word emits these for
  // empty paragraphs with rsid attributes — 1176 in 38331-i90); those carry
  // no close tag and must not change depth.
  const tokens = /<w:p(?:\s[^>]*)?\/?>|<\/w:p>/g;
  const paras = [];
  let depth = 0;
  let contentStart = -1;
  let m;
  while ((m = tokens.exec(xml)) !== null) {
    if (m[0] === '</w:p>') {
      depth -= 1;
      if (depth === 0 && contentStart >= 0) {
        paras.push(paragraphText(xml.slice(contentStart, m.index)));
        contentStart = -1;
      }
      if (depth < 0) depth = 0; // tolerate stray close tags
    } else if (m[0].endsWith('/>')) {
      if (depth === 0) paras.push('');
    } else {
      depth += 1;
      if (depth === 1) {
        contentStart = m.index + m[0].length;
      } else if (depth === 2) {
        // nested paragraph (inside textbox): its open and close cancel out;
        // skip the scanner past the inner close tag, keep collecting the outer.
        const close = xml.indexOf('</w:p>', tokens.lastIndex);
        tokens.lastIndex = close < 0 ? tokens.lastIndex : close + 6;
        depth = 1;
      }
    }
  }
  return paras;
}

// Paragraph XML fragment → plain-text line(s). Textbox content is stripped
// (its text never belongs to the main flow). In-run ordering of <w:t>,
// <w:tab/>, <w:br/>, <w:noBreakHyphen/> is preserved.
const ASN1_RUN_TOKEN =
  /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\b[^>]*\/?>|<w:br\b[^>]*\/?>|<w:noBreakHyphen\b[^>]*\/?>/g;

function paragraphText(frag) {
  const stripped = frag.replace(/<w:txbxContent>[\s\S]*?<\/w:txbxContent>/g, '');
  let out = '';
  let m;
  ASN1_RUN_TOKEN.lastIndex = 0;
  while ((m = ASN1_RUN_TOKEN.exec(stripped)) !== null) {
    if (m[1] !== undefined) out += unescapeXml(m[1]);
    else if (/^<w:tab/.test(m[0])) out += ' ';
    else if (/^<w:br/.test(m[0])) out += '\n';
    else if (/^<w:noBreakHyphen/.test(m[0])) out += '-';
  }
  return out;
}

// Word 自动更正腐蚀修复：3GPP ASN.1 是纯 ASCII，任何 en/em-dash、省略号、
// nbsp、© 在提取文本里都是文档排版损伤（实测 h10 的 `Ports–r17`、`–- Need R`、
// i00 的 `…` 扩展标记）。
function normalizeLine(s) {
  return s
    // 15.0.0 笔误：QFI :: = INTEGER（::= 被空格劈开）
    .replace(/:\s*:\s*=/g, '::=')
    .replace(/[\u2013\u2014\u2212]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/\u00a0/g, ' ')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    // 修饰重音符在 ASN.1 文本里只会是转换噪声（f00 的 `´ } OPTIONAL` 一行，
    // 删除后与 15.1.0 同位置 `} OPTIONAL` 结构一致）
    .replace(/[\u00b4\u02bc]/g, '')
    .replace(/[\u00a9\u2122]/g, '');
}

// 标记行必须整行恰为标记注释（可选 /example/ 类标签）：
// `-- ASN1START` / `-- /example/ ASN1START` / `-- ASN1STOP`。
// 散文句中引用 "ASN1START"（f00 clause 6.0 的约定说明）不得触发状态机。
const START_LINE = /^\s*--\s*(?:\/[^\/]+\/\s*)?ASN1START\s*$/;
const STOP_LINE = /^\s*--\s*(?:\/[^\/]+\/\s*)?ASN1STOP\s*$/;

// State machine over plain-text lines: collect real blocks, skip examples.
function extractAsn1(lines) {
  const blocks = [];
  const warnings = [];
  let exampleBlocks = 0;
  let inExample = false;
  let cur = null;
  for (const rawLine of lines) {
    const line = normalizeLine(rawLine);
    if (START_LINE.test(line)) {
      if (/\/(bad\s+)?example/.test(line)) {
        if (inExample) warnings.push('example START inside example (unexpected)');
        inExample = true;
        exampleBlocks += 1;
      } else {
        if (inExample) {
          warnings.push(`real ASN1START swallowed by unterminated example block: ${line.trim()}`);
          inExample = false;
        }
        if (cur) warnings.push(`nested real ASN1START (previous unclosed): ${line.trim()}`);
        cur = [line];
      }
      continue;
    }
    if (STOP_LINE.test(line)) {
      if (inExample) {
        inExample = false;
        continue;
      }
      if (cur) {
        cur.push(line);
        blocks.push(cur.join('\n'));
        cur = null;
      }
      continue;
    }
    if (inExample) continue;
    if (cur) cur.push(line);
  }
  if (cur) warnings.push(`unbalanced ASN1START: block not closed (${(cur[0] || '').trim()})`);
  return { text: blocks.join('\n'), blocks, exampleBlocks, warnings };
}

// Full pipeline: document.xml string → { text, blocks, exampleBlocks, warnings, lineCount }.
function extractFromDocumentXml(xml) {
  const warnings = [];
  const textboxHits = (xml.match(/<w:txbxContent/g) || []).length;
  if (textboxHits) warnings.push(`${textboxHits} textbox content block(s) stripped`);
  const paras = paragraphsFromXml(xml);
  const lines = paras.flatMap((p) => p.split('\n'));
  const res = extractAsn1(lines);
  return {
    text: res.text,
    blocks: res.blocks,
    exampleBlocks: res.exampleBlocks,
    warnings: [...warnings, ...res.warnings],
    lineCount: lines.length,
  };
}

// ==== tools/docxtables.js ====
// docxtables.js — M4：3GPP NAS 规范（24.501/24.301）docx 的 Word 表格结构化抽取。
//
// NAS 的 IE 定义不是 ASN.1 而是 Word 表格：位布局表（bit ruler 行 8..1 + octet 行，
// 字段位宽由 gridSpan 编码，网格密度因表而异：每 bit 1 或 2 格）与消息内容表
// （IEI | Information Element | Type/Reference | Presence | Format | Length）。
// 本模块只做结构抽取与表格识别，语义建库（NAS schema）在 tools/nasdef.mjs。
//
// 形态实证：24501-i70.docx word/document.xml（53MB 单行，539 表 / 10221 行）。
// 关键坑：`<w:tr` 会前缀误匹配 `<w:trPr>`、`<w:tc` 误匹配 `<w:tcPr>` —— 一律
// `(?=[\s/>])` 词边界。

// 与 docxasn1.js 相同的 XML 实体解码（此处复制小函数保持两工具独立可测）。
function unescapeXml(s) {
  return s.replace(/&(?:#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, (ent) => {
    switch (ent) {
      case '&lt;': return '<';
      case '&gt;': return '>';
      case '&quot;': return '"';
      case '&apos;': return "'";
      case '&amp;': return '&';
      default: {
        const m = /^&#x([0-9a-fA-F]+);$/.exec(ent) || /^&#([0-9]+);$/.exec(ent);
        return m ? String.fromCodePoint(parseInt(m[1], m[2] !== undefined ? 16 : 10)) : ent;
      }
    }
  });
}

// 段落/表格片段 → 纯文本。textbox 内容剥离；保留 w:t/w:tab/w:br/noBreakHyphen 顺序。
const RUN_TOKEN =
  /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\b[^>]*\/?>|<w:br\b[^>]*\/?>|<w:noBreakHyphen\b[^>]*\/?>/g;

function runText(frag) {
  const stripped = frag.replace(/<w:txbxContent>[\s\S]*?<\/w:txbxContent>/g, '');
  let out = '';
  let m;
  RUN_TOKEN.lastIndex = 0;
  while ((m = RUN_TOKEN.exec(stripped)) !== null) {
    if (m[1] !== undefined) out += unescapeXml(m[1]);
    else if (/^<w:tab/.test(m[0])) out += ' ';
    else if (/^<w:br/.test(m[0])) out += '\n';
    else out += '-';
  }
  return normalizeChars(out);
}

// Word 排版字符归一化（24.008 docx 实证）：分数字符 ½ → 1/2（否则 VH 行判定失配、
// len 列被当可变吞尾）；en/em dash → '-'（len 区间与类型表通配列）；不间断空格 → ' '；
// 弯引号 → 直引号。ASCII 内容 no-op（24501/24301 产物逐字节回归保证）。
function normalizeChars(s) {
  return s
    .replace(/[\u00a0\u2007\u202f]/g, ' ')
    .replace(/[\u00bd]/g, '1/2')
    .replace(/[\u2010-\u2015]/g, '-')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"');
}

const normWs = (s) => s.replace(/[ \t]+/g, ' ').trim();

// 片段内顶层 <w:p> 拆分（深度感知），返回各段落的 XML 片段。自闭合空段产生 ''。
function splitParagraphs(frag) {
  const out = [];
  const TOKEN = /<w:p(?=[\s/>])[^>]*\/?>|<\/w:p>/g;
  let depth = 0;
  let start = -1;
  let m;
  while ((m = TOKEN.exec(frag)) !== null) {
    if (m[0] === '</w:p>') {
      depth -= 1;
      if (depth === 0 && start >= 0) {
        out.push(frag.slice(start, m.index));
        start = -1;
      }
      if (depth < 0) depth = 0;
    } else if (m[0].endsWith('/>')) {
      if (depth === 0) out.push('');
    } else {
      depth += 1;
      if (depth === 1) start = m.index + m[0].length;
    }
  }
  return out;
}

// 单元格 → 文本：各段落一行，\n 连接（octet 标签 'octet 3'+'octet n' 依赖换行区分区间）。
function cellText(frag) {
  return splitParagraphs(frag)
    .map((p) => normWs(runText(p)))
    .filter((s) => s !== '')
    .join('\n');
}

// 文档流扫描：<w:body> 顶层按序产出段落项与表格项。
// 段落项 { kind:'p', style, text }；表格项 { kind:'table', heading, paras, rows, xml }。
// heading = 最近一个 Heading* 样式段落 { style, text }；paras = 表前最多 3 个非空段文本。
// styleMap：styleId → 规范样式名（.doc 转换的 docx 样式 ID 是数字，需 styles.xml 映射）。
function flowFromXml(xml, styleMap = {}) {
  const items = [];
  const sm = (s) => styleMap[s] || s;
  // flow 模式：w:p 深度扫描（textbox 内嵌套 p 抵消，同 docxasn1）；
  // tbl 模式：只数 w:tbl 嵌套深度，忽略内部 w:p。
  const TOKEN = /<w:p(?=[\s/>])[^>]*\/?>|<\/w:p>|<w:tbl(?=[\s/>])[^>]*\/?>|<\/w:tbl>/g;
  let mode = 'flow';
  let tblDepth = 0;
  let tblStart = -1;
  let pDepth = 0;
  let pStart = -1;
  let lastHeading = null;
  const lastParas = [];
  let m;
  const emitP = (frag) => {
    const styleM = /<w:pStyle w:val="([^"]+)"/.exec(frag.slice(0, 4000));
    const style = styleM ? sm(styleM[1]) : '';
    const text = normWs(runText(frag));
    if (/^Heading\d$/.test(style) && text) lastHeading = { style, text };
    if (text && !/^Heading\d$/.test(style)) {
      lastParas.push(text);
      if (lastParas.length > 3) lastParas.shift();
    }
    items.push({ kind: 'p', style, text });
  };
  const emitTbl = (frag) => {
    items.push({
      kind: 'table',
      heading: lastHeading ? { ...lastHeading } : null,
      paras: [...lastParas],
      rows: tableRows(frag),
    });
  };
  while ((m = TOKEN.exec(xml)) !== null) {
    const tok = m[0];
    if (mode === 'flow') {
      if (tok.startsWith('<w:tbl')) {
        mode = 'tbl';
        tblDepth = 1;
        tblStart = m.index + tok.length;
      } else if (tok === '</w:p>') {
        pDepth -= 1;
        if (pDepth === 0 && pStart >= 0) {
          emitP(xml.slice(pStart, m.index));
          pStart = -1;
        }
        if (pDepth < 0) pDepth = 0;
      } else if (tok.endsWith('/>')) {
        // 自闭合空段
        emitP('');
      } else {
        pDepth += 1;
        if (pDepth === 1) pStart = m.index + tok.length;
        else if (pDepth === 2) {
          const close = xml.indexOf('</w:p>', TOKEN.lastIndex);
          TOKEN.lastIndex = close < 0 ? TOKEN.lastIndex : close + 6;
          pDepth = 1;
        }
      }
    } else {
      // tbl 模式：嵌套表格计数（w:tbl 内部的 w:p 全部忽略）
      if (tok.startsWith('<w:tbl')) tblDepth += 1;
      else if (tok === '</w:tbl>') {
        tblDepth -= 1;
        if (tblDepth === 0) {
          emitTbl(xml.slice(tblStart, m.index));
          mode = 'flow';
        }
      }
    }
  }
  return items;
}

// 表格 XML → 行数组：每行 [{ span, text, vMerge }]（gridSpan 默认 1；
// vMerge: 'restart' | 'cont' | null —— NAS 规范用纵向合并画跨多 octet 字段）。
// `(?=[\s/>])` 边界防止 <w:trPr>/<w:tcPr> 被当成行/列。
function tableRows(tblXml) {
  const rows = [];
  const TR = /<w:tr(?=[\s/>])[^>]*\/?>|<\/w:tr>/g;
  let m;
  let trDepth = 0;
  let trStart = -1;
  const closeRow = (endIdx) => {
    const rowXml = tblXml.slice(trStart, endIdx);
    const cells = [];
    const TC = /<w:tc(?=[\s/>])[^>]*\/?>|<\/w:tc>/g;
    let tcDepth = 0;
    let tcStart = -1;
    let c;
    while ((c = TC.exec(rowXml)) !== null) {
      if (c[0] === '</w:tc>') {
        tcDepth -= 1;
        if (tcDepth === 0) {
          const frag = rowXml.slice(tcStart, c.index);
          const spanM = /<w:gridSpan w:val="(\d+)"/.exec(frag);
          const vM = /<w:vMerge(?:\s+w:val="(\w+)")?\s*\/>/.exec(frag);
          cells.push({
            span: spanM ? parseInt(spanM[1], 10) : 1,
            text: cellText(frag),
            vMerge: vM ? (vM[1] === 'restart' ? 'restart' : 'cont') : null,
          });
        }
      } else if (!c[0].endsWith('/>')) {
        tcDepth += 1;
        if (tcDepth === 1) tcStart = c.index + c[0].length;
      }
    }
    rows.push(cells);
  };
  while ((m = TR.exec(tblXml)) !== null) {
    if (m[0] === '</w:tr>') {
      trDepth -= 1;
      if (trDepth === 0) {
        closeRow(m.index);
        trStart = -1;
      }
    } else if (!m[0].endsWith('/>')) {
      trDepth += 1;
      if (trDepth === 1) trStart = m.index + m[0].length;
    }
  }
  return rows;
}

// vMerge 物化：cont 单元格继承同列位（按 span 累计定位）上方最近 restart 单元格的文本。
// 返回新行数组（不改输入）。
function resolveVMerge(rows) {
  const colText = new Map(); // colStart → { text }
  return rows.map((row) => {
    let col = 0;
    const out = row.map((c) => {
      const start = col;
      col += c.span;
      if (c.vMerge === 'restart') {
        if (c.text) colText.set(start, { text: c.text });
        return { ...c };
      }
      if (c.vMerge === 'cont') {
        const inh = colText.get(start);
        return { ...c, text: inh ? inh.text : c.text };
      }
      return { ...c };
    });
    return out;
  });
}

const OCTET_LINE = /^octets?\s?(\d+[a-z]?|n)(?:\s?-\s?(\d+[a-z]?|n))?\*?$/i;

// octet 标签（可能多行：'octet 3' + 'octet 6' = 跨 3..6 的 4 octet；'octet 3'+'octet n' = 开区间；
// 也支持单行区间写法 'octets 3-n'）。
// 返回 { label, count, optional, open }；非 octet 标签返回 null。
// count = 标签声明的八位组数（开区间不计尾端）；open = 开区间（长度可变尾段）。
function parseOctetLabel(text) {
  const lines = text.split('\n').filter(Boolean);
  if (!lines.length || !lines.every((l) => OCTET_LINE.test(l))) return null;
  const optional = lines.some((l) => l.endsWith('*'));
  if (lines.length === 1) {
    const m = OCTET_LINE.exec(lines[0]);
    if (m[2]) {
      if (m[1] === 'n' || m[2] === 'n') return { label: `${m[1]}-${m[2]}`, count: 1, optional, open: true };
      const a = parseInt(m[1], 10);
      const b = parseInt(m[2], 10);
      if (isNaN(a) || isNaN(b) || b < a) return { label: `${m[1]}-${m[2]}`, count: 1, optional, open: false };
      return { label: `${m[1]}-${m[2]}`, count: b - a + 1, optional, open: false };
    }
    return { label: m[1], count: 1, optional, open: m[1] === 'n' };
  }
  // 两行区间：两端都是数字 → 闭区间；含 'n' → 开区间（count=1，长度可变）
  const m0 = OCTET_LINE.exec(lines[0]);
  const m1 = OCTET_LINE.exec(lines[1]);
  const a = m0[1];
  const b = m1[1];
  if (a === 'n' || b === 'n') return { label: `${a}-${b}`, count: 1, optional, open: true };
  const na = parseInt(a, 10);
  const nb = parseInt(b, 10);
  if (isNaN(na) || isNaN(nb) || nb < na) return { label: `${a}-${b}`, count: 1, optional, open: false };
  return { label: `${a}-${b}`, count: nb - na + 1, optional, open: false };
}

// 位布局表识别与解析：首行含按序 8..1（整八位组）或 4..1（半八位组）ruler。
// 返回 { octets:[{octet, count, half?, fields:[{name,bits,hi,lo,pre?}]}], warnings }，非位表格返回 null。
// 位宽双路径（v1.9）：
//   ruler 数字格等宽（24.501/24301 全部、24.008 大半）→ 比例法（v1.5 原算法，位=span×8/Σ，
//   产物逐字节不变）；ruler 数字格跨列不均（24.008 figure 式位图，'5','3' 等占 2 格）→
//   数字格相交计数法（v1.13）：字段格映射为与其相交的数字格集合，起点允许落在跨列数字格
//   内部（10.5.5.1 '5' 加宽实证），末位压格沿用 v1.9 容差。加宽区列宽会膨胀 → 行位宽合计
//   不合时整行跳过（诚实拒绝），正确位号由建库侧值域表锚点走查恢复（ingest.js correctIes）。
//   两法都做 gutter 裁剪（24.008 10.3.1 等表 ruler 前有空白列）。
// 行 = 一个 octet 区间：标签多行（'octet 3'+'octet 6'）表示跨 count octet 的行（压缩画法
// 位合计=8；全画=8×count）。开区间（'octet n'）count=1、open。
// 无标签行模式（v1.13）：10.5.2.76 Feature Indicator 等半八位组图整表无 'octet n' 标签列
// ——行按序充当 octet 1..n，4 位标尺行带 half:true（值域 = 半八位组，消费端按 nibble 解）。
// 空文本格 = 未标注 spare：记入该 field 的 pre（前导空位），列派生位号在 buildIes 走查时
// 据此回退；图内 0/1 字面值格（10.5.4.3 画值风格）同 spare 处理。
function parseBitTable(rowsRaw) {
  if (!rowsRaw.length) return null;
  const rows = resolveVMerge(rowsRaw);
  const ruler = rows[0];
  const digits = []; // { start, end, span }（grid 前缀和区间，按出现序 = bit8→bit1 或 bit4→bit1）
  let nbits = 0;
  for (let i = 0; i < ruler.length; i++) {
    const s = ruler.slice(0, i).reduce((a, c) => a + c.span, 0);
    const t = ruler[i].text.trim();
    if (!digits.length) {
      // 前导 gutter 列跳过；首个数字格定标尺宽（8..1 整八位组 / 4..1 半八位组）
      if (/^[48]$/.test(t)) {
        nbits = +t;
        digits.push({ start: s, end: s + ruler[i].span, span: ruler[i].span });
      }
      continue;
    }
    if (/^[1-8]$/.test(t) && digits.length < nbits && +t === nbits - digits.length) {
      digits.push({ start: s, end: s + ruler[i].span, span: ruler[i].span });
      if (digits.length === nbits) break;
    } else if (digits.length === nbits) break;
    else return null; // ruler 中断
  }
  if (!nbits || digits.length !== nbits) return null;
  const sum = digits.reduce((a, d) => a + d.span, 0);
  const width = Math.max(...rows.map((r) => r.reduce((s, c) => s + c.span, 0)));
  // 标签列探测：任一数据行末格是 'octet n' → 带标签模式（需标签槽位）；否则无标签行模式
  const hasLabel = rows.slice(1).some((r) => r.length && parseOctetLabel(r[r.length - 1].text));
  if (hasLabel ? sum >= width : sum !== width) return null; // 无槽位 / 标尺未铺满整宽 → 非布局表
  const d0 = digits[0].start;
  const dLast = digits[digits.length - 1].end;
  const uniform = digits.every((d) => d.span === digits[0].span);
  const bitsOf = (s, e) => {
    const s2 = Math.max(s, d0); // gutter 裁剪
    if (e <= s2 || s2 >= dLast) return 0; // 纯空白列 / 标尺区间外
    if (uniform) {
      const b = ((e - s2) * nbits) / sum;
      return Number.isInteger(b) ? b : -1;
    }
    // 非均匀 ruler：相交数字格计数。起点允许落在跨列数字格内部（'5' 加宽实证）；
    // 末位数字跨多列（排版加宽）时字段边界落在其内部也计入——10.5.2.87 RA Type 实证。
    let n = 0;
    let last = null;
    for (const d of digits) {
      if (d.start < e && d.end > s2) { n++; last = d; }
    }
    if (!n) return 0;
    if (last.end === e) return n;
    if (last.span > 1 && last.start < e && e < last.end) return n; // 跨列数字格的边界压格
    return -1;
  };
  const isDocLiteral = (t) => /^[01x]$/.test(t.replace(/\n/g, ' ').trim()); // 画值字面格
  const octets = [];
  const pending = []; // 门禁不过但含命名字段的行：待建库侧值域表锚点走查（v1.13）
  const warnings = [];
  let unlabeledNo = 0;
  for (let ri = 1; ri < rows.length; ri++) {
    const row = rows[ri];
    if (!row.length) continue;
    const last = row[row.length - 1];
    const lab = parseOctetLabel(last.text);
    if (!lab && hasLabel) break; // 带标签表失去标签 → 布局到此为止（松散值段尾巴/图示行）
    unlabeledNo += 1;
    const label = lab ? lab.label : String(unlabeledNo);
    const count = lab ? lab.count : 1;
    const fields = [];
    let acc = 0;
    let off = 0;
    let cellFail = false;
    let pre = 0;
    for (let ci = 0; ci < row.length - (lab ? 1 : 0); ci++) {
      const c = row[ci];
      const bits = bitsOf(off, off + c.span);
      off += c.span;
      if (bits < 0) {
        cellFail = true;
        break;
      }
      const txt = c.text.replace(/\n/g, ' ').trim();
      if (!txt || isDocLiteral(txt)) { pre += bits; acc += bits; continue; }
      fields.push({ name: c.text.replace(/\n/g, ' '), bits, pre });
      pre = 0;
      acc += bits;
    }
    // 行语义：全画（acc = 8×count）或压缩画（acc = 8，跨 count 个布局相同的 octet）；无标签
    // 4 位行 = 半八位组（half）。
    let compressed = false;
    let half = false;
    let frame = null;
    if (!cellFail && acc === 8 * count) frame = 8 * count;
    else if (!cellFail && acc === 8 && count > 1) {
      compressed = true;
      frame = 8;
    } else if (!cellFail && !lab && acc === nbits) {
      frame = nbits;
      half = nbits === 4;
    } else if (lab && lab.count === 1 && row.slice(0, -1).filter((c) => c.text && !isDocLiteral(c.text.replace(/\n/g, ' ').trim())).length === 1) {
      // 行网格与标尺网格不齐（如 10.5.2.82：行内 IEI 单元格跨 9 列 vs 标尺 9 列）——
      // 单字段行按整八位组处理
      const only = row.slice(0, -1).find((c) => c.text && !isDocLiteral(c.text.replace(/\n/g, ' ').trim()));
      fields.length = 0;
      fields.push({ name: only.text.replace(/\n/g, ' '), bits: 8, pre: 0 });
      warnings.push(`octet ${lab.label}: 行网格与标尺不齐，按整八位组单字段处理`);
      frame = 8;
    }
    if (frame != null) {
      // 列派生位号：字段按序自 MSB 游标堆叠（pre = 前导空位）；位号越界（lo<1，加宽区
      // 列宽膨胀恰凑满 acc 的行）→ 不硬解，转挂起
      let okPos = true;
      for (let i = 0, bit = frame; i < fields.length; i++) {
        const f = fields[i];
        bit -= f.pre || 0;
        if (bit - f.bits + 1 < 1) { okPos = false; break; }
        f.hi = bit;
        f.lo = bit - f.bits + 1;
        bit = f.lo - 1;
      }
      if (okPos) {
        for (const f of fields) if (!f.pre) delete f.pre;
        octets.push({
          octet: label + (lab && lab.optional ? '*' : ''),
          count,
          open: (lab && lab.open) || false,
          compressed,
          ...(half ? { half: true } : {}),
          fields,
        });
        continue;
      }
    }
    // 无法对齐的行（加宽区列宽膨胀、位号越界等）：有命名字段的行挂起（_pending），交建库
    // 侧值域表锚点走查恢复；走查不收敛则在建库侧放弃。无字段的行直接跳过。
    if (fields.length) {
      pending.push({
        octet: label + (lab && lab.optional ? '*' : ''),
        count,
        ...(nbits === 4 && !lab ? { half: true } : {}),
        _pending: true,
        fields: fields.map(({ name, bits, pre }) => ({ name, bits, ...(pre ? { pre } : {}) })),
      });
      warnings.push(`octet ${label}: 位宽不合（${cellFail ? '单元格越界' : `acc=${acc}`}），行挂起待锚点走查`);
    } else {
      warnings.push(`octet ${label}: 位宽不合（${cellFail ? '单元格越界' : `acc=${acc}`}），行跳过`);
    }
  }
  if (!octets.length && !pending.length) return null;
  if (pending.length) octets.push(...pending);
  return { octets, warnings };
}

// 消息内容表识别与解析：6 列头。返回 { rows:[{iei,name,ref,presence,format,len}] }，否则 null。
// Type/Reference 单元格是「名称+节号」连写（如 'Message type9.7'），按尾部节号拆分；
// 单元格可含换行（名称段落 + 节号段落，节号可带字母后缀如 '9.9.3.16A'）。
const SECTION_TAIL = /^(.*?)(\d+(?:\.\d+)+[A-Z]?)$/s;

function splitNameRef(text) {
  const m = SECTION_TAIL.exec(text);
  if (!m) return { name: normWs(text.replace(/\n/g, ' ')), ref: null };
  return { name: normWs(m[1].replace(/\n/g, ' ')), ref: m[2] };
}

function parseMessageTable(rowsRaw) {
  let rows = rowsRaw;
  let capText = null;
  // 形态 B：首行是表内 caption（'Table 9.70/3GPP TS 24.008: SETUP message content …'，
  // 24.008 新版排版把表题合并进表格首行，跨列单格）→ 剥离并上交（ingest 侧作 caption 兜底）
  if (rows.length > 1) {
    const ne = rows[0].filter((c) => normWs(c.text));
    if (ne.length === 1 && /^Table\s+\d/.test(ne[0].text.trim())) {
      capText = normWs(ne[0].text);
      rows = rows.slice(1);
    }
  }
  if (!rows.length) return null;
  const head = rows[0].map((c) => normWs(c.text).toLowerCase());
  // 'type' 而非 'type/reference'：i20 个别表头被截断成 'Type/'（9.5.22 Activate MBMS
  // Context Request），数据行不受影响——只认列位。
  const want = ['iei', 'information element', 'type', 'presence', 'format', 'length'];
  const alt = ['iei', 'information element', 'type', 'reference', 'presence', 'format', 'length'];
  let cols = null;
  let trJoin = false; // 7 列变体：Type 与 Reference 是两个相邻单元格，需拼接
  let gsm = false; // GSM 变体：IE 名取自 Information element 列（Type/Reference 列是 'Clause 8.2.2' 引用）
  if (head.length === want.length && want.every((w, i) => head[i].includes(w))) {
    cols = ['iei', 'information element', 'typeref', 'presence', 'format', 'length'];
  } else if (head.length === alt.length && alt.every((w, i) => head[i].includes(w))) {
    // type/reference 拆两列的变体：合并 2、3 列处理
    cols = ['iei', 'information element', 'typeref', 'typeref', 'presence', 'format', 'length'];
    trJoin = true;
  } else if (head.length === 6
    && head[0].length <= 3
    && head[1].includes('information element')
    && head[2].includes('reference')
    && head[3].includes('presence')
    && head[4].includes('format')
    && head[5].includes('length')) {
    // 24.011 消息表头形态：首列表头为空（RP-ACK 等带 IEI 的表写 'IEI'，长度同判），
    // 第 3 列表头是 'Reference'（无 'Type/' 前缀）。
    cols = ['iei', 'information element', 'typeref', 'presence', 'format', 'length'];
    gsm = true;
  }
  if (!cols) return null;
  const col = {};
  cols.forEach((c, i) => { if (!(c in col)) col[c] = i; });
  const out = [];
  for (let ri = 1; ri < rows.length; ri++) {
    const r = rows[ri];
    if (!r.length) continue;
    const g = (c) => (col[c] !== undefined && r[col[c]] ? r[col[c]].text : '');
    const tr = trJoin ? normWs(g('typeref') + (r[col.typeref + 1] ? r[col.typeref + 1].text : '')) : g('typeref');
    let name;
    let ref;
    if (gsm) {
      // GSM 变体：IE 名在 Information element 列；Reference 列是 'Clause 8.2.2' / 'Subclause
      // 8.1.4.1'（本规范节号）或 '3GPP TS 24.007'（跨规范引用 → ref 置空，防误挂节号）
      name = normWs(g('information element').replace(/\n/g, ' '));
      const rm = /TS\s*\d{2}\.\d{3}/i.test(tr) ? null : SECTION_TAIL.exec(tr);
      ref = rm ? rm[2] : null;
    } else {
      ({ name, ref } = splitNameRef(tr));
    }
    out.push({ iei: g('iei'), name, ref, presence: g('presence'), format: g('format'), len: g('length') });
  }
  return capText ? { rows: out, capText } : { rows: out };
}

// 23.040 TPDU 参数表识别与解析：表头 ['Abbr.','Reference','P1)','R2)','Description']
// （表示法列表头有 'R2)'/'P2)' 两种排版，第 4 列恒为表示法；'Abbr'/'Abbr.' 两写）。
// 返回行 [{ iei:'', name:<abbr>, ref:<全称>, presence, format:<表示法>, len:<表示法> }]，
// 表示法原文留给 buildSchema23040 翻译（'b'/'2b'/'o'/'7o'/'I'/'2-12o'/'o/7o'/脚注）。
function parseSmsElementsTable(rowsRaw) {
  if (!rowsRaw.length) return null;
  const head = rowsRaw[0].map((c) => normWs(c.text).toLowerCase().replace(/\s*\d+\)\s*$/, '').trim());
  if (!(head[0] === 'abbr' || head[0] === 'abbr.') || !head[1].includes('reference')) return null;
  const pIdx = head.findIndex((h, i) => i >= 2 && /^p/.test(h));
  if (pIdx < 0) return null;
  let rIdx = head.findIndex((h, i) => i >= 2 && i !== pIdx && /^r/.test(h));
  if (rIdx < 0) {
    rIdx = pIdx + 1; // 'P2)' 排版变体：表示法列紧跟 presence 列
    if (!head[rIdx] || head[rIdx].includes('description')) return null;
  }
  const out = [];
  for (let ri = 1; ri < rowsRaw.length; ri++) {
    const r = rowsRaw[ri];
    if (!r.length) continue;
    const cell = (i) => (r[i] ? r[i].text : '');
    const name = normWs(cell(0).replace(/\n/g, ' '));
    if (!name) continue;
    const presence = normWs(cell(pIdx).split('\n')[0]);
    const repr = normWs(cell(rIdx).split('\n')[0]);
    out.push({ iei: '', name, ref: normWs(cell(1).replace(/\n/g, ' ')), presence, format: repr, len: repr });
  }
  return out.length ? out : null;
}

// ---- 29.274 GTPv2-C（v1.15.0）------------------------------------------------------
// IE 位布局表（gutter 形，parseBitTable 不识别）：首列空 gutter + 'Octets' 标号列 + 数字
// 标尺 8..1 + 尾列空 gutter；数据行 = gutter + octet 标号（'1'/'2 to3'/'7 to 11'/
// '27 to (n+4)'，字母标号 'a to a+6' 跳过）+ 位段格（gridSpan 跨位）。octet 1-4 是 TLIV
// 头（Type/Length/Spare+Instance，codec 自管）不入布局；'(n+4)' 开区间行 → open 吞尾。
// 产出与 parseBitTable 同构的 octets/fields。
function parseGtpIeTable(rowsRaw) {
  if (!rowsRaw.length) return null;
  const rows = resolveVMerge(rowsRaw);
  let rulerI = -1;
  let digits = []; // 位格列区间（按 8→1 序）
  let labelStart = 0; // octet 标号列起点
  for (let i = 0; i < rows.length && rulerI < 0; i++) {
    const r = rows[i];
    let col = 0;
    let octI = -1;
    for (let k = 0; k < r.length; k++) {
      const s = col;
      col += r[k].span;
      if (normWs(r[k].text) === 'Octets') { octI = k; labelStart = s; break; }
    }
    if (octI < 0) continue;
    const ds = [];
    let col2 = col;
    let expect = 8;
    for (let k = octI + 1; k < r.length && expect > 0; k++) {
      if (+normWs(r[k].text) === expect) {
        ds.push({ start: col2, end: col2 + r[k].span });
        col2 += r[k].span;
        expect--;
      } else break;
    }
    if (ds.length === 8 && expect === 0) { rulerI = i; digits = ds; }
  }
  if (rulerI < 0) return null;
  const bitHi = digits[0].start;
  const bitEnd = digits[digits.length - 1].end;
  const inBits = (s, e) => s >= bitHi && e <= bitEnd;
  const octets = [];
  const notes = [];
  for (let i = rulerI + 1; i < rows.length; i++) {
    const r = rows[i];
    let col = 0;
    let label = null;
    const fields = []; // {cellStart, cellEnd, text}
    for (const c of r) {
      const s = col;
      const e = s + c.span;
      col = e;
      if (s < labelStart && label === null) continue; // 前导 gutter（无跨入标号列的格）
      if (s === labelStart || (label === null && s < digits[0].start)) { label = normWs(c.text); continue; }
      if (inBits(s, e) && normWs(c.text)) fields.push({ start: s, end: e, text: normWs(c.text) });
    }
    if (!label) continue;
    const lm = /^(\d+)\s*(?:to\s*(?:\(?\s*n\s*\+\s*(\d+)\s*\)?|(\d+))|-(\d+))?/i.exec(label);
    if (!lm) { if (/[a-d]/i.test(label[0])) notes.push(`octet ${label}: 字母标号行跳过`); continue; }
    const first = +lm[1];
    const open = /\(n\s*\+/i.test(label);
    const last = open ? null : (lm[2] != null ? first + (+lm[2]) : lm[3] != null ? +lm[3] : lm[4] != null ? +lm[4] : first);
    const count = open ? null : last - first + 1;
    if (first <= 4 && (open || last <= 4)) continue; // octet 1-4 = TLIV 头（Type/Length/Instance），codec 自管
    if (!fields.length) continue;
    if (open) {
      octets.push({ octet: `${first}-n*`, count: 1, open: true, fields: [{ name: fields[0].text, bits: 8, hi: 8, lo: 1 }] });
    } else if (count > 1) {
      // 跨 N 八位组的单一宽格（'7 to 11' MBR 类）：count 重复单八位组格
      octets.push({ octet: String(first), count, fields: [{ name: fields[0].text, bits: 8, hi: 8, lo: 1 }] });
    } else {
      const fs = [];
      let prevLo = 9;
      for (const f of fields) {
        const di = digits.findIndex((d) => d.start === f.start);
        const de = digits.findIndex((d) => d.end === f.end);
        if (di < 0 || de < 0 || de < di) continue;
        const hi = 8 - di; // digits 按位 8→1 序（左→右），首位 = bit8
        const lo = 8 - de;
        const pre = prevLo - hi - 1;
        prevLo = lo;
        fs.push({ name: f.text, bits: hi - lo + 1, hi, lo, ...(pre > 0 ? { pre } : {}) });
      }
      if (fs.length) octets.push({ octet: String(first), count: 1, fields: fs });
    }
  }
  if (!octets.length) return null;
  return { octets, ...(notes.length ? { warnings: notes } : {}) };
}

// 29.274 §7.x 消息内容表 / 分组 IE 内容表：5 列头（Information elements | P |
// Condition / Comment | IE Type | Ins.）。分组 IE 定义表带 TLI 预置行（'Octet 1' +
// '<名> IE Type = 93 (decimal)'）——预置行在头行之前。返回 { groupName(null=消息表),
// rows(头行后的原文行) }；非内容表返回 null。
function parseGtpMsgRows(rowsRaw) {
  if (!rowsRaw.length) return null;
  const rows = resolveVMerge(rowsRaw);
  const texts = rows.map((r) => r.map((c) => normWs(c.text)));
  let groupName = null;
  let hi = -1;
  for (let i = 0; i < texts.length; i++) {
    const r = texts[i];
    const tm = r.map((c) => /(.+?)\s*IE Type\s*=\s*(\d+)\s*\(decimal\)/i.exec(c)).find(Boolean);
    if (tm && i < 8) { groupName = tm[1].replace(/^octet\s*1[\s,:-]*/i, '').trim(); continue; }
    if (r.length >= 4 && r.some((c) => /information element/i.test(c)) && r.some((c) => /^IE type$/i.test(c)) && r.some((c) => /^ins\b/i.test(c))) { hi = i; break; }
    if (i > 8) break;
  }
  if (hi < 0) return null;
  return { groupName, rows: texts.slice(hi + 1) };
}

// ==== src/nas/docxzip.js ====
// docxzip.js — 零依赖 ZIP 读取器（docx 即 zip）。
// 只做「读」：中央目录解析 + stored/deflate 解压（DecompressionStream('deflate-raw')），
// CRC32 全量校验（损坏早暴露）。不支持写入、zip64（>4GB docx 不存在）、加密条目。
// 浏览器（Chrome ≥103）与 Node ≥18 均有 DecompressionStream；缺失时报错并明说。

function zipIsZip(bytes) {
  if (bytes.length < 4) return false;
  // PK\x03\x04 本地头 / PK\x05\x06 空包 EOCD
  return (bytes[0] === 0x50 && bytes[1] === 0x4b && (bytes[2] === 3 || bytes[2] === 5));
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function u16(b, o) { return b[o] | (b[o + 1] << 8); }
function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

// 条目名解码：一般 ASCII；UTF-8 标志位（0x800）按 UTF-8，否则 latin1（docx 内部路径永远 ASCII，兜底即可）
function decodeName(raw, flags) {
  if (flags & 0x800) return new TextDecoder('utf-8').decode(raw);
  let s = '';
  for (const b of raw) s += String.fromCharCode(b);
  return s;
}

async function zipEntries(bytes) {
  if (typeof DecompressionStream === 'undefined')
    throw new Error('此环境无 DecompressionStream（需 Chrome ≥103 / Node ≥18）');
  // EOCD：从尾部找 PK\x05\x06（注释 ≤65535 字节）
  let eocd = -1;
  const lo = Math.max(0, bytes.length - 22 - 65535);
  for (let i = bytes.length - 22; i >= lo; i--) {
    if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 5 && bytes[i + 3] === 6) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 zip（未找到 EOCD）——请给官方 .zip 或 .docx 文件');
  const count = u16(bytes, eocd + 10);
  const cdOff = u32(bytes, eocd + 16);
  const commentLen = u16(bytes, eocd + 20);
  if (cdOff === 0xffffffff || count === 0xffff) throw new Error('不支持的 zip64（文件 >4GB？）');
  let off = cdOff;
  const entries = [];
  for (let n = 0; n < count; n++) {
    if (u32(bytes, off) !== 0x02014b50) throw new Error(`中央目录条目 ${n} 魔数不符（zip 损坏？）`);
    const flags = u16(bytes, off + 8);
    const method = u16(bytes, off + 10);
    const crc = u32(bytes, off + 16);
    const csize = u32(bytes, off + 20);
    const usize = u32(bytes, off + 24);
    const nameLen = u16(bytes, off + 28);
    const extraLen = u16(bytes, off + 30);
    const commentLen = u16(bytes, off + 32);
    const lho = u32(bytes, off + 42);
    const name = decodeName(bytes.subarray(off + 46, off + 46 + nameLen), flags);
    if (u32(bytes, lho) !== 0x04034b50) throw new Error(`条目 ${name} 本地头魔数不符`);
    const lNameLen = u16(bytes, lho + 26);
    const lExtraLen = u16(bytes, lho + 28);
    const dataOff = lho + 30 + lNameLen + lExtraLen;
    if (flags & 0x1) throw new Error(`条目 ${name} 已加密，不支持`);
    // 流式 zip 的 data descriptor（flag 0x8）无需特殊处理：长度/CRC 全信中央目录，
    // 数据按 csize 精确切取，描述符自然落在切片外（3GPP 官方包即此形态）
    if (method !== 0 && method !== 8) throw new Error(`条目 ${name} 压缩方法 ${method} 不支持`);
    if (usize >= 0xffffffff || csize >= 0xffffffff) throw new Error('zip64 条目不支持');
    const cdata = bytes.subarray(dataOff, dataOff + csize);
    entries.push({
      name,
      dir: name.endsWith('/'),
      async read() {
        let data;
        if (method === 0) {
          data = cdata.slice();
        } else {
          const ds = new DecompressionStream('deflate-raw');
          const blob = new Blob([cdata]);
          const buf = await new Response(blob.stream().pipeThrough(ds)).arrayBuffer();
          data = new Uint8Array(buf);
        }
        if (data.length !== usize) throw new Error(`条目 ${name} 解压后长度 ${data.length} ≠ ${usize}`);
        if (crc32(data) !== crc) throw new Error(`条目 ${name} CRC 校验失败（zip 损坏）`);
        return data;
      },
    });
    off += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

// 便捷：解包整个 docx（zip）→ { name: Uint8Array }（目录条目跳过）
async function zipUnpack(bytes) {
  const out = {};
  for (const e of await zipEntries(bytes)) {
    if (!e.dir) out[e.name] = await e.read();
  }
  return out;
}

const td = new TextDecoder('utf-8');
function bytesToUtf8(b) { return td.decode(b); }

// ==== src/nas/tlv.js ====
// src/nas/tlv.js — M4：TS 24.007 §11 信息元素格式框架（T/V/TV/TV1/LV/TLV/LV-E/TLV-E）。
//
// NAS 不是 ASN.1：编码规则 = 24.007 的 TLV 家族 + 各 IE 规范表格的逐 bit 定义。
// 本模块只管「格式框架」：IEI/长度/值的字节排布；值内部的 bit 语义由 schema
// （tools/nasdef.mjs 从规范表格重建）驱动，在 src/nas/codec.js。
//
// 字节序与位序（24.007 §11.1/11.2）：
//   - 多字节字段高字节在前（big-endian）；
//   - octet 内 bit 8 在前（MSB first）；
//   - 半八位组字段：编号低的高半八位组在前（如 type 1 IE：IEI bit8-5，值 bit4-1）；
//   - 长度：type 4 = 1 字节值字节数；type 6（LV-E/TLV-E）= 2 字节大端。
// IEI 取值：全八位组 IEI（type 2/3/4/6）0x00-0xff；半八位组 IEI（type 1）0-14（0xf 保留）。

// 值的统一内部形式：字节数组 Uint8Array/number[]。OCT(hex) 便于测试与调用方。
function OCT(hex) {
  const clean = hex.replace(/\s+/g, '');
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}

const H = (bytes) =>
  (bytes instanceof Uint8Array ? Array.from(bytes) : bytes)
    .map((b) => b.toString(16).padStart(2, '0')).join('');

// 半八位组打包：type 1 IE 的 (iei<<4)|value。
// 24.501 的半八位组 IEI 用满 0-15（F = SMS indication / Release assistance /
// Allowed SSC mode 等，与 24.007 的 '1111 保留' 不同），故上限取 15。
function encHalf(iei, value) {
  if (iei < 0 || iei > 15) throw new Error(`TV1 IEI 越界 (0-15): ${iei}`);
  if (value < 0 || value > 15) throw new Error(`TV1 值越界 (0-15): ${value}`);
  return (iei << 4) | value;
}

// 半八位组行序列 → 字节流（TS 24.007 §11.2.1：先出现者占低半；奇数尾行占低半、高半补 0）。
// 供独立半八位组序列打包用；消息内 VH 行的配对由 codec.planVhRun 处理。
function packHalfOctets() {
  const nibbles = [];
  return {
    push(n) {
      if (n < 0 || n > 15) throw new Error(`半八位组越界: ${n}`);
      nibbles.push(n);
    },
    bytes() {
      const out = new Uint8Array(Math.ceil(nibbles.length / 2));
      for (let i = 0; i < nibbles.length; i++) {
        if (i % 2 === 0) out[i >> 1] |= nibbles[i] & 0x0f; // 低半
        else out[i >> 1] |= (nibbles[i] & 0x0f) << 4; // 高半
      }
      return out;
    },
  };
}

const isBytes = (v) => v instanceof Uint8Array || (Array.isArray(v) && v.every((x) => typeof x === 'number'));

// 格式框架编码。val：字节序列（T 为 null；TV1 为 0-15 数值）。
// 返回 Uint8Array。
function encIE(format, iei, val) {
  switch (format) {
    case 'V':
      return Uint8Array.from(val);
    case 'T':
      return Uint8Array.of(iei);
    case 'TV':
      return Uint8Array.of(iei, ...val);
    case 'TV1':
      return Uint8Array.of(encHalf(iei, val));
    case 'LV':
    case 'LV-E': {
      if (!isBytes(val)) throw new Error('LV 值必须是字节序列');
      const e = format === 'LV-E';
      const len = val.length;
      if (!e && len > 255) throw new Error(`LV 长度溢出: ${len}`);
      if (e && len > 65535) throw new Error(`LV-E 长度溢出: ${len}`);
      return e ? Uint8Array.of((len >> 8) & 0xff, len & 0xff, ...val) : Uint8Array.of(len, ...val);
    }
    case 'TLV':
    case 'TLV-E': {
      if (!isBytes(val)) throw new Error('TLV 值必须是字节序列');
      const e = format === 'TLV-E';
      const len = val.length;
      if (!e && len > 255) throw new Error(`TLV 长度溢出: ${len}`);
      if (e && len > 65535) throw new Error(`TLV-E 长度溢出: ${len}`);
      return e
        ? Uint8Array.of(iei, (len >> 8) & 0xff, len & 0xff, ...val)
        : Uint8Array.of(iei, len, ...val);
    }
    default:
      throw new Error(`未知 IE 格式: ${format}`);
  }
}

// 格式框架解码。bytes/offset → { value, next }。
// TV1 返回半八位组数值（含 IEI 可由调用方按 (b>>4) 提取）。
function decIE(format, iei, bytes, off = 0) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  const need = (n, what) => {
    if (off + n > u8.length) throw new Error(`IE 截断（${what} 需要 ${n} 字节，余 ${u8.length - off}）`);
  };
  switch (format) {
    case 'V':
      return { value: u8.slice(off), next: u8.length }; // 定长 V 的裁剪由调用方按 IE 定义处理
    case 'T': {
      need(1, 'T');
      return { value: null, next: off + 1 };
    }
    case 'TV1': {
      need(1, 'TV1');
      return { value: u8[off] & 0x0f, next: off + 1 };
    }
    case 'TV': {
      need(1, 'TV IEI');
      // TV 值定长：由 IE 定义给出；这里返回剩余全部，调用方裁剪。
      return { value: u8.slice(off + 1), next: u8.length };
    }
    case 'LV':
    case 'LV-E': {
      const e = format === 'LV-E';
      need(e ? 2 : 1, '长度');
      const len = e ? (u8[off] << 8) | u8[off + 1] : u8[off];
      const hlen = e ? 2 : 1;
      need(hlen + len, 'LV 值');
      return { value: u8.slice(off + hlen, off + hlen + len), next: off + hlen + len };
    }
    case 'TLV':
    case 'TLV-E': {
      const e = format === 'TLV-E';
      need(e ? 3 : 2, 'IEI+长度');
      const len = e ? (u8[off + 1] << 8) | u8[off + 2] : u8[off + 1];
      const hlen = e ? 3 : 2;
      need(hlen + len, 'TLV 值');
      return { value: u8.slice(off + hlen, off + hlen + len), next: off + hlen + len };
    }
    default:
      throw new Error(`未知 IE 格式: ${format}`);
  }
}

// ==== src/nas/csn1.js ====
// csn1.js — CSN.1 位级运行时：AST（tools/csn1parse.js 产物）→ 解码树 + 编码回放。
// 记法权威：TS 24.007 Annex B；L/H = 填充位值/另一值（GSM 全零填充 → L='0'、H='1'）。
// 关键解码策略：
//   - 截断假定（44.018 'truncation … bits "L" assumed'）：越界读按 L(0) 假定并告警一次
//   - <spare padding> 吞到区域尾（接收方任意位可接受），编码按 GSM 填充八位组 0x2B 补齐
//   - 外部结构引用（44.060 等）→ Csn1External：部分解码 + 原始尾位保留（诚实降级）
//   - choice 判别折叠：候选支前导固定终端（0/1/L/H/null）即判别位；null 支仅在位耗尽时选中
// trace 形态（编码回放序）：{d,kind,...}
//   fixed {bits} ｜ field {name,bits,value} ｜ choice {alt} ｜ mark {name,value}（零位记录）
//   spare {bits} ｜ pad {start} ｜ rep {n} ｜ bitstring {name,value(hex)} ｜ ext {name,bits}

class Csn1External extends Error {
  constructor(name) {
    super('外部结构引用: ' + name);
    this.name = 'Csn1External';
    this.extName = name;
  }
}

// ---------- 位读取 ----------
class Csn1BitReader {
  constructor(bytes, bitOff = 0, areaBits = (bytes.length * 8) - bitOff) {
    this.bytes = bytes;
    this.pos = bitOff;
    this.end = bitOff + areaBits; // 区域位界（消息尾即区域尾）
    this.truncated = false;
  }
  get left() { return this.end - this.pos; }
  get exhausted() { return this.pos >= this.end; }
  readBit() {
    if (this.pos >= this.end) {
      this.truncated = true;
      return 0; // 截断假定：缺失位按 L(0)
    }
    const byte = this.bytes[this.pos >> 3];
    const bit = (byte >> (7 - (this.pos & 7))) & 1;
    this.pos++;
    return bit;
  }
  peekBit() {
    if (this.pos >= this.end) return null; // 无位可窥（区别于截断假定）
    return (this.bytes[this.pos >> 3] >> (7 - (this.pos & 7))) & 1;
  }
  readBits(n) {
    let v = 0;
    for (let k = 0; k < n; k++) v = v * 2 + this.readBit();
    return v; // ≤53 位精确（VSTK_RAND 36 / TLLI 32 均覆盖）
  }
  readBitsStr(n) {
    let s = '';
    for (let k = 0; k < n; k++) s += this.readBit();
    return s;
  }
}

// ---------- 值表达式（A2：val(Name) 与 + - * /） ----------
function evalExpr(e, scope) {
  if (e == null) return 0;
  if (e.t === 'num') return e.v;
  if (e.t === 'val') {
    const v = scope.get(String(e.name || '').replace(/\s+/g, ' ').trim().toLowerCase());
    if (v == null) throw new Csn1External('val(' + e.name + ')');
    return v;
  }
  if (e.t === 'bin') {
    const a = evalExpr(e.a, scope);
    const b = evalExpr(e.b, scope);
    switch (e.op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b ? Math.floor(a / b) : 0;
      default: throw new Error('未知运算符 ' + e.op);
    }
  }
  throw new Error('表达式不可求值');
}
function countOf(n, scope) {
  if (n == null) return 1;
  if (n.k === 'num') return n.v;
  return evalExpr(n.e, scope);
}

// ---------- 解码 ----------
// defs: Map(normName → body AST)；areaBytes 为 rest octets 区域字节数（编码回填用）
function csn1Decode(defs, root, bytes, { bitOff = 0, areaBytes = bytes.length - (bitOff >> 3) } = {}) {
  const warnings = [];
  const trace = [];
  const scope = new Map(); // 字段值 val() 查找表（名字归一）
  const r = new Csn1BitReader(bytes, bitOff, areaBytes * 8);
  let extHit = null;
  let depth = 0;

  const warn = (m) => { if (warnings.length < 40 && !warnings.includes(m)) warnings.push(m); };
