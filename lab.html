    if (i + 1 + l > u8.length) throw new Error('APN 编码截断');
    let ok = true;
    let s = '';
    for (let k = 0; k < l; k++) {
      const c = u8[i + 1 + k];
      if (c < 0x21 || c > 0x7e) { ok = false; break; }
      s += String.fromCharCode(c);
    }
    if (!ok) throw new Error('APN 标签含非法字节');
    labels.push(s);
    i += 1 + l;
  }
  return labels.join('.');
}

// ---- PLMN（MCC/MNC 半八位组交换） ----------------------------------------------
// MCC=460 MNC=00 → 64 F0 00：octet1 = mcc2<<4|mcc1；octet2 = mnc3<<4|mcc3；octet3 = mnc2<<4|mnc1
// 两位 MNC 时 mnc3 = 0xF。
function plmnEncode(mcc, mnc) {
  const mc = String(mcc);
  const mn = String(mnc);
  if (!/^\d{3}$/.test(mc)) throw new Error(`MCC 须 3 位数字: ${mcc}`);
  if (!/^\d{2,3}$/.test(mn)) throw new Error(`MNC 须 2-3 位数字: ${mnc}`);
  const d = (s, i) => parseInt(s[i], 10);
  const f = (n) => (n == null ? 0x0f : n);
  const mnc3 = mn.length === 3 ? d(mn, 2) : null;
  return Uint8Array.of(
    (d(mc, 1) << 4) | d(mc, 0),
    (f(mnc3) << 4) | d(mc, 2),
    (d(mn, 1) << 4) | d(mn, 0)
  );
}

function plmnDecode(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  if (u8.length < 3) throw new Error('PLMN 须 3 八位组');
  const dig = (n) => (n <= 9 ? String(n) : n === 0x0f ? '' : `?${n.toString(16)}?`);
  const mcc = dig(u8[0] & 0x0f) + dig(u8[0] >> 4) + dig(u8[1] & 0x0f);
  const mnc = dig(u8[2] & 0x0f) + dig(u8[2] >> 4) + dig(u8[1] >> 4);
  return { mcc, mnc: mnc.replace(/F$/i, '') || mnc };
}

// ---- BCD 数字串（身份类 IE 数字域） --------------------------------------------
// nibble 序 0-9 为数字，0xF 为填充（跳过）；其它值报告为 <hex>。
function bcdDecode(bytes, { skipFiller = true } = {}) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  let out = '';
  for (const b of u8) {
    for (const n of [b & 0x0f, b >> 4]) {
      if (n <= 9) out += String(n);
      else if (n === 0x0f && skipFiller) continue;
      else out += `<${n.toString(16)}>`;
    }
  }
  return out;
}

function bcdEncode(digits) {
  const s = String(digits).replace(/\s+/g, '');
  if (!/^\d*(F\d*)*$/i.test(s)) throw new Error(`BCD 含非数字: ${digits}`);
  const nib = [...s].map((c) => (c.toUpperCase() === 'F' ? 0x0f : parseInt(c, 10)));
  if (nib.length % 2) nib.push(0x0f);
  const out = new Uint8Array(nib.length / 2);
  for (let i = 0; i < nib.length; i += 2) out[i >> 1] = nib[i] | (nib[i + 1] << 4);
  return out;
}

// ---- SMS（23.040 TPDU / 23.038 字母表）------------------------------------------
// GSM 7-bit 默认字母表（23.038 §6.2.1，0x00-0x7F）与扩展表（0x1B 转义）。
const GSM7_ALPHABET = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞ\x1bÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà';
// 扩展表（0x1B 转义后跟的 septet）：10=FF、20=^、40/41/47/60/61/62/64=印刷符号、101=€
// （23.038 §6.2.1.1.1；13=CR2、27=SS2 两个控制项按 pycrate TS23038 十二项表对齐，
//  以最接近的 ASCII 控制符渲染）。审核修正：0x0a 原误写 '\n'，应为换页 FF '\x0c'。
const GSM7_EXT = { 0x0a: '\x0c', 0x0d: '\r', 0x14: '^', 0x1b: '\x1b', 0x28: '{', 0x29: '}', 0x2f: '\\', 0x3c: '[', 0x3d: '~', 0x3e: ']', 0x40: '|', 0x65: '€' };

// 7 位打包解包：bitOffset 起按 7 位一个字符连续取 septets 个（UDH 时数据从
// (1+UDHL)*8 + 填充位 起——填充使 (1+UDHL)*8+fill 为 7 的倍数）。
function gsm7Unpack(bytes, septets, bitOffset = 0) {
  const u8 = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes ?? []);
  let bit = bitOffset;
  let out = '';
  let ext = false;
  for (let i = 0; i < septets; i++) {
    const b0 = u8[bit >> 3] ?? 0;
    const b1 = u8[(bit >> 3) + 1] ?? 0;
    const shift = bit & 7;
    const v = ((b0 >> shift) | (b1 << (8 - shift))) & 0x7f;
    bit += 7;
    if (ext) {
      out += GSM7_EXT[v] ?? '';
      ext = false;
      continue;
    }
    if (v === 0x1b) {
      ext = true;
      continue;
    }
    out += GSM7_ALPHABET[v] ?? String.fromCharCode(v);
  }
  return out;
}

// TP-User Data 语义解码（23.038 §4 TP-DCS 编码组按高 4 位选择字母表；组语义与
// pycrate TS23038 SMS_DCS 十二组对照）：组 0-3 通用数据编码 + 组 4-7 自动删除组
//   ——字母表位 3-2（00=7bit 01=8bit 10=UCS2 11=保留），组 2/3/6/7 = 压缩（23.042，
//   不可明文解）；组 12/13 消息等待（丢弃/存储）= 默认字母表，字母表位 1/3 = 保留；
//   组 14 = UCS2；组 15 数据编码/消息类 = 字母表位 3-2；组 8-11 保留。
// udhi = octet1 的 TP-UDHI 位（0x40）；udl = TP-User-Data-Length 行值。
// 返回 { alphabet, text }；text 为 null 表示该编码组不可机读（保留/压缩）。
function smsTpUdText({ ud, udl = null, dcs = 0, udhi = false }) {
  const u8 = ud instanceof Uint8Array ? ud : Uint8Array.from(ud ?? []);
  const grp = dcs >> 4;
  const cs = (dcs >> 2) & 0x03;
  let alpha = null; // 0=7bit 1=8bit 2=UCS2
  if (grp <= 7) alpha = cs;
  else if (grp === 12 || grp === 13) alpha = cs === 0 || cs === 2 ? 0 : null;
  else if (grp === 14) alpha = 2;
  else if (grp === 15) alpha = cs;
  if (alpha === 3 || alpha == null) return { alphabet: 'unknown', text: null };
  const compressed = grp <= 7 && !!(grp & 0x02); // 组 2/3/6/7：压缩
  if (compressed) return { alphabet: ((alpha === 2 ? 'UCS2' : alpha === 1 ? '8bit' : 'GSM 7-bit') + '（压缩）'), text: null };
  if (alpha === 2) {
    let t = '';
    for (let i = 0; i + 1 < u8.length; i += 2) t += String.fromCharCode((u8[i] << 8) | u8[i + 1]); // UTF-16BE
    return { alphabet: 'UCS2', text: t };
  }
  if (alpha === 1) return { alphabet: '8bit', text: null };
  // 7-bit：UDL 计 septets（含 UDH 头）；UDH 时数据从头部后的 septet 边界起。
  // UDL 超出可用数据（截断帧/缺省怪帧）→ 按可解数截断并注记，不输出填充垃圾。
  if (udhi) {
    const hdr = 1 + (u8[0] ?? 0);
    const fill = (7 - (hdr % 7)) % 7;
    const hdrSeptets = Math.ceil((hdr * 8) / 7);
    const want = Math.max(0, (udl ?? hdrSeptets + u8.length) - hdrSeptets);
    const avail = Math.max(0, Math.floor((u8.length * 8 - (hdr * 8 + fill)) / 7));
    const text = gsm7Unpack(u8, Math.min(want, avail), hdr * 8 + fill);
    return { alphabet: 'GSM 7-bit', text, truncated: want > avail ? avail : undefined };
  }
  const want = udl ?? Math.floor((u8.length * 8) / 7);
  const avail = Math.floor((u8.length * 8) / 7);
  const text = gsm7Unpack(u8, Math.min(want, avail));
  return { alphabet: 'GSM 7-bit', text, truncated: want > avail ? avail : undefined };
}

// TP-OA/TP-DA/TP-RA 地址行解码：[有效半八位组数][TOA][数字 BCD]。
function smsAddrDecode(value) {
  const u8 = value instanceof Uint8Array ? value : Uint8Array.from(value ?? []);
  if (u8.length < 2) throw new Error('TP 地址须 ≥2 八位组');
  const n = u8[0];
  const toa = u8[1];
  const digits = bcdDecode(u8.slice(2)).slice(0, n);
  const ton = (toa >> 4) & 0x07;
  const prefix = ton === 1 ? '+' : '';
  return { number: prefix + digits, ton, npi: toa & 0x0f };
}

// TP-SCTS/TP-DT 时间戳：7 个半八位组交换十进制 YY MM DD HH MM SS + 时区。
// 时区（§9.2.3.11，与 24.008 §10.5.3.8 同一定义）：半八位组表示——高半 = 个位、
// 低 3 位 = 十位、bit3 = 代数符号（0 正 1 负），值为刻钟数。规范锚点：英国夏令时
// （+1h=4 刻钟）= 01000000 (0x40)；+8h = 32 刻钟 = 0x23。审核注：pycrate TS23040 的
// TimeZone 模型按十六进制 nibble（+8h→0x02）与此不符，以规范文本为准（见偏差台账）。
function smsSctsDecode(value) {
  const u8 = value instanceof Uint8Array ? value : Uint8Array.from(value ?? []);
  if (u8.length < 7) throw new Error('TP 时间戳须 7 八位组');
  const d = (b) => `${b & 0x0f}${b >> 4}`;
  const tz = u8[6];
  const quarters = (tz >> 4) + (tz & 0x07) * 10;
  const sign = tz & 0x08 ? '-' : '+';
  return `20${d(u8[0])}-${d(u8[1])}-${d(u8[2])} ${d(u8[3])}:${d(u8[4])}:${d(u8[5])} GMT${sign}${quarters / 4}`;
}

// 23.040 消息级语义摘要（解码树的汇总行）：从 parts 里找 MTI/DCS/UDL/UD/PI 行算 TP-UD 原文。
// 返回字符串数组（无 SMS 语义时为空）。
function smsMsgSemantics(parts) {
  const find = (re) => parts.find((p) => re.test(p.row.name || ''));
  const mti = find(/TP-Message Type Indicator/i);
  const udRow = find(/^TP-UD$|TP-PI bit gated/i);
  if (!mti || !udRow || udRow.value == null || !(udRow.value instanceof Uint8Array) || !udRow.value.length) return [];
  const oct1 = mti.value instanceof Uint8Array ? mti.value[0] : mti.value;
  const udhi = !!(Number(oct1) & 0x40);
  const dcsRow = find(/^TP-DCS$/);
  const udlRow = find(/^TP-UDL$/);
  let dcs = dcsRow && dcsRow.value instanceof Uint8Array ? dcsRow.value[0] : 0;
  let udl = udlRow && udlRow.value instanceof Uint8Array ? udlRow.value[0] : null;
  let udBytes = udRow.value;
  // 门控尾行（TP-PI bit gated）时 UD 藏在 [PI][PID?][DCS?][UDL?][UD] 串里——按 PI 位取段。
  // §9.2.3.27：ext 位（bit7）=1 → 另一 PI 八位组紧随其后；TP-PID/DCS/UDL 参数位定义在
  // 第一 PI 八位组（后续 PI 的参数位当前规范版本未定义）——跳过 ext 链后按首 PI 位取段。
  if (/TP-PI bit gated/i.test(udRow.row.name || '')) {
    const v = udRow.value;
    const pi0 = v[0] ?? 0;
    let off = 1;
    let pi = pi0;
    while (pi & 0x80) {
      pi = v[off] ?? 0;
      off += 1;
    }
    if (pi0 & 0x01) off += 1; // TP-PID
    if (pi0 & 0x02) {
      if (dcsRow == null) dcs = v[off];
      off += 1;
    }
    if (!(pi0 & 0x04)) return []; // TP-UD 不在
    udl = v[off];
    off += 1;
    udBytes = v.slice(off);
  }
  const { alphabet, text, truncated } = smsTpUdText({ ud: udBytes, udl, dcs, udhi });
  if (text == null || !text.length) return [];
  return [`TP-UD（${alphabet}）：${JSON.stringify(text)}${truncated != null ? `（UDL 声明超出可用数据，仅解出前 ${truncated} 字符）` : ''}`];
}

// 44.018 L2 Pseudo Length 语义校验（§10.5.2.19）：值 = 消息中按 T/V/TV/LV/TLV 格式化的
// 八位组数（Rest Octets 除外），且八位组低两位恒 '01'。仅对 CCCH/BCCH 头形态（mtOff=2）
// 的实例有意义；BCCH 上的 SI 消息规范允许 MS 忽略该值——一律返回提示串而非报错。
// 返回字符串数组（无校验意义时为空）。
function l2plCheck(inst, frameBytes, parts) {
  if (!inst || inst.mtOff !== 2) return [];
  const u8 = frameBytes instanceof Uint8Array ? frameBytes : Uint8Array.from(frameBytes ?? []);
  if (!u8.length) return [];
  const o1 = u8[0];
  const out = [];
  if ((o1 & 0x03) !== 0x01) out.push(`L2 Pseudo Length 低两位 = 0b${(o1 & 0x03).toString(2).padStart(2, '0')} ≠ 01`);
  const value = o1 >> 2;
  let restBytes = 0;
  for (const p of parts || []) {
    if (/rest octets/i.test(p.row.name || '') && p.value instanceof Uint8Array) restBytes += p.value.length;
  }
  const formatted = u8.length - 1 - restBytes;
  if (value !== formatted) {
    out.push(`L2 Pseudo Length 值 ${value} ≠ 格式化八位组数 ${formatted}（总长 ${u8.length} − L2PL 1 − Rest Octets ${restBytes}）`);
  } else {
    out.push(`L2 Pseudo Length 值 ${value} = 格式化八位组数 ✓（Rest Octets ${restBytes} 字节不计）`);
  }
  return out;
}

// ==== src/nas/crypto.js ====
// crypto.js — NAS 完整性/机密性算法层（clean-room，锚定规范测试向量）。
//
// 来源规范（本地归档 algo35 文档 + sage_*.pdf）：
//   SHA-256:  FIPS 180-4；HMAC: RFC 2104（向量 RFC 4231）
//   KDF:      TS 33.220 Annex B.2.0（= HMAC-SHA256(KEY, S)）
//   NAS 密钥: TS 33.501 A.8（FC=0x69, KEY=K_AMF）/ TS 33.401 A.7（FC=0x15, KEY=K_ASME）
//   SNOW 3G:  TS 35.202/35.215 SAGE spec v1.1（UEA2/UIA2 核心）
//   UEA2/UIA2: SAGE Document 1 v2.1 §3.4/§4.4（EEA1/NIA1 = f8/f9，EIA1 fresh=bearer<<27）
//   AES-CMAC: RFC 4493（EIA2/NIA2 按 33.401 B.2.3 拼输入）
//   AES-CTR:  SP 800-38A（EEA2/NEA2 按 33.401 B.1.3 构造计数器）
//   ZUC:      TS 35.222 SAGE ZUC spec v1.6；EEA3/EIA3 按 TS 35.221/33.401 B.1.4/B.2.4
// NAS 帧的 MAC 覆盖域与 COUNT/BEARER/DIRECTION 约定见 nasMacFrame()（24.501 §4.4.3.3
// octet 7..n；24.301 §4.4.3.3 octets 6..n；33.501 §6.4.3.1 BEARER=连接号；33.401 §8.1.1 BEARER=0）。



// ---- SHA-256 ------------------------------------------------------------------
const K256 = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,

const addM = (a, b) => { const c = a + b; return (c & 0x7fffffff) + (c >>> 31); };

const zucRot = (a, k) => ((a << k) | (a >>> (32 - k))) >>> 0;

function zucKeystream(key, iv, nBytes) {
  const S = new Array(16), F = [0, 0];
  const mk31 = (a, b, c) => (((a << 23) | (b << 8) | c) & 0x7fffffff);
  for (let i = 0; i < 16; i++) S[i] = mk31(key[i], ZUC_D[i], iv[i]);
  const brc = () => ({
    x0: (((S[15] & 0x7fff8000) << 1) | (S[14] & 0xffff)) >>> 0,
    x1: (((S[11] & 0xffff) << 16) | (S[9] >>> 15)) >>> 0,
    x2: (((S[7] & 0xffff) << 16) | (S[5] >>> 15)) >>> 0,
    x3: (((S[2] & 0xffff) << 16) | (S[0] >>> 15)) >>> 0,
  });
  const fStep = (x) => {
    const W = ((x.x0 ^ F[0]) + F[1]) >>> 0;
    const W1 = (F[0] + x.x1) >>> 0;
    const W2 = (F[1] ^ x.x2) >>> 0;
    const u = (((W1 << 16) | (W2 >>> 16)) >>> 0);
    const v = (((W2 << 16) | (W1 >>> 16)) >>> 0);
    const L1 = u ^ zucRot(u, 2) ^ zucRot(u, 10) ^ zucRot(u, 18) ^ zucRot(u, 24);
    const L2 = v ^ zucRot(v, 8) ^ zucRot(v, 14) ^ zucRot(v, 22) ^ zucRot(v, 30);
    F[0] = ((ZUC_S0[(L1 >>> 24) & 0xff] << 24) | (ZUC_S1[(L1 >>> 16) & 0xff] << 16) | (ZUC_S0[(L1 >>> 8) & 0xff] << 8) | ZUC_S1[L1 & 0xff]) >>> 0;
    F[1] = ((ZUC_S0[(L2 >>> 24) & 0xff] << 24) | (ZUC_S1[(L2 >>> 16) & 0xff] << 16) | (ZUC_S0[(L2 >>> 8) & 0xff] << 8) | ZUC_S1[L2 & 0xff]) >>> 0;
    return W;
  };
  const lfsrInit = (uW) => {
    let f = S[0];
    f = addM(f, mulByPow2(S[0], 8));
    f = addM(f, mulByPow2(S[4], 20));
    f = addM(f, mulByPow2(S[10], 21));
    f = addM(f, mulByPow2(S[13], 17));
    f = addM(f, mulByPow2(S[15], 15));
    f = addM(f, uW & 0x7fffffff);
    for (let i = 0; i < 15; i++) S[i] = S[i + 1];
    S[15] = f;
  };
  const lfsrWork = () => {
    let f = S[0];
    f = addM(f, mulByPow2(S[0], 8));
    f = addM(f, mulByPow2(S[4], 20));
    f = addM(f, mulByPow2(S[10], 21));
    f = addM(f, mulByPow2(S[13], 17));
    f = addM(f, mulByPow2(S[15], 15));
    for (let i = 0; i < 15; i++) S[i] = S[i + 1];
    S[15] = f;
  };
  for (let i = 0; i < 32; i++) { const x = brc(); const w = fStep(x); lfsrInit(w >>> 1); }
  const out = new Uint8Array(nBytes);
  const odv = new DataView(out.buffer);
  { const x = brc(); fStep(x); lfsrWork(); }
  let t = 0;
  while (t * 4 < nBytes) {
    const x = brc();
    const w = (fStep(x) ^ x.x3) >>> 0;
    if (t * 4 + 4 <= nBytes) odv.setUint32(t * 4, w);
    else {
      const rem = nBytes - t * 4;
      for (let i = 0; i < rem; i++) out[t * 4 + i] = (w >>> (24 - 8 * i)) & 0xff;
    }
    t++;
    lfsrWork();
  }
  return out;
}

// ---- EEA/EIA 族（含 5G NEA/NIA 同构别名）---------------------------------------
// 全部按 33.401 Annex B 构造；count 为 32 位（NAS 侧 = 0x00 || NAS COUNT，见 nasCount32）。
// bearer：5 位；dir：0=上行 1=下行；data 字节串；bitLen 可选（非整字节消息）。

// u32 数组视图：字节 ↔ 大端字
function wordsToBytes(words) {
  const out = new Uint8Array(words.length * 4);
  const dv = new DataView(out.buffer);
  words.forEach((w, i) => dv.setUint32(i * 4, w >>> 0));
  return out;
}

function eea0() { return null; } // 由调用方按原样透传（零 keystream = 不变）

const tailMask = (rem) => (rem ? (0x100 - (1 << (8 - rem))) & 0xff : 0); // 保留高位 rem 位（f8 语义 256-(1<<lastbits)）
// f8/f9（SAGE doc1 参考码）装载密钥时字序反转：K[3-i] = BE(key 字 i)。核心测试集（doc2/pysnow 路径）不反转。
function keyWordsReversed(key) {
  const out = new Uint8Array(16);
  for (let i = 0; i < 4; i++) out.set(key.subarray(i * 4, i * 4 + 4), (3 - i) * 4);
  return out;
}
// 输出超出 bitLen 的位全部清零（EEA3 参考码按 32 位字边界清；截到 ceil(bl/8) 字节后等价于此）
function maskTailBits(out, bl) {
  const total = out.length * 8;
  for (let bit = bl; bit < total; bit++) out[bit >> 3] &= ~(0x80 >> (bit & 7)) & 0xff;
  return out;
}

function eea1(key, count, bearer, dir, data, bitLen) {
  const u8 = data instanceof Uint8Array ? data : Uint8Array.from(data);
  const bl = bitLen == null ? u8.length * 8 : bitLen;
  const nBytes = Math.ceil(bl / 8);
  const padded = u8.subarray(0, nBytes);
  const b = (((bearer & 0x1f) << 27) | ((dir & 1) << 26)) >>> 0;
  const iv = wordsToBytes([b, count >>> 0, b, count >>> 0]); // IV0=b,IV1=count,IV2=b,IV3=count（参考 f8）
  const ks = snow3gKeystream(keyWordsReversed(key), iv, nBytes);
  const out = new Uint8Array(nBytes);
  for (let i = 0; i < nBytes; i++) out[i] = padded[i] ^ ks[i];
  return maskTailBits(out, bl);
}

// UIA2/EIA1/NIA1：f9，GF(2^64) 求值 + 5 个 keystream 字。freshForEia1 = bearer << 27。
function snow3gMac(key, count, fresh, dir, data, bitLen) {
  const u8 = data instanceof Uint8Array ? data : Uint8Array.from(data);
  const bl = bitLen == null ? u8.length * 8 : bitLen;
  const ivW = [
    (fresh ^ ((dir & 1) << 15)) >>> 0,
    (count ^ ((dir & 1) << 31)) >>> 0,
    fresh >>> 0,
    count >>> 0,
  ];
  const z = toWords(snow3gKeystream(keyWordsReversed(key), wordsToBytes(ivW), 20)); // 5 字
  const P = (BigInt(z[0] >>> 0) << 32n) | BigInt(z[1] >>> 0);
  const Q = (BigInt(z[2] >>> 0) << 32n) | BigInt(z[3] >>> 0);
  const C = 0x1bn;
  const mul64 = (V, p) => {
    let res = 0n;
    for (let i = 0n; i < 64n; i++) {
      if ((p >> i) & 1n) {
        let t = V;
        for (let j = 0n; j < i; j++) t = (t & (1n << 63n)) ? ((t << 1n) ^ C) & 0xffffffffffffffffn : (t << 1n) & 0xffffffffffffffffn;
        res ^= t;
      }
    }
    return res;
  };
  const D = bl % 64 === 0 ? (bl >> 6) + 1 : (bl >> 6) + 2;
  const padded = new Uint8Array((D - 1) * 8);
  padded.set(u8.subarray(0, Math.min(u8.length, padded.length)));
  let EVAL = 0n;
  for (let i = 0; i < D - 2; i++) {
    let v = 0n;
    for (let j = 0; j < 8; j++) v = (v << 8n) | BigInt(padded[8 * i + j]);
    EVAL = mul64(EVAL ^ v, P);
  }
  // 块 D-2：剩余位（整字节 + 部分字节掩码）
  let rem = bl % 64;
  if (rem === 0) rem = 64;
  let MD2 = 0n;
  let i = 0;
  while (rem > 7) {
    MD2 |= BigInt(padded[8 * (D - 2) + i]) << BigInt(8 * (7 - i));
    rem -= 8;
    i++;
  }
  if (rem > 0) {
    const mask = (0xff ^ ((1 << (8 - rem)) - 1)) & 0xff;
    MD2 |= BigInt(padded[8 * (D - 2) + i] & mask) << BigInt(8 * (7 - i));
  }
  EVAL = mul64(EVAL ^ MD2, P);
  EVAL ^= BigInt(bl >>> 0);
  EVAL = mul64(EVAL, Q);
  const out = new Uint8Array(4);
  for (let j = 0; j < 4; j++) out[j] = (Number((EVAL >> BigInt(56 - j * 8)) & 0xffn) ^ ((z[4] >>> (24 - j * 8)) & 0xff)) & 0xff;
  return out;
}

function eia1(key, count, bearer, dir, data, bitLen) {
  return snow3gMac(key, count, (bearer << 27) >>> 0, dir, data, bitLen);
}

function eea2(key, count, bearer, dir, data, bitLen) {
  const u8 = data instanceof Uint8Array ? data : Uint8Array.from(data);
  const bl = bitLen == null ? u8.length * 8 : bitLen;
  const nBytes = Math.ceil(bl / 8);
  const nBlocks = Math.ceil(nBytes / 16) || 1;
  const ks = new Uint8Array(nBlocks * 16);
  const kdv = new DataView(ks.buffer);
  const t1hi = ((count >>> 0) & 0xffffffff);
  const lo = ((bearer & 0x1f) << 27) >>> 0 | ((dir & 1) << 26) >>> 0; // 高 64 位低半：BEARER(5)|DIR(1)|26 零
  for (let i = 0; i < nBlocks; i++) {
    // T1 = COUNT(32) || BEARER(5) || DIR(1) || 0^26 || 64 位计数器（初值 0，标准自增）
    const blk = new Uint8Array(16);
    const dv = new DataView(blk.buffer);
    dv.setUint32(0, t1hi);
    dv.setUint32(4, lo);
    dv.setUint32(8, 0); dv.setUint32(12, i);
    const e = aesEncryptBlock(key, blk);
    ks.set(e, i * 16);
  }
  void kdv;
  const out = new Uint8Array(nBytes);
  for (let i = 0; i < nBytes; i++) out[i] = u8[i] ^ ks[i];
  return maskTailBits(out, bl);
}

// EIA2/NIA2（33.401 B.2.3）：M = COUNT(32) || BEARER(5)|DIR(1)|0^26(32) || MESSAGE → AES-CMAC 取前 4 字节
// （Mlen = 64 + BLENGTH；头部第二字 = bearer<<27 | dir<<26，C.2 官方向量 M 样例印证）
function eia2(key, count, bearer, dir, data, bitLen) {
  const u8 = data instanceof Uint8Array ? data : Uint8Array.from(data);
  const bl = bitLen == null ? u8.length * 8 : bitLen;
  const nBytes = Math.ceil(bl / 8);
  const m = new Uint8Array(8 + nBytes);
  const dv = new DataView(m.buffer);
  dv.setUint32(0, count >>> 0);
  dv.setUint32(4, (((bearer & 0x1f) << 27) | ((dir & 1) << 26)) >>> 0);
  m.set(u8.subarray(0, nBytes), 8);
  return cmacBits(key, m, 64 + bl).subarray(0, 4);
}

function eea3(key, count, bearer, dir, data, bitLen) {
  const u8 = data instanceof Uint8Array ? data : Uint8Array.from(data);
  const bl = bitLen == null ? u8.length * 8 : bitLen;
  const nBytes = Math.ceil(bl / 8);
  const iv = new Uint8Array(16);
  iv[0] = (count >>> 24) & 0xff; iv[1] = (count >>> 16) & 0xff; iv[2] = (count >>> 8) & 0xff; iv[3] = count & 0xff;
  iv[4] = (((bearer << 3) | ((dir & 1) << 2)) & 0xfc) & 0xff;
  iv.set(iv.subarray(0, 8), 8);
  const ks = zucKeystream(key, iv, nBytes);
  const out = new Uint8Array(nBytes);
  for (let i = 0; i < nBytes; i++) out[i] = u8[i] ^ ks[i];
  return maskTailBits(out, bl);
}

// EIA3/NIA3：位级求值。z 需 ceil((bitLen+64)/32) 字。
function eia3(key, count, bearer, dir, data, bitLen) {
  const u8 = data instanceof Uint8Array ? data : Uint8Array.from(data);
  const bl = bitLen == null ? u8.length * 8 : bitLen;
  const iv = new Uint8Array(16);
  iv[0] = (count >>> 24) & 0xff; iv[1] = (count >>> 16) & 0xff; iv[2] = (count >>> 8) & 0xff; iv[3] = count & 0xff;
  iv[4] = ((bearer << 3) & 0xf8) & 0xff;
  iv[8] = ((count >>> 24) & 0xff) ^ ((dir & 1) << 7);
  iv[9] = (count >>> 16) & 0xff; iv[10] = (count >>> 8) & 0xff; iv[11] = count & 0xff;
  iv[12] = iv[4];
  iv[14] = ((dir & 1) << 7) & 0xff;
  const N = bl + 64;
  const L = Math.ceil(N / 32);
  const ksW = toWords(zucKeystream(key, iv, L * 4));
  const getBit = (i) => (u8[i >> 3] & (1 << (7 - (i & 7)))) ? 1 : 0;
  const getWord = (i) => {
    const ti = i % 32;
    if (ti === 0) return ksW[i / 32] >>> 0;
    return (((ksW[Math.floor(i / 32)] << ti) | (ksW[Math.floor(i / 32) + 1] >>> (32 - ti))) >>> 0);
  };
  let T = 0;
  for (let i = 0; i < bl; i++) {
    if (getBit(i)) T = (T ^ getWord(i)) >>> 0;
  }
  T = (T ^ getWord(bl)) >>> 0;
  const mac = (T ^ ksW[L - 1]) >>> 0;
  const out = new Uint8Array(4);
  new DataView(out.buffer).setUint32(0, mac);
  return out;
}

const EIA_BY_ID = [null, eia1, eia2, eia3];
const EEA_BY_ID = [null, eea1, eea2, eea3];

function iaAlgorithm(algId) { return EIA_BY_ID[algId] || null; } // 0 = NIA0/EIA0（零 MAC，不校验）
function eaAlgorithm(algId) { return EEA_BY_ID[algId] || null; }

function macToHex(mac) { return Array.from(mac, (b) => b.toString(16).padStart(2, '0')).join(''); }

// ---- NAS 帧级封装 --------------------------------------------------------------
// COUNT（32 位输入）= 0x00 || NAS OVERFLOW(16) || NAS SQN(8)；count24 入参 = OVERFLOW<<8 | SQN
function nasCount32(count24) { return (count24 & 0xffffff) >>> 0; }

// MAC 输入（MESSAGE）：
//   24.501 安全帧 [EPD,SHT,MAC*4,SEQ,MSG...] → 覆盖 octet 7..n = [SEQ, ...MSG]
//   24.301 安全帧 [PD/SHT,MAC*4,SEQ,MSG...]   → 覆盖 octets 6..n = [SEQ, ...MSG]
// opt.msg 为解码得到的明文（或密文）消息体；seq 为序号字节。
function nasMacInput(seq, msgBytes) {
  const m = msgBytes instanceof Uint8Array ? msgBytes : Uint8Array.from(msgBytes);
  const out = new Uint8Array(1 + m.length);
  out[0] = seq;
  out.set(m, 1);
  return out;
}

// 计算安全帧 MAC。spec: '24501'|'24301'；algId: 0-3；bearer: 5G=NAS 连接号（默认 1），EPS=0。
function nasMac(spec, algId, kNasInt, count24, dir, bearer, seq, msgBytes) {
  if (algId === 0) return new Uint8Array(4); // NIA0/EIA0：全零 MAC，接收端不校验
  const f = iaAlgorithm(algId);
  if (!f) throw new Error(`未知完整性算法号 ${algId}`);
  const inp = nasMacInput(seq, msgBytes);
  return f(kNasInt, nasCount32(count24), bearer, dir, inp, inp.length * 8);
}

// 加解密（keystream 异或，同函数逆）。msg 为待处理字节串。
function nasCipher(spec, algId, kNasEnc, count24, dir, bearer, data) {
  if (algId === 0) return data instanceof Uint8Array ? data.slice() : Uint8Array.from(data);
  const f = eaAlgorithm(algId);
  if (!f) throw new Error(`未知加密算法号 ${algId}`);
  return f(kNasEnc, nasCount32(count24), bearer, dir, data, data.length * 8);
}

// wireshark.js — P1a：Wireshark「导出分组剖析为 JSON」（tshark -T json 同形态）→ NAS PDU 提取与 schema 匹配。
// 纯函数，零依赖（codec/security 的匹配入口经参数传入，避免循环依赖——都已在构建作用域内）。
//
// 真实形态锚点（test/fixtures/ws_real.json，tshark 4.x 生成）：
//   [{ _index, _type, _source: { layers: { frame, eth, ip, sctp, s1ap|ngap, [_ws.malformed] } } }]
//   NAS 字节 = 冒号分隔 hex，藏在深嵌套字段（如 s1ap.NAS_PDU），旁有已剖析的 nas-eps/nas-5gs 子层。
// 提取策略是防御性的：递归走层树，凡键名匹配 /nas[_-]?pdu/i 的 hex 串皆候选，逐个做 schema 匹配。


// 解析 JSON 文本 → 帧数组 [{ idx, time, layers, malformed }]；非数组形态（{packets:[…]}/单帧对象）容忍。
function wsFrames(jsonText) {
  let data;
  try {
    data = JSON.parse(jsonText);
  } catch (e) {
    throw new Error('不是有效的 JSON：' + e.message);
  }
  let arr = Array.isArray(data) ? data : Array.isArray(data?.packets) ? data.packets : [data];
  return arr.map((fr, idx) => {
    const layers = fr?._source?.layers ?? fr?.layers ?? {};
    return {
      idx,
      time: layers.frame?.frame?.time_epoch ?? layers.frame?.['frame.time_epoch'] ?? layers.frame?.time ?? null,
      layers,
      malformed: !!(layers['_ws.malformed'] || layers._ws?.malformed != null),
    };
  });
}

const NAS_PDU_KEY = /nas[_-]?pdu/i;
const HEXISH = /^[0-9a-fA-F][0-9a-fA-F :,.]*$/;

// 深收集 NAS PDU 候选：[{ path, hex }]。只认键名含 nas_pdu 的字符串字段（冒号/空格分隔 hex 均可）。
function wsNasCandidates(layers) {
  const out = [];
  const walk = (o, path) => {
    if (!o || typeof o !== 'object') return;
    for (const [k, v] of Object.entries(o)) {
      const p = path ? `${path}.${k}` : k;
      if (typeof v === 'string') {
        if (NAS_PDU_KEY.test(k) && v.length >= 4 && HEXISH.test(v)) {
          const hex = v.replace(/[^0-9a-fA-F]/g, '');
          if (hex.length >= 4 && hex.length % 2 === 0) out.push({ path: p, hex });
        }
      } else if (v && typeof v === 'object') {
        walk(v, p);
      }
    }
  };
  walk(layers, '');
  return out;
}

function wsHexToBytes(str) {
  const hex = str.replace(/[^0-9a-fA-F]/g, '');
  return OCT(hex);
}

// 平文本 NAS 的 msgType 位置：24.501 = [EPD, SHT/spare, msgType, …]；24.301/24.008/24.080
// = [PD|SHT/TI, msgType, …]；44.018 按实例 mtOff（CCCH 消息头部多 L2 Pseudo Length → 2，
// 其余 1，建库写入）。
function plainMsgType(bytes, spec) {
  return spec === '24501' ? bytes[2] : bytes[1];
}

// msgType 命中：24008/44018 类型表含通配或掩码（msgMask），其余精确比较——与 codec.js 口径一致。
// off 取实例级 mtOff（缺省按 spec 旧口径）。
function typeHit(insts, mt, bytes, spec) {
  return insts.some((i) => {
    if (i.msgType == null) return false;
    const off = i.mtOff ?? (spec === '24501' ? 2 : 1);
    const b = bytes[off];
    if (b == null) return false;
    return i.msgMask != null ? (b & i.msgMask) === (i.msgType & i.msgMask) : b === i.msgType;
  });
}

// 候选字节 → { schemas: [{key, spec, ver, via, names, namesSecure}], best } | null
// schemas: nasState.schemas 形态 { '24501 i70': schema }。不强行全行解码——报告 msgType 命中与结构合法性。
function wsMatchSchema(schemas, bytes, helpers) {
  const { decSec } = helpers;
  const hits = [];
  for (const [key, schema] of Object.entries(schemas || {})) {
    const spec = schema.spec;
    const names = [];
    const namesSecure = [];
    let secInfo = null;
    // 平文本：msgType 派发
    const mt = plainMsgType(bytes, spec);
    if (mt != null) {
      for (const [name, insts] of Object.entries(schema.messages || {})) {
        if (typeHit(insts, mt, bytes, spec)) names.push(name);
      }
    }
    // 安全帧：结构解码（SHT≠0）；可读载荷再按 msgType 派发（不要求全行解码成功）
    try {
      const d = decSec(schema, bytes, spec);
      secInfo = { sht: d.sht, seq: d.seq, readable: d.readable, inner: d.inner ? d.inner.msg : null };
      if (d.inner) namesSecure.push(d.inner.msg);
      if (d.readable && d.payload.length) {
        const smt = plainMsgType(d.payload, spec);
        if (smt != null && !namesSecure.length) {
          for (const [name, insts] of Object.entries(schema.messages || {})) {
            if (typeHit(insts, smt, d.payload, spec)) namesSecure.push(name);
          }
        }
      }
    } catch {
      // 非安全帧形态
    }
    if (names.length || namesSecure.length || secInfo) {
      hits.push({
        key,
        spec,
        ver: schema.version,
        names,
        namesSecure,
        secInfo,
        score: (secInfo?.inner ? 4 : 0) + (names.length ? 2 : 0) + (namesSecure.length ? 2 : 0),
      });
    }
  }
  if (!hits.length) return null;
  hits.sort((a, b) => b.score - a.score);
  return { hits, best: hits[0] };
}

// ==== src/nas/ingest.js ====
// ingest.js — NAS spec docx → 结构化 → schema 的纯函数管线（CLI 与浏览器共用）。
// 来源：tools/nasingest.mjs（单文档分类循环）与 tools/nasdef.mjs（建库器）的纯逻辑搬家——
// CLI 保留壳（目录遍历/文件 IO），核心在此保证「浏览器产物 = CLI 产物逐字节一致」。
// 依赖：docxtables.js（表格抽取，纯 JS）、docxzip.js（zip 读取，浏览器/Node 双端）。


// 标题/表题文本 '9.11.3.1 5GMM capability' → { num, title }
function splitHeading(text) {
  const m = /^((?:\d+|[A-Z])(?:\.\d+)*)\s*(.*)$/.exec(text);
  return m ? { num: m[1], title: m[2] } : { num: null, title: text };
}

// 节号带字母后缀的标题（'9.9.3.0B Additional update type'）——splitHeading 的节号词法
// 不含字母，后缀会被吞进标题（num '9.9.3.0' + title 'B …'，与 9.9.3.0A 撞节号）。
// 24.301 §9.9.3.0A/0B 实证。后缀后必须跟空白，纯数字节号回落 splitHeading。
function splitHeadingSfx(text) {
  const hm = /^\s*((?:\d+\.)+\d+[a-zA-Z])\s+(.*)$/.exec(text);
  if (hm) return { num: hm[1], title: hm[2].trim() };
  return splitHeading(text);
}

// caption 段：'Table 8.2.6.1.1: …'（24.501/24.301）或 'Table 9.2.12/3GPP TS 24.008: …'（24.008）→ 元数据
// 取窗口内最后一个 Table 段（最贴近表格的即本表 caption）——24.080 实证：相邻两表只隔
// 一段说明文字，上一表的 caption 会滞留在 3 段窗口里，取第一个会把 REGISTER MT 的表
// 标成 FACILITY（caption 与内容错位）。
function parseCaption(paras) {
  const cap = (paras || []).filter((p) => /^Table\s/i.test(p)).pop();
  if (!cap) return null;
  // caption 内嵌换行（44.018 9.1.15b 实证 '…HANDOVER\nCOMMAND message content'）→ 拍平再匹配
  const flat = cap.replace(/\s*\n\s*/g, ' ').trim();
  let m = /^Table\s+([\w.]+)\s*:\s*(.+)$/i.exec(flat);
  if (!m) m = /^Table\s+([\w.]+)\/[^:]*:\s*(.+)$/i.exec(flat);
  // 24.008 部分表题无冒号（'Table 9.2.18/3GPP TS 24.008 MM INFORMATION message content'）
  if (!m) m = /^Table\s+([\w.]+)\/\s*3GPP TS [\w.]+\s*:?\s*(.+)$/i.exec(flat);
  // 缺冒号且表号与名称直接连写（44.018 9.1.51 实证 'Table 9.1.51.1EXTENDED MEASUREMENT
  // ORDER message content'）——纯数字节号（小写字母后缀，大写 E 属于名称）+ 大写名称首字母为界
  if (!m) m = /^Table\s+(\d+(?:\.\d+)+[a-z]?)([A-Z].+)$/.exec(flat);
  if (!m) return { caption: cap };
  let name = m[2];
  const kind = /message content/i.test(name) ? 'message' : 'other';
  name = name.replace(/\s*message content.*$/i, '');
  return { caption: cap, tableId: m[1], name, kind };
}

// 样式映射：.doc 转换的 docx 用数字 styleId，需从 styles.xml 解析 heading 名
function styleMapFromStylesXml(stylesXml) {
  const styleMap = {};
  if (!stylesXml) return styleMap;
  for (const m of stylesXml.matchAll(/<w:style [^>]*w:styleId="([^"]+)"[^>]*>([\s\S]*?)<\/w:style>/g)) {
    const nm = /<w:name w:val="([^"]+)"/.exec(m[2]);
    if (nm && /^heading (\d+)$/i.test(nm[1])) styleMap[m[1]] = `Heading${nm[1].match(/\d+/)[0]}`;
  }
  return styleMap;
}

// 单文档分类循环：document.xml → 结构化 {version, spec, sections, bits, msgs, typeTables, stats}
// （字段顺序即 CLI 落盘 JSON 的键序，勿动——nasdef 门禁产物以此比对）
function ingestDocumentXml(xml, styleMap, spec, version) {
  const items = flowFromXml(xml, styleMap);
  const bits = [];
  const msgs = [];
  const typeTables = [];
  const valueTables = [];
  const csn1Tables = [];
  const csn1Lost = []; // v1.43.0 AK P2-3：含 ::= 而无节锚的表（原先静默落空）
  const secProse = new Map();
  let other = 0;
  const sections = [];
  let curH3 = null;
  const hStack = [];
  // 表后题注：本批文档的 Figure 题注排在表的**后面**（flowFromXml 的 paras 是表前段），
  // 于是表 2 拿到表 1 的题注（29.060 7.7.64 实证：2-digit MNC 布局挂 'Figure .2 3-digit'）。
  // 只在紧邻的表后段里取 Figure 题注（遇 Heading/下一表即停），没有才回退表前段。
  const figureAfter = (idx) => {
    for (let j = idx + 1; j < items.length && j <= idx + 3; j++) {
      const x = items[j];
      if (x.kind !== 'p') break;
      if (/^Heading\d$/.test(x.style)) break;
      if (/^Figure\b/i.test(x.text)) return x.text;
      if (/^Table\b/i.test(x.text)) break;
    }
    return null;
  };
  for (let ii = 0; ii < items.length; ii++) {
    const it = items[ii];
    if (it.kind === 'p') {
      // 标题祖先栈（29.244 消息表落在 Heading5 'General' 下，消息名在 Heading4——需要祖先）
      if (/^Heading[1-5]$/.test(it.style) && it.text) {
        const lvl = +it.style.slice(-1);
        const hs = splitHeading(it.text);
        if (hs.num) { hStack[lvl] = { num: hs.num, title: hs.title, style: it.style }; hStack.length = lvl + 1; }
      }
      if (/^Heading[234]$/.test(it.style) && it.text) {
        const sh = splitHeading(it.text);
        const hm = /^\s*((?:\d+\.)+\d+)([a-zA-Z])\s+(.*)$/.exec(it.text);
        if (hm) {
          // splitHeading 吃掉节号字母后缀（'10.5.2.35a'→num '10.5.2.35' + title 'a …'；
          // 大写后缀 24.301 '9.9.3.0B' 同病）——重建
          const fixed = { num: hm[1] + hm[2], title: hm[3].trim(), style: it.style };
          sections.push(fixed);
          curH3 = fixed;
        } else if (sh.num) {
          sections.push({ num: sh.num, title: sh.title, style: it.style });
          curH3 = sh;
        }
      } else if (curH3 && it.text) {
        secProse.set(curH3.num, (secProse.get(curH3.num) || '') + ' ' + it.text);
      }
      continue;
    }
    // 消息类型值表：24.501 §9.7 / 24.301 §9.8 / 24.008 与 44.018 §10.4 / 24.011 §8.1-8.2
    // 一类——原样保留行文本供建库解析。23.040 的 TP-MTI 值是散文（§9.2.3.1），无类型值表。
    // 29.274：§6.1-1 消息类型值表（§6.1 标题段无 Heading 样式，表落在 6.1.0 'Message Type'
    // 标题下）+ §8.1-1 IE 类型值表——节号精确匹配防 6.1.x/8.1.x 子节混入
    if (spec === '29274' && curH3 && /^(6\.1|6\.1\.0|8\.1)$/.test(curH3.num || '')) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    // 29.244：§7.3 消息类型值表 + §8.1.2 IE 类型值表
    if (spec === '29244' && curH3 && /^(7\.3|8\.1\.2)$/.test(curH3.num || '')) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    // 29.060：§7.1 消息类型值表（GTP-C 列）+ §7.7.0 IE 主表（Type 值|Format|名|ref|长度类别|定长）
    if (spec === '29060' && curH3 && /^(7\.1|7\.7\.0)$/.test(curH3.num || '')) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    // 29.281：§5.2.1（节下三表全收——帧格式表/bits 表/扩展头类型值表，建库按列头挑）+
    // §6.1 消息类型值表（GTP-U 列）+ §8.1 IE 类型值表。位表不收：§5.2.2.x/§8.x 布局表
    // 双 gutter 列+数字格 span2 加宽，24 族 parser 两处不兼容；parseGtpIeTable 对 §8.7/8.8
    // 是伪命中（条件散文行 'present only if explicitly specified' 误当字段）——证据入 deviations，
    // 布局建模列专项。
    if (spec === '29281' && curH3 && /^(5\.2\.1|6\.1|8\.1)$/.test(curH3.num || '')) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    const ttRe = spec === '24008' || spec === '44018' ? /^10\.4[a-z]?\b/
      : spec === '24011' ? /^8\.[12]\b/
      : spec === '23040' ? null
      : /^9\.[78]\b/;
    if (ttRe && curH3 && ttRe.test(curH3.num) && /message type/i.test(curH3.title)) {
      typeTables.push({ section: curH3.num, title: curH3.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    // CSN.1 文法表（Rest Octets / Classmark 3，批次D）：含 '::=' 的格原样留存。
    // 节归属优先级：① 根定义名 ↔ 节标题（'<IAR Rest Octets>' ↔ '10.5.2.17 IAR Rest Octets'；
    // 旧节题注会滞留在 paras 里跨节泄漏，题注不可信）；② 题注 'Table 10.5.2.78.1:'（IPA 等
    // 节标题无 Heading 样式且定义名不匹配时）；③ 表 heading。
    if (it.rows.some((r) => r.some((c) => (c.text || '').includes('::=')))) {
      let cells;
      if (spec === '44060') {
        // AX 批（v1.55.0）：44.060 §11/§12 消息文法表为「Rel 版本分片」表——基线文法 +
        // 各 REL 增补行（'| 1 -- Additions for REL-5/6/7…' 续闭包）按行序拼回同一定义；
        // 旧过滤只留含 '::=' 的格 → 增补行全丢、文法括号失衡（11.2.7 单格差 6、整表
        // 82/82 平衡实测——25 项解析失败的 19 项「选择缺 }」病根）。另有 ':: =' 带空格
        // 变体（RLC Entity Struct 实测）被 includes('::=') 误漏。整表行序拼接 + 按定义
        // 起始 '::\s*=' 切分；定义起始前片段归前一定义（UFPS 续体实测落入下一定义格首）。
        // spec 限定防误伤他族池（44018 csn1 面 332/332 锚点依赖现池内容）。
        cells = [];
        let buf = '';
        const flush = () => { if (buf.trim()) cells.push(buf); buf = ''; };
        for (const r of it.rows) {
          for (const c of r) {
            const t = (c.text || '');
            if (!t.trim()) continue;
            // 切分点 = 定义头 '< 名（无冒号）> ::='——V8 零宽匹配在 index 0 时 split 不产
            // 空首段（实测），故用 matchAll 手工切片
            let last = 0;
            for (const m of t.matchAll(/<\s*[^<>:]*?>\s*::\s*=/g)) {
              buf += (buf && !/\n$/.test(buf) ? '\n' : '') + t.slice(last, m.index);
              flush();
              buf = m[0];
              last = m.index + m[0].length;
            }
            buf += (buf && !/\n$/.test(buf) ? '\n' : '') + t.slice(last);
          }
        }
        flush();
        cells = cells.filter((t) => /<\s*[^<>:]*?>\s*::\s*=/.test(t));
      } else {
        cells = it.rows.flat().filter((c) => (c.text || '').includes('::=')).map((c) => c.text);
      }
      // v1.43.0 AK P2-3：段号允许中间带字母后缀（'11.2.5a.1 …'——原正则 \d+\. 不吃 '5a.'，
      // 20 张 ::= 表静默丢弃；候选形态 (?:\d+[a-z]?\.)+ 全族零漂移证后落）
      const hSec = it.heading ? (it.heading.text.match(/^\s*((?:\d+[a-z]?\.)+\d+[a-z]?)\s/) || [])[1] || null : null;
      const capSec = (it.paras || []).map((p) => /^Table\s+(\d+(?:\.\d+)+[a-z]?)\s*\.\s*\d+\s*:/i.exec(p)).find(Boolean);
      let sec = capSec ? capSec[1] : hSec;
      const dm = cells[0] ? /<\s*([^<>:]+?)\s*>\s*::=/.exec(cells[0]) : null;
      if (dm) {
        const dk = dm[1].replace(/\s+/g, '').toLowerCase();
        // 限定 §10.5 IE 定义区——§9 消息区存在同名子标题（9.1.20.4 'IAR Rest Octets' 实测）
        const secByTitle = (sections || []).find((s) => /^10\.5/.test(s.num)
          && (s.title || '').replace(/\s+/g, '').toLowerCase() === dk);
        if (secByTitle) sec = secByTitle.num;
      }
      if (sec) {
        csn1Tables.push({
          section: sec,
          title: (it.heading ? it.heading.text.replace(/^\s*\S+\s+/, '') : '') || (capSec ? it.paras.find((p) => /^Table/i.test(p)) || '' : ''),
          cells,
        });
        continue;
      }
      csn1Lost.push((it.heading ? it.heading.text : '') || (it.paras || []).find((p) => /^Table/i.test(p)) || '(无题注)');
    }
    // 29.244 §8.2.x IE 位布局表（TLV 头 Type 1-2 / Length 3-4，hdrOctets=4）。
    // 非位表节（值语义表/散文）不落 bits——ies 条目由 §8.1.2 类型表补 name/ieType。
    if (spec === '29244' && curH3 && /^8\.2\.\d+[a-z]?$/i.test(curH3.num || '')) {
      const gt = parseGtpIeTable(it.rows, 4);
      if (gt) {
        const cap = (it.paras || []).map((p) => /^Figure\s+([\d.]+-\d+)\s*:/i.exec(p)).find(Boolean);
        bits.push({ section: curH3.num, name: curH3.title, figure: cap ? it.paras.find((p) => /^Figure/i.test(p)) : null, octets: gt.octets, ...(gt.warnings && gt.warnings.length ? { warnings: gt.warnings } : {}) });
      }
      continue;
    }
    // 29.244 §7.x 消息内容表 / 分组 IE 定义表（9 列 + Appl.×5）
    if (spec === '29244') {
      const pm = parsePfcpMsgRows(it.rows);
      if (pm && pm.rows.length) {
        const capText = (it.paras || []).filter((p) => /^Table\s+/i.test(p)).slice(-1)[0] || '';
        const capId = (/^Table\s+([\d.]+-\d+)/i.exec(capText) || [])[1] || null;
        const capTitle = (/^Table\s+[\d.]+-\d+\s*[:.]\s*(.*)$/i.exec(capText) || [])[1] || '';
        // 消息名取最近的「消息节」祖先（Heading5 'General' 下的表仍归属 Heading4 消息）
        let msgH = null;
        for (let lv = hStack.length - 1; lv >= 1; lv--) {
          const h = hStack[lv];
          if (!h) continue;
          if (/^7\.[45]\.\d+(\.\d+)?$/.test(h.num) && !/\bIE\s+(within|in)\b/i.test(h.title) && !/^General$/i.test(h.title)) { msgH = h; break; }
        }
        let groupName = pm.groupName;
        let groupType = pm.groupType;
        if (groupType == null) {
          const gm = /^(.+?)\s+IE\s+(?:within|in)\b/i.exec(capTitle);
          if (gm) groupName = gm[1].trim();
        }
        if (groupType != null || groupName) {
          msgs.push({ section: msgH ? msgH.num : (curH3 ? curH3.num : null), tableId: capId, name: groupName || capTitle, kind: 'grouped', groupName: groupName || capTitle, groupType, applCols: pm.applCols, ...(pm.applNotes ? { applNotes: pm.applNotes } : {}), rows: pm.rows });
          continue;
        }
        if (msgH) {
          msgs.push({ section: msgH.num, tableId: capId, name: msgH.title, kind: 'message', applCols: pm.applCols, ...(pm.applNotes ? { applNotes: pm.applNotes } : {}), rows: pm.rows });
          continue;
        }
      }
      continue;
    }
    // 29.274 §8.x / 29.060 §7.7.x IE 位布局表（gutter 形——parseBitTable 不识别）：布局直出。
    // 29.060 头只占 octet 1（Type），TLV 的 Length 行由 hdrOctets<4 的 Length 行守卫剥除。
    // 节归属用 splitHeadingSfx——字母后缀节号（29.060 '7.7.25A MS Not Reachable Reason' 实证）
    // 被 splitHeading 吞进标题（section '7.7.25' + title 'A …'），布局错挂孤键、本节失明。
    if (spec === '29274') {
      const gt = parseGtpIeTable(it.rows);
      if (gt) {
        const sh = it.heading ? splitHeadingSfx(it.heading.text) : { num: null, title: null };
        bits.push({ section: sh.num, name: sh.title, figure: figureAfter(ii) || it.paras?.find((p) => /^Figure/i.test(p)) || null, octets: gt.octets, ...(gt.warnings && gt.warnings.length ? { warnings: gt.warnings } : {}) });
        continue;
      }
    }
    if (spec === '29060') {
      const gt = parseGtpIeTable(it.rows, 1);
      if (gt) {
        const sh = it.heading ? splitHeadingSfx(it.heading.text) : { num: null, title: null };
        bits.push({ section: sh.num, name: sh.title, figure: figureAfter(ii) || it.paras?.find((p) => /^Figure/i.test(p)) || null, octets: gt.octets, ...(gt.warnings && gt.warnings.length ? { warnings: gt.warnings } : {}) });
        continue;
      }
    }
    const bt = parseBitTable(it.rows);
    if (bt) {
      const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
      bits.push({ section: sh.num, name: sh.title, figure: it.paras?.find((p) => /^Figure/i.test(p)) || null, octets: bt.octets });
      continue;
    }
    // 23.040 TPDU 参数表（Abbr./Reference/P/R/Description）→ 原样入 msgs，行翻译在 buildSchema23040
    if (spec === '23040') {
      const pt = parseSmsElementsTable(it.rows);
      if (pt) {
        const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
        // 同节双变体（RP-ERROR / RP-ACK）靠正文 '(i) … for RP-ERROR' 行区分，后缀进名称
        const variant = (it.paras || []).map((p) => /^\((?:i|ii|iii)+\)\s+.+?\s+for\s+(RP-ACK|RP-ERROR)\s*\.?$/i.exec(p)).find(Boolean);
        // 节号字母后缀（'9.2.2.1a'）被 splitHeading 拆进标题 → 剥小写字母前缀
        const base = (sh.title || '').replace(/^[a-z]\s+/, '').replace(/\s*type\s*$/i, '').trim();
        msgs.push({
          section: sh.num,
          tableId: null,
          name: variant ? `${base} (${variant[1].toUpperCase()})` : base,
          kind: 'message',
          direction: null,
          rows: pt,
        });
        continue;
      }
    }
    // 29.274 §7.x 消息内容表 / 分组 IE 内容表（5 列：Information elements|P|Condition|IE Type|Ins.）
    if (spec === '29274') {
      const gm = parseGtpMsgRows(it.rows);
      if (gm) {
        const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
        msgs.push({
          section: sh.num,
          tableId: null,
          name: gm.groupName || sh.title,
          kind: gm.groupName ? 'grouped' : 'message',
          direction: null,
          groupName: gm.groupName,
          rows: gm.rows,
        });
        continue;
      }
    }
    // 29.060 §7.x / 29.281 §7.x 消息内容表（3 列：IE | Presence | Reference——29.281 的
    // Reference 列实测为空，IE 对应节由建库按名反查 §8.1 类型表）。节号自带字母段
    // （'7.5A.1'——splitHeading 会拆烂），独立重解；消息名取标题余部与 §7.1/§6.1 名列对齐
    if (spec === '29060' || spec === '29281') {
      const gm = parseGtpv1MsgRows(it.rows);
      if (gm) {
        const hm2 = it.heading ? /^\s*((?:\d+[a-zA-Z]?\.)+(?:\d+[a-zA-Z]?)*(?:\.\d+)*[a-zA-Z]?)\s+(.+)$/.exec(it.heading.text) : null;
        msgs.push({ section: hm2 ? hm2[1] : null, tableId: null, name: hm2 ? hm2[2].trim() : null, kind: 'message', direction: null, rows: gm });
        continue;
      }
    }
    const mt = parseMessageTable(it.rows);
    if (mt) {
      const cap = parseCaption(it.paras) || (mt.capText ? parseCaption([mt.capText]) : null);
      const sh = it.heading ? splitHeading(it.heading.text) : { num: null, title: null };
      const dirP = (it.paras || []).find((p) => /^Direction:/i.test(p));
      // 24.011 无 'Direction:' 段——方向在正文 'sent in MSC -> MS direction'（RP 消息按方向
      // 分 MTI 值，解析失手则建库按类型表全方向展开，wire 仍正确）
      let direction = dirP ? dirP.replace(/^Direction:\s*/i, '') : null;
      if (!direction && (spec === '24011' || spec === '23040')) {
        for (const p of it.paras || []) {
          const dm = /\b(MSC|network|mobile station|MS)\s*(?:->|—)\s*(MSC|network|mobile station|MS)\b/i.exec(p);
          if (dm) {
            const side = (s) => /^msc$|^network$/i.test(s) ? 'network' : 'ms';
            direction = `${side(dm[1])} to ${side(dm[2])}`;
            break;
          }
        }
      }
      // 24.008 的消息名在正文段 'Message type: IDENTITY REQUEST'（caption 名是大写下划线形态）
      const mtName = (it.paras || []).map((p) => /^Message type:\s*(.+)$/i.exec(p)).find(Boolean);
      const name = (spec === '24008' && mtName ? mtName[1].trim() : null) || cap?.name || sh.title;
      msgs.push({
        section: sh.num,
        tableId: cap?.tableId || null,
        name,
        kind: cap?.kind || 'other',
        direction,
        rows: mt.rows,
      });
      continue;
    }
    // 值域表（位图 figure 的配套 prose 表）：'Follow-on proceed (octet 1)' + 'Bit' + '4'
    // 行组 / 'CS Domain TSC Set (octet 2): …\nBit\n1 2' 巨格——位号锚点来源（v1.13 走查纠偏）
    if (it.rows.some((r) => r.some((c) => /\(\s*octet\s+\d+\s*[,)]/i.test(c.text) || /^\s*bits?\s*:?\s*$/i.test(c.text.trim())))) {
      const sh = it.heading ? splitHeadingSfx(it.heading.text) : { num: null, title: null };
      valueTables.push({ section: sh.num, title: sh.title, rows: it.rows.map((r) => r.map((c) => c.text)) });
      continue;
    }
    other++;
  }
  // 散文别名（10.5.x 无文法表节）：'coded as the SI 16 Rest Octets' / 'defined as the SI 18 …'
  // （SI17→SI16、SI20→SI18 实测）——csn1 条目带 alias 字段，建库时池内检索根定义
  const csn1Secs = new Set(csn1Tables.map((t) => t.section));
  for (const [sec, text] of secProse) {
    if (csn1Secs.has(sec) || !/^10\.5/.test(sec)) continue;
    const am = /(?:coded|defined) as (?:the )?(?:described in [^.]*?)?SI\s?(\d+[a-z]?)\s*(?:Rest Octets)?/i.exec(text);
    if (am) {
      csn1Tables.push({ section: sec, title: (sections.find((x) => x.num === sec) || {}).title || '', cells: [], alias: `SI ${am[1]} Rest Octets` });
    }
  }
  return {
    version,
    spec,
    sections,
    bits,
    msgs,
    typeTables,
    valueTables,
    csn1: csn1Tables,
    stats: {
      bitTables: bits.length,
      msgTables: msgs.length,
      otherTables: other,
      csn1Tables: csn1Tables.length,
      csn1Unattributed: csn1Lost.length,
      csn1UnattributedSamples: csn1Lost.slice(0, 5),
    },
  };
}

// ---- 消息类型值表 ------------------------------------------------------------
// 行形如 [0,1,0,0,0,0,0,1, '', 'Registration request']（8 bit 列 + 空 + 名称）；
// 类别行（含 '-'）与空行跳过。
function parseTypeTables(tables) {
  const out = {};
  for (const t of tables || []) {
    let group = null;
    for (const cells of t.rows) {
      const texts = cells.filter((c) => c !== '');
      if (!texts.length) continue;
      const bitCells = cells.slice(0, 8).filter((c) => /^[01]$/.test(c));
      const name = texts[texts.length - 1];
      if (bitCells.length === 8) {
        if (!name) continue;
        const val = bitCells.reduce((a, b) => (a << 1) | +b, 0);
        out[name.toLowerCase()] = { type: val, group: group || null };
      } else if (name && bitCells.length === 0) {
        group = name; // '5GS mobility management messages' 类别行
      }
    }
  }
  return out;
}

// ---- 消息类型值挂接 ----------------------------------------------------------
// caption 名（大写）↔ 类型表名（首字母大写）：小写比对；同名多值（MO/MT）按方向消歧。
const DIR_QUAL = [
  [/UE to network/, /ue originating|mobile originating|\(mo\)/i],
  [/network to UE/, /ue terminated|mobile terminated|\(mt\)/i],
];
function resolveMsgType(name, direction, msgTypes) {
  const key = name.toLowerCase();
  let cands = Object.entries(msgTypes).filter(([n]) => n === key);
  if (cands.length === 0) {
    // 容错：类型表名去掉括号限定后比对（'Deregistration request (UE originating)' 已是独立键）
    cands = Object.entries(msgTypes).filter(([n]) => n.replace(/\s*\(.*\)$/, '') === key);
  }
  if (cands.length === 0) return null;
  if (cands.length === 1) return cands[0][1].type;
  if (direction) {
    const qual = DIR_QUAL.filter(([dir]) => dir.test(direction)).map(([, q]) => q);
    const hit = cands.find(([n]) => qual.some((q) => q.test(n)));
    if (hit) return hit[1].type;
  }
  return cands[0][1].type; // 歧义时取首值（由校验报告暴露）
}

// ---- IE 布局库 ---------------------------------------------------------------
// _pending 行（parseBitTable 位宽门禁不过的挂起行）：有锚点的节交给走查恢复，无锚点的
// 节放弃（诚实拒绝）。走查/纠偏统一后经 correctIes 收口。
function buildIes(bits, valueTables) {
  const ies = {};
  const anchorsBySection = extractBitAnchors(valueTables);
  for (const b of bits) {
    if (!b.section) continue;
    const anchors = anchorsBySection[b.section];
    const octs = [];
    const notes = [];
    for (const row of b.octets || []) {
      if (!row._pending) { octs.push(row); continue; }
      if (!anchors || !anchors.length) continue;
      const rowTotal = row.half ? 4 : 8 * (row.count || 1);
      if (rowTotal !== 4 && rowTotal !== 8) continue;
      const wnotes = [];
      const fixed = rescueRow(row.fields, rowTotal, anchors, row.octet, wnotes);
      if (!fixed || !fixed.some((f) => f.anchor)) { notes.push(`octet ${row.octet}: 锚点走查未收敛，行放弃`); continue; }
      const { _pending, ...clean } = row;
      clean.fields = fixed.map(({ spare, anchor, ...rest }) => {
        if (!rest.pre) delete rest.pre;
        return rest;
      });
      octs.push(clean);
      notes.push(...wnotes);
    }
    if (!octs.length) continue;
    if (!ies[b.section]) ies[b.section] = { name: b.name, layouts: [] };
    ies[b.section].layouts.push({
      figure: b.figure,
      octets: octs,
      ...((b.warnings && b.warnings.length) || notes.length ? { warnings: [...new Set([...(b.warnings || []), ...notes])] } : {}),
    });
  }
  return correctIes(ies, anchorsBySection);
}

// 挂起行走查入口（v1.19.1 审计修正）：自然平铺优先——spare 按列宽占位 + 锚点钉位后若恰好
// 严丝合缝平铺整个八位组（首字段顶格、相邻字段无缝、末字段抵 bit1、锚字段零 pre），列序
// 即规范位图原读。此前 flex 模式无条件跳过 spare，行首 spare 与锚点隔着命名字段时命名字段
// 整体顶高一位（10.5.1.6 octet3 Revision level/ES IND、octet5 LCSVA 各错一位——规范值表
// 「ES IND (octet 3, bit 5)」「LCS VA capability (octet 5, bit 6)」实证，v1.13 起即错，
// v1.18.0 只修了几何自洽未及位序）。自然平铺不成立（列宽膨胀溢出类）回退 flex spare-skip
// 救援，该路径行为不变。
function tilesExactly(fields, rowTotal) {
  if (!fields || !fields.length) return false;
  const s = [...fields].sort((a, b) => b.hi - a.hi);
  if (s[0].hi !== rowTotal || s[s.length - 1].lo !== 1) return false;
  for (let i = 1; i < s.length; i++) if (s[i].hi !== s[i - 1].lo - 1) return false;
  return true;
}
function rescueRow(fields, rowTotal, anchors, octetNo, notes) {
  const knotes = [];
  const kept = walkRow(fields, rowTotal, anchors, octetNo, knotes, 'keep');
  if (kept && kept.some((f) => f.anchor) && tilesExactly(kept, rowTotal)
    && kept.every((f) => !f.anchor || !(f.pre > 0))) {
    notes.push(...knotes);
    return kept;
  }
  return walkRow(fields, rowTotal, anchors, octetNo, notes, 'flex');
}

// ---- 值语义表 → 位布局（v1.14.1）----------------------------------------------------
// 24.301 的 IE 位图 figure 是嵌入图片，Word 表只携带值语义：字段名自带 '(octet N[, bit M])'
// 注记 + 'Bit' + 位号行 + 0/1 值行（§9.9.3.0B Additional update type / §9.9.3.34 UE network
// capability 实证——24.008 正文只写「See 24.301」的那两个 IE 就在这）。信息足以无损重建位
// 布局：产出与 parseBitTable 同构的 octets/fields。行天然从内容八位组起（无 IEI/Length 行，
// TV/TLV 值域剥壳本就由 codec 负责）。取舍：值语义文本不随布局携带（消费者按位解、UI 显数值）；
// 置信门禁 ≥2 字段，不足返回 null（散文杂表不误收）。
// 行形态：① 字段头（恰一非空格，含 (octet N, bit M[to K]) 注记；注记可在行中——
//         'ProSe (octet 7, bit 7)This bit…'，取最后一处注记）→ 字段成形，随后 0/1 行是值；
//        ② 字段头只带 (octet N) → 等下一行裁决：'Bit' + 位号行（1..4 个 1-8 数字格，降序）
//          则成形；等来又一个字段头则它是组头（'EPS encryption algorithms supported
//          (octet 3)'），丢弃；
//        ③ 值行：前导 0/1 单字符格（个数 = 字段位宽）+ 描述格；前导格空而描述非空 = 描述续行；
//        ④ 'all other bits in octet X to Y are spare' → 尾部开区间 optional spare 行。
// 行内空隙记 pre（前导空位，与 packRow/layoutUnpack 共语义）；组内字段按 hi 降序，八位组升序。
function parseValueLayout(rowsText) {
  const fields = [];
  let cur = null; // 等位号行裁决的无注记字段头（或组头）
  let last = null; // 最近成形的字段（值行挂靠）
  let spareFrom = null;
  const ANNO = /\(octet\s+(\d+)\s*(?:,\s*bits?\s+(\d+)(?:\s+to\s+(\d+))?)?\)/i;
  for (const row of rowsText || []) {
    const texts = (row || []).map((c) => String(c ?? '').trim());
    const ne = texts.filter((t) => t !== '');
    if (!ne.length) continue;
    const joined = ne.join(' ');
    const sm = /all other bits[^\n]*?octet\s+(\d+)/i.exec(joined);
    if (sm && !cur) {
      spareFrom = parseInt(sm[1], 10);
      continue;
    }
    if (ne.length === 1 && /^bits?\s*:?\s*$/i.test(ne[0])) continue; // 'Bit' 标记
    if (ne.length === 1) {
      const m = ANNO.exec(ne[0]);
      if (m) {
        // 散文排除（看第一处注记之前的名部）：字段描述会成句引用位号——'This bit indicates
        // …(CP CIoT) bit (octet 8, bit 3) is set to 1…'（句号/This bit 开头）。字段头是
        // 「名字 + 注记」，名字后可再跟 '\n' 描述或同行走文（'ProSe (octet 7, bit 7)This bit…'），
        // 其注记也可能在后文被引用多次（S1-U 行实证），注记个数不是判据。
        const before = ne[0].slice(0, m.index);
        const prose = /\.\s/.test(before) || /^this bit/i.test(before);
        if (!prose) {
          const name = ne[0].slice(0, m.index).replace(/[\s:]+$/, '').trim();
          if (m[2] != null) {
            last = { name, octet: m[1], hi: +m[2], lo: m[3] != null ? +m[3] : +m[2] };
            fields.push(last);
            cur = null;
          } else {
            cur = { name, octet: m[1] };
          }
          continue;
        }
      }
    }
    if (cur && ne.length <= 4 && ne.every((t) => /^[1-8]$/.test(t))
      && ne.every((t, i) => i === 0 || +ne[i - 1] > +t)) {
      // 位号行（严格降序排除值行 ['1','1',…] 误中）
      last = { name: cur.name, octet: cur.octet, hi: +ne[0], lo: +ne[ne.length - 1] };
      fields.push(last);
      cur = null;
      continue;
    }
    // 值行 / 描述续行 / 散文——值语义不随布局携带，一并忽略
    void joined;
  }
  if (fields.length < 2) return null;
  const byOct = new Map();
  for (const f of fields) {
    if (!byOct.has(f.octet)) byOct.set(f.octet, []);
    byOct.get(f.octet).push(f);
  }
  const octs = [...byOct.keys()].map(Number).sort((a, b) => a - b).map((n) => {
    const fs = (byOct.get(String(n)) || []).sort((a, b) => b.hi - a.hi);
    let prevLo = 9;
    return {
      octet: String(n),
      count: 1,
      fields: fs.map((f) => {
        const pre = prevLo - f.hi - 1;
        prevLo = f.lo;
        return { name: f.name, bits: f.hi - f.lo + 1, hi: f.hi, lo: f.lo, ...(pre > 0 ? { pre } : {}) };
      }),
    };
  });
  // 内容值可变长（len 列 '4 - 15' 类）：首个内容八位组之后全部标 optional（'*'），解码时
  // 字节耗尽即缺席；spare 尾注从最后一个字段八位组的下一八位组起吞尾
  for (let i = 1; i < octs.length; i++) {
    if (!/-/.test(octs[i].octet)) octs[i].octet += '*';
  }
  if (spareFrom != null && octs.length) {
    const lastN = +octs[octs.length - 1].octet.replace(/\*$/, '');
    const start = Math.max(spareFrom, lastN + 1);
    if (start > lastN) octs.push({ octet: `${start}-n*`, count: 1, open: true, fields: [{ name: 'Spare', bits: 8, hi: 8, lo: 1 }] });
  }
  return { octets: octs };
}

// ---- 值域表位号锚点（v1.13）--------------------------------------------------------
// 位图 figure 的配套 prose 表给出明文位号，两种形态：
//   跨行：['Follow-on proceed (octet 1)',''] → ['Bit'] → ['4']；
//         ['Type of attach (octet 1, bit 1 to 3)',…]（位号内联在名称格里）；
//         ['CSMT (1 bit field)'] → ['Bit'] → ['1']（无 octet 号——单八位组图省略）。
//   内嵌：'CS Domain TSC Set (octet 2): …\nBit\n1 2\n0 0 TSC set 1…'（10.5.2.82 巨格）。
// 产物：{ 节号: [{ name, octet, hi, lo }] }；octet=null 表示适用该节任一单八位组行。
function extractBitAnchors(valueTables) {
  const out = {};
  const normText = (t) => (t || '').replace(/\s*\n\s*/g, ' ').trim();
  const bitsFromSpec = (spec) => {
    const nums = (spec.match(/\d+/g) || []).map(Number).filter((n) => n >= 1 && n <= 8);
    if (!nums.length) return null;
    if (/to|-|—/.test(spec)) return { hi: Math.max(...nums), lo: Math.min(...nums) };
    const hi = Math.max(...nums);
    const lo = Math.min(...nums);
    if (nums.length > 1 && hi - lo + 1 !== nums.length) return null; // 非连续位号 → 不作锚
    return { hi, lo };
  };
  const NAME_OCT = /^(.{2,70}?)\s*\(\s*octet\s+(\d+)\s*(?:,\s*bits?\s+([\d\- to]+?)\s*)?\)\s*:?\s*$/i;
  const NAME_FIELD = /^(.{2,70}?)\s*\(\s*(\d+)\s*bit\s+field\s*\)\s*:?\s*$/i;
  const generic = (n) => /^(the|value|information|element|note|bits?)\b/i.test(n || '');
  const push = (sec, name, octet, spec) => {
    const b = bitsFromSpec(spec || '');
    if (!b || !name || generic(name)) return;
    (out[sec] = out[sec] || []).push({ name: normText(name), octet: octet == null ? null : Number(octet), hi: b.hi, lo: b.lo });
  };
  for (const vt of valueTables || []) {
    const sec = vt.section;
    if (!sec) continue;
    for (let ri = 0; ri < (vt.rows || []).length; ri++) {
      for (const cellText of vt.rows[ri]) {
        if (!cellText) continue;
        // 形态 A：巨格内嵌——按行扫：name(octet N): 散文… 行挂起（冒号后可接散文，44.018
        // 10.5.2.82 实证），'Bit(s)' 裸行武装或 'bit N' 内联位号（44.018 10.5.2.49 实证），
        // 数字行收锚
        if (cellText.includes('\n')) {
          let pending = null;
          for (const line of cellText.split('\n')) {
            const t = line.trim();
            const nm = /^(.{2,70}?)\s*\(\s*octet\s+(\d+)\s*(?:,\s*bits?\s+([\d\- to]+?)\s*)?\)\s*:?\s*(.*)$/i.exec(t);
            if (nm && !generic(nm[1])) {
              if (pending && pending.spec) push(sec, pending.name, pending.octet, pending.spec);
              const inline = nm[3] && /^[\d ]+(?:\s*to\s*\d+)?$/i.test(nm[3].trim()) ? nm[3].trim() : null;
              pending = { name: normText(nm[1]), octet: Number(nm[2]), spec: inline };
              continue;
            }
            const bt = /^bits?\s*[:=]?\s*(\d[\d ]*(?:\s*to\s*\d+)?)$/i.exec(t);
            if (bt) {
              if (pending) { push(sec, pending.name, pending.octet, bt[1]); pending = null; }
              continue;
            }
            if (/^bits?\s*:?\s*$/i.test(t)) { if (pending && !pending.spec) pending.armed = true; continue; }
            const dm = /^([\d ]+)$/.exec(t);
            if (dm && pending && (pending.armed || pending.spec)) {
              push(sec, pending.name, pending.octet, pending.spec || t);
              pending = null;
            }
          }
          if (pending && pending.spec) push(sec, pending.name, pending.octet, pending.spec);
          continue;
        }
        const t = normText(cellText);
        const nm = NAME_OCT.exec(t);
        if (nm) {
          // 形态 B：名称格 → 向下找 Bit 行 → 数字行（位号也可能已内联）
          const name = normText(nm[1]);
          const octet = Number(nm[2]);
          if (nm[3]) { push(sec, name, octet, nm[3]); continue; }
          const bj = vt.rows.findIndex((r, k) => k > ri && r.some((c) => /^bits?\s*:?$/i.test(normText(c))));
          if (bj < 0) continue;
          const dig = (vt.rows[bj + 1] || []).map(normText).filter((c) => /^\d{1,2}$/.test(c) && +c <= 8);
          if (dig.length) push(sec, name, octet, dig.join(' '));
          continue;
        }
        const nf = NAME_FIELD.exec(t);
        if (nf) {
          const bj = vt.rows.findIndex((r, k) => k > ri && r.some((c) => /^bits?\s*:?$/i.test(normText(c))));
          if (bj < 0) continue;
          const dig = (vt.rows[bj + 1] || []).map(normText).filter((c) => /^\d{1,2}$/.test(c) && +c <= 8);
          if (dig.length) push(sec, normText(nf[1]), null, dig.join(' '));
        }
      }
    }
  }
  return out;
}

// ---- 布局锚点走查（v1.13）----------------------------------------------------------
// 加宽数字格区列宽膨胀（10.5.5.x 实证：FOP 画 3 格实占 1 位）→ parseBitTable 行位宽合计
// 不合而跳过。此处用同节值域表锚点恢复：字段按序自 MSB 游标堆叠（pre = 前导空位）；锚点
// 字段钉在锚点位号；后续锚点位区被上游字段侵入时，回缩最近的无锚/弹性（spare）字段——
// spare 收缩到锚点上沿，无锚命名字段收缩至锚点上沿（FOP→bit4、10.5.2.82 TSC Value 收缩
// 至 8-6 实证）。钉位/回缩/重排三处同步 bits=实际跨度（图内列宽膨胀的位宽伪影不随之修正
// 会产出 bits≠跨度行——数字路径拒解、字节路径按 pre/bits 链静默解垃圾，v1.18.0 修复），
// 走查失败（溢出/锚点倒序/终检几何不齐）→ 返回 null，行保持跳过（诚实拒绝）。
function walkRow(fields, rowTotal, anchors, octetNo, notes, mode = 'flex') {
  const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const tokens = (s) => (s || '').toLowerCase().split(/[^a-z0-9]+/).filter((t) => t.length >= 2 || /\d/.test(t));
  const isSpareName = (n) => /spare/i.test(n) || n === '0' || n === '';
  const octetOk = (a) => !(a.octet != null && octetNo != null && Number(a.octet) !== Number(octetNo));
  const placed = fields.map((f) => ({ ...f, spare: isSpareName(f.name) }));
  // 锚点三遍独占匹配：精确 → 字符包含（FOP↔Follow-on proceed、TMSI↔TMSI flag 实证）→
  // 词子集（Type of algorithm ↔ Type of ciphering algorithm 实证）；每锚至多一字段。
  // 精确轮先行防贪心：'X IEI' 与 'X' 同现时 'X' 先锁锚（10.5.4.12 实证）
  const used = new Set();
  const assigned = new Map();
  for (const f of placed) {
    if (f.spare) continue;
    const n = norm(f.name);
    const a = anchors.find((x) => !used.has(x) && octetOk(x) && norm(x.name) === n);
    if (a) { used.add(a); assigned.set(f, a); }
  }
  for (const f of placed) {
    if (f.spare || assigned.has(f)) continue;
    const n = norm(f.name);
    let best = null;
    for (const x of anchors) {
      if (used.has(x) || !octetOk(x)) continue;
      const an = norm(x.name);
      if (an && (an.includes(n) || n.includes(an)) && (!best || an.length > norm(best.name).length)) best = x;
    }
    if (best) { used.add(best); assigned.set(f, best); }
  }
  for (const f of placed) {
    if (f.spare || assigned.has(f)) continue;
    const ft = tokens(f.name);
    if (!ft.length) continue;
    let best = null;
    for (const x of anchors) {
      if (used.has(x) || !octetOk(x)) continue;
      const xt = tokens(x.name);
      const [short, long] = ft.length <= xt.length ? [ft, xt] : [xt, ft];
      if (short.length && short.every((t) => long.includes(t)) && (!best || xt.length > tokens(best.name).length)) best = x;
    }
    if (best) { used.add(best); assigned.set(f, best); }
  }
  // 放置：非 spare 字段按序自 MSB 游标堆叠；锚点字段钉在锚点位号——游标与锚点顶之间的
  // 空隙归该字段前导 spare（pre 桥接，取 min）；锚点位区被上游无锚字段侵入时回缩最近的
  // 无锚字段。mode='flex'（挂起行救援）：spare 字段不占游标，段末重排进空隙；
  // mode='keep'（已解析行校验）：spare 字段宽度已过 acc 门禁，按列宽正常占游标。
  let cursor = rowTotal;
  for (let i = 0; i < placed.length; i++) {
    const f = placed[i];
    if (f.spare && mode === 'flex') continue;
    const a = assigned.get(f);
    if (a) {
      if (a.hi > cursor) {
        // 回缩：自尾端向前找可收缩的无锚命名字段，收缩至锚点上沿
        let j = i - 1;
        for (; j >= 0; j--) {
          const p = placed[j];
          if (p.spare || assigned.has(p)) continue;
          if (p.lo != null && p.lo <= a.hi && a.hi < p.hi) {
            p.lo = a.hi + 1;
            p.bits = p.hi - p.lo + 1; // 切割后位宽同步实际跨度（图内列宽不再可信）
            notes.push(`字段 ${p.name} 列宽与锚点冲突，收缩至 bit ${a.hi + 1}（锚点 ${a.name}）`);
            break;
          }
          return null; // 无可收缩字段 → 锚点倒序，放弃
        }
        if (j < 0) return null;
        cursor = a.hi; // 回缩后游标贴锚点上沿（下方 hi0 再减 pre）
      }
      if (a.lo > a.hi || a.lo < 1) return null;
      // pre 桥接：锚点上沿空隙先由紧邻 spare 列承载（重排段同源，10.5.6.4 '0 0 0 0 spare'
      // [8-5] 保留实证），余量记入锚字段 pre——解码链按 pre/bits 顺序消耗，空隙必须有着落，
      // 否则锚字段及后续字段整体错位（取 min 会把无 spare 承载的空隙丢掉，v1.18.0 修复）
      let spareCap = 0;
      for (let k = i - 1; k >= 0 && placed[k].spare; k--) spareCap += placed[k].bits;
      f.pre = Math.max(0, cursor - a.hi - spareCap);
      notes.push(`字段 ${f.name} 锚定 bit ${a.hi}${a.hi === a.lo ? '' : '-' + a.lo}`);
      f.hi = a.hi;
      f.lo = a.lo;
      f.bits = a.hi - a.lo + 1; // 锚点位号是位宽真值（FOP 画 3 格实占 1 位类列宽膨胀以此校正）
      f.anchor = true;
      cursor = a.lo - 1;
    } else {
      const hi0 = cursor - (f.pre || 0);
      const lo = hi0 - f.bits + 1;
      if (lo < 1) return null;
      f.hi = hi0;
      f.lo = lo;
      cursor = lo - 1;
    }
  }
  if (cursor < 0) return null;
  if (mode === 'keep') return placed; // 已解析行：列宽受 acc 门禁保护，不做段末重排
  // spare 字段在锚点回缩后可能越界/重叠——按序重排进空隙，段内最后一个 spare 吞剩余
  let top = rowTotal;
  const out = [];
  for (let i = 0; i < placed.length; i++) {
    const f = placed[i];
    if (!f.spare) {
      if (f.hi > top) return null;
      out.push(f);
      top = f.lo - 1;
      continue;
    }
    const nxt = placed.slice(i + 1).find((g) => !g.spare);
    const floor = nxt ? nxt.hi + (nxt.pre || 0) + 1 : 1;
    let avail = top - floor + 1;
    if (avail < 0) return null;
    const run = [f];
    for (let k = i + 1; k < placed.length && placed[k].spare; k++) run.push(placed[k]);
    const consumed = run.length; // 段内原始 spare 数（splice 丢弃后仍按原占用推进游标）
    let wTop = top;
    for (let k = 0; k < run.length; k++) {
      const w = k === run.length - 1 ? Math.max(0, Math.min(run[k].bits, avail)) : Math.min(run[k].bits, avail);
      run[k].hi = wTop;
      run[k].lo = Math.max(floor, wTop - w + 1);
      run[k].bits = run[k].hi - run[k].lo + 1; // 重排放置位宽同步实际跨度
      if (run[k].lo > run[k].hi) { run.splice(k, 1); k--; continue; } // 空隙耗尽的 spare 丢弃
      wTop = run[k].lo - 1;
      avail = wTop - floor + 1;
      out.push(run[k]);
    }
    top = wTop;
    i += consumed - 1;
  }
  // 终检：全部字段位宽=跨度且界内（几何不齐诚实拒绝，优于静默垃圾值）
  for (const f of out) {
    if (f.bits !== f.hi - f.lo + 1 || f.hi > rowTotal || f.lo < 1) return null;
  }
  return out;
}

// 锚点走查入口（已解析行的校验层）：列派生位号经 acc 门禁 + 图网格一致，为本——走查
// 仅校验，与锚点不一致时记告警、不改位（Classmark 1 octet2 实证：改写会丢 spare 字段并
// 顶错 Revision）。挂起行的救援走查在 buildIes（mode='flex'，覆写位号）。
function correctIes(ies, anchorsBySection) {
  for (const [sec, ie] of Object.entries(ies || {})) {
    const anchors = anchorsBySection[sec];
    if (!anchors || !anchors.length) continue;
    for (const lay of ie.layouts) {
      for (const row of lay.octets || []) {
        if (row.compressed || row._pending) continue;
        const rowTotal = row.half ? 4 : 8 * (row.count || 1);
        if (rowTotal !== 4 && rowTotal !== 8) continue;
        const notes = [];
        const fixed = walkRow(row.fields, rowTotal, anchors, row.octet, notes, 'keep');
        if (!fixed || !fixed.some((f) => f.anchor)) continue; // 无锚命中不校验
        const cur = row.fields.map((f) => `${f.hi}-${f.lo}`).join(',');
        const nex = fixed.map((f) => `${f.hi}-${f.lo}`).join(',');
        if (cur !== nex) {
          (lay.warnings = lay.warnings || []).push(`octet ${row.octet}: 锚点走查与列派生位号不一致，保持列派生（${cur} vs ${nex}）`);
        }
      }
    }
  }
  return ies;
}

// ---- 消息库 ------------------------------------------------------------------
function buildMessages(msgs, msgTypes, bits) {
  const out = {};
  const problems = [];
  for (const m of msgs) {
    if (!m.name || m.kind !== 'message') continue;
    const rows = m.rows.map((r) => ({
      ...r,
      def: r.ref && bits.find((b) => b.section === r.ref) ? r.ref : null,
    }));
    const inst = {
      section: m.section,
      tableId: m.tableId,
      direction: m.direction,
      rows,
    };
    inst.msgType = resolveMsgType(m.name, m.direction, msgTypes);
    if (inst.msgType == null) problems.push(`${m.section} ${m.name}: 无消息类型值`);
    if (!out[m.name]) out[m.name] = [];
    out[m.name].push(inst);
  }
  return { out, problems };
}

// 结构化 → schema（codec 消费形态）+ 建库问题清单
function buildSchema(structured, opts = {}) {
  if (structured.spec === '24008') return buildSchema24008(structured, opts);
  if (structured.spec === '29274') return buildSchema29274(structured);
  if (structured.spec === '29244') return buildSchema29244(structured);
  if (structured.spec === '29060') return buildSchema29060(structured);
  if (structured.spec === '29281') return buildSchema29281(structured);
  if (structured.spec === '44018') return buildSchema44018(structured, opts.fillBits, opts.fillValueTables, opts.fillCsn1);
  if (structured.spec === '44060') return buildSchema44060(structured);
  if (structured.spec === '24080') return buildSchema24080(structured);
  if (structured.spec === '24011') return buildSchema24011(structured);
  if (structured.spec === '23040') return buildSchema23040(structured);
  const msgTypes = parseTypeTables(structured.typeTables);
  const ies = buildIes(structured.bits, structured.valueTables);
  const { out: messages, problems } = buildMessages(structured.msgs, msgTypes, structured.bits);
  return {
    schema: { spec: structured.spec, version: structured.version, msgTypes, ies, messages },
    problems,
  };
}

// ---- CSN.1 Rest Octets 描述符建库（批次D）------------------------------------------------
// 文法表（<ver>.json 的 csn1 键，格文本原样）→ { 节号: { root, defs } }。
// 定义全局池化：SI7/SI8/17/20 别名节的 root 定义位于 SI4/16/18 的表内，按定义名全局检索；
// 44.018 §10.5.1.x 委托 24.008（--fill 并池）。Spare Half Octet（10.5.1.8）两规范均纯散文，
// 按 24.007 Annex B.1.3 预定义库记法合成 <spare half octet> ::= <spare bit>(4)（通用记法，非规范数据）。
const csn1Key = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();

// report（可选，v1.43.0 AK P2-2/P3-11）：调用方传入即回填解析失败/同名异体冲突/root 质量计数——
// 原先 notes 与失败格全部静默丢弃（评审 P2-2：「478/478 零失败」实为 452 格中 93 格零定义）。
function buildCsn1Descriptors(csn1Tables, sections, report = null) {
  const pool = new Map(); // defKey → body
  const secDefs = new Map(); // 节号 → [defKey]
  for (const t of csn1Tables || []) {
    for (const cell of t.cells || []) {
      if (report) report.cells++;
      let parsed;
      try { parsed = parseGrammar(cell); } catch (e) {
        if (report) report.failed.push({ sec: t.section, note: '词法异常: ' + e.message });
        continue;
      }
      if (report && (!parsed.defs.length || parsed.notes.length)) {
        for (const n of parsed.notes) report.failed.push({ sec: t.section, note: n });
        if (!parsed.defs.length && !parsed.notes.length) report.failed.push({ sec: t.section, note: '零定义且无 note（静默跳过）' });
      }
      for (const d of parsed.defs) {
        const k = csn1Key(d.name);
        if (pool.has(k)) {
          // v1.43.0 AK P3-11：同名异体冲突逐起记录（池策略先到先得，本批不动）
          if (report && JSON.stringify(pool.get(k)) !== JSON.stringify(d.body)) {
            report.conflicts.push([d.name, t.section]);
          }
        } else pool.set(k, d.body);
        const arr = secDefs.get(t.section) || [];
        if (!arr.includes(k)) arr.push(k);
        secDefs.set(t.section, arr);
      }
    }
  }
  const titleOf = (sec) => {
    const s = (sections || []).find((x) => x.num === sec);
    return s ? s.title || '' : '';
  };
  const out = {};
  const ensure = (sec, rootKey) => {
    if (!pool.has(rootKey) || out[sec]) return;
    const defs = {};
    const walk = (body) => {
      if (!body || typeof body !== 'object') return;
      if (body.t === 'ref' && body.name) {
        const k = csn1Key(body.name);
        if (pool.has(k) && !Object.prototype.hasOwnProperty.call(defs, k)) {
          defs[k] = pool.get(k);
          walk(defs[k]);
        }
        return;
      }
      if (body.t === 'typed') return walk(body.body);
      if (body.t === 'seq' && body.items) return body.items.forEach(walk);
      if (body.t === 'choice' && body.alts) return body.alts.forEach(walk);
      if (body.t === 'rep') return walk(body.body);
    };
    defs[rootKey] = pool.get(rootKey);
    walk(pool.get(rootKey));
    out[sec] = { root: rootKey, defs };
  };
  // ① 有文法表的节（含 fill 并入节）：root = 节标题匹配的定义 → 标题+'message content(s)'
  // 后缀容忍（44.060 §11.2 节题无 content 后缀而定义名有，v1.43.0 AK P3-11 探针实测可救
  // 20 节）→ 节内首定义兜底
  const ROOT_SUFFIXES = ['messagecontent', 'messagecontents'];
  for (const [sec, keys] of secDefs) {
    const tk = csn1Key(titleOf(sec));
    let root = keys.includes(tk) ? tk : null;
    if (!root && tk) {
      const hit = ROOT_SUFFIXES.map((s) => tk + s).find((c) => keys.includes(c));
      if (hit) { root = hit; if (report) report.rootSuffix++; }
    }
    if (!root) { root = keys[0]; if (report) report.rootFallback++; }
    ensure(sec, root);
  }
  // ② 别名节（本节无文法表）：节标题匹配的定义全局检索
  for (const s of sections || []) {
    const tk = csn1Key(s.title || '');
    if (tk && pool.has(tk)) ensure(s.num, tk);
  }
  // ②b 散文别名（'coded/defined as the SI 16/18 Rest Octets' 摄取期解析）：按别名定义名检索
  for (const t of csn1Tables || []) {
    if (t.alias && !out[t.section]) {
      const ak = csn1Key(t.alias);
      if (pool.has(ak)) ensure(t.section, ak);
    }
  }
  // ③ Spare Half Octet：记法库合成
  for (const s of sections || []) {
    if (!out[s.num] && csn1Key(s.title || '') === 'sparehalfoctet') {
      out[s.num] = { root: 'spare half octet', defs: { 'spare half octet': { t: 'spare', n: 4 } } };
    }
  }
  // ③′ root 质量审计（v1.43.0 AK P3-11）：extension 名 root / null 体 root 计数告警
  if (report) {
    for (const d of Object.values(out)) {
      if (/extension/.test(d.root || '')) report.extRoots++;
      const b = (d.defs && d.defs[d.root]) || null;
      if (!b || b.t === 'null') report.nullRoots++;
    }
  }
  // ④ 并入 ies（位布局可共存——同名 IE 同时有 layouts 与 csn1 时解码优先 csn1）
  return out;
}

function mergeCsn1IntoIes(ies, csn1, sections) {
  for (const [sec, d] of Object.entries(csn1 || {})) {
    const s = (sections || []).find((x) => x.num === sec);
    ies[sec] = { name: (ies[sec] && ies[sec].name) || (s ? s.title : sec), layouts: (ies[sec] && ies[sec].layouts) || [], csn1: d };
  }
  return ies;
}

// ---- 44.060（RLC/MAC，CSN.1 文法规范）建库（批次 AI3）-----------------------------------
// 44.060 无 24 族表格（探案 j00：633 表 = 208 张 CSN.1 文法 + 425 值语义/说明表，bitTable/
// msgTable 零命中）——本 schema = CSN.1 描述符库（buildCsn1Descriptors 池化闭包，44.018
// Rest Octets 同一基建），为 44.018 的外部结构引用（'PCID GROUP IE' 等悬空 ref）提供并池源。
// 消息级（§11 消息名→文法 root）不另建 messages：44.060 消息即文法，ies 节即完整覆盖。
function buildSchema44060(structured) {
  const problems = [];
  // v1.43.0 AK P2-2/P3-11：解析失败 notes / 冲突 / root 质量全部汇总入 problems（可接受档——
  // 覆盖缺口如实可见；fatal 分级仍由 classifyProblems 承接）
  const report = { cells: 0, failed: [], conflicts: [], rootSuffix: 0, rootFallback: 0, extRoots: 0, nullRoots: 0 };
  const csn1 = buildCsn1Descriptors(structured.csn1, structured.sections, report);
  const ies = mergeCsn1IntoIes({}, csn1, structured.sections);
  if (!Object.keys(ies).length) problems.push('CSN.1 文法表未捕获（含 ::= 的表格为零）');
  if (report.failed.length) {
    problems.push(`CSN.1 文法解析失败 ${report.failed.length} 项（${report.cells} 格中）——例: ${report.failed.slice(0, 3).map((f) => `${f.sec} ${String(f.note).slice(0, 80)}`).join(' / ')}`);
  }
  const st = structured.stats || {};
  if (st.csn1Unattributed) {
    problems.push(`CSN.1 未归属 ::= 表 ${st.csn1Unattributed} 张（无节锚落空）——例: ${(st.csn1UnattributedSamples || []).slice(0, 3).join(' / ').slice(0, 160)}`);
  }
  if (report.conflicts.length) {
    problems.push(`CSN.1 同名异体定义冲突 ${report.conflicts.length} 起（池先到先得）——例: ${report.conflicts.slice(0, 3).map((c) => `${c[0]}(${c[1]})`).join(' / ')}`);
  }
  if (report.extRoots || report.nullRoots) {
    problems.push(`CSN.1 root 质量：extension 名 root ${report.extRoots} 节、null 体 root ${report.nullRoots} 节`);
  }
  const defCount = Object.values(ies).reduce((a, e) => a + Object.keys((e.csn1 && e.csn1.defs) || {}).length, 0);
  // 比例守卫：真实 44060 文法表 188 张/defs 446——表多而 defs 异常少 = 节归属系统性失配；
  // 合成/小型库（表 < 10）不误报。
  if ((structured.csn1 || []).length >= 10 && defCount < 100) problems.push(`文法定义过少（${defCount}）——节归属可能系统性失配`);
  return { schema: { spec: '44060', version: structured.version, msgTypes: {}, ies, messages: {} }, problems };
}

// ---- 24.008（GSM/UMTS 传承 NAS）建库 -----------------------------------------------
// 差异点（对照 24.501/24.301 管线）：
//   1) 类型值表（§10.2/10.3/10.4/10.4a…）用 x/-/0/1 位模式：x/- = 通配（TI/序号位），
//      建库产出 { value, mask }，解码侧按 (b & mask) === value 匹配；
//   2) 组行（'x x 0 0 - - - - | Registration messages:'）的模式被后续消息行继承；
//   3) 消息内容表是「双物理行」（名称行 + 引用行）→ 合并；IE 名前可能带协议组前缀行；
//   4) 头部 = [PD(V 1/2), SkipInd/TI(V 1/2), Message type(V 1)]：PD 占 octet1 低半
//      （24.007 §10.2/10.3：skip/TI = bits 5-8），表序先低规则与 24.501 一致；
//   5) PD 值按 §9.x 族（TS 24.007 §11.2.3.1.3 分配，pycrate ProtDisc_dict 同源）：
//      RR=6 / MM=5 / CC=3 / GMM=8 / SM=10（GPRS Session Management——非 SMS(9)，
//      wire oracle 实证：pycrate SMActivatePDPContextRequest 帧 octet1=0x0a）。
const PD24008 = { '9.1': 6, '9.2': 5, '9.3': 3, '9.4': 8, '9.5': 10 };

// 24.008 IE 节正文只写「See 3GPP TS 24.301 subclause 9.9.3.x」的映射（10.5.5.0/10.5.5.26：
// 正文为一句引用 + 嵌入图片 figure，无自带位表）。布局取自 24.301 的值语义表
// （parseValueLayout），建库时经 --fill24301 提供同管线摄取的 24.301 产物并入。
const SEE_24301 = { '10.5.5.0': '9.9.3.0B', '10.5.5.26': '9.9.3.34' };

function rowIsTv1(r) {
  const f = (r.format || '').trim().toUpperCase();
  return f === 'TV' && /^[0-9a-fA-F]-$/i.test((r.iei || '').trim());
}

function fillSee24301(ies, messages, fill24301) {
  if (!fill24301) return [];
  const vts = fill24301.valueTables || [];
  const filled = [];
  for (const [sec, ref] of Object.entries(SEE_24301)) {
    if (ies[sec]) continue; // 本版自带布局则让位（未来 24.008 若补位表即自动停用）
    const vt = vts.find((t) => t.section === ref);
    if (!vt || !Array.isArray(vt.rows)) continue;
    const lay = parseValueLayout(vt.rows);
    if (!lay) continue;
    // TV/1（type1，IEI 半八位组）行消费的是 nibble——八位组布局换半八位组行（位号 ≤4）
    const isTv1 = (messages ? Object.values(messages) : []).some((insts) =>
      (insts || []).some((inst) => (inst.rows || []).some((r) => (r.ref === sec || r.def === sec) && rowIsTv1(r))));
    const row = lay.octets[0];
    if (isTv1 && row && !row.half && row.fields.every((f) => f.hi <= 4)) {
      let prevLo = 5;
      row.fields = row.fields.map((f) => {
        const pre = prevLo - f.hi - 1;
        prevLo = f.lo;
        return { name: f.name, bits: f.bits, hi: f.hi, lo: f.lo, ...(pre > 0 ? { pre } : {}) };
      });
      row.half = true;
    }
    ies[sec] = {
      name: (vt.title || '').replace(/^[A-Za-z]\s+/, '') || sec,
      layouts: [{ figure: null, octets: lay.octets }],
      fillFrom: `24.301 ${fill24301.version || ''} §${ref}`.trim(),
    };
    filled.push(`${sec} ← ${ref}`);
  }
  return filled;
}

function parseTypeTables24008(tables) {
  const out = {};
  for (const t of tables || []) {
    let cur = { value: 0, mask: 0 }; // 组模式（未定义位全通配）
    for (const cells of t.rows) {
      const texts = cells.filter((c) => c !== '');
      if (!texts.length) continue;
      const bits = cells.slice(0, 8);
      const name = (texts[texts.length - 1] || '').trim();
      let value = 0;
      let mask = 0;
      let nFixed = 0;
      bits.forEach((b, i) => {
        const s = (b || '').trim();
        if (s === '0' || s === '1') {
          mask |= 1 << (7 - i);
          if (s === '1') value |= 1 << (7 - i);
          nFixed++;
        }
      });
      if (!name && !nFixed) continue;
      const isMsg = /^-\s/.test(name) || /^-\s/.test(texts[0] || '') || nFixed >= 5;
      // 键清洗：规范笔误（'AUTHENTICATION FAILURE…………..'）与缩写原样保留，仅去尾点/省略号
      const clean = name.replace(/^-\s*/, '').replace(/\s+/g, ' ').trim().replace(/[.…\s]+$/, '');
      if (!clean) continue;
      if (isMsg || (!nFixed && cur.mask)) {
        // 消息行：组模式 + 行模式叠加
        const m = cur.mask | mask;
        const v = (cur.value & cur.mask) | (value & mask);
        out[clean.toLowerCase()] = { type: v, mask: m, group: null };
      } else if (nFixed) {
        // 组行：模式被后续消息行继承
        cur = { value, mask };
      }
      // 无位信息且非消息行 → 续行文本（跨行组名），忽略
    }
  }
  return out;
}

function resolveMsgType24008(name, msgTypes, direction) {
  const key = name.toLowerCase();
  const exact = msgTypes[key];
  if (exact) return exact;
  const base = key.replace(/\s*\(.*\)$/, '');
  if (msgTypes[base]) return msgTypes[base];
  // GMM/SM 类型表用缩写名（'Authentication and ciphering req'）、SM 方向变体
  // （'…request(network to ms direction)'）与 9.4.20 等别名 → 前缀匹配 + 方向消歧 + 最长优先
  let pref = Object.entries(msgTypes).filter(([k]) => (k.startsWith(base) || base.startsWith(k)) && Math.min(k.length, base.length) >= 8);
  if (pref.length > 1 && direction) {
    const dirKey = /network to (ms|mobile)/i.test(direction) ? 'network to ms'
      : /(ms|mobile) to network/i.test(direction) ? 'ms to network' : null;
    if (dirKey) {
      const byDir = pref.filter(([k]) => k.includes(dirKey) || !/direction\)/.test(k));
      if (byDir.length >= 1) pref = byDir;
    }
  }
  if (pref.length >= 1) {
    pref.sort((a, b) => b[0].length - a[0].length);
    return pref[0][1];
  }
  const suf = Object.entries(msgTypes).filter(([k]) => key.endsWith(k) || k.endsWith(key));
  if (suf.length === 1) return suf[0][1];
  return null;
}

// 24.008 §10.4 的 4 个子表无域标签且跨域同名（identity request：MM 0x18 组继承 vs GMM
// 0x15 全位）——合并 map 会同键覆盖，让 MM 实例挂上 GMM 值（wire oracle 实证）。
// 域归属：每个子表与"行名命中最多的消息族"配对（数据驱动，版本鲁棒），resolve 时先查域表。
const DOM24008 = [['9.2', 'mm'], ['9.3', 'cc'], ['9.4', 'gmm'], ['9.5', 'sm']];

// 消息内容表双物理行合并 + 名称清理 + def 解析（24008/44018/24080 三族共用）。
// 引用行（名称全空，仅 ref）与名称续行（长 IE 名跨两物理行，如 'Ciphering key sequence'
// +'number'）都并入前行。续行不占字节，但若不并会把相邻半八位组行拆成两个独立 VH run
// 各吞整字节——wire oracle 实证多算 1 字节。引用有两种落点：ref 列（r.ref）或直接把
// 节号写进 name 列（'10.5.3.5a'）——都收。
const REF_ONLY = /^\d+(?:\.\d+)+[A-Za-z]?$/;

function mergeContentRows(structured, rows) {
  const merged = [];
  for (const r of rows) {
    const prev = merged[merged.length - 1];
    if (prev && !(r.iei || '').trim() && !(r.presence || '').trim() && !(r.format || '').trim() && !(r.len || '').trim()) {
      const nm = (r.name || '').trim();
      // 'TS 24.008' 跨规范引用拆出的 'TS' 是规范指称不是名称续词（24.080 RELEASE COMPLETE
      // 的 Cause 行），不并入名称
      const refInName = !r.ref && REF_ONLY.test(nm) ? nm : null;
