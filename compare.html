.cp-wrap{max-width:1080px;margin:0 auto;padding:34px 26px 70px}
.cp-hero h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
.cp-hero .sub{color:var(--tx2);font-size:14px;margin-top:8px;line-height:1.7}
.cp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.cp-tab{font:700 12.5px var(--sans);color:var(--tx2);background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;cursor:pointer}
.cp-tab.on{color:var(--accent-deep);background:var(--accent-bg);border-color:var(--accent)}
.cp-row{border:1px solid var(--bd);border-radius:14px;background:var(--panel);padding:15px 17px;margin-top:13px;box-shadow:var(--shadow-card)}
.cp-topic{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cp-topic b{font-size:15px;font-weight:800;color:var(--tx1)}
.cp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cp-cell{border:1px solid var(--bd);border-radius:10px;background:var(--bg);padding:11px 13px}
.cp-gen{font:800 11px var(--mono);letter-spacing:.4px;border-radius:5px;padding:1px 8px;display:inline-block}
.cp-gen.lte{color:#B45309;background:#FBF3E4;border:1px solid #E8D5B5}
.cp-gen.nr{color:#2563EB;background:#EBF1FE;border:1px solid #C9D9F5}
.cp-msg{font:800 13.5px var(--mono);color:var(--tx1);margin-top:6px}
.cp-note{font-size:12.5px;color:var(--tx2);line-height:1.7;margin-top:6px}
.cp-badge-row{margin-top:7px}
.cp-diff{margin-top:10px;border-top:1px dashed var(--bd);padding-top:9px;font-size:12.5px;line-height:1.7;color:var(--tx2)}
.cp-diff b{color:var(--accent-deep)}
.cp-note-btm{margin-top:26px;font-size:12.5px;color:var(--tx3);line-height:1.75;border-top:1px solid var(--bd);padding-top:14px}
/* 走线模式（v8 块 4）：步骤条+行高亮+淡化 */
.cp-walkbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:10px 12px;border:1px dashed var(--bd);border-radius:12px;background:var(--bg)}
.cp-walk-step{font:700 12px var(--sans);color:var(--tx2);background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:4px 11px;cursor:pointer}
.cp-walk-step.done{opacity:.45}
.cp-walk-step.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.cp-walk-nav{display:flex;gap:6px;margin-left:auto}
.cp-walk-nav button{font:700 12px var(--sans);border:1px solid var(--bd);background:var(--panel);color:var(--tx1);border-radius:8px;padding:4px 12px;cursor:pointer}
.cp-row.walk-hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg),var(--shadow-card)}
.cp-walking .cp-row:not(.walk-hit){opacity:.38}
@media (max-width:680px){.cp-cols{grid-template-columns:1fr}.cp-wrap{padding:26px 14px 60px}}
</style>

    <h1>两代对照——同一出戏，两个版本</h1>
    <p class="sub">38.331 本来就是从 36.331 改写出来的：骨架原样、大段照搬，真正变的集中在几处。<b>左边是 LTE（36.331），右边是 NR（38.331），每行一句"到底差在哪"</b>——分清"哪些只是改名、哪些是真进化"，是两代差别类面试题的标准答法。点 §徽章看条款原文短引。想走完整课程版（带时序图与失败分支）去 <a href="app.html#ml">LTE/5G 对照深潜课 →</a></p>

<script>
(function () {
  'use strict';
  var C = window.RRC_COMPARE;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  var tabs = document.getElementById('cp-tabs');
  var cur = 'all';
  function chipHtml(key, name) {
    return '<button class="cp-tab" data-g="' + key + '">' + esc(name) + '</button>';
  }
  tabs.innerHTML = chipHtml('all', '全部（' + C.rows.length + ' 行）') +
    C.groups.map(function (gp) {
      var n = C.rows.filter(function (r) { return r.g === gp.key; }).length;
      return chipHtml(gp.key, gp.name + '（' + n + '）');
    }).join('') +
    chipHtml('walk', '▶ 按流程走（' + C.walk.length + ' 步）');
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('.cp-tab');
    if (!b) return;
    var g = b.dataset.g;
    [].forEach.call(tabs.children, function (x) { x.classList.toggle('on', x === b); });
    if (g === 'walk') { enterWalk(); return; }
    if (cur === 'walk') { exitWalk(); }
    cur = g;
    render();
  });

  function cellHtml(gen, cell) {
    var genCls = gen === 'lte' ? 'lte' : 'nr';
    var genName = gen === 'lte' ? 'LTE · 36.331' : 'NR · 38.331';
    return '<div class="cp-cell"><span class="cp-gen ' + genCls + '">' + genName + '</span>' +
      '<div class="cp-msg">' + esc(cell.m) + '</div>' +
      '<div class="cp-note">' + esc(cell.n) + '</div>' +
      (cell.s ? '<div class="cp-badge-row"><span class="ref-badge" title="条款原文短引">§' + esc(cell.s) + '</span></div>' : '') +
      '</div>';
  }
  function render() {
    var rows = C.rows.filter(function (r) { return cur === 'all' || r.g === cur; });
    document.getElementById('cp-rows').innerHTML = rows.map(function (r) {
      return '<div class="cp-row"><div class="cp-topic"><b>' + esc(r.topic) + '</b></div>' +
        '<div class="cp-cols">' + cellHtml('lte', r.lte) + cellHtml('nr', r.nr) + '</div>' +
        '<div class="cp-diff"><b>差在哪：</b>' + esc(r.diff) + '</div></div>';
    }).join('');
  }
  /* ---------- 走线模式（v8 块 4）：全部行渲染 + 步骤条逐步高亮滚动 ---------- */
  var walkbar = document.getElementById('cp-walkbar');
  var rowsEl = document.getElementById('cp-rows');
  var walkIdx = -1;
  walkbar.addEventListener('click', function (e) {
    var st = e.target.closest('.cp-walk-step');
    if (st) { walkStep(Number(st.dataset.i)); return; }
    if (e.target.id === 'cp-walk-prev') walkStep(walkIdx - 1);
    if (e.target.id === 'cp-walk-next') walkStep(walkIdx + 1);
  });
  function walkStep(i) {
    var n = C.walk.length;
    walkIdx = Math.max(0, Math.min(n - 1, i));
    [].forEach.call(walkbar.querySelectorAll('.cp-walk-step'), function (s, si) {
      s.classList.toggle('on', si === walkIdx);
      s.classList.toggle('done', si < walkIdx);
    });
    [].forEach.call(rowsEl.querySelectorAll('.cp-row'), function (row, ri) {
      row.classList.toggle('walk-hit', ri === C.walk[walkIdx].r);
    });
    var hit = rowsEl.querySelectorAll('.cp-row')[C.walk[walkIdx].r];
    if (hit) hit.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function enterWalk() {
    cur = 'walk';
    walkbar.hidden = false;
    document.body.classList.add('cp-walking');
    /* walk 模式渲染全部行（时序不分组过滤） */
    rowsEl.innerHTML = C.rows.map(function (r) {
      return '<div class="cp-row"><div class="cp-topic"><b>' + esc(r.topic) + '</b></div>' +
        '<div class="cp-cols">' + cellHtml('lte', r.lte) + cellHtml('nr', r.nr) + '</div>' +
        '<div class="cp-diff"><b>差在哪：</b>' + esc(r.diff) + '</div></div>';
    }).join('');
    walkbar.innerHTML = '<span style="font:800 12px var(--mono);color:var(--tx3)">流程：</span>' +
      C.walk.map(function (s, i) {
        return '<button class="cp-walk-step" data-i="' + i + '">' + (i + 1) + '. ' + esc(s.t) + '</button>';
      }).join('') +
      '<span class="cp-walk-nav"><button id="cp-walk-prev">← 上一步</button><button id="cp-walk-next">下一步 →</button></span>';
    walkStep(0);
  }
  function exitWalk() {
    cur = 'all';
    walkbar.hidden = true;
    walkbar.innerHTML = '';
    document.body.classList.remove('cp-walking');
    render();
  }
  document.getElementById('cp-note').textContent = C.note;
  tabs.children[0].classList.add('on');
  render();
})();
</script>
