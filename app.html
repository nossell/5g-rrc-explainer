<script>
(function () {
  var store = RRC.Store();
  var PAID = {"m3":"M4 · 测量事件","m4":"M5 · 切换全流程","m5":"M6 · 承载与重配置","m6":"M7 · RRC_INACTIVE","m7":"M8 · AS 安全激活","m8":"M9 · LTE↔NR 互操作（EN-DC）","mi":"M10 · NG 接口课（38.413）","mx":"M11 · Xn 接口课（38.423）","mc":"M12 · MAC 随机接入课（38.321）","mn":"M13 · NAS 注册课（24.501）","mg":"M14 · 5GC 流程课（23.502/23.501）","mp":"M15 · 用户面协议栈课（37.324/38.323/38.322）","ml":"M16 · LTE 对照课（36.331 对照 38.331）","ms":"M17 · 安全线课（33.501 密钥分级）","mf":"M18 · 物理层课（38.211/38.212/38.213/38.214）","me":"M19 · LTE NAS 专章（24.301 EMM/ESM）","mz":"M20 · 接口族收官课（S1AP/F1AP/E1AP/GTP-U）","mv":"M21 · IMS 与语音线（SIP 从注册到挂断）","mb":"M22 · 核心网承载信令（GTP-C 与 PFCP）","mt":"M23 · 一致性测试线（38.523/38.508-1）","md":"M24 · 定位线（LPP 与 NRPPa）","mk":"M25 · 垂直特性速览（NTN/RedCap/Sidelink/MBS/IAB）","mu":"M26 · 卡与终端（USIM 与 SMS）","mw":"M27 · SIP 消息解剖（24.229 信令级）","mr":"M28 · 网络切片专课（S-NSSAI 的旅程）","my":"M29 · 空闲态与小区重选（RRC_IDLE 的 UE 规程）","mq":"M30 · QoS 专课（5QI/QoS Flow/DRB 绑定与反射 QoS）","mj":"M31 · 5G 密钥层级专课（K 的旅程：从 K 到 K_NAS/K_RRC/K_UP 与切换推衍）","mo":"M32 · SBA 服务化架构（NRF/发现/token）","mm":"M33 · PDU 会话信令专课（建立/修改/释放）","mng":"M34 · NGAP 信令专课（38.413 消息族）","mns":"M35 · Service Request 专课（从空闲到业务通）","ms1":"M36 · S1AP 信令专课（36.413 消息族）","mx2":"M37 · X2AP 信令专课（36.423 消息族）","mau":"M38 · 跨层排障毕业课 · 一次掉线的全栈尸检","mf1":"M39 · F1AP 信令专课（38.473 消息族）","me1":"M40 · E1AP 信令专课（38.463 消息族）","m41":"M41 · NG-RAN 架构总纲（38.401）","m42":"M42 · 测量与移动性控制","m43":"M43 · MRO 与切换自愈","m44":"M44 · ANR 与邻区自管理","m45":"M45 · 话统 KPI 与空口信令映射","m46":"M46 · CHO 条件切换","m47":"M47 · LTM · L1/L2 触发移动性","m48":"M48 · LTE RRC 连接控制全流程","m49":"M49 · NTN 与 RedCap · 卫星与轻量终端","m50":"M50 · Sidelink · PC5 直连","m51":"M51 · MBS · 广播与多播","m52":"M52 · IAB · 集成接入回传","m53":"M53 · 毕业课 · 全站知识地图与 JD 面试总攻","m54":"M54 · MDT · 最小化路测","m55":"M55 · Sidelink 中继 · L2 U2N/U2U Relay 架构","m56":"M56 · Multi-path Relay · 多路径中继架构","m57":"M57 · Ambient IoT · 环境物联网","m58":"M58 · Sidelink 增强架构 · IUC、共享频谱与载波聚合","m59":"M59 · MBS 架构 · 多播与广播的完整账","m60":"M60 · NTN 架构 · 卫星直连的完整账","m61":"M61 · 切片与专网 · 网络身份的完整账","m62":"M62 · URLLC 与 TSN · 低时延与确定性","m63":"M63 · 公共告警、轻量终端与空中接口收边","m64":"M64 · 空口演进 · Multi-USIM、空口 AI/ML 与 SBFD","m65":"M65 · 网侧测量与节能 · QoE 收集、网络节能与干扰管理","m66":"M66 · UE 轻量省电 · 小包传输、UE 省电与覆盖增强","m67":"M67 · 安全·能力·标识 · 架构三支柱收官","m68":"M68 · Sidelink · 无线承载管理","m69":"M69 · SL 中继 · 控制与承载面","m70":"M70 · SL 中继 · Relay 与 Remote UE 操作","m71":"M71 · SL 发现与定位","m72":"M72 · SL 测量与拾遗","m73":"M73 · 物理层测量 · Uu 量族","m74":"M74 · 物理层测量 · SL 与 gNB 量族","m75":"M75 · 测量线横向复习 · 一条数的旅程","m76":"M76 · 主线拾遗 · 恢复收尾与失败上报","m77":"M77 · 38.300 全景 · 架构、RRC 框架与移动性总览","m78":"M78 · 38.304 深水 · 空闲态全景——IDLE/INACTIVE、选择重选与寻呼","m79":"M79 · 38.300 深水 · L2 与空口全景——四子层数据流、物理层双工、特性组与 Inter-RAT","m80":"M80 · 38.331 深水 · 过程面收边——系统信息生命周期、Inter-RAT 移动性与 UE 能力机器"};  /* v55.1 R5：build 时从 course-catalog 推导，label=M{num} · {title} */
  /* v55 R2 按需加载（公网版）：目录（course-catalog.js）供导航序与免费课元数据；
     付费 id 先由 PAID 映射拦截出提示页——绝不发起付费内容文件请求。
     免费课按 prereq 链懒装载；短引 spec-quotes.js 首帧后延后装载。 */
  var CAT = window.RRC_CATALOG || [];
  var BY = {}; CAT.forEach(function (c) { BY[c.id] = c; });
  var ORDER = CAT.map(function (c) { return c.id; });
  var fileJobs = {};
  function loadFile(f) {
    if (!fileJobs[f]) {
      fileJobs[f] = new Promise(function (res, rej) {
        var s = document.createElement('script');
        s.src = 'assets/content/' + f;
        s.onload = function () { res(); };
        s.onerror = function () { rej(new Error('课程文件加载失败: ' + f)); };
        document.head.appendChild(s);
      });
    }
    return fileJobs[f];
  }
  function ensure(id, seen) {
    seen = seen || {};
    if (RRC.get(id) || seen[id]) return Promise.resolve();
    seen[id] = true;
    var c = BY[id];
    if (!c || !c.file) return Promise.reject(new Error('该模块不在免费层: ' + id));
    /* v55.1 R7：prereq 分支并行装载（注册互不依赖），file 本体等闭包齐后再装 */
    return Promise.all((c.prereq || []).map(function (p) { return ensure(p, seen); }))
      .then(function () { return loadFile(c.file); });
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function currentId() {
    var h = (location.hash || '#m0').slice(1);
    if (PAID[h]) return '__paid__' + h;
    if (BY[h] && BY[h].file) return h;
    return 'm0';
  }
  function renderPaid(id) {
    var label = PAID[id];
    document.title = label + ' · 完整版 · RRC 讲解器';
    document.getElementById('crumb').innerHTML = '<a href="index.html">目录</a><span>/</span><span class="cur">' + esc(label) + '</span><span>完整版模块</span>';
    document.getElementById('modnav').innerHTML = '';
    var view = document.getElementById('view');
    if (window.RRCPlayer) { try { window.RRCPlayer.unmount(); } catch (e) {} }
    view.innerHTML = '<div class="gate-wrap"><div class="gate">' +
      '<div class="g-kicker">完整版模块 · 81 模块课程线</div>' +
      '<h2>' + esc(label) + '</h2>' +
      '<p class="g-sub">本站为免费层：M0 接入全流程、M1 连接建立、M2 系统消息、M3 寻呼与 DRX 四课与全部工具页开放体验</p>' +
      '<ul><li>✓ 本模块含原表全量字段树 / 失败分支全集 / 决策点 / 结课测验</li>' +
      '<li>✓ 条款引用全程 §徽章直连 3GPP 原文短引' + '（2238 锚点），复核台账见站内《复核台账》页 audit.html</li>' +
      '<li>✓ 买断后浏览器本地永久离线可用</li></ul>' +
      '<div class="g-price">完整版（77 个模块）· 内测期全套 <b>¥99</b> / 单模块 <b>¥12</b></div>' +
      '<div class="g-actions"><a class="btn primary" href="README.md#获取完整版">获取完整版</a>' +
      '<a class="btn" href="#ma">← 回免费课继续</a></div></div></div>';
  }
  function render() {
    var id = currentId();
    if (id.indexOf('__paid__') === 0) { renderPaid(id.slice('__paid__'.length)); return; }
    ensure(id).then(function () {
      var mt = BY[id];
      document.title = mt.title + ' · RRC 讲解器';
      var i = ORDER.indexOf(id);
      document.getElementById('crumb').innerHTML = '<a href="index.html">目录</a><span>/</span><span class="cur">M' + mt.num + ' · ' + esc(mt.title) + '</span><span>免费课（' + esc(mt.tech) + '，' + mt.minutes + ' 分钟）</span>';
      var nav = document.getElementById('modnav');
      nav.innerHTML = '';
      if (i > 0) { var p = BY[ORDER[i - 1]]; nav.innerHTML += '<a class="btn sm" href="#' + ORDER[i - 1] + '">← M' + p.num + ' ' + esc(p.title) + '</a>'; }
      if (i < ORDER.length - 1) { var n2 = BY[ORDER[i + 1]]; nav.innerHTML += '<a class="btn sm" href="#' + ORDER[i + 1] + '">M' + n2.num + ' ' + esc(n2.title) + ' →</a>'; }
      var view = document.getElementById('view');
      if (window.RRCPlayer) { try { window.RRCPlayer.unmount(); } catch (e) {} }
      RRC.mountPlayer(view, id, { store: store });
    }).catch(function (e) {
      document.getElementById('view').innerHTML =
        '<div class="gate-wrap"><div class="gate"><h2>课程装载失败</h2><p class="g-sub">' +
        esc(e && e.message ? e.message : e) + '</p></div></div>';
    });
  }
  window.addEventListener('hashchange', render);
  render();
  /* v55.1 R7：spec-quotes 延后装载期间 §徽章点击给轻提示；装载后自带委托接管、本处理器静默 */
  document.addEventListener('click', function (e) {
    if (window.RRC && window.RRC.SpecQuotes) return;
    var b = e.target && e.target.closest ? e.target.closest('.ref-badge') : null;
    if (!b) return;
    var sib = b.nextElementSibling;
    if (sib && sib.classList && sib.classList.contains('ref-pop')) { sib.parentNode.removeChild(sib); return; }
    var d = document.createElement('div');
    d.className = 'ref-pop';
    d.textContent = '短引数据装载中……（首帧后延后装载，稍候片刻即可点开原文短引）';
    b.parentNode.insertBefore(d, b.nextSibling);
  });
  loadFile('spec-quotes.js').then(function () {
    var n;
    while ((n = document.querySelector('.ref-pop'))) {
      if (n.parentNode) n.parentNode.removeChild(n);
    }
  }).catch(function () {});
})();
</script>
