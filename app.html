<script>
(function () {
  var store = RRC.Store();
  var PAID = { m1:'M2 · 系统消息', m2:'M3 · 寻呼与 DRX', m3:'M4 · 测量事件', m4:'M5 · 切换全流程', m5:'M6 · 承载与重配置', m6:'M7 · RRC_INACTIVE', m7:'M8 · AS 安全激活', m8:'M9 · EN-DC 互操作', mi:'M10 · NG 接口课', mx:'M11 · Xn 接口课', mc:'M12 · MAC 随机接入课', mn:'M13 · NAS 注册课', mg:'M14 · 5GC 流程课', mp:'M15 · 用户面协议栈课', ml:'M16 · LTE 对照课', ms:'M17 · 安全线课', mf:'M18 · 物理层课', me:'M19 · LTE NAS 专章' };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function currentId() {
    var h = (location.hash || '#m0').slice(1);
    if (RRC.get(h)) return h;
    if (PAID[h]) return '__paid__' + h;
    return 'm0';
  }
  function renderPaid(id) {
    var label = PAID[id];
    document.title = label + ' · 完整版 · RRC 讲解器';
    document.getElementById('crumb').innerHTML = '<a href="index.html">目录</a><span>/</span><span class="cur">' + esc(label) + '</span><span>完整版模块</span>';
    document.getElementById('modnav').innerHTML = '';
    var view = document.getElementById('view');
    if (window.RRCPlayer) { try { window.RRCPlayer.unmount(); } catch (e) {} }
    view.innerHTML = '<div class="gate-wrap"><div class="gate">' +
      '<div class="g-kicker">完整版模块 · 20 模块课程线</div>' +
      '<h2>' + esc(label) + '</h2>' +
      '<p class="g-sub">本站为免费层：M0 接入全流程、M1 连接建立两课与全部工具页开放体验</p>' +
      '<ul><li>✓ 本模块含原表全量字段树 / 失败分支全集 / 决策点 / 结课测验</li>' +
      '<li>✓ 条款引用全程 §徽章直连 3GPP 原文短引（350+ 锚点），复核台账见仓库 docs/review/</li>' +
      '<li>✓ 买断后浏览器本地永久离线可用</li></ul>' +
      '<div class="g-price">完整版 20 模块 · 内测期全套 <b>¥99</b> / 单模块 <b>¥12</b></div>' +
      '<div class="g-actions"><a class="btn primary" href="README.md#获取完整版">获取完整版</a>' +
      '<a class="btn" href="#ma">← 回免费课继续</a></div></div></div>';
  }
  function render() {
    var id = currentId();
    if (id.indexOf('__paid__') === 0) { renderPaid(id.slice('__paid__'.length)); return; }
    var m = RRC.get(id);
    document.title = m.title + ' · RRC 讲解器';
    var ids = RRC.order(), i = ids.indexOf(id);
    var crumb = document.getElementById('crumb');
    crumb.innerHTML = '<a href="index.html">目录</a><span>/</span><span class="cur">M' + m.num + ' · ' + m.title + '</span><span>' + (m.free ? '免费课' : '付费模块') + '（' + m.tech + '，' + m.minutes + ' 分钟）</span>';
    var nav = document.getElementById('modnav');
    nav.innerHTML = '';
    if (i > 0) { var p = RRC.get(ids[i - 1]); nav.innerHTML += '<a class="btn sm" href="#' + ids[i - 1] + '">← M' + p.num + ' ' + p.title + '</a>'; }
    if (i < ids.length - 1) { var n = RRC.get(ids[i + 1]); nav.innerHTML += '<a class="btn sm" href="#' + ids[i + 1] + '">M' + n.num + ' ' + n.title + ' →</a>'; }
    var view = document.getElementById('view');
    if (window.RRCPlayer) { try { window.RRCPlayer.unmount(); } catch (e) {} }
    if (m.free || store.license().demo) {
      RRC.mountPlayer(view, id, { store: store });
    } else {
      RRC.Gate.render(view, id, store, render);
    }
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
