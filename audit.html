<script src="assets/content/audit-ledger.js"></script>
<script>
(function () {
  'use strict';
  var L = window.RRC_AUDIT_LEDGER;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  var totalAudits = L.mods.reduce(function (s, m) { return s + m.audits.length; }, 0);
  var unresolved = L.mods.reduce(function (s, m) { return s + m.unresolved; }, 0);
  document.getElementById('au-sum').innerHTML =
    '<div class="au-chip"><b>' + L.mods.length + '</b><span>门课全部至少一轮独立审计</span></div>' +
    '<div class="au-chip"><b>' + L.rounds.length + '</b><span>个审计批次（2026-09-28 起）</span></div>' +
    '<div class="au-chip"><b>' + totalAudits + '</b><span>课次·批次审计覆盖合计</span></div>' +
    '<div class="au-chip"><b>' + unresolved + '</b><span>未决事实错误（❌）</span></div>';

  document.getElementById('au-rounds').innerHTML =
    '<tr><th>批次</th><th>日期</th><th>范围</th><th>结果与处置</th></tr>' +
    L.rounds.map(function (r) {
      return '<tr><td class="au-round">' + esc(r.r) + '</td><td>' + esc(r.d) + '</td><td>' + esc(r.scope) + '</td><td>' + esc(r.s) + '</td></tr>';
    }).join('');

  document.getElementById('au-mods').innerHTML =
    '<tr><th>课</th><th>标题</th><th>审计轮次与结果</th><th>未决</th></tr>' +
    L.mods.map(function (m) {
      return '<tr><td class="au-round">M' + m.num + '</td><td><b>' + esc(m.title) + '</b></td>' +
        '<td>' + m.audits.map(function (a) {
          return '<span class="au-round">' + esc(a.r) + '</span>（' + esc(a.d) + '）' + esc(a.s);
        }).join('；') + '</td>' +
        '<td>' + (m.unresolved === 0 ? '0' : '<b style="color:var(--danger)">' + m.unresolved + '</b>') + '</td></tr>';
    }).join('');

  document.getElementById('au-note').textContent = L.note;
})();
</script>
